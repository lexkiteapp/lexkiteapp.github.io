<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Badge Unlocked</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0..1,0" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              cream: '#fff8f3',
              sand: '#fcf2e9',
              sandDark: '#f3e5d7',
              teal: '#136b66',
              tealDark: '#0e4e4a',
              orange: '#f59e0b',
              orangeLedge: '#b45309',
              coral: '#fb923c',
              darkInk: '#1f2937',
              deepBrownInk: '#1c1003',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #fff8f3;
    }
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }
    .candy-btn-orange {
      background-color: #f59e0b;
      box-shadow: 0 4px 0 #b45309;
      color: #1c1003;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .candy-btn-orange:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b45309;
    }
    .candy-btn-secondary {
      background-color: #ffffff;
      border: 2px solid #e2d8d0;
      box-shadow: 0 4px 0 #d9ccc0;
      color: #1f2937;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .candy-btn-secondary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #d9ccc0;
    }
    .candy-card {
      background-color: #ffffff;
      border: 2px solid #f0e4d8;
      box-shadow: 0 6px 0 #e8d9cc;
    }
    .confetti-dot {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
    }
    .sunburst-ray {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 220px;
      margin-left: -110px;
      margin-top: -110px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, rgba(20, 107, 102, 0.08) 55%, rgba(255, 248, 243, 0) 75%);
    }
  </style>
</head>
<body class="bg-[#fff8f3] text-[#1f2937] min-h-screen flex flex-col justify-between items-center p-4 selection:bg-amber-200">

  <!-- Confetti and Soft Sparkles Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <!-- Star sparkles -->
    <svg class="absolute top-10 left-8 w-6 h-6 text-amber-400 opacity-90 animate-pulse" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
    </svg>
    <svg class="absolute top-16 right-10 w-7 h-7 text-emerald-500 opacity-80" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
    </svg>
    <svg class="absolute top-44 left-6 w-5 h-5 text-teal-600 opacity-75" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
    </svg>
    <svg class="absolute top-72 right-8 w-6 h-6 text-amber-500 opacity-85" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
    </svg>
    
    <!-- Floating confetti pills & dots -->
    <div class="confetti-dot top-20 left-1/4 w-3 h-3 bg-rose-400 rotate-12 opacity-80"></div>
    <div class="confetti-dot top-28 right-1/4 w-2.5 h-4 bg-teal-500 rounded-sm rotate-45 opacity-80"></div>
    <div class="confetti-dot top-36 left-12 w-3.5 h-2 bg-amber-400 rounded-sm -rotate-12 opacity-85"></div>
    <div class="confetti-dot top-64 right-14 w-3 h-3 bg-sky-400 opacity-80"></div>
    <div class="confetti-dot top-80 left-10 w-2.5 h-2.5 bg-orange-400 opacity-80"></div>
  </div>

  <!-- Main Container -->
  <main class="w-full max-w-sm flex-1 flex flex-col items-center justify-center relative z-10 my-auto py-4">

    <!-- Top Badge Header Tag -->
    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#fcf2e9] border border-[#f0e4d8] text-xs font-bold text-[#136b66] uppercase tracking-wider mb-2 shadow-xs">
      <span class="material-symbols-rounded text-sm text-amber-500">hotel_class</span>
      <span>Milestone Complete</span>
    </div>

    <!-- Celebration Title -->
    <h1 class="text-3xl font-extrabold tracking-tight text-[#1f2937] text-center mb-6">
      New badge!
    </h1>

    <!-- Medallion Burst Container -->
    <div class="relative w-48 h-48 flex items-center justify-center mb-6">
      <!-- Glow rays -->
      <div class="sunburst-ray"></div>
      
      <!-- Ring of light (dotted / glowing double ring) -->
      <div class="absolute inset-0 rounded-full border-4 border-dashed border-amber-300/80 animate-spin" style="animation-duration: 40s;"></div>
      <div class="absolute inset-2 rounded-full border-2 border-emerald-400/50"></div>
      
      <!-- Big Glossy Rocket Medallion -->
      <div class="relative z-10 w-36 h-36 rounded-full bg-gradient-to-b from-[#19827c] to-[#0e4e4a] p-1.5 shadow-[0_10px_24px_rgba(19,107,102,0.35),0_4px_0_#093835] flex items-center justify-center">
        <!-- Inner gold border ring -->
        <div class="w-full h-full rounded-full bg-gradient-to-b from-[#1e968f] to-[#125c57] border-2 border-amber-300 flex items-center justify-center relative overflow-hidden">
          
          <!-- Gloss highlight curve -->
          <div class="absolute -top-6 -left-6 w-32 h-20 bg-white/20 rounded-full -rotate-12 blur-[1px]"></div>
          
          <!-- Starry backdrop inside medallion -->
          <div class="absolute top-4 left-6 w-1.5 h-1.5 bg-amber-200 rounded-full"></div>
          <div class="absolute bottom-5 right-7 w-2 h-2 bg-amber-200 rounded-full"></div>
          <div class="absolute top-10 right-5 w-1 h-1 bg-white rounded-full"></div>
          
          <!-- Glossy Rocket Illustration (SVG) -->
          <svg class="w-20 h-20 filter drop-shadow-[0_4px_6px_rgba(0,0,0,0.3)] relative z-10 -rotate-12" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Exhaust Flame -->
            <path d="M48 78C48 78 40 85 41 91C42 94 48 93 48 93C48 93 54 94 55 91C56 85 48 78 48 78Z" fill="#F59E0B" />
            <path d="M48 80C48 80 43 85 44 88C45 90 48 89.5 48 89.5C48 89.5 51 90 52 88C53 85 48 80 48 80Z" fill="#FEE08B" />
            
            <!-- Rocket Fin Left -->
            <path d="M35 56L22 68C21.5 73.5 28 73 34 70L36 62L35 56Z" fill="#EF4444" stroke="#B91C1C" stroke-width="2" stroke-linejoin="round" />
            <!-- Rocket Fin Right -->
            <path d="M61 56L74 68C74.5 73.5 68 73 62 70L60 62L61 56Z" fill="#EF4444" stroke="#B91C1C" stroke-width="2" stroke-linejoin="round" />
            
            <!-- Rocket Body -->
            <path d="M48 10C35 24 33 46 36 68C42 71 54 71 60 68C63 46 61 24 48 10Z" fill="url(#rocketBodyGradient)" stroke="#E5E7EB" stroke-width="2.5" />
            
            <!-- Red Nose Cone -->
            <path d="M48 10C42.5 17 38.8 25.5 37 32C43.5 34 52.5 34 59 32C57.2 25.5 53.5 17 48 10Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5" />
            
            <!-- Porthole Outer Ring -->
            <circle cx="48" cy="46" r="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" />
            <!-- Porthole Glass -->
            <circle cx="48" cy="46" r="7.5" fill="#38BDF8" />
            <!-- Porthole Glint -->
            <path d="M44 42.5C45.5 41 48 40.5 50 41" stroke="white" stroke-width="1.5" stroke-linecap="round" />

            <defs>
              <linearGradient id="rocketBodyGradient" x1="34" y1="10" x2="62" y2="70" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFFFFF" />
                <stop offset="0.75" stop-color="#F1F5F9" />
                <stop offset="1" stop-color="#E2E8F0" />
              </linearGradient>
            </defs>
          </svg>
        </div>

        <!-- Tiny star badge pinned on the medallion -->
        <div class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-amber-400 border-2 border-white shadow-[0_2px_4px_rgba(0,0,0,0.15)] flex items-center justify-center text-[#1c1003]">
          <span class="material-symbols-rounded text-lg">bolt</span>
        </div>
      </div>
    </div>

    <!-- Badge Info Card -->
    <div class="candy-card rounded-2xl w-full p-4 text-center mb-5">
      <div class="inline-flex items-center gap-1 text-xs font-extrabold text-amber-700 bg-amber-100/90 px-2.5 py-0.5 rounded-full mb-1.5">
        <span class="material-symbols-rounded text-sm">auto_awesome</span>
        <span>LEVEL 3 UNLOCKED</span>
      </div>
      <h2 class="text-2xl font-extrabold text-[#1f2937] tracking-tight">
        Review machine
      </h2>
      <p class="text-sm font-semibold text-[#4b5563] mt-1 leading-snug">
        Reviewed 50 spaced flashcards today!
      </p>
    </div>

    <!-- Teacher Slot Section with Tiny Speech Bubble -->
    <div class="w-full flex items-center justify-center gap-3 mb-5 px-2">
      <!-- Empty Dashed Teacher Slot (Rounded, ~140x170) -->
      <div class="w-[140px] h-[170px] rounded-2xl border-2 border-dashed border-[#136b66]/40 bg-[#fcf2e9]/50 flex flex-col items-center justify-center text-center p-3 shrink-0 relative">
        <span class="material-symbols-rounded text-[#136b66]/60 text-2xl mb-1">sentiment_satisfied</span>
        <span class="text-xs font-bold text-[#136b66]/80 tracking-wide uppercase">Teacher slot</span>
        <span class="text-[10px] text-[#4b5563] mt-0.5 font-medium">(2D teacher loads here)</span>
      </div>

      <!-- Tiny Happy Bubble Next to Teacher -->
      <div class="relative bg-white border-2 border-[#f0e4d8] rounded-2xl px-3.5 py-2.5 shadow-[0_4px_0_#eae0d4] flex-1 max-w-[170px]">
        <!-- Speech Bubble Tail pointing left toward teacher slot -->
        <div class="absolute -left-2 top-1/2 -translate-y-1/2 w-0 h-0 border-t-[7px] border-t-transparent border-r-[8px] border-r-white border-b-[7px] border-b-transparent z-10"></div>
        <div class="absolute -left-[10px] top-1/2 -translate-y-1/2 w-0 h-0 border-t-[9px] border-t-transparent border-r-[10px] border-r-[#f0e4d8] border-b-[9px] border-b-transparent z-0"></div>

        <div class="flex items-center gap-1 text-amber-500 font-bold text-xs mb-0.5">
          <span class="material-symbols-rounded text-sm">celebration</span>
          <span>Great pace!</span>
        </div>
        <p class="text-xs font-bold text-[#1f2937] leading-tight">
          Super memory streak! Keep it up.
        </p>
      </div>
    </div>

    <!-- Tactile CTA Buttons -->
    <div class="w-full flex flex-col gap-3">
      <!-- Primary 'Continue' CTA (Orange, Tactile Ledge, Dark Ink) -->
      <button type="button" class="candy-btn-orange w-full h-14 rounded-2xl font-extrabold text-base flex items-center justify-center gap-2 cursor-pointer">
        <span>Continue</span>
        <span class="material-symbols-rounded text-xl">arrow_forward</span>
      </button>

      <!-- Secondary 'Share' CTA (Tactile Ledge, Clear Contrast) -->
      <button type="button" class="candy-btn-secondary w-full h-12 rounded-2xl font-bold text-sm flex items-center justify-center gap-1.5 cursor-pointer">
        <span class="material-symbols-rounded text-lg text-[#136b66]">ios_share</span>
        <span>Share</span>
      </button>
    </div>

  </main>

  <!-- Bottom subtle hint -->
  <footer class="w-full text-center py-2 text-[11px] font-semibold text-[#6b7280]">
    +30 XP earned towards Band 7.5 target
  </footer>

</body>
</html>
