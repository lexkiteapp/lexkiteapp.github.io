<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lexkite — Sign out of Lexkite?</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-background": "#d8e5e9",
            "inverse-primary": "#006a64",
            "surface-container-low": "#121d20",
            "surface": "#061215",
            "surface-container-high": "#202c2f",
            "primary-container": "#2ba39a",
            "outline": "#879391",
            "on-surface-variant": "#A5C3C8",
            "primary": "#6bd8ce",
            "outline-variant": "#3d4947",
            "surface-container": "#162125"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Plus Jakarta Sans", "sans-serif"],
            label: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #061215;
      color: #d8e5e9;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .filled-symbol {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-[#061215] text-on-surface antialiased min-h-screen">
<!-- Native mobile phone container: 390px edge-to-edge layout, zero simulated frame -->
<div class="w-full max-w-[390px] min-h-screen mx-auto bg-[#061215] flex flex-col justify-end p-4 pb-6 sm:pb-8 relative">
<!-- Modal Dialog Card (Tactile Dark Slate Surface) -->
<section aria-labelledby="dialog-title" class="w-full bg-[#0d1e22] border-2 border-[#22454d] rounded-3xl shadow-[0_8px_0_0_#040a0c] overflow-hidden flex flex-col p-5 relative">
<!-- Header row: Logout Badge & Accessible Close Button (No PRO badge) -->
<div class="flex items-center justify-between mb-4">
<!-- Exit Icon in tactile rounded-2xl dark slate badge -->
<div class="w-11 h-11 rounded-2xl bg-[#102227] border-2 border-[#22454d] flex items-center justify-center text-[#6bd8ce] shadow-[0_2px_0_0_#040a0c]">
<span class="material-symbols-outlined text-2xl font-bold">logout</span>
</div>
<!-- Circular tactile close button (min 44x44px target) -->
<button aria-label="Close dialog" class="w-11 h-11 rounded-full bg-[#102227] border-2 border-[#22454d] text-[#A5C3C8] hover:text-white hover:bg-[#162d33] active:translate-y-0.5 transition-all flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-xl">close</span>
</button>
</div>
<!-- Title & Readable Body Description -->
<div class="space-y-2 mb-4">
<h1 class="text-2xl font-black text-[#FFFFFF] tracking-tight leading-tight" id="dialog-title">
          Sign out of Lexkite?
        </h1>
<p class="text-[14px] font-medium text-[#A5C3C8] leading-relaxed">
          Your progress is saved to your account. On this device you will see a fresh start until you sign in again.
        </p>
</div>
<!-- Cloud Backup Status Card -->
<div class="bg-[#0c2429] border-2 border-[#1a4951] rounded-2xl p-3.5 mb-4 shadow-[0_3px_0_0_#040a0c] flex items-center space-x-3">
<!-- Mint circle badge with checkmark icon -->
<div class="w-8 h-8 rounded-full bg-[#6bd8ce] flex items-center justify-center text-[#061215] flex-shrink-0">
<span class="material-symbols-outlined text-lg font-black">check</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-[13.5px] font-bold text-[#EDF6F7] leading-snug">
            Cloud backup active: 45–day streak &amp; 1,240 words synced
          </p>
</div>
</div>
<!-- Empty Dashed Teacher Slot (Strictly NO text label, no characters) -->
<div class="teacher-slot w-full min-h-[56px] py-3 px-3 rounded-2xl border-2 border-dashed border-[#24525a] bg-[#09171b] mb-5 flex items-center justify-center text-[#2ba39a]/60">
<span class="material-symbols-outlined text-2xl">school</span>
</div>
<!-- Action Buttons -->
<div class="space-y-3">
<!-- Primary Action: Sunny Amber Tactile Button with 3D drop ledge -->
<button class="w-full min-h-[48px] bg-[#F59E0B] text-[#1C1003] font-black text-[15px] rounded-2xl border-2 border-[#fbb337] shadow-[0_4px_0_0_#9a3412] hover:bg-[#fbbf24] active:translate-y-1 active:shadow-[0_1px_0_0_#9a3412] transition-transform flex items-center justify-center space-x-1.5" type="button">
<span>Sign out</span>
<span class="text-base font-bold">→</span>
</button>
<!-- Secondary Action: Tactile Dark Slate Cancel Button -->
<button class="w-full min-h-[48px] bg-[#112328] text-[#DDEBEB] font-bold text-[15px] rounded-2xl border-2 border-[#24474e] shadow-[0_3px_0_0_#061013] hover:bg-[#162d33] active:translate-y-1 active:shadow-[0_1px_0_0_#061013] transition-transform flex items-center justify-center" type="button">
          Cancel
        </button>
</div>
</section>
</div>
</body></html>
