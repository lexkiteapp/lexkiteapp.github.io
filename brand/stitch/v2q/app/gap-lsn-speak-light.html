<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lexkite Lesson Drill - Say it (Bright Day Mobile)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            page: '#FAF5EE',
            card: '#FFFFFF',
            cardBorder: '#E8DED1',
            cardLedge: '#DFD2C2',
            primaryTeal: '#136A63',
            tealSoft: '#E6F3F1',
            orangeBtn: '#FA9200',
            orangeLedge: '#D97300',
            darkInk: '#1A0D00',
            subText: '#5A6866',
            dangerRed: '#D9383A',
          }
        }
      }
    };
  </script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF5EE;
      color: #192724;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .tactile-card {
      background-color: #FFFFFF;
      border: 2px solid #E8DED1;
      border-radius: 24px;
      box-shadow: 0 4px 0 0 #DFD2C2;
    }
    .tactile-btn {
      background-color: #FA9200;
      border: 2px solid #D97300;
      box-shadow: 0 4px 0 0 #D97300;
      color: #1A0D00;
      font-weight: 800;
      transition: all 0.1s ease;
    }
    .tactile-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #D97300;
    }
    .teacher-slot {
      width: 72px;
      height: 80px;
      border-radius: 20px;
      border: 2px dashed #93C5BE;
      background-color: #EBF5F3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="bg-page min-h-screen flex flex-col justify-between antialiased select-none">
<!-- Main Scrollable Area -->
<main class="w-full px-4 pt-3 pb-6 flex-1 flex flex-col justify-between">
<!-- Top Bar / Progress Header -->
<div>
<div class="flex items-center justify-between gap-3 mb-4">
<!-- Close Button -->
<button aria-label="Close" class="w-10 h-10 rounded-full border-2 border-cardBorder bg-card flex items-center justify-center text-[#5A6866] hover:bg-slate-50 active:scale-95 transition-all shadow-[0_2px_0_0_#DFD2C2]" type="button">
<span class="material-symbols-outlined text-[20px] font-bold">close</span>
</button>
<!-- Progress Bar -->
<div class="flex-1 h-3.5 bg-[#E8DED1] rounded-full overflow-hidden p-0.5">
<div class="h-full bg-primaryTeal rounded-full" style="width: 48%;"></div>
</div>
<!-- Heart Counter -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border-2 border-cardBorder bg-card text-[#D9383A] font-extrabold text-sm shadow-[0_2px_0_0_#DFD2C2]"><svg class="w-4 h-4 text-[#ba1a1a] fill-current" viewbox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg><span class="text-[#192724] font-extrabold text-sm">5</span></div>
</div>
<!-- Mode & Subtitle Row -->
<div class="flex items-center justify-between mb-4 px-1">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border border-cardBorder bg-card shadow-sm text-xs font-bold text-[#192724]">
<span class="material-symbols-outlined text-[15px] text-primaryTeal">mic</span>
<span>SAY IT</span>
</div>
<div class="text-xs font-bold text-subText tracking-wide uppercase">
          IELTS Speaking Part 1
        </div>
</div>
<!-- Coach Prompt Block (Empty Dashed Teacher Slot + Speech Bubble) -->
<div class="flex items-start gap-3 mb-4">
<!-- Empty Teacher Slot: soft teal-tinted rounded rectangle with thin dashed border, class teacher-slot -->
<div class="teacher-slot">
<span class="material-symbols-outlined text-primaryTeal text-2xl">school</span>
<span class="text-[11px] font-extrabold text-primaryTeal mt-0.5 tracking-wide uppercase">Coach</span>
</div>
<!-- Speech Bubble -->
<div class="relative flex-1 bg-card border-2 border-cardBorder rounded-[22px] p-3.5 shadow-[0_3px_0_0_#DFD2C2] before:content-[''] before:absolute before:top-5 before:-left-2.5 before:w-0 before:h-0 before:border-y-[8px] before:border-y-transparent before:border-r-[10px] before:border-r-cardBorder after:content-[''] after:absolute after:top-5 after:-left-2 after:w-0 after:h-0 after:border-y-[7px] after:border-y-transparent after:border-r-[9px] after:border-r-card"><div class="flex items-center gap-1.5 mb-1"><span class="w-2 h-2 rounded-full bg-primaryTeal"></span><span class="text-xs font-extrabold text-[#111827] tracking-wider uppercase">CARLOS • TEACHER</span></div><p class="text-[15px] font-bold text-[#111827] leading-snug">“Nice and slow – stress <span class="text-primaryTeal underline decoration-2 underline-offset-2">HAND</span>.”</p></div>
</div>
<!-- Natural Idiom Prompt Card -->
<div class="tactile-card p-4 mb-4">
<div class="flex items-center justify-between mb-2">
<span class="text-[11px] font-extrabold text-subText tracking-wider uppercase">NATURAL IDIOM</span>
<button aria-label="Listen audio" class="w-9 h-9 rounded-full bg-primaryTeal text-white flex items-center justify-center shadow-[0_3px_0_0_#0C4843] active:translate-y-0.5 transition-all" type="button">
<span class="material-symbols-outlined text-[19px]">volume_up</span>
</button>
</div>
<!-- Target Phrase -->
<div class="text-[21px] font-extrabold text-[#192724] tracking-tight leading-snug mb-2.5">
          “Could you give me a <span class="inline-block px-2.5 py-0.5 rounded-full border-2 border-primaryTeal bg-[#EBF5F3] text-primaryTeal font-extrabold text-[19px]">hand</span> with this?”
        </div>
<!-- Phonetic Breakdown -->
<div class="inline-block px-3 py-1 rounded-xl bg-[#FAF5EE] border border-cardBorder text-[13px] font-semibold text-subText font-mono mb-3">
          /kʊd juː ɡɪv miː ə <strong class="text-primaryTeal">hænd</strong> wɪð ðɪs/
        </div>
<div class="border-t border-[#F0E6D8] pt-2.5 flex items-center justify-between">
<div class="flex items-center gap-2 text-xs font-bold text-[#1f2937]"><svg class="w-4 h-4 text-[#8c5000] fill-current flex-shrink-0" viewbox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-1.3l-.85-.6C7.8 13.16 7 11.18 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 2.18-.8 4.16-2.15 5.1z"></path></svg><span class="leading-none">Meaning: Help me with this</span></div>
<!-- Band 7.5+ chip removed as explicitly requested -->
</div>
</div>
<!-- Speech Input Interaction Card -->
<div class="tactile-card p-5 flex flex-col items-center justify-center text-center">
<!-- Ready Pill Badge -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-tealSoft border border-[#93C5BE] text-primaryTeal text-xs font-bold mb-4">
<span class="flex gap-1 items-center">
<span class="w-1.5 h-1.5 rounded-full bg-primaryTeal"></span>
<span class="w-1.5 h-1.5 rounded-full bg-primaryTeal"></span>
<span class="w-1.5 h-1.5 rounded-full bg-primaryTeal"></span>
</span>
<span class="ml-1">Ready</span>
</div>
<!-- Big Mic Button with Tactile Rings -->
<div class="relative w-24 h-24 flex items-center justify-center mb-3">
<div class="absolute inset-0 rounded-full bg-[#EFE6D9] opacity-70"></div>
<div class="absolute inset-2 rounded-full bg-[#FAF5EE] border-2 border-[#E0D3C1]"></div>
<button aria-label="Hold to speak microphone" class="relative z-10 w-16 h-16 rounded-full bg-primaryTeal text-white flex items-center justify-center shadow-[0_4px_0_0_#0C4843] active:translate-y-1 active:shadow-[0_1px_0_0_#0C4843] transition-all" type="button">
<span class="material-symbols-outlined text-[32px]">mic</span>
</button>
</div>
<!-- Voice Instructions -->
<h3 class="text-lg font-extrabold text-[#192724] mb-1">
          Hold to speak
        </h3>
<p class="text-xs font-medium text-subText mb-3">
          Speak clearly near your phone's microphone
        </p>
<!-- Can't Speak Now Action -->
<button class="text-xs font-bold text-primaryTeal hover:underline py-1" type="button">
          Can't speak now
        </button>
</div>
</div>
<!-- Bottom Action CTA -->
<div class="pt-4">
<button class="tactile-btn w-full py-4 rounded-2xl flex items-center justify-center gap-2 text-base text-darkInk tracking-wide" type="button">
<span>Check</span>
<span class="material-symbols-outlined text-[20px] font-extrabold">check</span>
</button>
</div>
</main>
</body>
</html>
