<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite IELTS Sound Lab</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#051013",
            "on-primary-fixed": "#00201e",
            "on-background": "#d8e5e9",
            "surface-tint": "#6bd8ce",
            "surface": "#091518",
            "error": "#ffb4ab",
            "outline": "#879391",
            "surface-dim": "#091518",
            "outline-variant": "#3d4947",
            "on-secondary-container": "#ffa493",
            "inverse-on-surface": "#263236",
            "surface-bright": "#2f3b3e",
            "primary-container": "#2ba39a",
            "on-secondary": "#660800",
            "on-tertiary-fixed": "#261a00",
            "inverse-surface": "#d8e5e9",
            "background": "#091518",
            "primary": "#6bd8ce",
            "on-tertiary-container": "#392900",
            "tertiary": "#f4bf40",
            "on-secondary-fixed-variant": "#900f00",
            "tertiary-container": "#ba8b00",
            "surface-variant": "#2b373a",
            "surface-container-high": "#202c2f",
            "tertiary-fixed-dim": "#f4bf40",
            "surface-container-highest": "#2b373a",
            "primary-fixed-dim": "#6bd8ce",
            "on-error": "#690005",
            "primary-fixed": "#88f5ea",
            "on-tertiary": "#402e00",
            "inverse-primary": "#006a64",
            "surface-container": "#162125",
            "on-primary": "#003733",
            "error-container": "#93000a",
            "on-primary-container": "#00322e",
            "secondary": "#ffb4a6",
            "on-error-container": "#ffdad6",
            "secondary-fixed": "#ffdad3",
            "secondary-fixed-dim": "#ffb4a6",
            "secondary-container": "#981201",
            "on-tertiary-fixed-variant": "#5b4300",
            "on-secondary-fixed": "#3f0300",
            "surface-container-low": "#121d20",
            "on-primary-fixed-variant": "#00504b",
            "on-surface-variant": "#bcc9c7",
            "tertiary-fixed": "#ffdf9e",
            "on-surface": "#d8e5e9"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans"],
            display: ["Plus Jakarta Sans"],
            body: ["Plus Jakarta Sans"],
            label: ["Plus Jakarta Sans"]
          }
        }
      }
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col justify-between selection:bg-primary selection:text-on-primary antialiased m-0 p-0">
<main class="w-full max-w-[390px] mx-auto min-h-screen flex flex-col justify-between px-4 pt-3 pb-6 relative">
<!-- Top Progress & Health Bar -->
<header class="w-full flex items-center justify-between gap-3 pt-1 pb-3">
<!-- Tactile Close Button -->
<button aria-label="Close" class="w-10 h-10 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center text-on-surface shadow-[0_3px_0_theme(colors.surface-container-lowest)] active:translate-y-[2px] active:shadow-[0_1px_0_theme(colors.surface-container-lowest)] transition-all" type="button">
<span class="material-symbols-outlined text-[20px] font-bold">close</span>
</button>
<!-- Horizontal Progress Bar (35% complete) -->
<div class="flex-1 h-3.5 bg-surface-container-lowest rounded-full p-[2px] border border-outline-variant/60 flex items-center">
<div class="h-full bg-primary rounded-full transition-all duration-300 shadow-[inset_0_1px_1px_rgba(255,255,255,0.4)]" style="width: 35%;"></div>
</div>
<!-- Lives Pill -->
<div class="h-10 px-3 rounded-full bg-surface-container border border-outline-variant flex items-center gap-1.5 shadow-[0_3px_0_theme(colors.surface-container-lowest)]">
<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="text-on-surface font-headline font-extrabold text-sm tracking-tight">5</span>
</div>
</header>
<!-- Main Content Flow -->
<div class="flex flex-col gap-3.5 flex-1">
<!-- Eyebrow & Headline Header -->
<section class="flex flex-col gap-1">
<div class="flex items-center justify-between">
<div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-surface-container-high border border-primary/30">
<span class="material-symbols-outlined text-primary text-[14px]">volume_up</span>
<span class="text-[11px] font-headline font-extrabold text-primary tracking-wider">IELTS SOUND LAB</span>
</div>
<span class="text-[11px] font-headline font-extrabold text-on-surface-variant tracking-wider">PHONEME DRILL</span>
</div>
<h1 class="text-2xl font-headline font-extrabold text-white tracking-tight leading-tight mt-0.5">
          Tap what you hear
        </h1>
<p class="text-sm font-body text-on-surface-variant leading-snug">
          Distinguish minimal vowel pairs under exam speed
        </p>
</section>
<!-- Teacher Slot & Speech Bubble -->
<section class="flex items-stretch gap-2.5">
<!-- Strictly NO human avatar illustration: dashed slot as mandated -->
<div class="teacher-slot w-[72px] shrink-0 rounded-2xl border-2 border-dashed border-primary/40 bg-surface-container-low flex flex-col items-center justify-center p-1.5">
<span class="material-symbols-outlined text-primary text-[28px]">school</span>
<span class="text-[10px] font-headline font-extrabold text-primary tracking-wider mt-0.5">TEACHER</span>
</div>
<!-- Speech Bubble Card -->
<div class="flex-1 rounded-2xl bg-surface-container border border-outline-variant p-3 shadow-[0_4px_0_theme(colors.surface-container-lowest)] flex flex-col justify-center">
<div class="flex items-center gap-1.5 mb-1">
<span class="text-xs font-headline font-extrabold text-on-surface tracking-wide">TEACHER AMA</span>
<span class="text-[10px] font-headline font-extrabold bg-tertiary-container text-tertiary-fixed px-1.5 py-0.2 rounded tracking-wider">IELTS COACH</span>
</div>
<p class="text-[13px] font-body text-on-surface leading-snug">
            “Listen for the vowel sound in the middle.”
          </p>
</div>
</section>
<!-- Audio Player Module with 3D tactile ledge -->
<section class="rounded-2xl bg-surface-container border-2 border-outline-variant p-3.5 shadow-[0_5px_0_theme(colors.surface-container-lowest)] flex flex-col gap-3">
<!-- Glowing Equalizer Soundwave -->
<div class="w-full h-14 bg-surface-container-lowest rounded-xl flex items-center justify-center gap-1.5 px-3 border border-outline-variant/40">
<span class="w-1.5 h-3 bg-primary/40 rounded-full"></span>
<span class="w-1.5 h-6 bg-primary/70 rounded-full"></span>
<span class="w-1.5 h-9 bg-primary rounded-full animate-pulse"></span>
<span class="w-1.5 h-12 bg-primary rounded-full"></span>
<span class="w-1.5 h-8 bg-primary rounded-full"></span>
<span class="w-1.5 h-10 bg-primary rounded-full animate-pulse"></span>
<span class="w-1.5 h-5 bg-primary/70 rounded-full"></span>
<span class="w-1.5 h-11 bg-primary rounded-full"></span>
<span class="w-1.5 h-7 bg-primary rounded-full"></span>
<span class="w-1.5 h-4 bg-primary/50 rounded-full"></span>
<span class="w-1.5 h-8 bg-primary rounded-full"></span>
<span class="w-1.5 h-3 bg-primary/40 rounded-full"></span>
</div>
<!-- Controls Row -->
<div class="flex items-center gap-2.5">
<!-- Rich Teal Listen Button -->
<button class="flex-1 h-12 rounded-xl bg-primary-container text-on-primary-fixed border border-primary flex items-center justify-center gap-2 shadow-[0_4px_0_theme(colors.on-primary-container)] active:translate-y-[2px] active:shadow-[0_2px_0_theme(colors.on-primary-container)] transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">volume_up</span>
<span class="font-headline font-extrabold text-sm tracking-wide">LISTEN</span>
</button>
<!-- Speed Toggle Button -->
<button class="h-12 px-3.5 rounded-xl bg-surface-container-high border border-outline-variant text-on-surface flex items-center justify-center gap-1.5 shadow-[0_4px_0_theme(colors.surface-container-lowest)] active:translate-y-[2px] active:shadow-[0_2px_0_theme(colors.surface-container-lowest)] transition-all" type="button">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">schedule</span>
<span class="font-headline font-extrabold text-sm">0.75x</span>
</button>
</div>
</section>
<!-- 2x2 Phoneme Choice Grid -->
<section class="grid grid-cols-2 gap-2.5 pt-0.5">
<!-- Option 1: though -->
<button class="min-h-[72px] p-3 rounded-2xl bg-surface-container border-2 border-outline-variant flex flex-col justify-center items-start text-left shadow-[0_4px_0_theme(colors.surface-container-lowest)] hover:bg-surface-container-high active:translate-y-[2px] active:shadow-[0_2px_0_theme(colors.surface-container-lowest)] transition-all" type="button">
<div class="flex items-center justify-between w-full">
<span class="text-xs font-headline font-extrabold text-on-surface-variant">A</span>
</div>
<span class="font-headline font-bold text-lg text-white leading-tight">though</span>
<span class="text-xs font-body text-on-surface-variant">/ðəʊ/</span>
</button>
<!-- Option 2: thought (SELECTED STATE) -->
<button class="min-h-[72px] p-3 rounded-2xl bg-primary-container/20 border-2 border-primary flex flex-col justify-center items-start text-left relative shadow-[0_4px_0_theme(colors.on-primary-container)] active:translate-y-[2px] transition-all" type="button">
<div class="absolute top-2.5 right-2.5 w-5 h-5 rounded-full bg-primary text-on-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] font-extrabold">check</span>
</div>
<span class="text-xs font-headline font-extrabold text-primary">B</span>
<span class="font-headline font-bold text-lg text-white leading-tight">thought</span>
<span class="text-xs font-body text-primary-fixed">/θɔːt/</span>
</button>
<!-- Option 3: through -->
<button class="min-h-[72px] p-3 rounded-2xl bg-surface-container border-2 border-outline-variant flex flex-col justify-center items-start text-left shadow-[0_4px_0_theme(colors.surface-container-lowest)] hover:bg-surface-container-high active:translate-y-[2px] active:shadow-[0_2px_0_theme(colors.surface-container-lowest)] transition-all" type="button">
<div class="flex items-center justify-between w-full">
<span class="text-xs font-headline font-extrabold text-on-surface-variant">C</span>
</div>
<span class="font-headline font-bold text-lg text-white leading-tight">through</span>
<span class="text-xs font-body text-on-surface-variant">/θruː/</span>
</button>
<!-- Option 4: tough -->
<button class="min-h-[72px] p-3 rounded-2xl bg-surface-container border-2 border-outline-variant flex flex-col justify-center items-start text-left shadow-[0_4px_0_theme(colors.surface-container-lowest)] hover:bg-surface-container-high active:translate-y-[2px] active:shadow-[0_2px_0_theme(colors.surface-container-lowest)] transition-all" type="button">
<div class="flex items-center justify-between w-full">
<span class="text-xs font-headline font-extrabold text-on-surface-variant">D</span>
</div>
<span class="font-headline font-bold text-lg text-white leading-tight">tough</span>
<span class="text-xs font-body text-on-surface-variant">/tʌf/</span>
</button>
</section>
</div>
<!-- Pinned Bottom Action Button -->
<footer class="w-full pt-4 mt-auto">
<button class="w-full h-14 rounded-2xl bg-tertiary border-t border-white/20 text-on-tertiary-fixed font-headline font-extrabold text-base tracking-wide flex items-center justify-center gap-1.5 shadow-[0_6px_0_theme(colors.secondary-container)] active:translate-y-[3px] active:shadow-[0_3px_0_theme(colors.secondary-container)] transition-all" type="button">
<span>CHECK</span>
<span class="material-symbols-outlined text-[20px] font-black">check</span>
</button>
</footer>
</main>
</body></html>
