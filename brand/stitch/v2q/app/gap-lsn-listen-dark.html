<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lexkite — Listen &amp; Choose Drill (Tactile Night Mobile)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'page-bg': '#0B171A',
        'card-bg': '#172427',
        'card-border': '#283B40',
        'card-ledge': '#101B1D',
        'raised': '#1E2F33',
        'primary-text': '#EEF6F7',
        'secondary-text': '#A9BFC1',
        'brand-teal': '#2BA39A',
        'teal-glow': '#38D1C5',
        'teal-dark': '#135652',
        'coral-cta': '#F2553B',
        'amber-cta': '#FFB054',
        'cta-ledge': '#8E2816',
        'cta-ink': '#1B0B04',
      },
      fontFamily: {
        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
        mono: ['"JetBrains Mono"', 'monospace'],
      }
    }
  }
}
</script>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: #0B171A;
    color: #EEF6F7;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .screen-container {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    background-color: #0B171A;
    display: flex;
    flex-direction: column;
    padding: 16px 20px 24px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Tactile button mechanics */
  .tactile-btn {
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .tactile-btn:active {
    transform: translateY(3px) !important;
  }

  /* Audio listen button */
  .listen-pulse {
    box-shadow: 0 6px 0 #135652, 0 10px 20px rgba(43, 163, 154, 0.25);
  }
  .listen-pulse:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #135652, 0 4px 10px rgba(43, 163, 154, 0.2);
  }

  /* Tactile cards with physical bottom ledge */
  .tactile-card {
    border: 2px solid #283B40;
    box-shadow: 0 4px 0 #101B1D;
    transition: all 0.1s ease;
  }
  .tactile-card:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #101B1D;
  }

  /* Selected answer card state */
  .answer-selected {
    border: 2px solid #38D1C5 !important;
    background-color: #123235 !important;
    box-shadow: 0 4px 0 #0C2426, 0 0 16px rgba(56, 209, 197, 0.15) !important;
  }

  /* Dashed teacher slot */
  .teacher-slot {
    border: 2px dashed #2E6061;
    background: rgba(43, 163, 154, 0.08);
  }

  /* Primary CTA Button */
  .primary-cta {
    background: linear-gradient(180deg, #FFB054 0%, #F2553B 100%);
    box-shadow: 0 5px 0 #8E2816, 0 8px 18px rgba(242, 85, 59, 0.35);
  }
  .primary-cta:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #8E2816, 0 4px 10px rgba(242, 85, 59, 0.25);
  }
</style>
</head>
<body style="margin: 0; padding: 0; background-color: #0B171A; color: #EEF6F7; min-height: 100vh; width: 100%; display: block;">
<div class="screen-container" style="max-width: 390px; width: 100%; margin: 0 auto; min-height: 100vh; padding: 16px 16px 24px 16px; display: flex; flex-direction: column;">
<!-- Top App Bar / Progress Header -->
<header class="flex items-center justify-between w-full pt-1 pb-4 gap-3">
<!-- Close Button -->
<button aria-label="Close Drill" class="w-10 h-10 rounded-full bg-card-bg border border-card-border flex items-center justify-center text-secondary-text hover:text-primary-text tactile-btn shadow-[0_2px_0_#101B1D]">
<span class="material-symbols-Rounded text-[22px]">close</span>
</button>
<!-- Progress Track -->
<div class="flex-1 h-3.5 bg-card-bg rounded-full p-0.5 border border-card-border overflow-hidden">
<div class="h-full bg-brand-teal rounded-full transition-all duration-300 shadow-[inset_0_1px_0_rgba(255,255,255,0.3)]" style="width: 38%;"></div>
</div>
<!-- Heart Count Pill -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-card-bg border border-card-border shadow-[0_2px_0_#101B1D]">
<span class="text-coral-cta text-[18px] leading-none">❤️</span>
<span class="font-extrabold text-[15px] text-primary-text leading-none">5</span>
</div>
</header>
<!-- Drill Category Tag -->
<div class="mt-2 mb-1.5 flex items-center">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[rgba(43,163,154,0.12)] border border-[#235858]">
<span class="w-2 h-2 rounded-full bg-teal-glow"></span>
<span class="text-[12px] font-extrabold tracking-wide uppercase text-teal-glow">IELTS SOUND LAB</span>
</div>
</div>
<!-- Headline -->
<h1 class="text-[28px] font-extrabold text-primary-text tracking-tight mb-5 mt-1">
    Tap what you hear
  </h1>
<!-- Audio Listen Controls -->
<div class="flex items-center justify-center gap-4 my-2">
<!-- Big Tactile Audio Button -->
<button class="w-[88px] h-[88px] rounded-full bg-gradient-to-b from-[#34BBB0] to-[#208A83] text-primary-text flex flex-col items-center justify-center listen-pulse tactile-btn cursor-pointer">
<span class="material-symbols-Rounded text-[36px] leading-none mb-0.5">volume_up</span>
<span class="text-[11px] font-extrabold tracking-wider uppercase">LISTEN</span>
</button>
<!-- Slow 0.75x Button -->
<button class="h-[46px] px-4 rounded-2xl bg-card-bg border-2 border-card-border flex items-center gap-1.5 text-primary-text tactile-btn cursor-pointer shadow-[0_4px_0_#101B1D]">
<span class="material-symbols-Rounded text-[20px] text-teal-glow">speed</span>
<span class="font-bold text-[14px]">0.75×</span>
</button>
</div>
<!-- Teacher Coach Area -->
<div class="flex items-center gap-3 my-5">
<!-- Empty Dashed Teacher Slot -->
<div class="teacher-slot w-[64px] h-[72px] rounded-2xl flex flex-col items-center justify-center flex-shrink-0">
<span class="material-symbols-Rounded text-[26px] text-teal-glow opacity-80 mb-0.5">school</span>
<span class="text-[10px] font-extrabold tracking-wider text-teal-glow uppercase opacity-90">TEACHER</span>
</div>
<!-- Coach Quote Balloon -->
<div class="flex-1 bg-card-bg border-2 border-card-border rounded-2xl p-3 shadow-[0_3px_0_#101B1D] relative">
<div class="flex items-center justify-between mb-1">
<span class="text-[11px] font-extrabold text-teal-glow tracking-wider uppercase">TEACHER AMA</span>
<span class="text-[11px] font-semibold text-secondary-text">IELTS Coach</span>
</div>
<p class="text-[14px] font-semibold text-primary-text leading-snug m-0">
        “Listen for the vowel sound in the middle.”
      </p>
</div>
</div>
<!-- 2x2 Answer Grid -->
<div class="grid grid-cols-2 gap-3 my-2">
<!-- Option A: though -->
<button class="tactile-card bg-card-bg rounded-2xl p-4 flex flex-col items-start justify-center cursor-pointer text-left">
<span class="text-[20px] font-extrabold text-primary-text tracking-tight mb-0.5">though</span>
<span class="text-[13px] font-mono text-secondary-text">/ðəʊ/</span>
</button>
<!-- Option B: thought (Selected State) -->
<button class="tactile-card answer-selected rounded-2xl p-4 flex flex-col items-start justify-center cursor-pointer text-left relative">
<span class="text-[20px] font-extrabold text-teal-glow tracking-tight mb-0.5">thought</span>
<span class="text-[13px] font-mono text-[#8DEAE2]">/θɔːt/</span>
<!-- Selected Check Badge -->
<div class="absolute top-3 right-3 w-5 h-5 rounded-full bg-teal-glow flex items-center justify-center text-[#081518]">
<span class="material-symbols-Rounded text-[15px] font-extrabold">check</span>
</div>
</button>
<!-- Option C: through -->
<button class="tactile-card bg-card-bg rounded-2xl p-4 flex flex-col items-start justify-center cursor-pointer text-left">
<span class="text-[20px] font-extrabold text-primary-text tracking-tight mb-0.5">through</span>
<span class="text-[13px] font-mono text-secondary-text">/θruː/</span>
</button>
<!-- Option D: tough -->
<button class="tactile-card bg-card-bg rounded-2xl p-4 flex flex-col items-start justify-center cursor-pointer text-left">
<span class="text-[20px] font-extrabold text-primary-text tracking-tight mb-0.5">tough</span>
<span class="text-[13px] font-mono text-secondary-text">/tʌf/</span>
</button>
</div>
<!-- Spacer to push CTA to bottom -->
<div class="flex-1 min-h-[24px]"></div>
<!-- Primary Bottom CTA -->
<div class="w-full pt-3 pb-1">
<button class="primary-cta w-full h-[56px] rounded-2xl flex items-center justify-center text-cta-ink font-extrabold text-[18px] tracking-wide uppercase tactile-btn cursor-pointer">
      CHECK
    </button>
</div>
</div>
</body>
</html>
