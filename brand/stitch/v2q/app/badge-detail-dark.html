      }
      50% {
        opacity: 0.85;
        transform: scale(1.06);
      }
    }

    }

<body class="bg-[#091518] text-[#d8e5e9] antialiased min-h-screen flex justify-center selection:bg-primary selection:text-[#003733]">
<!-- Mobile Viewport Container -->
<div class="relative w-full max-w-md min-h-screen bg-[#091518] overflow-hidden flex flex-col justify-between shadow-2xl">

<div class="w-full bg-[#0e1c20] rounded-t-3xl border-t-2 border-x-2 border-[#213f47] shadow-[0_-12px_40px_rgba(0,0,0,0.6)] px-6 pt-3 pb-8 flex flex-col items-center text-center">

<!-- Jewel Showcase Area with Ambient Glow -->
<div class="relative w-48 h-48 flex items-center justify-center my-2">

<div class="absolute inset-2 rounded-full bg-gradient-to-tr from-[#f59e0b]/25 via-[#2ba39a]/40 to-[#6bd8ce]/30 blur-2xl animate-pulse-glow"></div>

<div class="relative z-10 w-36 h-36 animate-float flex items-center justify-center">

<div class="absolute inset-0 rounded-3xl rotate-45 bg-gradient-to-b from-[#fde68a] via-[#f59e0b] to-[#b45309] p-1 shadow-[0_6px_0_#78350f]">

<div class="w-full h-full rounded-[1.3rem] bg-gradient-to-tr from-[#094e48] via-[#106b63] to-[#14857b] flex items-center justify-center border border-[#88f5ea]/40 overflow-hidden relative shadow-inner">

<div class="absolute -top-6 -left-6 w-20 h-20 bg-white/20 rounded-full blur-sm"></div>

<!-- Prismatic Micro-Reflections -->
<div class="absolute bottom-2 right-2 w-5 h-5 bg-[#ffffff]/30 rounded-full blur-[1px]"></div>
</div>
</div>

<div class="absolute bottom-3 -left-1 z-20 flex items-center justify-center text-[#fef08a] drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]">
