<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lexkite Lesson Drill - Say it (Bright Day Mobile)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            page: '#FAF5EE',
            card: '#FFFFFF',
            cardBorder: '#E8DED1',
            cardLedge: '#DFD2C2',
            primaryTeal: '#136A63',
            tealSoft: '#E6F3F1',
            orangeBtn: '#FA9200',
            orangeLedge: '#D97300',
            darkInk: '#1A0D00',
            subText: '#5A6866',
            dangerRed: '#D9383A',
          }
        }
      }
    };
  </script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF5EE;
      color: #192724;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .tactile-card {
      background-color: #FFFFFF;
      border: 2px solid #E8DED1;
      border-radius: 24px;
      box-shadow: 0 4px 0 0 #DFD2C2;
    }
    .tactile-btn {
      background-color: #FA9200;
      border: 2px solid #D97300;
      box-shadow: 0 4px 0 0 #D97300;
      color: #1A0D00;
      font-weight: 800;
      transition: all 0.1s ease;
    }
    .tactile-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #D97300;
    }
    .teacher-slot {
      width: 72px;
      height: 80px;
      border-radius: 20px;
      border: 2px dashed #93C5BE;
      background-color: #EBF5F3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="bg-[#091518] min-h-screen flex flex-col justify-between antialiased select-none text-[#E8F1F0]">
<!-- Main Scrollable Area -->
<main class="w-full px-4 pt-3 pb-6 flex-1 flex flex-col justify-between max-w-[390px] mx-auto">
<!-- Top Bar / Progress Header -->
<div>
<div class="flex items-center justify-between gap-3 mb-4">
<!-- Close Button -->
<button aria-label="Close" class="w-10 h-10 rounded-full border border-[#203539] bg-[#172427] flex items-center justify-center text-[#E8F1F0] hover:bg-[#1f3034] active:scale-95 transition-all shadow-[0_2px_0_0_#080f11]" type="button">
<span class="material-symbols-outlined text-[20px] font-bold">close</span>
</button>
<!-- Progress Bar -->
<div class="flex-1 h-3.5 bg-[#1A2E32] rounded-full overflow-hidden p-0.5">
<div class="h-full bg-[#2DD4BF] rounded-full" style="width: 48%;"></div>
</div>
<!-- Heart Counter -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-[#203539] bg-[#172427] text-[#D9383A] font-extrabold text-sm shadow-[0_2px_0_0_#080f11]">
<span class="material-symbols-outlined text-[18px] text-[#D9383A] fill-current" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="text-[#E8F1F0]">5</span>
</div>
</div>
<!-- Mode & Subtitle Row -->
<div class="flex items-center justify-between mb-4 px-1">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border border-[#203539] bg-[#152A2D] shadow-sm text-xs font-bold text-[#2DD4BF]">
<span class="material-symbols-outlined text-[15px] text-[#2DD4BF]">mic</span>
<span>SAY IT</span>
</div>
<div class="text-xs font-bold text-[#9BB3B2] tracking-wide uppercase">
          IELTS Speaking Part 1
        </div>
</div>
<!-- Coach Prompt Block (Empty Dashed Teacher Slot + Speech Bubble) -->
<div class="flex items-start gap-3 mb-4">
<!-- Empty Teacher Slot: soft teal-tinted rounded rectangle with thin dashed border -->
<div class="teacher-slot" style="border-color: #244d52; background-color: #112629;">
<span class="material-symbols-outlined text-[#2DD4BF] text-2xl opacity-60">school</span>
<span class="text-[10px] font-bold text-[#2DD4BF] opacity-80 mt-0.5 tracking-tight uppercase">Coach</span>
</div>
<!-- Speech Bubble -->
<div class="relative flex-1 bg-[#172427] border border-[#203539] rounded-[22px] p-3.5 shadow-[0_3px_0_0_#080f11] before:content-[''] before:absolute before:top-5 before:-left-2.5 before:w-0 before:h-0 before:border-y-[8px] before:border-y-transparent before:border-r-[10px] before:border-r-[#203539] after:content-[''] after:absolute after:top-5 after:-left-2 after:w-0 after:h-0 after:border-y-[7px] after:border-y-transparent after:border-r-[9px] after:border-r-[#172427]">
<div class="flex items-center gap-1.5 mb-1">
<span class="w-2 h-2 rounded-full bg-[#2DD4BF]"></span>
<span class="text-xs font-extrabold text-[#9BB3B2] tracking-wider uppercase">CARLOS • TEACHER</span>
</div>
<p class="text-[15px] font-bold text-[#E8F1F0] leading-snug">
            “Nice and slow – stress <span class="text-[#2DD4BF] underline decoration-2 underline-offset-2">HAND</span>.”
          </p>
</div>
</div>
<!-- Natural Idiom Prompt Card -->
<div class="bg-[#172427] border border-[#203539] rounded-[24px] shadow-[0_4px_0_0_#080f11] p-4 mb-4">
<div class="flex items-center justify-between mb-2">
<span class="text-[11px] font-extrabold text-[#9BB3B2] tracking-wider uppercase">NATURAL IDIOM</span>
<button aria-label="Listen audio" class="w-9 h-9 rounded-full bg-[#163e3d] text-[#2DD4BF] border border-[#203539] flex items-center justify-center shadow-[0_3px_0_0_#080f11] active:translate-y-0.5 transition-all" type="button">
<span class="material-symbols-outlined text-[19px]">volume_up</span>
</button>
</div>
<!-- Target Phrase -->
<div class="text-[21px] font-extrabold text-[#E8F1F0] tracking-tight leading-snug mb-2.5">
          “Could you give me a <span class="inline-block px-2.5 py-0.5 rounded-full border border-[#2DD4BF] bg-[#133E3B] text-[#2DD4BF] font-extrabold text-[19px]">hand</span> with this?”
        </div>
<!-- Phonetic Breakdown -->
<div class="inline-block px-3 py-1 rounded-xl bg-[#112023] border border-[#203539] text-[13px] font-semibold text-[#9BB3B2] font-mono mb-3">
          /kʊd juː ɡɪv miː ə <strong class="text-[#2DD4BF]">hænd</strong> wɪð ðɪs/
        </div>
<div class="border-t border-[#203539] pt-2.5 flex items-center justify-between">
<div class="flex items-center gap-1.5 text-xs text-[#9BB3B2] font-bold">
<span class="text-[#F59E0B] text-sm">💡</span>
<span class="text-[#E8F1F0]">Meaning: Help me with this</span>
</div>
</div>
</div>
<!-- Speech Input Interaction Card -->
<div class="bg-[#172427] border border-[#203539] rounded-[24px] shadow-[0_4px_0_0_#080f11] p-5 flex flex-col items-center justify-center text-center">
<!-- Ready Pill Badge -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#152D30] border border-[#203539] text-[#2DD4BF] text-xs font-bold mb-4">
<span class="flex gap-1 items-center">
<span class="w-1.5 h-1.5 rounded-full bg-[#2DD4BF]"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#2DD4BF]"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#2DD4BF]"></span>
</span>
<span class="ml-1">Ready</span>
</div>
<!-- Big Mic Button with Tactile Rings -->
<div class="relative w-24 h-24 flex items-center justify-center mb-3">
<div class="absolute inset-0 rounded-full bg-[#1A3135] opacity-60"></div>
<div class="absolute inset-2 rounded-full bg-[#152A2D] border border-[#203539]"></div>
<button aria-label="Hold to speak microphone" class="relative z-10 w-16 h-16 rounded-full bg-[#0D9488] text-[#E8F1F0] flex items-center justify-center shadow-[0_4px_0_0_#062e2a] active:translate-y-1 active:shadow-[0_1px_0_0_#062e2a] transition-all" type="button">
<span class="material-symbols-outlined text-[32px]">mic</span>
</button>
</div>
<!-- Voice Instructions -->
<h3 class="text-lg font-extrabold text-[#E8F1F0] mb-1">
          Hold to speak
        </h3>
<p class="text-xs font-medium text-[#9BB3B2] mb-3">
          Speak clearly near your phone's microphone
        </p>
<!-- Can't Speak Now Action -->
<button class="text-xs font-bold text-[#2DD4BF] hover:underline py-1" type="button">
          Can't speak now
        </button>
</div>
</div>
<!-- Bottom Action CTA -->
<div class="pt-4">
<button class="w-full py-4 rounded-2xl flex items-center justify-center gap-2 text-base text-[#1A0D00] font-extrabold tracking-wide bg-[#F59E0B] border-2 border-[#D97706] shadow-[0_4px_0_0_#9A3412] active:translate-y-0.5 active:shadow-[0_2px_0_0_#9A3412] transition-all" type="button">
<span>Check</span>
<span class="material-symbols-outlined text-[20px] font-extrabold">check</span>
</button>
</div>
</main>
</body>
</html>
