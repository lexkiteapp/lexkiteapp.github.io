<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lexkite - IELTS Sound Lab Drill</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "secondary": "#895100",
            "error": "#ba1a1a",
            "tertiary-fixed-dim": "#ffb4a8",
            "surface-variant": "#eae1d8",
            "surface-container-highest": "#eae1d8",
            "inverse-primary": "#88d4cd",
            "on-background": "#1f1b16",
            "on-tertiary-fixed": "#410000",
            "inverse-on-surface": "#f9efe6",
            "surface-container-lowest": "#ffffff",
            "background": "#fff8f3",
            "on-primary": "#ffffff",
            "secondary-fixed-dim": "#ffb86c",
            "tertiary-fixed": "#ffdad4",
            "surface-container-high": "#f0e7de",
            "inverse-surface": "#34302a",
            "surface-dim": "#e2d8d0",
            "on-secondary-fixed-variant": "#683c00",
            "on-tertiary-fixed-variant": "#8c170e",
            "on-primary-fixed-variant": "#00504c",
            "surface-container": "#f6ece4",
            "primary": "#00514d",
            "tertiary": "#8e190f",
            "secondary-fixed": "#ffdcbc",
            "on-primary-container": "#9ce9e2",
            "on-tertiary": "#ffffff",
            "on-secondary-fixed": "#2c1600",
            "primary-fixed": "#a4f0e9",
            "on-tertiary-container": "#ffd0c9",
            "secondary-container": "#fe9d19",
            "surface-container-low": "#fcf2e9",
            "on-secondary-container": "#663b00",
            "on-surface": "#1f1b16",
            "tertiary-container": "#b03224",
            "on-error": "#ffffff",
            "on-primary-fixed": "#00201e",
            "surface": "#fff8f3",
            "outline": "#6f7978",
            "outline-variant": "#bec9c7",
            "on-error-container": "#93000a",
            "surface-bright": "#fff8f3",
            "on-surface-variant": "#3f4947",
            "primary-fixed-dim": "#88d4cd",
            "primary-container": "#136b66",
            "on-secondary": "#ffffff",
            "error-container": "#ffdad6",
            "surface-tint": "#106a65"
          },
          "borderRadius": {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          "spacing": {
            "margin": "1rem",
            "gutter": "1rem",
            "space-xs": "0.25rem",
            "gutter-desktop": "1.5rem",
            "space-xl": "2rem",
            "space-lg": "1.5rem",
            "space-md": "1rem",
            "margin-tablet": "1.5rem",
            "space-sm": "0.5rem",
            "margin-desktop": "2.5rem"
          },
          "fontFamily": {
            "label-md": ["Plus Jakarta Sans"],
            "body-lg": ["Plus Jakarta Sans"],
            "headline-sm": ["Plus Jakarta Sans"],
            "headline-xl": ["Plus Jakarta Sans"],
            "label-sm": ["Plus Jakarta Sans"],
            "body-sm": ["Plus Jakarta Sans"],
            "label-lg": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "headline-xl-mobile": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "headline-lg-mobile": ["Plus Jakarta Sans"]
          },
          "fontSize": {
            "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.6px", "fontWeight": "800" }],
            "label-md": ["14px", { "lineHeight": "18px", "letterSpacing": "0.4px", "fontWeight": "700" }],
            "label-lg": ["16px", { "lineHeight": "20px", "letterSpacing": "0.2px", "fontWeight": "700" }],
            "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
            "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }],
            "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "700" }],
            "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "800" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "800" }],
            "headline-xl-mobile": ["30px", { "lineHeight": "38px", "fontWeight": "800" }],
            "headline-xl": ["40px", { "lineHeight": "48px", "fontWeight": "800" }]
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
    .material-symbols-outlined.fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }
    /* Tactile micro-interactions */
    .tactile-press {
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .tactile-press:active {
      transform: translateY(3px) !important;
      box-shadow: 0 1px 0 currentColor !important;
    }
    /* Waveform audio animation simulation */
    @keyframes barPulse {
      0%, 100% { height: 25%; }
      50% { height: 95%; }
    }
    .waveform-active .w-bar-1 { animation: barPulse 0.9s infinite ease-in-out 0.1s; }
    .waveform-active .w-bar-2 { animation: barPulse 1.1s infinite ease-in-out 0.25s; }
    .waveform-active .w-bar-3 { animation: barPulse 0.7s infinite ease-in-out 0.05s; }
    .waveform-active .w-bar-4 { animation: barPulse 1.3s infinite ease-in-out 0.35s; }
    .waveform-active .w-bar-5 { animation: barPulse 0.8s infinite ease-in-out 0.2s; }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased m-0 p-0 selection:bg-primary-fixed selection:text-primary min-h-screen flex flex-col justify-between max-w-[390px] mx-auto w-full relative">
<!-- TOP COMPACT APP BAR (Linear drill journey: close, progress, lives) -->
<header class="w-full px-4 pt-3 pb-2 flex items-center justify-between gap-3 bg-background z-20">
<!-- Close Button -->
<button aria-label="Close Drill" class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-[#E5DACB] shadow-[0_3px_0_0_#D6C7B2] flex items-center justify-center text-on-surface tactile-press active:shadow-[0_1px_0_0_#D6C7B2]">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<!-- Tactile Segmented Progress Bar -->
<div class="flex-1 h-3.5 bg-[#EBE3D5] rounded-full p-[2px] border border-[#DDD3C2] relative overflow-hidden shadow-inner">
<div class="h-full bg-primary-container rounded-full relative w-[60%] shadow-[0_1px_0_0_#0C4542]">
<!-- Resin glossy reflection line -->
<div class="absolute inset-x-1 top-0 h-[2px] bg-white/40 rounded-full"></div>
</div>
</div>
<!-- Gamified Lives Pill Badge -->
<div class="flex items-center gap-1.5 px-3 py-1 bg-surface-container-lowest border-2 border-[#FFDAD4] rounded-full shadow-[0_3px_0_0_#F0CECA]">
<span class="material-symbols-outlined fill-icon text-tertiary-container text-[18px]">favorite</span>
<span class="font-label-md text-label-md text-tertiary-container">5</span>
</div>
</header>
<!-- MAIN SCROLLABLE DRILL CANVAS -->
<main class="flex-1 px-4 pt-1 pb-24 flex flex-col gap-3.5 w-full">
<!-- Exercise Metadata Header -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-primary-fixed text-on-primary-fixed font-label-sm text-label-sm border border-primary/20">
<span class="material-symbols-outlined text-[14px]">volume_up</span>
          IELTS SOUND LAB
        </span>
<span class="font-label-sm text-label-sm text-outline font-extrabold tracking-wider">PHONEME DRILL</span>
</div>
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight leading-tight">Tap what you hear</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Distinguish minimal vowel pairs under exam speed</p>
</div>
</div>
<!-- TEACHER SLOT: Dashed container, graduation cap badge & speech bubble prompt (NO human face) -->
<div class="teacher-slot w-full p-3 rounded-2xl border-2 border-dashed border-primary/50 bg-[#F4F9F8] flex items-start gap-3 relative">
<!-- Minimalist Icon Badge -->
<div class="flex flex-col items-center gap-1 shrink-0">
<div class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0_2px_0_0_#00201e]">
<span class="material-symbols-outlined fill-icon text-[20px]">school</span>
</div>
<span class="text-[9px] font-extrabold uppercase tracking-tight text-primary leading-none">TEACHER</span>
</div>
<!-- Speech Bubble with Pointer -->
<div class="flex-1 bg-surface-container-lowest rounded-xl p-2.5 border-2 border-[#E5DACB] shadow-[0_2px_0_0_#E0D4C3] relative">
<!-- Chat Bubble Triangle Pointer -->
<div class="absolute -left-2 top-3 w-0 h-0 border-t-[6px] border-t-transparent border-r-[8px] border-r-surface-container-lowest border-b-[6px] border-b-transparent"></div>
<div class="flex items-center gap-2 mb-0.5">
<span class="font-label-sm text-label-sm text-on-surface">TEACHER AMA</span>
<span class="px-1.5 py-0.2 rounded bg-secondary-fixed text-on-secondary-fixed text-[10px] font-extrabold">IELTS Coach</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface italic leading-snug">
          “Listen for the vowel sound in the middle.”
        </p>
</div>
</div>
<!-- AUDIO PLAYER MODULE -->
<div class="w-full bg-surface-container-lowest rounded-2xl border-2 border-[#EFE7DA] shadow-[0_4px_0_0_#E2D7C7] p-3 flex flex-col gap-3">
<!-- Waveform Visualizer Well -->
<div class="w-full h-16 bg-[#F4EFE6] rounded-xl border border-[#E8DECة] border-[#E8DECE] px-4 flex items-center justify-center gap-1.5 overflow-hidden waveform-active">
<span class="w-1.5 rounded-full bg-primary/40 h-3 w-bar-1"></span>
<span class="w-1.5 rounded-full bg-primary/50 h-5 w-bar-2"></span>
<span class="w-1.5 rounded-full bg-primary h-9 w-bar-3"></span>
<span class="w-1.5 rounded-full bg-primary-container h-12 w-bar-4"></span>
<span class="w-1.5 rounded-full bg-primary h-7 w-bar-5"></span>
<span class="w-1.5 rounded-full bg-primary/80 h-11 w-bar-1"></span>
<span class="w-1.5 rounded-full bg-primary-container h-14 w-bar-2"></span>
<span class="w-1.5 rounded-full bg-primary h-8 w-bar-3"></span>
<span class="w-1.5 rounded-full bg-primary/60 h-10 w-bar-4"></span>
<span class="w-1.5 rounded-full bg-primary/40 h-5 w-bar-5"></span>
<span class="w-1.5 rounded-full bg-primary/70 h-9 w-bar-2"></span>
<span class="w-1.5 rounded-full bg-primary/30 h-4 w-bar-1"></span>
</div>
<!-- Audio Action Controls: LISTEN & Speed selector -->
<div class="flex items-center gap-2.5">
<!-- Primary Listen CTA (Teal #136B66 with #0C4542 bottom ledge) -->
<button class="flex-1 h-12 rounded-xl bg-primary-container text-white font-label-lg text-label-lg flex items-center justify-center gap-2 border border-primary-container shadow-[0_4px_0_0_#0C4542] tactile-press active:shadow-[0_1px_0_0_#0C4542]" type="button">
<span class="material-symbols-outlined fill-icon text-[22px]">volume_up</span>
<span>LISTEN</span>
</button>
<!-- Speed Selector Button -->
<button aria-label="Playback speed" class="h-12 px-3.5 rounded-xl bg-surface-container-lowest border-2 border-[#E5DACB] text-on-surface font-label-md text-label-md flex items-center gap-1.5 shadow-[0_4px_0_0_#D6C7B2] tactile-press active:shadow-[0_1px_0_0_#D6C7B2]" type="button">
<span class="material-symbols-outlined text-[18px] text-outline">speed</span>
<span class="font-extrabold text-on-surface tracking-tight">0.75x</span>
</button>
</div>
</div>
<!-- 2x2 MINIMAL PAIR OPTION CARDS (Min 60px touch zones, tactile 3D borders) -->
<div class="grid grid-cols-2 gap-2.5 pt-1">
<!-- Card 1: 'though' -->
<button class="h-20 p-2.5 rounded-2xl bg-surface-container-lowest border-2 border-[#E5DACB] shadow-[0_4px_0_0_#E0CEBD] flex flex-col items-center justify-center text-center tactile-press active:shadow-[0_1px_0_0_#E0CEBD]" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface leading-tight">though</span>
<span class="font-body-sm text-body-sm text-outline font-semibold tracking-wide">/ðəʊ/</span>
</button>
<!-- Card 2: 'thought' (Selected & Correct State) -->
<button class="h-20 p-2.5 rounded-2xl bg-[#EAF3F2] border-2 border-primary-container shadow-[0_4px_0_0_#0C4542] flex flex-col items-center justify-center text-center relative tactile-press active:shadow-[0_1px_0_0_#0C4542]" type="button">
<!-- Active Checkmark Indicator Badge -->
<div class="absolute top-2 right-2 w-5 h-5 rounded-full bg-primary-container text-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
<span class="font-headline-sm text-headline-sm text-primary-container font-extrabold leading-tight">thought</span>
<span class="font-body-sm text-body-sm text-primary font-bold tracking-wide">/θɔːt/</span>
</button>
<!-- Card 3: 'through' -->
<button class="h-20 p-2.5 rounded-2xl bg-surface-container-lowest border-2 border-[#E5DACB] shadow-[0_4px_0_0_#E0CEBD] flex flex-col items-center justify-center text-center tactile-press active:shadow-[0_1px_0_0_#E0CEBD]" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface leading-tight">through</span>
<span class="font-body-sm text-body-sm text-outline font-semibold tracking-wide">/θruː/</span>
</button>
<!-- Card 4: 'tough' -->
<button class="h-20 p-2.5 rounded-2xl bg-surface-container-lowest border-2 border-[#E5DACB] shadow-[0_4px_0_0_#E0CEBD] flex flex-col items-center justify-center text-center tactile-press active:shadow-[0_1px_0_0_#E0CEBD]" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface leading-tight">tough</span>
<span class="font-body-sm text-body-sm text-outline font-semibold tracking-wide">/tʌf/</span>
</button>
</div>
</main>
<!-- DOCKED BOTTOM ACTION CTA CONTAINER -->
<footer class="fixed bottom-0 left-0 right-0 max-w-[390px] mx-auto w-full p-4 bg-background/95 backdrop-blur-sm border-t border-[#EFE7DA] z-30">
<button class="w-full h-14 rounded-2xl bg-secondary-container text-on-surface font-headline-sm text-headline-sm flex items-center justify-center gap-2 border-2 border-[#F59E0B] shadow-[0_4px_0_0_#B45309] tactile-press active:shadow-[0_1px_0_0_#B45309] tracking-wide" type="button">
<span>CHECK</span>
<span class="material-symbols-outlined text-[22px] font-bold">check</span>
</button>
</footer>
</body></html>
