<!DOCTYPE html>

<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite — Placement Test (Listening Question)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24..48,400..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
          boxShadow: {
            'dark-pill': '0 3px 0 0 #0A1518',
            'dark-card': '0 5px 0 0 #0A1518',
            'dark-selected': '0 5px 0 0 #0B4742',
            'dark-btn': '0 6px 0 0 #B53A22',
            'dark-audio-main': '0 8px 0 0 #0D3E3A, 0 12px 20px -4px rgba(43,163,154,0.3)',
            'dark-audio-sub': '0 5px 0 0 #0A1518'
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48; }
    .material-symbols-outlined-custom {
      font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
      display: inline-block; text-transform: none; letter-spacing: normal; word-wrap: normal; white-space: nowrap; direction: ltr;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
    }
    .tactile-btn-active:active { transform: translateY(4px); box-shadow: 0 2px 0 0 #B53A22 !important; }
    .tactile-card-active:active { transform: translateY(3px); box-shadow: 0 2px 0 0 #0A1518 !important; }
    .tactile-audio-active:active { transform: translateY(4px); box-shadow: 0 4px 0 0 #0D3E3A !important; }
    .tactile-audio-sub-active:active { transform: translateY(3px); box-shadow: 0 2px 0 0 #0A1518 !important; }
  </style>
</head>
<body class="bg-[#0A1517] text-[#EAF2F2] font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#2BA39A]/30 relative overflow-x-hidden">
<header class="w-full max-w-xl mx-auto pt-6 px-6 sm:px-8"> <div class="flex items-center justify-between gap-4">
<button aria-label="Close Placement Test" class="w-11 h-11 rounded-2xl bg-[#0F2B2E] border-2 border-[#33494F] shadow-dark-pill flex items-center justify-center text-[#EAF2F2] hover:border-[#2BA39A] transition-colors tactile-card-active flex-shrink-0">
<span class="material-symbols-outlined-custom text-[24px]">close</span>
</button>
<div class="flex-1 flex flex-col gap-1.5">
<div class="flex justify-between items-center text-[13px] font-extrabold text-[#A3B9B7] tracking-wider uppercase">
<span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#2BA39A] inline-block animate-pulse shadow-[0_0_8px_#2BA39A]"></span>Diagnostic</span>
<span class="font-extrabold text-[#A3B9B7] tracking-normal">4 / 15</span>
</div>
<div class="h-4 w-full bg-[#122023] rounded-full p-[2px] border border-[#263A3F] relative overflow-hidden shadow-inner">
<div class="h-full bg-gradient-to-r from-[#2BA39A] to-[#5FD0C4] rounded-full relative w-[28%] shadow-[0_2px_0_0_#134B46]">
<div class="absolute inset-x-0 top-0 h-[45%] bg-white/40 rounded-t-full"></div>
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-white rounded-full shadow-[0_0_6px_#2BA39A]"></div>
</div>
</div>
</div>
</div></header>
<main class="w-full max-w-xl mx-auto px-6 sm:px-8 py-6 flex-1 flex flex-col justify-center">
<div class="flex justify-center mb-4"> <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-[#0F2B2E] border-2 border-[#2BA39A] text-[#6BD8CE] text-[12px] font-extrabold uppercase tracking-wider shadow-sm">
<span class="material-symbols-outlined-custom text-[#6BD8CE] text-[16px]">headphones</span>
        Listening Drill • Part 1
      </div></div>
<h1 class="text-center text-[28px] sm:text-[32px] font-extrabold text-[#EAF2F2] tracking-tight leading-tight mb-8">What did you hear?</h1>
<div class="flex items-center justify-center gap-5 mb-10">
<button aria-label="Play normal speed audio" class="relative group tactile-audio-active focus:outline-none">
<div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-gradient-to-b from-[#5FD0C4] to-[#2BA39A] border-[3px] border-[#0F3D3E] shadow-dark-audio-main flex items-center justify-center relative overflow-hidden transition-all">
<div class="absolute inset-x-3 top-1.5 h-1/2 bg-gradient-to-b from-white/45 to-transparent rounded-t-full pointer-events-none"></div>
<div class="relative flex items-center justify-center text-white drop-shadow-[0_2px_4px_rgba(4,16,19,0.7)]">
<span class="material-symbols-outlined-custom text-[46px] sm:text-[52px]">volume_up</span>
</div>
<div class="absolute inset-0 rounded-full border-2 border-white/25 pointer-events-none"></div>
</div>
</button>
<button aria-label="Play slow speed audio" class="relative group tactile-audio-sub-active focus:outline-none">
<div class="w-16 h-16 rounded-full bg-[#0F2B2E] border-[2.5px] border-[#33494F] shadow-dark-audio-sub flex items-center justify-center relative overflow-hidden transition-all group-hover:border-[#2BA39A]">
<div class="absolute inset-x-2 top-1 h-1/2 bg-gradient-to-b from-white/20 to-transparent rounded-t-full pointer-events-none"></div>
<div class="relative flex flex-col items-center justify-center text-[#A3B9B7] group-hover:text-[#6BD8CE] transition-colors">
<span class="material-symbols-outlined-custom text-[28px] sm:text-[32px]">slow_motion_video</span>
<span class="text-[9px] font-extrabold uppercase tracking-tight text-[#A3B9B7] -mt-1">0.75×</span>
</div>
</div>
</button></div>
<div aria-label="Answer options" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4 w-full" role="radiogroup">
<button aria-checked="false" class="w-full min-h-[72px] bg-[#0F2B2E] rounded-2xl border-2 border-[#33494F] shadow-dark-card p-4 flex items-center gap-3.5 text-left transition-all tactile-card-active hover:border-[#2BA39A]/60 group" role="radio">
<div class="w-9 h-9 rounded-xl bg-[#263A3F] border border-[#33494F] flex items-center justify-center font-extrabold text-[15px] text-[#EAF2F2] group-hover:border-[#2BA39A]/60 flex-shrink-0 transition-colors">A</div>
<span class="text-[17px] sm:text-[18px] font-bold text-[#EAF2F2] leading-snug">financial report</span>
</button>
<button aria-checked="true" class="w-full min-h-[72px] bg-[#0F2B2E] rounded-2xl border-[2.5px] border-[#2BA39A] shadow-dark-selected p-4 flex items-center justify-between text-left transition-all tactile-card-active ring-1 ring-[#2BA39A]/40" role="radio">
<div class="flex items-center gap-3.5">
<div class="w-9 h-9 rounded-xl bg-[#2BA39A] border border-[#5FD0C4] flex items-center justify-center font-extrabold text-[15px] text-[#0A1517] flex-shrink-0 shadow-sm">B</div>
<span class="text-[17px] sm:text-[18px] font-extrabold text-[#EAF2F2] leading-snug">quarterly review</span>
</div>
<span class="material-symbols-outlined-custom text-[#2BA39A] text-[24px] flex-shrink-0 drop-shadow-[0_0_6px_rgba(43,163,154,0.6)]">check_circle</span>
</button>
<button aria-checked="false" class="w-full min-h-[72px] bg-[#0F2B2E] rounded-2xl border-2 border-[#33494F] shadow-dark-card p-4 flex items-center gap-3.5 text-left transition-all tactile-card-active hover:border-[#2BA39A]/60 group" role="radio">
<div class="w-9 h-9 rounded-xl bg-[#263A3F] border border-[#33494F] flex items-center justify-center font-extrabold text-[15px] text-[#EAF2F2] group-hover:border-[#2BA39A]/60 flex-shrink-0 transition-colors">C</div>
<span class="text-[17px] sm:text-[18px] font-bold text-[#EAF2F2] leading-snug">orderly dispatch</span>
</button>
<button aria-checked="false" class="w-full min-h-[72px] bg-[#0F2B2E] rounded-2xl border-2 border-[#33494F] shadow-dark-card p-4 flex items-center gap-3.5 text-left transition-all tactile-card-active hover:border-[#2BA39A]/60 group" role="radio">
<div class="w-9 h-9 rounded-xl bg-[#263A3F] border border-[#33494F] flex items-center justify-center font-extrabold text-[15px] text-[#EAF2F2] group-hover:border-[#2BA39A]/60 flex-shrink-0 transition-colors">D</div>
<span class="text-[17px] sm:text-[18px] font-bold text-[#EAF2F2] leading-snug">quality renewal</span>
</button></div>
</main>
<footer class="w-full max-w-xl mx-auto pb-8 pt-4 px-6 sm:px-8 border-t-2 border-[#0F2B2E] bg-[#0A1517]">
<div class="flex flex-col gap-3">
<button class="w-full h-14 rounded-2xl bg-gradient-to-r from-[#FF7A4D] to-[#F5A524] border-2 border-[#B53A22] shadow-dark-btn flex items-center justify-center gap-2 text-[#1A0E0B] font-extrabold text-[18px] sm:text-[19px] tracking-wide relative overflow-hidden tactile-btn-active transition-all focus:outline-none cursor-pointer">
<div class="absolute inset-x-0 top-0 h-[40%] bg-gradient-to-b from-white/35 to-transparent pointer-events-none"></div>
<span class="relative">CHECK</span>
<span class="material-symbols-outlined-custom text-[#1A0E0B] text-[22px] relative">arrow_forward</span>
</button>
</div>
</footer>
</body>
</html>
