<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite — Placement Test (Listening Question)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24..48,400..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-cream': '#FFF7EA',
            'card-bg': '#FFFFFF',
            'border-warm': '#EADEC8',
            'ledge-warm': '#D8CFBC',
            'teal-main': '#2BA39A',
            'teal-deep': '#0F3D3E',
            'teal-muted': '#325D5E',
            'teal-ledge': '#1B6A64',
            'teal-subtle': '#E8F7F6',
            'coral-orange': '#FF7A38',
            'orange-amber': '#FF9F43',
            'cta-ledge': '#B84E1A',
            'dark-ink': '#1E120A',
            'slate-ink': '#102A2D'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            'tactile-btn': '0 6px 0 0 #B84E1A',
            'tactile-card': '0 5px 0 0 #D8CFBC',
            'tactile-card-selected': '0 5px 0 0 #1B6A64',
            'tactile-audio-main': '0 8px 0 0 #1B6A64, 0 12px 20px -4px rgba(43,163,154,0.3)',
            'tactile-audio-sub': '0 5px 0 0 #D8CFBC',
            'tactile-pill': '0 3px 0 0 #D8CFBC'
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
    }
    .material-symbols-outlined-custom {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      display: inline-block;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
    }

    /* Tactile push physics */
    .tactile-btn-active:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 0 #B84E1A !important;
    }
    .tactile-card-active:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #D8CFBC !important;
    }
    .tactile-audio-active:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 0 #1B6A64 !important;
    }
    .tactile-audio-sub-active:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #D8CFBC !important;
    }

    /* Glossy highlights */
    .glossy-top {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
    }
  </style>
</head>
<body class="bg-[#081518] text-[#EEF6F7] font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#2BA39A]/30 relative overflow-x-hidden">
<!-- Top Progress Bar & Header Chrome -->
<header class="w-full max-w-xl mx-auto pt-6 px-6 sm:px-8"> <div class="flex items-center justify-between gap-4">
<!-- Close X Button -->
<button aria-label="Close Placement Test" class="w-11 h-11 rounded-2xl bg-[#162930] border-2 border-[#2E4854] shadow-dark-pill flex items-center justify-center text-[#EEF6F7] hover:border-[#2BA39A] transition-colors tactile-card-active flex-shrink-0">
<span class="material-symbols-outlined-custom text-[24px]">close</span>
</button>
<!-- Chunky Progress Track -->
<div class="flex-1 flex flex-col gap-1.5">
<div class="flex justify-between items-center text-[13px] font-extrabold text-[#A9BFC1] tracking-wider uppercase">
<span class="flex items-center gap-1.5">
<span class="w-2.5 h-2.5 rounded-full bg-[#2BA39A] inline-block animate-pulse shadow-[0_0_8px_#2BA39A]"></span>
            Diagnostic
          </span>
<span class="font-extrabold text-[#A9BFC1] tracking-normal">4 / 15</span>
</div>
<!-- Physical Progress bar with inner fill and gloss -->
<div class="h-4 w-full bg-[#122024] rounded-full p-[2px] border border-[#233B43] relative overflow-hidden shadow-inner">
<div class="h-full bg-gradient-to-r from-[#2BA39A] to-[#39C4B9] rounded-full relative w-[28%] shadow-[0_2px_0_0_#134B46]">
<div class="absolute inset-x-0 top-0 h-[45%] bg-white/40 rounded-t-full"></div>
<!-- Progress Sparkle Head -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-white rounded-full shadow-[0_0_6px_#2BA39A]"></div>
</div>
</div>
</div>
<!-- Live Streak / Flame Badge -->
<div class="flex items-center gap-1.5 px-3.5 py-1.5 bg-[#162930] border-2 border-[#2E4854] rounded-2xl shadow-dark-pill flex-shrink-0">
<span class="material-symbols-outlined-custom text-[#FF7A38] text-[20px]">local_fire_department</span>
<span class="text-[14px] font-extrabold text-[#EEF6F7]">14</span>
</div>
</div></header>
<!-- Main Question Stage -->
<main class="w-full max-w-xl mx-auto px-6 sm:px-8 py-6 flex-1 flex flex-col justify-center">
<!-- Category Pill -->
<div class="flex justify-center mb-4"> <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-[#162930] border-2 border-[#2BA39A] text-[#2BA39A] text-[12px] font-extrabold uppercase tracking-wider shadow-sm">
<span class="material-symbols-outlined-custom text-[#2BA39A] text-[16px]">headphones</span>
        Listening Drill • Part 1
      </div></div>
<!-- Question Prompt Headline -->
<h1 class="text-center text-[28px] sm:text-[32px] font-extrabold text-[#EEF6F7] tracking-tight leading-tight mb-8">
      What did you hear?
    </h1>
<!-- 3D Tactile Audio Controller Section -->
<div class="flex items-center justify-center gap-5 mb-10"> <!-- Primary Big Round Tactile Speaker Button -->
<button aria-label="Play normal speed audio" class="relative group tactile-audio-active focus:outline-none">
<div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-gradient-to-b from-[#34C5B9] to-[#2BA39A] border-[3px] border-[#0D3E3A] shadow-dark-audio-main flex items-center justify-center relative overflow-hidden transition-all">
<!-- Top 3D glossy dome reflection -->
<div class="absolute inset-x-3 top-1.5 h-1/2 bg-gradient-to-b from-white/45 to-transparent rounded-t-full pointer-events-none"></div>
<!-- Sound Wave Waves Icon -->
<div class="relative flex items-center justify-center text-white drop-shadow-[0_2px_4px_rgba(4,16,19,0.7)]">
<span class="material-symbols-outlined-custom text-[46px] sm:text-[52px]">volume_up</span>
</div>
<!-- Inner Accent Ring -->
<div class="absolute inset-0 rounded-full border-2 border-white/25 pointer-events-none"></div>
</div>
</button>
<!-- Secondary Round Tactile Turtle Button (Slow Speed) in Dark Elevated Teal -->
<button aria-label="Play slow speed audio" class="relative group tactile-audio-sub-active focus:outline-none">
<div class="w-16 h-16 sm:w-18 sm:h-18 rounded-full bg-[#162930] border-[2.5px] border-[#2E4854] shadow-dark-audio-sub flex items-center justify-center relative overflow-hidden transition-all group-hover:border-[#2BA39A]">
<!-- Gloss highlight -->
<div class="absolute inset-x-2 top-1 h-1/2 bg-gradient-to-b from-white/20 to-transparent rounded-t-full pointer-events-none"></div>
<!-- Turtle Speed Icon -->
<div class="relative flex flex-col items-center justify-center text-[#A9BFC1] group-hover:text-[#2BA39A] transition-colors">
<span class="material-symbols-outlined-custom text-[28px] sm:text-[32px]">pest_control_rodent</span>
<span class="text-[9px] font-extrabold uppercase tracking-tight text-[#A9BFC1] -mt-1">0.75×</span>
</div>
</div>
</button></div>
<!-- 4 Big Tactile Answer Cards (2x2 Grid) -->
<div aria-label="Answer options" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4 w-full" role="radiogroup"> <!-- Option A -->
<button aria-checked="false" class="w-full min-h-[72px] bg-[#162930] rounded-2xl border-2 border-[#2E4854] shadow-dark-card p-4 flex items-center gap-3.5 text-left transition-all tactile-card-active hover:border-[#2BA39A]/60 group" role="radio">
<!-- Letter Tag Badge -->
<div class="w-9 h-9 rounded-xl bg-[#223C46] border border-[#2E4854] flex items-center justify-center font-extrabold text-[15px] text-[#EEF6F7] group-hover:border-[#2BA39A]/60 flex-shrink-0 transition-colors">
          A
        </div>
<!-- Label Text -->
<span class="text-[17px] sm:text-[18px] font-bold text-[#EEF6F7] leading-snug">
          financial report
        </span>
</button>
<!-- Option B (Selected State Example) -->
<button aria-checked="true" class="w-full min-h-[72px] bg-[#162930] rounded-2xl border-[2.5px] border-[#2BA39A] shadow-dark-selected p-4 flex items-center justify-between text-left transition-all tactile-card-active ring-1 ring-[#2BA39A]/40" role="radio">
<div class="flex items-center gap-3.5">
<!-- Letter Tag Badge (Active) -->
<div class="w-9 h-9 rounded-xl bg-[#2BA39A] border border-[#39C4B9] flex items-center justify-center font-extrabold text-[15px] text-[#081518] flex-shrink-0 shadow-sm">
            B
          </div>
<!-- Label Text -->
<span class="text-[17px] sm:text-[18px] font-extrabold text-[#EEF6F7] leading-snug">
            quarterly review
          </span>
</div>
<!-- Right Check Indicator Icon -->
<span class="material-symbols-outlined-custom text-[#2BA39A] text-[24px] flex-shrink-0 drop-shadow-[0_0_6px_rgba(43,163,154,0.6)]">check_circle</span>
</button>
<!-- Option C -->
<button aria-checked="false" class="w-full min-h-[72px] bg-[#162930] rounded-2xl border-2 border-[#2E4854] shadow-dark-card p-4 flex items-center gap-3.5 text-left transition-all tactile-card-active hover:border-[#2BA39A]/60 group" role="radio">
<!-- Letter Tag Badge -->
<div class="w-9 h-9 rounded-xl bg-[#223C46] border border-[#2E4854] flex items-center justify-center font-extrabold text-[15px] text-[#EEF6F7] group-hover:border-[#2BA39A]/60 flex-shrink-0 transition-colors">
          C
        </div>
<!-- Label Text -->
<span class="text-[17px] sm:text-[18px] font-bold text-[#EEF6F7] leading-snug">
          orderly dispatch
        </span>
</button>
<!-- Option D -->
<button aria-checked="false" class="w-full min-h-[72px] bg-[#162930] rounded-2xl border-2 border-[#2E4854] shadow-dark-card p-4 flex items-center gap-3.5 text-left transition-all tactile-card-active hover:border-[#2BA39A]/60 group" role="radio">
<!-- Letter Tag Badge -->
<div class="w-9 h-9 rounded-xl bg-[#223C46] border border-[#2E4854] flex items-center justify-center font-extrabold text-[15px] text-[#EEF6F7] group-hover:border-[#2BA39A]/60 flex-shrink-0 transition-colors">
          D
        </div>
<!-- Label Text -->
<span class="text-[17px] sm:text-[18px] font-bold text-[#EEF6F7] leading-snug">
          quality renewal
        </span>
</button></div>
</main>
<!-- Bottom Action Bar / Orange Check Button -->
<footer class="w-full max-w-xl mx-auto pb-8 pt-4 px-6 sm:px-8 border-t-2 border-[#182B32] bg-[#081518]">
<div class="flex flex-col gap-3"> <!-- Big Tactile Orange Check Button with dark brown-black text -->
<button class="w-full h-14 sm:h-15 rounded-2xl bg-gradient-to-r from-[#FF7A38] to-[#FF9F43] border-2 border-[#B53A22] shadow-dark-btn flex items-center justify-center gap-2 text-[#1A0C08] font-extrabold text-[18px] sm:text-[19px] tracking-wide relative overflow-hidden tactile-btn-active transition-all focus:outline-none cursor-pointer">
<!-- Button top highlight -->
<div class="absolute inset-x-0 top-0 h-[40%] bg-gradient-to-b from-white/35 to-transparent pointer-events-none"></div>
<span class="relative">CHECK</span>
<span class="material-symbols-outlined-custom text-[#1A0C08] text-[22px] relative font-black">arrow_forward</span>
</button>
<!-- Examiner Compliance Note with crisp slate-mint text -->
<p class="text-center text-[12px] font-bold text-[#A9BFC1] flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined-custom text-[#2BA39A] text-[16px]">verified</span>
        Cambridge &amp; ETS benchmarked audio calibration
      </p></div>
</footer>
</body>
</html>
