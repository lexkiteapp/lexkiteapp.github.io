<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite Lesson Drill</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-surface-variant": "#bcc9c7",
            "inverse-surface": "#d8e5e9",
            "on-primary-fixed": "#00201e",
            "error-container": "#93000a",
            "surface-container-highest": "#2b373a",
            "background": "#091518",
            "on-tertiary-fixed-variant": "#5b4300",
            "on-secondary-container": "#ffa493",
            "surface-tint": "#6bd8ce",
            "surface-container-high": "#202c2f",
            "surface-dim": "#091518",
            "on-primary": "#003733",
            "primary": "#6bd8ce",
            "primary-fixed-dim": "#6bd8ce",
            "on-background": "#d8e5e9",
            "outline": "#879391",
            "tertiary": "#f4bf40",
            "surface-container-lowest": "#051013",
            "tertiary-fixed-dim": "#f4bf40",
            "primary-fixed": "#88f5ea",
            "secondary": "#ffb4a6",
            "on-secondary-fixed-variant": "#900f00",
            "surface-bright": "#2f3b3e",
            "secondary-fixed-dim": "#ffb4a6",
            "error": "#ffb4ab",
            "surface-container": "#162125",
            "on-tertiary-container": "#392900",
            "tertiary-container": "#ba8b00",
            "surface-variant": "#2b373a",
            "on-error-container": "#ffdad6",
            "on-primary-fixed-variant": "#00504b",
            "tertiary-fixed": "#ffdf9e",
            "secondary-container": "#981201",
            "surface-container-low": "#121d20",
            "inverse-on-surface": "#263236",
            "outline-variant": "#3d4947",
            "on-tertiary": "#402e00",
            "on-secondary": "#660800",
            "on-surface": "#d8e5e9",
            "on-error": "#690005",
            "surface": "#091518",
            "secondary-fixed": "#ffdad3",
            "primary-container": "#2ba39a",
            "on-primary-container": "#00322e",
            "on-tertiary-fixed": "#261a00",
            "inverse-primary": "#006a64",
            "on-secondary-fixed": "#3f0300"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "3xl": "1.5rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Plus Jakarta Sans", "sans-serif"],
            label: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined.fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col justify-between selection:bg-primary selection:text-on-primary antialiased">
<!-- TOP APP BAR / HEADER -->
<header class="w-full bg-background border-b-2 border-outline-variant shadow-[0_4px_0_0_#3f4947] sticky top-0 z-40">
<div class="max-w-5xl mx-auto h-16 px-4 md:px-8 flex items-center justify-between gap-4">
<!-- Leading: tactile round Close button -->
<button aria-label="Close Drill" class="w-10 h-10 rounded-full bg-surface-container-low border-2 border-outline-variant text-on-surface flex items-center justify-center shadow-[0_3px_0_0_#3d4947] hover:bg-surface-container active:translate-y-0.5 active:shadow-[0_1px_0_0_#3d4947] transition-all">
<span class="material-symbols-outlined text-xl">close</span>
</button>
<!-- Center: Progress Track & Gauge -->
<div class="flex-1 max-w-lg mx-2 flex items-center gap-3">
<div class="flex-1 h-3.5 bg-surface-container rounded-full border border-outline-variant p-0.5 shadow-inner overflow-hidden">
<div class="h-full bg-primary-container rounded-full shadow-[0_0_8px_rgba(107,216,206,0.6)] transition-all duration-500" style="width: 66%;"></div>
</div>
<span class="text-xs font-headline font-bold text-on-surface-variant tracking-wider hidden sm:inline-block">4/6 pairs</span>
</div>
<!-- Trailing: Flame Combo Tactile Pill -->
<div class="flex items-center gap-2 bg-surface-container-low border-2 border-tertiary-container/80 px-3.5 py-1.5 rounded-full shadow-[0_3px_0_0_#5b4300]">
<span class="material-symbols-outlined fill-icon text-tertiary text-lg">local_fire_department</span>
<span class="font-headline font-extrabold text-xs md:text-sm text-tertiary-fixed tracking-wide">COMBO ×4</span>
</div>
</div>
</header>
<!-- MAIN DRILL CANVAS -->
<main class="flex-1 w-full max-w-4xl mx-auto px-4 py-8 md:py-10 flex flex-col justify-center items-center">
<div class="w-full space-y-6">
<!-- QUESTION HEADER & TEACHER SLOT COMPONENT -->
<div class="flex flex-col sm:flex-row items-center sm:items-start gap-4 md:gap-6 w-full">
<!-- Teacher Slot: Empty tactile dashed placeholder -->
<div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl border-2 border-dashed border-outline-variant/80 bg-surface-container-low/60 flex flex-col items-center justify-center gap-1 shrink-0 relative group">
<div class="w-10 h-10 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center text-primary/80">
<span class="material-symbols-outlined text-2xl">person_add</span>
</div>
<span class="font-label text-[11px] font-extrabold tracking-wider text-primary/90">TEACHER</span>
<span class="px-2 py-0.5 rounded-full bg-surface-container-high border border-outline-variant/60 text-[9px] font-extrabold text-on-surface-variant">SLOT</span>
</div>
<!-- Speech Bubble Container with Tactical Pointer -->
<div class="flex-1 w-full relative">
<!-- Tactile Speech Card -->
<div class="bg-surface-container-low border-2 border-outline-variant rounded-2xl md:rounded-3xl p-5 md:p-6 shadow-[0_5px_0_0_#24383c] relative">
<div class="text-xs font-bold uppercase tracking-wider text-primary mb-1 flex items-center gap-1.5">
<span class="material-symbols-outlined text-sm">psychology</span>
              Select Matching Meaning
            </div>
<h1 class="font-headline font-bold text-xl md:text-2xl text-on-surface leading-snug">
              Which word means <span class="text-primary underline decoration-primary decoration-2 underline-offset-4 font-extrabold">very important</span>?
            </h1>
</div>
</div>
</div>
<!-- AUDIO UTILITY ROW -->
<div class="flex items-center gap-3 pt-1">
<!-- Listen Again -->
<button class="flex items-center gap-2 bg-surface-container-low hover:bg-surface-container border-2 border-outline-variant rounded-xl px-4 py-2.5 text-on-surface shadow-[0_4px_0_0_#24383c] active:translate-y-1 active:shadow-[0_1px_0_0_#24383c] transition-all">
<span class="material-symbols-outlined text-primary text-xl">volume_up</span>
<span class="font-headline font-bold text-sm text-on-surface tracking-wide">Listen again</span>
</button>
<!-- Slower -->
<button class="flex items-center gap-2 bg-surface-container-low hover:bg-surface-container border-2 border-outline-variant rounded-xl px-4 py-2.5 text-on-surface shadow-[0_4px_0_0_#24383c] active:translate-y-1 active:shadow-[0_1px_0_0_#24383c] transition-all">
<span class="material-symbols-outlined text-tertiary text-xl">eco</span>
<span class="font-headline font-bold text-sm text-on-surface tracking-wide">Slower</span>
</button>
</div>
<!-- 2x2 ANSWER CARDS GRID -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
<!-- OPTION 1: SELECTED / CORRECT -->
<div class="relative bg-surface-container border-2 border-primary-container rounded-2xl p-5 shadow-[0_5px_0_0_#2ba39a] cursor-pointer active:translate-y-1 active:shadow-[0_1px_0_0_#2ba39a] transition-all flex flex-col justify-between group">
<div class="flex items-start justify-between">
<span class="font-label font-black text-sm text-primary tracking-wider">A</span>
<!-- Selected badge indicator -->
<div class="w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center font-bold text-sm shadow-[0_2px_0_0_#003733]">
<span class="material-symbols-outlined text-base">check</span>
</div>
</div>
<div class="mt-4">
<p class="font-headline text-2xl font-black text-primary tracking-tight">crucial</p>
<div class="inline-block mt-2 px-2.5 py-0.5 rounded-full bg-surface-container-high border border-primary/40">
<span class="text-xs font-semibold text-primary">essential</span>
</div>
</div>
</div>
<!-- OPTION 2: TRIVIAL -->
<div class="relative bg-surface-container-low border-2 border-outline-variant rounded-2xl p-5 shadow-[0_5px_0_0_#24383c] cursor-pointer hover:border-outline active:translate-y-1 active:shadow-[0_1px_0_0_#24383c] transition-all flex flex-col justify-between">
<div class="flex items-start justify-between">
<span class="font-label font-black text-sm text-on-surface-variant tracking-wider">B</span>
</div>
<div class="mt-4">
<p class="font-headline text-2xl font-bold text-on-surface tracking-tight">trivial</p>
<p class="text-sm font-medium text-on-surface-variant mt-1">minor</p>
</div>
</div>
<!-- OPTION 3: VAGUE -->
<div class="relative bg-surface-container-low border-2 border-outline-variant rounded-2xl p-5 shadow-[0_5px_0_0_#24383c] cursor-pointer hover:border-outline active:translate-y-1 active:shadow-[0_1px_0_0_#24383c] transition-all flex flex-col justify-between">
<div class="flex items-start justify-between">
<span class="font-label font-black text-sm text-on-surface-variant tracking-wider">C</span>
</div>
<div class="mt-4">
<p class="font-headline text-2xl font-bold text-on-surface tracking-tight">vague</p>
<p class="text-sm font-medium text-on-surface-variant mt-1">unclear</p>
</div>
</div>
<!-- OPTION 4: CASUAL -->
<div class="relative bg-surface-container-low border-2 border-outline-variant rounded-2xl p-5 shadow-[0_5px_0_0_#24383c] cursor-pointer hover:border-outline active:translate-y-1 active:shadow-[0_1px_0_0_#24383c] transition-all flex flex-col justify-between">
<div class="flex items-start justify-between">
<span class="font-label font-black text-sm text-on-surface-variant tracking-wider">D</span>
</div>
<div class="mt-4">
<p class="font-headline text-2xl font-bold text-on-surface tracking-tight">casual</p>
<p class="text-sm font-medium text-on-surface-variant mt-1">relaxed</p>
</div>
</div>
</div>
<!-- MAIN TACTILE ACTION BUTTON (CHECK) -->
<div class="pt-4">
<button class="w-full h-14 bg-gradient-to-r from-tertiary via-tertiary-fixed-dim to-tertiary text-on-tertiary-fixed font-headline font-black text-lg md:text-xl rounded-2xl border-2 border-tertiary-container shadow-[0_6px_0_0_#944800] active:translate-y-1.5 active:shadow-[0_2px_0_0_#944800] transition-all flex items-center justify-center gap-2 tracking-wider">
<span class="material-symbols-outlined text-2xl font-black text-on-tertiary-fixed">check_circle</span>
          CHECK
        </button>
</div>
</div>
</main>
<!-- DOCKED BOTTOM NAVIGATION (SHARED COMPONENT BLUEPRINT) -->
<nav class="w-full bg-surface-container-lowest border-t-2 border-outline-variant shadow-[0_-4px_0_0_#3f4947] sticky bottom-0 z-40">
<div class="max-w-5xl mx-auto px-4 py-2 flex justify-around items-center">
<!-- 1. Today -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1.5 active:scale-95 transition-transform duration-75">
<span class="material-symbols-outlined text-2xl">today</span>
<span class="font-headline text-xs font-semibold mt-1">Today</span>
</button>
<!-- 2. Vocab (ACTIVE STATE AS DEFINED IN BLUEPRINT) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-fixed rounded-full px-4 py-1.5 shadow-[0_3px_0_0_#8c5000] active:translate-y-0.5 active:shadow-none transition-transform duration-75">
<span class="material-symbols-outlined fill-icon text-2xl text-on-secondary-fixed">style</span>
<span class="font-headline text-xs font-black tracking-wide text-on-secondary-fixed mt-0.5">Vocab</span>
</button>
<!-- 3. Skills -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1.5 active:scale-95 transition-transform duration-75">
<span class="material-symbols-outlined text-2xl">psychology</span>
<span class="font-headline text-xs font-semibold mt-1">Skills</span>
</button>
<!-- 4. Tests -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1.5 active:scale-95 transition-transform duration-75">
<span class="material-symbols-outlined text-2xl">assignment</span>
<span class="font-headline text-xs font-semibold mt-1">Tests</span>
</button>
<!-- 5. Me -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1.5 active:scale-95 transition-transform duration-75">
<span class="material-symbols-outlined text-2xl">person</span>
<span class="font-headline text-xs font-semibold mt-1">Me</span>
</button>
</div>
</nav>
</body></html>
