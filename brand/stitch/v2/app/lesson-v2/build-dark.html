<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite - Build the Sentence (Tactile Night)</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            night: {
              bg: '#091518',
              surface: '#0e2025',
              surfaceCard: '#12252a',
              surfaceLedge: '#061013',
              border: '#1f3c44',
              borderAccent: '#2dd4bf',
              textPrimary: '#f2fafb',
              textSecondary: '#a5c7cb',
              textMuted: '#7a9ea3',
              tealAccent: '#2dd4bf',
              tealDark: '#0d5e58',
              orangeAccent: '#f59e0b',
              orangeLedge: '#9a3412',
              darkInk: '#1c1003'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #091518;
      color: #f2fafb;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* Tactile 3D Buttons & Tiles */
    .tactile-btn-orange {
      background-color: #f59e0b;
      color: #1c1003;
      box-shadow: 0 4px 0 0 #9a3412;
      transition: all 0.1s ease;
    }
    .tactile-btn-orange:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #9a3412;
    }

    .tactile-chip-active {
      background-color: #163238;
      border: 1.5px solid #2a525c;
      color: #f2fafb;
      box-shadow: 0 3px 0 0 #081316;
    }

    .tactile-chip-bank {
      background-color: #12252a;
      border: 1.5px solid #244852;
      color: #f2fafb;
      box-shadow: 0 3px 0 0 #071316;
    }

    .tactile-chip-used {
      background-color: #0c1a1d;
      border: 1.5px dashed #1a333a;
      color: #4b676c;
      box-shadow: none;
    }

    .tactile-card {
      background-color: #102429;
      border: 1.5px solid #1e3d44;
      box-shadow: 0 4px 0 0 #061013;
    }

    /* Dashed slot styling */
    .slot-dashed {
      border: 2px dashed #2dd4bf;
      background-color: rgba(45, 212, 191, 0.04);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto px-5 py-4 select-none">

  <!-- ================= TOP APP BAR ================= -->
  <header class="flex items-center justify-between gap-3 pt-1 pb-3">
    <!-- Close Button ✕ -->
    <button class="w-10 h-10 rounded-full flex items-center justify-center bg-[#102429] border border-[#204048] text-[#a5c7cb] hover:text-[#f2fafb] active:translate-y-0.5 shadow-[0_2px_0_0_#071316] transition-transform" aria-label="Close lesson">
      <svg class="w-5 h-5 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- Stepped Progress Bar -->
    <div class="flex-1 h-3.5 bg-[#0e2126] rounded-full overflow-hidden p-0.5 border border-[#1a3840]">
      <div class="h-full bg-gradient-to-r from-[#14b8a6] to-[#2dd4bf] rounded-full w-[38%] shadow-[0_0_8px_rgba(45,212,191,0.5)]"></div>
    </div>

    <!-- Combo Streak Pill -->
    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#1e2a1b] border border-[#eab308]/40 shadow-[0_2px_0_0_#0a140a]">
      <!-- Fire flame icon -->
      <svg class="w-4 h-4 fill-[#f59e0b] text-[#f59e0b]" viewBox="0 0 24 24">
        <path d="M12 2c-.6 2.3-2.5 4.3-4.5 6.3C5.4 10.4 4 13 4 16c0 4.4 3.6 8 8 8s8-3.6 8-8c0-4-2.5-7.3-5-9.8-1 2.3-3 4-3 4s-.7-3.8 0-8.2z"/>
      </svg>
      <span class="text-xs font-black tracking-wider text-[#fbbf24]">COMBO x3</span>
    </div>
  </header>

  <!-- ================= LESSON HEADER & PROMPT ================= -->
  <div class="mt-1">
    <div class="text-[11px] font-black uppercase tracking-widest text-[#2dd4bf] mb-1">
      SENTENCE BUILDER
    </div>
    <h1 class="text-2xl font-extrabold tracking-tight text-[#f2fafb]">
      Build the sentence in English
    </h1>
  </div>

  <!-- ================= TEACHER SLOT + VIETNAMESE STIMULUS ================= -->
  <div class="grid grid-cols-[100px_1fr] gap-3 mt-4 items-stretch">
    
    <!-- Empty Teacher Slot (Dashed, rounded, grounded) -->
    <div class="slot-dashed rounded-2xl p-2.5 flex flex-col items-center justify-center text-center">
      <!-- Graduation / Teacher icon -->
      <div class="w-10 h-10 rounded-full bg-[#0d2a2d] border border-[#2dd4bf]/40 flex items-center justify-center mb-1.5 text-[#2dd4bf]">
        <svg class="w-5 h-5 stroke-[2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
          <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </svg>
      </div>
      <div class="text-[11px] font-black text-[#2dd4bf] tracking-wider leading-tight">
        TEACHER<br>SLOT
      </div>
      <div class="text-[9px] font-bold text-[#7a9ea3] mt-1 leading-tight">
        Stands grounded
      </div>
    </div>

    <!-- Vietnamese Stimulus Speech Card -->
    <div class="tactile-card rounded-2xl p-3.5 flex flex-col justify-between relative">
      <!-- Speech arrow indicator touching teacher slot -->
      <div class="absolute -left-2 top-6 w-3 h-3 bg-[#102429] border-l-[1.5px] border-b-[1.5px] border-[#1e3d44] rotate-45"></div>

      <!-- Top Row: Language Tag & Speaker Audio Icon -->
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#183138] border border-[#28505a]">
          <span class="w-2 h-2 rounded-full bg-[#ef4444]"></span>
          <span class="text-xs font-bold text-[#e1f0f2]">Vietnamese</span>
        </div>

        <button class="w-8 h-8 rounded-full bg-[#133036] hover:bg-[#1a4048] border border-[#244c56] flex items-center justify-center text-[#2dd4bf] active:translate-y-0.5 transition-colors" aria-label="Play audio">
          <svg class="w-4 h-4 stroke-[2.2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
      </div>

      <!-- Vietnamese Sentence -->
      <blockquote class="text-[15px] font-bold text-[#f2fafb] leading-snug tracking-tight">
        “Đánh giá liên tục giúp giảm áp lực của một kỳ thi cuối kỳ duy nhất.”
      </blockquote>
    </div>
  </div>

  <!-- ================= TRANSLATION WORKSPACE (PLACED TILES) ================= -->
  <div class="mt-4 tactile-card rounded-2xl p-4 flex flex-col min-h-[175px]">
    <!-- Workspace Placed Words -->
    <div class="flex flex-wrap items-center gap-2 mb-3">
      <!-- Placed Tile 1 -->
      <div class="tactile-chip-active px-3.5 py-2 rounded-xl text-[15px] font-extrabold flex items-center cursor-pointer">
        Continuous
      </div>

      <!-- Placed Tile 2 -->
      <div class="tactile-chip-active px-3.5 py-2 rounded-xl text-[15px] font-extrabold flex items-center cursor-pointer">
        assessment
      </div>

      <!-- Placed Tile 3 -->
      <div class="tactile-chip-active px-3.5 py-2 rounded-xl text-[15px] font-extrabold flex items-center cursor-pointer">
        reduces
      </div>

      <!-- Blinking active placement cursor capsule -->
      <div class="w-2.5 h-8 rounded-full border-2 border-dashed border-[#2dd4bf] flex items-center justify-center animate-pulse"></div>
    </div>

    <!-- Target Placement Horizontal Separator & Helper -->
    <div class="mt-auto pt-3 border-t border-[#1d3a42]">
      <p class="text-xs font-semibold italic text-[#7a9ea3]">
        Tap words below to continue building...
      </p>
    </div>
  </div>

  <!-- ================= WORD BANK SECTION ================= -->
  <div class="mt-4">
    <div class="flex items-center justify-between mb-2.5 px-0.5">
      <span class="text-xs font-black tracking-wider uppercase text-[#a5c7cb]">WORD BANK</span>
      <span class="text-xs font-bold text-[#7a9ea3]">9 choices</span>
    </div>

    <!-- Word Bank Tiles Grid -->
    <div class="flex flex-wrap gap-2 justify-start items-center">
      
      <!-- Ghost Placedholder Slots for already selected words (Continuous, assessment, reduces) -->
      <div class="h-10 w-24 rounded-xl border border-dashed border-[#1f3a42] bg-[#0b181b]/50"></div>
      <div class="h-10 w-24 rounded-xl border border-dashed border-[#1f3a42] bg-[#0b181b]/50"></div>
      <div class="h-10 w-20 rounded-xl border border-dashed border-[#1f3a42] bg-[#0b181b]/50"></div>

      <!-- Available Word Tiles in Bank -->
      <button class="tactile-chip-bank px-4 py-2 rounded-xl text-[15px] font-bold tracking-tight hover:border-[#2dd4bf]/60 active:translate-y-0.5 transition-all">
        the
      </button>

      <button class="tactile-chip-bank px-4 py-2 rounded-xl text-[15px] font-bold tracking-tight hover:border-[#2dd4bf]/60 active:translate-y-0.5 transition-all">
        pressure
      </button>

      <button class="tactile-chip-bank px-3.5 py-2 rounded-xl text-[15px] font-bold tracking-tight hover:border-[#2dd4bf]/60 active:translate-y-0.5 transition-all">
        of
      </button>

      <button class="tactile-chip-bank px-3.5 py-2 rounded-xl text-[15px] font-bold tracking-tight hover:border-[#2dd4bf]/60 active:translate-y-0.5 transition-all">
        a
      </button>

      <button class="tactile-chip-bank px-4 py-2 rounded-xl text-[15px] font-bold tracking-tight hover:border-[#2dd4bf]/60 active:translate-y-0.5 transition-all">
        single
      </button>

      <button class="tactile-chip-bank px-4 py-2 rounded-xl text-[15px] font-bold tracking-tight hover:border-[#2dd4bf]/60 active:translate-y-0.5 transition-all">
        decreases
      </button>

      <button class="tactile-chip-bank px-4 py-2 rounded-xl text-[15px] font-bold tracking-tight hover:border-[#2dd4bf]/60 active:translate-y-0.5 transition-all">
        final
      </button>

      <button class="tactile-chip-bank px-4 py-2 rounded-xl text-[15px] font-bold tracking-tight hover:border-[#2dd4bf]/60 active:translate-y-0.5 transition-all">
        exam
      </button>

      <button class="tactile-chip-bank px-4 py-2 rounded-xl text-[15px] font-bold tracking-tight hover:border-[#2dd4bf]/60 active:translate-y-0.5 transition-all">
        test
      </button>
    </div>

    <!-- Hint Button Pill -->
    <div class="mt-3.5 flex items-center">
      <button class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#12252a] hover:bg-[#183238] border border-[#23454f] text-[#f59e0b] text-xs font-bold active:translate-y-0.5 transition-all">
        <svg class="w-3.5 h-3.5 fill-[#f59e0b]" viewBox="0 0 24 24">
          <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/>
        </svg>
        <span>Hint</span>
      </button>
    </div>
  </div>

  <!-- ================= DOCKED CHECK FOOTER BUTTON ================= -->
  <footer class="pt-5 pb-3 w-full">
    <button class="tactile-btn-orange w-full py-4 rounded-2xl flex items-center justify-center gap-2 text-lg font-black tracking-wide cursor-pointer" aria-label="Check answer">
      <span>CHECK</span>
      <!-- Check circle icon -->
      <svg class="w-6 h-6 stroke-[3] text-[#1c1003]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
    </button>
  </footer>

</body>
</html>
