<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite — My Deck (Empty State)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'cream-bg': '#FFF7EA',
            'cream-surface': '#FFF2DE',
            'card-bg': '#FFFFFF',
            'border-warm': '#EADEC8',
            'border-ledge': '#D8CFBC',
            'teal-primary': '#0D6964',
            'teal-brand': '#2BA39A',
            'teal-deep': '#1F7A75',
            'teal-ledge': '#12514D',
            'teal-light': '#E6F7F5',
            'coral-primary': '#F2553B',
            'amber-primary': '#FFB054',
            'cta-ledge': '#B53A22',
            'text-ink': '#0F3D3E',
            'text-muted': '#3A5C5E',
            'btn-ink': '#220D06',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFF7EA;
      color: #0F3D3E;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* 3D Tactile Buttons & Ledges */
    .tactile-btn-primary {
      background: linear-gradient(180deg, #FF9447 0%, #F2553B 100%);
      box-shadow: 0 5px 0 0 #B53A22, 0 8px 16px rgba(242, 85, 59, 0.25);
      transition: all 0.1s ease;
    }
    .tactile-btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #B53A22, 0 4px 8px rgba(242, 85, 59, 0.2);
    }

    .tactile-btn-secondary {
      background: #FFFFFF;
      box-shadow: 0 5px 0 0 #D8CFBC, 0 6px 14px rgba(15, 61, 62, 0.05);
      border: 2px solid #EADEC8;
      transition: all 0.1s ease;
    }
    .tactile-btn-secondary:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #D8CFBC, 0 2px 6px rgba(15, 61, 62, 0.05);
    }

    .tactile-card {
      background: #FFFFFF;
      border: 2px solid #EADEC8;
      box-shadow: 0 5px 0 0 #D8CFBC;
      border-radius: 20px;
    }

    .tactile-pill {
      background: #FFFFFF;
      border: 2px solid #EADEC8;
      box-shadow: 0 3px 0 0 #D8CFBC;
    }

    .tab-active {
      background: #E6F7F5;
      border: 2px solid #2BA39A;
      box-shadow: 0 3px 0 0 #1F7A75;
      color: #0D6964;
    }

    .dashed-slot {
      background: rgba(255, 255, 255, 0.6);
      border: 2px dashed #2BA39A;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-cream-bg select-none">

  <!-- ================= TOP HEADER (Fixed 56px standard Lexkite chrome) ================= -->
  <header class="w-full h-14 bg-cream-bg border-b border-border-warm flex items-center justify-between px-5 sticky top-0 z-30">
    <!-- Left: App Brand Kite Emblem + Name -->
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-card-bg border border-border-warm shadow-[0_2px_0_0_#D8CFBC] flex items-center justify-center p-1">
        <!-- Lexkite geometric origami kite icon -->
        <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none">
          <path d="M12 2L20 10L12 22L4 10L12 2Z" fill="#2BA39A" />
          <path d="M12 2L20 10L12 13L4 10L12 2Z" fill="#FFB054" opacity="0.9" />
          <path d="M12 13L20 10L12 22Z" fill="#1F7A75" />
          <path d="M12 13L4 10L12 22Z" fill="#0D6964" />
          <circle cx="12" cy="11" r="1.5" fill="#FFFFFF" />
        </svg>
      </div>
      <span class="text-xl font-extrabold tracking-tight text-text-ink">Lexkite</span>
    </div>

    <!-- Right: Streak Flame & XP Chips -->
    <div class="flex items-center gap-2">
      <!-- Flame Streak Pill -->
      <div class="flex items-center gap-1.5 px-3 py-1 rounded-full tactile-pill">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C9.5 6 6 8.5 6 13.5C6 17.5 8.7 21 12 21C15.3 21 18 17.5 18 13.5C18 10 16 7.5 14 5.5C13.5 7.5 12 9 10.5 9.5C11.5 7.5 12.2 4.5 12 2Z" fill="#F2553B"/>
          <path d="M12 12C10.5 13.5 9.5 15 9.5 16.5C9.5 18 10.6 19.5 12 19.5C13.4 19.5 14.5 18 14.5 16.5C14.5 15 13.5 13.8 12 12Z" fill="#FFB054"/>
        </svg>
        <span class="text-xs font-extrabold text-text-ink">14</span>
      </div>

      <!-- XP Bolt Pill -->
      <div class="flex items-center gap-1.5 px-3 py-1 rounded-full tactile-pill">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none">
          <path d="M13 2L4 14H11L9 22L20 10H13L15 2H13Z" fill="#FFB054" stroke="#D98A28" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span class="text-xs font-extrabold text-text-ink">820 XP</span>
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT (EMPTY STATE) ================= -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 py-4 max-w-md mx-auto w-full">

    <!-- Top Teacher Slot + Friendly Speech Bubble Container -->
    <div class="flex flex-col items-center w-full mb-3">
      
      <!-- Teacher Ama / Carlos 140x170 Empty Slot -->
      <div class="relative w-[140px] h-[170px] rounded-2xl dashed-slot flex flex-col items-center justify-center p-3 shadow-sm mb-3">
        <!-- Teacher Icon Placeholder Tag -->
        <div class="w-10 h-10 rounded-full bg-teal-light border border-teal-brand flex items-center justify-center mb-2">
          <svg class="w-5 h-5 text-teal-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <span class="text-[11px] font-extrabold tracking-wider uppercase text-teal-deep">TEACHER</span>
        <span class="text-[10px] font-semibold text-text-muted mt-0.5">140 × 170 Slot</span>
        
        <!-- Live Teacher Badge -->
        <div class="absolute -top-2.5 bg-teal-brand text-white text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full shadow-sm">
          Coach Ama
        </div>
      </div>

      <!-- Friendly Speech Bubble -->
      <div class="relative bg-white border-2 border-border-warm rounded-2xl px-4 py-2.5 shadow-[0_3px_0_0_#D8CFBC] text-center max-w-[310px]">
        <!-- Speech Bubble Triangle Tail Pointing Up -->
        <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-white border-t-2 border-l-2 border-border-warm rotate-45"></div>
        <p class="text-xs font-bold text-text-ink relative z-10 leading-snug">
          "Ready to build your personal lexicon? Collect words as you learn!"
        </p>
      </div>
    </div>

    <!-- Playful Tactile Illustration: Warm 3D Empty Card Box with Golden Sparkles -->
    <div class="relative my-2 flex items-center justify-center">
      <!-- Ambient decorative confetti / spark stars -->
      <div class="absolute -top-3 -right-4 w-7 h-7 text-amber-primary">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0L14.8 9.2L24 12L14.8 14.8L12 24L9.2 14.8L0 12L9.2 9.2L12 0Z"/>
        </svg>
      </div>
      <div class="absolute -bottom-1 -left-5 w-5 h-5 text-teal-brand opacity-90">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
        </svg>
      </div>
      <div class="absolute top-2 -left-6 w-3 h-3 rounded-full bg-coral-primary opacity-80"></div>
      <div class="absolute bottom-6 -right-6 w-3.5 h-3.5 rounded-full bg-amber-primary opacity-70"></div>

      <!-- Central Isometric Tactile Card Box Graphic -->
      <div class="w-32 h-32 flex items-center justify-center">
        <svg viewBox="0 0 140 140" class="w-full h-full filter drop-shadow-[0_10px_12px_rgba(216,207,188,0.5)]">
          <!-- Soft Shadow Base -->
          <ellipse cx="70" cy="116" rx="46" ry="12" fill="#EADEC8" />
          
          <!-- Box Back Wall (Inner Depth) -->
          <polygon points="35,62 70,44 105,62 70,80" fill="#E2F4F2" stroke="#2BA39A" stroke-width="2.5" stroke-linejoin="round"/>
          
          <!-- Blank Fresh Index Card in Box -->
          <g transform="translate(0, -6)">
            <path d="M48,56 L70,44 L92,56 L70,68 Z" fill="#FFFFFF" stroke="#EADEC8" stroke-width="2"/>
            <path d="M52,58 L68,49" stroke="#2BA39A" stroke-width="2" stroke-linecap="round"/>
            <path d="M56,62 L74,52" stroke="#FFB054" stroke-width="2" stroke-linecap="round"/>
          </g>

          <!-- Box Left Side Panel -->
          <polygon points="35,62 70,80 70,112 35,94" fill="#2BA39A" stroke="#1F7A75" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- Box Left Shadow Rim -->
          <polygon points="35,94 70,112 70,116 35,98" fill="#12514D" />

          <!-- Box Right Side Panel -->
          <polygon points="70,80 105,62 105,94 70,112" fill="#38BCB2" stroke="#1F7A75" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- Box Right Shadow Rim -->
          <polygon points="70,112 105,94 105,98 70,116" fill="#1F7A75" />

          <!-- Front Fold Flap / Card Tray Rim -->
          <path d="M35,62 L70,80 L105,62" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

          <!-- Golden Kite Badge on Front of Box -->
          <g transform="translate(62, 85)">
            <path d="M8,0 L16,8 L8,18 L0,8 Z" fill="#FFB054" stroke="#D98A28" stroke-width="1.5"/>
            <circle cx="8" cy="8" r="2" fill="#FFFFFF"/>
          </g>

          <!-- Shiny Sparkle Rising from Box -->
          <g transform="translate(68, 22)">
            <path d="M12,2 L15,10 L23,13 L15,16 L12,24 L9,16 L1,13 L9,10 Z" fill="#FFC94A" stroke="#E5A610" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="12" cy="13" r="2.5" fill="#FFFFFF"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- Title & Single Explanatory Line -->
    <div class="text-center my-3 max-w-xs">
      <h1 class="text-2xl font-extrabold tracking-tight text-text-ink mb-1">
        Your deck is empty
      </h1>
      <p class="text-sm font-semibold text-text-muted leading-snug">
        Save high-scoring exam words to review with smart spaced repetition.
      </p>
    </div>

    <!-- Two Tactile Action Buttons -->
    <div class="w-full flex flex-col gap-3.5 mt-2">
      <!-- Primary CTA: 'Look up a word' (Vibrant Coral/Orange Gradient with 5px #B53A22 Ledge and Deep Brown-Black Text) -->
      <button class="tactile-btn-primary w-full h-14 rounded-2xl flex items-center justify-center gap-2.5 px-6 cursor-pointer">
        <svg class="w-5 h-5 text-btn-ink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <span class="text-base font-extrabold text-btn-ink tracking-wide">
          Look up a word
        </span>
      </button>

      <!-- Secondary CTA: 'Browse word sets' (Card Surface with Warm 2px Border and 5px #D8CFBC Ledge) -->
      <button class="tactile-btn-secondary w-full h-14 rounded-2xl flex items-center justify-center gap-2.5 px-6 cursor-pointer">
        <svg class="w-5 h-5 text-teal-deep" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span class="text-base font-extrabold text-text-ink tracking-wide">
          Browse word sets
        </span>
      </button>
    </div>

  </main>

  <!-- ================= FIXED BOTTOM TAB NAVIGATION BAR (Lexkite 5-Tab Chrome) ================= -->
  <footer class="w-full bg-white border-t border-border-warm py-2 px-3 sticky bottom-0 z-30 shadow-[0_-4px_12px_rgba(15,61,62,0.03)]">
    <nav class="max-w-md mx-auto grid grid-cols-5 gap-1.5 items-center">
      
      <!-- Tab 1: Learn (Route) -->
      <button class="flex flex-col items-center justify-center py-1.5 rounded-xl hover:bg-cream-surface transition-colors">
        <svg class="w-6 h-6 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
        </svg>
        <span class="text-[11px] font-bold text-text-muted mt-0.5">Learn</span>
      </button>

      <!-- Tab 2: Review (Layers / Decks - ACTIVE TAB) -->
      <button class="flex flex-col items-center justify-center py-1.5 rounded-xl tab-active cursor-pointer">
        <svg class="w-6 h-6 text-teal-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span class="text-[11px] font-extrabold text-teal-primary mt-0.5">Review</span>
      </button>

      <!-- Tab 3: Practice (Bolt) -->
      <button class="flex flex-col items-center justify-center py-1.5 rounded-xl hover:bg-cream-surface transition-colors">
        <svg class="w-6 h-6 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span class="text-[11px] font-bold text-text-muted mt-0.5">Practice</span>
      </button>

      <!-- Tab 4: Leagues (Trophy) -->
      <button class="flex flex-col items-center justify-center py-1.5 rounded-xl hover:bg-cream-surface transition-colors">
        <svg class="w-6 h-6 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        <span class="text-[11px] font-bold text-text-muted mt-0.5">Leagues</span>
      </button>

      <!-- Tab 5: Me (Person) -->
      <button class="flex flex-col items-center justify-center py-1.5 rounded-xl hover:bg-cream-surface transition-colors">
        <svg class="w-6 h-6 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="text-[11px] font-bold text-text-muted mt-0.5">Me</span>
      </button>

    </nav>
  </footer>

</body>
</html>
