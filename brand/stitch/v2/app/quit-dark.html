<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite — Quit Lesson Confirm (Tactile Night)</title>
<!-- Typography & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Configuration -->
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-secondary-fixed-variant": "#900f00",
            "error": "#ffb4ab",
            "surface-bright": "#2f3b3e",
            "on-error": "#690005",
            "secondary-fixed-dim": "#ffb4a6",
            "primary-fixed-dim": "#6bd8ce",
            "on-background": "#d8e5e9",
            "on-secondary-fixed": "#3f0300",
            "on-secondary": "#660800",
            "tertiary-fixed-dim": "#f4bf40",
            "outline-variant": "#3d4947",
            "on-tertiary": "#402e00",
            "surface": "#091518",
            "secondary-fixed": "#ffdad3",
            "background": "#091518",
            "on-error-container": "#ffdad6",
            "on-tertiary-fixed": "#261a00",
            "surface-container-lowest": "#051013",
            "surface-container": "#162125",
            "on-primary-fixed": "#00201e",
            "tertiary-container": "#ba8b00",
            "secondary-container": "#981201",
            "on-primary-fixed-variant": "#00504b",
            "secondary": "#ffb4a6",
            "error-container": "#93000a",
            "primary": "#6bd8ce",
            "tertiary-fixed": "#ffdf9e",
            "surface-dim": "#091518",
            "surface-container-low": "#121d20",
            "on-tertiary-container": "#392900",
            "on-secondary-container": "#ffa493",
            "surface-container-high": "#202c2f",
            "outline": "#879391",
            "on-primary-container": "#00322e",
            "surface-tint": "#6bd8ce",
            "inverse-surface": "#d8e5e9",
            "inverse-on-surface": "#263236",
            "primary-container": "#2ba39a",
            "surface-variant": "#2b373a",
            "surface-container-highest": "#2b373a",
            "on-tertiary-fixed-variant": "#5b4300",
            "inverse-primary": "#006a64",
            "on-surface": "#d8e5e9",
            "on-surface-variant": "#bcc9c7",
            "on-primary": "#003733",
            "primary-fixed": "#88f5ea",
            "tertiary": "#f4bf40"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "space-xl": "32px",
            "space-md": "16px",
            "space-lg": "24px",
            "space-xs": "4px",
            "margin": "16px",
            "gutter": "16px",
            "space-sm": "8px"
          },
          "fontFamily": {
            "display": [
              "Plus Jakarta Sans"
            ],
            "title": [
              "Plus Jakarta Sans"
            ],
            "label": [
              "Plus Jakarta Sans"
            ],
            "body": [
              "Plus Jakarta Sans"
            ]
          },
          "fontSize": {
            "display": [
              "32px",
              {
                "lineHeight": "38px",
                "fontWeight": "800"
              }
            ],
            "title": [
              "22px",
              {
                "lineHeight": "28px",
                "fontWeight": "700"
              }
            ],
            "label": [
              "12px",
              {
                "lineHeight": "16px",
                "letterSpacing": "0.06em",
                "fontWeight": "800"
              }
            ],
            "body": [
              "16px",
              {
                "lineHeight": "24px",
                "fontWeight": "500"
              }
            ]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined[data-weight="fill"] {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }
    
    /* Tactile 3D Button Physics */
    .tactile-btn-primary {
      box-shadow: 0 5px 0 #B53A22;
      transition: all 0.08s ease-in-out;
    }
    .tactile-btn-primary:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #B53A22;
    }
    
    .tactile-dialog {
      box-shadow: 0 8px 0 #071113;
    }

    /* Ambient Subtle Grid Pattern */
    .bg-tactile-grid {
      background-size: 28px 28px;
      background-image: 
        radial-gradient(circle, rgba(43, 163, 154, 0.08) 1.2px, transparent 1.2px);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen relative overflow-hidden select-none antialiased">
<!-- ======================================================== -->
<!-- BACKGROUND LAYER: IN-PROGRESS LESSON CANVAS (BLURRED)   -->
<!-- ======================================================== -->
<div class="fixed inset-0 w-full h-full flex flex-col justify-between p-space-md pointer-events-none opacity-40 blur-[5px] scale-[0.99] transition-all duration-300">
<!-- Lesson Header -->
<header class="w-full max-w-2xl mx-auto flex items-center justify-between gap-space-md pt-space-xs">
<button class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex-1 bg-surface-container-high h-3.5 rounded-full overflow-hidden p-0.5 border border-outline-variant/30">
<div class="bg-primary h-full rounded-full w-[65%]"></div>
</div>
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-surface-container border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary" data-weight="fill">favorite</span>
<span class="font-display font-extrabold text-xs text-on-surface">5</span>
</div>
</header>
<!-- Lesson Question Area -->
<main class="w-full max-w-xl mx-auto flex flex-col items-center justify-center gap-space-lg flex-1 py-space-md">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-2xl bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl">volume_up</span>
</div>
<div class="p-4 rounded-2xl bg-surface-container-high border-2 border-surface-container-highest">
<p class="font-title text-title text-on-surface">¿Cómo se dice "good morning"?</p>
</div>
</div>
<!-- Multiple Choice Options -->
<div class="w-full grid grid-cols-1 gap-space-sm max-w-md">
<div class="p-4 rounded-2xl bg-surface-container border-2 border-surface-container-highest flex items-center justify-between">
<span class="font-body font-bold text-on-surface">Buenas noches</span>
<span class="w-6 h-6 rounded-lg bg-surface-container-highest text-xs font-bold flex items-center justify-center text-on-surface-variant">A</span>
</div>
<div class="p-4 rounded-2xl bg-primary/10 border-2 border-primary-container flex items-center justify-between">
<span class="font-body font-bold text-primary">Buenos días</span>
<span class="w-6 h-6 rounded-lg bg-primary-container text-on-primary text-xs font-bold flex items-center justify-center">B</span>
</div>
<div class="p-4 rounded-2xl bg-surface-container border-2 border-surface-container-highest flex items-center justify-between">
<span class="font-body font-bold text-on-surface">Hola amigo</span>
<span class="w-6 h-6 rounded-lg bg-surface-container-highest text-xs font-bold flex items-center justify-center text-on-surface-variant">C</span>
</div>
</div>
</main>
<!-- Lesson Bottom Action Bar -->
<footer class="w-full max-w-2xl mx-auto py-space-sm border-t-2 border-surface-container-high flex justify-end">
<div class="px-8 py-3.5 rounded-2xl bg-primary-container text-on-primary-container font-label text-label tracking-wide">
        CONTINUE
      </div>
</footer>
</div>
<!-- ======================================================== -->
<!-- MODAL BACKDROP OVERLAY                                   -->
<!-- Rich dark teal-black atmosphere with backdrop blur       -->
<!-- ======================================================== -->
<div class="fixed inset-0 z-40 bg-[#041013]/80 backdrop-blur-md bg-tactile-grid flex items-center justify-center p-space-md">
<!-- Soft Ambient Dark Teal Radial Glow -->
<div class="absolute w-[500px] h-[500px] bg-primary/10 rounded-full blur-[110px] pointer-events-none -translate-y-4"></div>
<!-- ======================================================== -->
<!-- DIALOG CARD: QUIT LESSON CONFIRMATION                     -->
<!-- Desktop width: max-w-md (approx 430px)                   -->
<!-- ======================================================== -->
<div aria-labelledby="dialog-title" aria-modal="true" class="tactile-dialog relative w-full max-w-md bg-[#111E22] border-2 border-[#284149] rounded-3xl p-6 sm:p-7 flex flex-col items-center text-center z-50 transition-transform duration-150 animate-in fade-in zoom-in-95" role="dialog">
<!-- Glossy Specular Top Shine Line -->
<div class="absolute top-0 inset-x-8 h-[2px] bg-gradient-to-r from-transparent via-[#6bd8ce]/30 to-transparent"></div>
<!-- Top Pull Bar Indicator -->
<div class="w-10 h-1 bg-[#284149] rounded-full mb-5"></div>
<!-- EMPTY DASHED TEACHER SLOT -->
<!-- Explicitly kept empty of avatars/human figures as mandated -->
<div class="relative w-[140px] h-[154px] rounded-2xl border-2 border-dashed border-[#2BA39A]/60 bg-[#0D1A1D] flex flex-col items-center justify-center p-3 mb-5 overflow-hidden group">
<!-- Slot Tag Pill -->
<div class="absolute top-2.5 px-2 py-0.5 rounded-full bg-[#183338] border border-[#2BA39A]/40 flex items-center gap-1.5 shadow-sm">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary animate-pulse"></span>
<span class="font-label text-[9px] text-[#A9BFC1] tracking-wider uppercase">TEACHER SLOT</span>
</div>
<!-- Empty State Visual Cue -->
<div class="w-12 h-12 rounded-2xl bg-[#183338] border border-[#284149] flex items-center justify-center mb-2 mt-4 text-[#2BA39A]">
<span class="material-symbols-outlined text-2xl">school</span>
</div>
<!-- Slot Specifications & Placeholder Label -->
<span class="font-label text-[11px] font-bold text-on-surface tracking-wide">140 × 170 Slot</span>
<span class="font-body text-[10px] text-[#A9BFC1]/80 mt-0.5">Teacher Carlos / Ama</span>
</div>
<!-- Headline -->
<h2 class="font-display text-[26px] leading-[30px] font-extrabold text-[#EEF6F7] tracking-tight mb-2" id="dialog-title">
        Wait, don't go!
      </h2>
<!-- Subtitle (Clear, readable, ≥4.5:1 contrast) -->
<p class="font-body text-[15px] leading-5 text-[#A9BFC1] font-medium mb-6 max-w-xs">
        You'll lose this lesson's progress
      </p>
<!-- Primary & Secondary Action Stack -->
<div class="w-full flex flex-col gap-3">
<!-- Primary Action Button: KEEP LEARNING -->
<button class="tactile-btn-primary w-full h-[52px] rounded-2xl bg-gradient-to-r from-[#F2553B] to-[#FF8C38] flex items-center justify-center gap-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#FF8C38] focus:ring-offset-[#111E22]" type="button">
<span class="font-display text-[#150502] font-black text-[15px] tracking-wider uppercase">
            KEEP LEARNING
          </span>
<span class="material-symbols-outlined text-[#150502] text-lg font-bold" data-weight="fill">play_arrow</span>
</button>
<!-- Secondary Action Button: END LESSON -->
<button class="w-full h-11 rounded-2xl bg-transparent hover:bg-surface-container flex items-center justify-center transition-colors cursor-pointer group" type="button">
<span class="font-label text-sm font-bold text-[#F2553B] group-hover:text-[#FF8C38] tracking-widest uppercase transition-colors">
            END LESSON
          </span>
</button>
</div>
<!-- Streak Reassurance Footer Note -->
<div class="mt-4 pt-4 border-t border-[#284149]/50 w-full flex items-center justify-center gap-2 text-center">
<span class="material-symbols-outlined text-[#2BA39A] text-lg" data-weight="fill">bolt</span>
<span class="font-body text-[13px] font-medium text-[#A9BFC1]">
          14-day streak saved until midnight
        </span>
</div>
</div>
</div>
</body></html>
