<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lexkite Learn Path Skeleton (Bright Day)</title>
<!-- Tailwind CSS v3 -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#fff8f5',
              teal: '#116e68',
              'teal-light': '#d4e8e5',
              'teal-border': '#116e68',
              'bone-100': '#f8f1eb',
              'bone-200': '#ede2d8',
              'bone-300': '#e2d4c7',
              'bone-400': '#d5c4b5'
            }
          }
        }
      }
    };
  </script>
<style data-purpose="skeleton-animations">
    @keyframes shimmer {
      0% {
        opacity: 0.55;
      }
      50% {
        opacity: 0.9;
      }
      100% {
        opacity: 0.55;
      }
    }
    .skeleton-pulse {
      animation: shimmer 1.8s ease-in-out infinite;
    }
  </style>
<style data-purpose="custom-styling">
    body {
      background-color: #fff8f5;
      color: #2b2b2b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      width: 390px;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Tactile 3D shadows matching Lexkite design */
    .tactile-card {
      background-color: #ffffff;
      border: 1.5px solid #eedfd4;
      border-bottom-width: 4px;
      border-radius: 18px;
    }

    .node-disc {
      position: absolute;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #ded1c4;
      transition: transform 0.1s ease;
    }

    .node-disc-active {
      border: 3.5px solid #116e68;
      box-shadow: 0 4px 0 #0b4e4a;
      background: #ffffff;
    }

    .node-disc-inactive {
      border: 3px solid #ede3d8;
      background: #ffffff;
      box-shadow: 0 4px 0 #dbcbbe;
    }

    .milestone-squircle {
      border-radius: 20px;
      border: 3px solid #eee4da;
      box-shadow: 0 5px 0 #dccebf;
      background: #ffffff;
    }
  </style>
</head>
<body class="flex flex-col bg-[#fff8f5] w-[390px] mx-auto min-h-screen relative pb-[70px] select-none">
<!-- BEGIN: TopBar -->
<header class="sticky top-0 z-40 w-full h-[56px] bg-[#fff8f5] flex items-center justify-between px-4 shadow-[0_4px_0_0_#efe0d6]">
<!-- Brand Left -->
<div class="flex items-center gap-1">
<div class="w-8 h-8 rounded-2xl bg-[#00504b] flex items-center justify-center text-[#a4f1e7] shadow-[0_2px_0_0_#00201d]">
<span class="material-symbols-outlined text-[20px]" data-icon="kitesurfing">kitesurfing</span>
</div>
<span class="text-[20px] leading-7 font-['Plus_Jakarta_Sans'] font-extrabold text-[#136a63] tracking-tight">Lexkite</span>
</div>
<!-- Hub Status Indicators Right -->
<div class="flex items-center gap-1">
<!-- Exam Badge -->
<span class="text-[12px] leading-4 tracking-[0.04em] font-['Plus_Jakarta_Sans'] bg-[#a4f1e7] text-[#00201d] px-2 py-0.5 rounded-full border border-[#00504b]/20">
          IELTS
        </span>
<!-- Flame Streak Pill -->
<div class="flex items-center gap-1 bg-[#f4e5db] px-2 py-0.5 rounded-full border-2 border-[#efe0d6] shadow-[0_2px_0_0_#efe0d6]">
<span class="material-symbols-outlined text-[#fd9500] text-[16px]" data-icon="local_fire_department" data-weight="fill" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="text-[12px] leading-4 tracking-[0.04em] font-['Plus_Jakarta_Sans'] text-[#211a14] font-extrabold">14</span>
</div>
<!-- Star XP Pill -->
<div class="flex items-center gap-1 bg-[#ffdf9b] px-2 py-0.5 rounded-full border-2 border-[#f5bf31]/70 shadow-[0_2px_0_0_#d49b10]">
<span class="material-symbols-outlined text-[#5b4300] text-[16px]" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-[12px] leading-4 tracking-[0.04em] font-['Plus_Jakarta_Sans'] text-[#251a00] font-extrabold">820</span>
</div>
<!-- Round Avatar -->
<div class="w-7 h-7 rounded-full bg-[#136a63] text-white flex items-center justify-center font-bold text-[12px] leading-4 tracking-[0.04em] border-2 border-white shadow-[0_2px_0_0_#efe0d6]">
          L
        </div>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-4 pt-3.5 flex flex-col" data-purpose="learn-path-content">
<!-- BEGIN: HeaderSkeletonCard -->
<!-- Unit Header Skeleton Card -->
<div class="tactile-card p-4 mb-4 skeleton-pulse" data-purpose="unit-skeleton-card">
<div class="flex items-center justify-between mb-3">
<!-- Badge skeleton -->
<div class="h-4 w-24 bg-[#ede2d8] rounded-full"></div>
<!-- Right side icon placeholder -->
<div class="h-4 w-14 bg-[#ede2d8] rounded-full"></div>
</div>
<!-- Title skeleton -->
<div class="h-5 w-5/6 bg-[#ede2d8] rounded-full mb-2.5"></div>
<!-- Subtitle skeleton -->
<div class="h-3.5 w-1/2 bg-[#ede2d8] rounded-full mb-4"></div>
<!-- Progress Bar Skeleton -->
<div class="w-full h-3 bg-[#ede2d8] rounded-full overflow-hidden flex">
<div class="h-full w-2/5 bg-[#93bcb8] rounded-full"></div>
</div>
</div>
<!-- END: HeaderSkeletonCard -->
<!-- Section Title Skeletons -->
<div class="flex justify-between items-center mb-6 px-1 skeleton-pulse" data-purpose="section-subtitle-skeleton">
<div class="h-4 w-28 bg-[#ede2d8] rounded-full"></div>
<div class="h-4 w-12 bg-[#ede2d8] rounded-full"></div>
</div>
<!-- BEGIN: SteppingStonePath -->
<!-- Path Visualization Area -->
<div class="relative w-full h-[520px]" data-purpose="stepping-stone-map">
<!-- SVG Connecting Trails -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" fill="none" viewbox="0 0 358 520">
<!-- Trail 1: Top active node to second node (solid/smooth active segment) -->
<path d="M 179 40 C 170 70, 140 75, 126 110" stroke="#93bcb8" stroke-linecap="round" stroke-width="8"></path>
<!-- Trail 2: Node 2 to Node 3 (dotted/dashed soft trail) -->
<path d="M 126 125 C 160 135, 230 160, 236 215" stroke="#eedfd3" stroke-dasharray="2 12" stroke-linecap="round" stroke-width="8"></path>
<!-- Trail 3: Node 3 to Node 4 -->
<path d="M 236 230 C 230 290, 150 280, 146 325" stroke="#eedfd3" stroke-dasharray="2 12" stroke-linecap="round" stroke-width="8"></path>
<!-- Trail 4: Node 4 to Node 5 (bottom milestone) -->
<path d="M 146 340 C 146 390, 175 400, 179 430" stroke="#eedfd3" stroke-dasharray="2 12" stroke-linecap="round" stroke-width="8"></path>
</svg>
<!-- Node 1: Active Top Disc (X: 179, Y: 40) -->
<div class="absolute left-1/2 -translate-x-1/2 top-4 flex flex-col items-center z-10" data-purpose="node-item-1">
<div class="node-disc node-disc-active w-16 h-16 relative">
<!-- Concentric Inner Circle -->
<div class="w-8 h-8 rounded-full bg-[#e3eae9] flex items-center justify-center">
<div class="w-3.5 h-3.5 rounded-full bg-[#116e68]"></div>
</div>
</div>
</div>
<!-- Node 2: Left Middle Disc (X: 126, Y: 110) -->
<div class="absolute left-[94px] top-[110px] flex flex-col items-center z-10" data-purpose="node-item-2">
<div class="node-disc node-disc-inactive w-14 h-14 relative skeleton-pulse">
<div class="w-7 h-7 rounded-full bg-[#f2e9df] flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-[#e0d3c4]"></div>
</div>
</div>
<!-- Shadow shelf under node -->
<div class="w-10 h-1.5 bg-[#ebdacf] rounded-full mt-1.5 opacity-80"></div>
</div>
<!-- Node 3: Right Middle Disc (X: 236, Y: 215) -->
<div class="absolute right-[90px] top-[215px] flex flex-col items-center z-10" data-purpose="node-item-3">
<div class="node-disc node-disc-inactive w-14 h-14 relative skeleton-pulse">
<div class="w-7 h-7 rounded-full bg-[#f2e9df] flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-[#e0d3c4]"></div>
</div>
</div>
<!-- Shadow shelf under node -->
<div class="w-10 h-1.5 bg-[#ebdacf] rounded-full mt-1.5 opacity-80"></div>
</div>
<!-- Node 4: Left-Center Disc (X: 146, Y: 325) -->
<div class="absolute left-[118px] top-[325px] flex flex-col items-center z-10" data-purpose="node-item-4">
<div class="node-disc node-disc-inactive w-14 h-14 relative skeleton-pulse">
<div class="w-7 h-7 rounded-full bg-[#f2e9df] flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-[#e0d3c4]"></div>
</div>
</div>
<!-- Shadow shelf under node -->
<div class="w-10 h-1.5 bg-[#ebdacf] rounded-full mt-1.5 opacity-80"></div>
</div>
<!-- Node 5: Milestone Squircle (Bottom Center) -->
<div class="absolute left-1/2 -translate-x-1/2 top-[430px] flex flex-col items-center z-10" data-purpose="milestone-node">
<div class="milestone-squircle w-[68px] h-[64px] flex items-center justify-center relative skeleton-pulse">
<div class="w-9 h-9 rounded-xl bg-[#f2e9df] flex items-center justify-center">
<div class="w-4 h-4 rounded-md bg-[#ded0c1]"></div>
</div>
</div>
<!-- Ledge shadow -->
<div class="w-12 h-2 bg-[#eadacf] rounded-full mt-2 opacity-80"></div>
</div>
</div>
<!-- END: SteppingStonePath -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomTabBar -->
<!-- Lexkite Canonical 64px Mobile Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 w-full max-w-md mx-auto h-16 bg-white border-t-2 border-[#e6d7cd] z-50 flex items-center justify-around">
<!-- Tab 1: Today (Active) -->
<button class="flex-1 flex flex-col items-center justify-center gap-0.5 active:translate-y-0.5 transition-transform">
<div class="w-14 h-8 rounded-full bg-[#d0f0eb] text-[#136a63] flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<span class="font-bold text-xs text-[#136a63] leading-tight">Today</span>
</button>
<!-- Tab 2: Vocab (Inactive with red badge) -->
<button class="flex-1 flex flex-col items-center justify-center gap-0.5 active:translate-y-0.5 transition-transform text-[#2d3132]">
<div class="relative flex items-center justify-center h-8">
<span class="material-symbols-outlined text-[22px] text-[#2d3132]" data-icon="menu_book">menu_book</span>
<span class="absolute top-1 -right-1 w-2 h-2 rounded-full bg-[#ba1a1a] border-2 border-white ring-1 ring-[#ba1a1a]/50"></span>
</div>
<span class="font-medium text-xs text-[#2d3132] leading-tight">Vocab</span>
</button>
<!-- Tab 3: Skills (Inactive) -->
<button class="flex-1 flex flex-col items-center justify-center gap-0.5 active:translate-y-0.5 transition-transform text-[#2d3132]">
<div class="flex items-center justify-center h-8">
<span class="material-symbols-outlined text-[22px] text-[#2d3132]" data-icon="track_changes">track_changes</span>
</div>
<span class="font-medium text-xs text-[#2d3132] leading-tight">Skills</span>
</button>
<!-- Tab 4: Tests (Inactive) -->
<button class="flex-1 flex flex-col items-center justify-center gap-0.5 active:translate-y-0.5 transition-transform text-[#2d3132]">
<div class="flex items-center justify-center h-8">
<span class="material-symbols-outlined text-[22px] text-[#2d3132]" data-icon="flag">flag</span>
</div>
<span class="font-medium text-xs text-[#2d3132] leading-tight">Tests</span>
</button>
<!-- Tab 5: Me (Inactive) -->
<button class="flex-1 flex flex-col items-center justify-center gap-0.5 active:translate-y-0.5 transition-transform text-[#2d3132]">
<div class="flex items-center justify-center h-8">
<span class="material-symbols-outlined text-[22px] text-[#2d3132]" data-icon="person">person</span>
</div>
<span class="font-medium text-xs text-[#2d3132] leading-tight">Me</span>
</button>
</nav>
<!-- END: BottomTabBar -->
</body></html>
