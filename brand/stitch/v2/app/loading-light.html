<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lexkite Learn Path Skeleton (Bright Day)</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#fff8f5',
              teal: '#116e68',
              'teal-light': '#d4e8e5',
              'teal-border': '#116e68',
              'bone-100': '#f8f1eb',
              'bone-200': '#ede2d8',
              'bone-300': '#e2d4c7',
              'bone-400': '#d5c4b5'
            }
          }
        }
      }
    };
  </script>
<style data-purpose="skeleton-animations">
    @keyframes shimmer {
      0% {
        opacity: 0.55;
      }
      50% {
        opacity: 0.9;
      }
      100% {
        opacity: 0.55;
      }
    }
    .skeleton-pulse {
      animation: shimmer 1.8s ease-in-out infinite;
    }
  </style>
<style data-purpose="custom-styling">
    body {
      background-color: #fff8f5;
      color: #2b2b2b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      width: 390px;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Tactile 3D shadows matching Lexkite design */
    .tactile-card {
      background-color: #ffffff;
      border: 1.5px solid #eedfd4;
      border-bottom-width: 4px;
      border-radius: 18px;
    }

    .node-disc {
      position: absolute;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #ded1c4;
      transition: transform 0.1s ease;
    }

    .node-disc-active {
      border: 3.5px solid #116e68;
      box-shadow: 0 4px 0 #0b4e4a;
      background: #ffffff;
    }

    .node-disc-inactive {
      border: 3px solid #ede3d8;
      background: #ffffff;
      box-shadow: 0 4px 0 #dbcbbe;
    }

    .milestone-squircle {
      border-radius: 20px;
      border: 3px solid #eee4da;
      box-shadow: 0 5px 0 #dccebf;
      background: #ffffff;
    }
  </style>
</head>
<body class="flex flex-col bg-[#fff8f5] w-[390px] mx-auto min-h-screen relative pb-[70px] select-none">
<!-- BEGIN: TopBar -->
<header class="sticky top-0 z-50 bg-[#fff8f5] border-b border-[#f0e3d8] h-[56px] px-3.5 flex items-center justify-between" data-purpose="top-navigation-bar">
<!-- Brand Logo -->
<div class="flex items-center space-x-1.5" data-purpose="brand-identity">
<!-- Kite Logo Icon -->
<div class="w-8 h-8 rounded-full bg-[#116e68] flex items-center justify-center text-white shadow-sm">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2L4 12l8 10 8-10L12 2zm0 3.5L17.5 12 12 18.5 6.5 12 12 5.5z"></path>
</svg>
</div>
<span class="text-[19px] font-bold tracking-tight text-[#116e68]">Lexkite</span>
</div>
<!-- Right Badges & Profile -->
<div class="flex items-center space-x-1.5" data-purpose="user-status-badges">
<!-- Course Chip -->
<div class="px-2 py-0.5 rounded-full border border-[#b2d9d4] bg-[#eef7f6] text-[11px] font-bold text-[#116e68]">
        IELTS
      </div>
<!-- Streak Badge -->
<div class="flex items-center space-x-0.5 px-2 py-0.5 rounded-full border border-[#fed7aa] bg-[#fffaf5] text-[12px] font-bold text-[#ea580c]">
<svg class="w-3.5 h-3.5 fill-[#ea580c]" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.527.82-1.12 2.07-1.12 3.447 0 .285.03.56.084.823a3.526 3.526 0 00-1.89-1.229 1 1 0 00-1.23 1.157c.15 1.05.655 2.217 1.433 3.195C8.03 11.233 7 12.637 7 14.5 7 17.538 9.462 20 12.5 20s5.5-2.462 5.5-5.5c0-3.328-2.617-6.524-4.805-9.447a15.82 15.82 0 00-.8-2.5zM12.5 18a3.5 3.5 0 01-3.5-3.5c0-1.077.562-2.127 1.258-2.998.423-.529.932-1.04 1.428-1.571.498.53 1.006 1.042 1.429 1.571.696.871 1.258 1.921 1.258 2.998 0 1.933-1.567 3.5-3.5 3.5z" fill-rule="evenodd"></path>
</svg>
<span>14</span>
</div>
<!-- XP Badge -->
<div class="flex items-center space-x-0.5 px-2 py-0.5 rounded-full border border-[#fef08a] bg-[#fffdf0] text-[12px] font-bold text-[#ca8a04]">
<svg class="w-3.5 h-3.5 fill-[#eab308]" viewbox="0 0 20 20">
<path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
</svg>
<span>820</span>
</div>
<!-- User Avatar -->
<div class="w-7 h-7 rounded-full bg-[#116e68] text-white flex items-center justify-center font-bold text-xs">
        L
      </div>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-4 pt-3.5 flex flex-col" data-purpose="learn-path-content">
<!-- BEGIN: HeaderSkeletonCard -->
<!-- Unit Header Skeleton Card -->
<div class="tactile-card p-4 mb-4 skeleton-pulse" data-purpose="unit-skeleton-card">
<div class="flex items-center justify-between mb-3">
<!-- Badge skeleton -->
<div class="h-4 w-24 bg-[#ede2d8] rounded-full"></div>
<!-- Right side icon placeholder -->
<div class="h-4 w-14 bg-[#ede2d8] rounded-full"></div>
</div>
<!-- Title skeleton -->
<div class="h-5 w-5/6 bg-[#ede2d8] rounded-full mb-2.5"></div>
<!-- Subtitle skeleton -->
<div class="h-3.5 w-1/2 bg-[#ede2d8] rounded-full mb-4"></div>
<!-- Progress Bar Skeleton -->
<div class="w-full h-3 bg-[#ede2d8] rounded-full overflow-hidden flex">
<div class="h-full w-2/5 bg-[#93bcb8] rounded-full"></div>
</div>
</div>
<!-- END: HeaderSkeletonCard -->
<!-- Section Title Skeletons -->
<div class="flex justify-between items-center mb-6 px-1 skeleton-pulse" data-purpose="section-subtitle-skeleton">
<div class="h-4 w-28 bg-[#ede2d8] rounded-full"></div>
<div class="h-4 w-12 bg-[#ede2d8] rounded-full"></div>
</div>
<!-- BEGIN: SteppingStonePath -->
<!-- Path Visualization Area -->
<div class="relative w-full h-[520px]" data-purpose="stepping-stone-map">
<!-- SVG Connecting Trails -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" fill="none" viewbox="0 0 358 520">
<!-- Trail 1: Top active node to second node (solid/smooth active segment) -->
<path d="M 179 40 C 170 70, 140 75, 126 110" stroke="#93bcb8" stroke-linecap="round" stroke-width="8"></path>
<!-- Trail 2: Node 2 to Node 3 (dotted/dashed soft trail) -->
<path d="M 126 125 C 160 135, 230 160, 236 215" stroke="#eedfd3" stroke-dasharray="2 12" stroke-linecap="round" stroke-width="8"></path>
<!-- Trail 3: Node 3 to Node 4 -->
<path d="M 236 230 C 230 290, 150 280, 146 325" stroke="#eedfd3" stroke-dasharray="2 12" stroke-linecap="round" stroke-width="8"></path>
<!-- Trail 4: Node 4 to Node 5 (bottom milestone) -->
<path d="M 146 340 C 146 390, 175 400, 179 430" stroke="#eedfd3" stroke-dasharray="2 12" stroke-linecap="round" stroke-width="8"></path>
</svg>
<!-- Node 1: Active Top Disc (X: 179, Y: 40) -->
<div class="absolute left-1/2 -translate-x-1/2 top-4 flex flex-col items-center z-10" data-purpose="node-item-1">
<div class="node-disc node-disc-active w-16 h-16 relative">
<!-- Concentric Inner Circle -->
<div class="w-8 h-8 rounded-full bg-[#e3eae9] flex items-center justify-center">
<div class="w-3.5 h-3.5 rounded-full bg-[#116e68]"></div>
</div>
</div>
</div>
<!-- Node 2: Left Middle Disc (X: 126, Y: 110) -->
<div class="absolute left-[94px] top-[110px] flex flex-col items-center z-10" data-purpose="node-item-2">
<div class="node-disc node-disc-inactive w-14 h-14 relative skeleton-pulse">
<div class="w-7 h-7 rounded-full bg-[#f2e9df] flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-[#e0d3c4]"></div>
</div>
</div>
<!-- Shadow shelf under node -->
<div class="w-10 h-1.5 bg-[#ebdacf] rounded-full mt-1.5 opacity-80"></div>
</div>
<!-- Node 3: Right Middle Disc (X: 236, Y: 215) -->
<div class="absolute right-[90px] top-[215px] flex flex-col items-center z-10" data-purpose="node-item-3">
<div class="node-disc node-disc-inactive w-14 h-14 relative skeleton-pulse">
<div class="w-7 h-7 rounded-full bg-[#f2e9df] flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-[#e0d3c4]"></div>
</div>
</div>
<!-- Shadow shelf under node -->
<div class="w-10 h-1.5 bg-[#ebdacf] rounded-full mt-1.5 opacity-80"></div>
</div>
<!-- Node 4: Left-Center Disc (X: 146, Y: 325) -->
<div class="absolute left-[118px] top-[325px] flex flex-col items-center z-10" data-purpose="node-item-4">
<div class="node-disc node-disc-inactive w-14 h-14 relative skeleton-pulse">
<div class="w-7 h-7 rounded-full bg-[#f2e9df] flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-[#e0d3c4]"></div>
</div>
</div>
<!-- Shadow shelf under node -->
<div class="w-10 h-1.5 bg-[#ebdacf] rounded-full mt-1.5 opacity-80"></div>
</div>
<!-- Node 5: Milestone Squircle (Bottom Center) -->
<div class="absolute left-1/2 -translate-x-1/2 top-[430px] flex flex-col items-center z-10" data-purpose="milestone-node">
<div class="milestone-squircle w-[68px] h-[64px] flex items-center justify-center relative skeleton-pulse">
<div class="w-9 h-9 rounded-xl bg-[#f2e9df] flex items-center justify-center">
<div class="w-4 h-4 rounded-md bg-[#ded0c1]"></div>
</div>
</div>
<!-- Ledge shadow -->
<div class="w-12 h-2 bg-[#eadacf] rounded-full mt-2 opacity-80"></div>
</div>
</div>
<!-- END: SteppingStonePath -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomTabBar -->
<!-- Lexkite Canonical 64px Mobile Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 w-[390px] mx-auto h-[64px] bg-[#ffffff] border-t border-[#eedfd4] flex items-center justify-around z-50 px-2" data-purpose="bottom-tab-bar">
<!-- Tab 1: Today (Active) -->
<a class="flex flex-col items-center justify-center flex-1 h-full py-1 text-[#116e68]" data-purpose="tab-today" href="#">
<div class="w-11 h-7 rounded-full bg-[#dbeae7] flex items-center justify-center mb-0.5">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-bold leading-none">Today</span>
</a>
<!-- Tab 2: Vocab -->
<a class="flex flex-col items-center justify-center flex-1 h-full py-1 text-[#404040]" data-purpose="tab-vocab" href="#">
<div class="relative w-11 h-7 flex items-center justify-center mb-0.5">
<svg class="w-[19px] h-[19px]" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Red due indicator dot -->
<span class="absolute top-1 right-2.5 w-1.5 h-1.5 bg-[#e11d48] rounded-full"></span>
</div>
<span class="text-[11px] font-medium leading-none">Vocab</span>
</a>
<!-- Tab 3: Skills -->
<a class="flex flex-col items-center justify-center flex-1 h-full py-1 text-[#404040]" data-purpose="tab-skills" href="#">
<div class="w-11 h-7 flex items-center justify-center mb-0.5">
<svg class="w-[19px] h-[19px]" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<circle cx="12" cy="12" r="5"></circle>
<circle cx="12" cy="12" fill="currentColor" r="1.5"></circle>
</svg>
</div>
<span class="text-[11px] font-medium leading-none">Skills</span>
</a>
<!-- Tab 4: Tests -->
<a class="flex flex-col items-center justify-center flex-1 h-full py-1 text-[#404040]" data-purpose="tab-tests" href="#">
<div class="w-11 h-7 flex items-center justify-center mb-0.5">
<svg class="w-[19px] h-[19px]" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium leading-none">Tests</span>
</a>
<!-- Tab 5: Me -->
<a class="flex flex-col items-center justify-center flex-1 h-full py-1 text-[#404040]" data-purpose="tab-me" href="#">
<div class="w-11 h-7 flex items-center justify-center mb-0.5">
<svg class="w-[19px] h-[19px]" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium leading-none">Me</span>
</a>
</nav>
<!-- END: BottomTabBar -->
</body></html>
