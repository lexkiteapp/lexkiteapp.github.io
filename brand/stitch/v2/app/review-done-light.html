<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite — All Caught Up (Bright Day)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              cream: '#FFF7EA',
              card: '#FFFFFF',
              border: '#EADEC8',
              ledge: '#D8CFBC',
              dark: '#0F3D3E',
              darkMuted: '#245253',
              ink: '#1D130C',
              teal: '#2BA39A',
              tealDeep: '#1F7A75',
              tealLedge: '#145A56',
              coral: '#F2553B',
              amber: '#FFB054',
              orangeLedge: '#B53A22',
              gold: '#FFC94A',
              success: '#2FBF71',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFF7EA;
      color: #0F3D3E;
    }

    /* Tactile physics */
    .tactile-primary-btn {
      background: linear-gradient(180deg, #FF9E44 0%, #F2553B 100%);
      box-shadow: 0 6px 0 0 #B53A22, 0 10px 18px rgba(242, 85, 59, 0.22);
      transition: all 0.1s ease;
    }
    .tactile-primary-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 0 #B53A22, 0 4px 8px rgba(242, 85, 59, 0.18);
    }

    .tactile-secondary-btn {
      background: #FFFFFF;
      box-shadow: 0 5px 0 0 #D8CFBC, 0 8px 16px rgba(15, 61, 62, 0.04);
      transition: all 0.1s ease;
    }
    .tactile-secondary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #D8CFBC, 0 3px 6px rgba(15, 61, 62, 0.04);
    }

    .tactile-badge {
      box-shadow: 0 8px 0 0 #18726E, 0 16px 24px rgba(43, 163, 154, 0.28);
    }

    .tactile-header-pill {
      box-shadow: 0 3px 0 0 #D8CFBC;
    }

    .tactile-tab-active {
      box-shadow: inset 0 2px 4px rgba(43, 163, 154, 0.15), 0 3px 0 0 #1D736E;
    }
  </style>
</head>
<body class="bg-[#FFF7EA] min-h-screen flex flex-col justify-between selection:bg-[#2BA39A]/20 antialiased overflow-x-hidden">

  <!-- Fixed Top Header (56px) -->
  <header class="w-full h-14 bg-[#FFF7EA] border-b-2 border-[#EADEC8] px-4 md:px-8 flex items-center justify-between z-20">
    <div class="flex items-center gap-2.5">
      <!-- Lexkite Kite Emblem (Exact Kit Spec) -->
      <div class="w-8 h-8 rounded-xl bg-white border-2 border-[#EADEC8] flex items-center justify-center shadow-[0_2px_0_0_#D8CFBC]">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="12,2 20,10 12,22 4,10" fill="#2BA39A"/>
          <polygon points="12,2 20,10 12,12" fill="#FFB054"/>
          <polygon points="12,12 20,10 12,22" fill="#F2553B"/>
          <polygon points="12,2 12,12 4,10" fill="#248780"/>
          <circle cx="12" cy="10" r="1.5" fill="#FFFFFF"/>
        </svg>
      </div>
      <span class="text-xl font-extrabold text-[#0F3D3E] tracking-tight">Lexkite</span>
    </div>

    <!-- Header Status Pills: Flame Streak + XP -->
    <div class="flex items-center gap-2">
      <!-- Flame Streak Pill -->
      <div class="flex items-center gap-1.5 px-3 py-1 bg-white border-2 border-[#EADEC8] rounded-full tactile-header-pill">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C9.5 6 14 9 12 14C11 11.5 8 11 8 13.5C8 16.5 10 20 13.5 20C17 20 19 16.5 19 13C19 8.5 14.5 7 12 2Z" fill="#F2553B"/>
          <path d="M12 9C10.8 11.5 13.2 13 12 16C11.5 14.8 10 14.5 10 15.8C10 17.5 11 19.5 12.8 19.5C14.8 19.5 16 17.5 16 15.5C16 12.8 13.5 11.8 12 9Z" fill="#FFC94A"/>
        </svg>
        <span class="text-xs font-extrabold text-[#0F3D3E]">14</span>
      </div>

      <!-- XP Pill -->
      <div class="flex items-center gap-1.5 px-3 py-1 bg-white border-2 border-[#EADEC8] rounded-full tactile-header-pill">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L4 14H12L11 22L20 10H12L13 2Z" fill="#FFB054" stroke="#D98A28" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span class="text-xs font-extrabold text-[#0F3D3E]">820 XP</span>
      </div>
    </div>
  </header>

  <!-- Main Center Content Area: Spacious & Playful -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 py-8 max-w-md mx-auto w-full text-center relative z-10">

    <!-- Empty Dashed Teacher Slot (Exact 140x170 dimensions, for 2D real teacher placeholder) -->
    <div class="relative mb-5 flex flex-col items-center">
      <div class="w-[140px] h-[170px] rounded-2xl border-2 border-dashed border-[#2BA39A] bg-[#2BA39A]/5 flex flex-col items-center justify-center p-3 relative">
        <!-- Cheering speech bubble hint -->
        <div class="absolute -top-3.5 bg-white border-2 border-[#2BA39A] text-[#0F3D3E] text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full shadow-[0_2px_0_0_#1F7A75]">
          Coach Ama
        </div>
        
        <!-- Slot Icon Placeholder -->
        <div class="w-12 h-12 rounded-full bg-white border-2 border-[#EADEC8] flex items-center justify-center mb-2 shadow-[0_2px_0_0_#D8CFBC]">
          <svg class="w-6 h-6 text-[#2BA39A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <span class="text-[11px] font-extrabold text-[#0F3D3E] uppercase tracking-wider">Teacher</span>
        <span class="text-[9px] font-semibold text-[#245253]">140 × 170 Slot</span>
      </div>

      <!-- Dialogue Bubble from Teacher -->
      <div class="mt-2.5 px-3.5 py-1.5 bg-white border-2 border-[#EADEC8] rounded-xl shadow-[0_3px_0_0_#D8CFBC] text-xs font-bold text-[#0F3D3E] max-w-[240px]">
        "Spectacular job! All reviews cleared!" 🎉
      </div>
    </div>

    <!-- Big Glossy Check-Mark Badge with Sparkles -->
    <div class="relative mb-5 flex items-center justify-center">
      <!-- Ambient Sparkles -->
      <div class="absolute -top-3 -right-4 text-[#FFB054] animate-pulse">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
        </svg>
      </div>
      <div class="absolute -bottom-1 -left-4 text-[#FFC94A]">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
        </svg>
      </div>
      <div class="absolute top-1/2 -left-6 text-[#2BA39A]/60">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="8"/>
        </svg>
      </div>

      <!-- Glossy Badge 80x80 Circle -->
      <div class="w-20 h-20 rounded-full bg-gradient-to-b from-[#34C3B7] to-[#2BA39A] border-4 border-white tactile-badge flex items-center justify-center relative overflow-hidden">
        <!-- Top shine highlight reflection -->
        <div class="absolute top-1 left-2 right-2 h-7 rounded-full bg-white/35 blur-[1px]"></div>
        
        <!-- Thick chunky white checkmark -->
        <svg class="w-10 h-10 text-white drop-shadow-[0_2px_2px_rgba(20,90,86,0.5)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>

    <!-- Title & Status Text -->
    <h1 class="text-3xl font-extrabold text-[#0F3D3E] tracking-tight mb-2">
      All caught up!
    </h1>
    <p class="text-sm font-semibold text-[#245253] mb-4 max-w-xs">
      Zero flashcards due right now. Your memory retention is solid!
    </p>

    <!-- Small Chip: 'Next review in 3 h' -->
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-white border-2 border-[#EADEC8] rounded-full shadow-[0_2px_0_0_#D8CFBC] mb-7">
      <span class="w-2 h-2 rounded-full bg-[#2BA39A] animate-ping"></span>
      <span class="text-xs font-bold text-[#0F3D3E] tracking-wide">Next review in 3 h</span>
    </div>

    <!-- Dual Tactile Action Buttons (Wide full-bleed container) -->
    <div class="w-full flex flex-col gap-3.5 max-w-xs">
      <!-- Primary Action CTA (Orange with deep brown-black ink label for highest contrast) -->
      <button type="button" class="w-full h-14 rounded-2xl tactile-primary-btn border-2 border-[#F2553B] flex items-center justify-center gap-2 group cursor-pointer">
        <span class="text-base font-extrabold text-[#1D130C] tracking-tight group-hover:scale-[1.02] transition-transform">
          Learn new words
        </span>
        <svg class="w-5 h-5 text-[#1D130C]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <!-- Secondary Action CTA (Card color + 5px ledge + crisp dark teal ink) -->
      <button type="button" class="w-full h-14 rounded-2xl tactile-secondary-btn border-2 border-[#EADEC8] flex items-center justify-center gap-2 group cursor-pointer">
        <svg class="w-5 h-5 text-[#0F3D3E]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        <span class="text-base font-extrabold text-[#0F3D3E] tracking-tight group-hover:scale-[1.02] transition-transform">
          Practice anyway
        </span>
      </button>
    </div>

  </main>

  <!-- Fixed Bottom Navigation Bar (Exactly 5 tabs as per Lexkite Kit) -->
  <nav class="w-full bg-white border-t-2 border-[#EADEC8] py-2 px-2 md:px-8 z-20 shadow-[0_-4px_12px_rgba(15,61,62,0.03)]">
    <div class="max-w-md mx-auto flex items-center justify-around">
      
      <!-- Tab 1: Learn -->
      <button type="button" class="flex flex-col items-center justify-center w-14 py-1 rounded-xl text-[#4E6668] hover:text-[#0F3D3E] transition-colors">
        <svg class="w-6 h-6 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
          <line x1="9" y1="3" x2="9" y2="18"/>
          <line x1="15" y1="6" x2="15" y2="21"/>
        </svg>
        <span class="text-[10px] font-extrabold">Learn</span>
      </button>

      <!-- Tab 2: Review (ACTIVE TAB with 2px teal border + rounded square + teal tint) -->
      <button type="button" class="flex flex-col items-center justify-center w-14 py-1 rounded-xl bg-[#2BA39A]/10 border-2 border-[#2BA39A] text-[#1F7A75] tactile-tab-active">
        <svg class="w-6 h-6 mb-0.5 text-[#2BA39A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span class="text-[10px] font-extrabold text-[#0F3D3E]">Review</span>
      </button>

      <!-- Tab 3: Practice -->
      <button type="button" class="flex flex-col items-center justify-center w-14 py-1 rounded-xl text-[#4E6668] hover:text-[#0F3D3E] transition-colors">
        <svg class="w-6 h-6 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span class="text-[10px] font-extrabold">Practice</span>
      </button>

      <!-- Tab 4: Leagues -->
      <button type="button" class="flex flex-col items-center justify-center w-14 py-1 rounded-xl text-[#4E6668] hover:text-[#0F3D3E] transition-colors">
        <svg class="w-6 h-6 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
          <path d="M4 22h16"/>
          <path d="M10 14.66V17c0 .55-.45 1-1 1H8v4h8v-4h-1c-.55 0-1-.45-1-1v-2.34c3.48-.7 6-3.77 6-7.66V3H4v4c0 3.89 2.52 6.96 6 7.66Z"/>
        </svg>
        <span class="text-[10px] font-extrabold">Leagues</span>
      </button>

      <!-- Tab 5: Me -->
      <button type="button" class="flex flex-col items-center justify-center w-14 py-1 rounded-xl text-[#4E6668] hover:text-[#0F3D3E] transition-colors">
        <svg class="w-6 h-6 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="text-[10px] font-extrabold">Me</span>
      </button>

    </div>
  </nav>

</body>
</html>
