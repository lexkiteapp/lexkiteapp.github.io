<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite Leave Lesson (Tactile Night)</title>
<!-- Load Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Tactile Night Palette -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tactile: {
              canvas: '#091518',
              surface: '#101d20',
              surfaceAlt: '#14252a',
              border: '#1f383f',
              mint: '#e6fffa',
              mintMuted: '#94b3ba',
              amberBadge: '#261705',
              amberBorder: '#e67e00',
              orangeCta: '#ff8a00',
              orangeLedge: '#cc6600',
              darkInk: '#1a1005',
              coralRed: '#ff6b6b'
            }
          }
        }
      }
    }
  </script>
<!-- Custom Styles for tactile bottom shadows and speech bubble tails -->
<style data-purpose="tactile-effects">
    /* Tactile 3D bottom bevels */
    .tactile-card {
      border: 1.5px solid #1f383f;
      box-shadow: 0 4px 0 0 #0d171a;
    }
    .tactile-btn-close {
      border: 1.5px solid #28444c;
      box-shadow: 0 3px 0 0 #0b1517;
    }
    .tactile-cta {
      box-shadow: 0 4px 0 0 #a84e00;
    }
    /* Speech bubble tail pointing left toward teacher slot */
    .bubble-tail::before {
      content: '';
      position: absolute;
      left: -9px;
      top: 24px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 9px solid #1f383f;
    }
    .bubble-tail::after {
      content: '';
      position: absolute;
      left: -7px;
      top: 25px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid #14252a;
    }
  </style>
</head>
<body class="bg-[#091518] text-[#e6fffa] min-h-screen flex justify-center items-start antialiased font-sans select-none m-0 p-0">
<!-- Mobile Viewport Container (390px native width) -->
<main class="w-[390px] min-h-screen flex flex-col justify-between bg-[#091518] relative px-4 pb-6">
<!-- Top section wrapper: Header and content cards -->
<div class="w-full flex flex-col">
<!-- BEGIN: TopBar -->
<header class="h-14 -mx-4 px-4 flex items-center gap-3 border-b-2 border-[#1f383f] bg-[#091518] sticky top-0 z-20" data-purpose="modal-header">
<!-- Close button (Tactile circular button) -->
<button aria-label="Close dialog" class="w-9 h-9 rounded-full bg-[#14252a] hover:bg-[#1a3037] active:translate-y-0.5 active:shadow-none flex items-center justify-center transition-all tactile-btn-close" type="button">
<svg class="w-4 h-4 text-[#e6fffa]" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Modal Title -->
<h1 class="text-[17px] font-bold tracking-tight text-[#e6fffa]">
          Leave lesson?
        </h1>
</header>
<!-- END: TopBar -->
<!-- BEGIN: TeacherAndSpeechBubbleSection -->
<section class="mt-6 flex items-start gap-3" data-purpose="teacher-guidance">
<!-- Empty dashed teacher slot (120px wide by 140px high) -->
<div class="w-[120px] h-[140px] shrink-0 rounded-2xl border-2 border-dashed border-[#1f383f] bg-[#101d20]/50 flex items-center justify-center" data-purpose="empty-teacher-slot">
<span class="text-[12px] font-bold uppercase tracking-wider text-[#94b3ba]/60">TEACHER</span>
</div>
<!-- Speech bubble pointing directly at teacher slot -->
<div class="flex-1 bg-[#14252a] rounded-2xl p-3.5 relative bubble-tail tactile-card" data-purpose="speech-bubble">
<h2 class="text-sm font-bold text-[#e6fffa] leading-snug">
            Wait, don't go!
          </h2>
<p class="text-[13px] text-[#94b3ba] mt-1 leading-normal font-medium">
            You'll lose this lesson's progress
          </p>
</div>
</section>
<!-- END: TeacherAndSpeechBubbleSection -->
<!-- BEGIN: ProgressLossWarningCard -->
<section class="mt-6 bg-[#14252a] rounded-3xl p-6 text-center tactile-card flex flex-col items-center" data-purpose="warning-card">
<!-- Hourglass Badge -->
<div class="w-14 h-14 rounded-full bg-[#261705] border-2 border-[#e67e00]/60 flex items-center justify-center shadow-inner">
<svg class="w-7 h-7 text-[#ff9900]" fill="currentColor" viewbox="0 0 24 24">
<path d="M6 2v6h.01L6 8.01 10 12l-4 3.99.01.01H6V22h12v-6h-.01L18 15.99 14 12l4-3.99-.01-.01H18V2H6zm10 14.5V20H8v-3.5l4-4 4 4zM12 11.5l-4-4V4h8v3.5l-4 4z"></path>
</svg>
</div>
<!-- Card Title -->
<h3 class="mt-4 text-lg font-bold text-[#e6fffa] tracking-tight">
          Progress will be lost
        </h3>
<!-- Card Description -->
<p class="mt-2 text-[13px] text-[#94b3ba] leading-relaxed max-w-[270px]">
          Stay for 2 more minutes to finish your drill and keep your daily streak alive!
        </p>
<!-- Streak Badge -->
<div class="mt-4 inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#101d20] border border-[#ff8a00]/30 shadow-sm">
<span aria-label="flame" class="text-sm select-none" role="img">🔥</span>
<span class="text-xs font-semibold text-[#e6fffa] tracking-wide">
            Day 14 streak on the line
          </span>
</div>
</section>
<!-- END: ProgressLossWarningCard -->
</div>
<!-- BEGIN: ActionButtonsGroup -->
<footer class="w-full flex flex-col items-center gap-4 mt-8" data-purpose="dialog-actions">
<!-- Primary Action CTA Button -->
<button class="w-full h-14 bg-[#ff8a00] hover:bg-[#ff941a] active:translate-y-1 active:shadow-none transition-all rounded-2xl flex items-center justify-center gap-2 text-[#1a1005] font-extrabold text-[16px] tracking-wide tactile-cta cursor-pointer" type="button">
<span>Keep learning</span>
<svg class="w-4 h-4 fill-current ml-0.5" viewbox="0 0 24 24">
<path d="M8 5v14l11-7z"></path>
</svg>
</button>
<!-- Secondary Action (Dismiss/Exit) -->
<button class="text-sm font-semibold text-[#ff6b6b] hover:text-[#ff8080] active:opacity-75 transition-colors py-2 px-4 cursor-pointer" type="button">
        End lesson
      </button>
</footer>
<!-- END: ActionButtonsGroup -->
</main>
</body></html>
