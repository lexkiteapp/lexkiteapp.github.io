<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite Lesson Drill (Bright Day)</title>

          "fontFamily": {

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased flex justify-center min-h-screen select-none">
<!-- 390px Mobile Viewport Container -->
<main class="w-[390px] max-w-[390px] min-h-screen bg-surface flex flex-col justify-between relative px-4 pb-4 overflow-x-hidden">
<!-- TOP BAR (FOCUS MODE) -->
<header class="h-[56px] w-full flex items-center justify-between gap-3 pt-2">
<!-- Close Button -->
<button aria-label="Close drill" class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-surface-variant shadow-[0_3px_0_0_#d8c6b8] active:translate-y-0.5 active:shadow-[0_1px_0_0_#d8c6b8] flex items-center justify-center text-on-surface transition-all">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
<!-- Chunky Progress Bar (6/10 = 60%) -->
<div class="flex-1 h-[14px] bg-[#e8ddd4] rounded-full p-[2px] shadow-inner relative overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-[60%] relative shadow-[inset_0_2px_0_rgba(255,255,255,0.35)]">
<div class="absolute right-1 top-[2px] w-1.5 h-1.5 rounded-full bg-primary-fixed opacity-80"></div>
</div>
</div>
<!-- Combo Streak Pill -->
<div class="h-9 px-2.5 rounded-full bg-secondary-fixed border-2 border-[#d97300] shadow-[0_3px_0_0_#d97300,inset_0_1.5px_0_rgba(255,255,255,0.7)] flex items-center gap-1">
<span class="material-symbols-outlined text-secondary text-[18px]" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="text-label-sm font-label-sm text-on-secondary-fixed tracking-tight">COMBO ×4</span>
</div>
</header>
<!-- CONTENT CANVAS -->
<div class="flex-1 flex flex-col pt-3 pb-4 gap-4">
<!-- 1. Teacher Slot and Speech Bubble Row -->
<section class="flex items-center gap-3">
<!-- Teacher Slot Placeholder -->
<div class="w-[115px] h-[134px] rounded-2xl border-2 border-dashed border-[#d3c3b5] bg-[#faf2eb] flex flex-col items-center justify-center text-[#8e7a6d] flex-shrink-0"><span class="material-symbols-outlined text-[32px] mb-1 text-[#0c2624]" data-icon="school">school</span>
<span class="text-label-sm font-label-sm tracking-wider font-extrabold text-[#0c2624]">TEACHER</span>
<span class="text-label-sm font-label-sm tracking-widest text-[#0c2624] text-[10px] font-bold">SLOT</span></div>
<!-- Speech Bubble Card with Left Triangular Pointer -->
<div class="relative flex-1 bg-surface-container-lowest border-2 border-surface-variant rounded-DEFAULT p-3.5 shadow-[0_4px_0_0_#e5d5c8]">
<!-- Speech Bubble Notch -->
<div class="absolute -left-[9px] top-1/2 -translate-y-1/2 w-0 h-0 border-t-[8px] border-t-transparent border-b-[8px] border-b-transparent border-r-[9px] border-r-surface-variant"></div>
<div class="absolute -left-[6px] top-1/2 -translate-y-1/2 w-0 h-0 border-t-[6px] border-t-transparent border-b-[6px] border-b-transparent border-r-[7px] border-r-surface-container-lowest"></div>
<!-- Prompt Question Content -->
<div class="inline-block px-2 py-0.5 rounded-full bg-surface-container-high border border-surface-variant mb-1.5">
<span class="text-label-sm font-label-sm text-primary uppercase text-[10px] tracking-wider">Question</span>
</div>
<p class="text-body-md font-body-md text-on-surface leading-snug">
            Which word means <span class="text-primary-container font-extrabold underline decoration-2 underline-offset-2">very important</span>?
          </p>
</div>
</section>
<!-- 2. Tactile Audio Controls Row -->
<section class="grid grid-cols-2 gap-2.5">
<button class="h-10 px-3 bg-surface-container-lowest border-2 border-[#e8dec8] rounded-full shadow-[0_3px_0_0_#e8dec8] active:translate-y-0.5 active:shadow-[0_1px_0_0_#e8dec8] flex items-center justify-center gap-1.5 text-on-surface transition-all">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="volume_up">volume_up</span>
<span class="text-label-md font-label-md text-on-surface">Listen again</span>
</button>
<button class="h-10 px-3 bg-surface-container-lowest border-2 border-[#e8dec8] rounded-full shadow-[0_3px_0_0_#e8dec8] active:translate-y-0.5 active:shadow-[0_1px_0_0_#e8dec8] flex items-center justify-center gap-1.5 text-on-surface transition-all">
<span class="material-symbols-outlined text-[18px] text-[#f4820a]" data-icon="bolt">bolt</span>
<span class="text-label-md font-label-md text-on-surface">Slower</span>
</button>
</section>
<!-- 3. Four Tactile Answer Tiles (2x2 Grid) -->
<section class="grid grid-cols-2 gap-3 flex-1 content-start mt-1">
<!-- Tile 1: Selected ('crucial') -->
<button class="relative h-[116px] rounded-DEFAULT p-3 bg-[#e2f3f0] border-2 border-primary-container shadow-[0_5px_0_0_#136a63] active:translate-y-1 active:shadow-[0_1px_0_0_#136a63] flex flex-col justify-between text-left transition-all">
<!-- Checkmark Badge -->
<div class="absolute top-2.5 right-2.5 w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div>
<span class="text-label-sm font-label-sm text-primary-container font-extrabold uppercase text-[11px] tracking-wider">A</span>
<div class="text-headline-sm font-headline-sm font-extrabold text-[#134944] tracking-tight mt-0.5">crucial</div>
</div>
<span class="text-body-sm font-body-sm text-[#00504b] font-bold">essential</span>
</button>
<!-- Tile 2: Resting ('trivial') -->
<button class="relative h-[116px] rounded-DEFAULT p-3 bg-surface-container-lowest border-2 border-[#e8dec8] shadow-[0_5px_0_0_#e8dec8] active:translate-y-1 active:shadow-[0_1px_0_0_#e8dec8] flex flex-col justify-between text-left hover:border-outline-variant transition-all">
<div>
<span class="text-label-sm font-label-sm text-on-surface-variant font-extrabold uppercase text-[11px] tracking-wider">B</span>
<div class="text-headline-sm font-headline-sm font-extrabold text-on-surface tracking-tight mt-0.5">trivial</div>
</div>
<span class="text-body-sm font-body-sm text-on-surface-variant">minor</span>
</button>
<!-- Tile 3: Resting ('vague') -->
<button class="relative h-[116px] rounded-DEFAULT p-3 bg-surface-container-lowest border-2 border-[#e8dec8] shadow-[0_5px_0_0_#e8dec8] active:translate-y-1 active:shadow-[0_1px_0_0_#e8dec8] flex flex-col justify-between text-left hover:border-outline-variant transition-all">
<div>
<span class="text-label-sm font-label-sm text-on-surface-variant font-extrabold uppercase text-[11px] tracking-wider">C</span>
<div class="text-headline-sm font-headline-sm font-extrabold text-on-surface tracking-tight mt-0.5">vague</div>
</div>
<span class="text-body-sm font-body-sm text-on-surface-variant">unclear</span>
</button>
<!-- Tile 4: Resting ('casual') -->
<button class="relative h-[116px] rounded-DEFAULT p-3 bg-surface-container-lowest border-2 border-[#e8dec8] shadow-[0_5px_0_0_#e8dec8] active:translate-y-1 active:shadow-[0_1px_0_0_#e8dec8] flex flex-col justify-between text-left hover:border-outline-variant transition-all">
<div>
<span class="text-label-sm font-label-sm text-on-surface-variant font-extrabold uppercase text-[11px] tracking-wider">D</span>
<div class="text-headline-sm font-headline-sm font-extrabold text-on-surface tracking-tight mt-0.5">casual</div>
</div>
<span class="text-body-sm font-body-sm text-on-surface-variant">relaxed</span>
</button>
</section>
</div>
<!-- 4. BOTTOM STICKY ACTION AREA -->
<footer class="w-full pt-2 pb-1">
<button class="w-full h-14 bg-[#f4820a] border-2 border-[#b85b00] rounded-DEFAULT shadow-[0_6px_0_0_#b85b00] active:translate-y-1 active:shadow-[0_2px_0_0_#b85b00] flex items-center justify-center gap-2 text-[#1c1205] transition-all">
<span class="material-symbols-outlined text-[24px] font-extrabold" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-label-lg font-label-lg font-black tracking-wide text-[18px]">Check</span>
</button>
</footer>
</main>
</body></html>
