<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Dictionary — No Match (Bright Day)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            'cream-bg': '#FFF7EA',
            'card-bg': '#FFFFFF',
            'border-warm': '#EADEC8',
            'ledge-warm': '#D8CFBC',
            'ink-deep': '#0F3D3E',
            'ink-muted': '#3A5C5E',
            'ink-soft': '#4E6668',
            'brand-teal': '#2BA39A',
            'brand-teal-deep': '#1F7A75',
            'brand-teal-ledge': '#12514D',
            'brand-coral': '#F2553B',
            'brand-amber': '#FFB054',
            'cta-ledge': '#B53A22',
            'btn-ink': '#200A03',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #FFF7EA;
      color: #0F3D3E;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Tactile physics: pressable ledges */
    .tactile-card {
      background-color: #FFFFFF;
      border: 2px solid #EADEC8;
      box-shadow: 0 5px 0 0 #D8CFBC;
      border-radius: 20px;
    }

    .tactile-chip {
      background-color: #FFFFFF;
      border: 2px solid #EADEC8;
      box-shadow: 0 4px 0 0 #D8CFBC;
      border-radius: 9999px;
      transition: all 0.1s ease;
    }
    .tactile-chip:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #D8CFBC;
    }

    .tactile-btn-secondary {
      background-color: #FFFFFF;
      border: 2px solid #EADEC8;
      box-shadow: 0 4px 0 0 #D8CFBC;
      border-radius: 16px;
      transition: all 0.1s ease;
    }
    .tactile-btn-secondary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #D8CFBC;
    }

    .tactile-search {
      background-color: #FFFFFF;
      border: 2px solid #2BA39A;
      box-shadow: 0 4px 0 0 #1F7A75;
      border-radius: 18px;
    }

    .tab-active {
      background-color: #E6F7F5;
      border: 2px solid #2BA39A;
      box-shadow: 0 3px 0 0 #1F7A75;
      color: #0F3D3E;
    }
  </style>
</head>
<body class="bg-cream-bg text-ink-deep flex flex-col min-h-screen justify-between select-none">

  <!-- TOP HEADER (Lexkite standard fixed chrome) -->
  <header class="w-full bg-cream-bg border-b-2 border-border-warm px-4 sm:px-6 h-14 flex items-center justify-between sticky top-0 z-30">
    <!-- Brand / Back -->
    <div class="flex items-center gap-2.5">
      <button class="w-9 h-9 rounded-xl bg-card-bg border-2 border-border-warm flex items-center justify-center text-ink-deep active:translate-y-0.5" aria-label="Go back">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <div class="flex items-center gap-2">
        <svg class="w-6 h-6 text-brand-teal" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L3 12L12 22L21 12L12 2Z" fill="#2BA39A"/>
          <path d="M12 2L7.5 12L12 22L16.5 12L12 2Z" fill="#1F7A75"/>
          <circle cx="12" cy="12" r="2" fill="#FFB054"/>
        </svg>
        <span class="font-extrabold text-lg tracking-tight text-ink-deep">Dictionary</span>
      </div>
    </div>

    <!-- Header Stats -->
    <div class="flex items-center gap-2">
      <!-- Flame Streak -->
      <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-card-bg border-2 border-border-warm shadow-[0_2px_0_0_#D8CFBC]">
        <svg class="w-4 h-4 text-brand-coral" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2c.5 3-1 5-2 6.5C8.8 10.3 8 12.2 8 14.5 8 17.5 10 20 12.5 20s4.5-2.5 4.5-5.5c0-1.8-.7-3.4-1.8-4.7C14.4 8.7 14 7 14 5.5c0-.6 0-1.2.2-1.8C16.8 6 19 9.2 19 13c0 4.4-3.6 8-8 8s-8-3.6-8-8c0-4 2.8-7.3 6.6-8.5.5 1 .9 2.5 2.4 2.5z"/>
        </svg>
        <span class="text-xs font-extrabold text-ink-deep">14</span>
      </div>
      <!-- XP Pill -->
      <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-card-bg border-2 border-border-warm shadow-[0_2px_0_0_#D8CFBC]">
        <svg class="w-4 h-4 text-brand-amber" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/>
        </svg>
        <span class="text-xs font-extrabold text-ink-deep">820 XP</span>
      </div>
    </div>
  </header>

  <!-- MAIN VIEWPORT CONTAINER -->
  <main class="flex-1 w-full max-w-md mx-auto px-4 py-5 flex flex-col justify-start gap-5">

    <!-- SEARCH INPUT (Active typed misspelled word) -->
    <div class="w-full">
      <div class="tactile-search px-3.5 py-2.5 flex items-center gap-3 bg-card-bg">
        <!-- Search icon -->
        <svg class="w-5 h-5 text-brand-teal flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/>
          <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
        </svg>
        <!-- Typed value -->
        <div class="flex-1 flex items-center">
          <span class="text-base font-bold text-ink-deep tracking-tight">resillient</span>
          <span class="inline-block w-0.5 h-5 bg-brand-coral ml-0.5 animate-pulse"></span>
        </div>
        <!-- Clear button -->
        <button class="w-6 h-6 rounded-full bg-border-warm flex items-center justify-center text-ink-muted hover:bg-ledge-warm active:scale-95" aria-label="Clear search">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <!-- Subtle typo alert tag -->
      <div class="flex items-center gap-1.5 mt-2 px-1">
        <span class="w-2 h-2 rounded-full bg-brand-coral"></span>
        <p class="text-xs font-semibold text-ink-muted">Spelling not found in IELTS Core Deck</p>
      </div>
    </div>

    <!-- NO EXACT MATCH CARD -->
    <section class="tactile-card p-6 flex flex-col items-center text-center mt-1">
      
      <!-- GLOSSY TACTILE MAGNIFIER ILLUSTRATION -->
      <div class="relative w-28 h-28 flex items-center justify-center mb-3">
        <!-- Soft sunny aura -->
        <div class="absolute inset-2 bg-amber-100/70 rounded-full blur-md"></div>

        <!-- 3D Vector Isometric Tactile Magnifier -->
        <svg class="w-24 h-24 relative z-10 drop-shadow-sm" viewBox="0 0 100 100" fill="none">
          <!-- Magnifier Rim Ledge/Shadow -->
          <circle cx="44" cy="44" r="28" fill="#12514D"/>
          <circle cx="44" cy="42" r="28" fill="#2BA39A"/>
          
          <!-- Inner Lens Bed -->
          <circle cx="44" cy="42" r="22" fill="#E6FAF8"/>
          
          <!-- Glass Reflection Highlight -->
          <path d="M28 34C31 28 38 24 45 24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
          
          <!-- Tactile Empty Question Mark Inside Lens -->
          <text x="44" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#1F7A75" text-anchor="middle">?</text>
          
          <!-- Handle Base & 3D Ledge -->
          <rect x="63" y="60" width="12" height="26" rx="6" transform="rotate(-45 63 60)" fill="#B53A22"/>
          <rect x="61" y="58" width="12" height="26" rx="6" transform="rotate(-45 61 58)" fill="#F2553B"/>
          <!-- Handle Top Gloss Accent -->
          <rect x="63.5" y="60" width="4" height="20" rx="2" transform="rotate(-45 63.5 60)" fill="#FFB054" opacity="0.8"/>
          
          <!-- Small Sparkle Stars -->
          <path d="M18 20L20 16L22 20L26 22L22 24L20 28L18 24L14 22Z" fill="#FFB054"/>
          <path d="M78 24L79 21L80 24L83 25L80 26L79 29L78 26L75 25Z" fill="#2BA39A"/>
        </svg>
      </div>

      <!-- Card Title -->
      <h2 class="text-xl font-extrabold text-ink-deep tracking-tight mb-1">
        No exact match
      </h2>

      <!-- Compact Helper Text (Strictly minimal) -->
      <p class="text-sm font-semibold text-ink-muted max-w-[260px] leading-snug mb-5">
        Check spelling or pick an exam word below:
      </p>

      <!-- DID YOU MEAN ROW (3 Tactile Suggestion Chips) -->
      <div class="w-full mb-6">
        <div class="flex items-center justify-center gap-1.5 mb-2.5">
          <span class="text-xs font-extrabold uppercase tracking-wider text-ink-muted">Did you mean?</span>
        </div>
        <div class="flex flex-wrap items-center justify-center gap-2">
          <!-- Chip 1: resilient (Target C1) -->
          <button class="tactile-chip px-3.5 py-2 flex items-center gap-1.5 group hover:border-brand-teal active:scale-95">
            <span class="w-2 h-2 rounded-full bg-brand-teal"></span>
            <span class="text-sm font-extrabold text-ink-deep">resilient</span>
            <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-amber-100 text-brand-teal-deep border border-amber-200">C1</span>
          </button>

          <!-- Chip 2: reliance -->
          <button class="tactile-chip px-3.5 py-2 flex items-center gap-1.5 group hover:border-brand-teal active:scale-95">
            <span class="w-2 h-2 rounded-full bg-brand-amber"></span>
            <span class="text-sm font-extrabold text-ink-deep">reliance</span>
            <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-stone-100 text-ink-muted border border-border-warm">B2</span>
          </button>

          <!-- Chip 3: resident -->
          <button class="tactile-chip px-3.5 py-2 flex items-center gap-1.5 group hover:border-brand-teal active:scale-95">
            <span class="w-2 h-2 rounded-full bg-stone-300"></span>
            <span class="text-sm font-extrabold text-ink-deep">resident</span>
            <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-stone-100 text-ink-muted border border-border-warm">B1</span>
          </button>
        </div>
      </div>

      <!-- SECONDARY BUTTON (Search Web Dictionary) -->
      <button class="tactile-btn-secondary w-full py-3 px-4 flex items-center justify-center gap-2 text-ink-deep font-bold text-sm hover:border-brand-teal active:translate-y-0.5">
        <svg class="w-4 h-4 text-brand-teal flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path stroke-linecap="round" d="M3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/>
        </svg>
        <span>Search the web dictionary</span>
        <svg class="w-4 h-4 text-ink-muted ml-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

    </section>

    <!-- QUICK POPULAR IELTS DRILL LINK (Breathing room helper) -->
    <div class="px-2 pt-1 flex items-center justify-between text-xs font-semibold text-ink-muted">
      <span>Need inspiration?</span>
      <a href="#" class="font-extrabold text-brand-teal hover:underline flex items-center gap-1">
        Browse Band 7.5 Word Decks
        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

  </main>

  <!-- BOTTOM TAB BAR (Standard Lexkite 5-tab fixed bar, Review active) -->
  <nav class="w-full bg-card-bg border-t-2 border-border-warm px-3 py-2 sticky bottom-0 z-30 shadow-[0_-4px_12px_rgba(15,61,62,0.03)]">
    <div class="max-w-md mx-auto flex items-center justify-around">
      
      <!-- Tab 1: Learn -->
      <button class="flex flex-col items-center justify-center py-1 px-2.5 rounded-xl text-ink-muted hover:text-ink-deep transition-colors">
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A2 2 0 013 15.488V5.512a2 2 0 011.553-1.956L9 2m0 18l6-3m-6 3V2m6 15l5.447 2.724A2 2 0 0021 17.938V7.962a2 2 0 00-1.553-1.956L15 4m0 13V4m0 0L9 2"/>
        </svg>
        <span class="text-[11px] font-bold">Learn</span>
      </button>

      <!-- Tab 2: Review (Active: rounded square with 2px teal border + teal tint) -->
      <button class="tab-active flex flex-col items-center justify-center py-1 px-3.5 rounded-xl text-ink-deep font-extrabold">
        <svg class="w-6 h-6 mb-0.5 text-brand-teal" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span class="text-[11px] font-extrabold text-ink-deep">Review</span>
      </button>

      <!-- Tab 3: Practice -->
      <button class="flex flex-col items-center justify-center py-1 px-2.5 rounded-xl text-ink-muted hover:text-ink-deep transition-colors">
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span class="text-[11px] font-bold">Practice</span>
      </button>

      <!-- Tab 4: Leagues -->
      <button class="flex flex-col items-center justify-center py-1 px-2.5 rounded-xl text-ink-muted hover:text-ink-deep transition-colors">
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 21h8m-4-4v4M5 4h14a2 2 0 012 2v2a6 6 0 01-6 6h-4a6 6 0 01-6-6V6a2 2 0 012-2zm0 2H3a2 2 0 00-2 2v1a4 4 0 004 4h1m12-7h2a2 2 0 012 2v1a4 4 0 01-4 4h-1"/>
        </svg>
        <span class="text-[11px] font-bold">Leagues</span>
      </button>

      <!-- Tab 5: Me -->
      <button class="flex flex-col items-center justify-center py-1 px-2.5 rounded-xl text-ink-muted hover:text-ink-deep transition-colors">
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="text-[11px] font-bold">Me</span>
      </button>

    </div>
  </nav>

</body>
</html>
