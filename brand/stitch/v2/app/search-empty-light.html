<body class="bg-background text-on-surface antialiased flex justify-center min-h-screen">
<div class="w-[390px] min-h-screen bg-background relative flex flex-col pb-24 shadow-sm select-none">
<!-- SPECIFIC TOP BAR (INNER variant, exactly 56px high) -->
<header class="h-[56px] sticky top-0 z-40 bg-surface flex items-center justify-between px-4 border-b-2 border-surface-variant shadow-[0_4px_0_0_#efe0d6]">
<div class="flex items-center gap-3">
<button aria-label="Back" class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-surface-dim flex items-center justify-center text-primary shadow-[0_3px_0_0_#e6d7cd] active:translate-y-0.5 active:shadow-[0_1px_0_0_#e6d7cd] transition-all">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-[#0c2e2b] tracking-tight">Dictionary</h1>
</div>
<button aria-label="Bookmark" class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-surface-dim flex items-center justify-center text-primary shadow-[0_3px_0_0_#e6d7cd] active:translate-y-0.5 active:shadow-[0_1px_0_0_#e6d7cd] transition-all">
<span class="material-symbols-outlined text-[20px]">bookmark</span>
</button>
</header>
<!-- CONTENT BETWEEN BARS (16px side margins, 8px grid rhythm) -->
<main class="flex-1 px-4 py-5 flex flex-col gap-5">
<!-- Search input bar -->
<section>
<div class="w-full bg-surface-container-lowest rounded-2xl border-2 border-[#dfd3c8] p-2 pl-3.5 pr-2.5 flex items-center gap-2.5 shadow-[0_4px_0_0_#dfd3c8] focus-within:border-primary-container focus-within:shadow-[0_4px_0_0_#136a63] transition-all">
<span class="material-symbols-outlined text-[#00504b] text-[22px]">search</span>
<input class="flex-1 bg-transparent border-none p-0 font-label-lg text-label-lg text-on-surface focus:ring-0 focus:outline-none" placeholder="Search word or phrase..." type="text" value="acomodate"/>
<button aria-label="Clear query" class="w-7 h-7 rounded-full bg-surface-container-high border border-surface-dim text-on-surface-variant flex items-center justify-center active:translate-y-0.5 transition-all">
<span class="material-symbols-outlined text-[16px] font-bold">close</span>
</button>
</div>
</section>
<!-- Friendly 'No exact match' card -->
<section class="rounded-2xl border-2 border-[#ebdcd0] bg-surface-container-lowest shadow-[0_5px_0_0_#dfcbbe] p-5 flex flex-col items-center text-center">
<!-- Playful illustrated icon with candy highlight & sparkles -->
<div class="relative w-20 h-20 mb-3 flex items-center justify-center">
<div class="absolute inset-0 rounded-full bg-surface-container-low border-2 border-[#ebdcd0] shadow-[inset_0_2px_0_rgba(255,255,255,0.7)]"></div>
<div class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-secondary-container border-2 border-secondary flex items-center justify-center text-surface-container-lowest shadow-[0_2px_0_0_#8c5000]">
<span class="material-symbols-outlined text-[14px] font-bold">priority_high</span>
</div>
<div class="absolute -left-1 bottom-1 text-[#ff8c00]">
<span class="material-symbols-outlined text-[16px]">arrow_back_ios_new</span>
</div>
<span class="material-symbols-outlined text-[38px] text-primary-container relative z-10">search_off</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-[#0c2e2b] mb-1.5">No exact match for 'acomodate'</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[270px]">Check your spelling or explore the suggestions below.</p>
</section>
<!-- 'Did you mean…' section -->
<section class="flex flex-col gap-2.5">
<div class="flex items-center justify-between">
<h3 class="font-label-md text-label-md text-[#504037]">Did you mean…</h3>
<span class="font-label-sm text-label-sm text-primary flex items-center gap-0.5">
<span class="material-symbols-outlined text-[14px]">auto_fix_high</span> Smart Match
          </span>
</div>
<!-- Suggestion Cards / Tactile Chips -->
<div class="flex flex-col gap-2.5">
<!-- Suggestion 1: Primary match -->
<button class="w-full bg-surface-container-lowest rounded-2xl border-2 border-primary-container shadow-[0_4px_0_0_#136a63] p-3.5 flex items-center justify-between active:translate-y-1 active:shadow-[0_0_0_0_#136a63] transition-all text-left">
<div class="flex items-center gap-3">
<span class="w-7 h-7 rounded-full bg-[#d1ede8] text-primary-container border border-primary flex items-center justify-center font-label-sm text-label-sm">1</span>
<div>
<div class="flex items-center gap-2">
<span class="font-headline-sm text-headline-sm text-primary-container">accommodate</span>
<span class="rounded-full bg-surface-container px-2 py-0.5 font-label-sm text-label-sm text-on-surface-variant border border-surface-variant">verb</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1">To provide lodging or sufficient space for.</p>
</div>
</div>
<div class="flex items-center text-primary-container">
<span class="font-label-sm text-label-sm bg-secondary-fixed text-on-secondary-fixed px-2 py-0.5 rounded-full border border-secondary font-bold mr-1">98%</span>
<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</div>
</button>
<!-- Suggestion 2 -->
<button class="w-full bg-surface-container-lowest rounded-2xl border-2 border-[#ebdcd0] shadow-[0_4px_0_0_#dfcbbe] p-3 flex items-center justify-between active:translate-y-1 active:shadow-[0_0_0_0_#dfcbbe] transition-all text-left">
<div class="flex items-center gap-3">
<span class="w-7 h-7 rounded-full bg-surface-container text-on-surface-variant border border-surface-variant flex items-center justify-center font-label-sm text-label-sm">2</span>
<div>
<div class="flex items-center gap-2">
<span class="font-label-lg text-label-lg text-[#0c2e2b]">accommodation</span>
<span class="rounded-full bg-surface-container px-2 py-0.5 font-label-sm text-label-sm text-on-surface-variant border border-surface-variant">noun</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">A room, group of rooms, or lodging.</p>
</div>
</div>
<span class="material-symbols-outlined text-[#8c5000] text-[20px]">arrow_forward</span>
</button>
<!-- Suggestion 3 -->
<button class="w-full bg-surface-container-lowest rounded-2xl border-2 border-[#ebdcd0] shadow-[0_4px_0_0_#dfcbbe] p-3 flex items-center justify-between active:translate-y-1 active:shadow-[0_0_0_0_#dfcbbe] transition-all text-left">
<div class="flex items-center gap-3">
<span class="w-7 h-7 rounded-full bg-surface-container text-on-surface-variant border border-surface-variant flex items-center justify-center font-label-sm text-label-sm">3</span>
<div>
<div class="flex items-center gap-2">
<span class="font-label-lg text-label-lg text-[#0c2e2b]">accumulate</span>
<span class="rounded-full bg-surface-container px-2 py-0.5 font-label-sm text-label-sm text-on-surface-variant border border-surface-variant">verb</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">Gather together or acquire an increasing number.</p>
</div>
</div>
<span class="material-symbols-outlined text-[#8c5000] text-[20px]">arrow_forward</span>
</button>
</div>
</section>
<!-- Secondary action button / panel -->
<section class="mt-1">
<button class="w-full bg-surface-container-lowest rounded-2xl border-2 border-[#dfd3c8] shadow-[0_4px_0_0_#d8cdb6] p-3.5 flex items-center justify-center gap-2.5 text-primary active:translate-y-1 active:shadow-[0_0_0_0_#d8cdb6] transition-all">
<span class="material-symbols-outlined text-[20px]">public</span>
<span class="font-label-lg text-label-lg text-primary">Search the web dictionary</span>
<span class="material-symbols-outlined text-[18px]">open_in_new</span>
</button>
</section>
</main>
<!-- CANONICAL BOTTOM TAB BAR (exactly 64px high, docked at bottom) -->
<nav class="fixed bottom-0 w-[390px] h-[64px] bg-[#ffffff] border-t border-[#e6d7cd] z-50 flex items-center justify-around px-2">

<button aria-label="Today" class="flex flex-col items-center justify-center py-1 text-[#3e342e] w-[62px]">
<span class="material-symbols-outlined text-[22px]">today</span>
<span class="font-label-sm text-[11px] leading-tight mt-0.5">Today</span>
</button>
<!-- 2. Vocab (ACTIVE TAB) -->
<button aria-label="Vocab" class="flex flex-col items-center justify-center py-1 w-[68px]">
<div class="relative bg-[#d1ede8] px-3.5 py-0.5 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[22px] text-primary-container" style="font-variation-settings: 'FILL' 1;">menu_book</span>
<!-- small red due badge dot -->
<span class="absolute top-0 right-1 w-2 h-2 rounded-full bg-error border border-white"></span>
</div>
<span class="font-label-sm text-[11px] leading-tight text-primary-container font-extrabold mt-0.5">Vocab</span>
</button>
<!-- 3. Skills -->

<span class="material-symbols-outlined text-[22px]">psychology</span>
<span class="font-label-sm text-[11px] leading-tight mt-0.5">Skills</span>
</button>
<!-- 4. Tests -->
<button aria-label="Tests" class="flex flex-col items-center justify-center py-1 text-[#3e342e] w-[62px]">
<span class="material-symbols-outlined text-[22px]">assignment</span>
<span class="font-label-sm text-[11px] leading-tight mt-0.5">Tests</span>
</button>
<!-- 5. Me -->
<button aria-label="Me" class="flex flex-col items-center justify-center py-1 text-[#3e342e] w-[62px]">
<span class="material-symbols-outlined text-[22px]">person</span>
<span class="font-label-sm text-[11px] leading-tight mt-0.5">Me</span>
</button>
</nav>
</div>
</body></html>
