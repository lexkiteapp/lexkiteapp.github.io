<style>
    /* Dot Grid Ambient Background */
    body {
      background-color: #081518;
      background-image: radial-gradient(#1a2e33 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Tactile 3D Ledge Mechanics */
    .tactile-btn-primary {
      background: linear-gradient(180deg, #FFB054 0%, #F2553B 100%);
      box-shadow: 0 6px 0 #B53A22, 0 10px 20px rgba(181, 58, 34, 0.35);
      transition: all 0.08s ease-in-out;
    }
    .tactile-btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #B53A22, 0 5px 10px rgba(181, 58, 34, 0.25);
    }

    .tactile-card {
      background: #14252B;
      border: 2px solid #284149;
      box-shadow: 0 5px 0 #0B171A;
      border-radius: 20px;
      transition: all 0.1s ease-in-out;
    }

    .tactile-tile {
      background: #14252B;
      border: 2px solid #284149;
      box-shadow: 0 5px 0 #0B171A;
      border-radius: 20px;
      transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tactile-tile:hover {
      border-color: #36505A;
      background: #182C34;
    }
    .tactile-tile:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0B171A;
    }

    /* Glossy 3D Circle Badge Styles */
    .glossy-circle {
      position: relative;
      border-radius: 9999px;
      overflow: hidden;
      box-shadow: 0 4px 0 rgba(0,0,0,0.35), inset 0 2px 3px rgba(255,255,255,0.4);
    }
    .glossy-circle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 6px;
      right: 6px;
      height: 40%;
      border-radius: 9999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.02) 100%);
      pointer-events: none;
    }

    /* Tactile Status Pills */
    .tactile-pill {
      background: #102025;
      border: 2px solid #284149;
      box-shadow: 0 2px 0 #081518;
    }
