<!DOCTYPE html>

<html lang="en" class="dark"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite - Onboarding Step 2</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            body: ["Plus Jakarta Sans"],
            display: ["Plus Jakarta Sans"],
            title: ["Plus Jakarta Sans"],
            label: ["Plus Jakarta Sans"]
          }
        }
      }
    };
  </script>
<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
      display: inline-block; text-transform: none; letter-spacing: normal;
      word-wrap: normal; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased;
    }
    .tactile-btn { transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.08s cubic-bezier(0.4, 0, 0.2, 1); user-select: none; -webkit-tap-highlight-color: transparent; }
    .tactile-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 0 #B53A22 !important; }
    .tactile-card { transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.08s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.15s ease; user-select: none; -webkit-tap-highlight-color: transparent; }
    .tactile-card:active { transform: translateY(2px); box-shadow: 0 2px 0 0 #0A1518 !important; }
    .tactile-card.is-selected:active { box-shadow: 0 2px 0 0 #0B4742 !important; }
    .tactile-header-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 0 #0A1518 !important; }
    body { min-height: max(884px, 100dvh); }
  </style>
</head>
<body class="bg-[#0A1517] text-[#EAF2F2] font-body min-h-screen antialiased flex justify-center selection:bg-[#2BA39A]/30">
<main class="w-full max-w-[420px] min-h-screen bg-[#0A1517] flex flex-col justify-between px-4 pb-6 pt-3 relative">
<header class="w-full flex items-center gap-3 pt-1 pb-3">
<button aria-label="Go back" class="tactile-header-btn w-10 h-10 rounded-xl bg-[#0F2B2E] border-2 border-[#33494F] flex items-center justify-center text-[#EAF2F2] shadow-[0_3px_0_0_#0A1518] shrink-0 hover:bg-[#213438]" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex-1 flex flex-col gap-1">
<div class="flex justify-between items-center px-0.5">
<span class="font-label uppercase tracking-widest text-[#A3B9B7] text-[11px] font-extrabold">Step 2 of 4</span>
<span class="font-label uppercase tracking-widest text-[#6BD8CE] text-[11px] font-extrabold">50%</span>
</div>
<div class="w-full h-3 bg-[#162124] border border-[#263A3F] rounded-full p-[2px] relative overflow-hidden flex items-center">
<div class="h-full bg-gradient-to-r from-[#2BA39A] to-[#5FD0C4] rounded-full relative w-1/2 flex items-center justify-end shadow-[0_0_8px_rgba(43,163,154,0.4)]">
<div class="absolute inset-x-1 top-0 h-[2px] bg-white/40 rounded-full"></div>
<div class="w-2 h-2 rounded-full bg-[#FFB054] shadow-[0_0_4px_rgba(255,176,84,0.9)] mr-[1px]"></div>
</div>
</div>
</div>
<button aria-label="Skip question" class="tactile-header-btn w-10 h-10 rounded-xl bg-[#0F2B2E] border-2 border-[#33494F] flex items-center justify-center text-[#A3B9B7] shadow-[0_3px_0_0_#0A1518] shrink-0 hover:bg-[#213438] hover:text-[#EAF2F2]" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button></header>
<div class="flex-1 flex flex-col pt-1">
<section aria-label="Instructor guidance" class="flex items-center gap-3.5 mb-4">
<!-- Teacher slot (dashed) -->
<div class="w-[140px] h-[170px] shrink-0 rounded-2xl border-2 border-dashed border-[#2BA39A]/60 bg-[#162124] flex flex-col items-center justify-center text-center p-2.5 relative shadow-inner">
<span class="font-label uppercase tracking-wider text-[#6BD8CE] font-extrabold text-[12px] leading-tight">TEACHER</span>
<span class="font-label uppercase tracking-widest text-[#A3B9B7] font-bold text-[10px] mt-0.5">140 x 170 slot</span>
</div>
<div class="flex-1 relative bg-[#0F2B2E] border-2 border-[#33494F] rounded-2xl p-3.5 shadow-[0_5px_0_0_#0A1518] flex flex-col justify-center">
<div class="absolute -left-2 top-8 w-3 h-3 bg-[#0F2B2E] border-l-2 border-b-2 border-[#33494F] transform rotate-45"></div>
<div class="flex items-center gap-1.5 mb-1">
<span class="w-2 h-2 rounded-full bg-[#2BA39A] shadow-[0_0_6px_#2BA39A]"></span>
<span class="font-label text-[#6BD8CE] uppercase tracking-wider text-[11px] font-extrabold">Calibration</span>
</div>
<p class="font-body text-[#EAF2F2] text-[13.5px] leading-[19px] font-medium">
  Be honest! We will calibrate your <span class="text-[#FFB054] font-bold underline decoration-[#FFB054] decoration-2">IELTS</span> &amp; <span class="text-[#6BD8CE] font-bold underline decoration-[#2BA39A] decoration-2">TOEIC</span> drills to fit you perfectly.
</p>
</div></section>
<div class="mb-3.5">
<h1 class="font-display text-[#EAF2F2] text-[26px] leading-[32px] tracking-tight font-extrabold">
          How good is your English?
        </h1>
</div>
<div aria-label="Select your English proficiency level" class="flex flex-col gap-2.5" role="radiogroup">
<button aria-checked="false" class="tactile-card w-full text-left bg-[#0F2B2E] border-2 border-[#33494F] rounded-2xl p-3.5 shadow-[0_5px_0_0_#0A1518] flex items-center justify-between group hover:border-[#45555A] hover:bg-[#1D2F33]" role="radio" type="button">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-[#122023] border border-[#263A3F] flex items-end justify-center gap-1 pb-2 shrink-0">
<span class="w-1.5 h-2.5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-4 rounded-sm bg-[#213438]"></span>
<span class="w-1.5 h-5 rounded-sm bg-[#213438]"></span>
<span class="w-1.5 h-7 rounded-sm bg-[#213438]"></span>
</div>
<div>
<div class="font-title text-[16px] leading-5 font-bold text-[#EAF2F2]">Just starting</div>
<div class="font-label text-[12px] font-semibold text-[#A3B9B7] tracking-normal">Beginner • A1–A2</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#33494F] bg-[#122023] flex items-center justify-center shrink-0"></div>
</button>
<button aria-checked="false" class="tactile-card w-full text-left bg-[#0F2B2E] border-2 border-[#33494F] rounded-2xl p-3.5 shadow-[0_5px_0_0_#0A1518] flex items-center justify-between group hover:border-[#45555A] hover:bg-[#1D2F33]" role="radio" type="button">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-[#122023] border border-[#263A3F] flex items-end justify-center gap-1 pb-2 shrink-0">
<span class="w-1.5 h-2.5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-4 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-5 rounded-sm bg-[#213438]"></span>
<span class="w-1.5 h-7 rounded-sm bg-[#213438]"></span>
</div>
<div>
<div class="font-title text-[16px] leading-5 font-bold text-[#EAF2F2]">I know the basics</div>
<div class="font-label text-[12px] font-semibold text-[#A3B9B7] tracking-normal">Elementary • B1</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#33494F] bg-[#122023] flex items-center justify-center shrink-0"></div>
</button>
<button aria-checked="true" class="tactile-card is-selected w-full text-left bg-[#1D2F33] border-2 border-[#2BA39A] rounded-2xl p-3.5 shadow-[0_5px_0_0_#0B4742] flex items-center justify-between relative overflow-hidden" role="radio" type="button">
<div class="absolute inset-x-2 top-0 h-[2px] bg-white/30 rounded-full"></div>
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-[#162528] border border-[#2BA39A]/50 flex items-end justify-center gap-1 pb-2 shrink-0 shadow-sm">
<span class="w-1.5 h-2.5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-4 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-7 rounded-sm bg-[#213438]"></span>
</div>
<div>
<div class="font-title text-[16px] leading-5 font-extrabold text-[#EAF2F2]">I can talk about everyday topics</div>
<div class="font-label text-[12px] font-extrabold text-[#6BD8CE] tracking-normal mt-0.5">Intermediate • B2</div>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-[#2BA39A] text-[#0A1517] flex items-center justify-center shrink-0 shadow-[0_2px_0_0_#1D7B74]">
<span class="material-symbols-outlined text-[16px] font-extrabold" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<button aria-checked="false" class="tactile-card w-full text-left bg-[#0F2B2E] border-2 border-[#33494F] rounded-2xl p-3.5 shadow-[0_5px_0_0_#0A1518] flex items-center justify-between group hover:border-[#45555A] hover:bg-[#1D2F33]" role="radio" type="button">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-[#122023] border border-[#263A3F] flex items-end justify-center gap-1 pb-2 shrink-0">
<span class="w-1.5 h-2.5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-4 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-7 rounded-sm bg-[#FFB054]"></span>
</div>
<div>
<div class="font-title text-[16px] leading-5 font-bold text-[#EAF2F2]">I'm fairly confident</div>
<div class="font-label text-[12px] font-semibold text-[#A3B9B7] tracking-normal">Advanced • C1</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#33494F] bg-[#122023] flex items-center justify-center shrink-0"></div>
</button></div>
<!-- Placement test card -> #/placement -->
<section class="mt-3.5 mb-2"><a href="#/placement" class="tactile-card w-full text-left bg-[#0F2B2E] border-2 border-[#33494F] rounded-2xl p-3 shadow-[0_5px_0_0_#0A1518] flex items-center justify-between hover:bg-[#1D2F33] hover:border-[#45555A]">
<div class="flex items-center gap-2.5">
<div class="w-9 h-9 rounded-xl bg-[#FFB054]/20 border border-[#FFB054]/40 flex items-center justify-center text-[#FFB054] shrink-0">
<span class="material-symbols-outlined text-[20px]">explore</span>
</div>
<div>
<div class="font-title text-[14px] leading-tight font-bold text-[#EAF2F2]">Not sure? Take a quick placement test</div>
</div>
</div>
<span class="material-symbols-outlined text-[#A3B9B7] text-[20px]">chevron_right</span>
</a></section>
</div>
<footer class="w-full pt-2">
<button class="tactile-btn w-full h-14 rounded-2xl bg-gradient-to-r from-[#F2553B] to-[#FFB054] border-2 border-[#B53A22] shadow-[0_6px_0_0_#B53A22] flex items-center justify-center gap-2 text-[#1A0E0B] font-title font-extrabold text-[18px] tracking-wide relative overflow-hidden active:translate-y-1 hover:brightness-105" type="button">
<div class="absolute inset-x-3 top-0 h-[2.5px] bg-white/45 rounded-full"></div>
<span>Continue</span>
<span class="material-symbols-outlined text-[22px] font-extrabold text-[#1A0E0B]">arrow_forward</span>
</button>
</footer>
</main>
</body></html>
