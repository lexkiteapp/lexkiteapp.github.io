<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite Match Drill</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary": "#f4bf40",
          "surface": "#091518",
          "on-primary": "#003733",
          "outline-variant": "#243a3e",
          "tertiary-container": "#ba8b00",
          "inverse-primary": "#006a64",
          "surface-tint": "#6bd8ce",
          "on-primary-fixed-variant": "#00504b",
          "inverse-surface": "#d8e5e9",
          "secondary-fixed-dim": "#ffb4a6",
          "on-error": "#690005",
          "surface-container-highest": "#2b373a",
          "on-secondary-fixed": "#3f0300",
          "primary-fixed-dim": "#6bd8ce",
          "on-error-container": "#ffdad6",
          "on-background": "#d8e5e9",
          "surface-bright": "#2f3b3e",
          "secondary-fixed": "#ffdad3",
          "on-tertiary-fixed-variant": "#5b4300",
          "inverse-on-surface": "#263236",
          "background": "#091518",
          "error-container": "#93000a",
          "tertiary-fixed": "#ffdf9e",
          "on-secondary-container": "#ffa493",
          "primary-container": "#2ba39a",
          "outline": "#879391",
          "tertiary-fixed-dim": "#f4bf40",
          "primary-fixed": "#88f5ea",
          "on-tertiary": "#402e00",
          "surface-container-low": "#121d20",
          "surface-container": "#162529",
          "secondary": "#ffb4a6",
          "error": "#ffb4ab",
          "surface-variant": "#2b373a",
          "on-primary-container": "#00322e",
          "on-secondary": "#660800",
          "secondary-container": "#fd9500",
          "surface-container-high": "#202c2f",
          "on-surface-variant": "#bcc9c7",
          "on-secondary-fixed-variant": "#900f00",
          "on-surface": "#d8e5e9",
          "on-tertiary-fixed": "#261a00",
          "on-primary-fixed": "#00201e",
          "on-tertiary-container": "#392900",
          "primary": "#6bd8ce",
          "surface-container-lowest": "#051013",
          "surface-dim": "#091518"
        },
        "borderRadius": {
          "DEFAULT": "0.25rem",
          "lg": "0.5rem",
          "xl": "0.75rem",
          "full": "9999px"
        },
        "fontFamily": {
          "headline": ["Plus Jakarta Sans"],
          "display": ["Plus Jakarta Sans"],
          "body": ["Plus Jakarta Sans"],
          "label": ["Plus Jakarta Sans"]
        }
      }
    }
  }
</script>
<style>
  body {
    min-height: max(884px, 100dvh);
  }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container antialiased pb-24 font-body">
<!-- Top App Bar / Drill Header -->
<header class="w-full bg-[#091518] border-b-2 border-[#1a2c30] shadow-[0_4px_0_0_#051013]">
<div class="flex justify-between items-center w-full px-4 h-16 max-w-5xl mx-auto">
<!-- Leading Close Button -->
<button aria-label="Close" class="w-10 h-10 rounded-full bg-[#121d20] border-2 border-[#243a3e] shadow-[0_3px_0_0_#070e10] active:translate-y-0.5 active:shadow-[0_1px_0_0_#070e10] flex items-center justify-center transition-all duration-75 text-primary hover:text-white" type="button">
<span class="material-symbols-outlined text-xl font-bold">close</span>
</button>
<!-- Center Countdown / Stopwatch -->
<div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#121d20] border-2 border-[#243a3e] shadow-[0_3px_0_0_#070e10]">
<span class="material-symbols-outlined text-primary text-base" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="text-sm text-[#f0f6f5] font-extrabold tracking-wide font-headline">0:38</span>
</div>
<!-- Trailing Action Counter -->
<div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#241d08] border-2 border-[#f4bf40] shadow-[0_3px_0_0_#7c5c00]">
<span class="material-symbols-outlined text-[#f4bf40] text-sm" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="text-xs text-[#ffdf9e] font-extrabold font-headline">4/6 pairs</span>
</div>
</div>
</header>
<!-- Main Game Canvas Container -->
<main class="w-full max-w-lg mx-auto px-4 pt-4 flex-1 flex flex-col justify-start">
<!-- Penalty Notice Pill Banner -->
<div class="flex items-center justify-center mb-5">
<div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-[#121d20] border border-[#243a3e] shadow-[0_2px_0_0_#070e10]">
<span class="w-2 h-2 rounded-full bg-[#fd9500] animate-pulse"></span>
<span class="text-xs text-[#d8e5e9] font-bold tracking-wide font-headline">+1 s per miss</span>
<span class="material-symbols-outlined text-[#879391] text-sm">schedule</span>
</div>
</div>
<!-- Match Drill Matrix: 12 Tactile Chunky Tiles -->
<div class="grid grid-cols-2 gap-3.5 sm:gap-4 w-full">
<!-- Tile 1: Solved / Matched (Row 1 Col 1) -->
<div class="rounded-2xl bg-[#0e171a] border-2 border-[#1b2b2f] p-4 flex flex-col justify-center items-center min-h-[92px] shadow-[0_2px_0_0_#051013] text-center select-none opacity-60">
<span class="text-base sm:text-lg text-[#7f9495] line-through decoration-[#2ba39a] decoration-2 font-bold font-headline">meticulous</span>
<span class="flex items-center gap-1 mt-1 text-[#6bd8ce] text-xs font-extrabold font-headline">
<span class="material-symbols-outlined text-sm font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        Matched
      </span>
</div>
<!-- Tile 2: Default Pressable (Row 1 Col 2) -->
<button class="group rounded-2xl bg-[#142226] border-2 border-[#243a3e] p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#0d1719] active:translate-y-1 active:shadow-[0_0_0_0_#0d1719] hover:bg-[#18292e] transition-all duration-75 text-center" type="button">
<span class="text-base sm:text-lg text-[#f0f6f5] font-extrabold font-headline group-active:scale-95 transition-transform duration-75">candid</span>
</button>
<!-- Tile 3: Selected Active (Row 2 Col 1) -->
<button class="rounded-2xl bg-[#133235] border-2 border-[#2ba39a] p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#0d2224] ring-2 ring-[#6bd8ce]/50 translate-y-0.5 text-center relative overflow-hidden transition-all duration-75" type="button">
<div class="absolute top-2 right-2.5 w-2 h-2 rounded-full bg-[#6bd8ce] shadow-[0_0_8px_#6bd8ce]"></div>
<span class="text-base sm:text-lg text-[#4de0d2] font-extrabold font-headline tracking-tight">ubiquitous</span>
</button>
<!-- Tile 4: Solved / Matched (Row 2 Col 2) -->
<div class="rounded-2xl bg-[#0e171a] border-2 border-[#1b2b2f] p-4 flex flex-col justify-center items-center min-h-[92px] shadow-[0_2px_0_0_#051013] text-center select-none opacity-60">
<span class="text-sm sm:text-base text-[#7f9495] line-through decoration-[#2ba39a] decoration-2 font-semibold">very careful</span>
<span class="flex items-center gap-1 mt-1 text-[#6bd8ce] text-xs font-extrabold font-headline">
<span class="material-symbols-outlined text-sm font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        Matched
      </span>
</div>
<!-- Tile 5: Default Pressable (Row 3 Col 1) -->
<button class="group rounded-2xl bg-[#142226] border-2 border-[#243a3e] p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#0d1719] active:translate-y-1 active:shadow-[0_0_0_0_#0d1719] hover:bg-[#18292e] transition-all duration-75 text-center" type="button">
<span class="text-base sm:text-lg text-[#f0f6f5] font-extrabold font-headline group-active:scale-95 transition-transform duration-75">scrutinize</span>
</button>
<!-- Tile 6: Selected Active (Row 3 Col 2 - Matches Tile 3) -->
<button class="rounded-2xl bg-[#133235] border-2 border-[#2ba39a] p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#0d2224] ring-2 ring-[#6bd8ce]/50 translate-y-0.5 text-center relative overflow-hidden transition-all duration-75" type="button">
<div class="absolute top-2 right-2.5 w-2 h-2 rounded-full bg-[#6bd8ce] shadow-[0_0_8px_#6bd8ce]"></div>
<span class="text-sm sm:text-base text-[#4de0d2] font-extrabold font-headline leading-tight">found everywhere</span>
</button>
<!-- Tile 7: Default Pressable (Row 4 Col 1) -->
<button class="group rounded-2xl bg-[#142226] border-2 border-[#243a3e] p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#0d1719] active:translate-y-1 active:shadow-[0_0_0_0_#0d1719] hover:bg-[#18292e] transition-all duration-75 text-center" type="button">
<span class="text-base sm:text-lg text-[#f0f6f5] font-extrabold font-headline group-active:scale-95 transition-transform duration-75">pragmatic</span>
</button>
<!-- Tile 8: Default Pressable (Row 4 Col 2) -->
<button class="group rounded-2xl bg-[#142226] border-2 border-[#243a3e] p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#0d1719] active:translate-y-1 active:shadow-[0_0_0_0_#0d1719] hover:bg-[#18292e] transition-all duration-75 text-center" type="button">
<span class="text-sm sm:text-base text-[#f0f6f5] font-bold group-active:scale-95 transition-transform duration-75">frank &amp; direct</span>
</button>
<!-- Tile 9: Default Pressable (Row 5 Col 1) -->
<button class="group rounded-2xl bg-[#142226] border-2 border-[#243a3e] p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#0d1719] active:translate-y-1 active:shadow-[0_0_0_0_#0d1719] hover:bg-[#18292e] transition-all duration-75 text-center" type="button">
<span class="text-sm sm:text-base text-[#f0f6f5] font-bold group-active:scale-95 transition-transform duration-75">examine closely</span>
</button>
<!-- Tile 10: Default Pressable (Row 5 Col 2) -->
<button class="group rounded-2xl bg-[#142226] border-2 border-[#243a3e] p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#0d1719] active:translate-y-1 active:shadow-[0_0_0_0_#0d1719] hover:bg-[#18292e] transition-all duration-75 text-center" type="button">
<span class="text-sm sm:text-base text-[#f0f6f5] font-bold group-active:scale-95 transition-transform duration-75">practical minded</span>
</button>
<!-- Tile 11: Solved / Matched (Row 6 Col 1) -->
<div class="rounded-2xl bg-[#0e171a] border-2 border-[#1b2b2f] p-4 flex flex-col justify-center items-center min-h-[92px] shadow-[0_2px_0_0_#051013] text-center select-none opacity-60">
<span class="text-base sm:text-lg text-[#7f9495] line-through decoration-[#2ba39a] decoration-2 font-bold font-headline">lucid</span>
<span class="flex items-center gap-1 mt-1 text-[#6bd8ce] text-xs font-extrabold font-headline">
<span class="material-symbols-outlined text-sm font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        Matched
      </span>
</div>
<!-- Tile 12: Solved / Matched (Row 6 Col 2) -->
<div class="rounded-2xl bg-[#0e171a] border-2 border-[#1b2b2f] p-4 flex flex-col justify-center items-center min-h-[92px] shadow-[0_2px_0_0_#051013] text-center select-none opacity-60">
<span class="text-xs sm:text-sm text-[#7f9495] line-through decoration-[#2ba39a] decoration-2 font-semibold">clear &amp; easy to understand</span>
<span class="flex items-center gap-1 mt-1 text-[#6bd8ce] text-xs font-extrabold font-headline">
<span class="material-symbols-outlined text-sm font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        Matched
      </span>
</div>
</div>
<!-- Motivational Combo Hint -->
<div class="mt-5 mb-2 flex items-center justify-center">
<div class="flex items-center gap-1.5 px-4 py-1.5 bg-[#201c10] rounded-full border border-[#ba8b00]/60 shadow-[0_2px_0_0_#4a3700]">
<span class="material-symbols-outlined text-[#f4bf40] text-base" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="text-xs text-[#ffdf9e] font-extrabold font-headline tracking-wide">2 in a row! Keep going!</span>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Docked) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-[#0d181b] border-t-2 border-[#1a2c30] shadow-[0_-4px_0_0_#051013]">
<!-- Tab 1: Today -->
<button class="flex flex-col items-center justify-center text-[#879391] px-3 py-1.5 hover:text-[#6bd8ce] active:scale-95 transition-transform duration-75" type="button">
<span class="material-symbols-outlined text-2xl">today</span>
<span class="text-xs font-bold font-headline mt-0.5">Today</span>
</button>
<!-- Tab 2: Vocab (Active) -->
<button class="flex flex-col items-center justify-center bg-[#fd9500] text-[#241400] rounded-full px-4 py-1.5 shadow-[0_3px_0_0_#a86000] active:translate-y-0.5 active:shadow-none active:scale-95 transition-transform duration-75" type="button">
<span class="material-symbols-outlined text-2xl font-bold" style="font-variation-settings: 'FILL' 1;">style</span>
<span class="text-xs font-extrabold font-headline">Vocab</span>
</button>
<!-- Tab 3: Skills -->
<button class="flex flex-col items-center justify-center text-[#879391] px-3 py-1.5 hover:text-[#6bd8ce] active:scale-95 transition-transform duration-75" type="button">
<span class="material-symbols-outlined text-2xl">psychology</span>
<span class="text-xs font-bold font-headline mt-0.5">Skills</span>
</button>
<!-- Tab 4: Tests -->
<button class="flex flex-col items-center justify-center text-[#879391] px-3 py-1.5 hover:text-[#6bd8ce] active:scale-95 transition-transform duration-75" type="button">
<span class="material-symbols-outlined text-2xl">assignment</span>
<span class="text-xs font-bold font-headline mt-0.5">Tests</span>
</button>
<!-- Tab 5: Me -->
<button class="flex flex-col items-center justify-center text-[#879391] px-3 py-1.5 hover:text-[#6bd8ce] active:scale-95 transition-transform duration-75" type="button">
<span class="material-symbols-outlined text-2xl">person</span>
<span class="text-xs font-bold font-headline mt-0.5">Me</span>
</button>
</nav>
</body></html>
