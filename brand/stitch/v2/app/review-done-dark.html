<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite — All Caught Up (Bright Day)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              cream: '#FFF7EA',
              card: '#FFFFFF',
              border: '#EADEC8',
              ledge: '#D8CFBC',
              dark: '#0F3D3E',
              darkMuted: '#245253',
              ink: '#1D130C',
              teal: '#2BA39A',
              tealDeep: '#1F7A75',
              tealLedge: '#145A56',
              coral: '#F2553B',
              amber: '#FFB054',
              orangeLedge: '#B53A22',
              gold: '#FFC94A',
              success: '#2FBF71',
            }
          }
        }
      }
    };
  </script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFF7EA;
      color: #0F3D3E;
    }

    /* Tactile physics */
    .tactile-primary-btn {
      background: linear-gradient(180deg, #FF9E44 0%, #F2553B 100%);
      box-shadow: 0 6px 0 0 #B53A22, 0 10px 18px rgba(242, 85, 59, 0.22);
      transition: all 0.1s ease;
    }
    .tactile-primary-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 0 #B53A22, 0 4px 8px rgba(242, 85, 59, 0.18);
    }

    .tactile-secondary-btn {
      background: #FFFFFF;
      box-shadow: 0 5px 0 0 #D8CFBC, 0 8px 16px rgba(15, 61, 62, 0.04);
      transition: all 0.1s ease;
    }
    .tactile-secondary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #D8CFBC, 0 3px 6px rgba(15, 61, 62, 0.04);
    }

    .tactile-badge {
      box-shadow: 0 8px 0 0 #18726E, 0 16px 24px rgba(43, 163, 154, 0.28);
    }

    .tactile-header-pill {
      box-shadow: 0 3px 0 0 #D8CFBC;
    }

    .tactile-tab-active {
      box-shadow: inset 0 2px 4px rgba(43, 163, 154, 0.15), 0 3px 0 0 #1D736E;
    }
  </style>
</head>
<body class="bg-[#09171a] min-h-screen flex flex-col justify-between selection:bg-[#2BA39A]/30 antialiased overflow-x-hidden text-[#EEF6F7]">
<!-- Fixed Top Header (56px) -->
<header class="w-full h-14 bg-[#09171a] border-b-2 border-[#1f3640] px-4 md:px-8 flex items-center justify-between z-20">
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-xl bg-[#162930] border-2 border-[#2a4550] flex items-center justify-center shadow-[0_2px_0_0_#0a161a]">
<svg fill="none" height="18" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
<polygon fill="#2BA39A" points="12,2 20,10 12,22 4,10"></polygon>
<polygon fill="#FFB054" points="12,2 20,10 12,12"></polygon>
<polygon fill="#F2553B" points="12,12 20,10 12,22"></polygon>
<polygon fill="#248780" points="12,2 12,12 4,10"></polygon>
<circle cx="12" cy="10" fill="#FFFFFF" r="1.5"></circle>
</svg>
</div>
<span class="text-xl font-extrabold text-[#EEF6F7] tracking-tight">Lexkite</span>
</div>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1.5 px-3 py-1 bg-[#162930] border-2 border-[#2a4550] rounded-full shadow-[0_2px_0_0_#0a161a]">
<svg class="w-4 h-4" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C9.5 6 14 9 12 14C11 11.5 8 11 8 13.5C8 16.5 10 20 13.5 20C17 20 19 16.5 19 13C19 8.5 14.5 7 12 2Z" fill="#F2553B"></path>
<path d="M12 9C10.8 11.5 13.2 13 12 16C11.5 14.8 10 14.5 10 15.8C10 17.5 11 19.5 12.8 19.5C14.8 19.5 16 17.5 16 15.5C16 12.8 13.5 11.8 12 9Z" fill="#FFC94A"></path>
</svg>
<span class="text-xs font-extrabold text-[#EEF6F7]">14</span>
</div>
<div class="flex items-center gap-1.5 px-3 py-1 bg-[#162930] border-2 border-[#2a4550] rounded-full shadow-[0_2px_0_0_#0a161a]">
<svg class="w-4 h-4" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13 2L4 14H12L11 22L20 10H12L13 2Z" fill="#FFB054" stroke="#D98A28" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
<span class="text-xs font-extrabold text-[#FFC94A]">820 XP</span>
</div>
</div>
</header>
<!-- Main Center Content Area: Spacious & Playful -->
<main class="flex-1 flex flex-col items-center justify-center px-4 py-8 max-w-md mx-auto w-full text-center relative z-10"><!-- Teacher Slot (140x170) & Tactile Speech Bubble -->
<div class="relative mb-5 flex flex-col items-center">
<div class="w-[140px] h-[170px] rounded-2xl border-2 border-dashed border-[#2BA39A] bg-[#0d1c21] flex flex-col items-center justify-center p-3 relative shadow-[inset_0_2px_6px_rgba(0,0,0,0.4)]">
<!-- Pill Coach Ama -->
<div class="absolute -top-3.5 bg-[#162930] border-2 border-[#2BA39A] text-[#2BA39A] text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full shadow-[0_2px_0_0_#0a161a]">
          Coach Ama
        </div>
<!-- Slot Icon Placeholder -->
<div class="w-12 h-12 rounded-full bg-[#162930] border-2 border-[#2a4550] flex items-center justify-center mb-2 shadow-[0_2px_0_0_#0a161a]">
<svg class="w-6 h-6 text-[#2BA39A]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</div>
<span class="text-[11px] font-extrabold text-[#EEF6F7] uppercase tracking-wider">Teacher</span>
<span class="text-[9px] font-semibold text-[#A9BFC1]">140 × 170 Slot</span>
</div>
<!-- Dialogue Bubble from Teacher with speech pointer triangle -->
<div class="relative mt-3">
<!-- Triangle pointer pointing up -->
<div class="w-0 h-0 border-l-[7px] border-l-transparent border-r-[7px] border-r-transparent border-b-[8px] border-b-[#2a4550] mx-auto"></div>
<div class="-mt-[1px] px-3.5 py-2 bg-[#162930] border-2 border-[#2a4550] rounded-xl tactile-speech-bubble text-xs font-bold text-[#EEF6F7] max-w-[250px]">
          "Spectacular job! All reviews cleared!" 🎉
        </div>
</div>
</div>
<!-- Big Glowing Tactile Check-Mark Badge with Sparkles -->
<div class="relative mb-5 flex items-center justify-center">
<!-- Ambient Sparkles -->
<div class="absolute -top-3 -right-4 text-[#FFB054] animate-pulse">
<svg fill="currentColor" height="24" viewbox="0 0 24 24" width="24">
<path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"></path>
</svg>
</div>
<div class="absolute -bottom-1 -left-4 text-[#FFC94A]">
<svg fill="currentColor" height="18" viewbox="0 0 24 24" width="18">
<path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"></path>
</svg>
</div>
<div class="absolute top-1/2 -left-6 text-[#2BA39A]/70">
<svg fill="currentColor" height="12" viewbox="0 0 24 24" width="12">
<circle cx="12" cy="12" r="8"></circle>
</svg>
</div>
<!-- Ambient soft glow under badge -->
<div class="absolute inset-0 rounded-full bg-[#2BA39A]/20 blur-xl scale-125"></div>
<!-- Glossy Badge 80x80 Circle -->
<div class="w-20 h-20 rounded-full bg-gradient-to-b from-[#34C3B7] to-[#2BA39A] border-4 border-[#245253] tactile-badge flex items-center justify-center relative overflow-hidden">
<!-- Top shine highlight reflection -->
<div class="absolute top-1 left-2 right-2 h-7 rounded-full bg-white/35 blur-[1px]"></div>
<!-- Thick chunky white checkmark -->
<svg class="w-10 h-10 text-white drop-shadow-[0_2px_4px_rgba(10,50,47,0.7)]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
</div>
<!-- Title & Status Text -->
<h1 class="text-3xl font-extrabold text-[#EEF6F7] tracking-tight mb-2">
      All caught up!
    </h1>
<p class="text-sm font-medium text-[#A9BFC1] mb-4 max-w-xs">
      Zero flashcards due right now. Your memory retention is solid!
    </p>
<!-- Chip: 'Next review in 3 h' -->
<div class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-[#162930] border-2 border-[#2a4550] rounded-full shadow-[0_2px_0_0_#0a161a] mb-7">
<span class="w-2 h-2 rounded-full bg-[#2BA39A] animate-ping"></span>
<span class="text-xs font-bold text-[#EEF6F7] tracking-wide">Next review in 3 h</span>
</div>
<!-- Dual Tactile Action Buttons -->
<div class="w-full flex flex-col gap-3.5 max-w-xs">
<!-- Primary Action CTA (Candy coral-amber gradient with 6px physical bottom ledge & #1A0702 ink) -->
<button class="w-full h-14 rounded-2xl tactile-primary-btn border-2 border-[#F2553B] flex items-center justify-center gap-2 group cursor-pointer" type="button">
<span class="text-base font-extrabold text-[#1A0702] tracking-tight group-hover:scale-[1.02] transition-transform">
          Learn new words
        </span>
<svg class="w-5 h-5 text-[#1A0702]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" viewbox="0 0 24 24">
<line x1="5" x2="19" y1="12" y2="12"></line>
<polyline points="12 5 19 12 12 19"></polyline>
</svg>
</button>
<!-- Secondary Action CTA (Dark raised teal card #162930 with 5px bottom ledge & crisp light teal/ice-white label) -->
<button class="w-full h-14 rounded-2xl tactile-secondary-btn border-2 border-[#2a4550] flex items-center justify-center gap-2 group cursor-pointer" type="button">
<svg class="w-5 h-5 text-[#EEF6F7]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24">
<polyline points="1 4 1 10 7 10"></polyline>
<path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
</svg>
<span class="text-base font-extrabold text-[#EEF6F7] tracking-tight group-hover:scale-[1.02] transition-transform">
          Practice anyway
        </span>
</button>
</div></main>
<!-- Fixed Bottom Navigation Bar (Exactly 5 tabs as per Lexkite Kit) -->
<nav class="w-full bg-[#09171a] border-t-2 border-[#1f3640] py-2 px-2 md:px-8 z-20 shadow-[0_-4px_16px_rgba(0,0,0,0.4)]">
<div class="max-w-md mx-auto flex items-center justify-around">
<!-- Tab 1: Learn -->
<button class="flex flex-col items-center justify-center w-14 py-1 rounded-xl text-[#7E999C] hover:text-[#EEF6F7] transition-colors" type="button">
<svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
<line x1="9" x2="9" y1="3" y2="18"></line>
<line x1="15" x2="15" y1="6" y2="21"></line>
</svg>
<span class="text-[10px] font-extrabold">Learn</span>
</button>
<!-- Tab 2: Review (ACTIVE TAB with 2px teal border + subtle glow/tint) -->
<button class="flex flex-col items-center justify-center w-14 py-1 rounded-xl bg-[#123b3a] border-2 border-[#2BA39A] text-[#2BA39A] shadow-[0_2px_8px_rgba(43,163,154,0.25)]" type="button">
<svg class="w-6 h-6 mb-0.5 text-[#2BA39A]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24">
<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
</svg>
<span class="text-[10px] font-extrabold text-[#EEF6F7]">Review</span>
</button>
<!-- Tab 3: Practice -->
<button class="flex flex-col items-center justify-center w-14 py-1 rounded-xl text-[#7E999C] hover:text-[#EEF6F7] transition-colors" type="button">
<svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
</svg>
<span class="text-[10px] font-extrabold">Practice</span>
</button>
<!-- Tab 4: Leagues -->
<button class="flex flex-col items-center justify-center w-14 py-1 rounded-xl text-[#7E999C] hover:text-[#EEF6F7] transition-colors" type="button">
<svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
<path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
<path d="M4 22h16"></path>
<path d="M10 14.66V17c0 .55-.45 1-1 1H8v4h8v-4h-1c-.55 0-1-.45-1-1v-2.34c3.48-.7 6-3.77 6-7.66V3H4v4c0 3.89 2.52 6.96 6 7.66Z"></path>
</svg>
<span class="text-[10px] font-extrabold">Leagues</span>
</button>
<!-- Tab 5: Me -->
<button class="flex flex-col items-center justify-center w-14 py-1 rounded-xl text-[#7E999C] hover:text-[#EEF6F7] transition-colors" type="button">
<svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
<span class="text-[10px] font-extrabold">Me</span>
</button>
</div>
</nav>
</body>
</html>
