<!DOCTYPE html>

<html lang="en"><head>

<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      display: inline-block;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-[#FFF8F5] text-on-surface w-full max-w-[390px] min-h-screen mx-auto flex flex-col justify-between overflow-x-hidden antialiased">
<!-- 1. Top Bar -->
<header class="w-full h-[56px] bg-[#FFF8F3] border-b-2 border-[#EDE0D2] px-4 flex items-center shrink-0 z-20">
<button aria-label="Close" class="w-10 h-10 rounded-full bg-white border border-[#E5DACB] shadow-[0_3px_0_0_#D8CBBA] active:translate-y-[2px] active:shadow-[0_1px_0_0_#D8CBBA] flex items-center justify-center transition-all cursor-pointer" type="button">
<span class="material-symbols-outlined text-[#00514D] font-bold text-[22px]" data-icon="close">close</span>
</button>
<h1 class="ml-3 font-headline-sm text-headline-sm text-[#0F172A] tracking-tight">Leave lesson?</h1>
</header>
<!-- Content Canvas Area -->
<main class="w-full px-4 pt-4 pb-2 flex-1 flex flex-col justify-between">
<div class="flex flex-col gap-4">
<!-- 2. Coach Alert Area -->
<section aria-label="Coach Alert" class="flex items-center gap-3 w-full">
<!-- Dashed Teacher Slot -->
<div aria-hidden="true" class="teacher-slot w-[110px] h-[128px] shrink-0 rounded-2xl border-2 border-dashed border-[#00514D]/50 bg-[#EAF3F2]/40"></div>
<!-- Speech Bubble Card -->
<div class="relative flex-1 rounded-2xl bg-white border-2 border-[#FED7AA]/60 p-4 shadow-[0_4px_0_0_#E8DACB] flex flex-col justify-center">
<!-- Speech Pointer (left pointing pip) -->
<div aria-hidden="true" class="absolute -left-[9px] top-1/2 -translate-y-1/2 w-4 h-4 bg-white border-l-2 border-b-2 border-[#FED7AA]/60 rotate-45"></div>
<!-- Coach Alert Tag -->
<h2 class="font-headline-sm text-headline-sm text-[#1F1B16] leading-snug">Wait, don't go!</h2>
<p class="font-body-sm text-body-sm text-[#475569] mt-0.5 leading-snug">You'll lose this lesson's progress</p>
</div>
</section>
<!-- 3. Main Warning Card -->
<section class="w-full bg-white rounded-3xl border-2 border-[#FEF3C7] p-6 shadow-[0_8px_0_0_#E2D7C8] flex flex-col items-center text-center mt-2">
<!-- Hourglass Medallion -->
<div class="w-14 h-14 rounded-2xl bg-[#FEF3C7] border-2 border-[#FDE68A] shadow-[0_3px_0_0_#F59E0B] flex items-center justify-center mb-4 text-[#B45309]">
<span class="material-symbols-outlined text-[32px]" data-icon="hourglass_empty" data-weight="fill" style="font-variation-settings: 'FILL' 1;">hourglass_empty</span>
</div>
<!-- Title -->
<h2 class="font-headline-md text-headline-md text-[#1F1B16] tracking-tight">Progress will be lost</h2>
<!-- Body Copy -->
<p class="font-body-md text-body-md text-[#3F4947] mt-2.5 max-w-[280px] leading-relaxed">
          Stay for 2 more minutes to finish your drill and keep your daily streak alive!
        </p>
<!-- Streak Warning Badge -->
<div class="mt-5 inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#FFFBEB] border-2 border-[#FCD34D] shadow-[0_2px_0_0_#FDE68A]">
<span class="material-symbols-outlined text-[#EA580C] text-lg leading-none select-none" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label-md text-label-md text-[#1C1003] font-extrabold tracking-tight">Day 14 streak on the line</span>
</div>
</section>
</div>
<!-- 4. Bottom Action Buttons -->
<footer class="w-full pt-4 pb-4 flex flex-col gap-2.5">
<!-- Primary Amber Button -->
<button class="w-full h-14 bg-[#F59E0B] hover:bg-[#FBBF24] rounded-2xl shadow-[0_4px_0_0_#B45309] active:translate-y-[3px] active:shadow-[0_1px_0_0_#B45309] flex items-center justify-center gap-2 transition-all cursor-pointer border border-[#FDE68A]" type="button">
<span class="material-symbols-outlined text-[#1C1003] text-xl font-bold select-none leading-none" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span class="font-label-lg text-label-lg text-[#1C1003] font-extrabold tracking-wide">Keep learning</span>
</button>
<!-- Secondary Red Link -->
<button class="w-full min-h-[44px] py-2 flex items-center justify-center text-[#A3261B] hover:text-[#7F1D1D] active:opacity-75 transition-opacity cursor-pointer" type="button">
<span class="font-label-md text-label-md font-bold tracking-tight">End lesson</span>
</button>
</footer>
</main>
</body></html>
