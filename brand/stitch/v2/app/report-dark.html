<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite — Report a Problem (Tactile Night)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-[#081518] text-[#EEF6F7] font-sans antialiased min-h-screen py-10 px-4 sm:px-6 flex flex-col justify-between items-center selection:bg-[#2BA39A] selection:text-[#081518]" style="background-color: #081518;">
<main class="w-full max-w-xl mx-auto flex flex-col gap-6">
<header class="flex items-center justify-between w-full py-2">
<button aria-label="Go back" class="w-11 h-11 rounded-2xl flex items-center justify-center text-[#A9BFC1] hover:text-[#EEF6F7] transition-all bg-[#122025] border-2 border-[#243A40] shadow-[0_4px_0_0_#0E1A1E] active:translate-y-1 active:shadow-none" type="button">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#122025] border border-[#243A40] shadow-sm">
<div class="w-2.5 h-2.5 rounded-full bg-[#F2553B] animate-pulse"></div>
<span class="text-xs font-extrabold uppercase tracking-wider text-[#A9BFC1]">IELTS Drill Feedback</span>
</div>
<button aria-label="Close" class="w-11 h-11 rounded-2xl flex items-center justify-center text-[#A9BFC1] hover:text-[#EEF6F7] transition-all bg-[#122025] border-2 border-[#243A40] shadow-[0_4px_0_0_#0E1A1E] active:translate-y-1 active:shadow-none" type="button">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</header>
<div class="flex flex-col items-center text-center pt-1 pb-1">
<div class="w-14 h-14 mb-3 rounded-2xl bg-[#1F2618] border-2 border-[#BA8B00] flex items-center justify-center shadow-[0_4px_0_0_#13190E]">
<span class="material-symbols-outlined text-[#F4BF40] text-3xl">build_circle</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-[#EEF6F7]">Report a problem</h1>
<p class="text-sm font-semibold text-[#9DB6B8] mt-1">Help Carlos &amp; Ama improve this exam drill</p>
</div>
<section class="rounded-[24px] bg-[#122025] border-2 border-[#243A40] shadow-[0_6px_0_0_#0A1316,0_12px_24px_-8px_rgba(0,0,0,0.5)] p-6 sm:p-7 flex flex-col gap-5">
<div class="flex flex-col gap-2.5">
<label class="text-xs font-extrabold uppercase tracking-wider text-[#9DB6B8] flex items-center gap-1.5">
<span>Problem Type</span>
<span class="text-[#FFB4A6] font-bold">*</span>
</label>
<div class="flex flex-wrap gap-2.5">
<button class="px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm font-bold bg-[#13383B] border-2 border-[#2BA39A] shadow-[0_4px_0_0_#0B2527] text-white transition-all" type="button">
<span class="material-symbols-outlined text-[#6BD8CE] text-lg">cancel</span>
<span>Wrong answer</span>
</button>
<button class="px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm font-bold bg-[#182B32] border-2 border-[#2B434C] shadow-[0_4px_0_0_#101E23] text-[#EEF6F7] hover:border-[#3E5C67] hover:-translate-y-0.5 transition-all" type="button">
<span class="material-symbols-outlined text-[#FFB054] text-lg">spellcheck</span>
<span>Typo</span>
</button>
<button class="px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm font-bold bg-[#182B32] border-2 border-[#2B434C] shadow-[0_4px_0_0_#101E23] text-[#EEF6F7] hover:border-[#3E5C67] hover:-translate-y-0.5 transition-all" type="button">
<span class="material-symbols-outlined text-[#38BDF8] text-lg">volume_off</span>
<span>Audio</span>
</button>
<button class="px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm font-bold bg-[#182B32] border-2 border-[#2B434C] shadow-[0_4px_0_0_#101E23] text-[#EEF6F7] hover:border-[#3E5C67] hover:-translate-y-0.5 transition-all" type="button">
<span class="material-symbols-outlined text-[#FFB4A6] text-lg">bug_report</span>
<span>Bug</span>
</button>
<button class="px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm font-bold bg-[#182B32] border-2 border-[#2B434C] shadow-[0_4px_0_0_#101E23] text-[#EEF6F7] hover:border-[#3E5C67] hover:-translate-y-0.5 transition-all" type="button">
<span class="material-symbols-outlined text-[#2DD4BF] text-lg">lightbulb</span>
<span>Idea</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-xs font-extrabold uppercase tracking-wider text-[#9DB6B8]" for="details">Details</label>
<span class="text-xs font-bold text-[#9DB6B8]">Optional</span>
</div>
<textarea class="w-full p-4 text-sm font-semibold text-[#EEF6F7] placeholder-[#88A5A8] resize-none bg-[#0E1A1E] border-2 border-[#253C44] rounded-2xl shadow-[inset_0_2px_4px_rgba(0,0,0,0.4)] focus:outline-none focus:border-[#2BA39A] focus:ring-2 focus:ring-[#2BA39A]/20" id="details" placeholder="What felt off?" rows="3"></textarea>
</div>
<div class="flex flex-col gap-2">
<label class="text-xs font-extrabold uppercase tracking-wider text-[#9DB6B8] flex items-center justify-between">
<span>Screenshot</span>
<span class="text-xs font-bold text-[#6BD8CE] bg-[#13383B] px-2 py-0.5 rounded-md border border-[#2BA39A]/50 tracking-wide uppercase">Auto-captured</span>
</label>
<div class="p-4 flex items-center justify-between cursor-pointer group bg-[#14242A] border-2 border-dashed border-[#33505A] rounded-2xl hover:border-[#2BA39A] hover:bg-[#162B33] transition-all">
<div class="flex items-center gap-3.5">
<div class="w-12 h-12 rounded-xl bg-[#1A2F37] border border-[#2B434C] flex items-center justify-center text-[#2BA39A] shadow-inner group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-2xl text-[#2BA39A]">add_photo_alternate</span>
</div>
<div class="flex flex-col text-left">
<span class="text-sm font-extrabold text-[#EEF6F7] group-hover:text-[#6BD8CE]">Attach current screen</span>
<span class="text-xs font-semibold text-[#9DB6B8]">Question #04 • Gerund vs Infinitive</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-[#1A2E35] border border-[#29424B] flex items-center justify-center text-[#9DB6B8] group-hover:bg-[#2BA39A] group-hover:text-[#081518] transition-colors">
<span class="material-symbols-outlined text-lg">attach_file</span>
</div>
</div>
</div>
<div class="pt-1">
<button class="w-full py-4 px-6 rounded-2xl flex items-center justify-center gap-2 cursor-pointer border-2 border-[#E04328] shadow-[0_6px_0_0_#B53A22,0_8px_16px_-4px_rgba(242,85,59,0.3)] active:translate-y-1 active:shadow-[0_2px_0_0_#B53A22] transition-all" style="background: linear-gradient(180deg, #FF9E3B 0%, #F2553B 100%);" type="button">
<span class="material-symbols-outlined text-2xl text-[#120500]">send</span>
<span class="text-base font-extrabold text-[#120500] tracking-wide">Send report</span>
</button>
</div>
</section>
<section class="p-5 bg-[#14252B] border-2 border-[#243A40] rounded-[20px] shadow-[0_4px_0_0_#0C181C] flex items-center justify-between gap-4">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-2xl flex items-center justify-center text-[#081518] shrink-0 shadow-[0_4px_0_0_#13774B]" style="background: linear-gradient(135deg, #3DD598 0%, #20A76C 100%);">
<span class="material-symbols-outlined text-2xl">check</span>
</div>
<div class="flex flex-col text-left">
<h3 class="text-base font-extrabold text-[#EEF6F7]">Thank you!</h3>
</div>
</div>
<button class="px-3.5 py-2 rounded-xl text-xs font-extrabold text-[#EEF6F7] shrink-0 bg-[#1C323A] border-2 border-[#2B4752] shadow-[0_3px_0_0_#101F25] hover:border-[#2BA39A] hover:text-[#6BD8CE] active:translate-y-0.5 active:shadow-none transition-all" type="button">
        Resume drill
      </button>
</section>
</main>
</body>
</html>
