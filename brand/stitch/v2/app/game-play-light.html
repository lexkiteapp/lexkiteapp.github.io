<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Lesson Drill (Bright Day)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              cream: '#FFF8F3',
              sand: '#F7EFE8',
              card: '#FFFFFF',
              border: '#E7D8CD',
              borderDark: '#D5C2B4',
              teal: '#136A63',
              tealDark: '#0D4F4A',
              tealLight: '#E3F5F2',
              tealLedge: '#0E534E',
              orange: '#FF9E16',
              orangeLedge: '#D97706',
              ink: '#1E2322',
              inkMuted: '#4F5D5B',
              inkOrange: '#2B1700',
              combo: '#FFF1D6',
              comboBorder: '#F5C678',
              comboText: '#7A3F00',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #FFF8F3;
      color: #1E2322;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Tactile 3D Buttons & Tiles */
    .tactile-btn {
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .tactile-btn:active {
      transform: translateY(3px);
    }

    /* Tactile Orange CTA */
    .btn-orange-tactile {
      background: linear-gradient(180deg, #FFA929 0%, #FF950A 100%);
      box-shadow: 0 4px 0 #C96B00;
      color: #2B1700;
    }
    .btn-orange-tactile:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #C96B00;
    }

    /* Tactile White / Neutral Tile */
    .tile-tactile {
      background: #FFFFFF;
      border: 2px solid #E4D5CA;
      box-shadow: 0 4px 0 #D4C3B6;
    }
    .tile-tactile:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #D4C3B6;
    }

    /* Selected Tile */
    .tile-selected {
      background: #E8F7F5;
      border: 2px solid #136A63;
      box-shadow: 0 4px 0 #0E4E49;
    }
    .tile-selected:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0E4E49;
    }

    /* Tactile Utility Pill */
    .btn-pill-tactile {
      background: #FFFFFF;
      border: 1.5px solid #E5D7CC;
      box-shadow: 0 2.5px 0 #D8C7BA;
      color: #1E2322;
    }
    .btn-pill-tactile:active {
      transform: translateY(2px);
      box-shadow: 0 0.5px 0 #D8C7BA;
    }

    /* Teacher Slot Dashed Container */
    .teacher-dashed {
      border: 2.5px dashed #D2BFB2;
      background: radial-gradient(circle, #FFF2E8 0%, #FAECE1 100%);
    }

    /* Speech Bubble Pointer */
    .speech-bubble {
      position: relative;
      background: #FFFFFF;
      border: 2px solid #E4D5CA;
      box-shadow: 0 3px 0 #D6C4B7;
    }
    .speech-bubble::before {
      content: "";
      position: absolute;
      left: -9px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-right: 9px solid #E4D5CA;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      left: -6.5px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 7px solid #FFFFFF;
    }

    /* Progress bar ledge */
    .progress-track {
      background: #EBDDCE;
      box-shadow: inset 0 2px 2px rgba(0,0,0,0.06);
    }
    .progress-fill {
      background: linear-gradient(180deg, #24A297 0%, #136A63 100%);
      box-shadow: 0 2px 0 #0D4E49;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto select-none bg-[#FFF8F3]">

  <!-- Top bar (route #/lesson) -->
  <header class="pt-3 px-4 pb-2">
    <div class="flex items-center gap-3">
      <!-- Close / Exit button -->
      <button class="w-10 h-10 rounded-full flex items-center justify-center bg-white border-2 border-[#E7D8CD] shadow-[0_2.5px_0_#D5C2B4] active:translate-y-0.5 active:shadow-[0_0.5px_0_#D5C2B4] transition-all text-[#4F5D5B]" aria-label="Close lesson">
        <span class="material-symbols-rounded text-2xl font-bold">close</span>
      </button>

      <!-- Lesson Progress Bar -->
      <div class="flex-1 h-4 rounded-full progress-track p-0.5 relative overflow-hidden">
        <div class="h-full rounded-full progress-fill w-3/5 relative">
          <!-- Gloss highlight -->
          <div class="absolute inset-x-1 top-0.5 h-1 bg-white/40 rounded-full"></div>
        </div>
      </div>

      <!-- COMBO x4 Chip -->
      <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FFF1D6] border-2 border-[#F5C678] shadow-[0_2.5px_0_#DBA246] active:translate-y-0.5 active:shadow-none transition-transform">
        <span class="text-base leading-none">🔥</span>
        <span class="text-xs font-black tracking-wider text-[#7A3F00] uppercase">COMBO ×4</span>
      </div>
    </div>
  </header>

  <!-- Main Lesson Content Area -->
  <main class="flex-1 px-4 flex flex-col justify-center py-4">

    <!-- Teacher avatar slot + Speech bubble -->
    <div class="flex items-center gap-3.5 mb-6">
      <!-- Empty dashed teacher slot on the left -->
      <div class="relative flex-shrink-0">
        <div class="w-20 h-20 rounded-2xl teacher-dashed flex flex-col items-center justify-center relative overflow-hidden shadow-[0_2px_0_#E0CFC3]">
          <!-- Subtle empty slot placeholder iconography -->
          <span class="material-symbols-rounded text-[#C2ACA0] text-3xl opacity-75">person_add</span>
          <span class="text-[10px] font-extrabold text-[#9E877B] tracking-tight mt-0.5 uppercase">Teacher</span>
        </div>
        <!-- Slot badge pill -->
        <span class="absolute -bottom-2 -right-1 px-1.5 py-0.5 bg-[#FFF8F3] border border-[#D5C2B4] rounded-md text-[9px] font-extrabold text-[#756155] shadow-xs">
          SLOT
        </span>
      </div>

      <!-- Speech bubble asking question -->
      <div class="speech-bubble flex-1 p-4 rounded-2xl">
        <p class="text-lg font-black text-[#1E2322] leading-snug tracking-tight">
          Which word means <span class="text-[#136A63] underline decoration-[#24A297] decoration-2 underline-offset-2">very important</span>?
        </p>
      </div>
    </div>

    <!-- Audio Helper Controls: 'Listen again' and 'Slower' -->
    <div class="flex items-center gap-2.5 mb-6">
      <button class="btn-pill-tactile flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 font-bold text-xs tracking-wide">
        <span class="w-6 h-6 rounded-lg bg-[#E3F5F2] text-[#136A63] flex items-center justify-center font-bold">
          <span class="material-symbols-rounded text-base">volume_up</span>
        </span>
        <span class="text-[#1E2322] font-extrabold">Listen again</span>
      </button>

      <button class="btn-pill-tactile flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 font-bold text-xs tracking-wide">
        <span class="w-6 h-6 rounded-lg bg-[#FFF2DE] text-[#A65B00] flex items-center justify-center font-bold">
          <span class="material-symbols-rounded text-base">nest_eco_leaf</span>
        </span>
        <span class="text-[#1E2322] font-extrabold">Slower</span>
      </button>
    </div>

    <!-- Answer Tiles in 2x2 Grid -->
    <div class="grid grid-cols-2 gap-3 mb-2">
      <!-- Tile 1 (Selected - 'Crucial') -->
      <button class="tile-selected rounded-2xl p-4 min-h-[96px] flex flex-col items-center justify-center text-center relative group">
        <span class="text-xl font-extrabold text-[#0D4F4A] tracking-tight">crucial</span>
        <span class="text-[11px] font-bold text-[#136A63] mt-1 bg-white/70 px-2 py-0.5 rounded-full border border-[#B3DED8]">
          essential
        </span>
        <!-- Selected Check Badge -->
        <span class="absolute top-2.5 right-2.5 w-5 h-5 rounded-full bg-[#136A63] text-white flex items-center justify-center shadow-xs">
          <span class="material-symbols-rounded text-xs font-black">check</span>
        </span>
      </button>

      <!-- Tile 2 ('Trivial') -->
      <button class="tile-tactile rounded-2xl p-4 min-h-[96px] flex flex-col items-center justify-center text-center group">
        <span class="text-xl font-extrabold text-[#1E2322] tracking-tight">trivial</span>
        <span class="text-[11px] font-bold text-[#6D7B79] mt-1">
          minor
        </span>
      </button>

      <!-- Tile 3 ('Vague') -->
      <button class="tile-tactile rounded-2xl p-4 min-h-[96px] flex flex-col items-center justify-center text-center group">
        <span class="text-xl font-extrabold text-[#1E2322] tracking-tight">vague</span>
        <span class="text-[11px] font-bold text-[#6D7B79] mt-1">
          unclear
        </span>
      </button>

      <!-- Tile 4 ('Casual') -->
      <button class="tile-tactile rounded-2xl p-4 min-h-[96px] flex flex-col items-center justify-center text-center group">
        <span class="text-xl font-extrabold text-[#1E2322] tracking-tight">casual</span>
        <span class="text-[11px] font-bold text-[#6D7B79] mt-1">
          relaxed
        </span>
      </button>
    </div>

  </main>

  <!-- Bottom CTA & Tab Navigation -->
  <footer class="w-full bg-[#FFF8F3] pt-2 pb-2">
    <!-- Orange 'Check' Button -->
    <div class="px-4 pb-3">
      <button class="btn-orange-tactile w-full py-4 rounded-2xl flex items-center justify-center gap-2 font-black text-lg tracking-wide uppercase">
        <span class="material-symbols-rounded text-2xl font-black">check_circle</span>
        <span>Check</span>
      </button>
    </div>

    <!-- 5-Tab Bottom Bar (Today, Vocab, Skills, Tests, Me) -->
    <nav class="border-t-2 border-[#E7D8CD] bg-white px-2 py-1.5 flex items-center justify-around shadow-[0_-2px_4px_rgba(0,0,0,0.02)]">
      <!-- Tab 1: Today -->
      <a href="#/today" class="flex flex-col items-center justify-center py-1 px-3 text-[#5A6966] active:scale-95 transition-transform">
        <span class="material-symbols-rounded text-2xl">calendar_today</span>
        <span class="text-[10px] font-bold mt-0.5 tracking-tight">Today</span>
      </a>

      <!-- Tab 2: Vocab (Active tab for IELTS/TOEIC lesson) -->
      <a href="#/vocab" class="flex flex-col items-center justify-center py-1 px-3.5 rounded-2xl bg-[#FFF2DE] border border-[#F5C678] shadow-[0_2px_0_#DBA246] text-[#7A3F00] active:translate-y-0.5 transition-transform">
        <span class="material-symbols-rounded text-2xl font-bold">menu_book</span>
        <span class="text-[10px] font-black mt-0.5 tracking-tight">Vocab</span>
      </a>

      <!-- Tab 3: Skills -->
      <a href="#/skills" class="flex flex-col items-center justify-center py-1 px-3 text-[#5A6966] active:scale-95 transition-transform">
        <span class="material-symbols-rounded text-2xl">psychology</span>
        <span class="text-[10px] font-bold mt-0.5 tracking-tight">Skills</span>
      </a>

      <!-- Tab 4: Tests -->
      <a href="#/tests" class="flex flex-col items-center justify-center py-1 px-3 text-[#5A6966] active:scale-95 transition-transform">
        <span class="material-symbols-rounded text-2xl">assignment</span>
        <span class="text-[10px] font-bold mt-0.5 tracking-tight">Tests</span>
      </a>

      <!-- Tab 5: Me -->
      <a href="#/me" class="flex flex-col items-center justify-center py-1 px-3 text-[#5A6966] active:scale-95 transition-transform">
        <span class="material-symbols-rounded text-2xl">person</span>
        <span class="text-[10px] font-bold mt-0.5 tracking-tight">Me</span>
      </a>
    </nav>
  </footer>

</body>
</html>
