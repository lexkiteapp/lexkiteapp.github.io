<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite — Privacy & Ads Consent (Bright Day)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FFF7EA;
      color: #0F3D3E;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Tactile button physics */
    .btn-tactile-coral {
      background: linear-gradient(180deg, #FF6E4A 0%, #F2553B 100%);
      box-shadow: 0 5px 0 0 #B53A22, 0 8px 16px rgba(242, 85, 59, 0.25);
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-tactile-coral:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #B53A22, 0 4px 8px rgba(242, 85, 59, 0.2);
    }

    .btn-tactile-secondary {
      background: #FFFFFF;
      border: 2px solid #E2D7C3;
      box-shadow: 0 5px 0 0 #D0C3AC, 0 6px 12px rgba(15, 61, 62, 0.04);
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-tactile-secondary:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #D0C3AC, 0 3px 6px rgba(15, 61, 62, 0.03);
    }

    .card-tactile {
      background: #FFFFFF;
      border: 2px solid #EADEC8;
      box-shadow: 0 6px 0 0 #D8CFBC, 0 16px 32px rgba(78, 64, 42, 0.08);
      border-radius: 28px;
    }

    .app-screen-mock-bg {
      filter: blur(1.5px);
      opacity: 0.55;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-[#FFF7EA] text-[#0F3D3E] flex flex-col justify-between min-h-screen relative overflow-x-hidden selection:bg-[#2BA39A]/20">

  <!-- Background App Canvas (Calm Learning Path context underneath) -->
  <div class="w-full max-w-xl mx-auto px-4 pt-4 pb-20 app-screen-mock-bg flex flex-col items-center gap-6">
    <!-- Header simulation -->
    <header class="w-full flex items-center justify-between py-2 border-b-2 border-[#EADEC8]/60">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-[#2BA39A] flex items-center justify-center text-white shadow-sm">
          <span class="material-symbols-rounded text-[20px]">school</span>
        </div>
        <span class="font-extrabold text-[18px] tracking-tight text-[#0F3D3E]">Lexkite</span>
      </div>
      <div class="flex items-center gap-2 font-bold text-[13px]">
        <span class="px-2.5 py-1 rounded-full bg-[#FFF0E0] border border-[#FFD2A8] text-[#C2410C] flex items-center gap-1">
          <span class="material-symbols-rounded text-[16px]">local_fire_department</span> 14
        </span>
        <span class="px-2.5 py-1 rounded-full bg-[#E6F7F5] border border-[#BCE8E3] text-[#0F6560] flex items-center gap-1">
          <span class="material-symbols-rounded text-[16px]">bolt</span> 820 XP
        </span>
      </div>
    </header>

    <!-- Path Banner simulation -->
    <div class="w-full rounded-2xl bg-[#2BA39A] text-white p-4 shadow-sm flex items-center justify-between">
      <div>
        <p class="text-[11px] font-extrabold uppercase tracking-wider text-[#A5EBE3]">Unit 3 • IELTS Academic</p>
        <h3 class="text-[17px] font-extrabold">Writing Task 1 & Cohesion</h3>
      </div>
      <div class="w-10 h-10 rounded-xl bg-white/15 flex items-center justify-center">
        <span class="material-symbols-rounded text-[22px]">menu_book</span>
      </div>
    </div>

    <!-- Stepper Nodes simulation -->
    <div class="flex flex-col items-center gap-6 my-2">
      <div class="w-16 h-16 rounded-full bg-[#2BA39A] border-4 border-white shadow flex items-center justify-center text-white">
        <span class="material-symbols-rounded text-[28px]">headphones</span>
      </div>
      <div class="w-2 h-6 rounded-full bg-[#EADEC8]"></div>
      <div class="w-18 h-18 rounded-full bg-[#F2553B] border-4 border-white shadow-md flex items-center justify-center text-white ring-4 ring-[#F2553B]/20">
        <span class="material-symbols-rounded text-[32px]">edit</span>
      </div>
      <div class="w-2 h-6 rounded-full bg-[#EADEC8]"></div>
      <div class="w-16 h-16 rounded-full bg-[#EADEC8] border-4 border-white shadow-sm flex items-center justify-center text-[#9E9380]">
        <span class="material-symbols-rounded text-[28px]">lock</span>
      </div>
    </div>
  </div>

  <!-- Soft Dimming Overlay for Dialog focus -->
  <div class="fixed inset-0 bg-[#0F3D3E]/30 backdrop-blur-[2px] z-10 transition-opacity"></div>

  <!-- Consent Bottom Sheet Component -->
  <main class="fixed bottom-0 inset-x-0 z-20 w-full flex justify-center pb-6 sm:pb-8 px-4 sm:px-6 pointer-events-auto">
    <div class="w-full max-w-[480px] card-tactile p-6 sm:p-7 relative transition-all">

      <!-- Drag Handle Indicator -->
      <div class="w-12 h-1.5 rounded-full bg-[#D8CFBC] mx-auto mb-5"></div>

      <!-- Cookie & Shield Illustrated Icon Badge -->
      <div class="flex items-center justify-center mb-4">
        <div class="relative w-16 h-16 sm:w-[72px] sm:h-[72px] rounded-2xl bg-gradient-to-b from-[#FFF2DE] to-[#FFE2BA] border-2 border-[#F0D5AC] shadow-[0_4px_0_0_#DFC093] flex items-center justify-center">
          
          <!-- Tactile Cookie & Shield SVG Emblem -->
          <svg class="w-10 h-10 sm:w-11 sm:h-11" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Shield Shape Background -->
            <path d="M28 6L44 12V25C44 35.8 37.2 45.4 28 49C18.8 45.4 12 35.8 12 25V12L28 6Z" fill="#2BA39A" />
            <path d="M28 8.4L41.6 13.5V24.5C41.6 33.8 35.8 42.1 28 45.2C20.2 42.1 14.4 33.8 14.4 24.5V13.5L28 8.4Z" fill="#32B5AB" />
            
            <!-- Cookie Round overlapping on top -->
            <circle cx="28" cy="28" r="14" fill="#FFC94A" stroke="#B87B19" stroke-width="2" />
            <path d="M28 15C35.1797 15 41 20.8203 41 28C41 35.1797 35.1797 41 28 41C20.8203 41 15 35.1797 15 28C15 20.8203 20.8203 15 28 15Z" fill="#FFD778" />
            
            <!-- Chocolate chips -->
            <circle cx="23" cy="23" r="2.2" fill="#78450A" />
            <circle cx="32" cy="22" r="1.8" fill="#78450A" />
            <circle cx="33.5" cy="31" r="2.2" fill="#78450A" />
            <circle cx="24" cy="33" r="2" fill="#78450A" />
            <circle cx="28" cy="27.5" r="1.6" fill="#78450A" />
            
            <!-- Friendly Security Checkmark Overlay -->
            <circle cx="38" cy="38" r="8" fill="#0D5E59" stroke="#FFFFFF" stroke-width="2" />
            <path d="M34.5 38L37 40.5L41.5 35.5" stroke="#46E2D5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          <!-- Sparkle star -->
          <div class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-[#FFB054] border-2 border-white shadow-sm flex items-center justify-center text-white">
            <span class="material-symbols-rounded text-[14px]">auto_awesome</span>
          </div>
        </div>
      </div>

      <!-- Title & Concise 1-Line Description -->
      <div class="text-center mb-6">
        <h2 class="text-[22px] sm:text-[24px] font-extrabold text-[#0F3D3E] tracking-tight leading-tight">
          Your privacy, your choice
        </h2>
        <p class="text-[14px] sm:text-[15px] font-medium text-[#2C4F50] mt-1.5 leading-snug">
          We use essential cookies for your exam progress and study streak.
        </p>
      </div>

      <!-- Equal Tactile Action Buttons (Non-dark-pattern equal weight) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-3.5 mb-4">
        
        <!-- Accept Primary Button (Coral with deep brown-black ink as specified) -->
        <button type="button" class="btn-tactile-coral w-full h-[52px] sm:h-[54px] rounded-2xl flex items-center justify-center font-extrabold text-[15px] sm:text-[16px] text-[#2A1005] tracking-wide active:outline-none cursor-pointer">
          <span class="flex items-center gap-1.5">
            <span class="material-symbols-rounded text-[20px]">check_circle</span>
            Accept
          </span>
        </button>

        <!-- Decline Non-Essential Secondary Button (Equal prominence, tactile white card) -->
        <button type="button" class="btn-tactile-secondary w-full h-[52px] sm:h-[54px] rounded-2xl flex items-center justify-center font-extrabold text-[14px] sm:text-[15px] text-[#0F3D3E] tracking-tight active:outline-none cursor-pointer">
          <span>Decline non-essential</span>
        </button>
      </div>

      <!-- 'Choose' Settings Link & Subtle Reassurance -->
      <div class="flex items-center justify-between pt-2 border-t border-[#F0E6D5] text-[13px]">
        <button type="button" class="font-extrabold text-[#0D6964] hover:text-[#094A46] active:translate-y-0.5 transition-all flex items-center gap-1 cursor-pointer">
          <span class="material-symbols-rounded text-[17px]">tune</span>
          <span>Choose preferences</span>
        </button>

        <a href="#privacy-policy" class="font-semibold text-[#3D5A5B] hover:text-[#0F3D3E] transition-colors underline decoration-[#B9CECF] underline-offset-2">
          Privacy Policy
        </a>
      </div>

    </div>
  </main>

</body>
</html>
