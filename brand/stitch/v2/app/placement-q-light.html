<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite — Placement Test (Listening Question)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24..48,400..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-cream': '#FFF7EA',
            'card-bg': '#FFFFFF',
            'border-warm': '#EADEC8',
            'ledge-warm': '#D8CFBC',
            'teal-main': '#2BA39A',
            'teal-deep': '#0F3D3E',
            'teal-muted': '#325D5E',
            'teal-ledge': '#1B6A64',
            'teal-subtle': '#E8F7F6',
            'coral-orange': '#FF7A38',
            'orange-amber': '#FF9F43',
            'cta-ledge': '#B84E1A',
            'dark-ink': '#1E120A',
            'slate-ink': '#102A2D'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            'tactile-btn': '0 6px 0 0 #B84E1A',
            'tactile-card': '0 5px 0 0 #D8CFBC',
            'tactile-card-selected': '0 5px 0 0 #1B6A64',
            'tactile-audio-main': '0 8px 0 0 #1B6A64, 0 12px 20px -4px rgba(43,163,154,0.3)',
            'tactile-audio-sub': '0 5px 0 0 #D8CFBC',
            'tactile-pill': '0 3px 0 0 #D8CFBC'
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
    }
    .material-symbols-outlined-custom {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      display: inline-block;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
    }

    /* Tactile push physics */
    .tactile-btn-active:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 0 #B84E1A !important;
    }
    .tactile-card-active:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #D8CFBC !important;
    }
    .tactile-audio-active:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 0 #1B6A64 !important;
    }
    .tactile-audio-sub-active:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #D8CFBC !important;
    }

    /* Glossy highlights */
    .glossy-top {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
    }
  </style>
</head>
<body class="bg-[#FFF7EA] text-[#102A2D] font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#2BA39A]/20">

  <!-- Top Progress Bar & Header Chrome -->
  <header class="w-full max-w-xl mx-auto pt-6 px-6 sm:px-8">
    <div class="flex items-center justify-between gap-4">
      <!-- Close X Button -->
      <button aria-label="Close Placement Test" class="w-11 h-11 rounded-2xl bg-white border-2 border-[#EADEC8] shadow-tactile-pill flex items-center justify-center text-[#0F3D3E] hover:border-[#2BA39A] transition-colors tactile-card-active flex-shrink-0">
        <span class="material-symbols-outlined-custom text-[24px]">close</span>
      </button>

      <!-- Chunky Progress Track -->
      <div class="flex-1 flex flex-col gap-1.5">
        <div class="flex justify-between items-center text-[13px] font-extrabold text-[#0F3D3E] tracking-wider uppercase">
          <span class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-[#2BA39A] inline-block animate-pulse"></span>
            Diagnostic
          </span>
          <span class="font-extrabold text-[#0F3D3E] tracking-normal">4 / 15</span>
        </div>
        
        <!-- Physical Progress bar with inner fill and gloss -->
        <div class="h-4 w-full bg-[#EADEC8]/70 rounded-full p-[2px] border border-[#D8CFBC] relative overflow-hidden shadow-inner">
          <div class="h-full bg-gradient-to-r from-[#2BA39A] to-[#39C4B9] rounded-full relative w-[28%] shadow-[0_2px_0_0_#1B6A64]">
            <div class="absolute inset-x-0 top-0 h-[45%] bg-white/40 rounded-t-full"></div>
            <!-- Progress Sparkle Head -->
            <div class="absolute right-0 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-white rounded-full shadow-sm"></div>
          </div>
        </div>
      </div>

      <!-- Live Streak / Heartless Badge -->
      <div class="flex items-center gap-1.5 px-3 py-1.5 bg-white border-2 border-[#EADEC8] rounded-2xl shadow-tactile-pill flex-shrink-0">
        <span class="material-symbols-outlined-custom text-[#FF7A38] text-[20px]">local_fire_department</span>
        <span class="text-[14px] font-extrabold text-[#0F3D3E]">14</span>
      </div>
    </div>
  </header>

  <!-- Main Question Stage -->
  <main class="w-full max-w-xl mx-auto px-6 sm:px-8 py-6 flex-1 flex flex-col justify-center">

    <!-- Category Pill -->
    <div class="flex justify-center mb-4">
      <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-[#2BA39A]/15 border-2 border-[#2BA39A]/40 text-[#0F3D3E] text-[12px] font-extrabold uppercase tracking-wider">
        <span class="material-symbols-outlined-custom text-[#2BA39A] text-[16px]">headphones</span>
        Listening Drill • Part 1
      </div>
    </div>

    <!-- Question Prompt Headline -->
    <h1 class="text-center text-[28px] sm:text-[32px] font-extrabold text-[#0F3D3E] tracking-tight leading-tight mb-8">
      What did you hear?
    </h1>

    <!-- 3D Tactile Audio Controller Section -->
    <div class="flex items-center justify-center gap-5 mb-10">
      
      <!-- Primary Big Round Tactile Speaker Button -->
      <button aria-label="Play normal speed audio" class="relative group tactile-audio-active focus:outline-none">
        <!-- Main circular button body -->
        <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-gradient-to-b from-[#34C5B9] to-[#2BA39A] border-[3px] border-[#1B6A64] shadow-tactile-audio-main flex items-center justify-center relative overflow-hidden transition-all">
          <!-- Top 3D glossy dome reflection -->
          <div class="absolute inset-x-3 top-1.5 h-1/2 bg-gradient-to-b from-white/45 to-transparent rounded-t-full pointer-events-none"></div>
          
          <!-- Sound Wave Waves Icon -->
          <div class="relative flex items-center justify-center text-white drop-shadow-[0_2px_2px_rgba(15,61,62,0.4)]">
            <span class="material-symbols-outlined-custom text-[46px] sm:text-[52px]">volume_up</span>
          </div>

          <!-- Pulsing Sound Wave Accent Ring inside -->
          <div class="absolute inset-0 rounded-full border-2 border-white/20 pointer-events-none"></div>
        </div>
      </button>

      <!-- Secondary Round Tactile Turtle Button (Slow Speed) -->
      <button aria-label="Play slow speed audio" class="relative group tactile-audio-sub-active focus:outline-none">
        <div class="w-16 h-16 sm:w-18 sm:h-18 rounded-full bg-white border-[2.5px] border-[#EADEC8] shadow-tactile-audio-sub flex items-center justify-center relative overflow-hidden transition-all group-hover:border-[#2BA39A]">
          <!-- Gloss highlight -->
          <div class="absolute inset-x-2 top-1 h-1/2 bg-gradient-to-b from-white/80 to-transparent rounded-t-full pointer-events-none"></div>
          
          <!-- Turtle Speed Icon -->
          <div class="relative flex flex-col items-center justify-center text-[#0F3D3E] group-hover:text-[#2BA39A] transition-colors">
            <!-- Custom Turtle Glyph using clean rounded material icon -->
            <span class="material-symbols-outlined-custom text-[28px] sm:text-[32px] text-[#0F3D3E]">pest_control_rodent</span>
            <span class="text-[9px] font-extrabold uppercase tracking-tight text-[#325D5E] -mt-1">0.75×</span>
          </div>
        </div>
      </button>

    </div>

    <!-- 4 Big Tactile Answer Cards (2x2 Grid) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4 w-full" role="radiogroup" aria-label="Answer options">
      
      <!-- Option A -->
      <button role="radio" aria-checked="false" class="w-full min-h-[72px] bg-white rounded-2xl border-2 border-[#EADEC8] shadow-tactile-card p-4 flex items-center gap-3.5 text-left transition-all tactile-card-active hover:border-[#2BA39A]/60 group">
        <!-- Letter Tag Badge -->
        <div class="w-9 h-9 rounded-xl bg-[#FFF7EA] border-2 border-[#EADEC8] flex items-center justify-center font-extrabold text-[15px] text-[#0F3D3E] group-hover:bg-[#2BA39A]/15 group-hover:text-[#0F3D3E] group-hover:border-[#2BA39A]/40 flex-shrink-0 transition-colors">
          A
        </div>
        <!-- Label Text -->
        <span class="text-[17px] sm:text-[18px] font-bold text-[#102A2D] leading-snug">
          financial report
        </span>
      </button>

      <!-- Option B (Selected State Example) -->
      <button role="radio" aria-checked="true" class="w-full min-h-[72px] bg-[#E8F7F6] rounded-2xl border-[2.5px] border-[#2BA39A] shadow-tactile-card-selected p-4 flex items-center justify-between text-left transition-all tactile-card-active">
        <div class="flex items-center gap-3.5">
          <!-- Letter Tag Badge (Active) -->
          <div class="w-9 h-9 rounded-xl bg-[#2BA39A] border-2 border-[#1B6A64] flex items-center justify-center font-extrabold text-[15px] text-white flex-shrink-0 shadow-sm">
            B
          </div>
          <!-- Label Text -->
          <span class="text-[17px] sm:text-[18px] font-extrabold text-[#0F3D3E] leading-snug">
            quarterly review
          </span>
        </div>
        <!-- Right Check Indicator Icon -->
        <span class="material-symbols-outlined-custom text-[#2BA39A] text-[24px] flex-shrink-0">check_circle</span>
      </button>

      <!-- Option C -->
      <button role="radio" aria-checked="false" class="w-full min-h-[72px] bg-white rounded-2xl border-2 border-[#EADEC8] shadow-tactile-card p-4 flex items-center gap-3.5 text-left transition-all tactile-card-active hover:border-[#2BA39A]/60 group">
        <!-- Letter Tag Badge -->
        <div class="w-9 h-9 rounded-xl bg-[#FFF7EA] border-2 border-[#EADEC8] flex items-center justify-center font-extrabold text-[15px] text-[#0F3D3E] group-hover:bg-[#2BA39A]/15 group-hover:text-[#0F3D3E] group-hover:border-[#2BA39A]/40 flex-shrink-0 transition-colors">
          C
        </div>
        <!-- Label Text -->
        <span class="text-[17px] sm:text-[18px] font-bold text-[#102A2D] leading-snug">
          orderly dispatch
        </span>
      </button>

      <!-- Option D -->
      <button role="radio" aria-checked="false" class="w-full min-h-[72px] bg-white rounded-2xl border-2 border-[#EADEC8] shadow-tactile-card p-4 flex items-center gap-3.5 text-left transition-all tactile-card-active hover:border-[#2BA39A]/60 group">
        <!-- Letter Tag Badge -->
        <div class="w-9 h-9 rounded-xl bg-[#FFF7EA] border-2 border-[#EADEC8] flex items-center justify-center font-extrabold text-[15px] text-[#0F3D3E] group-hover:bg-[#2BA39A]/15 group-hover:text-[#0F3D3E] group-hover:border-[#2BA39A]/40 flex-shrink-0 transition-colors">
          D
        </div>
        <!-- Label Text -->
        <span class="text-[17px] sm:text-[18px] font-bold text-[#102A2D] leading-snug">
          quality renewal
        </span>
      </button>

    </div>

  </main>

  <!-- Bottom Action Bar / Orange Check Button -->
  <footer class="w-full max-w-xl mx-auto pb-8 pt-4 px-6 sm:px-8 border-t-2 border-[#EADEC8]/60 bg-[#FFF7EA]">
    <div class="flex flex-col gap-3">
      <!-- Big Tactile Orange Check Button -->
      <button class="w-full h-14 sm:h-15 rounded-2xl bg-gradient-to-r from-[#FF7A38] to-[#FF9F43] border-2 border-[#B84E1A] shadow-tactile-btn flex items-center justify-center gap-2 text-[#1E120A] font-extrabold text-[18px] sm:text-[19px] tracking-wide relative overflow-hidden tactile-btn-active transition-all focus:outline-none cursor-pointer">
        <!-- Button top highlight -->
        <div class="absolute inset-x-0 top-0 h-[40%] bg-gradient-to-b from-white/35 to-transparent pointer-events-none"></div>
        
        <span class="relative">CHECK</span>
        <span class="material-symbols-outlined-custom text-[#1E120A] text-[22px] relative">arrow_forward</span>
      </button>

      <!-- Subtle Examiner Compliance Note -->
      <p class="text-center text-[12px] font-bold text-[#325D5E] flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined-custom text-[#2BA39A] text-[16px]">verified</span>
        Cambridge &amp; ETS benchmarked audio calibration
      </p>
    </div>
  </footer>

</body>
</html>
