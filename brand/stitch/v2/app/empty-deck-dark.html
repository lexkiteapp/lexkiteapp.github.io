<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite — My Deck (Empty State)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'cream-bg': '#FFF7EA',
            'cream-surface': '#FFF2DE',
            'card-bg': '#FFFFFF',
            'border-warm': '#EADEC8',
            'border-ledge': '#D8CFBC',
            'teal-primary': '#0D6964',
            'teal-brand': '#2BA39A',
            'teal-deep': '#1F7A75',
            'teal-ledge': '#12514D',
            'teal-light': '#E6F7F5',
            'coral-primary': '#F2553B',
            'amber-primary': '#FFB054',
            'cta-ledge': '#B53A22',
            'text-ink': '#0F3D3E',
            'text-muted': '#3A5C5E',
            'btn-ink': '#220D06',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFF7EA;
      color: #0F3D3E;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* 3D Tactile Buttons & Ledges */
    .tactile-btn-primary {
      background: linear-gradient(180deg, #FF9447 0%, #F2553B 100%);
      box-shadow: 0 5px 0 0 #B53A22, 0 8px 16px rgba(242, 85, 59, 0.25);
      transition: all 0.1s ease;
    }
    .tactile-btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #B53A22, 0 4px 8px rgba(242, 85, 59, 0.2);
    }

    .tactile-btn-secondary {
      background: #FFFFFF;
      box-shadow: 0 5px 0 0 #D8CFBC, 0 6px 14px rgba(15, 61, 62, 0.05);
      border: 2px solid #EADEC8;
      transition: all 0.1s ease;
    }
    .tactile-btn-secondary:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #D8CFBC, 0 2px 6px rgba(15, 61, 62, 0.05);
    }

    .tactile-card {
      background: #FFFFFF;
      border: 2px solid #EADEC8;
      box-shadow: 0 5px 0 0 #D8CFBC;
      border-radius: 20px;
    }

    .tactile-pill {
      background: #FFFFFF;
      border: 2px solid #EADEC8;
      box-shadow: 0 3px 0 0 #D8CFBC;
    }

    .tab-active {
      background: #E6F7F5;
      border: 2px solid #2BA39A;
      box-shadow: 0 3px 0 0 #1F7A75;
      color: #0D6964;
    }

    .dashed-slot {
      background: rgba(255, 255, 255, 0.6);
      border: 2px dashed #2BA39A;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-cream-bg select-none" style="font-family: 'Plus Jakarta Sans', sans-serif; background-color: #081518; color: #EEF6F7; margin: 0; padding: 0; -webkit-font-smoothing: antialiased;">
<!-- ================= TOP HEADER (Fixed 56px standard Lexkite chrome) ================= -->
<header class="w-full h-14 bg-[#0B171A] border-b border-[#20363F] flex items-center justify-between px-5 sticky top-0 z-30">
<!-- Left: App Brand Kite Emblem + Name -->
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-xl bg-[#162930] border border-[#2E4854] shadow-[0_2px_0_0_#091417] flex items-center justify-center p-1">
<!-- Lexkite geometric origami kite icon -->
<svg class="w-6 h-6" fill="none" viewbox="0 0 24 24">
<path d="M12 2L20 10L12 22L4 10L12 2Z" fill="#2BA39A"></path>
<path d="M12 2L20 10L12 13L4 10L12 2Z" fill="#FFB054" opacity="0.9"></path>
<path d="M12 13L20 10L12 22Z" fill="#1F7A75"></path>
<path d="M12 13L4 10L12 22Z" fill="#0D6964"></path>
<circle cx="12" cy="11" fill="#FFFFFF" r="1.5"></circle>
</svg>
</div>
<span class="text-xl font-extrabold tracking-tight text-[#EEF6F7]">Lexkite</span>
</div>
<!-- Right: Streak Flame & XP Chips -->
<div class="flex items-center gap-2">
<!-- Flame Streak Pill -->
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#162930] border border-[#2E4854] shadow-[0_2px_0_0_#091417]">
<svg class="w-4 h-4" fill="none" viewbox="0 0 24 24">
<path d="M12 2C9.5 6 6 8.5 6 13.5C6 17.5 8.7 21 12 21C15.3 21 18 17.5 18 13.5C18 10 16 7.5 14 5.5C13.5 7.5 12 9 10.5 9.5C11.5 7.5 12.2 4.5 12 2Z" fill="#F2553B"></path>
<path d="M12 12C10.5 13.5 9.5 15 9.5 16.5C9.5 18 10.6 19.5 12 19.5C13.4 19.5 14.5 18 14.5 16.5C14.5 15 13.5 13.8 12 12Z" fill="#FFB054"></path>
</svg>
<span class="text-xs font-extrabold text-[#EEF6F7]">14</span>
</div>
<!-- XP Bolt Pill -->
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#162930] border border-[#2E4854] shadow-[0_2px_0_0_#091417]">
<svg class="w-3.5 h-3.5" fill="none" viewbox="0 0 24 24">
<path d="M13 2L4 14H11L9 22L20 10H13L15 2H13Z" fill="#FFB054" stroke="#D98A28" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
<span class="text-xs font-extrabold text-[#EEF6F7]">820 XP</span>
</div>
</div>
</header>
<!-- ================= MAIN CONTENT (EMPTY STATE) ================= -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-4 max-w-md mx-auto w-full">
<!-- Top Teacher Slot + Friendly Speech Bubble Container -->
<div class="flex flex-col items-center w-full mb-3">
<!-- Teacher Ama / Carlos 140x170 Empty Slot -->
<div class="relative w-[140px] h-[170px] rounded-2xl border-2 border-dashed border-[#2BA39A]/60 bg-[#122329]/70 flex flex-col items-center justify-center p-3 shadow-[0_4px_16px_rgba(0,0,0,0.3)] mb-3">
<!-- Teacher Icon Placeholder Tag -->
<div class="w-10 h-10 rounded-full bg-[#1C363D] border border-[#2BA39A] flex items-center justify-center mb-2 shadow-inner">
<svg class="w-5 h-5 text-[#6BD8CE]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</div>
<span class="text-[11px] font-extrabold tracking-wider uppercase text-[#6BD8CE]">TEACHER</span>
<span class="text-[10px] font-semibold text-[#8DA6A8] mt-0.5">140 × 170 Slot</span>
<!-- Live Teacher Badge -->
<div class="absolute -top-2.5 bg-[#2BA39A] text-[#002B27] text-[9px] font-black uppercase px-2 py-0.5 rounded-full shadow-[0_2px_4px_rgba(0,0,0,0.3)] tracking-wider">
          Coach Ama
        </div>
</div>
<!-- Friendly Speech Bubble -->
<div class="relative bg-[#162930] border-2 border-[#2E4854] rounded-2xl px-4 py-2.5 shadow-[0_3px_0_0_#091417] text-center max-w-[310px]">
<!-- Speech Bubble Triangle Tail Pointing Up -->
<div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-[#162930] border-t-2 border-l-2 border-[#2E4854] rotate-45"></div>
<p class="text-xs font-bold text-[#EEF6F7] relative z-10 leading-snug">
          "Ready to build your personal lexicon? Collect words as you learn!"
        </p>
</div>
</div>
<!-- Playful Tactile Illustration: Warm 3D Empty Card Box with Golden Sparkles -->
<div class="relative my-2 flex items-center justify-center">
<!-- Ambient decorative confetti / spark stars -->
<div class="absolute -top-3 -right-4 w-7 h-7 text-[#FFB054]">
<svg fill="currentColor" viewbox="0 0 24 24">
<path d="M12 0L14.8 9.2L24 12L14.8 14.8L12 24L9.2 14.8L0 12L9.2 9.2L12 0Z"></path>
</svg>
</div>
<div class="absolute -bottom-1 -left-5 w-5 h-5 text-[#2BA39A] opacity-90">
<svg fill="currentColor" viewbox="0 0 24 24">
<path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"></path>
</svg>
</div>
<div class="absolute top-2 -left-6 w-3 h-3 rounded-full bg-[#F2553B] opacity-80"></div>
<div class="absolute bottom-6 -right-6 w-3.5 h-3.5 rounded-full bg-[#FFB054] opacity-70"></div>
<!-- Central Isometric Tactile Card Box Graphic -->
<div class="w-32 h-32 flex items-center justify-center">
<svg class="w-full h-full filter drop-shadow-[0_12px_18px_rgba(0,0,0,0.6)]" viewbox="0 0 140 140">
<!-- Soft Shadow Base -->
<ellipse cx="70" cy="116" fill="#050C0E" rx="46" ry="12"></ellipse>
<!-- Box Back Wall (Inner Depth) -->
<polygon fill="#162C31" points="35,62 70,44 105,62 70,80" stroke="#2BA39A" stroke-linejoin="round" stroke-width="2.5"></polygon>
<!-- Blank Fresh Index Card in Box -->
<g transform="translate(0, -6)">
<path d="M48,56 L70,44 L92,56 L70,68 Z" fill="#1A363E" stroke="#3D656D" stroke-width="2"></path>
<path d="M52,58 L68,49" stroke="#2BA39A" stroke-linecap="round" stroke-width="2"></path>
<path d="M56,62 L74,52" stroke="#FFB054" stroke-linecap="round" stroke-width="2"></path>
</g>
<!-- Box Left Side Panel -->
<polygon fill="#1F7A75" points="35,62 70,80 70,112 35,94" stroke="#12514D" stroke-linejoin="round" stroke-width="2.5"></polygon>
<!-- Box Left Shadow Rim -->
<polygon fill="#0D3B38" points="35,94 70,112 70,116 35,98"></polygon>
<!-- Box Right Side Panel -->
<polygon fill="#2BA39A" points="70,80 105,62 105,94 70,112" stroke="#1F7A75" stroke-linejoin="round" stroke-width="2.5"></polygon>
<!-- Box Right Shadow Rim -->
<polygon fill="#12514D" points="70,112 105,94 105,98 70,116"></polygon>
<!-- Front Fold Flap / Card Tray Rim -->
<path d="M35,62 L70,80 L105,62" fill="none" opacity="0.7" stroke="#6BD8CE" stroke-linecap="round" stroke-width="2.5"></path>
<!-- Golden Kite Badge on Front of Box -->
<g transform="translate(62, 85)">
<path d="M8,0 L16,8 L8,18 L0,8 Z" fill="#FFB054" stroke="#D98A28" stroke-width="1.5"></path>
<circle cx="8" cy="8" fill="#FFFFFF" r="2"></circle>
</g>
<!-- Shiny Sparkle Rising from Box -->
<g transform="translate(68, 22)">
<path d="M12,2 L15,10 L23,13 L15,16 L12,24 L9,16 L1,13 L9,10 Z" fill="#FFC94A" stroke="#E5A610" stroke-linejoin="round" stroke-width="1.5"></path>
<circle cx="12" cy="13" fill="#FFFFFF" r="2.5"></circle>
</g>
</svg>
</div>
</div>
<!-- Title & Single Explanatory Line -->
<div class="text-center my-3 max-w-xs">
<h1 class="text-2xl font-extrabold tracking-tight text-[#EEF6F7] mb-1">
        Your deck is empty
      </h1>
<p class="text-sm font-semibold text-[#A9BFC1] leading-snug">
        Save high-scoring exam words to review with smart spaced repetition.
      </p>
</div>
<!-- Two Tactile Action Buttons -->
<div class="w-full flex flex-col gap-3.5 mt-2">
<!-- Primary CTA: 'Look up a word' (Coral-orange candy button with 6px ledge #B53A22 and deep brown-black #1A0702 ink) -->
<button class="w-full h-14 rounded-2xl flex items-center justify-center gap-2.5 px-6 cursor-pointer select-none" style="background: linear-gradient(180deg, #FF9447 0%, #F2553B 100%); box-shadow: 0 6px 0 0 #B53A22, 0 10px 20px rgba(242, 85, 59, 0.35); border: none;">
<svg class="w-5 h-5 text-[#1A0702]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8"></path>
</svg>
<span class="text-base font-extrabold text-[#1A0702] tracking-wide">
          Look up a word
        </span>
</button>
<!-- Secondary CTA: 'Browse word sets' (Elevated dark teal card button with 2px border, physical 5px bottom ledge #091417, and crisp light text) -->
<button class="w-full h-14 rounded-2xl flex items-center justify-center gap-2.5 px-6 cursor-pointer select-none bg-[#162930] border-2 border-[#2E4854] shadow-[0_5px_0_0_#091417] active:translate-y-[3px] active:shadow-[0_2px_0_0_#091417] transition-all">
<svg class="w-5 h-5 text-[#6BD8CE]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"></path>
</svg>
<span class="text-base font-extrabold text-[#EEF6F7] tracking-wide">
          Browse word sets
        </span>
</button>
</div>
</main>
<!-- ================= FIXED BOTTOM TAB NAVIGATION BAR (Lexkite 5-Tab Chrome) ================= -->
<footer class="w-full bg-[#0B171A] border-t border-[#20363F] py-2 px-3 sticky bottom-0 z-30 shadow-[0_-4px_16px_rgba(0,0,0,0.4)]">
<nav class="max-w-md mx-auto grid grid-cols-5 gap-1.5 items-center">
<!-- Tab 1: Learn -->
<button class="flex flex-col items-center justify-center py-1.5 rounded-xl hover:bg-[#162930] transition-colors">
<svg class="w-6 h-6 text-[#7B9699]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
<span class="text-[11px] font-bold text-[#7B9699] mt-0.5">Learn</span>
</button>
<!-- Tab 2: Review (Active Tab with teal border and subtle teal tint) -->
<button class="flex flex-col items-center justify-center py-1.5 rounded-xl bg-[#122A2D] border-2 border-[#2BA39A] shadow-[0_3px_0_0_#0D4447] cursor-pointer">
<svg class="w-6 h-6 text-[#6BD8CE]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"></path>
</svg>
<span class="text-[11px] font-extrabold text-[#6BD8CE] mt-0.5">Review</span>
</button>
<!-- Tab 3: Practice -->
<button class="flex flex-col items-center justify-center py-1.5 rounded-xl hover:bg-[#162930] transition-colors">
<svg class="w-6 h-6 text-[#7B9699]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
<span class="text-[11px] font-bold text-[#7B9699] mt-0.5">Practice</span>
</button>
<!-- Tab 4: Leagues -->
<button class="flex flex-col items-center justify-center py-1.5 rounded-xl hover:bg-[#162930] transition-colors">
<svg class="w-6 h-6 text-[#7B9699]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
<span class="text-[11px] font-bold text-[#7B9699] mt-0.5">Leagues</span>
</button>
<!-- Tab 5: Me -->
<button class="flex flex-col items-center justify-center py-1.5 rounded-xl hover:bg-[#162930] transition-colors">
<svg class="w-6 h-6 text-[#7B9699]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
<span class="text-[11px] font-bold text-[#7B9699] mt-0.5">Me</span>
</button>
</nav>
</footer>
</body>
</html>
