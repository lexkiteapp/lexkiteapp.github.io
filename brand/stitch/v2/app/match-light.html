<body class="bg-background text-on-background min-h-screen flex flex-col justify-between selection:bg-secondary-fixed selection:text-on-secondary-fixed antialiased pb-24">
<!-- Top App Bar / Drill Header -->
<header class="w-full bg-background border-b-2 border-outline-variant shadow-[0_4px_0_0_#bec9c6]">
<div class="flex justify-between items-center w-full px-4 h-16 max-w-5xl mx-auto">
<!-- Leading Close Button -->
<button aria-label="Close" class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-outline-variant shadow-[0_3px_0_0_#bec9c6] active:translate-y-0.5 active:shadow-[0_1px_0_0_#bec9c6] flex items-center justify-center transition-all duration-75" type="button">
<span class="material-symbols-outlined text-primary text-xl font-bold">close</span>
</button>
<!-- Center Countdown / Stopwatch -->
<div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-surface-container-low border-2 border-surface-variant shadow-[0_3px_0_0_#e6d7cd]">
<span class="material-symbols-outlined text-primary-container text-base" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-label-lg text-label-lg text-on-surface font-extrabold tracking-wide">0:38</span>
</div>
<!-- Trailing Action Counter -->
<div class="flex items-center gap-1 px-3.5 py-1.5 rounded-full bg-secondary-fixed border-2 border-secondary shadow-[0_3px_0_0_#8c5000]">
<span class="material-symbols-outlined text-on-secondary-fixed text-sm" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-md text-label-md text-on-secondary-fixed font-extrabold">4/6 pairs</span>
</div>
</div>
</header>
<!-- Main Game Canvas Container -->
<main class="w-full max-w-lg mx-auto px-4 pt-4 flex-1 flex flex-col justify-start">
<!-- Penalty Notice Pill Banner -->
<div class="flex items-center justify-center mb-5">
<div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-surface-container border border-outline-variant shadow-[0_2px_0_0_#bec9c6]">
<span class="w-2 h-2 rounded-full bg-secondary-container animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface font-extrabold tracking-wide">+1 s per miss</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm">schedule</span>
</div>
</div>
<!-- Match Drill Matrix: 12 Tactile Chunky Tiles -->
<div class="grid grid-cols-2 gap-3.5 sm:gap-4 w-full">
<!-- Tile 1: Solved / Matched (Dimmed) -->
<div class="opacity-45 pointer-events-none rounded-2xl bg-surface-variant border-2 border-outline-variant p-4 flex flex-col justify-center items-center min-h-[92px] shadow-[0_2px_0_0_#bec9c6] text-center select-none">
<span class="font-headline-sm text-headline-sm text-on-surface-variant line-through decoration-primary-container decoration-2">meticulous</span>
<span class="flex items-center gap-1 mt-1 text-primary-container font-label-sm text-label-sm font-bold">
<span class="material-symbols-outlined text-sm font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          Matched
        </span>
</div>
<!-- Tile 2: Default Pressable -->
<button class="group rounded-2xl bg-surface-container-lowest border-2 border-outline-variant p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#bec9c6] active:translate-y-1 active:shadow-[0_0_0_0_#bec9c6] hover:bg-surface-container transition-all duration-75 text-center" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface group-active:scale-95 transition-transform duration-75">candid</span>
</button>
<!-- Tile 3: Selected Active (Pair Part 1) -->
<button class="rounded-2xl bg-surface-container-lowest border-2 border-primary-container p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#136a63] translate-y-0.5 ring-2 ring-primary-fixed text-center relative overflow-hidden transition-all duration-75" type="button">
<div class="absolute top-1.5 right-2 w-2 h-2 rounded-full bg-primary-container"></div>
<span class="font-headline-sm text-headline-sm text-primary-container font-extrabold">ubiquitous</span>
</button>
<!-- Tile 4: Solved / Matched (Dimmed) -->
<div class="opacity-45 pointer-events-none rounded-2xl bg-surface-variant border-2 border-outline-variant p-4 flex flex-col justify-center items-center min-h-[92px] shadow-[0_2px_0_0_#bec9c6] text-center select-none">
<span class="font-body-md text-body-md text-on-surface-variant line-through decoration-primary-container decoration-2">very careful</span>
<span class="flex items-center gap-1 mt-1 text-primary-container font-label-sm text-label-sm font-bold">
<span class="material-symbols-outlined text-sm font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          Matched
        </span>
</div>
<!-- Tile 5: Default Pressable -->
<button class="group rounded-2xl bg-surface-container-lowest border-2 border-outline-variant p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#bec9c6] active:translate-y-1 active:shadow-[0_0_0_0_#bec9c6] hover:bg-surface-container transition-all duration-75 text-center" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface group-active:scale-95 transition-transform duration-75">scrutinize</span>
</button>
<!-- Tile 6: Selected Active (Pair Part 2 - Matches Tile 3) -->
<button class="rounded-2xl bg-surface-container-lowest border-2 border-primary-container p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#136a63] translate-y-0.5 ring-2 ring-primary-fixed text-center relative overflow-hidden transition-all duration-75" type="button">
<div class="absolute top-1.5 right-2 w-2 h-2 rounded-full bg-primary-container"></div>
<span class="font-body-md text-body-md text-primary-container font-extrabold">found everywhere</span>
</button>
<!-- Tile 7: Default Pressable -->
<button class="group rounded-2xl bg-surface-container-lowest border-2 border-outline-variant p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#bec9c6] active:translate-y-1 active:shadow-[0_0_0_0_#bec9c6] hover:bg-surface-container transition-all duration-75 text-center" type="button">
<span class="font-headline-sm text-headline-sm text-on-surface group-active:scale-95 transition-transform duration-75">pragmatic</span>
</button>
<!-- Tile 8: Default Pressable -->
<button class="group rounded-2xl bg-surface-container-lowest border-2 border-outline-variant p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#bec9c6] active:translate-y-1 active:shadow-[0_0_0_0_#bec9c6] hover:bg-surface-container transition-all duration-75 text-center" type="button">
<span class="font-body-md text-body-md text-on-surface group-active:scale-95 transition-transform duration-75">frank &amp; direct</span>
</button>
<!-- Tile 9: Default Pressable -->
<button class="group rounded-2xl bg-surface-container-lowest border-2 border-outline-variant p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#bec9c6] active:translate-y-1 active:shadow-[0_0_0_0_#bec9c6] hover:bg-surface-container transition-all duration-75 text-center" type="button">
<span class="font-body-md text-body-md text-on-surface group-active:scale-95 transition-transform duration-75">examine closely</span>
</button>
<!-- Tile 10: Default Pressable -->
<button class="group rounded-2xl bg-surface-container-lowest border-2 border-outline-variant p-4 flex items-center justify-center min-h-[92px] shadow-[0_4px_0_0_#bec9c6] active:translate-y-1 active:shadow-[0_0_0_0_#bec9c6] hover:bg-surface-container transition-all duration-75 text-center" type="button">
<span class="font-body-md text-body-md text-on-surface group-active:scale-95 transition-transform duration-75">practical minded</span>
</button>
<!-- Tile 11: Solved / Matched (Dimmed) -->
<div class="opacity-45 pointer-events-none rounded-2xl bg-surface-variant border-2 border-outline-variant p-4 flex flex-col justify-center items-center min-h-[92px] shadow-[0_2px_0_0_#bec9c6] text-center select-none">
<span class="font-headline-sm text-headline-sm text-on-surface-variant line-through decoration-primary-container decoration-2">lucid</span>
<span class="flex items-center gap-1 mt-1 text-primary-container font-label-sm text-label-sm font-bold">
<span class="material-symbols-outlined text-sm font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          Matched
        </span>
</div>
<!-- Tile 12: Solved / Matched (Dimmed) -->
<div class="opacity-45 pointer-events-none rounded-2xl bg-surface-variant border-2 border-outline-variant p-4 flex flex-col justify-center items-center min-h-[92px] shadow-[0_2px_0_0_#bec9c6] text-center select-none">
<span class="font-body-sm text-body-sm text-on-surface-variant line-through decoration-primary-container decoration-2">clear &amp; easy to understand</span>
<span class="flex items-center gap-1 mt-1 text-primary-container font-label-sm text-label-sm font-bold">
<span class="material-symbols-outlined text-sm font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          Matched
        </span>
</div>
</div>
<!-- Motivational Combo Hint -->
<div class="mt-5 mb-2 flex items-center justify-center gap-2">
<div class="flex items-center gap-1.5 px-3 py-1 bg-surface-container-low rounded-full border border-surface-variant">
<span class="material-symbols-outlined text-secondary text-base" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-label-sm text-label-sm text-secondary font-extrabold">2 in a row! Keep going!</span>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Shared Component Anchor) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface-container-lowest border-t-2 border-outline-variant shadow-[0_-4px_0_0_#efe0d6]">
<!-- Tab 1: Today -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1.5 hover:text-primary active:scale-95 transition-transform duration-75" type="button">
<span class="material-symbols-outlined text-2xl">today</span>
<span class="font-label-sm text-label-sm">Today</span>
</button>
<!-- Tab 2: Vocab (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-fixed rounded-full px-3 py-1.5 shadow-[0_3px_0_0_#8c5000] active:translate-y-0.5 active:shadow-none active:scale-95 transition-transform duration-75" type="button">
<span class="material-symbols-outlined text-2xl font-bold" style="font-variation-settings: 'FILL' 1;">style</span>

</button>
<!-- Tab 3: Skills -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1.5 hover:text-primary active:scale-95 transition-transform duration-75" type="button">
<span class="material-symbols-outlined text-2xl">psychology</span>
<span class="font-label-sm text-label-sm">Skills</span>
</button>
<!-- Tab 4: Tests -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1.5 hover:text-primary active:scale-95 transition-transform duration-75" type="button">
<span class="material-symbols-outlined text-2xl">assignment</span>
<span class="font-label-sm text-label-sm">Tests</span>
</button>
<!-- Tab 5: Me -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1.5 hover:text-primary active:scale-95 transition-transform duration-75" type="button">
<span class="material-symbols-outlined text-2xl">person</span>
<span class="font-label-sm text-label-sm">Me</span>
</button>
</nav>
