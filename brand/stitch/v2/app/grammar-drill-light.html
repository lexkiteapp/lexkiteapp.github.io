<body class="bg-background text-[#1e293b] antialiased min-h-screen flex flex-col justify-between selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Top App Bar (Shared Component Anchor) -->
<header class="w-full bg-surface">
<div class="flex justify-between items-center w-full px-4 h-16 max-w-md mx-auto">
<!-- Leading Icon: Close / Back -->
<button aria-label="Close drill" class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-[#d5c3b5] flex items-center justify-center text-[#0f172a] tactile-ledge-card hover:bg-surface-container active:translate-y-0.5 transition-transform" type="button">
<span class="material-symbols-outlined text-[#0f172a] text-xl font-bold">close</span>
</button>
<!-- Candy Progress Bar Center -->
<div class="flex-1 mx-3">
<div class="w-full h-4 bg-[#e2d2c5] rounded-full p-0.5 border-2 border-[#bfaaa0] overflow-hidden shadow-inner flex items-center">
<div class="h-full bg-[#00504b] rounded-full relative gloss-shine transition-all duration-500 ease-out" style="width: 65%;">
<!-- Pulsing Candy Glint Tip -->
<div class="absolute right-1 top-0.5 w-1.5 h-1.5 bg-white rounded-full opacity-90 animate-pulse"></div>
</div>
</div>
</div>
<!-- Trailing Action Text: 5 ❤️ (Life / Hearts Counter with ≥ 4.5:1 high contrast) -->
<div class="flex items-center gap-1.5 px-3 py-1 bg-[#fef2f2] border-2 border-[#dc2626] rounded-full tactile-ledge-card">
<span class="font-label-md text-label-md text-[#7c2d12] font-black tracking-tight">5</span>
<span class="text-[#dc2626] text-base leading-none select-none">❤️</span>
</div>
</div>
</header>
<!-- Drill Content Canvas (Fluid Mobile Container) -->
<main class="w-full max-w-md mx-auto px-margin flex-1 flex flex-col justify-start pt-space-xs pb-4">
<!-- Header Drill Metadata & Instruction -->
<div class="mb-space-md">
<!-- Category Pill with Crisp High-Contrast Amber Border Accent -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border-2 border-[#00504b] bg-surface-container-low text-[#00504b] mb-space-sm shadow-sm">
<span class="material-symbols-outlined text-[#00504b] text-sm" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-[#003632] font-extrabold">IELTS BAND 7 GRAMMAR</span>
</div>
<!-- Friendly Punchy Instruction -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-[#0f172a] font-extrabold">
        Fill in the correct blank:
      </h1>
<p class="font-body-sm text-body-sm text-[#334155] mt-0.5 font-semibold">
        Choose the verb tense that matches the time expression.
      </p>
</div>
<!-- Sentence Stimulus Card with Slot Gap -->
<section class="w-full bg-surface-container-lowest border-2 border-[#d5c3b5] rounded-DEFAULT p-space-md mb-space-md tactile-ledge-card">
<div class="flex items-center justify-between mb-space-sm border-b border-[#e2d2c5] pb-space-xs">
<span class="font-label-sm text-label-sm text-[#334155] font-black tracking-wider uppercase">QUESTION 6 OF 10</span>
<span class="material-symbols-outlined text-[#00504b] text-base font-bold" title="Audio listen">volume_up</span>
</div>
<div class="text-body-lg font-body-lg text-[#0f172a] py-2 leading-relaxed font-bold flex flex-wrap items-center gap-2">
<span>She</span>
<!-- Completed Tactile Blank Slot -->
<span class="inline-flex items-center justify-center px-3 py-1 bg-[#a4f1e7] border-2 border-[#00504b] text-[#003632] font-extrabold rounded-lg tactile-ledge-selected gloss-shine">
          has lived
        </span>
<span>here since 2019.</span>
</div>
</section>
<!-- 4 Multiple Choice Answer Cards -->
<section aria-label="Select an answer" class="grid grid-cols-1 gap-2.5 mb-space-sm" role="radiogroup">
<!-- Option A -->
<button aria-checked="false" class="w-full text-left bg-surface-container-lowest border-2 border-[#d5c3b5] rounded-DEFAULT p-space-sm px-4 flex items-center justify-between tactile-ledge-card candy-card-active transition-all group" role="radio" type="button">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full border-2 border-[#94a3b8] bg-[#f1f5f9] flex items-center justify-center font-label-md text-label-md text-[#0f172a] font-extrabold">
            A
          </div>
<span class="font-body-md text-body-md text-[#0f172a] font-extrabold group-hover:text-[#00504b] transition-colors">lives</span>
</div>
</button>
<!-- Option B: Selected & Correct State -->
<button aria-checked="true" class="w-full text-left bg-[#e6f7f5] border-2 border-[#00504b] rounded-DEFAULT p-space-sm px-4 flex items-center justify-between tactile-ledge-selected transition-all relative gloss-shine" role="radio" type="button">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full border-2 border-[#00504b] bg-[#a4f1e7] flex items-center justify-center font-label-md text-label-md text-[#003632] font-black">
            B
          </div>
<span class="font-body-md text-body-md text-[#003632] font-black">has lived</span>
</div>
<!-- Success Badge Indicator -->
<div class="w-7 h-7 rounded-full bg-[#00504b] text-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-base font-black" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Option C -->
<button aria-checked="false" class="w-full text-left bg-surface-container-lowest border-2 border-[#d5c3b5] rounded-DEFAULT p-space-sm px-4 flex items-center justify-between tactile-ledge-card candy-card-active transition-all group" role="radio" type="button">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full border-2 border-[#94a3b8] bg-[#f1f5f9] flex items-center justify-center font-label-md text-label-md text-[#0f172a] font-extrabold">
            C
          </div>
<span class="font-body-md text-body-md text-[#0f172a] font-extrabold group-hover:text-[#00504b] transition-colors">is living</span>
</div>
</button>
<!-- Option D -->
<button aria-checked="false" class="w-full text-left bg-surface-container-lowest border-2 border-[#d5c3b5] rounded-DEFAULT p-space-sm px-4 flex items-center justify-between tactile-ledge-card candy-card-active transition-all group" role="radio" type="button">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full border-2 border-[#94a3b8] bg-[#f1f5f9] flex items-center justify-center font-label-md text-label-md text-[#0f172a] font-extrabold">
            D
          </div>
<span class="font-body-md text-body-md text-[#0f172a] font-extrabold group-hover:text-[#00504b] transition-colors">lived</span>
</div>
</button>
</section>
</main>
<!-- Celebratory Correct Feedback Drawer (Linear Task Phase) -->
<section class="w-full bg-[#faebe1] border-t-2 border-[#d5c3b5] pt-space-md pb-4 px-margin shadow-2xl">
<div class="max-w-md mx-auto flex flex-col gap-3">
<!-- Correct Banner Header with Reason Link -->
<div class="flex items-start justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#00504b] text-white flex items-center justify-center shadow-md border-2 border-[#003632] tactile-ledge-teal">
<span class="material-symbols-outlined text-2xl font-black" style="font-variation-settings: 'FILL' 1;">done_all</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-[#003632] font-black tracking-tight leading-none mb-1">
              Correct!
            </h2>
<p class="font-body-sm text-body-sm text-[#0f172a] font-bold">
              Rule: <span class="text-[#00504b] font-black">Present Perfect</span> with <span class="italic text-[#0f172a] font-black">"since 2019"</span>.
            </p>
</div>
</div>
<!-- "Why?" Deep-dive Explainer Trigger with high-contrast text and border -->
<button class="inline-flex items-center gap-1 px-3 py-1.5 bg-surface-container-lowest border-2 border-[#00504b] text-[#003632] rounded-full tactile-ledge-card candy-card-active font-label-sm text-label-sm font-extrabold" type="button">
<span>Why?</span>
<span class="material-symbols-outlined text-sm font-bold">help</span>
</button>
</div>
<!-- Chunky Tactile Candy Primary Action Button -->
<!-- Deep brown-black ink (#1a0d00) on orange button (≥ 4.5:1 contrast) -->
<button class="w-full bg-secondary-container text-[#1a0d00] font-label-lg text-label-lg font-black py-3.5 px-6 rounded-DEFAULT border-2 border-[#b86600] tactile-ledge-orange candy-btn-active gloss-shine flex items-center justify-center gap-2 tracking-wide uppercase transition-all" type="button">
<span class="tracking-wider">Continue</span>
<span class="material-symbols-outlined text-xl font-black">arrow_forward</span>
</button>
</div>
</section>
</body></html>
