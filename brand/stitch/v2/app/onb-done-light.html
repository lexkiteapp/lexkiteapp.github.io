<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite — Onboarding: You're all set!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
          colors: {
            lexCream: '#FFF7EA', lexCreamDeep: '#FBEFD8', lexCard: '#FFFFFF', lexBorder: '#EADEC8', lexLedge: '#D8CFBC',
            lexTeal: '#2BA39A', lexTealDeep: '#0F3D3E', lexTealLedge: '#1A7A72', lexCoral: '#F2553B', lexAmber: '#FFB054',
            lexCtaLedge: '#B53A22', lexInkDark: '#1E120A', lexTextMuted: '#4E6668', lexGold: '#FFC94A',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #FFF7EA; color: #0F3D3E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow-x: hidden; }
    .tactile-cta { background: linear-gradient(180deg, #FFB054 0%, #F2553B 100%); box-shadow: 0 6px 0 0 #B53A22, 0 12px 24px -4px rgba(242, 85, 59, 0.35); transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1); }
    .tactile-cta:hover { filter: brightness(1.03); transform: translateY(-1px); box-shadow: 0 7px 0 0 #B53A22, 0 16px 28px -4px rgba(242, 85, 59, 0.4); }
    .tactile-cta:active { transform: translateY(4px); box-shadow: 0 2px 0 0 #B53A22, 0 4px 10px -2px rgba(242, 85, 59, 0.25); }
    .tactile-chip { background: #FFFFFF; border: 2px solid #EADEC8; box-shadow: 0 4px 0 0 #D8CFBC; transition: transform 0.12s ease; }
    .tactile-chip:hover { transform: translateY(-1px); box-shadow: 0 5px 0 0 #D8CFBC; }
    .teacher-slot { border: 2px dashed #2BA39A; background: rgba(43, 163, 154, 0.05); border-radius: 24px; }
    .sparkle { position: absolute; pointer-events: none; user-select: none; }
  </style>
</head>
<body class="p-6 md:p-10 select-none">

  <div class="sparkle top-12 left-1/4 text-lexAmber opacity-70 animate-pulse"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z"/></svg></div>
  <div class="sparkle top-20 right-1/4 text-lexTeal opacity-60"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" /></svg></div>
  <div class="sparkle top-1/3 left-16 text-lexCoral opacity-65"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect width="20" height="20" rx="4" transform="rotate(45 10 10)"/></svg></div>
  <div class="sparkle top-1/3 right-16 text-lexGold opacity-80"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z"/></svg></div>
  <div class="sparkle bottom-28 left-20 text-lexTeal opacity-50"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8" /></svg></div>
  <div class="sparkle bottom-32 right-20 text-lexAmber opacity-60"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z"/></svg></div>

  <main class="w-full max-w-[540px] flex flex-col items-center text-center relative z-10">

    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-lexCreamDeep border border-lexBorder mb-6 shadow-sm">
      <span class="w-2.5 h-2.5 rounded-full bg-lexTeal animate-ping"></span>
      <span class="text-[12px] font-extrabold uppercase tracking-wider text-lexTealDeep">Step 4 of 4</span>
    </div>

    <div class="relative mb-6 flex items-center justify-center">
      <div class="absolute w-52 h-60 rounded-full bg-amber-100/60 blur-xl -z-10"></div>
      <div class="absolute -top-3 -left-6 text-lexCoral"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5" /></svg></div>
      <div class="absolute -top-4 -right-5 text-lexTeal"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg></div>
      <div class="absolute bottom-2 -left-8 text-lexGold"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z"/></svg></div>
      <div class="absolute bottom-3 -right-8 text-lexCoral"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect width="16" height="16" rx="4" transform="rotate(25 8 8)"/></svg></div>

      <!-- Teacher slot (dashed, centered) -->
      <div class="teacher-slot w-[140px] h-[170px] flex flex-col items-center justify-center p-3 text-center transition-all hover:bg-teal-500/10">
        <span class="text-[11px] font-extrabold uppercase tracking-widest text-lexTealDeep">Teacher</span>
        <span class="text-[10px] font-semibold text-lexTextMuted mt-0.5">140 × 170 Slot</span>
      </div>
    </div>

    <h1 class="text-3xl md:text-4xl font-extrabold text-lexTealDeep tracking-tight mb-2">You're all set!</h1>
    <p class="text-base font-semibold text-lexTextMuted max-w-sm mb-7">Your personalized study plan is ready. Let's get started together!</p>

    <div class="w-full grid grid-cols-3 gap-3 mb-8">
      <div class="tactile-chip rounded-2xl p-3.5 flex flex-col items-center text-center">
        <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center text-lexTeal border border-teal-100 mb-2"><span class="material-symbols-rounded text-2xl">menu_book</span></div>
        <span class="text-[11px] font-extrabold uppercase tracking-wider text-lexTextMuted mb-0.5">Exam</span>
        <span class="text-sm font-extrabold text-lexTealDeep">IELTS</span>
      </div>
      <div class="tactile-chip rounded-2xl p-3.5 flex flex-col items-center text-center">
        <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center text-lexAmber border border-amber-100 mb-2"><span class="material-symbols-rounded text-2xl">verified</span></div>
        <span class="text-[11px] font-extrabold uppercase tracking-wider text-lexTextMuted mb-0.5">Level</span>
        <span class="text-sm font-extrabold text-lexTealDeep">Intermediate</span>
      </div>
      <div class="tactile-chip rounded-2xl p-3.5 flex flex-col items-center text-center">
        <div class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center text-lexCoral border border-orange-100 mb-2"><span class="material-symbols-rounded text-2xl">local_fire_department</span></div>
        <span class="text-[11px] font-extrabold uppercase tracking-wider text-lexTextMuted mb-0.5">Daily Goal</span>
        <span class="text-sm font-extrabold text-lexTealDeep">10 min / day</span>
      </div>
    </div>

    <button class="tactile-cta w-full h-14 rounded-2xl flex items-center justify-center gap-2 cursor-pointer outline-none">
      <span class="text-lg font-extrabold text-lexInkDark tracking-wide">Start my first lesson</span>
      <span class="material-symbols-rounded text-2xl text-lexInkDark font-bold">arrow_forward</span>
    </button>

  </main>

</body>
</html>
