<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Dictionary — No Match (Tactile Night)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            'canvas-dark': '#081518',
            'panel-dark': '#101F24',
            'panel-raised': '#162930',
            'panel-border': '#28434D',
            'panel-ledge': '#0A1417',
            'teal-brand': '#2BA39A',
            'teal-light': '#4DD4CA',
            'teal-glow': 'rgba(43, 163, 154, 0.25)',
            'coral-brand': '#F2553B',
            'amber-brand': '#FFB054',
            'ink-dark': '#1A0702',
            'text-primary': '#EEF6F7',
            'text-secondary': '#A9BFC1',
            'text-muted': '#7A999C',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #081518;
      color: #EEF6F7;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .tactile-btn-primary {
      background: linear-gradient(180deg, #FF7854 0%, #F2553B 100%);
      box-shadow: 0 5px 0 0 #B53A22, 0 8px 16px rgba(242, 85, 59, 0.25);
      transition: all 0.1s ease-in-out;
    }
    .tactile-btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #B53A22, 0 4px 8px rgba(242, 85, 59, 0.2);
    }

    .tactile-btn-secondary {
      background: #162930;
      border: 2px solid #28434D;
      box-shadow: 0 4px 0 0 #0A1417;
      transition: all 0.1s ease-in-out;
    }
    .tactile-btn-secondary:hover {
      background: #1C333C;
      border-color: #3B5F6C;
    }
    .tactile-btn-secondary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #0A1417;
    }

    .tactile-card {
      background: #101F24;
      border: 2px solid #233B44;
      box-shadow: 0 6px 0 0 #071013, 0 16px 32px rgba(4, 16, 19, 0.4);
    }

    .tactile-pill {
      background: #14242A;
      border: 1.5px solid #28434D;
      box-shadow: 0 3px 0 0 #0A1417;
      transition: all 0.1s ease;
    }
    .tactile-pill:hover {
      background: #1A2F37;
      border-color: #2BA39A;
      transform: translateY(-1px);
      box-shadow: 0 4px 0 0 #0A1417, 0 0 12px rgba(43, 163, 154, 0.2);
    }
    .tactile-pill:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 0 #0A1417;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-teal-brand selection:text-white">

  <!-- Top Header Navigation -->
  <header class="w-full h-16 border-b-2 border-panel-border/50 bg-[#09171B]/90 backdrop-blur-md px-6 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-4">
      <button class="w-10 h-10 rounded-xl bg-panel-raised border border-panel-border flex items-center justify-center text-text-secondary hover:text-text-primary hover:bg-[#1D343D] active:translate-y-0.5 transition shadow-[0_2px_0_0_#0A1417]" aria-label="Back">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <div class="flex items-center gap-2.5">
        <!-- Lexkite Origami Diamond Icon -->
        <div class="w-7 h-7 relative flex items-center justify-center">
          <svg viewBox="0 0 32 32" class="w-7 h-7 filter drop-shadow-[0_2px_4px_rgba(43,163,154,0.3)]" fill="none">
            <path d="M16 2L30 16L16 30L2 16L16 2Z" fill="#162E35" stroke="#2BA39A" stroke-width="1.5"/>
            <path d="M16 2L30 16L16 16L16 2Z" fill="#2BA39A"/>
            <path d="M16 16L30 16L16 30L16 16Z" fill="#1F7A75"/>
            <path d="M2 16L16 2L16 16L2 16Z" fill="#FFB054"/>
            <path d="M2 16L16 16L16 30L2 16Z" fill="#F2553B"/>
            <circle cx="16" cy="16" r="2" fill="#FFFFFF"/>
          </svg>
        </div>
        <h1 class="text-xl font-extrabold tracking-tight text-text-primary">Dictionary</h1>
      </div>
    </div>

    <!-- Header Stats -->
    <div class="flex items-center gap-3">
      <!-- Streak Pill -->
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-panel-raised border border-panel-border/80 shadow-[0_2px_0_0_#0A1417]">
        <svg class="w-4 h-4 text-[#FF7854]" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 23c-4.97 0-9-4.03-9-9 0-3.6 2.1-6.72 5.17-8.15.54-.25 1.18.06 1.32.65.23.95.84 1.76 1.66 2.24.4.24.91.08 1.13-.32.61-1.12 1.48-2.6 1.48-4.42 0-.58.45-1.06 1.03-1.04 4.14.16 7.41 3.55 7.41 7.74 0 .39-.03.78-.08 1.16-.08.57.34 1.09.92 1.14.58.05 1.09-.34 1.15-.92.05-.46.09-.93.09-1.4 0-.41.45-.66.8-.46C20.67 11.23 21 12.57 21 14c0 4.97-4.03 9-9 9z" />
        </svg>
        <span class="text-xs font-extrabold text-amber-brand">14</span>
      </div>

      <!-- XP Pill -->
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-panel-raised border border-panel-border/80 shadow-[0_2px_0_0_#0A1417]">
        <svg class="w-4 h-4 text-amber-brand" fill="currentColor" viewBox="0 0 24 24">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span class="text-xs font-extrabold text-text-primary tracking-wide">820 XP</span>
      </div>
    </div>
  </header>

  <!-- Main Search & Empty State Container -->
  <main class="flex-1 w-full max-w-2xl mx-auto px-4 py-8 flex flex-col items-center justify-center">

    <!-- Search Bar with Error State -->
    <div class="w-full mb-3">
      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-teal-brand" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        
        <input 
          type="text" 
          value="resillient|" 
          readonly
          class="w-full h-14 pl-12 pr-12 rounded-2xl bg-panel-raised border-2 border-teal-brand text-text-primary font-bold text-lg focus:outline-none shadow-[0_4px_0_0_#144743,0_0_20px_rgba(43,163,154,0.15)] cursor-text"
        />
        
        <button class="absolute inset-y-0 right-0 pr-4 flex items-center text-text-muted hover:text-text-primary transition" aria-label="Clear search">
          <div class="w-6 h-6 rounded-full bg-[#20363F] hover:bg-[#2A4753] flex items-center justify-center text-text-secondary">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </div>
        </button>
      </div>

      <!-- Error Sub-message -->
      <div class="flex items-center gap-2 mt-2.5 px-2">
        <span class="w-2 h-2 rounded-full bg-coral-brand animate-pulse"></span>
        <span class="text-xs font-semibold text-[#FF8570]">Spelling not found in IELTS Core Deck</span>
      </div>
    </div>

    <!-- No Exact Match Card -->
    <div class="w-full tactile-card rounded-3xl p-8 sm:p-10 flex flex-col items-center text-center mt-3 relative overflow-hidden">
      <!-- Subtle Decorative Radial Lighting -->
      <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-64 h-64 bg-teal-brand/10 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Illustrated Tactile Magnifier Graphic -->
      <div class="relative w-28 h-28 mb-5 flex items-center justify-center">
        <!-- Floating Ambient Glow -->
        <div class="absolute inset-0 bg-teal-brand/20 rounded-full blur-xl"></div>
        
        <!-- Decorative Sparkles -->
        <svg class="absolute -top-1 -right-1 w-6 h-6 text-amber-brand animate-pulse" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
        </svg>
        <svg class="absolute bottom-2 -left-2 w-4 h-4 text-teal-light" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
        </svg>

        <!-- 3D Tactile Magnifier SVG -->
        <svg class="w-24 h-24 relative z-10" viewBox="0 0 96 96" fill="none">
          <!-- Glass lens shadow/ledge -->
          <circle cx="44" cy="44" r="30" fill="#0C1B20" />
          <circle cx="44" cy="46" r="28" fill="#13272E" />
          <!-- Turquoise Lens Rim with physical ledge -->
          <circle cx="44" cy="42" r="28" fill="#1B4D4B" stroke="#2BA39A" stroke-width="4"/>
          <!-- Lens interior surface -->
          <circle cx="44" cy="42" r="24" fill="url(#lensGrad)" />
          <!-- Top shine highlight -->
          <path d="M26 34C28 26 36 21 44 21" stroke="#E6FFFA" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
          <!-- Question mark inside lens -->
          <text x="44" y="49" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#092628">?</text>
          
          <!-- Handle with tactile layered 3D depth -->
          <path d="M64 62L82 80C84.5 82.5 84.5 86.5 82 89C79.5 91.5 75.5 91.5 73 89L55 71" fill="#C93D25" />
          <path d="M64 60L82 78C84.5 80.5 84.5 84.5 82 87C79.5 89.5 75.5 89.5 73 87L55 69" fill="#F2553B" />
          <path d="M65 61L81 77" stroke="#FFA494" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

          <defs>
            <radialGradient id="lensGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(38 36) rotate(52) scale(26)">
              <stop stop-color="#73ECE3"/>
              <stop offset="0.65" stop-color="#31BDB2"/>
              <stop offset="1" stop-color="#23948B"/>
            </radialGradient>
          </defs>
        </svg>
      </div>

      <!-- Headlines -->
      <h2 class="text-2xl sm:text-3xl font-extrabold text-text-primary mb-2 tracking-tight">No exact match</h2>
      <p class="text-sm sm:text-base font-medium text-text-secondary max-w-sm mb-6 leading-relaxed">
        Check spelling or pick an exam word below:
      </p>

      <!-- Did you mean section -->
      <div class="w-full flex flex-col items-center mb-8">
        <span class="text-xs font-extrabold uppercase tracking-wider text-text-muted mb-3.5">DID YOU MEAN?</span>
        
        <!-- Suggestions Grid / Wrap -->
        <div class="flex flex-wrap items-center justify-center gap-3 max-w-md">
          <!-- Suggestion 1: resilient (Target Candidate) -->
          <button class="tactile-pill flex items-center gap-2.5 px-4 py-2.5 rounded-2xl group border-teal-brand/40 bg-panel-raised">
            <span class="w-2.5 h-2.5 rounded-full bg-teal-brand ring-4 ring-teal-brand/20"></span>
            <span class="font-bold text-sm text-text-primary group-hover:text-teal-light transition">resilient</span>
            <span class="px-2 py-0.5 rounded-md text-[11px] font-extrabold bg-[#1A3D3C] text-teal-light border border-teal-brand/30">C1</span>
          </button>

          <!-- Suggestion 2: reliance -->
          <button class="tactile-pill flex items-center gap-2.5 px-4 py-2.5 rounded-2xl group">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-brand ring-4 ring-amber-brand/20"></span>
            <span class="font-bold text-sm text-text-primary group-hover:text-amber-brand transition">reliance</span>
            <span class="px-2 py-0.5 rounded-md text-[11px] font-extrabold bg-[#382D1B] text-[#FFC47D] border border-amber-brand/30">B2</span>
          </button>

          <!-- Suggestion 3: resident -->
          <button class="tactile-pill flex items-center gap-2.5 px-4 py-2.5 rounded-2xl group">
            <span class="w-2.5 h-2.5 rounded-full bg-text-muted ring-4 ring-text-muted/20"></span>
            <span class="font-bold text-sm text-text-primary group-hover:text-white transition">resident</span>
            <span class="px-2 py-0.5 rounded-md text-[11px] font-extrabold bg-[#1E2D33] text-text-secondary border border-panel-border">B1</span>
          </button>
        </div>
      </div>

      <!-- Action Button: Search the web dictionary -->
      <button class="w-full max-w-sm h-13 py-3.5 px-6 rounded-2xl tactile-btn-secondary flex items-center justify-center gap-2.5 font-bold text-sm text-text-primary tracking-wide">
        <svg class="w-4 h-4 text-teal-brand" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke-linecap="round"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" stroke-linecap="round"/>
        </svg>
        <span>Search the web dictionary</span>
        <svg class="w-4 h-4 text-teal-brand" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

    </div>

    <!-- Need Inspiration Helper -->
    <div class="mt-6 flex items-center justify-center gap-2 text-sm font-semibold">
      <span class="text-text-muted">Need inspiration?</span>
      <a href="#" class="text-teal-brand hover:text-teal-light font-bold flex items-center gap-1 transition group">
        <span>Browse Band 7.5 Word Decks</span>
        <svg class="w-3.5 h-3.5 transition group-hover:translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </a>
    </div>

  </main>

  <!-- Bottom Navigation Bar (5 Standard Tabs: Learn, Review, Practice, Leagues, Me) -->
  <nav class="w-full h-18 border-t-2 border-panel-border/50 bg-[#09171B]/95 backdrop-blur-md px-6 py-2 flex items-center justify-center sticky bottom-0 z-40">
    <div class="w-full max-w-lg flex items-center justify-between">
      
      <!-- Learn -->
      <button class="flex flex-col items-center justify-center gap-1 text-text-muted hover:text-text-primary transition py-1 px-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        <span class="text-[11px] font-bold">Learn</span>
      </button>

      <!-- Review (ACTIVE Tab with signature tactile rounded well + 2px teal border) -->
      <button class="flex flex-col items-center justify-center gap-1 py-1 px-4 rounded-xl bg-teal-brand/15 border-2 border-teal-brand text-teal-light shadow-[0_0_12px_rgba(43,163,154,0.25)]">
        <svg class="w-6 h-6 text-teal-light" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
        <span class="text-[11px] font-extrabold text-teal-light">Review</span>
      </button>

      <!-- Practice -->
      <button class="flex flex-col items-center justify-center gap-1 text-text-muted hover:text-text-primary transition py-1 px-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <span class="text-[11px] font-bold">Practice</span>
      </button>

      <!-- Leagues -->
      <button class="flex flex-col items-center justify-center gap-1 text-text-muted hover:text-text-primary transition py-1 px-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-[11px] font-bold">Leagues</span>
      </button>

      <!-- Me -->
      <button class="flex flex-col items-center justify-center gap-1 text-text-muted hover:text-text-primary transition py-1 px-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="text-[11px] font-bold">Me</span>
      </button>

    </div>
  </nav>

</body>
</html>
