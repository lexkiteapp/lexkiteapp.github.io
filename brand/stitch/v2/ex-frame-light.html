<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite - Lesson Exercise</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {"darkMode":"class","theme":{"extend":{"colors":{"secondary-fixed-dim":"#ffb872","on-secondary":"#ffffff","on-error":"#ffffff","background":"#fff8f5","tertiary-fixed":"#ffdf9b","on-surface-variant":"#3f4947","surface-bright":"#fff8f5","on-secondary-container":"#633700","on-tertiary-fixed-variant":"#5b4300","outline":"#6f7977","error-container":"#ffdad6","surface-dim":"#e6d7cd","secondary-fixed":"#ffdcbf","on-secondary-fixed-variant":"#6a3b00","outline-variant":"#bec9c6","surface-variant":"#efe0d6","surface-container-high":"#f4e5db","on-secondary-fixed":"#2d1600","tertiary-fixed-dim":"#f5bf31","on-tertiary":"#ffffff","error":"#ba1a1a","primary-fixed-dim":"#88d4cb","primary-container":"#136a63","tertiary-container":"#785a00","surface-container-low":"#fff1e8","surface-tint":"#126a63","primary":"#00504b","on-tertiary-fixed":"#251a00","inverse-primary":"#88d4cb","surface-container-lowest":"#ffffff","on-error-container":"#93000a","inverse-on-surface":"#fdeee3","primary-fixed":"#a4f1e7","on-primary-container":"#9be7de","surface":"#fff8f5","on-surface":"#211a14","on-primary-fixed":"#00201d","on-background":"#211a14","inverse-surface":"#372f28","on-tertiary-container":"#ffd370","surface-container":"#faebe1","secondary-container":"#fd9500","on-primary":"#ffffff","on-primary-fixed-variant":"#00504a","secondary":"#8c5000","surface-container-highest":"#efe0d6","tertiary":"#5b4300"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"space-md":"16px","space-lg":"24px","space-xs":"4px","margin":"16px","space-xl":"32px","space-sm":"8px","gutter":"16px"},"fontFamily":{"title":["Plus Jakarta Sans"],"display":["Plus Jakarta Sans"],"label":["Plus Jakarta Sans"],"body":["Plus Jakarta Sans"]},"fontSize":{"title":["22px",{"lineHeight":"28px","fontWeight":"700"}],"display":["32px",{"lineHeight":"38px","fontWeight":"800"}],"label":["12px",{"lineHeight":"16px","letterSpacing":"0.06em","fontWeight":"800"}],"body":["16px",{"lineHeight":"24px","fontWeight":"500"}]}}}}
</script>
<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased flex justify-center min-h-screen selection:bg-primary selection:text-on-primary">
<main class="w-full max-w-[390px] min-h-screen flex flex-col justify-between px-margin py-space-sm bg-surface relative overflow-x-hidden">
<!-- Top Focus Bar (Progress & Session Controls) -->
<header class="w-full pt-space-xs pb-space-sm flex flex-col gap-space-sm">
<div class="flex items-center justify-between gap-space-sm">
<!-- Close 'X' Button -->
<button aria-label="Exit Lesson" class="w-11 h-11 flex items-center justify-center rounded-xl bg-surface-container-low border border-outline-variant hover:border-primary text-on-surface-variant hover:text-primary transition-all active:translate-y-[2px]" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<!-- Progress Tracker -->
<div class="flex-1 flex flex-col gap-1">
<div class="flex justify-between items-center px-1">
<span class="font-label text-label text-on-surface-variant">Question 6 of 10</span>
<div class="flex items-center gap-1 text-tertiary">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label text-label text-tertiary">14</span>
</div>
</div>
<!-- Tactile Progress Bar -->
<div class="h-3 w-full bg-surface-container-lowest rounded-full p-[2px] border border-outline-variant/60 shadow-inner">
<div class="h-full bg-primary rounded-full relative border-b-2 border-primary-container" style="width: 65%;">
<div class="absolute inset-x-1 top-0 h-[1.5px] bg-white/40 rounded-full"></div>
</div>
</div>
</div>
</div>
</header>
<!-- Center Content: Prompt and Interactive Area -->
<div class="flex-1 flex flex-col gap-space-md justify-start mt-space-xs">
<!-- Teacher Slot & Instruction Speech Bubble -->
<section class="flex items-center gap-3">
<!-- Empty Teacher Slot -->
<div class="w-[68px] h-[80px] rounded-xl border-2 border-dashed border-outline-variant/80 bg-surface-container-lowest/60 flex flex-col items-center justify-center gap-1 shrink-0">
<span class="material-symbols-outlined text-outline text-[20px]">psychology</span>
<span class="font-label text-[10px] leading-3 text-on-surface-variant text-center px-1">teacher</span>
</div>
<!-- Tactile Speech Bubble -->
<div class="relative flex-1 bg-surface-container border border-outline-variant rounded-xl p-3 shadow-[0_4px_0_0_#DCD3C2]">
<!-- Arrow pointing to teacher slot -->
<div class="absolute -left-2 top-1/2 -translate-y-1/2 w-0 h-0 border-y-[6px] border-y-transparent border-r-[8px] border-r-surface-container"></div>
<div class="flex items-center gap-2 mb-1">
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-primary-container/30 border border-primary/40 font-label text-[10px] leading-tight text-primary">
              TOEIC · Vocabulary
            </span>
</div>
<p class="font-body text-body text-on-surface text-[14px] leading-tight font-bold">
            Arrange the words into a sentence
          </p>
</div>
</section>
<!-- Prompt Card (Vietnamese Source Text + Audio Controls) -->
<section class="bg-surface-container-low border-2 border-outline-variant rounded-xl p-space-md shadow-[0_4px_0_0_#DCD3C2]">
<div class="flex items-center justify-between gap-3">
<div class="flex-1">
<span class="font-label text-label text-on-surface-variant block mb-1">TRANSLATION</span>
<p class="font-title text-[18px] leading-snug text-on-surface">
              "Chúng tôi cần gửi hóa đơn hôm nay"
            </p>
</div>
<!-- Audio Buttons (Min 44x44px Touch Target) -->
<div class="flex items-center gap-1.5 shrink-0">
<button aria-label="Play audio regular speed" class="w-11 h-11 rounded-xl bg-surface-container-high border border-outline-variant hover:border-primary text-primary flex items-center justify-center shadow-[0_3px_0_0_#DCD3C2] active:translate-y-[2px] active:shadow-none transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">volume_up</span>
</button>
<button aria-label="Play audio slow speed" class="w-11 h-11 rounded-xl bg-surface-container-high border border-outline-variant hover:border-primary text-on-surface-variant hover:text-primary flex items-center justify-center shadow-[0_3px_0_0_#DCD3C2] active:translate-y-[2px] active:shadow-none transition-all" type="button">
<span class="font-label text-[11px] text-tertiary">0.8x</span>
</button>
</div>
</div>
</section>
<!-- Answer Board (Sunken Tray with 7 Slots) -->
<section class="bg-surface-container-lowest border-2 border-[#E6DCCB] rounded-xl p-3 shadow-inner min-h-[128px] flex flex-wrap gap-2 content-start">
<!-- Slot 1: Placed Word 'We' -->
<button class="h-10 px-3.5 bg-primary-container border-2 border-primary-fixed-dim rounded-lg flex items-center justify-center shadow-[0_4px_0_0_#0B5450] active:translate-y-[2px] transition-all" type="button">
<span class="font-title text-[15px] font-bold text-on-primary">We</span>
</button>
<!-- Slot 2: Placed Word 'need' -->
<button class="h-10 px-3.5 bg-primary-container border-2 border-primary-fixed-dim rounded-lg flex items-center justify-center shadow-[0_4px_0_0_#0B5450] active:translate-y-[2px] transition-all" type="button">
<span class="font-title text-[15px] font-bold text-on-primary-fixed">need</span>
</button>
<!-- Slot 3: Placed Word 'to' -->
<button class="h-10 px-3.5 bg-primary-container border-2 border-primary-fixed-dim rounded-lg flex items-center justify-center shadow-[0_4px_0_0_#0B5450] active:translate-y-[2px] transition-all" type="button">
<span class="font-title text-[15px] font-bold text-on-primary-fixed">to</span>
</button>
<!-- Slot 4: Empty Dashed Slot -->
<div class="h-10 w-16 rounded-lg border-2 border-dashed border-[#E6DCCB] bg-surface-container-lowest/40 flex items-center justify-center">
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
</div>
<!-- Slot 5: Empty Dashed Slot -->
<div class="h-10 w-14 rounded-lg border-2 border-dashed border-[#E6DCCB] bg-surface-container-lowest/40 flex items-center justify-center">
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
</div>
<!-- Slot 6: Empty Dashed Slot -->
<div class="h-10 w-20 rounded-lg border-2 border-dashed border-[#E6DCCB] bg-surface-container-lowest/40 flex items-center justify-center">
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
</div>
<!-- Slot 7: Empty Dashed Slot -->
<div class="h-10 w-16 rounded-lg border-2 border-dashed border-[#E6DCCB] bg-surface-container-lowest/40 flex items-center justify-center">
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
</div>
</section>
<!-- Word Bank Area (Available Tiles & Source Shadows) -->
<section class="flex flex-col gap-2 pt-1">
<span class="font-label text-[11px] text-on-surface-variant uppercase tracking-wider pl-1">Available Words</span>
<div class="flex flex-wrap gap-2.5 items-center justify-center">
<!-- Active Available Tiles -->
<button class="h-11 px-4 bg-surface-container border-2 border-outline-variant rounded-xl flex items-center justify-center shadow-[0_4px_0_0_#DCD3C2] hover:border-primary active:translate-y-[2px] active:shadow-[0_2px_0_0_#DCD3C2] transition-all" type="button">
<span class="font-title text-[15px] font-bold text-on-surface">send</span>
</button>
<button class="h-11 px-4 bg-surface-container border-2 border-outline-variant rounded-xl flex items-center justify-center shadow-[0_4px_0_0_#DCD3C2] hover:border-primary active:translate-y-[2px] active:shadow-[0_2px_0_0_#DCD3C2] transition-all" type="button">
<span class="font-title text-[15px] font-bold text-on-surface">the</span>
</button>
<button class="h-11 px-4 bg-surface-container border-2 border-outline-variant rounded-xl flex items-center justify-center shadow-[0_4px_0_0_#DCD3C2] hover:border-primary active:translate-y-[2px] active:shadow-[0_2px_0_0_#DCD3C2] transition-all" type="button">
<span class="font-title text-[15px] font-bold text-on-surface">invoice</span>
</button>
<button class="h-11 px-4 bg-surface-container border-2 border-outline-variant rounded-xl flex items-center justify-center shadow-[0_4px_0_0_#DCD3C2] hover:border-primary active:translate-y-[2px] active:shadow-[0_2px_0_0_#DCD3C2] transition-all" type="button">
<span class="font-title text-[15px] font-bold text-on-surface">today</span>
</button>
<!-- Ghost Slot Outlines (Used items) -->
<div class="h-11 px-4 rounded-xl border border-dashed border-outline-variant/40 bg-surface-container-lowest/30 flex items-center justify-center">
<span class="font-title text-[15px] text-on-surface-variant line-through">We</span>
</div>
<div class="h-11 px-4 rounded-xl border border-dashed border-outline-variant/40 bg-surface-container-lowest/30 flex items-center justify-center">
<span class="font-title text-[15px] text-on-surface-variant line-through">need</span>
</div>
<div class="h-11 px-4 rounded-xl border border-dashed border-outline-variant/40 bg-surface-container-lowest/30 flex items-center justify-center">
<span class="font-title text-[15px] text-on-surface-variant line-through">to</span>
</div>
</div>
</section>
</div>
<!-- Bottom Controls Area -->
<footer class="w-full pt-space-md pb-space-sm flex flex-col gap-2">
<!-- Primary Action: Incomplete / Disabled state with high-contrast intentional look -->
<button class="w-full h-14 rounded-2xl bg-surface-container-high border-2 border-outline-variant text-on-surface-variant font-title text-[17px] font-bold flex items-center justify-center cursor-not-allowed shadow-[0_4px_0_0_#DCD3C2] opacity-80" disabled="" type="button">
        Check answer
      </button>
<!-- Secondary Linear Actions (Min 44x44px touch targets) -->
<div class="flex items-center justify-between px-2">
<button class="h-11 px-3 flex items-center justify-center text-on-surface-variant hover:text-on-surface font-label text-label tracking-wider transition-colors" type="button">
          Skip
        </button>
<button class="h-11 px-3 flex items-center justify-center gap-1 text-outline hover:text-on-surface font-label text-label tracking-wider transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">flag</span>
          Report
        </button>
</div>
</footer>
</main>
</body></html>
