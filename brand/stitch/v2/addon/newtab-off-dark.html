<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite — New Tab (Calm Mode) (Tactile Night)</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'lex-dark-bg': '#091518',
            'lex-dark-canvas': '#0B171A',
            'lex-dark-card': '#142328',
            'lex-dark-raised': '#1A2C33',
            'lex-dark-border': '#263E47',
            'lex-dark-border-subtle': '#1B313A',
            'lex-dark-ledge': '#081113',
            'lex-teal': '#2BA39A',
            'lex-teal-light': '#48C2B8',
            'lex-teal-deep': '#1F7A75',
            'lex-teal-glow': '#2BA39A',
            'lex-coral': '#F2553B',
            'lex-amber': '#FFB054',
            'lex-gold': '#FFC94A',
            'lex-text-primary': '#EEF6F7',
            'lex-text-muted': '#A9BFC1',
            'lex-text-dim': '#668084'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          boxShadow: {
            'tactile-card': '0 4px 0 0 #081113, 0 12px 24px -6px rgba(0,0,0,0.5)',
            'tactile-input': '0 4px 0 0 #081113, 0 8px 20px -4px rgba(43,163,154,0.15)',
            'tactile-pill': '0 3px 0 0 #081113, 0 4px 10px rgba(0,0,0,0.3)',
            'tactile-btn': '0 4px 0 0 #0D1C20, 0 6px 14px rgba(0,0,0,0.4)',
            'tactile-btn-pressed': '0 1px 0 0 #0D1C20',
            'teal-glow': '0 0 28px rgba(43, 163, 154, 0.25)'
          }
        }
      }
    }
  </script>
  <style>
    /* Subtle dot grid pattern on dark canvas */
    .bg-dot-grid {
      background-color: #091518;
      background-image: radial-gradient(rgba(43, 163, 154, 0.18) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
    
    /* Tactile button active states */
    .btn-tactile {
      transition: all 0.1s ease;
    }
    .btn-tactile:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 0 #081113 !important;
    }

    /* Floating subtle breathing glow on logo */
    @keyframes kiteGlow {
      0%, 100% { filter: drop-shadow(0 0 14px rgba(43, 163, 154, 0.35)); }
      50% { filter: drop-shadow(0 0 24px rgba(242, 85, 59, 0.35)); }
    }
    .kite-shadow {
      animation: kiteGlow 5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-dot-grid text-lex-text-primary min-h-screen flex flex-col justify-between select-none antialiased relative overflow-hidden font-sans">

  <!-- Ambient background glow elements -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[350px] bg-lex-teal/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 left-1/2 -translate-x-1/2 translate-y-1/4 w-[500px] h-[250px] bg-lex-coral/5 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Top Navigation Bar -->
  <header class="w-full px-6 py-5 flex items-center justify-between z-10">
    <!-- Calm Mode Badge -->
    <div class="flex items-center">
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-lex-dark-card border-2 border-lex-dark-border text-lex-text-muted text-xs font-bold tracking-wide uppercase shadow-tactile-pill">
        <span class="w-2 h-2 rounded-full bg-lex-amber shadow-[0_0_8px_#FFB054] animate-pulse"></span>
        <span class="text-lex-text-primary font-bold">Calm Mode</span>
      </div>
    </div>

    <!-- Right Controls: Streak & Settings -->
    <div class="flex items-center gap-3">
      <!-- Streak Pill -->
      <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-lex-dark-card border-2 border-lex-dark-border text-lex-text-primary text-sm font-extrabold shadow-tactile-pill cursor-pointer hover:border-lex-coral/50 transition-colors">
        <svg class="w-4 h-4 text-lex-coral" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.44 2.22a.75.75 0 00-.88 0C9.64 3.58 6 7.42 6 12a6 6 0 0012 0c0-4.58-3.64-8.42-5.56-9.78zM12 18a3.5 3.5 0 01-3.5-3.5c0-1.85 1.5-4 3.5-5.5 2 1.5 3.5 3.65 3.5 5.5A3.5 3.5 0 0112 18z"/>
        </svg>
        <span>14</span>
      </div>

      <!-- Settings Icon Button -->
      <button class="w-9 h-9 rounded-full bg-lex-dark-card border-2 border-lex-dark-border flex items-center justify-center text-lex-text-muted hover:text-lex-text-primary hover:border-lex-teal/60 shadow-tactile-pill btn-tactile" title="Extension Settings">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Central Search & Calm Hub -->
  <main class="w-full max-w-2xl mx-auto px-6 flex flex-col items-center justify-center my-auto z-10">
    
    <!-- Brand Origami Kite Emblem -->
    <div class="flex flex-col items-center mb-7">
      <div class="relative w-16 h-16 flex items-center justify-center mb-3">
        <!-- SVG 3D Tactile Origami Kite -->
        <svg class="w-14 h-14 kite-shadow" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Top Left Facet (Teal) -->
          <polygon points="32,4 12,28 32,28" fill="#2BA39A"/>
          <!-- Top Right Facet (Deep Teal) -->
          <polygon points="32,4 52,28 32,28" fill="#1F7A75"/>
          <!-- Bottom Left Facet (Coral Red) -->
          <polygon points="12,28 32,56 32,28" fill="#F2553B"/>
          <!-- Bottom Right Facet (Warm Amber) -->
          <polygon points="52,28 32,56 32,28" fill="#FFB054"/>
          <!-- Subtle Center Origami Fold Highlights -->
          <line x1="32" y1="4" x2="32" y2="56" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="12" y1="28" x2="52" y2="28" stroke="rgba(0,0,0,0.25)" stroke-width="1.2"/>
          <!-- White Center Diamond Dot -->
          <circle cx="32" cy="28" r="2.2" fill="#FFFFFF"/>
        </svg>
        <!-- Soft ambient grounded shadow beneath kite -->
        <div class="absolute -bottom-2 w-10 h-2 bg-black/60 rounded-full blur-sm"></div>
      </div>

      <!-- Lexkite Brand Wordmark -->
      <div class="flex items-center gap-1.5">
        <span class="text-3xl font-extrabold tracking-tight text-lex-text-primary">Lexkite</span>
        <span class="w-2.5 h-2.5 rounded-full bg-lex-coral mt-1 shadow-[0_0_8px_#F2553B]"></span>
      </div>
    </div>

    <!-- Tactile Giant Search Input Bar -->
    <div class="w-full relative group mb-3">
      <div class="w-full flex items-center bg-lex-dark-card border-2 border-lex-teal rounded-full px-5 py-3.5 shadow-tactile-input focus-within:border-lex-teal-light focus-within:ring-2 focus-within:ring-lex-teal/30 transition-all">
        <!-- Search Icon -->
        <svg class="w-5 h-5 text-lex-teal mr-3 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>

        <!-- Input Field -->
        <input 
          type="text" 
          placeholder="Look up any word" 
          class="w-full bg-transparent text-lex-text-primary text-base font-semibold placeholder:text-lex-text-dim placeholder:font-medium focus:outline-none"
          autofocus
        />

        <!-- Enter Keyboard Shortcut Pill -->
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-md bg-lex-dark-raised border border-lex-dark-border text-lex-text-muted text-xs font-mono font-bold flex-shrink-0 shadow-sm ml-2">
          <span>↵</span>
          <span>Enter</span>
        </div>
      </div>
      <!-- Tactile Underside 4px Ledge in Deep Teal-Dark -->
      <div class="absolute -bottom-1 inset-x-4 h-2 bg-lex-teal-deep rounded-full -z-10 opacity-70"></div>
    </div>

    <!-- Search Subtitle Helper -->
    <p class="text-xs font-medium text-lex-text-dim text-center mb-8">
      Instant phonetic transcription & Cambridge corpus audio
    </p>

    <!-- Turn Learning Card Back On - Tactile Secondary Button -->
    <div class="flex flex-col items-center">
      <button class="inline-flex items-center gap-2.5 px-6 py-3 rounded-2xl bg-lex-dark-card border-2 border-lex-dark-border text-lex-text-primary font-bold text-sm shadow-tactile-btn hover:border-lex-teal/60 hover:text-white transition-all btn-tactile group">
        <!-- Plus in Square Icon with Teal Tint -->
        <div class="w-5 h-5 rounded-md bg-lex-teal/15 border border-lex-teal/40 flex items-center justify-center text-lex-teal group-hover:bg-lex-teal group-hover:text-lex-dark-bg transition-colors">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <span>Turn learning card back on</span>
      </button>

      <!-- Status indicator -->
      <span class="mt-2 text-[11px] font-bold text-lex-text-dim tracking-wider uppercase">
        Card paused for focus
      </span>
    </div>

  </main>

  <!-- Bottom Bar: Add-on Status & Shortcuts -->
  <footer class="w-full px-8 py-5 flex items-center justify-between text-xs font-semibold text-lex-text-dim border-t border-lex-dark-border-subtle/40 z-10">
    <!-- Extension Status -->
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-lex-teal shadow-[0_0_6px_#2BA39A]"></span>
      <span class="text-lex-text-muted">Lexkite Add–on</span>
    </div>

    <!-- Quick Links -->
    <div class="flex items-center gap-6">
      <a href="#" class="text-lex-text-dim hover:text-lex-teal transition-colors">Daily deck</a>
      <a href="#" class="text-lex-text-dim hover:text-lex-teal transition-colors">IELTS Collocations</a>
      <a href="#" class="text-lex-text-dim hover:text-lex-teal transition-colors">Shortcuts</a>
    </div>
  </footer>

</body>
</html>
