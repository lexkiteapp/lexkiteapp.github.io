<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite - quick-play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              teal: '#0F3D3E',
              'teal-dark': '#092627',
              'teal-light': '#E6F3F3',
              coral: '#F26D21',
              'coral-hover': '#DE5D14',
              'coral-shadow': '#A63F05',
              cream: '#FFF8F3',
              'card-border': '#ECD8C9',
              'ink-dark': '#152528',
              'ink-muted': '#496064',
            }
          },
          boxShadow: {
            'tactile': '0 4px 0 #ECD8C9',
            'tactile-coral': '0 4px 0 #A63F05',
            'tactile-subtle': '0 3px 0 #E2CCC0',
            'tactile-press': '0 1px 0 #A63F05',
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
    }
    body {
      background-color: #FFF8F3;
      color: #152528;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Touch target guarantee */
    .touch-target-44 {
      min-height: 44px;
      min-width: 44px;
    }
  </style>
</head>
<body class="flex justify-center bg-[#FBF7F1] min-h-screen text-[#152528]">
  <main class="w-[390px] max-w-[390px] min-h-screen flex flex-col bg-[#FBF7F1] pb-10">
    <header class="sticky top-0 z-30 bg-[#FBF7F1]/95 backdrop-blur-md border-b-2 border-[#ECD8C9] px-4 py-2 flex items-center gap-3">
      <button type="button" aria-label="Back" class="touch-target-44 flex items-center justify-center rounded-xl bg-white border-2 border-[#ECD8C9] shadow-tactile-subtle text-[#0F3D3E]"><span class="material-symbols-rounded text-2xl">arrow_back</span></button>
      <div><h1 class="text-[20px] font-extrabold text-[#0F3D3E] leading-tight">Quick play</h1><p class="text-[12px] font-semibold text-[#496064]">15 seconds · 4 questions</p></div>
    </header>
    <div class="px-4 pt-3 flex flex-col gap-4">
 <div class="flex items-center gap-3"><div class="w-full h-2 rounded-full bg-[#ECE4D7]"><div class="h-2 rounded-full bg-[#0F3D3E]" style="width:25%"></div></div><span class="text-[14px] font-extrabold text-[#DE5D14] whitespace-nowrap">11 s</span></div>
 <div class="bg-white rounded-2xl border-2 border-[#ECD8C9] p-4 shadow-tactile flex flex-col gap-3 items-center text-center"><span class="text-[11px] font-extrabold uppercase text-[#0F3D3E] bg-[#E6F3F3] px-2 py-0.5 rounded-md">Question 2/4</span><span class="text-[30px] font-extrabold text-[#152528]">abandon</span><p class="text-[13px] font-semibold text-[#496064] leading-snug">Choose the right meaning</p></div>
 <div class="touch-target-44 flex items-center justify-between rounded-2xl bg-white border-2 border-[#0F3D3E] px-4 py-3 shadow-tactile-subtle font-bold text-[16px]"><span>to give up</span><span class="text-[13px] text-[#496064]">1</span></div><div class="touch-target-44 flex items-center justify-between rounded-2xl bg-white border-2 border-[#ECD8C9] px-4 py-3 shadow-tactile-subtle font-bold text-[16px]"><span>to continue</span><span class="text-[13px] text-[#496064]">2</span></div><div class="touch-target-44 flex items-center justify-between rounded-2xl bg-white border-2 border-[#ECD8C9] px-4 py-3 shadow-tactile-subtle font-bold text-[16px]"><span>to collect</span><span class="text-[13px] text-[#496064]">3</span></div></div>
  </main>
</body>
</html>
