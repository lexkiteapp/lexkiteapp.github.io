<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lexkite Lesson Drill - Type the past form (Bright Day)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#fff8f5',
            'surface-card': '#ffffff',
            'surface-subtle': '#fff1e8',
            'surface-border': '#e6d7cd',
            'brand-teal': '#00504b',
            'brand-teal-dark': '#003834',
            'teal-soft': '#e1f8f3',
            'teal-border': '#2ba39a',
            'coral-primary': '#f06400',
            'coral-pressed': '#d45500',
            'ink-dark': '#132226',
            'ink-muted': '#4a5d61',
            'ink-soft': '#697b7e',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            'tactile-btn': '0 4px 0 #ba4c00',
            'tactile-card': '0 3px 0 #e6d7cd',
            'tactile-control': '0 2px 0 #d9c5b8',
            'tactile-input': 'inset 0 2px 0 rgba(0,0,0,0.04), 0 2px 0 #e6d7cd',
            'tactile-input-focus': '0 0 0 2px #00504b, 0 3px 0 #003834',
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #fff8f5;
      color: #132226;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
    }
    .material-symbols-rounded.fill-current {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="min-h-screen bg-[#091416] text-[#EAF2F2] flex flex-col justify-between max-w-[390px] mx-auto antialiased select-none">
<!-- Top Bar: FOCUS with Close X & Progress Bar 3 of 10 -->
<header class="w-full pt-4 pb-3 px-4 flex items-center gap-3"><button aria-label="Close" class="w-11 h-11 min-w-[44px] min-h-[44px] rounded-full flex items-center justify-center text-[#A3B9B7] hover:text-[#EAF2F2] hover:bg-[#162528] active:scale-95 transition-all" type="button">
<span class="material-symbols-rounded text-2xl">close</span>
</button>
<div class="flex-1 flex items-center gap-2.5">
<div class="w-full bg-[#162528] h-2.5 rounded-full overflow-hidden p-[1px]">
<div class="bg-[#2ba39a] h-full rounded-full transition-all duration-300" style="width: 30%;"></div>
</div>
<span class="text-xs font-bold text-[#A3B9B7] tracking-wide shrink-0">3/10</span>
</div></header>
<!-- Main Content Area -->
<main class="flex-1 px-4 py-2 flex flex-col justify-between">
<div class="w-full flex flex-col gap-4">
<!-- Teacher Slot & Speech Bubble Header -->
<section class="flex items-center gap-3 pt-1"><!-- Empty Teacher Slot Box -->
<div class="w-16 h-16 min-w-[64px] min-h-[64px] rounded-2xl border-2 border-dashed border-[#213438] bg-[#122023] flex flex-col items-center justify-center p-1 text-center shrink-0">
<span class="text-[10px] font-extrabold text-[#A3B9B7] tracking-wider uppercase leading-tight">teacher<br/>slot</span>
</div>
<!-- Speech Bubble -->
<div class="relative bg-[#122023] border-2 border-[#213438] rounded-2xl px-4 py-3 shadow-[0_3px_0_#0a1315] flex-1">
<!-- Speech triangle pointer pointing toward teacher-slot -->
<div class="absolute -left-2 top-1/2 -translate-y-1/2 w-0 h-0 border-t-[6px] border-t-transparent border-b-[6px] border-b-transparent border-r-[8px] border-r-[#213438]"></div>
<div class="absolute -left-[6px] top-1/2 -translate-y-1/2 w-0 h-0 border-t-[5px] border-t-transparent border-b-[5px] border-b-transparent border-r-[7px] border-r-[#122023]"></div>
<p class="text-xs font-extrabold uppercase tracking-wider text-[#5FD0C4] mb-0.5">Quick Warm-Up</p>
<p class="text-base font-bold text-[#EAF2F2] leading-snug">Type the past form.</p>
</div></section>
<!-- Sentence & Prompt Card -->
<article class="bg-[#122023] border-2 border-[#213438] rounded-3xl p-5 shadow-[0_3px_0_#0a1315] flex flex-col gap-4">
<!-- Context & Audio row -->
<div class="flex items-center justify-between">
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#10302F] text-[#5FD0C4] text-xs font-bold border border-[#12514D]">
<span class="material-symbols-rounded text-sm">edit_note</span>
            Verb Exercise
          </span>
<button aria-label="Listen to sentence" class="w-11 h-11 min-w-[44px] min-h-[44px] rounded-xl bg-[#162528] text-[#5FD0C4] border border-[#213438] flex items-center justify-center shadow-[0_2px_0_#0a1315] active:translate-y-0.5 active:shadow-none hover:bg-[#1D2F33] transition-all" type="button">
<span class="material-symbols-rounded text-xl">volume_up</span>
</button>
</div>
<!-- The Target Sentence -->
<div class="py-2">
<p class="text-xl sm:text-2xl font-extrabold text-[#ffffff] leading-relaxed">
            She 
            <span class="inline-block px-3 py-0.5 mx-1 border-b-4 border-[#2ba39a] font-extrabold text-[#5FD0C4] bg-[#0E191C] rounded">
                      
            </span> 
            home early last night.
          </p>
</div>
<!-- Hint Chip -->
<div class="pt-2 border-t border-[#213438] flex items-center gap-2">
<span class="text-xs font-bold text-[#A3B9B7]">Clue:</span>
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#261A00] border border-[#3A2E12] text-[#fbbf24] text-xs font-extrabold">
<span class="material-symbols-rounded text-sm">lightbulb</span>
<span>go, past simple</span>
</div>
</div>
</article>
<!-- Text Input Field Card -->
<div class="flex flex-col gap-2 pt-1"><label class="text-xs font-extrabold uppercase tracking-wider text-[#A3B9B7] px-1" for="verb-input">
          YOUR ANSWER
        </label>
<div class="relative">
<input autocapitalize="off" autocomplete="off" autocorrect="off" class="w-full h-14 min-h-[56px] px-4 rounded-2xl bg-[#122023] border-2 border-[#213438] text-lg font-bold text-[#ffffff] placeholder-[#7E9599] shadow-[inset_0_2px_0_rgba(0,0,0,0.3),0_2px_0_#0a1315] focus:outline-none focus:border-[#2ba39a] focus:ring-0 focus:shadow-[0_0_0_2px_#2ba39a,0_3px_0_#003834] transition-all" id="verb-input" name="verb-answer" placeholder="Type the verb" spellcheck="false" type="text"/>
</div></div>
</div>
<!-- Bottom Actions Container -->
<div class="w-full pt-6 pb-6 flex flex-col items-center gap-3"><!-- Full-width Coral Primary Button with Tactile Raised Feel -->
<button class="w-full h-14 min-h-[56px] px-6 rounded-2xl bg-[#E5502F] hover:bg-[#E5502F] active:bg-[#CC3F1C] active:translate-y-1 active:shadow-none text-[#1A0E0B] text-lg font-extrabold tracking-wide shadow-[0_4px_0_#9a3800] flex items-center justify-center gap-2 transition-all" type="button">
<span>Check</span>
<span class="material-symbols-rounded text-2xl font-black">arrow_forward</span>
</button>
<!-- Quiet Secondary Link Beside / Under: "I don't know" -->
<button class="min-h-[44px] px-4 flex items-center justify-center text-sm font-bold text-[#A3B9B7] hover:text-[#EAF2F2] active:underline rounded-xl transition-colors" type="button">
        I don't know
      </button></div>
</main>
</body>
</html>
