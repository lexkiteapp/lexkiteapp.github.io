<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite - grammar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              teal: '#0F3D3E',
              'teal-dark': '#0F3D3E',
              'teal-light': '#DDF1EE',
              coral: '#F2553B',
              'coral-hover': '#CC3F1C',
              'coral-shadow': '#B53A22',
              cream: '#FBF7F1',
              'card-border': '#ECE5D9',
              'ink-dark': '#0F3D3E',
              'ink-muted': '#45555A',
            }
          },
          boxShadow: {
            'tactile': '0 4px 0 #ECE5D9',
            'tactile-coral': '0 4px 0 #B53A22',
            'tactile-subtle': '0 3px 0 #EBD8CD',
            'tactile-press': '0 1px 0 #B53A22',
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
    }
    body {
      background-color: #FBF7F1;
      color: #0F3D3E;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Touch target guarantee */
    .touch-target-44 {
      min-height: 44px;
      min-width: 44px;
    }
  </style>
</head>
<body class="flex justify-center bg-[#FBF7F1] min-h-screen text-[#0F3D3E]">
  <main class="w-[390px] max-w-[390px] min-h-screen flex flex-col bg-[#FBF7F1] pb-10">
    <header class="sticky top-0 z-30 bg-[#FBF7F1]/95 backdrop-blur-md border-b-2 border-[#E6DCCB] px-4 py-2 flex items-center gap-3">
      <button type="button" aria-label="Back" class="touch-target-44 flex items-center justify-center rounded-xl bg-white border-2 border-[#E6DCCB] shadow-tactile-subtle text-[#0F3D3E]"><span class="material-symbols-rounded text-2xl">arrow_back</span></button>
      <div><h1 class="text-[20px] font-extrabold text-[#0F3D3E] leading-tight">Grammar</h1><p class="text-[12px] font-semibold text-[#0F3D3E]">80 visual lessons</p></div>
    </header>
    <div class="px-4 pt-3 flex flex-col gap-4">
 <div class="bg-white rounded-2xl border-2 border-[#E6DCCB] p-4 shadow-tactile flex flex-col gap-3"><div class="w-full h-2 rounded-full bg-[#0D6964]/20"><div class="h-2 rounded-full bg-[#0D6964]" style="width:40%"></div></div><p class="text-[13px] font-semibold text-[#0F3D3E] leading-snug">32/80 lessons passed</p><h2 class="text-[16px] font-extrabold text-[#0F3D3E] leading-tight">Next: Present perfect</h2><button type="button" class="touch-target-44 w-full rounded-full bg-[#F2553B] text-[#1A0E0B] font-extrabold text-[15px] px-4 py-3 shadow-tactile-coral border-b-4 border-[#B53A22]">Start now</button></div>
 <div class="flex gap-2 overflow-x-auto"><span class="touch-target-44 inline-flex items-center px-3.5 py-2 rounded-full bg-[#DDF1EE] border-2 border-[#0F3D3E] text-[#0F3D3E] font-bold text-[14px]">All 80</span><span class="touch-target-44 inline-flex items-center px-3.5 py-2 rounded-full bg-white border-2 border-[#E6DCCB] text-[#0F3D3E] font-bold text-[14px]">IELTS 7.0+</span><span class="touch-target-44 inline-flex items-center px-3.5 py-2 rounded-full bg-white border-2 border-[#E6DCCB] text-[#0F3D3E] font-bold text-[14px]">TOEIC</span></div>
 <div class="bg-white rounded-2xl border-2 border-[#E6DCCB] p-4 shadow-tactile flex flex-col gap-3"><h2 class="text-[16px] font-extrabold text-[#0F3D3E] leading-tight">Chapter 1 · Tenses</h2><div class="flex items-center justify-between gap-2 touch-target-44 border-b border-[#E6DCCB]"><span class="text-[14px] font-bold text-[#0F3D3E]">Present simple</span><span class="text-[12px] font-semibold text-[#0F3D3E]">A1</span><span class="text-[12px] font-extrabold text-[#166534] bg-[#E3F4E8] px-2 py-0.5 rounded-md border border-[#E3F4E8]">90%</span></div><div class="flex items-center justify-between gap-2 touch-target-44 border-b border-[#E6DCCB]"><span class="text-[14px] font-bold text-[#0F3D3E]">Present continuous</span><span class="text-[12px] font-semibold text-[#0F3D3E]">A2</span><span class="text-[12px] font-extrabold text-[#B42318] bg-[#FCE9E7] px-2 py-0.5 rounded-md border border-[#FCE9E7]">60%</span></div><div class="flex items-center justify-between gap-2 touch-target-44 border-b border-[#E6DCCB]"><span class="text-[14px] font-bold text-[#0F3D3E]">Past simple</span><span class="text-[12px] font-semibold text-[#0F3D3E]">A2</span></div><div class="flex items-center justify-between gap-2 touch-target-44 border-b border-[#E6DCCB]"><span class="text-[14px] font-bold text-[#0F3D3E]">Chapter test</span><span class="text-[12px] font-semibold text-[#0F3D3E]"></span></div></div>
 <div class="bg-white rounded-2xl border-2 border-[#E6DCCB] p-4 shadow-tactile flex flex-col gap-3"><h2 class="text-[16px] font-extrabold text-[#0F3D3E] leading-tight">Mixed test · 20 questions</h2><p class="text-[13px] font-semibold text-[#0F3D3E] leading-snug">Questions from the lessons you studied.</p></div></div>
  </main>

</html>
