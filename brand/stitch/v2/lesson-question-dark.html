Weight": "800" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;background-color:#FFF7EA;}body{overscroll-behavior:none;font-family:'Plus Jakarta Sans',sans-serif;}.pb-safe{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 0.25rem);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><title>Lexkite v2.1 Light — Lesson Question</title></head><body class="bg-[#0B171A] text-[#EEF6F7] antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-[#091518]/95 backdrop-blur-xl border-b border-[#1b2d34] shadow-[0_2px_10px_rgba(0,0,0,0.3)]"><div class="h-14 px-gutter-mobile flex items-center justify-between gap-space-md"><button aria-label="Close lesson" class="w-11 h-11 flex items-center justify-center text-[#A9BFC1] hover:text-[#EEF6F7] transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">close</span></button><div class="flex-1 flex flex-col justify-center gap-1"><div class="flex justify-between items-center px-0.5"><span class="font-label-sm text-label-sm text-[#A9BFC1]">Active Drill Session</span><span class="font-label-sm text-label-sm text-[#2BA39A] font-bold">70%</span></div><div class="w-full h-2 rounded-full bg-[#142328] border border-[#233942] overflow-hidden"><div class="h-full rounded-full bg-[#2BA39A] w-[70%]"></div></div></div><div aria-label="Learner profile" class="w-8 h-8 rounded-full bg-[#16383b] border border-[#2BA39A] flex items-center justify-center shrink-0" role="img"><span class="material-symbols-outlined text-[#2BA39A] text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-[#0B171A]"><div class="flex flex-col w-full px-gutter-mobile pb-space-lg select-none">
<!-- Sub-header context badge & session metadata -->
<div class="flex items-center justify-between py-space-sm mb-space-xs"><div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FFC94A]/15 border border-[#FFC94A]/30 shadow-sm"><span class="material-symbols-outlined text-[16px] text-[#FFC94A]" style="font-variation-settings: 'FILL' 1;">local_fire_department</span><span class="font-label-sm text-label-sm text-[#FFC94A] uppercase tracking-wider font-extrabold">3 IN A ROW</span></div><div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-[#142328] border border-[#233942]"><span class="font-label-sm text-label-sm text-[#A9BFC1] font-extrabold tracking-wide">IELTS BAND 7.0 DRILL</span></div></div>
<!-- Hero: Teacher Platform Space + Speech Bubble -->
<div class="relative w-full flex items-center justify-between gap-3 mt-space-sm mb-space-md">
<!-- Empty Teacher Spot with soft ground shadow and lively aura -->
<!-- Speech Bubble pointing left -->
<div class="w-full bg-[#142328] rounded-[20px] border-2 border-[#233942] shadow-[0_5px_0_0_#0d1a1e] p-space-md"><button aria-label="Play sentence audio in British Received Pronunciation" class="w-full mb-3 flex items-center gap-2 py-1.5 px-3 rounded-full bg-[#1a2c34] hover:bg-[#203640] active:translate-y-[2px] transition-all border border-[#233942] shadow-sm text-left" id="audio-btn" onclick="playMockAudio()"><div class="w-7 h-7 rounded-full bg-[#2BA39A] text-[#091518] flex items-center justify-center shrink-0 shadow-sm"><span class="material-symbols-outlined text-[17px] font-bold" id="audio-icon">volume_up</span></div><div class="flex flex-col min-w-0"><span class="font-label-sm text-label-sm text-[#2BA39A] font-extrabold uppercase tracking-wide">0:02 • Tap to hear sentence</span><span class="font-label-sm text-[10px] text-[#8FA9AF] leading-tight">British Received Pronunciation</span></div></button><div class="font-headline-sm text-headline-sm text-[#EEF6F7] leading-snug text-center py-2">I like <span class="inline-flex items-center justify-center mx-1 px-3 py-0.5 rounded-xl bg-[#16383b] border-2 border-[#2BA39A] text-[#EEF6F7] font-bold shadow-sm" id="target-slot">listening</span> to music.</div></div>
</div>
<!-- Category & Syllabus Metadata Label -->
<!-- 4 Chunky Answer Cards in 2x2 Grid -->
<div class="grid grid-cols-2 gap-space-md mb-space-md"><button class="option-card relative flex flex-col justify-between p-3.5 h-24 rounded-[20px] bg-[#142328] border-2 border-[#233942] shadow-[0_5px_0_0_#0d1a1e] active:translate-y-[2px] active:shadow-[0_2px_0_0_#0d1a1e] transition-transform text-left" id="card-A" onclick="selectOption('A', 'listen')"><div class="flex items-center justify-between w-full"><span class="w-6 h-6 rounded-lg bg-[#1c2e36] text-[#A9BFC1] font-label-sm text-label-sm font-extrabold flex items-center justify-center border border-[#233942]">A</span></div><span class="font-headline-sm text-[19px] text-[#EEF6F7] font-bold tracking-tight">listen</span></button><button class="option-card relative flex flex-col justify-between p-3.5 h-24 rounded-[20px] bg-[#16363b] border-2 border-[#2BA39A] shadow-[0_5px_0_0_#10282c] translate-y-[1px] active:translate-y-[2px] active:shadow-[0_2px_0_0_#10282c] transition-transform text-left" id="card-B" onclick="selectOption('B', 'listening')"><div class="flex items-center justify-between w-full"><span class="w-6 h-6 rounded-lg bg-[#2BA39A] text-[#091518] font-label-sm text-label-sm font-extrabold flex items-center justify-center">B</span><span class="w-6 h-6 rounded-full bg-[#2BA39A] text-[#091518] flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-[16px] font-bold">check</span></span></div><span class="font-headline-sm text-[19px] text-[#EEF6F7] font-extrabold tracking-tight">listening</span></button><button class="option-card relative flex flex-col justify-between p-3.5 h-24 rounded-[20px] bg-[#142328] border-2 border-[#233942] shadow-[0_5px_0_0_#0d1a1e] active:translate-y-[2px] active:shadow-[0_2px_0_0_#0d1a1e] transition-transform text-left" id="card-C" onclick="selectOption('C', 'listened')"><div class="flex items-center justify-between w-full"><span class="w-6 h-6 rounded-lg bg-[#1c2e36] text-[#A9BFC1] font-label-sm text-label-sm font-extrabold flex items-center justify-center border border-[#233942]">C</span></div><span class="font-headline-sm text-[19px] text-[#EEF6F7] font-bold tracking-tight">listened</span></button><button class="option-card relative flex flex-col justify-between p-3.5 h-24 rounded-[20px] bg-[#142328] border-2 border-[#233942] shadow-[0_5px_0_0_#0d1a1e] active:translate-y-[2px] active:shadow-[0_2px_0_0_#0d1a1e] transition-transform text-left" id="card-D" onclick="selectOption('D', 'listens')"><div class="flex items-center justify-between w-full"><span class="w-6 h-6 rounded-lg bg-[#1c2e36] text-[#A9BFC1] font-label-sm text-label-sm font-extrabold flex items-center justify-center border border-[#233942]">D</span></div><span class="font-headline-sm text-[19px] text-[#EEF6F7] font-bold tracking-tight">listens</span></button></div>
<!-- Hint Card (Educational Rule) -->
<!-- Action Bar: Auxiliary Controls + Giant Chunky Check CTA -->
<div class="flex flex-col gap-3 w-full mt-auto">
<!-- Secondary Tools: Skip and Flag -->
<div class="flex items-center justify-between gap-3"><button aria-label="Skip question" class="flex-1 py-2.5 px-4 rounded-full bg-[#142328] border-2 border-[#233942] shadow-[0_4px_0_0_#0d1a1e] active:translate-y-[2px] active:shadow-[0_1px_0_0_#0d1a1e] transition-transform flex items-center justify-center gap-1.5 text-[#A9BFC1] hover:text-[#EEF6F7]"><span class="material-symbols-outlined text-[18px]">fast_forward</span><span class="font-label-md text-label-md font-extrabold uppercase tracking-wider">Skip</span></button><button aria-label="Report question" class="py-2.5 px-5 rounded-full bg-[#142328] border-2 border-[#233942] shadow-[0_4px_0_0_#0d1a1e] active:translate-y-[2px] active:shadow-[0_1px_0_0_#0d1a1e] transition-transform flex items-center justify-center gap-1.5 text-[#A9BFC1] hover:text-[#F2553B]"><span class="material-symbols-outlined text-[18px]">flag</span><span class="font-label-md text-label-md font-extrabold uppercase tracking-wider">Report</span></button></div>
<!-- Primary Mechanical CTA: Coral to Amber Gradient with massive 6px ledge -->
<button class="relative w-full py-4 rounded-2xl bg-gradient-to-r from-cta-gradient-start to-cta-gradient-end font-label-lg text-label-lg font-black tracking-widest uppercase shadow-[0_6px_0_0_#B53A22,0_10px_20px_rgba(242,85,59,0.3)] active:translate-y-[4px] active:shadow-[0_2px_0_0_#B53A22] transition-transform flex items-center justify-center gap-2 text-[#2A0700]" id="check-btn" onclick="triggerCelebration()">
<span class="material-symbols-outlined text-[24px]">verified</span>
<span class="">CHECK ANSWER</span>
</button>
</div>
</div>
<script>
  function selectOption(key, word) {
    const cards = {
      'A': document.getElementById('card-A'),
      'B': document.getElementById('card-B'),
      'C': document.getElementById('card-C'),
      'D': document.getElementById('card-D')
    };

    const targetSlot = document.getElementById('target-slot');
    if (targetSlot) {
      targetSlot.textContent = word;
    }

    Object.keys(cards).forEach(k => {
      const card = cards[k];
      if (!card) return;
      if (k === key) {
        card.className = "option-card relative flex flex-col justify-between p-3.5 h-24 rounded-2xl bg-[#E6F5F4] border-2 border-[#2BA39A] shadow-[0_5px_0_0_#1E827A] translate-y-[1px] active:translate-y-[3px] active:shadow-[0_2px_0_0_#1E827A] transition-transform text-left";
        card.innerHTML = `
          <div class="flex items-center justify-between w-full">
            <span class="w-6 h-6 rounded-lg bg-[#0F3D3E] text-on-primary font-label-sm text-label-sm font-extrabold flex items-center justify-center">${k}</span>
            <span class="w-6 h-6 rounded-full bg-[#2BA39A] text-on-primary flex items-center justify-center shadow-sm">
              <span class="material-symbols-outlined text-[16px] font-bold">check</span>
            </span>
          </div>
          <span class="font-headline-sm text-[19px] text-[#0F3D3E] font-extrabold tracking-tight">${word}</span>
        `;
      } else {
        card.className = "option-card relative flex flex-col justify-between p-3.5 h-24 rounded-2xl bg-card-surface border-2 border-[#EADEC8] shadow-[0_5px_0_0_#D8CFBC] active:translate-y-[3px] active:shadow-[0_2px_0_0_#D8CFBC] transition-transform text-left";
        card.innerHTML = `
          <div class="flex items-center justify-between w-full">
            <span class="w-6 h-6 rounded-lg bg-[#F5ECE0] text-[#7A6A55] font-label-sm text-label-sm font-extrabold flex items-center justify-center border border-[#E5DAC8]">${k}</span>
          </div>
          <span class="font-headline-sm text-[19px] text-[#0F3D3E] font-bold tracking-tight">${word}</span>
        `;
      }
    });
  }

  function playMockAudio() {
    const icon = document.getElementById('audio-icon');
    if (!icon) return;
    icon.textContent = 'graphic_eq';
    setTimeout(() => {
      icon.textContent = 'volume_up';
    }, 1200);
  }

  function triggerCelebration() {
    const btn = document.getElementById('check-btn');
    if (!btn) return;
    btn.innerHTML = `
      <span class="material-symbols-outlined text-[24px] animate-spin">sync</span>
      <span>EVALUATING...</span>
    `;
    setTimeout(() => {
      btn.className = "relative w-full py-4 rounded-2xl bg-[#0D6964] text-on-primary font-label-lg text-label-lg font-black tracking-widest uppercase shadow-[0_6px_0_0_#084744] transition-all flex items-center justify-center gap-2";
      btn.innerHTML = `
        <span class="material-symbols-outlined text-[24px]">task_alt</span>
        <span>BRILLIANT! (+20 XP)</span>
      `;
    }, 450);
  }
</script></main>
</body></html>
