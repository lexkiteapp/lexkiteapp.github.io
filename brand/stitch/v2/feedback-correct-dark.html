</div>
</div>
</div>
<script>
  const continueBtn = document.getElementById('continue-button');
  if (continueBtn) {
    continueBtn.addEventListener('mousedown', () => {
      continueBtn.style.boxShadow = '0 1px 0 #050B0D';
    });
    continueBtn.addEventListener('mouseup', () => {
      continueBtn.style.boxShadow = '0 4px 0 #050B0D';
    });
    continueBtn.addEventListener('touchstart', () => {
      continueBtn.style.boxShadow = '0 1px 0 #050B0D';
    });
