<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding - Language Selection</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300..1000;1,6..12,300..1000&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "page-bg": "#0B171A", "card-bg": "#162528", "card-border": "#2B4750", "selected-bg": "#143D3B", "selected-border": "#2BA39A",
            "radio-unselected": "#6B878A", "radio-selected": "#2BA39A", "progress-track": "#2B4750", "progress-fill": "#2BA39A",
            "primary-text": "#EEF6F7", "secondary-text": "#A9BFC1", "accent": "#6BD8CE", "btn-bg": "#2BA39A"
          },
          "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
          "spacing": { "margin": "2rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "gutter": "1.5rem", "space-xl": "2.5rem", "space-sm": "0.5rem", "space-md": "1rem" },
          "fontFamily": {
            "body-lg": ["Nunito Sans", "sans-serif"],
            "body-md": ["Nunito Sans", "sans-serif"],
            "headline-sm": ["Nunito Sans", "sans-serif"],
            "headline-xl": ["Nunito Sans", "sans-serif"],
            "label-sm": ["Nunito Sans", "sans-serif"],
            "label-md": ["Nunito Sans", "sans-serif"],
            "headline-lg": ["Nunito Sans", "sans-serif"],
            "headline-md": ["Nunito Sans", "sans-serif"],
            "body-sm": ["Nunito Sans", "sans-serif"]
          },
          "fontSize": {
            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
            "headline-xl": ["40px", { "lineHeight": "48px", "fontWeight": "700" }],
            "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
            "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
            "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
          }
        }
      }
    }
  </script>
<style>
    body { background-color: #0B171A; font-family: 'Nunito Sans', sans-serif; min-height: max(884px, 100dvh); }
    .tactile-card { background-color: #162528; border: 2px solid #2B4750; box-shadow: 0 4px 0 0 #060E10; border-radius: 16px; }
    .tactile-card-selected { background-color: #143D3B; border: 2px solid #2BA39A; box-shadow: 0 4px 0 0 #0D2B2A; border-radius: 16px; }
    .tactile-btn { background-color: #2BA39A; box-shadow: 0 4px 0 0 #0E4844; border-radius: 12px; }
    .tactile-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 0 #0E4844; }
  </style>
</head>
<body class="bg-[#0E191C] text-[#EAF2F2] antialiased flex justify-center items-center min-h-screen">
<div class="w-[390px] h-[844px] bg-[#0E191C] flex flex-col relative overflow-hidden shadow-2xl rounded-2xl">
<!-- TopAppBar -->
<header class="bg-[#0E191C] flex justify-between items-center w-full px-4 py-3">
<button aria-label="Back" class="w-[44px] h-[44px] flex items-center justify-center rounded-full hover:bg-[#162528] transition-all">
<span class="material-symbols-outlined text-[#6BD8CE]" data-icon="chevron_left">chevron_left</span>
</button>
<!-- Progress Bar (4 segments) -->
<div class="flex items-center gap-1.5 w-28">
<div class="h-2 flex-1 rounded-full bg-[#2BA39A]"></div>
<div class="h-2 flex-1 rounded-full bg-[#2B4750]"></div>
<div class="h-2 flex-1 rounded-full bg-[#2B4750]"></div>
<div class="h-2 flex-1 rounded-full bg-[#2B4750]"></div>
</div>
<button class="font-label-md text-label-md text-[#6BD8CE] hover:opacity-85 transition-all px-2 py-1">
        Skip
      </button>
</header>
<main class="flex-1 overflow-y-auto px-6 py-4 flex flex-col">
<div class="mb-6">
<h1 class="font-headline-md text-headline-md text-[#EAF2F2] mb-1">What language do you speak?</h1>
<p class="font-body-md text-body-md text-[#A3B9B7]">We'll explain lessons in your language</p>
</div>
<div class="flex flex-col gap-3.5 pb-24">
<!-- 1. Tiếng Việt (SELECTED) -->
<div class="tactile-card-selected p-4 h-[64px] flex items-center justify-between cursor-pointer transition-all" onclick="selectLang(this)">
<div class="flex flex-col justify-center">
<span class="font-headline-sm text-headline-sm text-[#EAF2F2] leading-tight">Tiếng Việt</span>
<span class="font-body-sm text-body-sm text-[#A3B9B7] leading-tight">Vietnamese</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#2BA39A] bg-[#2BA39A] flex items-center justify-center"><span class="material-symbols-outlined text-white text-sm" style="font-size: 16px;">check</span></div>
</div>
<!-- 2. English -->
<div class="tactile-card p-4 h-[64px] flex items-center justify-between cursor-pointer hover:bg-[#1D2F33] transition-all" onclick="selectLang(this)">
<div class="flex flex-col justify-center">
<span class="font-headline-sm text-headline-sm text-[#EAF2F2] leading-tight">English</span>
<span class="font-body-sm text-body-sm text-[#A3B9B7] leading-tight">English</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#7E9599] bg-transparent flex items-center justify-center"></div>
</div>
<!-- 3. 中文 -->
<div class="tactile-card p-4 h-[64px] flex items-center justify-between cursor-pointer hover:bg-[#1D2F33] transition-all" onclick="selectLang(this)">
<div class="flex flex-col justify-center">
<span class="font-headline-sm text-headline-sm text-[#EAF2F2] leading-tight">中文</span>
<span class="font-body-sm text-body-sm text-[#A3B9B7] leading-tight">Chinese</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#7E9599] bg-transparent flex items-center justify-center"></div>
</div>
<!-- 4. 日本語 -->
<div class="tactile-card p-4 h-[64px] flex items-center justify-between cursor-pointer hover:bg-[#1D2F33] transition-all" onclick="selectLang(this)">
<div class="flex flex-col justify-center">
<span class="font-headline-sm text-headline-sm text-[#EAF2F2] leading-tight">日本語</span>
<span class="font-body-sm text-body-sm text-[#A3B9B7] leading-tight">Japanese</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#7E9599] bg-transparent flex items-center justify-center"></div>
</div>
<!-- 5. 한국어 -->
<div class="tactile-card p-4 h-[64px] flex items-center justify-between cursor-pointer hover:bg-[#1D2F33] transition-all" onclick="selectLang(this)">
<div class="flex flex-col justify-center">
<span class="font-headline-sm text-headline-sm text-[#EAF2F2] leading-tight">한국어</span>
<span class="font-body-sm text-body-sm text-[#A3B9B7] leading-tight">Korean</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#7E9599] bg-transparent flex items-center justify-center"></div>
</div>
<!-- 6. Español -->
<div class="tactile-card p-4 h-[64px] flex items-center justify-between cursor-pointer hover:bg-[#1D2F33] transition-all" onclick="selectLang(this)">
<div class="flex flex-col justify-center">
<span class="font-headline-sm text-headline-sm text-[#EAF2F2] leading-tight">Español</span>
<span class="font-body-sm text-body-sm text-[#A3B9B7] leading-tight">Spanish</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#7E9599] bg-transparent flex items-center justify-center"></div>
</div>
<!-- 7. Français -->
<div class="tactile-card p-4 h-[64px] flex items-center justify-between cursor-pointer hover:bg-[#1D2F33] transition-all" onclick="selectLang(this)">
<div class="flex flex-col justify-center">
<span class="font-headline-sm text-headline-sm text-[#EAF2F2] leading-tight">Français</span>
<span class="font-body-sm text-body-sm text-[#A3B9B7] leading-tight">French</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#7E9599] bg-transparent flex items-center justify-center"></div>
</div>
<!-- 8. Deutsch -->
<div class="tactile-card p-4 h-[64px] flex items-center justify-between cursor-pointer hover:bg-[#1D2F33] transition-all" onclick="selectLang(this)">
<div class="flex flex-col justify-center">
<span class="font-headline-sm text-headline-sm text-[#EAF2F2] leading-tight">Deutsch</span>
<span class="font-body-sm text-body-sm text-[#A3B9B7] leading-tight">German</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#7E9599] bg-transparent flex items-center justify-center"></div>
</div>
<!-- 9. العربية -->
<div class="tactile-card p-4 h-[64px] flex items-center justify-between cursor-pointer hover:bg-[#1D2F33] transition-all" onclick="selectLang(this)">
<div class="flex flex-col justify-center">
<span class="font-headline-sm text-headline-sm text-[#EAF2F2] leading-tight">العربية</span>
<span class="font-body-sm text-body-sm text-[#A3B9B7] leading-tight">Arabic</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#7E9599] bg-transparent flex items-center justify-center"></div>
</div>
</div>
</main>
<div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-[#0B171A] via-[#0B171A] to-transparent pt-6">
<button class="w-full h-14 bg-[#2BA39A] text-white font-headline-sm rounded-xl tactile-btn flex items-center justify-center transition-all">
        Continue
      </button>
</div>
</div>
<script>
    function selectLang(el) {
      document.querySelectorAll('.tactile-card, .tactile-card-selected').forEach(c => {
        c.className = "tactile-card p-4 h-[64px] flex items-center justify-between cursor-pointer hover:bg-[#1D2F33] transition-all";
        const r = c.querySelector('div > div:last-child'); r.className = "w-6 h-6 rounded-full border-2 border-[#7E9599] bg-transparent flex items-center justify-center"; r.innerHTML = "";
      });
      el.className = "tactile-card-selected p-4 h-[64px] flex items-center justify-between cursor-pointer transition-all";
      const a = el.querySelector('div > div:last-child'); a.className = "w-6 h-6 rounded-full border-2 border-[#2BA39A] bg-[#2BA39A] flex items-center justify-center";
      a.innerHTML = '<span class="material-symbols-outlined text-white text-sm" style="font-size: 16px;">check</span>';
    }
  </script>
</body></html>
