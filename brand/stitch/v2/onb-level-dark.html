<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite - Onboarding Step 2</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            "primary": "#6bd8ce",

            "inverse-primary": "#006a64",
            "secondary": "#ffb4a6",
            "secondary-container": "#981201",
            "primary-fixed-dim": "#6bd8ce",
            "on-error-container": "#ffdad6",
            "surface": "#091518",
            "surface-variant": "#2b373a",
            "error": "#ffb4ab",
            "secondary-fixed-dim": "#ffb4a6",
            "on-secondary-container": "#ffa493",
            "surface-dim": "#091518",
            "error-container": "#93000a",
            "on-tertiary-fixed-variant": "#5b4300",
            "on-error": "#690005",
            "on-primary-fixed-variant": "#00504b",
            "tertiary": "#f4bf40",
            "secondary-fixed": "#ffdad3",
            "surface-container-high": "#202c2f",
            "inverse-surface": "#d8e5e9",
            "on-surface": "#d8e5e9",
            "surface-container-lowest": "#051013",
            "on-surface-variant": "#bcc9c7",
            "on-primary": "#003733",
            "surface-container-low": "#121d20",
            "on-tertiary-container": "#392900",
            "inverse-on-surface": "#263236",
            "background": "#091518",
            "on-secondary": "#660800",
            "on-tertiary-fixed": "#261a00",
            "on-background": "#d8e5e9",
            "outline": "#879391",
            "surface-container-highest": "#2b373a",
            "on-secondary-fixed": "#3f0300",
            "tertiary-fixed": "#ffdf9e",
            "outline-variant": "#3d4947",
            "primary-fixed": "#88f5ea",
            "on-primary-container": "#00322e",
            "tertiary-fixed-dim": "#f4bf40",
            "tertiary-container": "#ba8b00",
            "surface-tint": "#6bd8ce",
            "surface-container": "#162125",
            "surface-bright": "#2f3b3e",
            /* Lexkite Kit Bright Day tokens */
            "day-bg": "#FFF7EA",
            "day-card": "#FFFFFF",
            "day-border": "#EADEC8",
            "day-ledge": "#D8CFBC",
            "day-ink": "#0F3D3E",
            "day-muted": "#325052",
            "day-teal": "#2BA39A",
            "day-teal-dark": "#1D7B74",
            "day-amber": "#FFB054",
            "day-coral": "#F2553B"
          },
          fontFamily: {
            body: ["Plus Jakarta Sans"],
            display: ["Plus Jakarta Sans"],
            title: ["Plus Jakarta Sans"],
            label: ["Plus Jakarta Sans"]
          },
          fontSize: {
            body: ["16px", { lineHeight: "24px", fontWeight: "500" }],
            display: ["32px", { lineHeight: "38px", fontWeight: "800" }],
            title: ["22px", { lineHeight: "28px", fontWeight: "700" }],
            label: ["12px", { lineHeight: "16px", letterSpacing: "0.06em", fontWeight: "800" }]
          }
        }
      }
    };

<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      display: inline-block;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }

    /* Tactile 3D Ledges & Sinking Transitions */
    .tactile-btn {
      transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.08s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tactile-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 0 #B53A22 !important;
    }

    .tactile-card {
      transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.08s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tactile-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #D8CFBC !important;
    }
    .tactile-card.is-selected:active {
      box-shadow: 0 2px 0 0 #1D7B74 !important;
    }

    .tactile-header-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 0 #D8CFBC !important;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-[#091518] text-[#EEF6F7] font-body min-h-screen antialiased flex justify-center selection:bg-[#2BA39A]/30">
<main class="w-full max-w-[420px] min-h-screen bg-[#091518] flex flex-col justify-between px-4 pb-6 pt-3 relative" style="--card-ledge: #0A1518; --selected-ledge: #0B4742;">
<!-- Top Header Navigation & Progress Bar -->
<header class="w-full flex items-center gap-3 pt-1 pb-3"><!-- Back tactile button -->
<button aria-label="Go back" class="tactile-header-btn w-10 h-10 rounded-xl bg-[#162930] border-2 border-[#2E4854] flex items-center justify-center text-[#EEF6F7] shadow-[0_3px_0_0_#0A1518] shrink-0 hover:bg-[#1E333C]" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_back">arrow_back</span>
</button>
<!-- 4-step Progress bar (Step 2 of 4 = 50%) -->
<div class="flex-1 flex flex-col gap-1">
<div class="flex justify-between items-center px-0.5">
<span class="font-label uppercase tracking-widest text-[#A9BFC1] text-[11px] font-extrabold">Step 2 of 4</span>
<span class="font-label uppercase tracking-widest text-[#2BA39A] text-[11px] font-extrabold">50%</span>
</div>
<div class="w-full h-3 bg-[#122227] border border-[#233B44] rounded-full p-[2px] relative overflow-hidden flex items-center">
<div class="h-full bg-gradient-to-r from-[#2BA39A] to-[#39C5BA] rounded-full relative w-1/2 flex items-center justify-end shadow-[0_0_8px_rgba(43,163,154,0.4)]">
<!-- Gloss top line -->
<div class="absolute inset-x-1 top-0 h-[2px] bg-white/40 rounded-full"></div>
<!-- Progress marker pip -->
<div class="w-2 h-2 rounded-full bg-[#FFB054] shadow-[0_0_4px_rgba(255,176,84,0.9)] mr-[1px]"></div>
</div>
</div>
</div>
<!-- Close / Skip Button -->
<button aria-label="Skip question" class="tactile-header-btn w-10 h-10 rounded-xl bg-[#162930] border-2 border-[#2E4854] flex items-center justify-center text-[#A9BFC1] shadow-[0_3px_0_0_#0A1518] shrink-0 hover:bg-[#1E333C] hover:text-[#EEF6F7]" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button></header>
<!-- Main Content Flow -->
<div class="flex-1 flex flex-col pt-1">
<!-- Teacher Slot & Speech Bubble Area -->
<section aria-label="Instructor guidance" class="flex items-center gap-3.5 mb-4"><!-- Explicit 140x170 Teacher Slot Box -->
<div class="w-[140px] h-[170px] shrink-0 rounded-2xl border-2 border-dashed border-[#2BA39A]/60 bg-[#122227] flex flex-col items-center justify-center text-center p-2.5 relative shadow-inner">
<div class="w-10 h-10 rounded-xl bg-[#2BA39A]/20 flex items-center justify-center text-[#6BD8CE] mb-2">
<span class="material-symbols-outlined text-[22px]" data-icon="support_agent">support_agent</span>
</div>
<span class="font-label uppercase tracking-wider text-[#6BD8CE] font-extrabold text-[12px] leading-tight">TEACHER</span>
<span class="font-label uppercase tracking-widest text-[#A9BFC1] font-bold text-[10px] mt-0.5">140 x 170 slot</span>
<!-- Precise bounding indicator badge -->
<div class="absolute bottom-2 px-2 py-0.5 rounded-full bg-[#2BA39A]/20 text-[#6BD8CE] border border-[#2BA39A]/40 text-[9px] font-bold tracking-tight">
  LIVE SLOT
</div>
</div>
<!-- Speech Bubble beside slot -->
<div class="flex-1 relative bg-[#162930] border-2 border-[#2E4854] rounded-2xl p-3.5 shadow-[0_5px_0_0_#0A1518] flex flex-col justify-center">
<!-- Speech triangle pointer -->
<div class="absolute -left-2 top-8 w-3 h-3 bg-[#162930] border-l-2 border-b-2 border-[#2E4854] transform rotate-45"></div>
<div class="flex items-center gap-1.5 mb-1">
<span class="w-2 h-2 rounded-full bg-[#2BA39A] shadow-[0_0_6px_#2BA39A]"></span>
<span class="font-label text-[#2BA39A] uppercase tracking-wider text-[11px] font-extrabold">Calibration</span>
</div>
<p class="font-body text-[#EEF6F7] text-[13.5px] leading-[19px] font-medium">
  Be honest! We will calibrate your <span class="text-[#FFB054] font-bold underline decoration-[#FFB054] decoration-2">IELTS</span> &amp; <span class="text-[#6BD8CE] font-bold underline decoration-[#2BA39A] decoration-2">TOEIC</span> drills to fit you perfectly.
</p>
</div></section>
<!-- Headline -->
<div class="mb-3.5">
<h1 class="font-display text-display text-[#EEF6F7] text-[26px] leading-[32px] tracking-tight font-extrabold">
          How good is your English?
        </h1>
</div>
<!-- 4 Tactile Level Cards -->
<div aria-label="Select your English proficiency level" class="flex flex-col gap-2.5" role="radiogroup"><!-- Card 1: Just starting -->
<button aria-checked="false" class="tactile-card w-full text-left bg-[#162930] border-2 border-[#2E4854] rounded-2xl p-3.5 shadow-[0_5px_0_0_#0A1518] flex items-center justify-between group hover:border-[#3D5C6B] hover:bg-[#1A313A]" role="radio" type="button">
<div class="flex items-center gap-3">
<!-- Meter: 1 bar -->
<div class="w-10 h-10 rounded-xl bg-[#0F1E24] border border-[#233B44] flex items-end justify-center gap-1 pb-2 shrink-0">
<span class="w-1.5 h-2.5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-4 rounded-sm bg-[#1E333C]"></span>
<span class="w-1.5 h-5.5 rounded-sm bg-[#1E333C]"></span>
<span class="w-1.5 h-7 rounded-sm bg-[#1E333C]"></span>
</div>
<div>
<div class="font-title text-[16px] leading-5 font-bold text-[#EEF6F7]">Just starting</div>
<div class="font-label text-[12px] font-semibold text-[#A9BFC1] tracking-normal">Beginner • A1–A2</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#36505A] bg-[#0F1E24] flex items-center justify-center shrink-0"></div>
</button>
<!-- Card 2: I know the basics -->
<button aria-checked="false" class="tactile-card w-full text-left bg-[#162930] border-2 border-[#2E4854] rounded-2xl p-3.5 shadow-[0_5px_0_0_#0A1518] flex items-center justify-between group hover:border-[#3D5C6B] hover:bg-[#1A313A]" role="radio" type="button">
<div class="flex items-center gap-3">
<!-- Meter: 2 bars -->
<div class="w-10 h-10 rounded-xl bg-[#0F1E24] border border-[#233B44] flex items-end justify-center gap-1 pb-2 shrink-0">
<span class="w-1.5 h-2.5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-4 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-5.5 rounded-sm bg-[#1E333C]"></span>
<span class="w-1.5 h-7 rounded-sm bg-[#1E333C]"></span>
</div>
<div>
<div class="font-title text-[16px] leading-5 font-bold text-[#EEF6F7]">I know the basics</div>
<div class="font-label text-[12px] font-semibold text-[#A9BFC1] tracking-normal">Elementary • B1</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#36505A] bg-[#0F1E24] flex items-center justify-center shrink-0"></div>
</button>
<!-- Card 3: SELECTED STATE - Everyday topics -->
<button aria-checked="true" class="tactile-card is-selected w-full text-left bg-[#133036] border-2 border-[#2BA39A] rounded-2xl p-3.5 shadow-[0_5px_0_0_#0B4742] flex items-center justify-between relative overflow-hidden" role="radio" type="button">
<!-- Subtle top gloss shine -->
<div class="absolute inset-x-2 top-0 h-[2px] bg-white/30 rounded-full"></div>
<div class="flex items-center gap-3">
<!-- Meter: 3 bars -->
<div class="w-10 h-10 rounded-xl bg-[#0E2429] border border-[#2BA39A]/50 flex items-end justify-center gap-1 pb-2 shrink-0 shadow-sm">
<span class="w-1.5 h-2.5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-4 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-5.5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-7 rounded-sm bg-[#1E333C]"></span>
</div>
<div>
<div class="font-title text-[16px] leading-5 font-extrabold text-[#EEF6F7]">I can talk about everyday topics</div>
<div class="font-label text-[12px] font-extrabold text-[#6BD8CE] tracking-normal flex items-center gap-1.5 mt-0.5">
<span>Intermediate • B2</span>
<span class="px-1.5 py-0.5 bg-[#FFB054]/20 border border-[#FFB054]/40 text-[#FFD699] rounded font-extrabold text-[10px]">Target Band 6.5</span>
</div>
</div>
</div>
<!-- Selected checkmark chip -->
<div class="w-6 h-6 rounded-full bg-[#2BA39A] text-white flex items-center justify-center shrink-0 shadow-[0_2px_0_0_#1D7B74]">
<span class="material-symbols-outlined text-[16px] font-extrabold" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Card 4: I'm fairly confident -->
<button aria-checked="false" class="tactile-card w-full text-left bg-[#162930] border-2 border-[#2E4854] rounded-2xl p-3.5 shadow-[0_5px_0_0_#0A1518] flex items-center justify-between group hover:border-[#3D5C6B] hover:bg-[#1A313A]" role="radio" type="button">
<div class="flex items-center gap-3">
<!-- Meter: 4 bars -->
<div class="w-10 h-10 rounded-xl bg-[#0F1E24] border border-[#233B44] flex items-end justify-center gap-1 pb-2 shrink-0">
<span class="w-1.5 h-2.5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-4 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-5.5 rounded-sm bg-[#2BA39A]"></span>
<span class="w-1.5 h-7 rounded-sm bg-[#FFB054]"></span>
</div>
<div>
<div class="font-title text-[16px] leading-5 font-bold text-[#EEF6F7]">I'm fairly confident</div>
<div class="font-label text-[12px] font-semibold text-[#A9BFC1] tracking-normal">Advanced • C1 (Band 7.5+)</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-[#36505A] bg-[#0F1E24] flex items-center justify-center shrink-0"></div>
</button></div>
<!-- Placement Test Alternative Card -->
<section class="mt-3.5 mb-2"><button class="tactile-card w-full text-left bg-[#162930] border-2 border-[#2E4854] rounded-2xl p-3 shadow-[0_5px_0_0_#0A1518] flex items-center justify-between hover:bg-[#1A313A] hover:border-[#3D5C6B]" type="button">
<div class="flex items-center gap-2.5">
<div class="w-9 h-9 rounded-xl bg-[#FFB054]/20 border border-[#FFB054]/40 flex items-center justify-center text-[#FFB054] shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="explore">explore</span>
</div>
<div>
<div class="font-title text-[14px] leading-tight font-bold text-[#EEF6F7]">Not sure? Take a quick 3-minute placement test</div>
<div class="font-label text-[11px] font-semibold text-[#A9BFC1] tracking-tight">Adaptive diagnostic with immediate score</div>
</div>
</div>
<span class="material-symbols-outlined text-[#A9BFC1] text-[20px]" data-icon="chevron_right">chevron_right</span>
</button></section>
</div>
<!-- Bottom Action Area (Sticky / Docked CTA) -->
<footer class="w-full pt-2">
<!-- Full-width chunky tactile 'Continue' button with coral-to-amber gradient & deep brown-black text -->
<button class="tactile-btn w-full h-14 rounded-2xl bg-gradient-to-r from-[#F2553B] to-[#FFB054] border-2 border-[#B53A22] shadow-[0_6px_0_0_#B53A22] flex items-center justify-center gap-2 text-[#1E0C05] font-title font-extrabold text-[18px] tracking-wide relative overflow-hidden active:translate-y-1 hover:brightness-105" type="button">
<!-- Glossy specular top sheen line -->
<div class="absolute inset-x-3 top-0 h-[2.5px] bg-white/45 rounded-full"></div>
<span>Continue</span>
<span class="material-symbols-outlined text-[22px] font-extrabold text-[#1E0C05]" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</main>
<script>
    // Lightweight tactile selection micro-interaction
    document.querySelectorAll('.tactile-card[role="radio"]').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.tactile-card[role="radio"]').forEach(c => {
          c.classList.remove('is-selected', 'bg-[#F0FAF9]', 'border-[#2BA39A]', 'shadow-[0_5px_0_0_#1D7B74]');
          c.classList.add('bg-white', 'border-[#EADEC8]', 'shadow-[0_4px_0_0_#D8CFBC]');
          c.setAttribute('aria-checked', 'false');
          const indicator = c.querySelector('div:last-child');
          if (indicator) {
            indicator.className = 'w-6 h-6 rounded-full border-2 border-[#D8CFBC] flex items-center justify-center shrink-0';
            indicator.innerHTML = '';
          }
        });

        card.classList.add('is-selected', 'bg-[#F0FAF9]', 'border-[#2BA39A]', 'shadow-[0_5px_0_0_#1D7B74]');
        card.classList.remove('bg-white', 'border-[#EADEC8]', 'shadow-[0_4px_0_0_#D8CFBC]');
        card.setAttribute('aria-checked', 'true');
        const indicator = card.querySelector('div:last-child');
        if (indicator) {
          indicator.className = 'w-6 h-6 rounded-full bg-[#2BA39A] text-white flex items-center justify-center shrink-0 shadow-[0_2px_0_0_#1D7B74]';
          indicator.innerHTML = '<span class="material-symbols-outlined text-[16px] font-extrabold" data-icon="check" style="font-variation-settings: \'FILL\' 1;">check</span>';
        }
      });
    });
  </script>
</body></html>
