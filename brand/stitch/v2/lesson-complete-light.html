<script>
  // Simple micro-interaction for celebration tap
  const shareBtn = document.getElementById('shareButton');
  if (shareBtn) {
    shareBtn.addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: 'Lexkite v2 Achievement',
          text: 'I just finished Unit 3 Writing Task 1 with 100% accuracy and 14 days streak!',
          url: window.location.href
        }).catch(() => {});
      } else {
        shareBtn.classList.add('bg-accent-teal', 'text-on-primary');
        setTimeout(() => {
          shareBtn.classList.remove('bg-accent-teal', 'text-on-primary');
        }, 800);
      }
    });
  }

  // Tactile press button physics adjustments
  const continueBtn = document.getElementById('continueBtn');
  if (continueBtn) {
    continueBtn.addEventListener('mousedown', () => {
      continueBtn.style.boxShadow = '0 1px 0 #B53A22';
    });
    const resetContinue = () => {
      continueBtn.style.boxShadow = '0 6px 0 #B53A22';
    };
    continueBtn.addEventListener('mouseup', resetContinue);
    continueBtn.addEventListener('mouseleave', resetContinue);
    continueBtn.addEventListener('touchstart', () => {
      continueBtn.style.boxShadow = '0 1px 0 #B53A22';
    }, { passive: true });
    continueBtn.addEventListener('touchend', resetContinue);
  }

  const reviewBtn = document.getElementById('reviewBtn');
  if (reviewBtn) {
    reviewBtn.addEventListener('mousedown', () => {
      reviewBtn.style.boxShadow = '0 1px 0 #D5DEDC';
    });
    const resetReview = () => {
      reviewBtn.style.boxShadow = '0 4px 0 #D5DEDC';
    };

    reviewBtn.addEventListener('mouseleave', resetReview);
    reviewBtn.addEventListener('touchstart', () => {
      reviewBtn.style.boxShadow = '0 1px 0 #D5DEDC';
