<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Badge Unlocked - Lexkite</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary-fixed-dim": "#6bd8ce",
            "tertiary-fixed-dim": "#f4bf40",
            "tertiary-container": "#ba8b00",
            "surface-container-low": "#121d20",
            "on-primary": "#003733",
            "surface-bright": "#2f3b3e",
            "primary-container": "#2ba39a",
            "on-tertiary-fixed": "#261a00",
            "surface-tint": "#6bd8ce",
            "on-secondary": "#660800",
            "on-error-container": "#ffdad6",
            "background": "#091518",
            "outline": "#879391",
            "outline-variant": "#3d4947",
            "surface-dim": "#091518",
            "on-primary-container": "#00322e",
            "surface-container": "#162125",
            "secondary-container": "#981201",
            "surface-container-high": "#202c2f",
            "on-tertiary": "#402e00",
            "on-secondary-fixed-variant": "#900f00",
            "on-tertiary-fixed-variant": "#5b4300",
            "primary": "#6bd8ce",
            "on-secondary-container": "#ffa493",
            "surface-variant": "#2b373a",
            "on-surface-variant": "#bcc9c7",
            "inverse-surface": "#d8e5e9",
            "inverse-primary": "#006a64",
            "tertiary": "#f4bf40",
            "on-tertiary-container": "#392900",
            "secondary-fixed-dim": "#ffb4a6",
            "surface-container-lowest": "#051013",
            "surface-container-highest": "#2b373a",
            "secondary": "#ffb4a6",
            "on-error": "#690005",
            "on-secondary-fixed": "#3f0300",
            "surface": "#091518",
            "on-primary-fixed-variant": "#00504b",
            "inverse-on-surface": "#263236",
            "tertiary-fixed": "#ffdf9e",
            "primary-fixed": "#88f5ea",
            "error-container": "#93000a",
            "secondary-fixed": "#ffdad3",
            "on-primary-fixed": "#00201e",
            "on-surface": "#d8e5e9",
            "error": "#ffb4ab",
            "on-background": "#d8e5e9"
          },
          "borderRadius": {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          "spacing": {
            "margin": "1rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-xl": "2rem"
          },
          "fontFamily": {
            "body": ["Plus Jakarta Sans"],
            "headline": ["Plus Jakarta Sans"]
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .badge-ring-pulse {
      animation: slowSpin 24s linear infinite;
    }
    @keyframes slowSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-[#091518] text-[#d8e5e9] min-h-screen flex flex-col justify-between items-center selection:bg-[#2ba39a] selection:text-white">
<!-- Full-bleed Mobile Canvas -->
<main class="w-full max-w-md min-h-screen px-4 py-4 flex flex-col justify-between relative overflow-hidden bg-[#091518]">
<!-- Celebratory Atmospheric Sparkles & Confetti Background Elements -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none select-none overflow-hidden z-0">
<span class="material-symbols-outlined absolute top-14 right-8 text-[#6bd8ce] opacity-40 text-lg" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined absolute top-44 left-4 text-[#f4bf40] opacity-30 text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined absolute top-48 right-6 text-[#2ba39a] opacity-50 text-base" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<div class="absolute top-28 left-20 w-2 h-2 rounded-full bg-[#f4bf40] opacity-40"></div>
<div class="absolute top-36 right-20 w-1.5 h-1.5 rounded-full bg-[#6bd8ce] opacity-35"></div>
<div class="absolute top-64 right-10 w-2 h-2 rounded-full bg-[#f4bf40] opacity-30"></div>
</div>
<!-- Top Section: Header & Milestone Pill -->
<header class="relative z-10 flex flex-col items-center pt-2 text-center w-full">
<!-- Top back arrow in crisp light teal/white -->
<button aria-label="Go back" class="absolute top-2 left-0 w-10 h-10 flex items-center justify-center text-[#6bd8ce] hover:text-white transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined text-2xl font-bold">arrow_back_ios_new</span>
</button>
<!-- Milestone Capsule Pill with Tactile Border -->
<div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-[#102227] border-2 border-[#1e3d44] shadow-[0_3px_0_0_#071316] mb-2.5">
<span class="material-symbols-outlined text-[#f4bf40] text-[16px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-[12px] leading-4 text-[#ffdf9e] font-extrabold tracking-wider">MILESTONE COMPLETE</span>
</div>
<!-- Main Unlocked Headline -->
<h1 class="text-[30px] leading-[38px] text-white font-extrabold tracking-tight">
    New badge!
  </h1>
</header>
<!-- Central Interactive Hero: Tactile Gamified Medallion -->
<section aria-label="Unlocked Badge Visual" class="relative z-10 flex flex-col items-center my-3">
<div class="relative w-48 h-48 flex items-center justify-center">
<!-- Ambient outer decorative tactile ring -->
<div class="absolute inset-0 rounded-full border-4 border-dashed border-[#234248] opacity-80 badge-ring-pulse"></div>
<!-- Secondary teal halo depth tier -->
<div class="absolute inset-2 rounded-full bg-[#122e34]/60 border-2 border-[#1d434a]"></div>
<!-- Chunky 3D Base Medallion Disk with Physical Extruded Ledge -->
<div class="relative w-40 h-40 rounded-full bg-[#10252b] border-4 border-[#244b54] shadow-[0_8px_0_0_#071316] flex items-center justify-center overflow-hidden">
<!-- Inner Teal Vibrant Core Disk -->
<div class="relative w-32 h-32 rounded-full bg-gradient-to-b from-[#185358] to-[#0c2f33] border-2 border-[#2dd4bf]/40 flex items-center justify-center shadow-[inset_0_4px_10px_rgba(107,216,206,0.3)]">
<!-- Gloss Specular Highlight Arc -->
<div class="absolute top-1 left-2 right-2 h-14 rounded-t-full bg-white/15 pointer-events-none"></div>
<!-- Mini Stars inside cosmic sphere -->
<span class="material-symbols-outlined absolute top-4 left-5 text-[#6bd8ce]/60 text-xs" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined absolute bottom-5 right-6 text-[#f4bf40]/70 text-xs" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined absolute top-7 right-5 text-white/50 text-[10px]" style="font-variation-settings: 'FILL' 1;">star</span>
<!-- Center Rocket Hero Icon -->
<div class="transform -rotate-12 hover:scale-110 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-white text-5xl drop-shadow-[0_4px_8px_rgba(0,0,0,0.6)]" style="font-variation-settings: 'FILL' 1;">
            rocket_launch
          </span>
</div>
</div>
</div>
<!-- 4 o'clock Lightning Mini-Badge Accoutrement (Amber glow pill) -->
<div class="absolute bottom-2 right-4 w-11 h-11 rounded-full bg-[#f59e0b] border-2 border-[#10252b] shadow-[0_4px_0_0_#92400e] flex items-center justify-center transform hover:rotate-12 transition-transform">
<span class="material-symbols-outlined text-[#1c1003] text-xl font-black" style="font-variation-settings: 'FILL' 1;">
        bolt
      </span>
</div>
</div>
</section>
<!-- Badge Title Card (Dark Teal Surface) -->
<article class="relative z-10 w-full bg-[#102227] border-2 border-[#1e3d44] rounded-[1rem] p-4 shadow-[0_5px_0_0_#071316] text-center mb-3">
<!-- Level Indicator Capsule -->
<div class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-[#2a2211] border border-[#f59e0b]/50 text-[#ffc83b] mb-2">
<span class="material-symbols-outlined text-xs text-[#f59e0b]" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="text-[12px] font-extrabold tracking-wider uppercase">LEVEL 3 UNLOCKED</span>
</div>
<!-- Headline -->
<h2 class="text-[22px] leading-7 text-white font-extrabold tracking-tight mt-0.5 mb-1">
    Review machine
  </h2>
<!-- Subtitle Description -->
<p class="text-[16px] leading-6 text-[#a2c4c8] font-semibold">Reviewed 50 spaced flashcards today!</p>
</article>
<!-- Coach / Teacher Row: 2-Column Bento Integration -->
<section aria-label="Feedback and Teacher Status" class="relative z-10 w-full grid grid-cols-12 gap-2.5 mb-3">
<!-- Left Column: TEACHER SLOT (Clean 2D pedagogical indicator, no human face) -->
<div class="col-span-4 bg-[#0d1f23] border-2 border-dashed border-[#2dd4bf] rounded-[1rem] p-2.5 flex flex-col items-center justify-center text-center shadow-[0_4px_0_0_#071316]">
<div class="w-10 h-10 rounded-full bg-[#102c32] border-2 border-[#2dd4bf]/70 flex items-center justify-center mb-1 text-[#2dd4bf] shadow-[0_0_12px_rgba(45,212,191,0.2)]">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<span class="text-[12px] text-[#2dd4bf] font-extrabold tracking-wide">Teacher</span>
</div>
<!-- Right Column: Coach Speech Bubble Card -->
<div class="col-span-8 bg-[#102227] border-2 border-[#1e3d44] rounded-[1rem] p-3 shadow-[0_5px_0_0_#071316] relative flex flex-col justify-center">
<!-- Speech Bubble Left Tip Pointer -->
<div class="absolute -left-2 top-1/2 -translate-y-1/2 w-0 h-0 border-y-8 border-y-transparent border-r-8 border-r-[#1e3d44] hidden sm:block"></div>
<div class="flex items-center gap-1.5 mb-1">
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-[#153e40] text-[#6bd8ce] border border-[#2ba39a]/40 text-[12px] font-extrabold">🎉 GREAT PACE!</span>
</div>
<h3 class="text-[17px] leading-snug text-white font-extrabold">
      Super memory streak!
    </h3>
<p class="text-[14px] leading-5 text-[#a2c4c8] font-semibold mt-0.5">Keep it up.</p>
</div>
</section>
<!-- Interactive Bottom Actions & Gamified XP Stats -->
<footer class="relative z-10 w-full flex flex-col items-center pt-1 pb-1 gap-3">
<!-- Primary & Secondary Buttons Row -->
<div class="w-full flex items-center gap-3">
<!-- Secondary Button: Share -->
<button aria-label="Share badge achievement" class="flex-1 h-14 bg-[#102227] border-2 border-[#244b54] rounded-[1rem] shadow-[0_4px_0_0_#071316] active:translate-y-1 active:shadow-[0_1px_0_0_#071316] transition-all flex items-center justify-center gap-2 cursor-pointer group" type="button">
<span class="material-symbols-outlined text-[#6bd8ce] group-hover:scale-110 transition-transform">
        share
      </span>
<span class="text-[16px] text-[#6bd8ce] font-extrabold">
        Share
      </span>
</button>
<!-- Primary Button: Sunny Amber Continue CTA with High-Contrast Deep Ink -->
<button aria-label="Continue learning session" class="flex-[2] h-14 bg-[#f59e0b] border-2 border-[#d97706] rounded-[1rem] shadow-[0_5px_0_0_#8c4200] active:translate-y-1 active:shadow-[0_1px_0_0_#8c4200] transition-all flex items-center justify-center gap-1.5 cursor-pointer hover:brightness-105" type="button">
<span class="text-[16px] text-[#1c1003] font-extrabold tracking-wide">
        Continue →
      </span>
</button>
</div>
<!-- XP Target Footnote -->
<div class="flex items-center gap-1.5 text-[#a2c4c8]">
<span class="material-symbols-outlined text-[#f4bf40] text-base drop-shadow-[0_0_6px_rgba(244,191,64,0.4)]" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<p class="text-[14px] leading-5 font-bold text-[#d8e5e9] text-center">+30 XP earned towards Band 7.5 target</p>
</div>
</footer>
</main>
</body></html>
