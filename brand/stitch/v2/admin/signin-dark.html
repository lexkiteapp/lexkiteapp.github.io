<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Lexkite Admin — Sign-in Gate (Tactile Night)</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            night: {
              base: '#081518',       /* Deep teal-black canvas background */
              surface: '#0E1D21',    /* Surface layer */
              card: '#14272D',       /* Lighter dark teal card */
              raised: '#1B3239',     /* Raised interactive / inset panels */
              border: '#2A464E',     /* High-definition border */
              borderLedge: '#091316',/* Bottom ledge dark shadow depth */
              textPrimary: '#EEF6F7',/* Light crisp headline/body (contrast > 12:1) */
              textSecondary: '#A5C1C6',/* Muted secondary readable slate-mint (contrast > 5.5:1) */
              textMuted: '#88A9AF'   /* Subtle annotations, still > 4.5:1 */
            },
            teal: {
              DEFAULT: '#2BA39A',
              deep: '#1F7A75',
              glow: '#34D3C5',
              dark: '#134E4A'
            },
            coral: {
              DEFAULT: '#F2553B',
              hover: '#FF6B52',
              ledge: '#B53A22'
            },
            amber: {
              DEFAULT: '#FFB054',
              glow: '#FFC875'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    /* Tactile Physical Surface Ledges */
    .tactile-card {
      background-color: #14272D;
      border: 2px solid #2A464E;
      box-shadow: 0 8px 0 #091316, 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    .tactile-button-card {
      background-color: #1B3239;
      border: 2px solid #365761;
      box-shadow: 0 4px 0 #0B171A;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tactile-button-card:hover {
      background-color: #213B44;
      border-color: #436C78;
      transform: translateY(-1px);
      box-shadow: 0 5px 0 #0B171A;
    }
    .tactile-button-card:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0B171A;
    }

    /* Ambient Subtle Grid & Warm/Cool Radial Blurs */
    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(42, 70, 78, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(42, 70, 78, 0.15) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-night-base text-night-textPrimary antialiased min-h-screen flex flex-col font-sans select-none relative overflow-x-hidden">

  <!-- Background Decorative Ambient Glows and Soft Vector Shapes -->
  <div class="fixed inset-0 pointer-events-none bg-grid-pattern z-0 opacity-60"></div>
  
  <div class="fixed top-[-10%] left-[-5%] w-[500px] h-[500px] rounded-full bg-teal-DEFAULT/5 blur-[120px] pointer-events-none z-0"></div>
  <div class="fixed bottom-[-10%] right-[-5%] w-[520px] h-[520px] rounded-full bg-coral-DEFAULT/5 blur-[140px] pointer-events-none z-0"></div>
  <div class="fixed top-[20%] right-[10%] w-[380px] h-[380px] rounded-full bg-teal-DEFAULT/5 blur-[100px] pointer-events-none z-0"></div>

  <!-- Soft Decorative Tactile Geometric Shapes Matching Original Placement -->
  <div class="fixed top-[6%] left-[22%] w-56 h-72 rounded-[40px] border-2 border-night-border/30 rotate-[-12deg] pointer-events-none z-0 bg-night-surface/20"></div>
  <div class="fixed top-[28%] left-[2%] w-48 h-48 rounded-[36px] border-2 border-teal-DEFAULT/15 rotate-[24deg] pointer-events-none z-0 bg-teal-DEFAULT/5"></div>
  <div class="fixed bottom-[10%] right-[4%] w-64 h-64 rounded-[44px] border-2 border-night-border/30 rotate-[14deg] pointer-events-none z-0 bg-night-surface/25"></div>

  <!-- TOP HEADER (Exact Layout from SCREEN_15) -->
  <header class="w-full px-8 md:px-12 py-6 flex items-center justify-between relative z-10">
    <!-- Brand Wordmark & Kite Icon -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-teal-deep border-2 border-teal-glow/40 flex items-center justify-center shadow-[0_3px_0_#0D3835]">
        <!-- Origami Kite Emblem -->
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L19 10L12 15L5 10L12 2Z" fill="#34D3C5"/>
          <path d="M12 2L19 10L12 15V2Z" fill="#2BA39A"/>
          <path d="M12 15L16 21L12 19L8 21L12 15Z" fill="#F2553B"/>
          <circle cx="12" cy="10" r="1.5" fill="#FFF7EA"/>
        </svg>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-2xl font-extrabold tracking-tight text-night-textPrimary font-sans">Lexkite</span>
      </div>
    </div>

    <!-- Right Security Status Pill -->
    <div class="flex items-center gap-2.5 px-4 py-2 rounded-full bg-night-surface border-2 border-night-border shadow-[0_3px_0_#091316]">
      <span class="w-2.5 h-2.5 rounded-full bg-teal-glow animate-pulse"></span>
      <span class="text-xs font-extrabold tracking-widest text-teal-glow uppercase">EDGE AUTH • ENCRYPTED</span>
    </div>
  </header>

  <!-- MAIN VIEWPORT / AUTH CARD CONTAINER (Centered Gate) -->
  <main class="flex-1 flex items-center justify-center px-4 py-12 relative z-10">
    <div class="w-full max-w-[480px] tactile-card rounded-[32px] p-8 md:p-10 flex flex-col items-center text-center">
      
      <!-- Central App Emblem & Lock Icon Container -->
      <div class="relative mb-6">
        <!-- Squircle App Icon -->
        <div class="w-24 h-24 rounded-[26px] bg-gradient-to-br from-[#1E5C59] to-[#123E3C] border-2 border-teal-glow/50 flex items-center justify-center shadow-[0_6px_0_#0C2725,0_10px_20px_rgba(0,0,0,0.5)]">
          <!-- Stylized Kite Graphic -->
          <svg class="w-14 h-14" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Top Kite Facets -->
            <path d="M24 6L37 20L24 28L11 20L24 6Z" fill="#38E1D2"/>
            <path d="M24 6L37 20L24 28V6Z" fill="#209E94"/>
            <!-- Bottom Kite Tail Fins -->
            <path d="M24 28L31 40L24 36L17 40L24 28Z" fill="#F2553B"/>
            <path d="M24 28L31 40L24 36V28Z" fill="#D43D24"/>
            <!-- Center Focus Gem -->
            <circle cx="24" cy="20" r="2.5" fill="#FFFFFF"/>
          </svg>
        </div>

        <!-- Lock Badge Floating Over App Icon -->
        <div class="absolute -bottom-1.5 -right-1.5 w-8 h-8 rounded-full bg-amber-DEFAULT border-2 border-[#8A4C00] shadow-[0_3px_0_#8A4C00] flex items-center justify-center text-[#261500]">
          <span class="material-symbols-outlined text-[17px] font-bold" style="font-variation-settings: 'FILL' 1;">lock</span>
        </div>
      </div>

      <!-- Restricted Access Pill -->
      <div class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-night-raised border border-teal-DEFAULT/40 shadow-sm mb-4">
        <span class="material-symbols-outlined text-[15px] text-teal-glow">verified_user</span>
        <span class="text-[11px] font-extrabold tracking-widest text-teal-glow uppercase">RESTRICTED ACCESS</span>
      </div>

      <!-- Title & Subtitle -->
      <h1 class="text-3xl md:text-[34px] font-extrabold text-night-textPrimary tracking-tight mb-2.5">
        Lexkite Admin
      </h1>
      <p class="text-night-textSecondary text-[15px] font-medium leading-relaxed max-w-[340px] mb-8">
        Single-operator console for IELTS &amp; TOEIC exam engines.
      </p>

      <!-- Sign In With Google Tactile Button (Dark Mode Inset/Plate) -->
      <button class="w-full tactile-button-card rounded-2xl py-3.5 px-5 flex items-center justify-between group cursor-pointer text-left mb-6">
        <div class="flex items-center gap-3.5">
          <!-- Google Official Multi-Color "G" Icon -->
          <div class="w-7 h-7 rounded-lg bg-night-card border border-night-border/70 flex items-center justify-center flex-shrink-0">
            <svg class="w-4 h-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
          </div>
          <span class="text-base font-bold text-night-textPrimary group-hover:text-white transition-colors">
            Sign in with Google
          </span>
        </div>
        <span class="material-symbols-outlined text-[20px] text-teal-glow group-hover:translate-x-1 transition-transform">
          arrow_forward
        </span>
      </button>

      <!-- Trust & Guard Note -->
      <div class="flex items-center justify-center gap-2 text-night-textSecondary text-[13px] font-semibold">
        <span class="material-symbols-outlined text-[16px] text-teal-glow">shield</span>
        <span>Access is limited to authorized operators only</span>
      </div>

    </div>
  </main>

  <!-- BOTTOM FOOTER NOTE (Exact Layout from SCREEN_15) -->
  <footer class="w-full py-6 text-center relative z-10">
    <p class="text-night-textSecondary text-xs md:text-[13px] font-medium tracking-wide">
      Lexkite Ops Engine <span class="text-teal-DEFAULT/50 mx-1.5">•</span> Zero Tracking <span class="text-teal-DEFAULT/50 mx-1.5">•</span> Cloudflare Zero Trust Aligned
    </p>
  </footer>

</body>
</html>
