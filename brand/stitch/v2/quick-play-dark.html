<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite - quick-play (dark – dark-from-light.mjs)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              teal: '#5EEAD4',
              'teal-dark': '#C9F5EE',
              'teal-light': '#1F4A4E',
              coral: '#C94731',
              'coral-hover': '#B73F28',
              'coral-shadow': '#7D2C1E',
              cream: '#1D2F33',
              'card-border': '#4A6870',
              'ink-dark': '#E8F1F0',
              'ink-muted': '#BFD3D0',
            }
          },
          boxShadow: {
            'tactile': '0 4px 0 #0E1618',
            'tactile-coral': '0 4px 0 #7D2C1E',
            'tactile-subtle': '0 3px 0 #0E1618',
            'tactile-press': '0 1px 0 #7D2C1E',
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
    }
    body {
      background-color: #1D2F33;
      color: #E8F1F0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Touch target guarantee */
    .touch-target-44 {
      min-height: 44px;
      min-width: 44px;
    }
  </style>
</head>
<body class="flex justify-center bg-[#1D2F33] min-h-screen text-[#EAF2F2]">
  <main class="w-[390px] max-w-[390px] min-h-screen flex flex-col bg-[#1D2F33] pb-10">
    <header class="sticky top-0 z-30 bg-[#1D2F33]/95 backdrop-blur-md border-b-2 border-[#4A6870] px-4 py-2 flex items-center gap-3">
      <button type="button" aria-label="Back" class="touch-target-44 flex items-center justify-center rounded-xl bg-[#162528] border-2 border-[#4A6870] shadow-tactile-subtle text-[#5EEAD4]"><span class="material-symbols-rounded text-2xl">arrow_back</span></button>
      <div><h1 class="text-[20px] font-extrabold text-[#5EEAD4] leading-tight">Quick play</h1><p class="text-[12px] font-semibold text-[#BFD3D0]">15 seconds · 4 questions</p></div>
    </header>
    <div class="px-4 pt-3 flex flex-col gap-4">
 <div class="flex items-center gap-3"><div class="w-full h-2 rounded-full bg-[#F4E6DC]"><div class="h-2 rounded-full bg-[#0F3D3E]" style="width:25%"></div></div><span class="text-[14px] font-extrabold text-[#FF9A86] whitespace-nowrap">11 s</span></div>
 <div class="bg-[#162528] rounded-2xl border-2 border-[#4A6870] p-4 shadow-tactile flex flex-col gap-3 items-center text-center"><span class="text-[11px] font-extrabold uppercase text-[#5EEAD4] bg-[#1F4A4E] px-2 py-0.5 rounded-md">Question 2/4</span><span class="text-[30px] font-extrabold text-[#EAF2F2]">abandon</span><p class="text-[13px] font-semibold text-[#BFD3D0] leading-snug">Choose the right meaning</p></div>
 <div class="touch-target-44 flex items-center justify-between rounded-2xl bg-[#162528] border-2 border-[#2BA39A] px-4 py-3 shadow-tactile-subtle font-bold text-[16px]"><span>to give up</span><span class="text-[13px] text-[#BFD3D0]">1</span></div><div class="touch-target-44 flex items-center justify-between rounded-2xl bg-[#162528] border-2 border-[#4A6870] px-4 py-3 shadow-tactile-subtle font-bold text-[16px]"><span>to continue</span><span class="text-[13px] text-[#BFD3D0]">2</span></div><div class="touch-target-44 flex items-center justify-between rounded-2xl bg-[#162528] border-2 border-[#4A6870] px-4 py-3 shadow-tactile-subtle font-bold text-[16px]"><span>to collect</span><span class="text-[13px] text-[#BFD3D0]">3</span></div></div>
  </main>
</body>
</html>
