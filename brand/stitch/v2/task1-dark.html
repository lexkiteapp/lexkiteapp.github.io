 <div class="flex gap-2 overflow-x-auto"><span class="touch-target-44 inline-flex items-center px-3.5 py-2 rounded-full bg-[#1F4A4E] border-2 border-[#2BA39A] text-[#5EEAD4] font-bold text-[14px]">Line · energy</span><span class="touch-target-44 inline-flex items-center px-3.5 py-2 rounded-full bg-[#162528] border-2 border-[#4A6870] text-[#EAF2F2] font-bold text-[14px]">Bar · leisure</span><span class="touch-target-44 inline-flex items-center px-3.5 py-2 rounded-full bg-[#162528] border-2 border-[#4A6870] text-[#EAF2F2] font-bold text-[14px]">Pie · spending</span></div>
