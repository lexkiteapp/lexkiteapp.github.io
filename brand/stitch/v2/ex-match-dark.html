<style>

<body class="bg-background text-on-surface antialiased select-none font-body flex justify-center min-h-screen">
<!-- Mobile Screen Canvas Wrapper (390px portrait standard) -->
<main class="w-full max-w-[390px] min-h-screen bg-surface flex flex-col justify-between relative shadow-2xl overflow-hidden pb-4">
<!-- Top App Bar (Task runner - Fixed chrome logic) -->
<header class="w-full h-16 px-margin flex items-center justify-between z-40 bg-surface/90 backdrop-blur-md sticky top-0 border-b border-outline-variant/30">

</button>
<!-- Center Progress Track -->
<div class="flex-1 mx-3 flex flex-col justify-center gap-1">
<div class="flex items-center justify-between px-0.5">
<span class="font-label text-label text-[10px] uppercase text-on-surface-variant">Progress</span>
<span class="font-label text-label text-[11px] text-primary font-bold">50%</span>
</div>
<div class="w-full h-3 bg-surface-container-lowest rounded-full p-0.5 overflow-hidden border border-outline-variant/40">
<div class="h-full bg-gradient-to-r from-primary-container to-primary rounded-full transition-all duration-500 shadow-[inset_0_1px_1px_rgba(255,255,255,0.4)]" style="width: 50%;"></div>
</div>
</div>
<!-- Trailing Action: Quiet Audio Toggle (>=44x44px target) -->

<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</header>
<!-- Content Area: Prompt, Teacher Slot, and Pairs Canvas -->
<div class="flex-1 px-margin flex flex-col pt-2 pb-2 relative">
<!-- Header Prompt & Empty Teacher Slot Section -->
<section class="flex items-center gap-3 mb-3">
<!-- 1. Teacher Slot: Empty rounded dashed tactile frame (NO drawn characters or photos) -->
<div class="w-[62px] h-[62px] rounded-2xl border-2 border-dashed border-outline-variant bg-surface-container-low/70 flex flex-col items-center justify-center shrink-0 relative overflow-hidden shadow-[inset_0_2px_4px_rgba(0,0,0,0.4)]">
<!-- Subtle empty pedagogical floor shadow -->
<div class="w-7 h-2 bg-outline-variant/20 rounded-full mb-1"></div>
<span class="material-symbols-outlined text-outline-variant text-[20px]">person_outline</span>
<span class="font-label text-[9px] text-on-surface-variant tracking-wider font-extrabold uppercase mt-0.5">Carlos</span>
</div>
<!-- 2. Speech Bubble pointing towards teacher slot -->
<div class="flex-1 relative bg-surface-container-high border border-outline-variant rounded-2xl p-2.5 shadow-[0_3px_0_0_#121d20]">
<!-- Speech Bubble pointer arrow -->
<div class="absolute -left-2 top-1/2 -translate-y-1/2 w-0 h-0 border-y-[6px] border-y-transparent border-r-[8px] border-r-surface-container-high"></div>
<div class="flex items-center justify-between gap-1 mb-0.5">
<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-surface-container text-primary font-label text-[10px] font-bold tracking-wider border border-primary/20">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
              TOEIC · VOCAB
            </span>
<span class="font-label text-[11px] font-bold text-tertiary bg-tertiary/10 border border-tertiary/30 px-2 py-0.5 rounded-full shadow-[0_1px_0_0_#5b4300]">
              2/4 pairs
            </span>
</div>
<p class="font-title text-[13px] leading-4 text-on-surface font-bold">
            Tap a word, then its meaning
          </p>
</div>
</section>
<!-- 4 Rows × 2 Columns Matching Grid with SVG Connector Lines -->
<div class="relative flex-1 flex flex-col justify-between py-1">
<!-- Global SVG Canvas for Curved Connector Lines across the center column -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-20" preserveaspectratio="none" viewbox="0 0 358 420">
<defs>
<!-- Glowing Teal Filter for Row 1 -->
<filter height="140%" id="glow-teal" width="140%" x="-20%" y="-20%">
<fedropshadow dx="0" dy="0" flood-color="#6bd8ce" flood-opacity="0.8" stddeviation="2.5"></fedropshadow>
</filter>
<!-- Glowing Amber Filter for Row 2 -->
<filter height="140%" id="glow-coral" width="140%" x="-20%" y="-20%">
<fedropshadow dx="0" dy="0" flood-color="#f4bf40" flood-opacity="0.8" stddeviation="2.5"></fedropshadow>
</filter>
</defs>
<!-- Row 1 Connector: Left Invoice (x ~165, y ~50) to Right Hóa đơn (x ~193, y ~50) -->
<path d="M 166 48 C 179 48, 179 48, 192 48" fill="none" filter="url(#glow-teal)" stroke="#6bd8ce" stroke-linecap="round" stroke-width="3.5"></path>
<!-- Animated pulse center dot on Row 1 wire -->
<circle cx="179" cy="48" fill="#ffffff" r="3"></circle>
<!-- Row 2 Connector: Left Warehouse (x ~166, y ~155) to Right Nhà kho (x ~192, y ~155) -->
<path d="M 166 156 C 179 156, 179 156, 192 156" fill="none" filter="url(#glow-coral)" stroke="#f4bf40" stroke-linecap="round" stroke-width="3.5"></path>
<!-- Center connector bead on Row 2 -->
<circle cx="179" cy="156" fill="#ffdf9e" r="3"></circle>
</svg>
<!-- ================= ROW 1: MATCHED PAIR (TEAL) ================= -->
<div class="grid grid-cols-2 gap-7 relative z-10 mb-2.5">
<!-- Card 1A: English "invoice" -->
<div class="relative bg-[#0b2927] border-2 border-primary-container rounded-2xl p-2.5 flex flex-col justify-between h-[92px] shadow-[0_4px_0_0_#00504b] transition-all">
<!-- Top shiny specular reflection edge -->
<div class="absolute inset-x-2 top-0.5 h-[1.5px] bg-white/20 rounded-full pointer-events-none"></div>
<div class="flex items-start justify-between">
<!-- Flat Vector Tile: Invoice with receipt & dollar -->
<div class="w-10 h-10 rounded-xl bg-primary-container/30 border border-primary/30 flex items-center justify-center p-1 shadow-inner">
<svg class="w-6 h-6" fill="none" viewbox="0 0 28 28">
<rect fill="#123d3a" height="22" rx="3" stroke="#6bd8ce" stroke-width="1.8" width="18" x="5" y="3"></rect>
<path d="M8 8H14M8 12H20M8 16H16" stroke="#6bd8ce" stroke-linecap="round" stroke-width="1.6"></path>
<circle cx="17" cy="19" fill="#f4bf40" r="4.5"></circle>
</svg>
</div>
<!-- Matched Checkmark Badge -->

</div>
</div>
<!-- Label -->
<span class="font-title text-[15px] font-extrabold text-primary-fixed tracking-tight">invoice</span>
</div>
<!-- Card 1B: Vietnamese "hóa đơn" -->
<div class="relative bg-[#0b2927] border-2 border-primary-container rounded-2xl p-2.5 flex items-center justify-between h-[92px] shadow-[0_4px_0_0_#00504b]">
<div class="absolute inset-x-2 top-0.5 h-[1.5px] bg-white/20 rounded-full pointer-events-none"></div>
<!-- Centered Meaning -->
<div class="flex-1 flex flex-col justify-center">
<span class="font-title text-[16px] font-extrabold text-primary-fixed leading-tight">hóa đơn</span>
<span class="font-label text-[10px] text-primary/80 uppercase font-bold tracking-wider mt-0.5">Matched</span>
</div>
<!-- Matched Checkmark Badge -->
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center shrink-0 shadow-[0_1px_2px_rgba(0,0,0,0.4)]">
<span class="material-symbols-outlined text-[16px] font-black" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
<!-- ================= ROW 2: MATCHED PAIR (WARM AMBER / CORAL) ================= -->
<div class="grid grid-cols-2 gap-7 relative z-10 mb-2.5">
<!-- Card 2A: English "warehouse" -->
<div class="relative bg-[#2d1f05] border-2 border-tertiary rounded-2xl p-2.5 flex flex-col justify-between h-[92px] shadow-[0_4px_0_0_#5b4300] transition-all">

<path d="M4 11L14 4L24 11V23C24 23.5 23.5 24 23 24H5C4.5 24 4 23.5 4 23V11Z" fill="#3b2b08" stroke="#f4bf40" stroke-width="1.8"></path>
<rect fill="#f4bf40" height="5" rx="0.8" width="5" x="8" y="15"></rect>
<rect fill="#ffdf9e" height="5" rx="0.8" width="5" x="15" y="15"></rect>
<path d="M14 4V24" stroke="#f4bf40" stroke-dasharray="2 1" stroke-width="1.2"></path>
</svg>
</div>
<!-- Matched Warm Checkmark Badge -->
<div class="w-6 h-6 rounded-full bg-tertiary text-on-tertiary flex items-center justify-center shadow-[0_1px_2px_rgba(0,0,0,0.4)]">
<span class="material-symbols-outlined text-[16px] font-black" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Label -->
<span class="font-title text-[15px] font-extrabold text-tertiary-fixed tracking-tight">warehouse</span>
</div>
<!-- Card 2B: Vietnamese "nhà kho" -->
<div class="relative bg-[#2d1f05] border-2 border-tertiary rounded-2xl p-2.5 flex items-center justify-between h-[92px] shadow-[0_4px_0_0_#5b4300]">
<div class="absolute inset-x-2 top-0.5 h-[1.5px] bg-white/20 rounded-full pointer-events-none"></div>
<!-- Centered Meaning -->
<div class="flex-1 flex flex-col justify-center">
<span class="font-title text-[16px] font-extrabold text-tertiary-fixed leading-tight">nhà kho</span>
<span class="font-label text-[10px] text-tertiary/80 uppercase font-bold tracking-wider mt-0.5">Matched</span>
</div>
<!-- Matched Warm Checkmark Badge -->
<div class="w-6 h-6 rounded-full bg-tertiary text-on-tertiary flex items-center justify-center shrink-0 shadow-[0_1px_2px_rgba(0,0,0,0.4)]">
<span class="material-symbols-outlined text-[16px] font-black" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
<!-- ================= ROW 3: CURRENTLY SELECTED WORD + IDLE MEANING ================= -->
<div class="grid grid-cols-2 gap-7 relative z-10 mb-2.5">
<!-- Card 3A: English "deadline" (ACTIVE SELECTED STATE: Lifted, luminous ring, audio button) -->
<div class="relative bg-surface-container-high border-2 border-primary rounded-2xl p-2.5 flex flex-col justify-between h-[92px] shadow-[0_5px_0_0_#00504b] active-pulse cursor-pointer">
<!-- Specular top highlight -->
<div class="absolute inset-x-2 top-0.5 h-[1.5px] bg-white/30 rounded-full pointer-events-none"></div>
<div class="flex items-start justify-between">
<!-- Flat Vector Tile: Deadline (Clock & flip calendar) -->
<div class="w-10 h-10 rounded-xl bg-surface-container border border-primary/40 flex items-center justify-center p-1 shadow-inner">
<svg class="w-6 h-6" fill="none" viewbox="0 0 28 28">
<rect fill="#122728" height="19" rx="3" stroke="#6bd8ce" stroke-width="1.8" width="20" x="4" y="5"></rect>
<path d="M4 11H24" stroke="#6bd8ce" stroke-width="1.6"></path>
<circle cx="16" cy="18" fill="#091518" r="5" stroke="#f4bf40" stroke-width="1.5"></circle>
<path d="M16 15V18L18 19" stroke="#f4bf40" stroke-linecap="round" stroke-width="1.4"></path>
<path d="M8 3V6M20 3V6" stroke="#6bd8ce" stroke-linecap="round" stroke-width="2"></path>
</svg>
</div>
<!-- Pronunciation Audio Speaker Button (>= 44x44px target) -->
<button aria-label="Listen to pronunciation of deadline" class="w-11 h-11 -mt-2 -mr-2 rounded-xl flex items-center justify-center text-primary-fixed bg-surface-container-highest/80 hover:bg-primary/20 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
<!-- Bold Label with visual selection indicator -->
<div class="flex items-center justify-between">
<span class="font-title text-[15px] font-extrabold text-on-surface tracking-tight">deadline</span>
<span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>
</div>
</div>
<!-- Card 3B: Vietnamese "đàm phán" (IDLE STATE: Dark tactile card, neutral ledge) -->
<div class="tactile-btn relative bg-surface-container-high border-2 border-outline-variant rounded-2xl p-2.5 flex items-center justify-center h-[92px] shadow-[0_4px_0_0_#121d20] hover:border-outline cursor-pointer active:shadow-[0_1px_0_0_#121d20]">
<!-- Specular top highlight -->
<div class="absolute inset-x-2 top-0.5 h-[1px] bg-white/10 rounded-full pointer-events-none"></div>
<div class="text-center">
<span class="font-title text-[16px] font-bold text-on-surface">đàm phán</span>
</div>
</div>
</div>
<!-- ================= ROW 4: IDLE WORD + WRONG-ANSWER MEANING ================= -->
<div class="grid grid-cols-2 gap-7 relative z-10">

<div class="tactile-btn relative bg-surface-container-high border-2 border-outline-variant rounded-2xl p-2.5 flex flex-col justify-between h-[92px] shadow-[0_4px_0_0_#121d20] hover:border-outline cursor-pointer active:shadow-[0_1px_0_0_#121d20]">
<!-- Top shine -->
<div class="absolute inset-x-2 top-0.5 h-[1px] bg-white/10 rounded-full pointer-events-none"></div>
<div class="flex items-start justify-between">
<!-- Flat Vector Tile: Negotiate (Document Handshake) -->
<div class="w-10 h-10 rounded-xl bg-surface-container border border-outline-variant flex items-center justify-center p-1 shadow-inner">
<svg class="w-6 h-6" fill="none" viewbox="0 0 28 28">
<path d="M5 6C5 4.9 5.9 4 7 4H21C22.1 4 23 4.9 23 6V22C23 23.1 22.1 24 21 24H7C5.9 24 5 23.1 5 22V6Z" fill="#162125" stroke="#879391" stroke-width="1.6"></path>

<circle cx="12" cy="11" fill="#ffb4a6" r="2"></circle>
<circle cx="16" cy="11" fill="#6bd8ce" r="2"></circle>
</svg>
</div>
<!-- Audio Speaker Button (>= 44x44px touch target) -->
<button aria-label="Listen to pronunciation of negotiate" class="w-11 h-11 -mt-2 -mr-2 rounded-xl flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
</button>
</div>

<span class="font-title text-[15px] font-extrabold text-on-surface tracking-tight">negotiate</span>
</div>
<!-- Card 4B: Vietnamese "hạn chót" (WRONG-ANSWER STATE: Crimson Tint + Close Badge + Tooltip) -->
<div class="relative bg-[#2e100f] border-2 border-error rounded-2xl p-2.5 flex items-center justify-between h-[92px] shadow-[0_4px_0_0_#93000a] transition-all">
<!-- Top shine -->
<div class="absolute inset-x-2 top-0.5 h-[1px] bg-white/20 rounded-full pointer-events-none"></div>

<div class="absolute -top-3.5 left-1/2 -translate-x-1/2 px-2.5 py-0.5 bg-error-container text-on-error-container border border-error/50 rounded-full font-label text-[10px] font-black tracking-wide whitespace-nowrap shadow-md z-30 flex items-center gap-1">
<span class="w-1 h-1 rounded-full bg-error"></span>

            </div>
<!-- Centered Meaning -->
<div class="flex-1 flex flex-col justify-center">
<span class="font-title text-[16px] font-extrabold text-secondary-fixed leading-tight">hạn chót</span>
<span class="font-label text-[10px] text-error uppercase font-bold tracking-wider mt-0.5">Try again</span>
</div>

<div class="w-6 h-6 rounded-full bg-error text-on-error flex items-center justify-center shrink-0 shadow-[0_1px_2px_rgba(0,0,0,0.5)]">
<span class="material-symbols-outlined text-[16px] font-black">close</span>
</div>
</div>
</div>
</div>
</div>
<!-- Screen Footer (Quiet tactile controls & helper information) -->
<footer class="w-full px-margin pt-2 pb-1 flex flex-col items-center">
<!-- Quiet "Report" action button (Touch target >= 44x44px) -->
<button class="h-11 px-4 rounded-xl flex items-center justify-center gap-1.5 text-on-surface-variant hover:text-on-surface-variant active:text-on-surface transition-colors font-label text-label uppercase tracking-widest text-[11px]" type="button">
<span class="material-symbols-outlined text-[18px]">flag</span>

<p class="text-[11px] font-body text-on-surface-variant text-center -mt-1 pb-1">

      </p>
</footer>
