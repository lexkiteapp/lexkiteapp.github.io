<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lexkite v2 — Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24..48,400..700,1,0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            surface: {
              base: '#0B171A',
              card: '#152429',
              raised: '#1C3138',
              border: '#28434D',
              ledge: '#0B1518',
            },
            teal: {
              main: '#2BA39A',
              deep: '#1F7A75',
              glow: '#35D0C5',
            },
            coral: {
              main: '#F2553B',
              dark: '#B53A22',
            },
            amber: {
              main: '#FFB054',
              gold: '#FFC94A',
            },
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #060E10;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
    }
    /* 3D Tactile Button & Card Physics */
    .tactile-card {
      border: 2px solid #28434D;
      box-shadow: 0 6px 0 0 #0C1619;
      transition: all 0.12s ease-in-out;
    }
    .tactile-card:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 0 #0C1619;
    }
    .tactile-btn-primary {
      background: linear-gradient(180deg, #FF9C45 0%, #F2553B 100%);
      box-shadow: 0 6px 0 0 #A8331E, inset 0 2px 0 0 rgba(255, 255, 255, 0.35);
      transition: all 0.1s ease;
    }
    .tactile-btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 0 #A8331E, inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
    }
    /* Glossy node circle shine */
    .glossy-circle {
      position: relative;
      overflow: hidden;
    }
    .glossy-circle::after {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 9999px 9999px 60% 60%;
      pointer-events: none;
    }
    /* Custom scrollbar hiding */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen text-[#EEF6F7]">

  <!-- Mobile Frame Container (Max 430px) -->
  <div class="relative w-full max-w-[420px] h-[100dvh] max-h-[920px] bg-[#0B171A] flex flex-col justify-between overflow-hidden shadow-2xl rounded-none sm:rounded-[36px] border-0 sm:border-4 sm:border-[#1E323A]">

    <!-- ============================================== -->
    <!-- 1. V2 HEADER (4 Balanced Tactile Metric Chips)  -->
    <!-- ============================================== -->
    <header class="h-[64px] px-4 pt-3 pb-2 flex items-center justify-between z-20 bg-[#0B171A]/95 backdrop-blur-md border-b border-[#182B30]">
      <!-- 1. IELTS Shield Chip -->
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#13272C] border border-[#213F47] shadow-[0_2px_0_0_#0A1619] cursor-pointer active:translate-y-0.5 transition-transform">
        <span class="material-symbols-rounded text-[#2BA39A] text-[20px] drop-shadow-[0_1px_2px_rgba(43,163,154,0.4)]">shield</span>
        <span class="text-[13px] font-extrabold tracking-wider text-[#2BA39A]">IELTS</span>
      </div>

      <!-- 2. Streak Flame Chip (with red notification dot) -->
      <div class="relative flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#241B18] border border-[#48281E] shadow-[0_2px_0_0_#140D0B] cursor-pointer active:translate-y-0.5 transition-transform">
        <span class="material-symbols-rounded text-[#FF643D] text-[20px] drop-shadow-[0_2px_6px_rgba(255,100,61,0.5)]">local_fire_department</span>
        <span class="text-[14px] font-extrabold text-[#FFA880]">14</span>
        <!-- Small red dot badge -->
        <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-[#FF3B30] rounded-full border-2 border-[#0B171A]"></span>
      </div>

      <!-- 3. XP Bolt Chip -->
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#262013] border border-[#4C3B18] shadow-[0_2px_0_0_#141009] cursor-pointer active:translate-y-0.5 transition-transform">
        <span class="material-symbols-rounded text-[#FFC94A] text-[20px] drop-shadow-[0_2px_6px_rgba(255,201,74,0.45)]">bolt</span>
        <span class="text-[14px] font-extrabold text-[#FFD77D]">820</span>
      </div>

      <!-- 4. Daily Goal Ring Chip (14/20) -->
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#122828] border border-[#1E4141] shadow-[0_2px_0_0_#0A1717] cursor-pointer active:translate-y-0.5 transition-transform">
        <!-- Circular mini progress SVG ring -->
        <div class="relative w-5 h-5 flex items-center justify-center">
          <svg class="w-5 h-5 -rotate-90" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="13" stroke="#1D3E40" stroke-width="4" fill="transparent"/>
            <circle cx="16" cy="16" r="13" stroke="#2BA39A" stroke-width="4" stroke-dasharray="81.68" stroke-dashoffset="24.5" stroke-linecap="round" fill="transparent"/>
          </svg>
          <span class="material-symbols-rounded text-[#2BA39A] text-[12px] absolute">check</span>
        </div>
        <span class="text-[13px] font-extrabold text-[#38D6C9]">14/20</span>
      </div>
    </header>

    <!-- ============================================== -->
    <!-- MAIN SCROLLABLE CONTENT AREA                   -->
    <!-- ============================================== -->
    <main class="flex-1 overflow-y-auto no-scrollbar px-4 py-4 space-y-4">

      <!-- ============================================== -->
      <!-- HERO CARD: Daily Sprint 3/5                    -->
      <!-- ============================================== -->
      <section class="w-full bg-[#152429] rounded-[22px] border-2 border-[#28434D] shadow-[0_6px_0_0_#0B1518] p-4 relative overflow-hidden">
        <!-- Subtle background glow -->
        <div class="absolute -right-10 -bottom-10 w-36 h-36 bg-[#2BA39A]/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full bg-[#1E3B3A] border border-[#2BA39A]/40 flex items-center justify-center text-[#2BA39A] shadow-inner">
              <span class="material-symbols-rounded text-[20px]">fitness_center</span>
            </div>
            <div>
              <div class="text-[11px] font-extrabold tracking-wider uppercase text-[#8BA4A9]">Target Goal</div>
              <h1 class="text-[19px] font-extrabold tracking-tight text-[#EEF6F7]">Daily sprint 3/5</h1>
            </div>
          </div>
          <!-- XP Pill reward tag -->
          <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-[#2A1E11] border border-[#5A3F1C] text-[#FFB054] text-[12px] font-bold shadow-sm">
            <span class="material-symbols-rounded text-[14px]">bolt</span>
            <span>+25 XP</span>
          </div>
        </div>

        <!-- Chunky Tactile Progress Bar -->
        <div class="w-full h-[18px] bg-[#0C1619] rounded-full p-[3px] shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] relative overflow-hidden mb-3">
          <!-- Filled bar (60% = 3/5) with glossy sheen -->
          <div class="h-full w-[60%] rounded-full bg-gradient-to-r from-[#218079] via-[#2BA39A] to-[#39D6C9] relative shadow-[0_2px_6px_rgba(43,163,154,0.5)]">
            <!-- Specular top white reflection strip -->
            <div class="absolute top-0 left-2 right-2 h-[40%] bg-white/40 rounded-full"></div>
          </div>
        </div>

        <!-- Sprint Quick Status & Action Row -->
        <div class="flex items-center justify-between pt-1">
          <span class="text-[13px] font-bold text-[#8FAAB0] flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-[#2BA39A] animate-pulse"></span>
            2 drills left to complete streak
          </span>
          <button class="px-3.5 py-1.5 rounded-[12px] bg-[#223840] hover:bg-[#2A454F] border border-[#395661] shadow-[0_3px_0_0_#0D1A1E] text-[13px] font-bold text-[#EEF6F7] active:translate-y-0.5 active:shadow-[0_1px_0_0_#0D1A1E] transition-all flex items-center gap-1">
            <span>Resume</span>
            <span class="material-symbols-rounded text-[16px]">arrow_forward</span>
          </button>
        </div>
      </section>

      <!-- ============================================== -->
      <!-- 2-COLUMN GRID OF 8 CHUNKY SKILL TILES          -->
      <!-- 2px border + 6px ledge, glossy circle, 1 word   -->
      <!-- ============================================== -->
      <section class="grid grid-cols-2 gap-3.5 pb-2">

        <!-- 1. Listening (Teal Theme) -->
        <button class="tactile-card group bg-[#152429] rounded-[20px] p-4 flex flex-col items-center justify-center text-center relative overflow-hidden active:bg-[#132226]">
          <!-- Glossy 3D Circle -->
          <div class="glossy-circle w-[64px] h-[64px] rounded-full bg-gradient-to-b from-[#34C5BA] to-[#1C736C] border-2 border-[#54E4D9]/40 shadow-[0_5px_0_0_#114541] flex items-center justify-center text-white mb-2.5 transition-transform group-hover:scale-105">
            <span class="material-symbols-rounded text-[32px] drop-shadow-[0_2px_3px_rgba(0,0,0,0.3)]">headphones</span>
          </div>
          <!-- Single Short Label -->
          <span class="text-[16px] font-extrabold text-[#EEF6F7] tracking-tight">Listening</span>
        </button>

        <!-- 2. Reading (Sky Blue Theme) -->
        <button class="tactile-card group bg-[#152429] rounded-[20px] p-4 flex flex-col items-center justify-center text-center relative overflow-hidden active:bg-[#132226]">
          <!-- Glossy 3D Circle -->
          <div class="glossy-circle w-[64px] h-[64px] rounded-full bg-gradient-to-b from-[#38B6FF] to-[#1B6FB0] border-2 border-[#7CD1FF]/40 shadow-[0_5px_0_0_#104772] flex items-center justify-center text-white mb-2.5 transition-transform group-hover:scale-105">
            <span class="material-symbols-rounded text-[32px] drop-shadow-[0_2px_3px_rgba(0,0,0,0.3)]">menu_book</span>
          </div>
          <!-- Single Short Label -->
          <span class="text-[16px] font-extrabold text-[#EEF6F7] tracking-tight">Reading</span>
        </button>

        <!-- 3. Writing (Amber / Orange Theme) -->
        <button class="tactile-card group bg-[#152429] rounded-[20px] p-4 flex flex-col items-center justify-center text-center relative overflow-hidden active:bg-[#132226]">
          <!-- Glossy 3D Circle -->
          <div class="glossy-circle w-[64px] h-[64px] rounded-full bg-gradient-to-b from-[#FFA73B] to-[#C96B12] border-2 border-[#FFC87A]/40 shadow-[0_5px_0_0_#804106] flex items-center justify-center text-white mb-2.5 transition-transform group-hover:scale-105">
            <span class="material-symbols-rounded text-[32px] drop-shadow-[0_2px_3px_rgba(0,0,0,0.3)]">edit</span>
          </div>
          <!-- Single Short Label -->
          <span class="text-[16px] font-extrabold text-[#EEF6F7] tracking-tight">Writing</span>
        </button>

        <!-- 4. Speaking (Coral Theme) -->
        <button class="tactile-card group bg-[#152429] rounded-[20px] p-4 flex flex-col items-center justify-center text-center relative overflow-hidden active:bg-[#132226]">
          <!-- Glossy 3D Circle -->
          <div class="glossy-circle w-[64px] h-[64px] rounded-full bg-gradient-to-b from-[#FF6B52] to-[#C9331C] border-2 border-[#FFA191]/40 shadow-[0_5px_0_0_#7D1D0D] flex items-center justify-center text-white mb-2.5 transition-transform group-hover:scale-105">
            <span class="material-symbols-rounded text-[32px] drop-shadow-[0_2px_3px_rgba(0,0,0,0.3)]">mic</span>
          </div>
          <!-- Single Short Label -->
          <span class="text-[16px] font-extrabold text-[#EEF6F7] tracking-tight">Speaking</span>
        </button>

        <!-- 5. Grammar (Emerald / Green Theme) -->
        <button class="tactile-card group bg-[#152429] rounded-[20px] p-4 flex flex-col items-center justify-center text-center relative overflow-hidden active:bg-[#132226]">
          <!-- Glossy 3D Circle -->
          <div class="glossy-circle w-[64px] h-[64px] rounded-full bg-gradient-to-b from-[#34D399] to-[#0D875A] border-2 border-[#6EE7B7]/40 shadow-[0_5px_0_0_#065337] flex items-center justify-center text-white mb-2.5 transition-transform group-hover:scale-105">
            <span class="material-symbols-rounded text-[32px] drop-shadow-[0_2px_3px_rgba(0,0,0,0.3)]">auto_awesome</span>
          </div>
          <!-- Single Short Label -->
          <span class="text-[16px] font-extrabold text-[#EEF6F7] tracking-tight">Grammar</span>
        </button>

        <!-- 6. Phonetics (Violet / Purple Theme) -->
        <button class="tactile-card group bg-[#152429] rounded-[20px] p-4 flex flex-col items-center justify-center text-center relative overflow-hidden active:bg-[#132226]">
          <!-- Glossy 3D Circle -->
          <div class="glossy-circle w-[64px] h-[64px] rounded-full bg-gradient-to-b from-[#A78BFA] to-[#673FB3] border-2 border-[#C4B5FD]/40 shadow-[0_5px_0_0_#3F2275] flex items-center justify-center text-white mb-2.5 transition-transform group-hover:scale-105">
            <span class="material-symbols-rounded text-[32px] drop-shadow-[0_2px_3px_rgba(0,0,0,0.3)]">graphic_eq</span>
          </div>
          <!-- Single Short Label -->
          <span class="text-[16px] font-extrabold text-[#EEF6F7] tracking-tight">Phonetics</span>
        </button>

        <!-- 7. Teacher call (Cyan / Sky Theme) -->
        <button class="tactile-card group bg-[#152429] rounded-[20px] p-4 flex flex-col items-center justify-center text-center relative overflow-hidden active:bg-[#132226]">
          <!-- Glossy 3D Circle -->
          <div class="glossy-circle w-[64px] h-[64px] rounded-full bg-gradient-to-b from-[#2DD4BF] to-[#0F766E] border-2 border-[#5EEAD4]/40 shadow-[0_5px_0_0_#094E48] flex items-center justify-center text-white mb-2.5 transition-transform group-hover:scale-105">
            <span class="material-symbols-rounded text-[32px] drop-shadow-[0_2px_3px_rgba(0,0,0,0.3)]">call</span>
          </div>
          <!-- Single Short Label -->
          <span class="text-[16px] font-extrabold text-[#EEF6F7] tracking-tight whitespace-nowrap">Teacher call</span>
        </button>

        <!-- 8. Stories (Golden Yellow Theme) -->
        <button class="tactile-card group bg-[#152429] rounded-[20px] p-4 flex flex-col items-center justify-center text-center relative overflow-hidden active:bg-[#132226]">
          <!-- Glossy 3D Circle -->
          <div class="glossy-circle w-[64px] h-[64px] rounded-full bg-gradient-to-b from-[#FBBF24] to-[#B45309] border-2 border-[#FCD34D]/40 shadow-[0_5px_0_0_#6E3205] flex items-center justify-center text-white mb-2.5 transition-transform group-hover:scale-105">
            <span class="material-symbols-rounded text-[32px] drop-shadow-[0_2px_3px_rgba(0,0,0,0.3)]">auto_stories</span>
          </div>
          <!-- Single Short Label -->
          <span class="text-[16px] font-extrabold text-[#EEF6F7] tracking-tight">Stories</span>
        </button>

      </section>

    </main>

    <!-- ============================================== -->
    <!-- 3. V2 TAB BAR (Icon-Only, 30px Illustrated,    -->
    <!--    PRACTICE ACTIVE: rounded square, 2px border -->
    <!--    + teal tint; red dot on Review)             -->
    <!-- ============================================== -->
    <nav class="h-[74px] px-3 bg-[#0B171A] border-t border-[#182B30] flex items-center justify-around z-30">
      
      <!-- Tab 1: Learn (Kite / Route icon) -->
      <button class="w-[52px] h-[52px] flex items-center justify-center rounded-[16px] text-[#718E94] hover:text-[#2BA39A] transition-colors active:scale-95" aria-label="Learn">
        <span class="material-symbols-rounded text-[30px]">navigation</span>
      </button>

      <!-- Tab 2: Review (Cards stack icon + small red notification dot) -->
      <button class="relative w-[52px] h-[52px] flex items-center justify-center rounded-[16px] text-[#867BB5] hover:text-[#A78BFA] transition-colors active:scale-95" aria-label="Review">
        <span class="material-symbols-rounded text-[30px]">layers</span>
        <!-- Small red dot badge on Review as requested in v2 kit -->
        <span class="absolute top-2.5 right-2.5 w-2.5 h-2.5 bg-[#FF3B30] rounded-full border-2 border-[#0B171A]"></span>
      </button>

      <!-- Tab 3: Practice (ACTIVE: Rounded square, 2px teal border, teal tint) -->
      <button class="w-[54px] h-[54px] flex items-center justify-center rounded-[16px] bg-[#173A3C] border-2 border-[#2BA39A] text-[#34D3C6] shadow-[0_2px_8px_rgba(43,163,154,0.3)] transition-all" aria-label="Practice (Active)">
        <span class="material-symbols-rounded text-[30px] drop-shadow-[0_2px_4px_rgba(52,211,198,0.5)]">fitness_center</span>
      </button>

      <!-- Tab 4: Leagues (Trophy icon) -->
      <button class="w-[52px] h-[52px] flex items-center justify-center rounded-[16px] text-[#8F7E50] hover:text-[#FFC94A] transition-colors active:scale-95" aria-label="Leagues">
        <span class="material-symbols-rounded text-[30px]">trophy</span>
      </button>

      <!-- Tab 5: Me (Profile avatar icon) -->
      <button class="w-[52px] h-[52px] flex items-center justify-center rounded-[16px] text-[#5D8296] hover:text-[#38B6FF] transition-colors active:scale-95" aria-label="Me">
        <span class="material-symbols-rounded text-[30px]">person</span>
      </button>

    </nav>

  </div>

</body>
</html>
