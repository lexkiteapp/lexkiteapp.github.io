<script>
  // Micro-interaction for feedback press mechanics
  const continueBtn = document.getElementById('continue-button');
  if (continueBtn) {
    continueBtn.addEventListener('mousedown', () => {
      continueBtn.style.boxShadow = '0 1px 0 #E2D1B3';
    });
    continueBtn.addEventListener('mouseup', () => {
      continueBtn.style.boxShadow = '0 5px 0 #E2D1B3';
    });
    continueBtn.addEventListener('touchstart', () => {
      continueBtn.style.boxShadow = '0 1px 0 #E2D1B3';
    });
    continueBtn.addEventListener('touchend', () => {
      continueBtn.style.boxShadow = '0 5px 0 #E2D1B3';
    });
  }
