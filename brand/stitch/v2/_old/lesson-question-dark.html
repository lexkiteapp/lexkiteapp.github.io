<script>
  function selectCard(clickedBtn, word) {
    const allCards = document.querySelectorAll('.answer-card');
    allCards.forEach(card => {
      card.setAttribute('aria-checked', 'false');
      card.classList.remove('selected-card', 'bg-secondary-container/20', 'shadow-[0_6px_0_0_#00504b,0_12px_24px_rgba(40,161,152,0.25)]');
      card.classList.add('bg-surface-container', 'shadow-[0_6px_0_0_#041013,0_10px_20px_rgba(0,0,0,0.35)]');

      const badge = card.querySelector('.w-6');
      if (badge) {
        badge.className = 'w-6 h-6 rounded-lg bg-surface-container-highest flex items-center justify-center font-label-badge text-label-badge text-on-surface-variant';
      }

      const indicator = card.querySelector('.card-indicator');
      if (indicator) {
        indicator.className = 'w-5 h-5 rounded-full bg-surface-container-highest flex items-center justify-center card-indicator';
        indicator.innerHTML = '';
      }

      const label = card.querySelector('.card-label');
      if (label) {
        label.className = 'card-label font-headline-sm text-headline-sm text-on-surface tracking-tight';
      }

      const highlight = card.querySelector('div:first-child');
      if (highlight) {
        highlight.className = 'absolute inset-x-3 top-0.5 h-[1px] bg-white/10 rounded-full';
      }
    });

    clickedBtn.setAttribute('aria-checked', 'true');
    clickedBtn.classList.add('selected-card', 'bg-secondary-container/20', 'shadow-[0_6px_0_0_#00504b,0_12px_24px_rgba(40,161,152,0.25)]');
    clickedBtn.classList.remove('bg-surface-container', 'shadow-[0_6px_0_0_#041013,0_10px_20px_rgba(0,0,0,0.35)]');

    const badge = clickedBtn.querySelector('.w-6');
    if (badge) {
      badge.className = 'w-6 h-6 rounded-lg bg-secondary-container text-on-secondary flex items-center justify-center font-label-badge text-label-badge';
    }

    const indicator = clickedBtn.querySelector('.card-indicator');
    if (indicator) {
      indicator.className = 'w-5 h-5 rounded-full bg-secondary text-on-secondary flex items-center justify-center card-indicator shadow-sm';
      indicator.innerHTML = '<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
    }

    const label = clickedBtn.querySelector('.card-label');
    if (label) {
      label.className = 'card-label font-headline-sm text-headline-sm text-secondary-fixed tracking-tight font-extrabold';
    }

    const highlight = clickedBtn.querySelector('div:first-child');
    if (highlight) {
      highlight.className = 'absolute inset-x-3 top-0.5 h-[1px] bg-secondary-fixed/40 rounded-full';
    }

    const blank = document.getElementById('blankTarget');
    if (blank) {
      blank.innerHTML = '<span class="text-secondary font-headline-md text-headline-md tracking-tight animate-pulse">' + word + '</span>';
      blank.classList.remove('bg-surface-container-lowest');
      blank.classList.add('bg-secondary-container/20');
      setTimeout(() => {
        blank.querySelector('span').classList.remove('animate-pulse');
      }, 400);
    }
  }

  const audioBtn = document.getElementById('audioPromptBtn');
  if (audioBtn) {
    audioBtn.addEventListener('click', () => {
      audioBtn.classList.add('scale-95');
      setTimeout(() => audioBtn.classList.remove('scale-95'), 150);
    });
  }
</script></main><aside class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-8px_32px_rgba(0,0,0,0.5)]"><div class="h-20 px-margin flex items-center justify-center"><button class="w-full h-14 min-h-[52px] rounded-full bg-gradient-to-b from-primary to-primary-container text-on-surface font-title-pill text-title-pill shadow-[0_4px_0_0_#900f00,0_12px_24px_-4px_rgba(250,91,64,0.35)] transition-transform active:translate-y-[3px] active:shadow-[0_1px_0_0_#900f00] flex items-center justify-center gap-space-xs" type="button"><span class="">CHECK ANSWER</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button></div></aside>
