<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Keyframes for subtle atmospheric celebration */
    @keyframes pulse-ring {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    @keyframes float-gentle {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(4deg);
      }
    }

    @keyframes float-reverse {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(5px) rotate(-5deg);
      }
    }

    .anim-pulse-ring {
      animation: pulse-ring 4s ease-in-out infinite;
    }

    .anim-float {
      animation: float-gentle 3.5s ease-in-out infinite;
    }

    .anim-float-delayed {
      animation: float-reverse 4s ease-in-out 0.8s infinite;
    }

    /* Tactile sinking mechanics */
    .tactile-cta {
      box-shadow: 0 6px 0 0 #B53A22;
      transition: all 0.08s ease-in-out;
    }
    .tactile-cta:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 0 #B53A22;
    }

    .tactile-card-amber {
      box-shadow: 0 5px 0 0 #8C6400;
      transition: transform 0.08s ease-in-out, box-shadow 0.08s ease-in-out;
    }
    .tactile-card-amber:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #8C6400;
    }

    .tactile-card-teal {
      box-shadow: 0 5px 0 0 #00504B;
      transition: transform 0.08s ease-in-out, box-shadow 0.08s ease-in-out;
    }
    .tactile-card-teal:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #00504B;
    }

    .tactile-card-coral {
      box-shadow: 0 5px 0 0 #900F00;
      transition: transform 0.08s ease-in-out, box-shadow 0.08s ease-in-out;
    }
    .tactile-card-coral:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #900F00;
    }

    .tactile-secondary {
      box-shadow: 0 4px 0 0 #051013;
      transition: all 0.08s ease-in-out;
    }
    .tactile-secondary:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 0 #051013;
    }
  </style>

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-0 md:p-6 overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Mobile Device Shell Frame -->

<!-- Ambient Background Glows -->
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 bg-tertiary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary-container/15 rounded-full blur-[100px] pointer-events-none"></div>
<!-- 1. Header / Top Chrome -->
