<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Kit — Badge Illustration Sheet (Bright Day)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFF8F0;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FFF8F0] flex items-center justify-center p-6 md:p-12 selection:bg-teal-200">

  <!-- Illustration Sheet Canvas -->
  <main class="w-full max-w-5xl mx-auto flex items-center justify-center">
    
    <!-- 6 Glossy Badges Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-6 md:gap-10 w-full max-w-4xl justify-items-center">

      <!-- Badge 1: Graduation Cap (Deep Teal / Royal Blue Accent) -->
      <div class="w-40 h-40 sm:w-48 sm:h-48 md:w-56 md:h-56 relative group">
        <!-- Soft 3D tactile ledge -->
        <div class="absolute inset-0 rounded-[36px] bg-[#0A4D49] translate-y-3 md:translate-y-4"></div>
        <!-- Glossy badge container with inline vector SVG -->
        <div class="relative w-full h-full rounded-[36px] bg-[#0D6964] border-4 border-[#12827B] p-4 sm:p-5 flex items-center justify-center overflow-hidden shadow-lg transition-transform duration-150 active:translate-y-2">
          <!-- Glass glossy highlight overlay -->
          <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/25 to-transparent rounded-t-[32px] pointer-events-none"></div>
          
          <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="mortarGrad" x1="100" y1="40" x2="100" y2="105" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#212F3D"/>
                <stop offset="100%" stop-color="#11171D"/>
              </linearGradient>
              <linearGradient id="tasselGold" x1="140" y1="75" x2="165" y2="135" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFDD55"/>
                <stop offset="100%" stop-color="#FF9E1B"/>
              </linearGradient>
            </defs>
            <!-- Cap Skull Base / Under-rim -->
            <path d="M52 92 C52 130 148 130 148 92 L142 85 C142 118 58 118 58 85 Z" fill="#0D1318"/>
            <path d="M58 85 C58 116 142 116 142 85 L142 80 C142 110 58 110 58 80 Z" fill="#2E3C48"/>
            
            <!-- Mortarboard Diamond Top (Thick tactile bevel) -->
            <path d="M100 42 L180 78 L100 114 L20 78 Z" fill="#0B1116"/>
            <!-- Mortarboard Diamond Surface Face -->
            <path d="M100 46 L174 78 L100 108 L26 78 Z" fill="url(#mortarGrad)"/>
            <!-- Gloss edge reflection -->
            <path d="M100 48 L170 78 L140 85 L100 56 Z" fill="white" fill-opacity="0.18"/>

            <!-- Center Cap Button / Stud -->
            <ellipse cx="100" cy="77" rx="7" ry="5" fill="#FFC83B"/>

            <!-- Tassel Ribbon & Bobble -->
            <path d="M100 77 Q135 78 152 105" stroke="#E6A817" stroke-width="5" stroke-linecap="round"/>
            <path d="M100 77 Q135 78 152 105" stroke="url(#tasselGold)" stroke-width="3" stroke-linecap="round"/>
            <!-- Tassel Band Ring -->
            <rect x="146" y="103" width="12" height="6" rx="2" fill="#E69500"/>
            <!-- Tassel Hanging Brush -->
            <path d="M147 108 L142 142 C142 146 162 146 162 142 L157 108 Z" fill="url(#tasselGold)"/>
            <!-- Highlight sheen on tassel -->
            <path d="M149 111 L146 138 C148 141 154 141 156 138 L154 111 Z" fill="#FFF2A8"/>
          </svg>
        </div>
      </div>

      <!-- Badge 2: Open Laptop (Sunny Warm Coral / Amber Orange) -->
      <div class="w-40 h-40 sm:w-48 sm:h-48 md:w-56 md:h-56 relative group">
        <!-- Soft 3D tactile ledge -->
        <div class="absolute inset-0 rounded-[36px] bg-[#B83E1B] translate-y-3 md:translate-y-4"></div>
        <!-- Glossy badge container with inline vector SVG -->
        <div class="relative w-full h-full rounded-[36px] bg-[#F2553B] border-4 border-[#FF755E] p-4 sm:p-5 flex items-center justify-center overflow-hidden shadow-lg transition-transform duration-150 active:translate-y-2">
          <!-- Glass glossy highlight overlay -->
          <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/25 to-transparent rounded-t-[32px] pointer-events-none"></div>

          <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="laptopLid" x1="100" y1="42" x2="100" y2="124" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#DFE7EC"/>
              </linearGradient>
              <linearGradient id="laptopScreen" x1="100" y1="52" x2="100" y2="116" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#192A36"/>
                <stop offset="100%" stop-color="#0E1922"/>
              </linearGradient>
              <linearGradient id="laptopGlow" x1="60" y1="60" x2="140" y2="110" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2FD5C8"/>
                <stop offset="100%" stop-color="#0F998F"/>
              </linearGradient>
            </defs>
            <!-- Laptop Display Lid Shadow/Backing -->
            <rect x="42" y="40" width="116" height="82" rx="10" fill="#9BAAB5"/>
            <!-- Laptop Display Lid Front Frame -->
            <rect x="44" y="42" width="112" height="78" rx="8" fill="url(#laptopLid)"/>
            <!-- Dark Display Glass -->
            <rect x="52" y="50" width="96" height="62" rx="5" fill="url(#laptopScreen)"/>
            <!-- Screen Interface Graphic (Code / App Window / Joyful Spark) -->
            <rect x="60" y="58" width="80" height="46" rx="4" fill="url(#laptopGlow)" fill-opacity="0.25"/>
            <!-- Cute friendly code editor lines -->
            <rect x="66" y="66" width="34" height="5" rx="2.5" fill="#2FD5C8"/>
            <rect x="66" y="76" width="52" height="5" rx="2.5" fill="#FFC83B"/>
            <rect x="66" y="86" width="40" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.85"/>
            <circle cx="126" cy="74" r="7" fill="#FFC83B"/>

            <!-- Laptop Base / Keyboard Deck Bottom Bevel -->
            <path d="M22 136 L178 136 L164 148 L36 148 Z" fill="#8898A4"/>
            <!-- Laptop Base Top Plate -->
            <path d="M24 132 L176 132 L166 144 L34 144 Z" fill="#FFFFFF"/>
            <!-- Trackpad Indentation -->
            <rect x="86" y="135" width="28" height="6" rx="2" fill="#D3DEE5"/>
            <!-- Hinge Pivot -->
            <rect x="80" y="123" width="40" height="6" rx="2" fill="#8898A4"/>
          </svg>
        </div>
      </div>

      <!-- Badge 3: Green Leaf on a Small Globe (Emerald Eco / Vibrant Forest) -->
      <div class="w-40 h-40 sm:w-48 sm:h-48 md:w-56 md:h-56 relative group">
        <!-- Soft 3D tactile ledge -->
        <div class="absolute inset-0 rounded-[36px] bg-[#166534] translate-y-3 md:translate-y-4"></div>
        <!-- Glossy badge container with inline vector SVG -->
        <div class="relative w-full h-full rounded-[36px] bg-[#22C55E] border-4 border-[#4ADE80] p-4 sm:p-5 flex items-center justify-center overflow-hidden shadow-lg transition-transform duration-150 active:translate-y-2">
          <!-- Glass glossy highlight overlay -->
          <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/25 to-transparent rounded-t-[32px] pointer-events-none"></div>

          <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="globeOcean" x1="100" y1="80" x2="100" y2="160" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38BDF8"/>
                <stop offset="100%" stop-color="#0284C7"/>
              </linearGradient>
              <linearGradient id="leafGrad" x1="85" y1="28" x2="135" y2="92" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#86EFAC"/>
                <stop offset="50%" stop-color="#22C55E"/>
                <stop offset="100%" stop-color="#15803D"/>
              </linearGradient>
            </defs>
            <!-- Globe Sphere Shadow Under-rim -->
            <circle cx="100" cy="120" r="42" fill="#0369A1"/>
            <!-- Globe Ocean Body -->
            <circle cx="100" cy="118" r="40" fill="url(#globeOcean)"/>
            
            <!-- Continents on Globe -->
            <path d="M78 102 C82 96 95 98 98 106 C100 114 90 120 84 122 C78 124 74 116 78 102 Z" fill="#86EFAC"/>
            <path d="M106 122 C112 116 128 118 132 126 C134 134 124 144 114 142 C106 140 102 128 106 122 Z" fill="#86EFAC"/>
            <path d="M92 136 C95 132 104 134 105 140 C105 146 96 150 92 146 Z" fill="#86EFAC"/>

            <!-- Atmosphere Rim Sheen -->
            <path d="M64 112 A 40 40 0 0 1 136 112 A 40 37 0 0 0 64 112 Z" fill="white" fill-opacity="0.25"/>

            <!-- Sprouting Stalk / Stem -->
            <path d="M100 114 Q98 84 108 72" stroke="#14532D" stroke-width="8" stroke-linecap="round"/>
            <path d="M100 114 Q98 84 108 72" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/>

            <!-- Main Glossy Green Leaf (Curved bold shape) -->
            <!-- Leaf outline depth -->
            <path d="M108 72 C108 36 152 28 152 28 C152 28 156 68 122 84 C112 88 108 78 108 72 Z" fill="#14532D"/>
            <path d="M107 70 C107 36 148 30 148 30 C148 30 152 68 120 82 C110 86 107 76 107 70 Z" fill="url(#leafGrad)"/>
            <!-- Leaf Spine / Vein -->
            <path d="M109 72 Q126 56 144 34" stroke="#BBF7D0" stroke-width="3" stroke-linecap="round"/>
            <path d="M122 58 Q132 64 138 66" stroke="#BBF7D0" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Leaf Gloss Highlight -->
            <path d="M112 60 C116 46 136 36 142 34 C138 48 126 62 118 66 Z" fill="white" fill-opacity="0.35"/>
          </svg>
        </div>
      </div>

      <!-- Badge 4: Briefcase (Rich Indigo / Slate Navy) -->
      <div class="w-40 h-40 sm:w-48 sm:h-48 md:w-56 md:h-56 relative group">
        <!-- Soft 3D tactile ledge -->
        <div class="absolute inset-0 rounded-[36px] bg-[#312E81] translate-y-3 md:translate-y-4"></div>
        <!-- Glossy badge container with inline vector SVG -->
        <div class="relative w-full h-full rounded-[36px] bg-[#4F46E5] border-4 border-[#6366F1] p-4 sm:p-5 flex items-center justify-center overflow-hidden shadow-lg transition-transform duration-150 active:translate-y-2">
          <!-- Glass glossy highlight overlay -->
          <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/25 to-transparent rounded-t-[32px] pointer-events-none"></div>

          <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="briefcaseBody" x1="100" y1="72" x2="100" y2="152" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#E28743"/>
                <stop offset="100%" stop-color="#A54F16"/>
              </linearGradient>
              <linearGradient id="briefcaseFlap" x1="100" y1="72" x2="100" y2="115" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#F7A25C"/>
                <stop offset="100%" stop-color="#C8631C"/>
              </linearGradient>
              <linearGradient id="goldBrass" x1="100" y1="95" x2="100" y2="120" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFE885"/>
                <stop offset="100%" stop-color="#D97706"/>
              </linearGradient>
            </defs>
            <!-- Handle Top Arch Depth -->
            <path d="M74 64 C74 44 126 44 126 64 L126 74 L74 74 Z" fill="#682E06"/>
            <!-- Handle Inner Cutout -->
            <path d="M84 64 C84 53 116 53 116 64 L116 74 L84 74 Z" fill="#4F46E5"/>
            <!-- Handle Grip Surface -->
            <path d="M78 64 C78 48 122 48 122 64 L122 72 L112 72 L112 64 C112 56 88 56 88 64 L88 72 L78 72 Z" fill="#F7A25C"/>
            <!-- Handle Gold Mount Rivets -->
            <rect x="74" y="68" width="12" height="7" rx="2" fill="url(#goldBrass)"/>
            <rect x="114" y="68" width="12" height="7" rx="2" fill="url(#goldBrass)"/>

            <!-- Main Briefcase Bag Body (Tough leather trunk) -->
            <!-- Bevel bottom depth -->
            <rect x="28" y="74" width="144" height="84" rx="16" fill="#582405"/>
            <!-- Front Surface -->
            <rect x="30" y="72" width="140" height="82" rx="14" fill="url(#briefcaseBody)"/>
            
            <!-- Reinforced Leather Corner Caps -->
            <path d="M30 134 C30 146 42 154 54 154 L54 134 Z" fill="#6C2E08"/>
            <path d="M170 134 C170 146 158 154 146 154 L146 134 Z" fill="#6C2E08"/>

            <!-- Top Flap Lid (Angled cut envelope) -->
            <path d="M30 74 L170 74 L170 102 L114 116 C105 118 95 118 86 116 L30 102 Z" fill="#6E2E08"/>
            <path d="M30 72 L170 72 L170 100 L112 113 C104 115 96 115 88 113 L30 100 Z" fill="url(#briefcaseFlap)"/>
            <!-- Subtle White Stitching Lines -->
            <path d="M36 76 L164 76" stroke="#FFE7D1" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>

            <!-- Center Brass Clasp Lock -->
            <rect x="91" y="103" width="18" height="22" rx="4" fill="#6E3B0A"/>
            <rect x="92" y="102" width="16" height="20" rx="3" fill="url(#goldBrass)"/>
            <!-- Keyhole -->
            <circle cx="100" cy="110" r="2.5" fill="#451A03"/>
            <rect x="99" y="110" width="2" height="5" fill="#451A03"/>
          </svg>
        </div>
      </div>

      <!-- Badge 5: Paper Plane over a Cloud (Sky Cyan / Azure Breeze) -->
      <div class="w-40 h-40 sm:w-48 sm:h-48 md:w-56 md:h-56 relative group">
        <!-- Soft 3D tactile ledge -->
        <div class="absolute inset-0 rounded-[36px] bg-[#0284C7] translate-y-3 md:translate-y-4"></div>
        <!-- Glossy badge container with inline vector SVG -->
        <div class="relative w-full h-full rounded-[36px] bg-[#0EA5E9] border-4 border-[#38BDF8] p-4 sm:p-5 flex items-center justify-center overflow-hidden shadow-lg transition-transform duration-150 active:translate-y-2">
          <!-- Glass glossy highlight overlay -->
          <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/25 to-transparent rounded-t-[32px] pointer-events-none"></div>

          <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="cloudGrad" x1="100" y1="110" x2="100" y2="162" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#D7E8F3"/>
              </linearGradient>
              <linearGradient id="planeWingLeft" x1="50" y1="50" x2="150" y2="110" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#E2EEF5"/>
              </linearGradient>
            </defs>

            <!-- Fluffy Puffy Cloud Bottom Shadow -->
            <path d="M42 144 C34 144 26 137 26 128 C26 120 32 113 40 112 C42 98 54 88 68 88 C74 88 80 91 84 95 C90 87 101 82 113 82 C128 82 140 90 145 102 C150 99 157 98 163 98 C174 98 184 107 184 118 C184 119 184 120 183 122 C189 126 193 133 193 140 C193 150 184 158 173 158 L42 158 C34 158 26 151 26 144 Z" fill="#0369A1" fill-opacity="0.4"/>
            <!-- Fluffy Cloud Body -->
            <path d="M42 140 C34 140 28 134 28 126 C28 118 34 112 42 111 C44 98 56 88 70 88 C76 88 82 91 86 95 C92 87 103 82 115 82 C130 82 142 90 147 102 C152 99 159 98 165 98 C176 98 184 107 184 118 C184 119 184 120 183 121 C189 125 192 131 192 138 C192 148 184 155 174 155 L42 155 Z" fill="url(#cloudGrad)"/>
            <!-- Cloud Top Highlights -->
            <circle cx="70" cy="100" r="16" fill="white"/>
            <circle cx="115" cy="96" r="22" fill="white"/>
            <circle cx="165" cy="110" r="14" fill="white"/>

            <!-- Wind Trail Dots Behind Plane -->
            <circle cx="50" cy="106" r="3.5" fill="white" fill-opacity="0.7"/>
            <circle cx="64" cy="98" r="4.5" fill="white" fill-opacity="0.85"/>
            <circle cx="80" cy="88" r="5" fill="white"/>

            <!-- Paper Plane (Sleek aerodynamic origami) -->
            <!-- Plane Under-fold dark shadow -->
            <path d="M165 35 L70 95 L112 110 Z" fill="#9FB5C4"/>
            <!-- Plane Center Fold Spine -->
            <path d="M165 35 L112 110 L104 135 L96 102 Z" fill="#7D98AB"/>
            <!-- Plane Right Main Wing (Broad bright face) -->
            <path d="M165 35 L70 95 L135 78 Z" fill="url(#planeWingLeft)"/>
            <!-- Plane Left Upper Wing (Top illuminated facet) -->
            <path d="M165 35 L135 78 L112 110 Z" fill="#F4F8FA"/>
            <!-- Gloss gleam on plane tip -->
            <path d="M165 35 L145 52 L150 42 Z" fill="white"/>
          </svg>
        </div>
      </div>

      <!-- Badge 6: Heart with a Pulse Line (Vibrant Ruby Coral / Rose Berry) -->
      <div class="w-40 h-40 sm:w-48 sm:h-48 md:w-56 md:h-56 relative group">
        <!-- Soft 3D tactile ledge -->
        <div class="absolute inset-0 rounded-[36px] bg-[#9F1239] translate-y-3 md:translate-y-4"></div>
        <!-- Glossy badge container with inline vector SVG -->
        <div class="relative w-full h-full rounded-[36px] bg-[#E11D48] border-4 border-[#F43F5E] p-4 sm:p-5 flex items-center justify-center overflow-hidden shadow-lg transition-transform duration-150 active:translate-y-2">
          <!-- Glass glossy highlight overlay -->
          <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/25 to-transparent rounded-t-[32px] pointer-events-none"></div>

          <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="heartRed" x1="100" y1="35" x2="100" y2="165" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FF3366"/>
                <stop offset="100%" stop-color="#BD0838"/>
              </linearGradient>
              <filter id="pulseGlow" x="0" y="0" width="200" height="200" filterUnits="userSpaceOnUse">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>

            <!-- Heart Under Shadow -->
            <path d="M100 166 C100 166 28 122 28 75 C28 48 49 32 74 32 C89 32 98 40 100 45 C102 40 111 32 126 32 C151 32 172 48 172 75 C172 122 100 166 100 166 Z" fill="#710724"/>
            
            <!-- Main Heart Body -->
            <path d="M100 162 C100 162 30 118 30 73 C30 48 50 34 74 34 C88 34 97 42 100 47 C103 42 112 34 126 34 C150 34 170 48 170 73 C170 118 100 162 100 162 Z" fill="url(#heartRed)"/>

            <!-- Heart Upper Lobe Gloss Sheen Highlights -->
            <path d="M44 65 C44 48 58 40 73 40 C79 40 86 42 90 46 C80 44 60 48 52 64 C48 72 46 84 46 84 C44 76 44 70 44 65 Z" fill="white" fill-opacity="0.45"/>
            <path d="M156 65 C156 48 142 40 127 40 C121 40 114 42 110 46 C120 44 140 48 148 64 C152 72 154 84 154 84 C156 76 156 70 156 65 Z" fill="white" fill-opacity="0.3"/>

            <!-- Pulse / EKG Line Shadow/Backing -->
            <path d="M22 98 L64 98 L75 80 L88 126 L104 64 L118 116 L128 92 L138 98 L178 98" stroke="#4C0516" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Bright White / Golden Pulse Rhythm Line -->
            <path d="M22 96 L64 96 L75 78 L88 124 L104 62 L118 114 L128 90 L138 96 L178 96" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Glowing Yellow Signal Nodes -->
            <circle cx="104" cy="62" r="5" fill="#FFDD55"/>
            <circle cx="88" cy="124" r="4" fill="#FFDD55"/>
          </svg>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
