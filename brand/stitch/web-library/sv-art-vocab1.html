<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Kit — Illustrated Badges Sheet (Bright Day)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface-page': '#FFF8F4',
            'ink-deep': '#1C1003',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFF8F4;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .badge-card {
      filter: drop-shadow(0 10px 0 #E6D8CA) drop-shadow(0 18px 24px rgba(28, 16, 3, 0.08));
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .badge-card:hover {
      transform: translateY(-4px);
      filter: drop-shadow(0 14px 0 #E6D8CA) drop-shadow(0 24px 28px rgba(28, 16, 3, 0.12));
    }
    .badge-card:active {
      transform: translateY(6px);
      filter: drop-shadow(0 4px 0 #E6D8CA) drop-shadow(0 8px 12px rgba(28, 16, 3, 0.08));
    }
  </style>
</head>
<body class="min-h-screen bg-surface-page flex items-center justify-center p-6 sm:p-12 md:p-16">

  <!-- Container for the 6 Illustrated Badges Sheet -->
  <main class="w-full max-w-5xl mx-auto flex items-center justify-center py-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 sm:gap-10 md:gap-12 w-full justify-items-center">

      <!-- BADGE 1: Open book with a bookmark (Teal Medallion) -->
      <div class="badge-card w-full max-w-[280px] aspect-square rounded-[36px] cursor-pointer">
        <svg viewBox="0 0 280 280" width="100%" height="100%" class="w-full h-full block rounded-[36px]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Badge 1 Gradients & Shadows -->
            <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#14B8A6"/>
              <stop offset="60%" stop-color="#0F766E"/>
              <stop offset="100%" stop-color="#115E59"/>
            </linearGradient>
            <linearGradient id="gloss1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
              <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.1"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#042F2E"/>
              <stop offset="100%" stop-color="#0F3D3E"/>
            </linearGradient>
            <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#EDE4D8"/>
              <stop offset="100%" stop-color="#FFFFFF"/>
            </linearGradient>
            <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#EDE4D8"/>
            </linearGradient>
            <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF7A29"/>
              <stop offset="100%" stop-color="#E11D48"/>
            </linearGradient>
            <filter id="objShadow" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#042F2E" flood-opacity="0.35"/>
            </filter>
          </defs>

          <!-- Outer tactile body -->
          <rect width="280" height="280" rx="36" fill="#0D5F59"/>
          <!-- Inner face with bevel edge -->
          <rect x="4" y="4" width="272" height="264" rx="32" fill="url(#bg1)"/>
          
          <!-- Inner ambient border -->
          <rect x="10" y="10" width="260" height="252" rx="28" fill="none" stroke="#5EEAD4" stroke-width="2.5" stroke-opacity="0.4"/>

          <!-- Glossy top specular reflection -->
          <path d="M 12 36 C 12 22 22 12 36 12 L 244 12 C 258 12 268 22 268 36 L 268 110 C 200 135 80 120 12 80 Z" fill="url(#gloss1)" rx="32"/>

          <!-- OBJECT: Open Book with Ribbon Bookmark -->
          <g filter="url(#objShadow)">
            <!-- Outer Book Hardcover Ledge -->
            <path d="M 46 172 Q 140 196 234 172 L 234 186 Q 140 210 46 186 Z" fill="#042F2E"/>
            <path d="M 44 116 Q 140 140 236 116 L 236 174 Q 140 198 44 174 Z" fill="url(#bookCover)"/>
            
            <!-- Book Spine Base / Center Fold -->
            <path d="M 136 130 Q 140 128 144 130 L 144 198 Q 140 196 136 198 Z" fill="#D8C6B0"/>

            <!-- Left Page Block -->
            <path d="M 52 118 Q 96 112 136 130 L 136 188 Q 96 170 52 176 Z" fill="url(#pageLeft)"/>
            <!-- Right Page Block -->
            <path d="M 144 130 Q 184 112 228 118 L 228 176 Q 184 170 144 188 Z" fill="url(#pageRight)"/>

            <!-- Faint embossed line art on pages -->
            <line x1="68" y1="136" x2="122" y2="142" stroke="#D1C3B2" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="68" y1="148" x2="122" y2="154" stroke="#D1C3B2" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="68" y1="160" x2="108" y2="165" stroke="#D1C3B2" stroke-width="3.5" stroke-linecap="round"/>

            <line x1="158" y1="142" x2="212" y2="136" stroke="#D1C3B2" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="158" y1="154" x2="212" y2="148" stroke="#D1C3B2" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="158" y1="165" x2="198" y2="160" stroke="#D1C3B2" stroke-width="3.5" stroke-linecap="round"/>

            <!-- Red/Orange Ribbon Bookmark hanging out bottom -->
            <path d="M 134 124 Q 140 122 146 124 L 149 216 L 140 206 L 131 216 Z" fill="url(#ribbon)"/>
            <path d="M 131 125 L 140 206 L 140 123 Z" fill="#B91C1C" opacity="0.3"/>
          </g>

          <!-- Candy highlight twinkle -->
          <circle cx="218" cy="62" r="5" fill="#FFFFFF" fill-opacity="0.8"/>
          <circle cx="228" cy="74" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
        </svg>
      </div>

      <!-- BADGE 2: Pen nib with a small ink drop (Amber / Coral Medallion) -->
      <div class="badge-card w-full max-w-[280px] aspect-square rounded-[36px] cursor-pointer">
        <svg viewBox="0 0 280 280" width="100%" height="100%" class="w-full h-full block rounded-[36px]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FB923C"/>
              <stop offset="55%" stop-color="#EA580C"/>
              <stop offset="100%" stop-color="#C2410C"/>
            </linearGradient>
            <linearGradient id="nibMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="30%" stop-color="#FFFBEB"/>
              <stop offset="70%" stop-color="#FDE68A"/>
              <stop offset="100%" stop-color="#D97706"/>
            </linearGradient>
            <linearGradient id="nibShaft" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1E293B"/>
              <stop offset="100%" stop-color="#0F172A"/>
            </linearGradient>
            <linearGradient id="inkDrop" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="50%" stop-color="#0284C7"/>
              <stop offset="100%" stop-color="#0369A1"/>
            </linearGradient>
            <filter id="objShadow2" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#7C2D12" flood-opacity="0.4"/>
            </filter>
          </defs>

          <!-- Outer tactile body -->
          <rect width="280" height="280" rx="36" fill="#9A3412"/>
          <!-- Inner face -->
          <rect x="4" y="4" width="272" height="264" rx="32" fill="url(#bg2)"/>
          
          <!-- Inner ambient border -->
          <rect x="10" y="10" width="260" height="252" rx="28" fill="none" stroke="#FED7AA" stroke-width="2.5" stroke-opacity="0.4"/>

          <!-- Glossy top specular reflection -->
          <path d="M 12 36 C 12 22 22 12 36 12 L 244 12 C 258 12 268 22 268 36 L 268 110 C 200 135 80 120 12 80 Z" fill="url(#gloss1)" rx="32"/>

          <!-- OBJECT: Vintage Calligraphy Pen Nib & Glossy Ink Drop -->
          <g filter="url(#objShadow2)">
            <!-- Upper pen shaft -->
            <path d="M 112 56 L 168 56 L 176 96 L 104 96 Z" fill="url(#nibShaft)"/>
            <rect x="102" y="94" width="76" height="8" rx="3" fill="#D97706"/>

            <!-- Nib Golden Body -->
            <path d="M 104 102 C 104 136 122 168 138 206 C 140 210 140 210 142 206 C 158 168 176 136 176 102 Z" fill="url(#nibMetallic)"/>
            
            <!-- Nib Center Split & Breather Hole -->
            <circle cx="140" cy="144" r="7" fill="#9A3412"/>
            <line x1="140" y1="151" x2="140" y2="206" stroke="#9A3412" stroke-width="3" stroke-linecap="round"/>

            <!-- Glossy facet highlight on left side of nib -->
            <path d="M 112 104 C 112 128 126 156 138 196 L 140 196 C 130 156 120 128 120 104 Z" fill="#FFFFFF" opacity="0.6"/>

            <!-- Small vibrant cyan/blue ink drop falling below tip -->
            <path d="M 140 220 C 140 220 148 232 148 238 C 148 243 144.5 246 140 246 C 135.5 246 132 243 132 238 C 132 232 140 220 140 220 Z" fill="url(#inkDrop)"/>
            <circle cx="137" cy="236" r="2" fill="#FFFFFF" opacity="0.8"/>
          </g>

          <circle cx="218" cy="62" r="5" fill="#FFFFFF" fill-opacity="0.8"/>
          <circle cx="228" cy="74" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
        </svg>
      </div>

      <!-- BADGE 3: Studio microphone (Indigo / Purple Medallion) -->
      <div class="badge-card w-full max-w-[280px] aspect-square rounded-[36px] cursor-pointer">
        <svg viewBox="0 0 280 280" width="100%" height="100%" class="w-full h-full block rounded-[36px]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#818CF8"/>
              <stop offset="55%" stop-color="#6366F1"/>
              <stop offset="100%" stop-color="#4F46E5"/>
            </linearGradient>
            <linearGradient id="micSilver" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#F8FAFC"/>
              <stop offset="40%" stop-color="#E2E8F0"/>
              <stop offset="70%" stop-color="#CBD5E1"/>
              <stop offset="100%" stop-color="#94A3B8"/>
            </linearGradient>
            <linearGradient id="micDark" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#334155"/>
              <stop offset="100%" stop-color="#0F172A"/>
            </linearGradient>
            <linearGradient id="micAccent" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F43F5E"/>
              <stop offset="100%" stop-color="#E11D48"/>
            </linearGradient>
            <filter id="objShadow3" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#312E81" flood-opacity="0.45"/>
            </filter>
          </defs>

          <!-- Outer tactile body -->
          <rect width="280" height="280" rx="36" fill="#3730A3"/>
          <!-- Inner face -->
          <rect x="4" y="4" width="272" height="264" rx="32" fill="url(#bg3)"/>
          
          <!-- Inner ambient border -->
          <rect x="10" y="10" width="260" height="252" rx="28" fill="none" stroke="#C7D2FE" stroke-width="2.5" stroke-opacity="0.4"/>

          <!-- Glossy reflection -->
          <path d="M 12 36 C 12 22 22 12 36 12 L 244 12 C 258 12 268 22 268 36 L 268 110 C 200 135 80 120 12 80 Z" fill="url(#gloss1)" rx="32"/>

          <!-- OBJECT: Vintage Studio Ribbon / Capsule Microphone -->
          <g filter="url(#objShadow3)">
            <!-- Mic Stand Base -->
            <ellipse cx="140" cy="226" rx="42" ry="12" fill="url(#micDark)"/>
            <ellipse cx="140" cy="222" rx="36" ry="9" fill="url(#micSilver)"/>
            <!-- Mic Stem / Rod -->
            <rect x="134" y="176" width="12" height="48" rx="4" fill="url(#micSilver)"/>

            <!-- U-shaped Suspension Cradle / Mount -->
            <path d="M 94 136 C 94 176 186 176 186 136" fill="none" stroke="url(#micSilver)" stroke-width="12" stroke-linecap="round"/>
            <circle cx="94" cy="136" r="8" fill="#475569"/>
            <circle cx="186" cy="136" r="8" fill="#475569"/>

            <!-- Main Capsule Body -->
            <rect x="114" y="70" width="52" height="88" rx="26" fill="url(#micSilver)"/>
            <!-- Red 'On-Air' / Sound Band Ring -->
            <rect x="114" y="112" width="52" height="8" fill="url(#micAccent)"/>

            <!-- Grille slots (horizontal bands) -->
            <rect x="122" y="82" width="36" height="4" rx="2" fill="#475569"/>
            <rect x="120" y="90" width="40" height="4" rx="2" fill="#475569"/>
            <rect x="120" y="98" width="40" height="4" rx="2" fill="#475569"/>
            <rect x="122" y="106" width="36" height="4" rx="2" fill="#475569"/>

            <rect x="124" y="126" width="32" height="4" rx="2" fill="#475569"/>
            <rect x="124" y="134" width="32" height="4" rx="2" fill="#475569"/>
            <rect x="126" y="142" width="28" height="4" rx="2" fill="#475569"/>

            <!-- Capsule Gloss Streak -->
            <path d="M 120 78 C 120 74 124 72 128 72 L 132 72 L 132 152 L 126 148 C 122 144 120 138 120 132 Z" fill="#FFFFFF" opacity="0.45"/>
          </g>

          <circle cx="218" cy="62" r="5" fill="#FFFFFF" fill-opacity="0.8"/>
          <circle cx="228" cy="74" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
        </svg>
      </div>

      <!-- BADGE 4: Stack of three books with a graduation cap on top (Emerald / Forest Medallion) -->
      <div class="badge-card w-full max-w-[280px] aspect-square rounded-[36px] cursor-pointer">
        <svg viewBox="0 0 280 280" width="100%" height="100%" class="w-full h-full block rounded-[36px]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#10B981"/>
              <stop offset="55%" stop-color="#059669"/>
              <stop offset="100%" stop-color="#047857"/>
            </linearGradient>
            <linearGradient id="bookBottom" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#F59E0B"/>
              <stop offset="100%" stop-color="#D97706"/>
            </linearGradient>
            <linearGradient id="bookMiddle" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0284C7"/>
              <stop offset="100%" stop-color="#0369A1"/>
            </linearGradient>
            <linearGradient id="bookTop" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#E11D48"/>
              <stop offset="100%" stop-color="#BE123C"/>
            </linearGradient>
            <linearGradient id="gradCap" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#334155"/>
              <stop offset="100%" stop-color="#0F172A"/>
            </linearGradient>
            <linearGradient id="tasselGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FCD34D"/>
              <stop offset="100%" stop-color="#F59E0B"/>
            </linearGradient>
            <filter id="objShadow4" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#064E3B" flood-opacity="0.45"/>
            </filter>
          </defs>

          <!-- Outer tactile body -->
          <rect width="280" height="280" rx="36" fill="#065F46"/>
          <!-- Inner face -->
          <rect x="4" y="4" width="272" height="264" rx="32" fill="url(#bg4)"/>
          
          <!-- Inner ambient border -->
          <rect x="10" y="10" width="260" height="252" rx="28" fill="none" stroke="#A7F3D0" stroke-width="2.5" stroke-opacity="0.4"/>

          <!-- Glossy reflection -->
          <path d="M 12 36 C 12 22 22 12 36 12 L 244 12 C 258 12 268 22 268 36 L 268 110 C 200 135 80 120 12 80 Z" fill="url(#gloss1)" rx="32"/>

          <!-- OBJECT: Stack of 3 Books + Mortarboard Graduation Cap -->
          <g filter="url(#objShadow4)">
            <!-- Book 1 (Bottom - Amber Gold) -->
            <rect x="52" y="194" width="176" height="28" rx="6" fill="url(#bookBottom)"/>
            <rect x="66" y="198" width="158" height="20" rx="3" fill="#FFFBEB"/>
            <line x1="74" y1="208" x2="216" y2="208" stroke="#E5D5BA" stroke-width="2.5"/>

            <!-- Book 2 (Middle - Ocean Blue) -->
            <rect x="60" y="162" width="160" height="28" rx="6" fill="url(#bookMiddle)"/>
            <rect x="74" y="166" width="142" height="20" rx="3" fill="#F8FAFC"/>
            <line x1="82" y1="176" x2="208" y2="176" stroke="#CBD5E1" stroke-width="2.5"/>

            <!-- Book 3 (Top - Crimson Red) -->
            <rect x="68" y="130" width="144" height="28" rx="6" fill="url(#bookTop)"/>
            <rect x="80" y="134" width="128" height="20" rx="3" fill="#FFF1F2"/>
            <line x1="88" y1="144" x2="200" y2="144" stroke="#FECDD3" stroke-width="2.5"/>

            <!-- Graduation Cap (Skullcap base) -->
            <path d="M 112 112 C 112 122 168 122 168 112 Z" fill="#1E293B"/>

            <!-- Mortarboard Diamond Top -->
            <polygon points="140,72 216,98 140,124 64,98" fill="url(#gradCap)"/>
            <!-- Ledge on cap top -->
            <polygon points="140,72 216,98 140,102 64,98" fill="#475569" opacity="0.35"/>

            <!-- Center Cap Button -->
            <ellipse cx="140" cy="98" rx="6" ry="3.5" fill="url(#tasselGold)"/>

            <!-- Gold Hanging Tassel -->
            <path d="M 140 98 Q 186 104 196 128" fill="none" stroke="url(#tasselGold)" stroke-width="4.5" stroke-linecap="round"/>
            <polygon points="192,126 200,126 203,148 189,148" fill="url(#tasselGold)"/>
          </g>

          <circle cx="218" cy="62" r="5" fill="#FFFFFF" fill-opacity="0.8"/>
          <circle cx="228" cy="74" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
        </svg>
      </div>

      <!-- BADGE 5: Three toy building cubes (Rose / Pink Medallion) -->
      <div class="badge-card w-full max-w-[280px] aspect-square rounded-[36px] cursor-pointer">
        <svg viewBox="0 0 280 280" width="100%" height="100%" class="w-full h-full block rounded-[36px]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FB7185"/>
              <stop offset="55%" stop-color="#F43F5E"/>
              <stop offset="100%" stop-color="#E11D48"/>
            </linearGradient>
            <!-- Cube 1 Top Cube (Bright Yellow) -->
            <linearGradient id="cubeTopTop" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FEF08A"/>
              <stop offset="100%" stop-color="#FDE047"/>
            </linearGradient>
            <linearGradient id="cubeTopLeft" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FACC15"/>
              <stop offset="100%" stop-color="#EAB308"/>
            </linearGradient>
            <linearGradient id="cubeTopRight" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#CA8A04"/>
              <stop offset="100%" stop-color="#A16207"/>
            </linearGradient>

            <!-- Cube 2 Left Bottom (Cyan / Sky) -->
            <linearGradient id="cubeLeftTop" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#BAE6FD"/>
              <stop offset="100%" stop-color="#7DD3FC"/>
            </linearGradient>
            <linearGradient id="cubeLeftLeft" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="100%" stop-color="#0284C7"/>
            </linearGradient>
            <linearGradient id="cubeLeftRight" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#0369A1"/>
              <stop offset="100%" stop-color="#075985"/>
            </linearGradient>

            <!-- Cube 3 Right Bottom (Vibrant Coral/Orange) -->
            <linearGradient id="cubeRightTop" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FED7AA"/>
              <stop offset="100%" stop-color="#FDBA74"/>
            </linearGradient>
            <linearGradient id="cubeRightLeft" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FB923C"/>
              <stop offset="100%" stop-color="#EA580C"/>
            </linearGradient>
            <linearGradient id="cubeRightRight" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#C2410C"/>
              <stop offset="100%" stop-color="#9A3412"/>
            </linearGradient>

            <filter id="objShadow5" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#881337" flood-opacity="0.45"/>
            </filter>
          </defs>

          <!-- Outer tactile body -->
          <rect width="280" height="280" rx="36" fill="#9F1239"/>
          <!-- Inner face -->
          <rect x="4" y="4" width="272" height="264" rx="32" fill="url(#bg5)"/>
          
          <!-- Inner ambient border -->
          <rect x="10" y="10" width="260" height="252" rx="28" fill="none" stroke="#FECDD3" stroke-width="2.5" stroke-opacity="0.4"/>

          <!-- Glossy reflection -->
          <path d="M 12 36 C 12 22 22 12 36 12 L 244 12 C 258 12 268 22 268 36 L 268 110 C 200 135 80 120 12 80 Z" fill="url(#gloss1)" rx="32"/>

          <!-- OBJECT: Three Stacked Toy Building Cubes (Pyramid Formation) -->
          <g filter="url(#objShadow5)">

            <!-- CUBE 2: Bottom-Left Blue Cube -->
            <g transform="translate(48, 142)">
              <!-- Top Face -->
              <polygon points="46,0 92,20 46,40 0,20" fill="url(#cubeLeftTop)"/>
              <!-- Left Face -->
              <polygon points="0,20 46,40 46,92 0,72" fill="url(#cubeLeftLeft)"/>
              <!-- Right Face -->
              <polygon points="46,40 92,20 92,72 46,92" fill="url(#cubeLeftRight)"/>
              <!-- Tactile beveled highlight -->
              <polyline points="0,20 46,40 92,20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>
            </g>

            <!-- CUBE 3: Bottom-Right Orange Cube -->
            <g transform="translate(138, 142)">
              <!-- Top Face -->
              <polygon points="46,0 92,20 46,40 0,20" fill="url(#cubeRightTop)"/>
              <!-- Left Face -->
              <polygon points="0,20 46,40 46,92 0,72" fill="url(#cubeRightLeft)"/>
              <!-- Right Face -->
              <polygon points="46,40 92,20 92,72 46,92" fill="url(#cubeRightRight)"/>
              <polyline points="0,20 46,40 92,20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>
            </g>

            <!-- CUBE 1: Top Apex Yellow Cube -->
            <g transform="translate(93, 62)">
              <!-- Top Face -->
              <polygon points="47,0 94,20 47,40 0,20" fill="url(#cubeTopTop)"/>
              <!-- Left Face -->
              <polygon points="0,20 47,40 47,94 0,74" fill="url(#cubeTopLeft)"/>
              <!-- Right Face -->
              <polygon points="47,40 94,20 94,74 47,94" fill="url(#cubeTopRight)"/>
              <polyline points="0,20 47,40 94,20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>
            </g>
          </g>

          <circle cx="218" cy="62" r="5" fill="#FFFFFF" fill-opacity="0.8"/>
          <circle cx="228" cy="74" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
        </svg>
      </div>

      <!-- BADGE 6: ID Lanyard Badge (Sky / Blue Medallion) -->
      <div class="badge-card w-full max-w-[280px] aspect-square rounded-[36px] cursor-pointer">
        <svg viewBox="0 0 280 280" width="100%" height="100%" class="w-full h-full block rounded-[36px]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg6" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="55%" stop-color="#0284C7"/>
              <stop offset="100%" stop-color="#0369A1"/>
            </linearGradient>
            <linearGradient id="strapRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#F59E0B"/>
              <stop offset="50%" stop-color="#FF7A29"/>
              <stop offset="100%" stop-color="#F59E0B"/>
            </linearGradient>
            <linearGradient id="cardPlastic" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#F1F5F9"/>
            </linearGradient>
            <linearGradient id="avatarFill" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#14B8A6"/>
              <stop offset="100%" stop-color="#0F766E"/>
            </linearGradient>
            <linearGradient id="clipMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#F8FAFC"/>
              <stop offset="50%" stop-color="#CBD5E1"/>
              <stop offset="100%" stop-color="#94A3B8"/>
            </linearGradient>
            <filter id="objShadow6" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#082F49" flood-opacity="0.45"/>
            </filter>
          </defs>

          <!-- Outer tactile body -->
          <rect width="280" height="280" rx="36" fill="#075985"/>
          <!-- Inner face -->
          <rect x="4" y="4" width="272" height="264" rx="32" fill="url(#bg6)"/>
          
          <!-- Inner ambient border -->
          <rect x="10" y="10" width="260" height="252" rx="28" fill="none" stroke="#BAE6FD" stroke-width="2.5" stroke-opacity="0.4"/>

          <!-- Glossy reflection -->
          <path d="M 12 36 C 12 22 22 12 36 12 L 244 12 C 258 12 268 22 268 36 L 268 110 C 200 135 80 120 12 80 Z" fill="url(#gloss1)" rx="32"/>

          <!-- OBJECT: ID Card Badge with Lanyard Strap & Silver Clip -->
          <g filter="url(#objShadow6)">
            <!-- Lanyard fabric straps coming from top -->
            <path d="M 116 38 L 132 86 L 140 86 L 126 38 Z" fill="url(#strapRibbon)"/>
            <path d="M 164 38 L 148 86 L 140 86 L 154 38 Z" fill="url(#strapRibbon)"/>

            <!-- Silver Swivel Clip & Ring -->
            <ellipse cx="140" cy="88" rx="8" ry="4" fill="url(#clipMetallic)"/>
            <rect x="135" y="88" width="10" height="14" rx="3" fill="url(#clipMetallic)"/>
            <rect x="132" y="100" width="16" height="8" rx="2" fill="#64748B"/>

            <!-- Transparent Badge Holder Header Hole -->
            <rect x="74" y="104" width="132" height="142" rx="14" fill="#0284C7" opacity="0.35"/>
            <rect x="128" y="110" width="24" height="6" rx="3" fill="#0F172A" opacity="0.4"/>

            <!-- Main White Plastic ID Card -->
            <rect x="80" y="118" width="120" height="122" rx="10" fill="url(#cardPlastic)"/>
            
            <!-- Card Teal Top Brand Band -->
            <path d="M 80 124 C 80 120.7 82.7 118 86 118 L 194 118 C 197.3 118 200 120.7 200 124 L 200 134 L 80 134 Z" fill="#0F766E"/>

            <!-- Profile Silhouette / Avatar Photo on Badge -->
            <circle cx="140" cy="156" r="14" fill="url(#avatarFill)"/>
            <path d="M 122 186 C 122 174 130 172 140 172 C 150 172 158 174 158 186 Z" fill="url(#avatarFill)"/>

            <!-- Abstract ID barcode/signature blocks (pure shapes, no letters/words/numbers) -->
            <rect x="100" y="196" width="80" height="6" rx="3" fill="#94A3B8"/>
            <rect x="110" y="208" width="60" height="5" rx="2.5" fill="#CBD5E1"/>
            <rect x="122" y="218" width="36" height="5" rx="2.5" fill="#E2E8F0"/>

            <!-- Glossy sheen diagonal line across card -->
            <path d="M 82 120 L 140 120 L 90 236 L 82 236 Z" fill="#FFFFFF" opacity="0.25"/>
          </g>

          <circle cx="218" cy="62" r="5" fill="#FFFFFF" fill-opacity="0.8"/>
          <circle cx="228" cy="74" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
        </svg>
      </div>

    </div>
  </main>
