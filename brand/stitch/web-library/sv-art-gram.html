<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Kit - 6 Illustrated Badges (Bright Day)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            surface: {
              DEFAULT: '#f4fbf9',
              alt: '#eaf6f4',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f2faf8;
      background-image: 
        radial-gradient(#0d5c580a 1.5px, transparent 1.5px),
        radial-gradient(#f0654308 1.5px, #f2faf8 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .badge-card {
      position: relative;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .badge-card:hover {
      transform: translateY(-6px);
    }
    .badge-ledge {
      position: absolute;
      bottom: -16px;
      left: 12%;
      right: 12%;
      height: 18px;
      background: radial-gradient(ellipse at center, rgba(13, 92, 88, 0.16) 0%, rgba(13, 92, 88, 0.04) 65%, transparent 80%);
      border-radius: 9999px;
      pointer-events: none;
      z-index: 0;
      filter: blur(2px);
    }
  </style>
</head>
<body class="p-8 sm:p-12 md:p-16 flex items-center justify-center">

  <!-- Main Illustration Sheet: 6 Large Glossy Badges in a 3x2 Grid -->
  <main class="w-full max-w-5xl mx-auto flex items-center justify-center py-6">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-8 sm:gap-12 md:gap-14 w-full place-items-center">

      <!-- BADGE 1: Two chain links joined (Coral Flame / Connection) -->
      <div class="badge-card w-48 h-48 sm:w-56 sm:h-56 md:w-64 md:h-64 flex items-center justify-center">
        <div class="badge-ledge"></div>
        <svg class="w-full h-full relative z-10 drop-shadow-[0_12px_24px_rgba(234,88,12,0.18)]" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg-coral" x1="28" y1="20" x2="228" y2="236" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ff7a59"/>
              <stop offset="60%" stop-color="#f0542d"/>
              <stop offset="100%" stop-color="#d93812"/>

            <linearGradient id="bevel-coral" x1="128" y1="16" x2="128" y2="240" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
              <stop offset="25%" stop-color="#ffffff" stop-opacity="0"/>
              <stop offset="85%" stop-color="#7c1a04" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#541002" stop-opacity="0.6"/>
            </linearGradient>
            <linearGradient id="gold-link-1" x1="60" y1="60" x2="160" y2="160" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fff5cc"/>
              <stop offset="45%" stop-color="#fcd34d"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>
            <linearGradient id="gold-link-2" x1="100" y1="100" x2="200" y2="200" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="40%" stop-color="#fde047"/>
              <stop offset="100%" stop-color="#d97706"/>
            </linearGradient>
            <filter id="shadow-coral" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse">
              <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#8c1d04" flood-opacity="0.35"/>
            </filter>
          </defs>

          <!-- Squircle Base with Tactile Ledge Depth -->
          <rect x="18" y="24" width="220" height="212" rx="58" fill="#a42609"/>
          <rect x="18" y="16" width="220" height="212" rx="58" fill="url(#bg-coral)"/>
          <rect x="18" y="16" width="220" height="212" rx="58" fill="url(#bevel-coral)"/>

          <!-- Top Gloss Dome -->
          <path d="M26 68C26 44.804 44.804 26 68 26H188C211.196 26 230 44.804 230 68V98C230 98 178 126 128 126C78 126 26 98 26 98V68Z" fill="white" fill-opacity="0.22"/>

          <!-- Object: Two joined chain links -->
          <g filter="url(#shadow-coral)">
            <!-- Left upper link (underneath back part) -->
            <rect x="62" y="74" width="76" height="46" rx="23" transform="rotate(-45 62 74)" fill="#b45309" stroke="#b45309" stroke-width="6"/>

            <!-- Right lower link -->
            <rect x="114" y="126" width="76" height="46" rx="23" transform="rotate(-45 114 126)" fill="url(#gold-link-2)" stroke="#ffffff" stroke-width="4"/>
            <rect x="127" y="137" width="50" height="24" rx="12" transform="rotate(-45 127 137)" fill="#c2410c"/>

            <!-- Left upper link (front overlapping part) -->
            <rect x="62" y="74" width="76" height="46" rx="23" transform="rotate(-45 62 74)" fill="url(#gold-link-1)" stroke="#ffffff" stroke-width="4"/>
            <rect x="75" y="85" width="50" height="24" rx="12" transform="rotate(-45 75 85)" fill="#e64c24"/>

            <!-- Overlap weave interlock -->
            <path d="M125 117C129 113 134 110 139 108C143 112 147 117 150 122C145 125 140 128 135 131C132 126 128 121 125 117Z" fill="url(#gold-link-2)"/>

            <!-- Specular sparkles on chain -->
            <ellipse cx="98" cy="80" rx="9" ry="3.5" transform="rotate(-45 98 80)" fill="#ffffff" fill-opacity="0.9"/>
            <ellipse cx="158" cy="140" rx="9" ry="3.5" transform="rotate(-45 158 140)" fill="#ffffff" fill-opacity="0.9"/>
          </g>
        </svg>
      </div>

      <!-- BADGE 2: Paper scroll with a feather quill (Deep Teal / Grammar & Wisdom) -->
      <div class="badge-card w-48 h-48 sm:w-56 sm:h-56 md:w-64 md:h-64 flex items-center justify-center">
        <div class="badge-ledge"></div>
        <svg class="w-full h-full relative z-10 drop-shadow-[0_12px_24px_rgba(13,92,88,0.22)]" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">

            <!-- Top scroll curl -->

            <line x1="94" y1="124" x2="148" y2="124" stroke="#d97706" stroke-width="4.5" stroke-linecap="round"/>
            <line x1="94" y1="140" x2="130" y2="140" stroke="#d97706" stroke-width="4.5" stroke-linecap="round"/>

            <g transform="rotate(32 168 118)">

              <!-- Feather vane notches -->
              <path d="M168 62V168" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
              <path d="M168 90L156 102" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M168 114L158 124" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M168 96L180 106" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
              <!-- Quill nib point -->
              <polygon points="168,174 165,164 171,164" fill="#0f172a"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- BADGE 3: Open smiling lips with small tongue (Warm Amber-Honey / Speaking & Pronunciation) -->
      <div class="badge-card w-48 h-48 sm:w-56 sm:h-56 md:w-64 md:h-64 flex items-center justify-center">
        <div class="badge-ledge"></div>
        <svg class="w-full h-full relative z-10 drop-shadow-[0_12px_24px_rgba(217,119,6,0.2)]" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>

              <stop offset="60%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#d97706"/>
            </linearGradient>
            <linearGradient id="bevel-amber" x1="128" y1="16" x2="128" y2="240" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
              <stop offset="25%" stop-color="#ffffff" stop-opacity="0"/>
              <stop offset="85%" stop-color="#78350f" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#451a03" stop-opacity="0.6"/>
            </linearGradient>

          <rect x="18" y="16" width="220" height="212" rx="58" fill="url(#bg-amber)"/>
          <rect x="18" y="16" width="220" height="212" rx="58" fill="url(#bevel-amber)"/>

          <!-- Top Gloss Dome -->

          <!-- Object: Smiling Open Lips + Tongue + Teeth -->

            <!-- Center tongue indentation crease -->

            <!-- Lip Gloss Highlights -->
            <path d="M96 112C110 107 122 107 126 109" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
            <path d="M130 109C134 107 146 107 160 112" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
            <ellipse cx="128" cy="180" rx="22" ry="3.5" fill="#ffffff" fill-opacity="0.4"/>
          </g>
        </svg>
      </div>

      <!-- BADGE 4: Two connected sound waves curving into each other (Mint Jade / Conversation & Listening) -->
      <div class="badge-card w-48 h-48 sm:w-56 sm:h-56 md:w-64 md:h-64 flex items-center justify-center">
        <div class="badge-ledge"></div>
        <svg class="w-full h-full relative z-10 drop-shadow-[0_12px_24px_rgba(20,184,166,0.22)]" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">

          </defs>

          <!-- Squircle Base with Tactile Ledge Depth -->

          <rect x="18" y="16" width="220" height="212" rx="58" fill="url(#bg-mint)"/>
          <rect x="18" y="16" width="220" height="212" rx="58" fill="url(#bevel-mint)"/>

          <!-- Top Gloss Dome -->
          <path d="M26 68C26 44.804 44.804 26 68 26H188C211.196 26 230 44.804 230 68V98C230 98 178 126 128 126C78 126 26 98 26 98V68Z" fill="white" fill-opacity="0.22"/>

          <g filter="url(#shadow-mint)">

            <path d="M78 88C64 104 56 120 56 138C56 156 64 172 78 188" stroke="url(#wave-grad-1)" stroke-width="12" stroke-linecap="round"/>
            <path d="M98 104C88 116 84 126 84 138C84 150 88 160 98 172" stroke="url(#wave-grad-1)" stroke-width="10" stroke-linecap="round"/>
            
            <!-- Dynamic Center Harmonious Loop: Two curving waves interlocking -->

            <path d="M154 138C154 160 138 178 116 178C98 178 86 168 80 154" stroke="url(#wave-grad-2)" stroke-width="14" stroke-linecap="round"/>

            <circle cx="128" cy="138" r="7" fill="#ea580c"/>

            <path d="M158 104C168 116 172 126 172 138C172 150 168 160 158 172" stroke="url(#wave-grad-2)" stroke-width="10" stroke-linecap="round"/>
            
            <!-- Gloss Shine Speckles -->

            <circle cx="118" cy="172" r="3.5" fill="#ffffff"/>

      </div>

      <!-- BADGE 5: Sound wave hitting a solid block (Indigo Cobalt / Accent & Intonation / Obstacle Mastered) -->
      <div class="badge-card w-48 h-48 sm:w-56 sm:h-56 md:w-64 md:h-64 flex items-center justify-center">
        <div class="badge-ledge"></div>
        <svg class="w-full h-full relative z-10 drop-shadow-[0_12px_24px_rgba(79,70,229,0.22)]" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>

              <stop offset="85%" stop-color="#1e1b4b" stop-opacity="0.35"/>

              <stop offset="60%" stop-color="#38bdf8"/>

            <filter id="shadow-indigo" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse">
              <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.45"/>

          </defs>

          <!-- Squircle Base with Tactile Ledge Depth -->
          <rect x="18" y="24" width="220" height="212" rx="58" fill="#1e1b4b"/>

          <!-- Object: Sound wave hitting a solid 3D block with splash impact ripples -->

            <!-- Tactile 3D Block on the Right -->

              <!-- Block 3D isometric sides -->

            <path d="M84 98C96 110 102 124 102 138C102 152 96 166 84 178" stroke="url(#beam-grad)" stroke-width="11" stroke-linecap="round"/>
            <path d="M108 112C118 120 122 128 122 138C122 148 118 156 108 164" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

            <!-- Impact Point at block surface: Spark Flash & Deflection Waves -->
            <circle cx="146" cy="138" r="14" fill="#ffffff"/>
            <circle cx="146" cy="138" r="8" fill="#fde047"/>
            
            <!-- Deflection Spark Particles -->

            <circle cx="132" cy="116" r="4" fill="#fef08a"/>
            <circle cx="132" cy="160" r="4" fill="#fef08a"/>
            <circle cx="118" cy="138" r="3" fill="#ffffff"/>
          </g>
        </svg>
      </div>

      <!-- BADGE 6: Bullseye target with an arrow (Berry Carmine / Goal & Accuracy) -->
      <div class="badge-card w-48 h-48 sm:w-56 sm:h-56 md:w-64 md:h-64 flex items-center justify-center">
        <div class="badge-ledge"></div>
        <svg class="w-full h-full relative z-10 drop-shadow-[0_12px_24px_rgba(225,29,72,0.22)]" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg-berry" x1="28" y1="20" x2="228" y2="236" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#f43f5e"/>
              <stop offset="60%" stop-color="#e11d48"/>
              <stop offset="100%" stop-color="#9f1239"/>
            </linearGradient>
            <linearGradient id="bevel-berry" x1="128" y1="16" x2="128" y2="240" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
              <stop offset="25%" stop-color="#ffffff" stop-opacity="0"/>
              <stop offset="85%" stop-color="#4c0519" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#2c020e" stop-opacity="0.65"/>
            </linearGradient>
            <linearGradient id="arrow-gold" x1="120" y1="60" x2="200" y2="140" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="50%" stop-color="#fde047"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>
            <filter id="shadow-berry" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse">
              <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4c0519" flood-opacity="0.4"/>
            </filter>
          </defs>

          <!-- Squircle Base with Tactile Ledge Depth -->
          <rect x="18" y="24" width="220" height="212" rx="58" fill="#881337"/>
          <rect x="18" y="16" width="220" height="212" rx="58" fill="url(#bg-berry)"/>
          <rect x="18" y="16" width="220" height="212" rx="58" fill="url(#bevel-berry)"/>

          <!-- Top Gloss Dome -->
          <path d="M26 68C26 44.804 44.804 26 68 26H188C211.196 26 230 44.804 230 68V98C230 98 178 126 128 126C78 126 26 98 26 98V68Z" fill="white" fill-opacity="0.22"/>

          <!-- Object: Bullseye Target with Arrow Hit dead-center -->
          <g filter="url(#shadow-berry)">
            <!-- Target Ring 1 (Outer White Rim) -->
            <circle cx="124" cy="132" r="62" fill="#ffffff" stroke="#fda4af" stroke-width="3"/>
            <!-- Target Ring 2 (Middle Carmine Rim) -->
            <circle cx="124" cy="132" r="46" fill="#be123c"/>
            <!-- Target Ring 3 (Inner White Rim) -->
            <circle cx="124" cy="132" r="30" fill="#fff1f2"/>
            <!-- Bullseye Center (Vibrant Coral Amber) -->
            <circle cx="124" cy="132" r="16" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/>

            <!-- Arrow Piercing the Center (at 45 degree dynamic angle) -->
            <g transform="rotate(-45 124 132)">
              <!-- Arrow Shaft -->
              <rect x="120" y="42" width="8" height="92" rx="4" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
              <!-- Gold Arrow Fletching Feathers -->
              <path d="M124 46L108 30H118L124 38L130 30H140L124 46Z" fill="url(#arrow-gold)" stroke="#b45309" stroke-width="2"/>
              <path d="M124 62L110 48H118L124 54L130 48H138L124 62Z" fill="url(#arrow-gold)" stroke="#b45309" stroke-width="2"/>
              <!-- Arrow Head / Tip Embedded at Center -->
              <polygon points="124,136 114,120 134,120" fill="#0f172a"/>
              <!-- Impact Shockwave Rings -->
              <circle cx="124" cy="132" r="7" fill="#ffffff" fill-opacity="0.85"/>
            </g>

            <!-- Specular Highlights on Target Ring -->
            <path d="M86 96C98 84 112 80 124 80" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.8"/>
          </g>
        </svg>
      </div>

    </div>
  </main>
