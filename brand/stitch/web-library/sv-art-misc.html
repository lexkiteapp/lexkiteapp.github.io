<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Kit — Illustration Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#f3fbf9',
            'surface-low': '#edf5f3',
            'surface-card': '#ffffff',
            primary: '#114b47',
            coral: '#ff5c38',
            amber: '#f59e0b',
            marine: '#0284c7',
            emerald: '#10b981',
            violet: '#8b5cf6',
            rose: '#f43f5e'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f3fbf9;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .badge-card {
      filter: drop-shadow(0 12px 24px rgba(17, 75, 71, 0.08)) drop-shadow(0 4px 8px rgba(17, 75, 71, 0.04));
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .badge-card:hover {
      transform: translateY(-4px) scale(1.02);
    }
  </style>
</head>
<body class="bg-[#f3fbf9] p-6 md:p-12 selection:bg-coral selection:text-white">

  <!-- Main Illustration Sheet: 1 neat grid of 6 square glossy badges, no headers, no footers, no text -->
  <main class="w-full max-w-5xl mx-auto flex items-center justify-center">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-6 md:gap-10 w-full max-w-4xl place-items-center">

      <!-- Badge 1: Folded map with a location pin (Warm Amber / Ochre palette with Coral Pin) -->
      <div class="badge-card w-full max-w-[240px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 200 200" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bgGrad1" cx="30%" cy="25%" r="75%">
              <stop offset="0%" stop-color="#fffbeb"/>
              <stop offset="60%" stop-color="#fef3c7"/>
              <stop offset="100%" stop-color="#fde68a"/>
            </radialGradient>
            <linearGradient id="rimGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>
            <linearGradient id="pinGrad" x1="20%" y1="10%" x2="80%" y2="90%">
              <stop offset="0%" stop-color="#ff7a59"/>
              <stop offset="60%" stop-color="#ff5c38"/>
              <stop offset="100%" stop-color="#d63b18"/>
            </linearGradient>
            <filter id="shadow1" x="-10%" y="-10%" width="120%" height="130%">
              <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#b45309" flood-opacity="0.25"/>
            </filter>
            <filter id="objShadow1" x="-20%" y="-15%" width="140%" height="140%">
              <feDropShadow dx="0" dy="6" stdDeviation="3.5" flood-color="#78350f" flood-opacity="0.2"/>
            </filter>
          </defs>

          <!-- Soft ledge / foundation beneath the badge -->
          <ellipse cx="100" cy="186" rx="66" ry="9" fill="#0f3d3e" opacity="0.12"/>
          <ellipse cx="100" cy="184" rx="46" ry="5" fill="#0f3d3e" opacity="0.08"/>

          <!-- Glossy Badge Base (Rounded squircle badge) -->
          <rect x="18" y="16" width="164" height="164" rx="46" fill="url(#bgGrad1)" stroke="url(#rimGrad1)" stroke-width="4" filter="url(#shadow1)"/>
          
          <!-- Inner bottom depth rim / 3D tactile ledge -->
          <path d="M 22 134 C 36 172, 164 172, 178 134 C 168 176, 32 176, 22 134 Z" fill="#d97706" opacity="0.25"/>

          <!-- Top specular glossy highlight -->
          <path d="M 28 42 C 40 22, 160 22, 172 42 C 158 58, 42 58, 28 42 Z" fill="#ffffff" opacity="0.55"/>

          <!-- Illustrated Object: Folded Map with Location Pin -->
          <g filter="url(#objShadow1)">
            <!-- Folded Map (3 segments) -->
            <!-- Left panel -->
            <polygon points="46,74 76,64 76,140 46,150" fill="#38bdf8"/>
            <polygon points="46,74 76,64 76,69 46,79" fill="#bae6fd" opacity="0.6"/>
            <!-- Center panel (in perspective) -->
            <polygon points="76,64 116,76 116,152 76,140" fill="#0284c7"/>
            <polygon points="76,64 116,76 116,81 76,69" fill="#7dd3fc" opacity="0.4"/>
            <!-- Right panel -->
            <polygon points="116,76 154,64 154,140 116,152" fill="#38bdf8"/>
            <polygon points="116,76 154,64 154,69 116,81" fill="#bae6fd" opacity="0.6"/>

            <!-- Route lines & contours on map -->
            <path d="M 52,118 Q 66,106 76,112 T 100,108 T 130,120 T 148,104" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 6"/>

            <!-- Small green waypoint dot on route -->
            <circle cx="62" cy="113" r="3.5" fill="#10b981"/>

            <!-- Location Pin (bold, recognizable, centered) -->
            <g transform="translate(100, 96)">
              <!-- Pin shadow on map -->
              <ellipse cx="0" cy="22" rx="9" ry="4" fill="#0c4a6e" opacity="0.35"/>
              <!-- Pin body -->
              <path d="M 0,20 C -2,17 -18,-1 -18,-16 C -18,-26 -10,-34 0,-34 C 10,-34 18,-26 18,-16 C 18,-1 -2,17 0,20 Z" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="2.5"/>
              <!-- Pin center hole -->
              <circle cx="0" cy="-16" r="6" fill="#ffffff"/>
              <!-- Pin specular glow -->
              <ellipse cx="-5" cy="-24" rx="4" ry="2.5" fill="#ffffff" opacity="0.7" transform="rotate(-30, -5, -24)"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- Badge 2: Chat bubble holding a question mark (Teal / Jade palette with Sunny Amber mark) -->
      <div class="badge-card w-full max-w-[240px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 200 200" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bgGrad2" cx="30%" cy="25%" r="75%">
              <stop offset="0%" stop-color="#ecfdf5"/>
              <stop offset="60%" stop-color="#ccfbf1"/>
              <stop offset="100%" stop-color="#99f6e4"/>
            </radialGradient>
            <linearGradient id="rimGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#14b8a6"/>
            </linearGradient>
            <linearGradient id="bubbleGrad" x1="15%" y1="10%" x2="85%" y2="90%">
              <stop offset="0%" stop-color="#196761"/>
              <stop offset="50%" stop-color="#114b47"/>
              <stop offset="100%" stop-color="#0a3230"/>
            </linearGradient>
            <linearGradient id="qGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="50%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#d97706"/>
            </linearGradient>
            <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
              <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0f766e" flood-opacity="0.25"/>
            </filter>
            <filter id="objShadow2" x="-20%" y="-15%" width="140%" height="140%">
              <feDropShadow dx="0" dy="6" stdDeviation="3.5" flood-color="#064e3b" flood-opacity="0.28"/>
            </filter>
          </defs>

          <!-- Soft ledge / foundation -->
          <ellipse cx="100" cy="186" rx="66" ry="9" fill="#0f3d3e" opacity="0.12"/>
          <ellipse cx="100" cy="184" rx="46" ry="5" fill="#0f3d3e" opacity="0.08"/>

          <!-- Glossy Badge Base -->
          <rect x="18" y="16" width="164" height="164" rx="46" fill="url(#bgGrad2)" stroke="url(#rimGrad2)" stroke-width="4" filter="url(#shadow2)"/>
          
          <!-- Inner bottom depth rim -->
          <path d="M 22 134 C 36 172, 164 172, 178 134 C 168 176, 32 176, 22 134 Z" fill="#0d9488" opacity="0.25"/>

          <!-- Top specular glossy highlight -->
          <path d="M 28 42 C 40 22, 160 22, 172 42 C 158 58, 42 58, 28 42 Z" fill="#ffffff" opacity="0.55"/>

          <!-- Illustrated Object: Chat Bubble holding a Question Mark -->
          <g filter="url(#objShadow2)">
            <!-- Ambient secondary small bubble in background -->
            <ellipse cx="60" cy="70" rx="14" ry="12" fill="#5eead4" opacity="0.6"/>
            <path d="M 52,78 L 46,86 L 58,82 Z" fill="#5eead4" opacity="0.6"/>

            <!-- Main Chat Bubble (Large, pillowy, glossy) -->
            <g transform="translate(100, 98)">
              <!-- Speech bubble body -->
              <path d="M -48,-44 C 48,-44 48,-44 48,-44 C 54,-44 58,-38 58,-30 L 58,16 C 58,24 52,30 44,30 L 10,30 L -8,46 C -12,49 -16,47 -16,42 L -16,30 L -44,30 C -52,30 -58,24 -58,16 L -58,-30 C -58,-38 -52,-44 -44,-44 Z" fill="url(#bubbleGrad)" stroke="#ffffff" stroke-width="3"/>
              
              <!-- Subtle bubble glossy top bevel -->
              <path d="M -48,-40 C -10,-40 20,-40 44,-40 C 50,-40 52,-36 52,-32 L 52,-20 C 30,-30 -20,-30 -52,-20 L -52,-32 C -52,-36 -48,-40 -48,-40 Z" fill="#ffffff" opacity="0.18"/>

              <!-- Bold Question Mark inside bubble -->
              <path d="M -12,-24 C -12,-32 -4,-37 6,-37 C 16,-37 24,-31 24,-21 C 24,-13 18,-8 11,-4 C 5,-1 3,3 3,9 L 3,11 L -7,11 L -7,8 C -7,1 -4,-4 2,-8 C 8,-12 12,-15 12,-20 C 12,-25 8,-28 4,-28 C -1,-28 -4,-25 -4,-21 Z" fill="url(#qGrad)"/>
              <circle cx="-2" cy="22" r="5.5" fill="url(#qGrad)"/>

              <!-- Inner shine on dot -->
              <circle cx="-3.5" cy="20.5" r="1.5" fill="#ffffff" opacity="0.8"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- Badge 3: Tick inside a shield (Emerald Green / Mint palette with Crisp White & Gold Tick) -->
      <div class="badge-card w-full max-w-[240px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 200 200" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bgGrad3" cx="30%" cy="25%" r="75%">
              <stop offset="0%" stop-color="#f0fdf4"/>
              <stop offset="60%" stop-color="#dcfce7"/>
              <stop offset="100%" stop-color="#bbf7d0"/>
            </radialGradient>
            <linearGradient id="rimGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#10b981"/>
            </linearGradient>
            <linearGradient id="shieldGrad" x1="10%" y1="10%" x2="90%" y2="90%">
              <stop offset="0%" stop-color="#34d399"/>
              <stop offset="50%" stop-color="#059669"/>
              <stop offset="100%" stop-color="#064e3b"/>
            </linearGradient>
            <linearGradient id="tickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#f1f5f9"/>
            </linearGradient>
            <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
              <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#047857" flood-opacity="0.25"/>
            </filter>
            <filter id="objShadow3" x="-20%" y="-15%" width="140%" height="140%">
              <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#022c22" flood-opacity="0.3"/>
            </filter>
          </defs>

          <!-- Soft ledge / foundation -->
          <ellipse cx="100" cy="186" rx="66" ry="9" fill="#0f3d3e" opacity="0.12"/>
          <ellipse cx="100" cy="184" rx="46" ry="5" fill="#0f3d3e" opacity="0.08"/>

          <!-- Glossy Badge Base -->
          <rect x="18" y="16" width="164" height="164" rx="46" fill="url(#bgGrad3)" stroke="url(#rimGrad3)" stroke-width="4" filter="url(#shadow3)"/>
          
          <!-- Inner bottom depth rim -->
          <path d="M 22 134 C 36 172, 164 172, 178 134 C 168 176, 32 176, 22 134 Z" fill="#059669" opacity="0.25"/>

          <!-- Top specular glossy highlight -->
          <path d="M 28 42 C 40 22, 160 22, 172 42 C 158 58, 42 58, 28 42 Z" fill="#ffffff" opacity="0.55"/>

          <!-- Illustrated Object: Tick inside a Shield -->
          <g filter="url(#objShadow3)">
            <g transform="translate(100, 96)">
              <!-- Outer Shield with 3D bevel edge -->
              <path d="M 0,-44 C 28,-44 48,-38 50,-34 C 52,-14 52,18 36,36 C 24,48 0,56 0,56 C 0,56 -24,48 -36,36 C -52,18 -52,-14 -50,-34 C -48,-38 -28,-44 0,-44 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="3.5"/>

              <!-- Inner shield reflection & depth split -->
              <!-- Left side specular glow -->
              <path d="M 0,-40 C -24,-40 -42,-34 -44,-30 C -46,-12 -46,14 -32,30 C -22,40 0,48 0,48 Z" fill="#ffffff" opacity="0.18"/>

              <!-- Bold White Tick Mark -->
              <path d="M -22,-2 L -8,12 L 26,-22 L 34,-14 L -8,28 L -30,6 Z" fill="url(#tickGrad)" stroke="#10b981" stroke-width="1.5" stroke-linejoin="round"/>

              <!-- Specular gleam on tick elbow -->
              <circle cx="-8" cy="12" r="2.5" fill="#ffffff"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- Badge 4: Open letter with a pen (Coral / Sunset Rose palette with Golden Nib) -->
      <div class="badge-card w-full max-w-[240px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 200 200" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bgGrad4" cx="30%" cy="25%" r="75%">
              <stop offset="0%" stop-color="#fff1f2"/>
              <stop offset="60%" stop-color="#ffe4e6"/>
              <stop offset="100%" stop-color="#fecdd3"/>
            </radialGradient>
            <linearGradient id="rimGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#f43f5e"/>
            </linearGradient>
            <linearGradient id="envGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#fed7aa"/>
            </linearGradient>
            <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff7a59"/>
              <stop offset="60%" stop-color="#ff5c38"/>
              <stop offset="100%" stop-color="#b91c1c"/>
            </linearGradient>
            <filter id="shadow4" x="-10%" y="-10%" width="120%" height="130%">
              <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#be123c" flood-opacity="0.25"/>
            </filter>
            <filter id="objShadow4" x="-20%" y="-15%" width="140%" height="140%">
              <feDropShadow dx="0" dy="6" stdDeviation="3.5" flood-color="#881337" flood-opacity="0.25"/>
            </filter>
          </defs>

          <!-- Soft ledge / foundation -->
          <ellipse cx="100" cy="186" rx="66" ry="9" fill="#0f3d3e" opacity="0.12"/>
          <ellipse cx="100" cy="184" rx="46" ry="5" fill="#0f3d3e" opacity="0.08"/>

          <!-- Glossy Badge Base -->
          <rect x="18" y="16" width="164" height="164" rx="46" fill="url(#bgGrad4)" stroke="url(#rimGrad4)" stroke-width="4" filter="url(#shadow4)"/>
          
          <!-- Inner bottom depth rim -->
          <path d="M 22 134 C 36 172, 164 172, 178 134 C 168 176, 32 176, 22 134 Z" fill="#e11d48" opacity="0.25"/>

          <!-- Top specular glossy highlight -->
          <path d="M 28 42 C 40 22, 160 22, 172 42 C 158 58, 42 58, 28 42 Z" fill="#ffffff" opacity="0.55"/>

          <!-- Illustrated Object: Open Letter with a Pen -->
          <g filter="url(#objShadow4)">
            <g transform="translate(100, 102)">
              <!-- Letter Sheet pulling out of envelope -->
              <rect x="-38" y="-48" width="56" height="42" rx="4" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
              <!-- Note lines on paper -->
              <line x1="-30" y1="-38" x2="6" y2="-38" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="-30" y1="-30" x2="-2" y2="-30" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="-30" y1="-22" x2="10" y2="-22" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>

              <!-- Envelope Back Flap (Open top) -->
              <polygon points="-46,-16 0,-42 46,-16 46,32 -46,32" fill="#fda4af"/>

              <!-- Envelope Front Pocket -->
              <polygon points="-46,32 -46,-10 0,16 46,-10 46,32" fill="#fb7185" stroke="#ffffff" stroke-width="2"/>
              <polygon points="-46,32 0,16 46,32" fill="#f43f5e" opacity="0.4"/>

              <!-- Fountain Pen angled across the letter -->
              <g transform="translate(18, -4) rotate(-35)">
                <!-- Pen Upper Body -->
                <rect x="-7" y="-44" width="14" height="46" rx="4" fill="url(#penBody)" stroke="#ffffff" stroke-width="2"/>
                <!-- Gold Band -->
                <rect x="-7" y="-2" width="14" height="5" fill="#f59e0b"/>
                <!-- Pen Grip Section -->
                <polygon points="-5,3 5,3 4,14 -4,14" fill="#1e293b"/>
                <!-- Golden Pen Nib -->
                <polygon points="-4,14 4,14 0,26" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>
                <line x1="0" y1="16" x2="0" y2="23" stroke="#b45309" stroke-width="1"/>
                <!-- Pen Clip -->
                <rect x="-2" y="-40" width="4" height="24" rx="1.5" fill="#fef08a"/>
              </g>
            </g>
          </g>
        </svg>
      </div>

      <!-- Badge 5: Small notebook with a ribbon (Sky Marine / Royal Blue palette with Golden Ribbon) -->
      <div class="badge-card w-full max-w-[240px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 200 200" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bgGrad5" cx="30%" cy="25%" r="75%">
              <stop offset="0%" stop-color="#f0f9ff"/>
              <stop offset="60%" stop-color="#e0f2fe"/>
              <stop offset="100%" stop-color="#bae6fd"/>
            </radialGradient>
            <linearGradient id="rimGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </linearGradient>
            <linearGradient id="bookCover" x1="10%" y1="0%" x2="90%" y2="100%">
              <stop offset="0%" stop-color="#0284c7"/>
              <stop offset="50%" stop-color="#0369a1"/>
              <stop offset="100%" stop-color="#075985"/>
            </linearGradient>
            <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fbbf24"/>
              <stop offset="60%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#d97706"/>
            </linearGradient>
            <filter id="shadow5" x="-10%" y="-10%" width="120%" height="130%">
              <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0369a1" flood-opacity="0.25"/>
            </filter>
            <filter id="objShadow5" x="-20%" y="-15%" width="140%" height="140%">
              <feDropShadow dx="0" dy="6" stdDeviation="3.5" flood-color="#082f49" flood-opacity="0.3"/>
            </filter>
          </defs>

          <!-- Soft ledge / foundation -->
          <ellipse cx="100" cy="186" rx="66" ry="9" fill="#0f3d3e" opacity="0.12"/>
          <ellipse cx="100" cy="184" rx="46" ry="5" fill="#0f3d3e" opacity="0.08"/>

          <!-- Glossy Badge Base -->
          <rect x="18" y="16" width="164" height="164" rx="46" fill="url(#bgGrad5)" stroke="url(#rimGrad5)" stroke-width="4" filter="url(#shadow5)"/>
          
          <!-- Inner bottom depth rim -->
          <path d="M 22 134 C 36 172, 164 172, 178 134 C 168 176, 32 176, 22 134 Z" fill="#0284c7" opacity="0.25"/>

          <!-- Top specular glossy highlight -->
          <path d="M 28 42 C 40 22, 160 22, 172 42 C 158 58, 42 58, 28 42 Z" fill="#ffffff" opacity="0.55"/>

          <!-- Illustrated Object: Small Notebook with a Ribbon Bookmark -->
          <g filter="url(#objShadow5)">
            <g transform="translate(100, 96)">
              <!-- Book Spine depth / thickness -->
              <rect x="-42" y="-46" width="84" height="96" rx="10" fill="#082f49"/>
              <!-- Book Paper block visible at edge -->
              <rect x="-35" y="-43" width="76" height="90" rx="8" fill="#f8fafc"/>
              <rect x="-33" y="-41" width="74" height="86" rx="7" fill="#e2e8f0"/>

              <!-- Front Cover (Tilted slightly to reveal page trims) -->
              <rect x="-42" y="-46" width="76" height="94" rx="9" fill="url(#bookCover)" stroke="#ffffff" stroke-width="2.5"/>

              <!-- Spine decorative stitches / bands -->
              <rect x="-42" y="-46" width="12" height="94" rx="6" fill="#075985" opacity="0.6"/>
              <line x1="-30" y1="-46" x2="-30" y2="48" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>

              <!-- Golden Elastic band or Cover Emblem -->
              <circle cx="-4" cy="1" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
              <circle cx="-4" cy="1" r="7" fill="#ffffff" opacity="0.9"/>

              <!-- Hanging Bookmark Ribbon (Draping down with notched tip) -->
              <path d="M 6,-46 L 16,-46 L 16,36 L 11,31 L 6,36 Z" fill="url(#ribbonGrad)" stroke="#ffffff" stroke-width="1.5"/>
              <line x1="11" y1="-46" x2="11" y2="31" stroke="#fef08a" stroke-width="1" opacity="0.8"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- Badge 6: Play button on a small sound wave (Lavender Violet palette with Radiant Play icon) -->
      <div class="badge-card w-full max-w-[240px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 200 200" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bgGrad6" cx="30%" cy="25%" r="75%">
              <stop offset="0%" stop-color="#faf5ff"/>
              <stop offset="60%" stop-color="#f3e8ff"/>
              <stop offset="100%" stop-color="#e9d5ff"/>
            </radialGradient>
            <linearGradient id="rimGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
            <linearGradient id="btnGrad" x1="10%" y1="10%" x2="90%" y2="90%">
              <stop offset="0%" stop-color="#a855f7"/>
              <stop offset="50%" stop-color="#7c3aed"/>
              <stop offset="100%" stop-color="#5b21b6"/>
            </linearGradient>
            <filter id="shadow6" x="-10%" y="-10%" width="120%" height="130%">
              <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#7e22ce" flood-opacity="0.25"/>
            </filter>
