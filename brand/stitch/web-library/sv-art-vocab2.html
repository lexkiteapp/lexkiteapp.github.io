          <g transform="translate(100, 130)">
            <!-- Outer 8 Teeth via Rotated Rectangles -->
            <!-- 3D base shadow rim of gear -->
            <circle cx="0" cy="3" r="42" fill="#082f49"/>
            <g fill="url(#gear-large)" stroke="#0c4a6e" stroke-width="2">
              <rect x="-9" y="-48" width="18" height="96" rx="4"/>
              <rect x="-9" y="-48" width="18" height="96" rx="4" transform="rotate(45)"/>
              <rect x="-9" y="-48" width="18" height="96" rx="4" transform="rotate(90)"/>
              <rect x="-9" y="-48" width="18" height="96" rx="4" transform="rotate(135)"/>
              <!-- Gear Solid Center Body -->
              <circle cx="0" cy="0" r="38"/>
            </g>
            <!-- Ledge Highlight on Gear -->
            <circle cx="0" cy="0" r="35" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
            <!-- Center Axle Hole -->
            <circle cx="0" cy="0" r="14" fill="#0369a1" stroke="#075985" stroke-width="3"/>
            <circle cx="0" cy="0" r="6" fill="#0c4a6e"/>
          </g>

          <!-- 2. SMALL SECONDARY GEAR (Golden Yellow, Top-Right, Intermeshing) -->
          <g transform="translate(148, 92)">
            <!-- 3D base shadow rim of small gear -->
            <circle cx="0" cy="3" r="28" fill="#78350f" fill-opacity="0.6"/>
            <!-- Teeth via Rotated Rectangles -->
            <g fill="url(#gear-small)" stroke="#92400e" stroke-width="2">
              <rect x="-6.5" y="-33" width="13" height="66" rx="3.5" transform="rotate(22.5)"/>
              <rect x="-6.5" y="-33" width="13" height="66" rx="3.5" transform="rotate(67.5)"/>
              <rect x="-6.5" y="-33" width="13" height="66" rx="3.5" transform="rotate(112.5)"/>
              <rect x="-6.5" y="-33" width="13" height="66" rx="3.5" transform="rotate(157.5)"/>
              <!-- Gear Center Body -->
              <circle cx="0" cy="0" r="26"/>
            </g>
            <!-- Highlight -->
            <circle cx="0" cy="0" r="23" stroke="#fef08a" stroke-width="1.8" fill="none" opacity="0.9"/>
            <!-- Center Axle Hole -->
            <circle cx="0" cy="0" r="9.5" fill="#0369a1" stroke="#92400e" stroke-width="2"/>
            <circle cx="0" cy="0" r="4.5" fill="#082f49"/>
          </g>

          <!-- Mesh Sparkle Dot at contact point -->
          <circle cx="126" cy="107" r="3" fill="#ffffff"/>
        </g>
      </svg>
    </div>

    <!-- 6. Two Interlocking Puzzle Pieces (Fresh Lime / Apple Green Badge) -->
    <div class="w-full max-w-[240px] sm:max-w-[260px] aspect-square flex items-center justify-center">
      <svg class="w-full h-full drop-shadow-md transition-transform duration-200 hover:-translate-y-1" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lime-base" x1="120" y1="12" x2="120" y2="204" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#84cc16"/>
            <stop offset="60%" stop-color="#65a30d"/>
            <stop offset="100%" stop-color="#4d7c0f"/>

          <linearGradient id="piece-coral" x1="90" y1="65" x2="90" y2="165" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ff7e5a"/>
            <stop offset="100%" stop-color="#ef4444"/>

          <linearGradient id="piece-white" x1="150" y1="65" x2="150" y2="165" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f1f5f9"/>
          </linearGradient>
        </defs>

        <!-- Ledge Shadow under badge -->
        <ellipse cx="120" cy="216" rx="76" ry="11" fill="#365314" fill-opacity="0.14"/>
        <ellipse cx="120" cy="216" rx="52" ry="6" fill="#365314" fill-opacity="0.16"/>

        <!-- Tactile 3D Ledge Bottom Rim -->
        <rect x="20" y="24" width="200" height="186" rx="44" fill="#365314"/>
        <!-- Main Badge Plaque -->
        <rect x="20" y="16" width="200" height="186" rx="44" fill="url(#lime-base)"/>

        <!-- Inner Highlight Rim -->
        <rect x="23" y="19" width="194" height="180" rx="41" stroke="#bef264" stroke-width="2.5" fill="none" opacity="0.6"/>

        <!-- Glossy Curved Top Lens -->
        <path d="M26 58C26 36.7924 43.2076 21 64.4152 21H175.585C196.792 21 214 36.7924 214 58C214 74 185 96 120 96C55 96 26 74 26 58Z" fill="url(#gloss-sheen)"/>

        <!-- OBJECT: Two Interlocking Puzzle Pieces -->
        <g id="object-puzzle">
          <!-- Shadow inside badge -->
          <ellipse cx="120" cy="177" rx="56" ry="9" fill="#1e3a07" fill-opacity="0.4"/>

          <!-- PIECE 1: Left Coral/Orange Puzzle Piece (with protruding interlocking tab) -->
          <!-- 3D Bottom Ledge Extrusion for Piece 1 -->
          <path d="M68 158V164C68 168 72 172 76 172H118C122 172 126 168 126 164V158H68Z" fill="#b91c1c"/>
          <!-- Main Body of Left Piece -->
          <path d="M68 80C68 74 72 70 78 70H118C124 70 126 74 126 80V104C134 104 141 110 141 118C141 126 134 132 126 132V158C126 164 122 166 116 166H76C70 166 68 162 68 156V80Z" fill="url(#piece-coral)" stroke="#991b1b" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- Highlight curve on piece 1 -->
          <path d="M72 74H116M72 78V152" stroke="#fca5a5" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

          <!-- PIECE 2: Right Crisp White/Cream Puzzle Piece (with matching socket that interlocks) -->
          <!-- 3D Bottom Ledge Extrusion for Piece 2 -->
          <path d="M126 158V164C126 168 130 172 134 172H168C172 172 176 168 176 164V158H126Z" fill="#94a3b8"/>
          <!-- Main Body of Right Piece -->
          <path d="M126 80V104C134 104 141 110 141 118C141 126 134 132 126 132V158C126 164 130 166 136 166H166C172 166 176 162 176 156V80C176 74 172 70 166 70H136C130 70 126 74 126 80Z" fill="url(#piece-white)" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- Highlight on piece 2 -->
          <path d="M136 74H172M172 78V152" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

          <!-- Mechanical Seam Line emphasizing the interlocking joint -->
          <path d="M126 71V103C134 103 142 110 142 118C142 126 134 133 126 133V165" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

          <!-- Joint Specular Sheen Sparkle -->
          <circle cx="140" cy="112" r="2.5" fill="#ffffff"/>
        </g>
      </svg>
    </div>

  </main>
