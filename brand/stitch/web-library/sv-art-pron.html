<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Kit — Illustration Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#fbf9f5',
            'surface-low': '#f5f2eb',
            'outline-soft': '#e8e2d5',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #fbf9f5;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .badge-card {
      filter: drop-shadow(0 14px 24px rgba(22, 54, 53, 0.08)) drop-shadow(0 3px 6px rgba(22, 54, 53, 0.04));
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
    }
    .badge-card:hover {
      transform: translateY(-6px);
      filter: drop-shadow(0 20px 30px rgba(22, 54, 53, 0.12)) drop-shadow(0 6px 10px rgba(22, 54, 53, 0.06));
    }
  </style>
</head>
<body class="bg-[#fbf9f5] text-slate-800 p-6 md:p-12 lg:p-16 flex items-center justify-center min-h-screen">

  <main class="w-full max-w-5xl mx-auto flex items-center justify-center">
    <!-- 6 Large Square Glossy Badges Grid (3 cols on md+, 2 cols on sm) -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-8 md:gap-10 lg:gap-12 w-full justify-items-center items-center">

      <!-- BADGE 1: Megaphone with Rising Wave (Teal / Jade Emerald) -->
      <div class="badge-card w-full max-w-[260px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 240 240" class="w-full h-full block" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Badge Surface Gradients -->
            <linearGradient id="bg1" x1="24" y1="20" x2="216" y2="220" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#248a80" />
              <stop offset="60%" stop-color="#15665e" />
              <stop offset="100%" stop-color="#0e4a44" />
            </linearGradient>
            <linearGradient id="gloss1" x1="40" y1="20" x2="160" y2="130" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
            </linearGradient>
            <linearGradient id="coneGrad" x1="70" y1="80" x2="140" y2="150" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#daf5ef" />
            </linearGradient>
            <linearGradient id="bellGrad" x1="130" y1="85" x2="150" y2="145" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ff9980" />
              <stop offset="100%" stop-color="#ff5c38" />
            </linearGradient>
            <!-- Soft drop shadow for ledge -->
            <radialGradient id="ledgeShadow1" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#0a2e2b" stop-opacity="0.45" />
              <stop offset="100%" stop-color="#0a2e2b" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Outer tactile squircle base with tactile 3D lip/ledge -->
          <!-- Under-ledge shadow layer -->
          <rect x="20" y="26" width="200" height="200" rx="52" fill="#0b3732" />
          <!-- Main Squircle Body -->
          <rect x="20" y="18" width="200" height="200" rx="52" fill="url(#bg1)" />
          
          <!-- Inner glossy highlight ring / rim -->
          <rect x="22" y="20" width="196" height="196" rx="50" stroke="white" stroke-width="2.5" stroke-opacity="0.35" fill="none" />
          <!-- Top edge crisp sheen -->
          <path d="M 64 20 Q 120 18 176 20" stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
          
          <!-- Glossy glassy diagonal overlay -->
          <path d="M 22 70 C 22 38 42 21 72 21 L 168 21 C 110 50 50 100 22 150 Z" fill="url(#gloss1)" />

          <!-- Internal 3D Ledge / Plinth for object to sit on -->
          <ellipse cx="120" cy="180" rx="66" ry="11" fill="url(#ledgeShadow1)" />
          <ellipse cx="120" cy="177" rx="56" ry="7" fill="#13524c" opacity="0.6" />

          <!-- Megaphone Object & Rising Soundwave -->
          <!-- Handle -->
          <path d="M 88 132 L 80 162 C 78 168 83 174 90 174 C 96 174 100 169 101 163 L 105 132 Z" fill="#ff7a5c" />
          <path d="M 88 132 L 95 162 C 95 165 98 168 101 168" stroke="#ffb5a3" stroke-width="3" stroke-linecap="round" fill="none" />

          <!-- Main Megaphone Body / Cone -->
          <!-- Rear cap / sound box -->
          <rect x="52" y="104" width="24" height="34" rx="7" fill="#fdfefe" />
          <rect x="54" y="106" width="6" height="30" rx="3" fill="#cbdcd7" />
          
          <!-- Funnel / Cone -->
          <path d="M 76 110 L 132 82 C 135 80 138 82 138 86 L 138 156 C 138 160 135 162 132 160 L 76 132 Z" fill="url(#coneGrad)" />
          <!-- Subtle specular reflection on cone -->
          <path d="M 78 116 L 130 92" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.8" />

          <!-- Megaphone Front Ring (Coral Brand Accent) -->
          <path d="M 134 82 C 142 82 148 98 148 121 C 148 144 142 160 134 160 C 126 160 120 144 120 121 C 120 98 126 82 134 82 Z" fill="url(#bellGrad)" />
          <ellipse cx="137" cy="121" rx="4" ry="24" fill="#d93b16" />

          <!-- Soundwave / Speech Waves (Rising energetic curves) -->
          <!-- Wave 1 (inner) -->
          <path d="M 160 102 C 168 110 168 132 160 140" stroke="#ffc933" stroke-width="7" stroke-linecap="round" fill="none" />
          <!-- Wave 2 (middle - rising taller) -->
          <path d="M 174 90 C 188 104 188 138 174 152" stroke="#fffae6" stroke-width="7" stroke-linecap="round" fill="none" />
          <!-- Wave 3 (outer - cresting upward) -->
          <path d="M 188 78 C 208 98 208 144 188 164" stroke="#fffae6" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9" />
          <!-- Sparkling accent bubble -->
          <circle cx="196" cy="72" r="5" fill="#ffc933" />
        </svg>
      </div>

      <!-- BADGE 2: Line Chart on Small Card with Rising Line (Coral Warmth) -->
      <div class="badge-card w-full max-w-[260px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 240 240" class="w-full h-full block" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg2" x1="24" y1="20" x2="216" y2="220" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ff7554" />
              <stop offset="55%" stop-color="#f04d26" />
              <stop offset="100%" stop-color="#be2e0c" />
            </linearGradient>
            <linearGradient id="gloss2" x1="40" y1="20" x2="160" y2="130" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
            </linearGradient>
            <linearGradient id="cardGrad2" x1="60" y1="65" x2="180" y2="185" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#fff4f0" />
            </linearGradient>
            <linearGradient id="areaFillGrad2" x1="120" y1="95" x2="120" y2="155" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#147d73" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#147d73" stop-opacity="0.02" />
            </linearGradient>
            <radialGradient id="ledgeShadow2" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#731903" stop-opacity="0.5" />
              <stop offset="100%" stop-color="#731903" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Outer squircle 3D ledge -->
          <rect x="20" y="26" width="200" height="200" rx="52" fill="#8c1f06" />
          <rect x="20" y="18" width="200" height="200" rx="52" fill="url(#bg2)" />
          <rect x="22" y="20" width="196" height="196" rx="50" stroke="white" stroke-width="2.5" stroke-opacity="0.35" fill="none" />
          <path d="M 64 20 Q 120 18 176 20" stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
          <path d="M 22 70 C 22 38 42 21 72 21 L 168 21 C 110 50 50 100 22 150 Z" fill="url(#gloss2)" />

          <!-- Ledge Shadow -->
          <ellipse cx="120" cy="180" rx="66" ry="11" fill="url(#ledgeShadow2)" />

          <!-- The Floating Tactile Card -->
          <!-- Card 3D thickness under-base -->
          <rect x="52" y="74" width="136" height="102" rx="20" fill="#ebd6cf" />
          <!-- Main Card Surface -->
          <rect x="52" y="68" width="136" height="102" rx="20" fill="url(#cardGrad2)" stroke="#ffffff" stroke-width="2" />
          
          <!-- Subtle horizontal chart gridlines -->
          <line x1="68" y1="96" x2="172" y2="96" stroke="#f0ddd6" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" />
          <line x1="68" y1="124" x2="172" y2="124" stroke="#f0ddd6" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" />
          <line x1="68" y1="150" x2="172" y2="150" stroke="#f0ddd6" stroke-width="2" stroke-linecap="round" />

          <!-- Area under line chart -->
          <path d="M 72 144 L 98 128 L 126 136 L 166 90 L 166 150 L 72 150 Z" fill="url(#areaFillGrad2)" />

          <!-- The Rising Line -->
          <path d="M 72 144 L 98 128 L 126 136 L 166 90" stroke="#116b63" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          
          <!-- Data Points (Round glossy beads) -->
          <circle cx="72" cy="144" r="5" fill="#116b63" />
          <circle cx="72" cy="144" r="2.5" fill="#ffffff" />
          
          <circle cx="98" cy="128" r="5" fill="#116b63" />
          <circle cx="98" cy="128" r="2.5" fill="#ffffff" />
          
          <circle cx="126" cy="136" r="5" fill="#116b63" />
          <circle cx="126" cy="136" r="2.5" fill="#ffffff" />

          <!-- Peak Point: Glorious enlarged glowing badge pin -->
          <circle cx="166" cy="90" r="9" fill="#116b63" />
          <circle cx="166" cy="90" r="5" fill="#ffc933" />
          <circle cx="166" cy="90" r="2.5" fill="#ffffff" />

          <!-- Rising Arrow Head Accent -->
          <path d="M 158 76 L 174 74 L 172 90" stroke="#ffc933" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
      </div>

      <!-- BADGE 3: Bar Chart with Four Bars (Golden Sunflower / Ochre) -->
      <div class="badge-card w-full max-w-[260px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 240 240" class="w-full h-full block" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg3" x1="24" y1="20" x2="216" y2="220" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fbb024" />
              <stop offset="60%" stop-color="#e28c0b" />
              <stop offset="100%" stop-color="#b46800" />
            </linearGradient>
            <linearGradient id="gloss3" x1="40" y1="20" x2="160" y2="130" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
            </linearGradient>
            <!-- Bar Gradients -->
            <linearGradient id="bar1Grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#fdf4db" />
            </linearGradient>
            <linearGradient id="bar2Grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#def4f0" />
            </linearGradient>
            <linearGradient id="bar3Grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#daf0ec" />
            </linearGradient>
            <linearGradient id="bar4Grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1db3a4" />
              <stop offset="100%" stop-color="#0e635b" />
            </linearGradient>
            <radialGradient id="ledgeShadow3" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#6e3f00" stop-opacity="0.5" />
              <stop offset="100%" stop-color="#6e3f00" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Squircle Base -->
          <rect x="20" y="26" width="200" height="200" rx="52" fill="#874b00" />
          <rect x="20" y="18" width="200" height="200" rx="52" fill="url(#bg3)" />
          <rect x="22" y="20" width="196" height="196" rx="50" stroke="white" stroke-width="2.5" stroke-opacity="0.4" fill="none" />
          <path d="M 64 20 Q 120 18 176 20" stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65" />
          <path d="M 22 70 C 22 38 42 21 72 21 L 168 21 C 110 50 50 100 22 150 Z" fill="url(#gloss3)" />

          <!-- Plinth / Base Ledge -->
          <ellipse cx="120" cy="180" rx="66" ry="11" fill="url(#ledgeShadow3)" />
          <!-- Baseline Shelf -->
          <rect x="52" y="162" width="136" height="12" rx="6" fill="#874b00" opacity="0.6" />
          <rect x="52" y="158" width="136" height="10" rx="5" fill="#fdfefe" />

          <!-- 4 Distinct Rising Bars -->
          <!-- Bar 1 (Shortest) -->
          <rect x="62" y="132" width="22" height="28" rx="8" fill="#e8d3b0" />
          <rect x="62" y="128" width="22" height="28" rx="8" fill="url(#bar1Grad)" />
          <circle cx="73" cy="135" r="3" fill="#e69619" />

          <!-- Bar 2 (Medium-low) -->
          <rect x="92" y="112" width="22" height="48" rx="8" fill="#e8d3b0" />
          <rect x="92" y="108" width="22" height="48" rx="8" fill="url(#bar2Grad)" />
          <circle cx="103" cy="116" r="3" fill="#13756c" />

          <!-- Bar 3 (Tall) -->
          <rect x="122" y="90" width="22" height="70" rx="8" fill="#e8d3b0" />
          <rect x="122" y="86" width="22" height="70" rx="8" fill="url(#bar3Grad)" />
          <circle cx="133" cy="94" r="3" fill="#13756c" />

          <!-- Bar 4 (Hero High Peak Bar - Emerald Teal with Gloss Crown) -->
          <rect x="152" y="66" width="26" height="94" rx="10" fill="#083834" />
          <rect x="152" y="60" width="26" height="94" rx="10" fill="url(#bar4Grad)" />
          <!-- Gloss highlight on hero bar -->
          <path d="M 156 65 L 156 148" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.45" />
          
          <!-- Star / Crown Sparkle over highest bar -->
          <path d="M 165 44 L 167 50 L 173 52 L 167 54 L 165 60 L 163 54 L 157 52 L 163 50 Z" fill="#ffffff" />
        </svg>
      </div>

      <!-- BADGE 4: Pie Chart with One Slice Lifted (Royal Slate Navy / Deep Petrol) -->
      <div class="badge-card w-full max-w-[260px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 240 240" class="w-full h-full block" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg4" x1="24" y1="20" x2="216" y2="220" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1f5268" />
              <stop offset="60%" stop-color="#113647" />
              <stop offset="100%" stop-color="#08202d" />
            </linearGradient>
            <linearGradient id="gloss4" x1="40" y1="20" x2="160" y2="130" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
            </linearGradient>
            <!-- Slice Gradients -->
            <linearGradient id="liftedSliceGrad" x1="130" y1="65" x2="180" y2="120" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ff7f61" />
              <stop offset="100%" stop-color="#e84018" />
            </linearGradient>
            <linearGradient id="baseSliceGrad" x1="70" y1="80" x2="160" y2="170" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#e0eff5" />
            </linearGradient>
            <linearGradient id="tealSliceGrad" x1="60" y1="120" x2="120" y2="180" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#28b3a4" />
              <stop offset="100%" stop-color="#106b61" />
            </linearGradient>
            <radialGradient id="ledgeShadow4" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#031018" stop-opacity="0.6" />
              <stop offset="100%" stop-color="#031018" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Squircle Base -->
          <rect x="20" y="26" width="200" height="200" rx="52" fill="#061822" />
          <rect x="20" y="18" width="200" height="200" rx="52" fill="url(#bg4)" />
          <rect x="22" y="20" width="196" height="196" rx="50" stroke="white" stroke-width="2.5" stroke-opacity="0.35" fill="none" />
          <path d="M 64 20 Q 120 18 176 20" stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
          <path d="M 22 70 C 22 38 42 21 72 21 L 168 21 C 110 50 50 100 22 150 Z" fill="url(#gloss4)" />

          <!-- Plinth Ledge Shadow -->
          <ellipse cx="120" cy="180" rx="66" ry="11" fill="url(#ledgeShadow4)" />

          <!-- Pie Chart Base Body (3D Cylinder depth effect) -->
          <!-- 3D base bevel shadow -->
          <path d="M 62 128 C 62 162 88 176 122 176 C 154 176 178 162 178 128 L 178 136 C 178 170 154 184 122 184 C 88 184 62 170 62 136 Z" fill="#0a2533" />

          <!-- Main 3/4 Circular Base Pie (Cutout at top right) -->
          <!-- Left/Bottom Segment (Soft Pearl White) -->
          <path d="M 116 126 L 116 66 C 84 66 62 90 62 124 C 62 158 88 176 122 176 C 146 176 166 166 174 146 L 116 126 Z" fill="url(#baseSliceGrad)" stroke="#ffffff" stroke-width="1.5" />
          
          <!-- Inner Teal Segment accent in base pie -->
          <path d="M 116 126 L 70 148 C 82 168 102 176 122 176 C 146 176 166 166 174 146 L 116 126 Z" fill="url(#tealSliceGrad)" />

          <!-- The Lifted Pie Slice (Hovering top-right in warm Coral) -->
          <!-- Lifted slice drop-shadow on the pie below -->
          <path d="M 126 120 L 168 108 L 158 132 Z" fill="#092230" opacity="0.4" />
          <!-- 3D side edge of lifted slice -->
          <path d="M 134 114 L 134 122 L 180 84 L 180 76 Z" fill="#ad290b" />
          <path d="M 134 114 L 134 122 L 126 70 L 126 62 Z" fill="#c7320f" />
          <!-- Main Lifted Slice Top Surface -->
          <path d="M 132 112 L 132 58 C 158 58 182 76 182 102 L 132 112 Z" fill="url(#liftedSliceGrad)" stroke="#ffb29e" stroke-width="2" />
          
          <!-- Gloss highlight curve on lifted slice -->
          <path d="M 140 68 C 156 70 172 82 174 94" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" fill="none" />
        </svg>
      </div>

      <!-- BADGE 5: Small Table Grid with Highlighted Row (Forest Pine / Sage) -->
      <div class="badge-card w-full max-w-[260px] aspect-square flex items-center justify-center">
        <svg viewBox="0 0 240 240" class="w-full h-full block" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg5" x1="24" y1="20" x2="216" y2="220" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1d7356" />
              <stop offset="60%" stop-color="#11533e" />
              <stop offset="100%" stop-color="#083829" />
            </linearGradient>
            <linearGradient id="gloss5" x1="40" y1="20" x2="160" y2="130" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
            </linearGradient>
            <linearGradient id="tableGrad5" x1="60" y1="60" x2="180" y2="180" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#f0f7f4" />
            </linearGradient>
            <linearGradient id="highlightRowGrad" x1="58" y1="102" x2="182" y2="130" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffd43f" />
              <stop offset="100%" stop-color="#ffb703" />
            </linearGradient>
            <radialGradient id="ledgeShadow5" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#042118" stop-opacity="0.55" />
              <stop offset="100%" stop-color="#042118" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Squircle Base -->
          <rect x="20" y="26" width="200" height="200" rx="52" fill="#072b20" />
          <rect x="20" y="18" width="200" height="200" rx="52" fill="url(#bg5)" />
          <rect x="22" y="20" width="196" height="196" rx="50" stroke="white" stroke-width="2.5" stroke-opacity="0.35" fill="none" />
          <path d="M 64 20 Q 120 18 176 20" stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
          <path d="M 22 70 C 22 38 42 21 72 21 L 168 21 C 110 50 50 100 22 150 Z" fill="url(#gloss5)" />

          <!-- Plinth Ledge Shadow -->
          <ellipse cx="120" cy="180" rx="66" ry="11" fill="url(#ledgeShadow5)" />

          <!-- The Table Card / Sheet Frame -->
          <rect x="52" y="72" width="136" height="104" rx="18" fill="#0d4030" />
          <rect x="52" y="66" width="136" height="104" rx="18" fill="url(#tableGrad5)" stroke="#ffffff" stroke-width="2" />

          <!-- Table Header Bar -->
          <path d="M 52 82 C 52 73 59 66 68 66 L 172 66 C 181 66 188 73 188 82 L 188 92 L 52 92 Z" fill="#e2efe9" />
          <!-- Header Column Pills -->
          <rect x="64" y="75" width="28" height="8" rx="4" fill="#145741" opacity="0.6" />
          <rect x="104" y="75" width="34" height="8" rx="4" fill="#145741" opacity="0.4" />
          <rect x="150" y="75" width="24" height="8" rx="4" fill="#145741" opacity="0.4" />

          <!-- Row 1 (Normal) -->
          <line x1="56" y1="102" x2="184" y2="102" stroke="#e2ece7" stroke-width="1.5" />
          <circle cx="70" cy="98" r="3.5" fill="#a4c7b8" />
          <rect x="80" y="96" width="20" height="5" rx="2.5" fill="#cbe0d7" />
          <rect x="108" y="96" width="30" height="5" rx="2.5" fill="#cbe0d7" />
          <rect x="152" y="96" width="22" height="5" rx="2.5" fill="#cbe0d7" />

          <!-- Row 2: THE HIGHLIGHTED ROW (Warm Amber Golden Glow) -->
          <!-- 3D popped row effect extending slightly -->
          <rect x="48" y="107" width="144" height="28" rx="8" fill="#d99b00" />
