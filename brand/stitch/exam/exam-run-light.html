<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite TOEIC Mock Test — Part 5 Reading in Progress (Bright Day)</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            'cream-bg': '#FFF9F3',
            'card-bg': '#FFFFFF',
            'ink-primary': '#1A1816',
            'ink-secondary': '#6B5B4E',
            'ink-muted': '#8A7969',
            'teal-brand': '#136B66',
            'teal-light': '#E6F4F2',
            'teal-border': '#208781',
            'teal-active': '#0D5652',
            'orange-brand': '#F59E0B',
            'orange-dark': '#B45309',
            'orange-ink': '#1C1003',
            'border-subtle': '#EDE2D6',
            'border-card': '#E8DACB',
            'ledge-card': '#E0CEBC',
            'ledge-btn': '#D9C8B5',
            'ledge-orange': '#B45309',
            'track-bg': '#EFE4D6',
          },
          boxShadow: {
            'card-ledge': '0 5px 0 0 #E0CEBC',
            'btn-ledge': '0 5px 0 0 #D9C8B5',
            'btn-orange': '0 6px 0 0 #B45309',
            'btn-teal': '0 5px 0 0 #0C4D49',
            'chip-ledge': '0 3px 0 0 #E0CEBC',
          }
        }
      }
    }
  </script>
  <style>
    /* Physical tactile button active states */
    .tactile-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 var(--ledge-color, #D9C8B5) !important;
    }
    .tactile-orange:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 0 #B45309 !important;
    }
    /* Smooth transition */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-[#FFF9F3] text-ink-primary font-sans antialiased min-h-screen flex justify-center p-0 m-0">

  <!-- PHONE VIEWPORT: Exactly 390px, one column, warm cream, no device frame -->
  <main class="w-[390px] min-h-screen bg-[#FFF9F3] flex flex-col relative pb-[88px]">

    <!-- TOP BAR 56px (Variant: FOCUS mode for test in progress) -->
    <!-- Contains: round close (X) button, thick rounded progress bar (question 128 of 200), countdown clock chip (52:14 left) -->
    <header class="h-[56px] px-4 flex items-center justify-between gap-3 sticky top-0 bg-[#FFF9F3]/95 backdrop-blur-sm z-30 border-b border-[#F0E4D5]">
      <!-- Close (X) button: round tactile button -->
      <button type="button" aria-label="Exit test"
              class="w-10 h-10 rounded-full bg-white border-2 border-border-card shadow-[0_3px_0_0_#E0CEBC] flex items-center justify-center text-ink-primary hover:bg-[#FFFDF9] tactile-btn transition-transform">
        <svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Thick rounded progress bar with 128/200 progress (64%) -->
      <div class="flex-1 flex flex-col justify-center">
        <div class="flex items-center justify-between text-[11px] font-bold text-ink-secondary mb-1">
          <span>Q 128 of 200</span>
          <span class="text-teal-brand font-extrabold">64%</span>
        </div>
        <div class="w-full h-3 bg-track-bg rounded-full overflow-hidden p-[2px] border border-border-card/60">
          <div class="h-full bg-teal-brand rounded-full transition-all duration-300 shadow-[inset_0_1px_0_rgba(255,255,255,0.4)]"
               style="width: 64%;"></div>
        </div>
      </div>

      <!-- Small Status Chip: Countdown clock reading 52:14 left -->
      <div class="h-9 px-2.5 rounded-full bg-white border-2 border-border-card shadow-[0_2px_0_0_#E0CEBC] flex items-center gap-1.5 shrink-0">
        <!-- Clock icon -->
        <svg class="w-4 h-4 text-orange-brand" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 2" />
        </svg>
        <span class="text-[12px] font-extrabold tracking-tight text-ink-primary font-mono">52:14</span>
      </div>
    </header>

    <!-- CONTENT BODY (16px side margins, 8px grid rhythm) -->
    <div class="px-4 pt-3 flex flex-col gap-3">

      <!-- SLIM SUB-HEADER ROW: Section Label + Round Flag Toggle Button -->
      <div class="flex items-center justify-between pt-1">
        <!-- Section badge & label -->
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-[#E6F4F2] border border-[#208781]/30 text-[11px] font-extrabold text-teal-brand uppercase tracking-wider">
            Part 5
          </span>
          <span class="text-[13px] font-bold text-ink-secondary">Incomplete Sentences</span>
        </div>

        <!-- Round Flag-for-Review toggle button -->
        <button type="button" aria-label="Flag question for review"
                class="w-9 h-9 rounded-full bg-white border-2 border-border-card shadow-[0_3px_0_0_#E0CEBC] flex items-center justify-center text-ink-secondary hover:border-orange-brand hover:text-orange-brand tactile-btn transition-all group">
          <svg class="w-4 h-4 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H19a2 2 0 012 2v7a2 2 0 01-2 2h-6.5l-1-1H5a2 2 0 00-2 2zm9-13.5V11" />
          </svg>
        </button>
      </div>

      <!-- MAIN QUESTION CARD: 16px radius, 2px border, 5px bottom ledge -->
      <section class="bg-card-bg rounded-[16px] border-2 border-border-card shadow-card-ledge p-4 flex flex-col gap-4">

        <!-- Question Header & Instruction -->
        <div class="flex items-center justify-between border-b border-[#F4EBE0] pb-2.5">
          <div class="flex items-center gap-2">
            <!-- Question Number Indicator -->
            <span class="w-7 h-7 rounded-lg bg-[#F8EDE1] text-teal-brand font-black text-[13px] flex items-center justify-center border border-border-card">
              128
            </span>
            <span class="text-[12px] font-bold text-ink-muted uppercase tracking-wider">Reading Comprehension</span>
          </div>
          <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#FFF5EB] text-orange-dark border border-orange-brand/30">
            1 Mark
          </span>
        </div>

        <!-- Question Sentence with Prominent Blank -->
        <div class="text-[16px] leading-[1.6] font-bold text-ink-primary">
          <span>The marketing team decided to </span>
          <!-- The Blank: tactile pill style blank -->
          <span class="inline-flex items-center justify-center px-3 py-0.5 mx-1 min-w-[90px] h-[28px] rounded-lg bg-[#E6F4F2] border-2 border-teal-border text-teal-brand font-black text-[15px] shadow-[inset_0_2px_2px_rgba(19,107,102,0.1)] align-middle">
            extend
          </span>
          <span> the promotional campaign after observing an unprecedented surge in online customer engagement.</span>
        </div>

        <!-- Subtitle Prompt -->
        <p class="text-[12px] font-medium text-ink-secondary -mt-1">
          Select the word that best completes the sentence.
        </p>

        <!-- FOUR TALL TACTILE ANSWER ROWS (A to D) -->
        <div class="flex flex-col gap-2.5 pt-1" role="radiogroup" aria-label="Answer options">

          <!-- OPTION A (SELECTED: Teal border, filled teal letter badge, soft tinted background) -->
          <label class="relative flex items-center gap-3 p-3 rounded-[14px] bg-[#EAF6F5] border-2 border-teal-border shadow-[0_4px_0_0_#0D5652] cursor-pointer transition-transform active:translate-y-1">
            <input type="radio" name="toeic_answer" value="A" class="sr-only" checked>
            <!-- Letter Badge A: Filled Teal Badge -->
            <div class="w-9 h-9 rounded-xl bg-teal-brand text-white font-black text-[15px] flex items-center justify-center shrink-0 shadow-[0_2px_0_0_#093E3B]">
              A
            </div>
            <!-- Word Option Text -->
            <div class="flex-1">
              <span class="text-[16px] font-extrabold text-teal-brand tracking-tight">extend</span>
              <span class="text-[12px] font-medium text-teal-active block">base verb</span>
            </div>
            <!-- Selected checkmark indicator -->
            <div class="w-6 h-6 rounded-full bg-teal-brand text-white flex items-center justify-center shrink-0 shadow-sm">
              <svg class="w-3.5 h-3.5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            </div>
          </label>

          <!-- OPTION B: Unselected, tall tactile white card with 2px border and ledge -->
          <label class="relative flex items-center gap-3 p-3 rounded-[14px] bg-white border-2 border-border-card shadow-[0_4px_0_0_#E0CEBC] cursor-pointer hover:bg-[#FFFDF9] transition-all active:translate-y-1">
            <input type="radio" name="toeic_answer" value="B" class="sr-only">
            <!-- Letter Badge B: Light Neutral Pill Badge -->
            <div class="w-9 h-9 rounded-xl bg-[#F8EDE1] text-ink-primary font-black text-[15px] flex items-center justify-center shrink-0 border border-border-card">
              B
            </div>
            <!-- Word Option Text -->
            <div class="flex-1">
              <span class="text-[16px] font-bold text-ink-primary tracking-tight">extension</span>
              <span class="text-[12px] font-medium text-ink-muted block">noun</span>
            </div>
            <!-- Empty radio indicator circle -->
            <div class="w-5 h-5 rounded-full border-2 border-border-card shrink-0 bg-[#FFFDF9]"></div>
          </label>

          <!-- OPTION C: Unselected, tall tactile white card -->
          <label class="relative flex items-center gap-3 p-3 rounded-[14px] bg-white border-2 border-border-card shadow-[0_4px_0_0_#E0CEBC] cursor-pointer hover:bg-[#FFFDF9] transition-all active:translate-y-1">
            <input type="radio" name="toeic_answer" value="C" class="sr-only">
            <!-- Letter Badge C -->
            <div class="w-9 h-9 rounded-xl bg-[#F8EDE1] text-ink-primary font-black text-[15px] flex items-center justify-center shrink-0 border border-border-card">
              C
            </div>
            <!-- Word Option Text -->
            <div class="flex-1">
              <span class="text-[16px] font-bold text-ink-primary tracking-tight">extensive</span>
              <span class="text-[12px] font-medium text-ink-muted block">adjective</span>
            </div>
            <!-- Empty radio indicator circle -->
            <div class="w-5 h-5 rounded-full border-2 border-border-card shrink-0 bg-[#FFFDF9]"></div>
          </label>

          <!-- OPTION D: Unselected, tall tactile white card -->
          <label class="relative flex items-center gap-3 p-3 rounded-[14px] bg-white border-2 border-border-card shadow-[0_4px_0_0_#E0CEBC] cursor-pointer hover:bg-[#FFFDF9] transition-all active:translate-y-1">
            <input type="radio" name="toeic_answer" value="D" class="sr-only">
            <!-- Letter Badge D -->
            <div class="w-9 h-9 rounded-xl bg-[#F8EDE1] text-ink-primary font-black text-[15px] flex items-center justify-center shrink-0 border border-border-card">
              D
            </div>
            <!-- Word Option Text -->
            <div class="flex-1">
              <span class="text-[16px] font-bold text-ink-primary tracking-tight">extensively</span>
              <span class="text-[12px] font-medium text-ink-muted block">adverb</span>
            </div>
            <!-- Empty radio indicator circle -->
            <div class="w-5 h-5 rounded-full border-2 border-border-card shrink-0 bg-[#FFFDF9]"></div>
          </label>

        </div>

      </section>

      <!-- EXAM HELPER NOTE (Calm & Focused Academic Polish) -->
      <div class="flex items-center justify-between px-1 py-0.5 text-[11px] text-ink-muted font-medium">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-teal-brand animate-pulse"></span>
          Answers automatically saved
        </span>
        <button type="button" class="underline hover:text-teal-brand font-semibold">
          Shortcuts: 1-4 or A-D
        </button>
      </div>

    </div>

    <!-- BOTTOM FIXED BAR (Exactly 390px, pinned at bottom) -->
    <!-- Contains: Round previous button, Wide secondary Question Map button (127 / 200 answered), Orange primary Next button -->
    <footer class="fixed bottom-0 w-[390px] h-[76px] bg-[#FFF9F3]/95 backdrop-blur-md border-t border-[#EDE0D2] px-4 flex items-center justify-between gap-2.5 z-40">
      
      <!-- 1. Round Previous-Arrow Button -->
      <button type="button" aria-label="Previous question"
              class="w-12 h-12 rounded-[14px] bg-white border-2 border-border-card shadow-[0_4px_0_0_#E0CEBC] flex items-center justify-center text-ink-primary hover:bg-[#FFFDF9] tactile-btn transition-transform shrink-0">
        <svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- 2. Wide Secondary Button: Small grid icon + 127 / 200 answered (opens question map) -->
      <button type="button" aria-label="Open question map sheet"
              class="flex-1 h-12 px-3 rounded-[14px] bg-white border-2 border-border-card shadow-[0_4px_0_0_#E0CEBC] flex items-center justify-center gap-2 text-ink-primary hover:bg-[#FFFDF9] tactile-btn transition-transform">
        <!-- 3x3 Grid Icon -->
        <svg class="w-4 h-4 text-teal-brand shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
        <span class="text-[13px] font-extrabold tracking-tight text-ink-primary whitespace-nowrap">
          <span class="text-teal-brand">127</span> / 200 answered
        </span>
      </button>

      <!-- 3. Primary Candy-Orange Next Button: 6px darker ledge, deep brown-black label -->
      <button type="button" aria-label="Next question"
              class="min-w-[100px] h-12 px-4 rounded-[14px] bg-orange-brand border-2 border-[#D97706] shadow-btn-orange flex items-center justify-center gap-1 text-orange-ink font-black text-[15px] tactile-orange transition-transform shrink-0">
        <span>Next</span>
        <svg class="w-4 h-4 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>

    </footer>

  </main>

</body>
</html>
