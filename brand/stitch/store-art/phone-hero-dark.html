<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
    
    /* Device tactile lighting & perspective sheen */
    .device-shadow {
      box-shadow: 
        0 35px 70px -15px rgba(0, 0, 0, 0.9),
        0 15px 30px -10px rgba(5, 16, 19, 0.8),
        0 0 120px -20px rgba(107, 216, 206, 0.15);
    }
    
    .tactile-bezel {
      box-shadow: 
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -2px 4px 0 rgba(0, 0, 0, 0.8),
        inset 1px 0 2px 0 rgba(255, 255, 255, 0.15),
        inset -1px 0 2px 0 rgba(0, 0, 0, 0.6);
    }

    .bubble-ledge {
      box-shadow: 
        0 5px 0 0 #071518,
        0 14px 28px -6px rgba(0, 0, 0, 0.55),
        0 0 35px rgba(107, 216, 206, 0.08);
    }

<body class="bg-[#040B0D] text-on-surface antialiased m-0 p-0 overflow-hidden select-none flex items-center justify-center min-h-screen">
<!-- Fixed Aspect Ratio Store Listing Canvas (9:19.5, optimal 886px x 1920px scalable frame) -->
<main class="relative w-full max-w-[500px] aspect-[9/19.5] max-h-screen bg-gradient-to-b from-[#061113] via-[#081518] to-[#040A0C] overflow-hidden flex flex-col justify-between shadow-2xl">
<!-- Directional Atmospheric Lighting Gradients -->
<!-- Top-Left Soft Key Light -->
<div class="pointer-events-none absolute -top-24 -left-24 w-[420px] h-[420px] rounded-full bg-gradient-to-br from-primary/20 via-surface-tint/5 to-transparent blur-[80px]"></div>
<!-- Device Ambient Backlight (Teal & Warm Diffuse Halo) -->
<div class="pointer-events-none absolute top-[36%] right-[-10%] w-[380px] h-[480px] rounded-full bg-primary/10 blur-[100px]"></div>
<div class="pointer-events-none absolute top-[45%] left-[10%] w-[320px] h-[360px] rounded-full bg-[#F2553B]/10 blur-[90px]"></div>
<!-- Grounded Floor Glow / Ambient Pedestal -->
<div class="pointer-events-none absolute -bottom-16 left-1/2 -translate-x-1/2 w-[120%] h-56 bg-gradient-to-t from-primary/15 via-[#051013]/90 to-transparent blur-2xl"></div>
<!-- TOP THIRD: Identity & Focal Typography -->
<header class="relative z-20 pt-8 px-7 flex flex-col gap-5">
<!-- Logo Row -->
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-gradient-to-b from-[#2BA39A] to-[#12504B] p-[2px] shadow-[0_4px_0_0_#0C312E,0_8px_16px_rgba(0,0,0,0.4)] flex items-center justify-center" id="lk-logo">
<div class="w-full h-full rounded-[10px] bg-gradient-to-br from-[#6BD8CE] to-[#2BA39A] flex items-center justify-center">
<span class="material-symbols-outlined text-[#00322E] text-[22px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">send</span>
</div>
</div>
<span class="font-display text-[26px] font-extrabold tracking-tight text-white leading-none">Lexkite</span>
</div>
<!-- Hero Headline with Contrast-Proof Typography -->
<div class="flex flex-col gap-3">
<h1 class="font-display text-[44px] sm:text-[50px] font-extrabold tracking-tight text-[#F0FAF9] leading-[1.08] drop-shadow-sm" id="lk-headline">
          Speak English with <span class="text-[#F2553B] font-extrabold inline-block relative drop-shadow-[0_2px_12px_rgba(242,85,59,0.35)]" id="lk-em">confidence</span>
</h1>
<p class="font-body text-[16px] sm:text-[18px] font-medium text-[#A6C2C0] leading-snug max-w-[340px] tracking-normal" id="lk-sub">
          Daily interactive bite-sized lessons designed for real fluency.
        </p>
</div>
</header>
<!-- LOWER TWO THIRDS: 3D Perspective Phone Stage + Character Host Area -->
<section class="relative z-10 w-full h-[64%] flex items-end justify-center pointer-events-none">
<!-- Ambient Floor Contact Shadow underneath all foreground elements -->
<div class="absolute bottom-0 w-full h-24 bg-gradient-to-t from-[#020506] via-[#020506]/80 to-transparent z-30"></div>
<!-- Modern Smartphone Mockup -->
<!-- Gracefully running off the bottom edge, angled/offset to the right -->
<div class="absolute -bottom-10 right-[-10px] w-[76%] max-w-[360px] h-[98%] z-10 transform translate-x-2">
<!-- Phone Outer Chassis with directional light-catching edge -->
<div class="relative w-full h-full rounded-t-[52px] bg-[#162125] p-[10px] pb-0 tactile-bezel device-shadow border-t border-l border-white/25 border-r border-white/10">
<!-- Inner Titanium Rim Highlight -->
<div class="w-full h-full rounded-t-[44px] bg-[#0A1618] p-[3px] pb-0 border-t border-white/10">
<!-- Dynamic Island Speaker/Sensor Pill Anchor -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 w-24 h-6 bg-[#030809] rounded-full z-40 flex items-center justify-center gap-2 border border-white/5">
<div class="w-2.5 h-2.5 rounded-full bg-[#0E1A1C] border border-white/10"></div>
<div class="w-1.5 h-1.5 rounded-full bg-[#182F33]"></div>
</div>
<!-- Sleek Glass Specular Sheen (Top Corner Gloss) -->
<div class="pointer-events-none absolute inset-x-3 top-3 h-48 rounded-t-[40px] bg-gradient-to-br from-white/15 via-white/[0.03] to-transparent z-30"></div>
<!-- THE PHONE SCREEN CONTAINER (Empty as strictly mandated) -->
<div class="w-full h-full rounded-t-[40px] bg-gradient-to-b from-[#091518] via-[#0E2024] to-[#061113] overflow-hidden relative shadow-inner" id="lk-screen">
</div>
</div>
</div>
</div>
<!-- Lower Left Teacher Anchor & Interactive Speech Bubble Cluster -->
<div class="absolute left-4 bottom-0 z-40 flex flex-col items-start w-[58%] h-[82%] pointer-events-none">
<!-- Tactile Speech Bubble (Placed right above the teacher anchor) -->
<div class="relative mb-auto mt-2 ml-1 z-50">
<div class="relative inline-flex items-center px-4 py-2.5 bg-[#0E2226] border border-primary/30 rounded-2xl bubble-ledge" id="lk-bubble">
<!-- Subtle Top Gloss Accent -->
<div class="absolute inset-x-2 top-0.5 h-[1px] bg-white/25 rounded-full"></div>
<p class="font-label text-[14px] leading-tight font-extrabold tracking-wide text-[#E6F8F6] drop-shadow-sm whitespace-nowrap">
              Hi! Ready to talk?
            </p>
<!-- Tactile Speech Tail pointing diagonally down-left toward teacher anchor -->
<div class="absolute -bottom-2.5 left-5 w-4 h-4 bg-[#0E2226] border-r border-b border-primary/30 transform rotate-45"></div>
</div>
</div>
<!-- THE TEACHER SPOT CONTAINER (Empty transparent slot as strictly mandated) -->
<div class="w-full h-full min-h-[300px] mt-auto" id="lk-teacher"></div>
</div>
</section>
</main>
