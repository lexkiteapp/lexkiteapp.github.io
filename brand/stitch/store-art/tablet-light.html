<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Store Listing Poster</title>
  <!-- Google Fonts: Plus Jakarta Sans for tactile premium feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            'lk-bg': '#FFF8F5',
            'lk-surface': '#FFF1E8',
            'lk-surface-low': '#FFEADB',
            'lk-teal': '#00504B',
            'lk-teal-dark': '#003834',
            'lk-teal-light': '#14766E',
            'lk-sub': '#3D5450',
            'lk-coral': '#E45B3E',
            'lk-orange': '#F59E0B',
            'lk-amber': '#D97706',
          }
        }
      }
    }
  </script>
  <style>
    /* 3:4 portrait poster stage setup */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ECE3DC;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
    }

    #poster-canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 900px;
      max-height: 1200px;
      aspect-ratio: 3 / 4;
      background: linear-gradient(175deg, #FFF9F6 0%, #FFF4ED 55%, #FDE9DC 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -15px rgba(45, 25, 15, 0.18), 0 0 0 1px rgba(100, 60, 40, 0.05);
    }

    /* Directional soft lighting from top-left */
    .directional-lighting {
      position: absolute;
      top: -15%;
      left: -15%;
      width: 70%;
      height: 60%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Ambient warm glow in top-right */
    .ambient-glow {
      position: absolute;
      top: 10%;
      right: -10%;
      width: 50%;
      height: 45%;
      background: radial-gradient(circle, rgba(255, 225, 205, 0.45) 0%, rgba(255, 225, 205, 0) 75%);
      pointer-events: none;
      z-index: 1;
    }

    /* Speech bubble tail pointing directly down to teacher */
    .bubble-tail::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 36px;
      width: 22px;
      height: 22px;
      background: #FFFFFF;
      border-right: 2px solid #EEDCD0;
      border-bottom: 2px solid #EEDCD0;
      transform: rotate(45deg);
      border-bottom-right-radius: 4px;
    }

    /* Realistic tactile tablet shadows */
    .tablet-chassis {
      background: #182226;
      box-shadow: 
        0 40px 80px -15px rgba(24, 34, 38, 0.28),
        0 20px 40px -10px rgba(0, 80, 75, 0.15),
        0 0 0 1.5px rgba(255, 255, 255, 0.12) inset,
        0 8px 0 0 #0C1215;
    }

    .tablet-bezel {
      background: #0B1113;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- Main Store Listing Poster 3:4 -->
  <main id="poster-canvas" role="region" aria-label="Store Listing Poster">
    
    <!-- Directional Lighting Overlays -->
    <div class="directional-lighting" aria-hidden="true"></div>
    <div class="ambient-glow" aria-hidden="true"></div>

    <!-- Top Quarter: Brand Row & Massive Headline -->
    <header class="relative z-10 pt-10 sm:pt-14 px-8 sm:px-14 flex flex-col gap-4 sm:gap-6 flex-shrink-0">
      
      <!-- Logo Row -->
      <div class="flex items-center gap-3.5">
        <div id="lk-logo" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-lk-teal flex items-center justify-center shadow-[0_3px_0_0_#003834] flex-shrink-0" aria-label="Lexkite Logo Square">
          <!-- Geometric Kite Icon / Mark in brand cream -->
          <svg class="w-5 h-5 text-lk-bg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2L20 10L12 22L4 10L12 2Z" />
          </svg>
        </div>
        <span class="text-xl sm:text-2xl font-extrabold tracking-tight text-lk-teal">Lexkite</span>
      </div>

      <!-- Hero Headline with Accent Emphasis & Subheading -->
      <div class="space-y-2.5 sm:space-y-3.5 max-w-2xl">
        <h1 id="lk-headline" class="text-4xl sm:text-5xl md:text-[3.5rem] leading-[1.12] sm:leading-[1.1] font-black text-lk-teal tracking-tight">
          Speak English with <span id="lk-em" class="text-lk-coral underline decoration-lk-coral/30 decoration-wavy decoration-2 underline-offset-8">confidence</span>
        </h1>
        <p id="lk-sub" class="text-lg sm:text-xl font-semibold text-lk-sub leading-snug tracking-normal">
          Interactive bite-sized speaking drills with instant feedback
        </p>
      </div>

    </header>

    <!-- Main Visual Stage: Centered Tablet running off the bottom edge + Teacher Slot with Speech Bubble -->
    <div class="relative flex-1 w-full mt-4 sm:mt-6 flex justify-center items-end overflow-hidden z-10">
      
      <!-- Realistic Modern Tablet Frame -->
      <div class="tablet-chassis w-[84%] max-w-[680px] h-[105%] rounded-t-[40px] sm:rounded-t-[48px] p-3 sm:p-4 pb-0 flex flex-col relative z-10 transition-transform">
        
        <!-- Screen Bezel wrapper -->
        <div class="tablet-bezel w-full h-full rounded-t-[30px] sm:rounded-t-[36px] p-2.5 sm:p-3 pb-0 flex flex-col">
          
          <!-- Tablet Front Camera Notch / Mic indicator -->
          <div class="w-full flex justify-center items-center h-3 sm:h-4 mb-1">
            <div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-700/60 flex items-center justify-center">
              <div class="w-1 h-1 rounded-full bg-teal-950/80"></div>
            </div>
          </div>

          <!-- Tablet Display: Empty rounded element id="lk-screen" running off bottom -->
          <div id="lk-screen" class="w-full h-full rounded-t-[22px] sm:rounded-t-[26px] bg-[#FFFBF8] border border-[#F2E4DA] shadow-[inset_0_2px_8px_rgba(0,0,0,0.04)] overflow-hidden relative flex flex-col justify-between" aria-label="Tablet Display Content Area">
            
            <!-- Subtle mock UI header bar inside the tablet screen to give realistic depth while keeping screen free for real content -->
            <div class="w-full px-5 py-3.5 border-b border-[#F4E9E2] bg-[#FFFBF8] flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-lk-teal/20"></div>
                <div class="w-16 h-2 rounded-full bg-[#EAD8CD]"></div>
              </div>
              <div class="flex items-center gap-2">
                <div class="w-8 h-2 rounded-full bg-[#EAD8CD]"></div>
                <div class="w-4 h-4 rounded-full bg-lk-coral/20"></div>
              </div>
            </div>

            <!-- Gentle ambient watermarking inside tablet screen to preserve composition fidelity -->
            <div class="flex-1 w-full p-6 flex flex-col gap-4">
              <div class="w-2/3 h-4 rounded-lg bg-[#F8EFE9]"></div>
              <div class="w-full grid grid-cols-2 gap-3.5 mt-2">
                <div class="h-28 rounded-2xl bg-[#FBF5F0] border border-[#F2E5DC]/80 p-4 flex flex-col justify-between">
                  <div class="w-8 h-8 rounded-xl bg-lk-teal/10"></div>
                  <div class="space-y-1.5">
                    <div class="w-3/4 h-2.5 rounded bg-[#EAD8CD]"></div>
                    <div class="w-1/2 h-2 rounded bg-[#F2E5DC]"></div>
                  </div>
                </div>
                <div class="h-28 rounded-2xl bg-[#FBF5F0] border border-[#F2E5DC]/80 p-4 flex flex-col justify-between">
                  <div class="w-8 h-8 rounded-xl bg-lk-coral/10"></div>
                  <div class="space-y-1.5">
                    <div class="w-3/4 h-2.5 rounded bg-[#EAD8CD]"></div>
                    <div class="w-1/2 h-2 rounded bg-[#F2E5DC]"></div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div>

      <!-- Lower Left Teacher Anchor & Friendly Speech Bubble -->
      <div class="absolute left-6 sm:left-14 bottom-0 z-20 flex flex-col items-start pointer-events-none">
        
        <!-- Speech Bubble id="lk-bubble" positioned above teacher -->
        <div id="lk-bubble" class="bubble-tail relative mb-3.5 px-5 py-3 sm:px-6 sm:py-3.5 bg-white text-lk-teal font-extrabold text-base sm:text-lg rounded-2xl shadow-[0_12px_28px_-6px_rgba(45,25,15,0.18),0_3px_0_0_#EEDCD0] border border-[#EEDCD0] tracking-tight">
          Hi! Ready to talk?
        </div>

        <!-- Empty 2D Teacher Slot id="lk-teacher" (no background, no border, standing to bottom edge) -->
        <div id="lk-teacher" class="w-40 sm:w-56 h-56 sm:h-72 flex items-end justify-center pointer-events-auto" aria-label="Teacher Slot Anchor">
          <!-- Intentionally empty element with no background or border as required -->
        </div>

      </div>

    </div>

  </main>

</body>
</html>
