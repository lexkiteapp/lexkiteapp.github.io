<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite — Store Listing Poster Frame (Bright Day)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            cream: {
              50: '#FFFAF3',
              100: '#FFF7EA',
              200: '#F9F1E2',
              300: '#EDE2CE',
            },
            teal: {
              ink: '#0D383B',
              deep: '#0F3D3E',
              accent: '#2BA39A',
              light: '#E2F7F5',
            },
            coral: {
              accent: '#F2553B',
              soft: '#FF7D66',
              bg: '#FFEFEA',
            },
          },
          boxShadow: {
            'tactile': '0 8px 0 0 rgba(216, 207, 188, 0.8)',
            'bubble': '0 12px 24px -6px rgba(15, 61, 62, 0.12), 0 4px 0 0 #D8CFBC',
            'phone': '-18px 24px 50px -10px rgba(15, 61, 62, 0.22), 0 10px 0 0 #2A3639',
          }
        }
      }
    }
  </script>
  <style>
    /* Fixed 9:19.5 aspect ratio viewport emulation and poster styling */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFF7EA;
      color: #0F3D3E;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Speech bubble tail pointing left-down towards the teacher standing spot */
    .bubble-tail::after {
      content: '';
      position: absolute;
      bottom: -14px;
      left: 36px;
      width: 24px;
      height: 24px;
      background: #FFFFFF;
      border-right: 2.5px solid #E6D8C3;
      border-bottom: 2.5px solid #E6D8C3;
      transform: rotate(45deg);
      box-shadow: 2px 2px 0 0 rgba(216, 207, 188, 0.6);
      border-bottom-right-radius: 4px;
    }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-0 m-0 select-none">

  <!-- Fixed Poster Container with 9 : 19.5 store listing proportion (~414px x 896px or full responsive height) -->
  <main class="relative w-full max-w-[440px] h-full max-h-[960px] bg-gradient-to-b from-[#FFFDF9] via-[#FFF7EA] to-[#F5ECE0] overflow-hidden flex flex-col justify-between shadow-2xl border border-cream-300">
    
    <!-- Top Left Soft Directional Sunlight Ambient Glow -->
    <div class="pointer-events-none absolute -top-24 -left-24 w-96 h-96 bg-gradient-to-br from-amber-100/70 via-teal-light/40 to-transparent rounded-full blur-3xl z-0"></div>
    <div class="pointer-events-none absolute top-1/3 -right-20 w-80 h-80 bg-teal-accent/10 rounded-full blur-2xl z-0"></div>

    <!-- Top Third: Branding Row & Massive Thumbnail-Readable Headline -->
    <header class="relative z-10 pt-8 sm:pt-10 px-6 sm:px-8 flex flex-col gap-3 sm:gap-4 shrink-0">
      
      <!-- Logo Row: Square icon container + Wordmark -->
      <div class="flex items-center gap-2.5">
        <div id="lk-logo" class="w-8 h-8 rounded-xl bg-teal-deep text-white flex items-center justify-center shadow-[0_3px_0_0_#072425] border border-teal-ink/20 shrink-0" aria-label="Lexkite Logo Container">
          <!-- Minimalist tactile geometric kite emblem inside placeholder -->
          <svg class="w-4 h-4 text-teal-accent fill-current" viewBox="0 0 24 24">
            <path d="M12 2L20 10L12 22L4 10L12 2Z"/>
          </svg>
        </div>
        <span class="font-black text-xl sm:text-2xl tracking-tight text-teal-deep">Lexkite</span>
      </div>

      <!-- Super Large Bold Headline for high thumbnail impact & retention -->
      <h1 id="lk-headline" class="font-extrabold text-[32px] sm:text-[38px] leading-[1.12] tracking-tight text-teal-deep text-balance">
        Speak English with <span id="lk-em" class="text-coral-accent underline decoration-coral-soft/50 decoration-wavy decoration-2">confidence</span>
      </h1>

      <!-- Subheadline slot with generous breathing space, wrapping naturally -->
      <p id="lk-sub" class="font-semibold text-sm sm:text-base leading-relaxed text-[#234F51] max-w-[92%] text-balance">
        Bite-sized conversational drills that make fluency natural and fun.
      </p>

    </header>

    <!-- Lower Two Thirds: Composition Zone (Phone Mockup + Teacher Standee + Bubble + Ambient Floor Glow) -->
    <section class="relative flex-1 w-full min-h-[460px] overflow-hidden z-10">

      <!-- Soft ground floor illumination tying phone and character standee -->
      <div class="pointer-events-none absolute -bottom-10 left-1/2 -translate-x-1/2 w-[120%] h-36 bg-gradient-to-t from-[#EAD9C2]/90 via-[#F3E7D5]/40 to-transparent blur-xl z-0"></div>
      <div class="pointer-events-none absolute bottom-4 left-6 w-56 h-12 bg-[#0F3D3E]/12 rounded-full blur-lg z-0 transform -rotate-2"></div>

      <!-- Modern Realistic Phone: Slim dark bezels, metal rim, off-centre to the right, bleeding off bottom edge -->
      <div class="absolute -right-6 sm:-right-4 top-6 sm:top-8 w-[270px] sm:w-[290px] h-[580px] sm:h-[620px] rounded-[44px] bg-[#182326] p-[9px] shadow-phone border-[2.5px] border-[#39494D] z-10 transform translate-x-2 sm:translate-x-0">
        
        <!-- Premium polished metallic chassis bevel highlight -->
        <div class="absolute inset-0 rounded-[44px] border border-white/20 pointer-events-none"></div>
        <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-20 h-4 bg-[#233336] rounded-b-xl z-30 flex items-center justify-center">
          <!-- Dynamic Island / Speaker slit capsule -->
          <div class="w-10 h-1 bg-[#10191B] rounded-full"></div>
        </div>

        <!-- Phone Screen Frame: Fills entire rounded element with required id="lk-screen" -->
        <div id="lk-screen" class="relative w-full h-full rounded-[36px] bg-gradient-to-b from-[#0A181B] via-[#0E2327] to-[#122F34] overflow-hidden border border-white/10 shadow-inner flex flex-col p-4">
          
          <!-- Subtle preview screen UI hints inside the placeholder screen container -->
          <div class="w-full flex justify-between items-center text-[10px] text-teal-accent/80 font-bold pt-1 px-2">
            <span>9:41</span>
            <div class="flex items-center gap-1.5">
              <span class="inline-block w-2.5 h-2.5 rounded-full bg-teal-accent/70"></span>
              <span class="inline-block w-4 h-2 rounded-sm border border-teal-accent/70"></span>
            </div>
          </div>

          <!-- Lesson card simulation placeholder inside lk-screen -->
          <div class="mt-8 mx-auto w-full max-w-[210px] rounded-2xl bg-[#142F33]/90 border border-teal-accent/30 p-3.5 shadow-lg flex flex-col gap-2.5">
            <div class="flex items-center gap-2">
              <div class="w-6 h-6 rounded-lg bg-coral-accent text-white flex items-center justify-center font-black text-xs shadow-sm">
                A
              </div>
              <span class="text-xs font-bold text-white/95 tracking-wide">Interactive Dialog</span>
            </div>
            <div class="h-2 w-3/4 rounded-full bg-teal-accent/30"></div>
            <div class="h-2 w-1/2 rounded-full bg-white/20"></div>

            <div class="mt-2 p-2 rounded-xl bg-[#091719] border border-teal-accent/20 flex items-center gap-2">
              <div class="w-5 h-5 rounded-full bg-teal-accent/30 flex items-center justify-center text-teal-accent text-[10px]">
                ▶
              </div>
              <div class="h-1.5 w-16 bg-teal-accent/40 rounded-full"></div>
            </div>
          </div>

          <!-- Bottom CTA simulator on phone screen -->
          <div class="mt-auto mb-10 w-full px-2">
            <div class="w-full py-2.5 rounded-xl bg-gradient-to-r from-coral-accent to-coral-soft text-white font-extrabold text-xs text-center shadow-[0_3px_0_0_#982C18] border border-white/20">
              Continue Practice
            </div>
          </div>

        </div>
      </div>

      <!-- Lower Left Teacher Slot & Interactive Dialogue Bubble -->
      <!-- Speech Bubble: id="lk-bubble", rounded, tactile shadow, pointing to teacher -->
      <div id="lk-bubble" class="bubble-tail absolute left-5 sm:left-6 top-12 sm:top-14 max-w-[190px] sm:max-w-[210px] bg-white rounded-2xl sm:rounded-[20px] p-3.5 sm:p-4 shadow-bubble border-[2.5px] border-[#E6D8C3] z-30 transition-transform">
        <p class="font-extrabold text-teal-deep text-sm sm:text-base leading-tight tracking-tight">
          Hi! Ready to talk?
        </p>
      </div>

      <!-- Teacher Standing Spot: id="lk-teacher" (Lower Left, in front of the phone, tall enough to touch bottom) -->
      <div id="lk-teacher" class="absolute left-3 sm:left-4 bottom-0 w-[180px] sm:w-[210px] h-[350px] sm:h-[390px] rounded-t-3xl z-20 flex items-end justify-center pointer-events-none" aria-label="Teacher 2D Avatar Mount Placeholder">
        <!-- Standing Teacher Grounding Contact Shadow -->
        <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-32 h-6 bg-[#0B2124]/20 rounded-full blur-md"></div>
        <!-- Minimal dashed bounding volume preview for content injection -->
        <div class="w-full h-full flex flex-col items-center justify-end pb-3 text-center opacity-70">
          <span class="sr-only">2D Teacher Mount Element</span>
        </div>
      </div>

    </section>

  </main>

</body>
</html>
