<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Promo Tile (440x280 Tactile Night)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #051013;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-[#051013] text-[#F3F9F9] antialiased select-none">

  <!-- Promo Tile Container: Exact 440px by 280px aspect box, fixed single poster, no scrolling -->
  <div class="relative w-[440px] h-[280px] bg-[#091518] rounded-2xl overflow-hidden border border-[#162F36] shadow-[0_16px_36px_rgba(0,0,0,0.5),0_2px_0_#1F4751] flex flex-col justify-between p-6 box-border">

    <!-- Atmospheric Layer: Soft directional ambient glow from top-left, and warm glow behind subject at bottom-right -->
    <div class="absolute -top-20 -left-20 w-64 h-64 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-10 -right-6 w-56 h-56 bg-amber-500/15 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute top-1/2 right-12 w-40 h-40 bg-[#FF5252]/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Soft circle of warm light specifically behind the teacher area -->
    <div class="absolute bottom-0 right-4 w-44 h-48 rounded-full bg-gradient-to-t from-[#FF7A29]/20 via-[#FFB74D]/15 to-transparent blur-xl pointer-events-none"></div>

    <!-- Delicate top/left specular rim light to mimic physical device edges catching illumination -->
    <div class="absolute inset-0 rounded-2xl border-t border-l border-[#2DD4BF]/20 pointer-events-none"></div>

    <!-- TOP SECTION: Logo row -->
    <header class="relative z-10 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <!-- id="lk-logo": Small empty square for the logo, with the word Lexkite next to it -->
        <div id="lk-logo" class="w-7 h-7 rounded-lg bg-gradient-to-br from-[#122A30] to-[#0D1E22] border border-[#234E57] shadow-[0_2px_0_#061316] flex items-center justify-center">
          <svg class="w-4 h-4 text-[#2DD4BF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L20 9L12 22L4 9L12 2Z" fill="currentColor" fill-opacity="0.2"/>
            <path d="M12 2L12 22"/>
            <path d="M4 9L20 9"/>
          </svg>
        </div>
        <span class="text-[17px] font-extrabold tracking-tight text-[#F1F9F8]">Lexkite</span>
      </div>
    </header>

    <!-- MIDDLE / HERO CONTENT LAYER -->
    <div class="relative z-10 flex items-end justify-between gap-4 mt-auto mb-1">
      
      <!-- Left side: Huge readable two-line headline & subline with room for translation wrapping -->
      <div class="flex-1 max-w-[250px] flex flex-col gap-2 pb-1">
        <!-- id="lk-headline": Two-line huge headline, with key words wrapped in id="lk-em" -->
        <h1 id="lk-headline" class="text-[26px] leading-[1.18] font-extrabold text-[#FFFFFF] tracking-[-0.03em] drop-shadow-sm">
          Speak English with <span id="lk-em" class="text-transparent bg-clip-text bg-gradient-to-r from-[#FF7A29] to-[#FF5252]">confidence</span>
        </h1>

        <!-- id="lk-sub": Short supporting line, highly legible (>4.5:1 ratio) -->
        <p id="lk-sub" class="text-[13px] leading-snug font-medium text-[#C2D7D9] tracking-normal">
          Interactive daily practice crafted for natural fluency.
        </p>
      </div>

      <!-- Right side: id="lk-teacher" - Dedicated empty rounded element reaching bottom edge -->
      <div class="relative w-[130px] h-[190px] shrink-0 flex items-end justify-center">
        <!-- id="lk-teacher": borderless, reaching bottom edge, with warm glow background -->
        <div id="lk-teacher" class="w-full h-full rounded-2xl flex items-end justify-center pointer-events-none">
          <!-- Subtle anchor podium base to give physical grounding for future 2D teacher placement -->
          <div class="w-24 h-5 rounded-full bg-gradient-to-r from-transparent via-[#14323A]/40 to-transparent blur-[2px] mb-0.5"></div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
