<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite Chrome Extension Store Poster (Tactile Night)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #051013;
      overflow: hidden;
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-0 m-0 select-none bg-[#051013]">

  <!-- 16:10 Landscape Poster Canvas -->
  <main class="relative w-full h-full max-w-[1920px] max-h-[1200px] aspect-[16/10] overflow-hidden flex bg-[#091518] text-[#F0FAF8]">

    <!-- Ambient Lighting & Glow FX -->
    <!-- Soft warm glow behind subject from top left and behind browser -->
    <div class="absolute -top-[25%] -left-[10%] w-[65%] h-[75%] rounded-full bg-gradient-to-br from-[#f59e0b]/15 via-[#2ba39a]/10 to-transparent blur-[120px] pointer-events-none"></div>
    <div class="absolute top-[10%] right-[10%] w-[60%] h-[80%] rounded-full bg-gradient-to-bl from-[#ff6b4a]/12 via-[#f59e0b]/10 to-transparent blur-[140px] pointer-events-none"></div>
    <div class="absolute -bottom-[20%] right-[30%] w-[45%] h-[55%] rounded-full bg-[#136a63]/15 blur-[100px] pointer-events-none"></div>

    <!-- Fine tactile noise / grid backdrop structure -->
    <div class="absolute inset-0 bg-[radial-gradient(#1e353b_1px,transparent_1px)] [background-size:32px_32px] opacity-25 pointer-events-none"></div>

    <!-- LEFT 36%: Brand, Huge Headline, Supporting Line & Benefit Points -->
    <div class="relative z-10 w-[36%] h-full flex flex-col justify-between pl-[4.5vw] pr-[2vw] py-[5vh] box-border">

      <!-- Top: Logo row -->
      <header class="flex items-center gap-3.5">
        <div id="lk-logo" class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#2ba39a] to-[#0f4f49] border border-[#3de0d0]/30 shadow-[0_4px_12px_rgba(43,163,154,0.3),inset_0_1px_1px_rgba(255,255,255,0.4)] flex-shrink-0 flex items-center justify-center">
          <!-- Kite geometric icon -->
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L20 10L12 22L4 10L12 2Z" fill-opacity="0.9"/>
          </svg>
        </div>
        <span class="text-2xl font-extrabold tracking-tight text-[#F0FAF8]">Lexkite</span>
      </header>

      <!-- Center content: Headline, Sub, Points -->
      <div class="flex flex-col justify-center my-auto py-4 space-y-6">
        
        <!-- Huge headline (readable at thumbnail size) -->
        <h1 id="lk-headline" class="text-[3.2vw] leading-[1.08] font-black tracking-[-0.035em] text-[#F0FAF8] break-words">
          Speak English with <span id="lk-em" class="text-transparent bg-clip-text bg-gradient-to-r from-[#F59E0B] via-[#FF8357] to-[#FF6B4A]">confidence</span>
        </h1>

        <!-- One short supporting line -->
        <p id="lk-sub" class="text-[1.1vw] leading-relaxed font-medium text-[#A9BDBB] max-w-[95%] break-words">
          Your personal AI language coach built right into your browser.
        </p>

        <!-- id="lk-points": Three short benefit lines with tactile round check marks -->
        <ul id="lk-points" class="flex flex-col gap-3.5 pt-2 list-none p-0 m-0">
          <li class="flex items-center gap-3 text-[0.95vw] font-semibold text-[#D1E2DF] break-words">
            <div class="w-6 h-6 rounded-full bg-gradient-to-b from-[#2ba39a] to-[#136a63] border border-[#4ee8da]/40 shadow-[0_3px_0_#06312d,0_4px_8px_rgba(0,0,0,0.3)] flex items-center justify-center flex-shrink-0">
              <svg class="w-3.5 h-3.5 text-[#051013]" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
            </div>
            <span>Instant pronunciation feedback</span>
          </li>
          <li class="flex items-center gap-3 text-[0.95vw] font-semibold text-[#D1E2DF] break-words">
            <div class="w-6 h-6 rounded-full bg-gradient-to-b from-[#2ba39a] to-[#136a63] border border-[#4ee8da]/40 shadow-[0_3px_0_#06312d,0_4px_8px_rgba(0,0,0,0.3)] flex items-center justify-center flex-shrink-0">
              <svg class="w-3.5 h-3.5 text-[#051013]" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
            </div>
            <span>One-click smart vocabulary lookups</span>
          </li>
          <li class="flex items-center gap-3 text-[0.95vw] font-semibold text-[#D1E2DF] break-words">
            <div class="w-6 h-6 rounded-full bg-gradient-to-b from-[#2ba39a] to-[#136a63] border border-[#4ee8da]/40 shadow-[0_3px_0_#06312d,0_4px_8px_rgba(0,0,0,0.3)] flex items-center justify-center flex-shrink-0">
              <svg class="w-3.5 h-3.5 text-[#051013]" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
            </div>
            <span>Bite-sized daily memory drills</span>
          </li>
        </ul>
      </div>

      <!-- Bottom subtle badge/pill -->
      <footer class="flex items-center gap-2 pt-2">
        <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#121d20]/80 border border-[#233b40] text-xs font-semibold text-[#9AB3B0] tracking-wide uppercase">
          <span class="w-2 h-2 rounded-full bg-[#2ba39a] shadow-[0_0_8px_#2ba39a]"></span>
          Chrome Extension
        </span>
      </footer>
    </div>

    <!-- RIGHT 64%: Realistic Desktop Browser Window slightly overflowing right -->
    <div class="relative w-[64%] h-full flex items-center pl-2 pr-0 py-[4vh] overflow-visible">

      <!-- Desktop Browser Window Container -->
      <div class="relative w-[114%] h-[92%] rounded-2xl bg-[#121d20] border-2 border-[#2b444a] shadow-[0_30px_70px_-15px_rgba(0,0,0,0.85),0_0_0_1px_rgba(255,255,255,0.06),0_15px_30px_rgba(5,16,19,0.7)] flex flex-col overflow-hidden transform translate-x-4">

        <!-- Specular Highlight edge on top rim catching directional light -->
        <div class="absolute inset-x-0 top-0 h-[1.5px] bg-gradient-to-r from-white/40 via-white/10 to-transparent pointer-events-none z-30"></div>
        <div class="absolute inset-y-0 left-0 w-[1.5px] bg-gradient-to-b from-white/30 via-white/5 to-transparent pointer-events-none z-30"></div>

        <!-- Realistic Browser Window Header -->
        <div class="h-12 w-full bg-[#162529] border-b border-[#23393e] flex items-center justify-between px-4 flex-shrink-0 z-20">
          
          <!-- Traffic Light Dots -->
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-[#ef4444] border border-[#b91c1c] shadow-[inset_0_1px_1px_rgba(255,255,255,0.3)]"></span>
            <span class="w-3 h-3 rounded-full bg-[#f59e0b] border border-[#b45309] shadow-[inset_0_1px_1px_rgba(255,255,255,0.3)]"></span>
            <span class="w-3 h-3 rounded-full bg-[#10b981] border border-[#047857] shadow-[inset_0_1px_1px_rgba(255,255,255,0.3)]"></span>
          </div>

          <!-- Slim Address Bar -->
          <div class="w-[62%] h-7 bg-[#0c1618] border border-[#243d43] rounded-lg flex items-center justify-between px-3 text-xs text-[#7F9A97]">
            <div class="flex items-center gap-2 truncate">
              <!-- Lock icon -->
              <svg class="w-3.5 h-3.5 text-[#2ba39a] flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
              </svg>
              <span id="lk-url" class="font-medium tracking-tight text-[#D8E5E9]">lexkite.com</span>
            </div>
            <!-- Star / Extension action icon -->
            <div class="flex items-center gap-2 flex-shrink-0">
              <svg class="w-3.5 h-3.5 text-[#f59e0b]" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
            </div>
          </div>

          <!-- Browser Controls Placeholders -->
          <div class="flex items-center gap-2.5 text-[#6B8784]">
            <div class="w-6 h-6 rounded-md hover:bg-[#20363c] flex items-center justify-center cursor-default">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </div>
          </div>
        </div>

        <!-- Whole page area is ONE empty element id="lk-screen" -->
        <div id="lk-screen" class="relative w-full flex-1 bg-[#091518] overflow-hidden flex items-center justify-center">
          <!-- Subtle interior ambient pattern & soft depth gradient -->
          <div class="absolute inset-0 bg-gradient-to-br from-[#121d20]/50 via-transparent to-[#051013]/80 pointer-events-none"></div>
          <div class="w-full h-full flex flex-col items-center justify-center p-8 text-center">
            <!-- Empty content slot for real content insertion later -->
          </div>
        </div>

      </div>

      <!-- Gentle physical shadow casting from bottom of browser window -->
      <div class="absolute -bottom-4 right-0 w-[110%] h-12 bg-black/50 blur-2xl pointer-events-none"></div>

    </div>

  </main>

</body>
</html>
