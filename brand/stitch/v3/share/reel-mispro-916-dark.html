<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" style="background:#091518; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Dusk Gradient -->
    <radialGradient id="bgCanvasGradDark" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#142A30" stop-opacity="1"/>
      <stop offset="45%" stop-color="#0E1E22" stop-opacity="1"/>
      <stop offset="100%" stop-color="#091518" stop-opacity="1"/>
    </radialGradient>

    <!-- Tactile Ledge & Drop Shadows for Dark Theme -->
    <filter id="heroCardShadowDark" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#02080A" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F766E" flood-opacity="0.25"/>
    </filter>

    <filter id="subCardShadowDark" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#02080A" flood-opacity="0.8"/>
    </filter>

    <filter id="pillLedgeShadowDark" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#02080A" flood-opacity="0.7"/>
    </filter>

    <!-- Kite Emblem Gradients -->
    <linearGradient id="kiteTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0E5E58"/>
    </linearGradient>
    <linearGradient id="kiteOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Gloss Sheen Gradient for Dark Theme -->
    <linearGradient id="darkCardGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="coralAccentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B7A"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Four-Point Star Sparkle -->
    <g id="starDustAmberDark">
      <path d="M 0 -16 Q 2 -3 16 0 Q 2 3 0 16 Q -2 3 -16 0 Q -2 -3 0 -16 Z" fill="#F59E0B"/>
    </g>
    <g id="starDustTealDark">
      <path d="M 0 -14 Q 2 -2 14 0 Q 2 2 0 14 Q -2 2 -14 0 Q -2 -2 0 -14 Z" fill="#2DD4BF"/>
    </g>
  </defs>

  <!-- ================= CANVAS BACKGROUND ================= -->
  <rect width="1080" height="1920" fill="url(#bgCanvasGradDark)"/>

  <!-- Atmospheric Glow & Ambient Dust in Negative Space -->
  <circle cx="300" cy="350" r="450" fill="#14B8A6" opacity="0.08"/>
  <circle cx="850" cy="850" r="500" fill="#FB7185" opacity="0.05"/>
  <circle cx="500" cy="1500" r="550" fill="#F59E0B" opacity="0.05"/>

  <use href="#starDustAmberDark" x="120" y="180" transform="scale(1.2)" opacity="0.65"/>
  <use href="#starDustTealDark" x="960" y="240" transform="scale(1.1)" opacity="0.75"/>
  <use href="#starDustAmberDark" x="980" y="740" transform="scale(0.85)" opacity="0.55"/>
  <use href="#starDustTealDark" x="90" y="860" transform="scale(0.9)" opacity="0.6"/>
  <circle cx="990" cy="520" r="7" fill="#F97316" opacity="0.6"/>
  <circle cx="80" cy="460" r="6" fill="#2DD4BF" opacity="0.5"/>

  <!-- ================= TOP THIRD: SERIES CHIP & HOOK QUESTION ================= -->
  <g transform="translate(80, 130)">
    <!-- Series / Category Pill Badge with Tactile 3D Ledge -->
    <g filter="url(#pillLedgeShadowDark)">
      <!-- Ledge -->
      <rect x="0" y="6" width="460" height="64" rx="32" fill="#040C0E"/>
      <!-- Body -->
      <rect x="0" y="0" width="460" height="64" rx="32" fill="#10252B" stroke="#234E57" stroke-width="2.5"/>

      <!-- Kite Mini Emblem -->
      <g transform="translate(36, 32)">
        <polygon points="0,-16 11,-3 0,0 -11,-3" fill="url(#kiteOrangeGrad)"/>
        <polygon points="0,0 11,-3 0,16 -11,-3" fill="url(#kiteTealGrad)"/>
        <!-- Kite String bead -->
        <circle cx="0" cy="19" r="2.2" fill="#F59E0B"/>
      </g>

      <!-- Label -->
      <text x="66" y="41" font-size="20" font-weight="900" fill="#2DD4BF" letter-spacing="1.5">SAY IT LIKE A NATIVE</text>
      <circle cx="340" cy="32" r="4" fill="#F59E0B"/>
      <text x="358" y="41" font-size="18" font-weight="900" fill="#E8F1F0" letter-spacing="1">PRONUNCIATION</text>
    </g>

    <!-- Context Cue Pill -->
    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="260" height="42" rx="21" fill="#2A141A" stroke="#4A1E29" stroke-width="1.8"/>
      <circle cx="24" cy="21" r="5" fill="#FB7185"/>
      <text x="40" y="27" font-size="16" font-weight="800" fill="#FF8A9A" letter-spacing="1">COMMON TEST TRAP</text>
    </g>

    <!-- Hook Question: Big, Bold, Scroll-Stopping -->
    <g transform="translate(0, 195)">
      <text x="0" y="64" font-size="68" font-weight="900" fill="#F0F9F8" letter-spacing="-2">
        Are you saying
      </text>
      <text x="0" y="148" font-size="78" font-weight="900" fill="#FF6B7A" letter-spacing="-2.5">
        ‘comfortable’
      </text>
      <text x="0" y="228" font-size="68" font-weight="900" fill="#2DD4BF" letter-spacing="-2">
        wrong?
      </text>
    </g>
  </g>

  <!-- ================= MIDDLE: MAIN COMPARISON CARD ================= -->
  <!-- 920px wide card with 2 columns: Wrong vs Right, IPA, Audio Button, and Tip -->
  <g transform="translate(80, 560)" filter="url(#heroCardShadowDark)">
    <!-- 3D Bottom Ledge -->
    <rect x="0" y="16" width="920" height="820" rx="44" fill="#040C0E"/>
    <!-- Card Face -->
    <rect x="0" y="0" width="920" height="820" rx="44" fill="#142A30" stroke="#234E57" stroke-width="2.5"/>

    <!-- Subtle Top Gloss Highlight -->
    <path d="M 4,44 C 4,22 22,4 44,4 L 876,4 C 898,4 916,22 916,44 L 916,130 C 620,80 300,80 4,130 Z" fill="url(#darkCardGloss)"/>

    <!-- Headword Strip & Part-of-speech inside Card -->
    <g transform="translate(48, 56)">
      <!-- Word & Lexical Type -->
      <text x="0" y="32" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-1">comfortable</text>
      
      <!-- adjective badge -->
      <g transform="translate(245, 4)">
        <rect x="0" y="3" width="90" height="34" rx="17" fill="#09181C"/>
        <rect x="0" y="0" width="90" height="34" rx="17" fill="#19353D" stroke="#2A535E" stroke-width="1.2"/>
        <text x="45" y="22" font-size="14" font-weight="800" fill="#A9BDBB" text-anchor="middle">adjective</text>
      </g>

      <!-- CEFR Level Pill -->
      <g transform="translate(348, 4)">
        <rect x="0" y="3" width="60" height="34" rx="17" fill="#083834"/>
        <rect x="0" y="0" width="60" height="34" rx="17" fill="#0E5E58" stroke="#14B8A6" stroke-width="1.2"/>
        <text x="30" y="22" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">B1</text>
      </g>

      <!-- Audio Speaker Button (Raised Tactile Button) -->
      <g transform="translate(740, -4)" filter="url(#subCardShadowDark)">
        <rect x="0" y="6" width="84" height="54" rx="20" fill="#042C28"/>
        <rect x="0" y="0" width="84" height="54" rx="20" fill="#0D5E58" stroke="#2DD4BF" stroke-width="1.8"/>
        <!-- Speaker Icon -->
        <g transform="translate(42, 27)">
          <path d="M -10,-5 L -5,-5 L 2,-11 L 2,11 L -5,5 L -10,5 Z" fill="#FFFFFF"/>
          <path d="M 6,-6 C 9,-3 9,3 6,6" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M 10,-10 C 15,-5 15,5 10,10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- Horizontal Divider -->
    <line x1="48" y1="126" x2="872" y2="126" stroke="#1D3E46" stroke-width="2"/>

    <!-- ================= TWO COLUMNS: WRONG (LEFT) vs RIGHT (RIGHT) ================= -->

    <!-- LEFT COLUMN: WRONG PRONUNCIATION -->
    <g transform="translate(48, 156)">
      <!-- Sub-card background with soft deep wine/coral tint -->
      <g filter="url(#subCardShadowDark)">
        <rect x="0" y="8" width="396" height="390" rx="30" fill="#0A1114"/>
        <rect x="0" y="0" width="396" height="390" rx="30" fill="#201519" stroke="#4A1E29" stroke-width="2"/>
      </g>

      <!-- Header Chip: Cross mark + "DON'T SAY" -->
      <g transform="translate(24, 24)">
        <rect x="0" y="3" width="160" height="42" rx="21" fill="#881337"/>
        <rect x="0" y="0" width="160" height="42" rx="21" fill="#E11D48"/>
        <!-- Cross Icon -->
        <g transform="translate(24, 21)">
          <line x1="-7" y1="-7" x2="7" y2="7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
          <line x1="7" y1="-7" x2="-7" y2="7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        </g>
        <text x="44" y="27" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">DON'T SAY</text>
      </g>

      <!-- Phonetic Breakdown with WRONG stress -->
      <!-- cum-FORT-a-ble (stress placed on 2nd syllable "FORT") -->
      <g transform="translate(198, 160)">
        <text x="0" y="0" font-size="34" font-weight="700" fill="#CBD5E1" text-anchor="middle">
          cum-<tspan font-weight="900" font-size="44" fill="#FF4D6D">FORT</tspan>-a-ble
        </text>
      </g>

      <!-- Syllable Count Badge -->
      <g transform="translate(198, 230)">
        <rect x="-105" y="0" width="210" height="36" rx="18" fill="#3D1822"/>
        <text x="0" y="23" font-size="15" font-weight="800" fill="#FFA4B2" text-anchor="middle">4 syllables (common slip)</text>
      </g>

      <!-- Diagnostic Note -->
      <g transform="translate(198, 305)">
        <text x="0" y="0" font-size="17" font-weight="700" fill="#FFA4B2" text-anchor="middle">
          Do not stress "fort".
        </text>
        <text x="0" y="26" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">
          Native speakers drop the 'or'.
        </text>
      </g>
    </g>

    <!-- RIGHT COLUMN: RIGHT PRONUNCIATION -->
    <g transform="translate(476, 156)">
      <!-- Sub-card background with soft deep teal/mint tint -->
      <g filter="url(#subCardShadowDark)">
        <rect x="0" y="8" width="396" height="390" rx="30" fill="#040D10"/>
        <rect x="0" y="0" width="396" height="390" rx="30" fill="#0F282D" stroke="#1D4A52" stroke-width="2"/>
      </g>

      <!-- Header Chip: Check mark + "SAY THIS" -->
      <g transform="translate(24, 24)">
        <rect x="0" y="3" width="150" height="42" rx="21" fill="#042C28"/>
        <rect x="0" y="0" width="150" height="42" rx="21" fill="#0D5E58" stroke="#2DD4BF" stroke-width="1.5"/>
        <!-- Check Icon -->
        <g transform="translate(24, 21)">
          <polyline points="-7,0 -2,6 8,-6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="42" y="27" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">SAY THIS</text>
      </g>

      <!-- Phonetic Breakdown with RIGHT stress -->
      <!-- KUMF-tuh-bul (stress placed on 1st syllable "KUMF") -->
      <g transform="translate(198, 160)">
        <text x="0" y="0" font-size="34" font-weight="700" fill="#99F6E4" text-anchor="middle">
          <tspan font-weight="900" font-size="44" fill="#2DD4BF">KUMF</tspan>-tuh-bul
        </text>
      </g>

      <!-- Syllable Count Badge -->
      <g transform="translate(198, 230)">
        <rect x="-105" y="0" width="210" height="36" rx="18" fill="#063E38"/>
        <text x="0" y="23" font-size="15" font-weight="900" fill="#5EEAD4" text-anchor="middle">Only 3 syllables!</text>
      </g>

      <!-- Diagnostic Note -->
      <g transform="translate(198, 305)">
        <text x="0" y="0" font-size="17" font-weight="800" fill="#5EEAD4" text-anchor="middle">
          Strong beat on "KUMF".
        </text>
        <text x="0" y="26" font-size="15" font-weight="700" fill="#CCFBF1" text-anchor="middle">
          Then quickly: -tuh-bul.
        </text>
      </g>
    </g>

    <!-- ================= FULL IPA PHONETIC STRIP ================= -->
    <g transform="translate(48, 580)">
      <!-- Ledge -->
      <rect x="0" y="5" width="824" height="66" rx="22" fill="#071317"/>
      <!-- Body -->
      <rect x="0" y="0" width="824" height="66" rx="22" fill="#0C1D21" stroke="#1B3E45" stroke-width="2"/>

      <text x="36" y="42" font-size="17" font-weight="800" fill="#A9BDBB" letter-spacing="1">IPA (UK / US):</text>
      
      <!-- Primary IPA Transcription with Primary Stress Mark highlighted -->
      <text x="210" y="44" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="1">
        /<tspan fill="#FF6B7A" font-weight="900">ˈ</tspan><tspan fill="#2DD4BF" font-weight="900">kʌmf</tspan>.tə.bəl/
      </text>

      <!-- Audio Cadence Badge -->
      <g transform="translate(640, 14)">
        <rect x="0" y="0" width="150" height="38" rx="19" fill="#0F3338" stroke="#1D565E" stroke-width="1.5"/>
        <circle cx="20" cy="19" r="4.5" fill="#2DD4BF"/>
        <text x="34" y="24" font-size="13" font-weight="900" fill="#2DD4BF">3-BEAT FLOW</text>
      </g>
    </g>

    <!-- ================= COACH TIP CONTAINER (BOTTOM OF CARD) ================= -->
    <g transform="translate(48, 674)">
      <!-- Tactile Card Ledge -->
      <rect x="0" y="5" width="824" height="106" rx="24" fill="#071317"/>
      <!-- Card Body -->
      <rect x="0" y="0" width="824" height="106" rx="24" fill="#10252A" stroke="#1F4751" stroke-width="2"/>

      <!-- Amber Bulb Icon -->
      <g transform="translate(42, 38)">
        <circle cx="0" cy="0" r="22" fill="#3D260D" stroke="#784110" stroke-width="1.8"/>
        <!-- Lightbulb silhouette -->
        <path d="M -6,-8 C -9,-4 -9,2 -6,5 L -3,8 L 3,8 L 6,5 C 9,2 9,-4 6,-8 C 3,-12 -3,-12 -6,-8 Z" fill="#F59E0B"/>
        <line x1="-3" y1="11" x2="3" y2="11" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Tip Text: Multi-line wrapped, highly legible -->
      <g transform="translate(86, 36)">
        <text x="0" y="0" font-size="18" font-weight="900" fill="#FBBF24" letter-spacing="0.5">COACH'S MEMORY SHORTCUT:</text>
        <text x="0" y="28" font-size="19" font-weight="800" fill="#E8F1F0" letter-spacing="-0.2">
          Think: <tspan fill="#2DD4BF" font-weight="900">"Come for a bowl"</tspan> → <tspan fill="#FF6B7A" font-weight="900">"Comf-ter-bl"</tspan>. Say it fast in 3 quick beats!
        </text>
      </g>
    </g>
  </g>

  <!-- ================= LOWER SIDE: EMPTY DASHED TEACHER SLOT ================= -->
  <!-- Labelled "teacher-slot", strictly empty rounded placeholder for 2D teacher Carlos -->
  <g transform="translate(80, 1420)">
    <!-- Backing container with dashed border -->
    <rect x="0" y="6" width="340" height="230" rx="32" fill="#040C0E" opacity="0.8"/>
    <rect x="0" y="0" width="340" height="230" rx="32" fill="#0D2024" opacity="0.95"/>
    
    <!-- Dashed border line -->
    <rect x="2" y="2" width="336" height="226" rx="30" fill="none"
          stroke="#2DD4BF" stroke-width="3" stroke-dasharray="10 8" opacity="0.85"/>

    <!-- Placeholder Center Emblem & Label -->
    <g transform="translate(170, 78)">
      <circle cx="0" cy="3" r="28" fill="#042C28"/>
      <circle cx="0" cy="0" r="28" fill="#0D5E58" stroke="#2DD4BF" stroke-width="2"/>
      <!-- Graduation / Teacher Cap glyph -->
      <path d="M -16,-2 L 0,-9 L 16,-2 L 0,5 Z" fill="#2DD4BF"/>
      <path d="M -10,4 L -10,11 C -10,15 10,15 10,11 L 10,4" fill="none" stroke="#2DD4BF" stroke-width="2"/>
      <path d="M 14,-1 L 16,10" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <circle cx="16" cy="11" r="2.5" fill="#F59E0B"/>
    </g>

    <!-- Clear labels -->
    <text x="170" y="142" font-size="17" font-weight="900" fill="#2DD4BF" letter-spacing="1.5" text-anchor="middle">TEACHER-SLOT</text>
    <text x="170" y="168" font-size="14" font-weight="800" fill="#E8F1F0" text-anchor="middle">Teacher Carlos (2D) loads here</text>
    <text x="170" y="194" font-size="12" font-weight="700" fill="#A9BDBB" text-anchor="middle">• Real-time Video Layer •</text>
  </g>

  <!-- Next to Teacher Slot: Rapid Repeat Interactive Prompt Pill -->
  <g transform="translate(450, 1450)" filter="url(#subCardShadowDark)">
    <!-- Ledge -->
    <rect x="0" y="8" width="550" height="170" rx="30" fill="#040C0E"/>
    <!-- Body -->
    <rect x="0" y="0" width="550" height="170" rx="30" fill="#142A30" stroke="#234E57" stroke-width="2.5"/>

    <!-- Eyebrow Pill -->
    <g transform="translate(36, 26)">
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#3D1822" stroke="#662233" stroke-width="1.5"/>
      <text x="80" y="21" font-size="13" font-weight="900" fill="#FF8A9A" text-anchor="middle">SHADOW DRILL</text>
    </g>

    <!-- Main Callout text -->
    <g transform="translate(36, 88)">
      <text x="0" y="0" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
        Repeat 3 times out loud:
      </text>
      <text x="0" y="38" font-size="28" font-weight="900" fill="#2DD4BF" letter-spacing="-0.5">
        “A comfortable chair.”
      </text>
    </g>

    <!-- Mini waveform decoration on right -->
    <g transform="translate(460, 85)">
      <line x1="-20" y1="-8" x2="-20" y2="8" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-10" y1="-18" x2="-10" y2="18" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#FF4D6D" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="-16" x2="10" y2="16" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="20" y1="-6" x2="20" y2="6" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ================= BOTTOM: BRAND WATERMARK & FOLLOW FOR MORE ================= -->
  <!-- Safely positioned inside vertical safe area (above y=1750, well clear of UI overlays) -->
  <g transform="translate(540, 1750)">
    <!-- Follow for more banner with tactile raised feel -->
    <g filter="url(#subCardShadowDark)">
      <!-- Ledge -->
      <rect x="-320" y="6" width="640" height="74" rx="37" fill="#881337"/>
      <!-- Body: Coral accent button with raised feel -->
      <rect x="-320" y="0" width="640" height="74" rx="37" fill="url(#coralAccentGrad)"/>
      
      <!-- Label: High-contrast white typography -->
      <g transform="translate(0, 46)">
        <text x="0" y="0" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="0.5" text-anchor="middle">
          Follow for daily IELTS &amp; accent tips
        </text>
      </g>
    </g>

    <!-- Lexkite Wordmark and domain below button -->
    <g transform="translate(0, 116)">
      <!-- Kite Mini Icon -->
      <g transform="translate(-130, -5)">
        <polygon points="0,-13 9,-3 0,0 -9,-3" fill="url(#kiteOrangeGrad)"/>
        <polygon points="0,0 9,-3 0,13 -9,-3" fill="url(#kiteTealGrad)"/>
      </g>

      <!-- Brand Wordmark -->
      <text x="-105" y="0" font-size="24" font-weight="900" fill="#2DD4BF" letter-spacing="0.5">Lexkite</text>
      <circle cx="-5" cy="-6" r="3.5" fill="#F59E0B"/>
      
      <!-- Secondary line -->
      <text x="16" y="0" font-size="18" font-weight="800" fill="#E8F1F0" letter-spacing="0.3">lexkite.com</text>
      <circle cx="120" cy="-6" r="3.5" fill="#4B666E"/>
      <text x="138" y="0" font-size="16" font-weight="700" fill="#A9BDBB">Daily English</text>
    </g>
  </g>
</svg>
