<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF4EF;
      color: #172427;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* Skeleton shimmer animation */
    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .skeleton-box {
      background: linear-gradient(90deg, #EADDCF 25%, #F4EBE2 50%, #EADDCF 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite ease-in-out;
    }

    .skeleton-box-light {
      background: linear-gradient(90deg, #E3D3C4 25%, #ECE2D7 50%, #E3D3C4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite ease-in-out;
    }

    .skeleton-box-darker {
      background: linear-gradient(90deg, #DBC9B8 25%, #E9DDD0 50%, #DBC9B8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite ease-in-out;
    }

    .card-shadow {
      box-shadow: 0 4px 0 #E3D5C8;
    }

    .btn-tactile-shadow {
      box-shadow: 0 4px 0 #B95000;
    }

    .tab-item-active {
      background-color: #C7EFE9;
      color: #0F534C;
    }
