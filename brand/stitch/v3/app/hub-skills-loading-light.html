<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite Skills Hub (Loading Skeleton - Bright Day)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF4EF;
      color: #172427;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* Skeleton shimmer animation */
    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .skeleton-box {
      background: linear-gradient(90deg, #EADDCF 25%, #F4EBE2 50%, #EADDCF 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite ease-in-out;
    }

    .skeleton-box-light {
      background: linear-gradient(90deg, #E3D3C4 25%, #ECE2D7 50%, #E3D3C4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite ease-in-out;
    }

    .skeleton-box-darker {
      background: linear-gradient(90deg, #DBC9B8 25%, #E9DDD0 50%, #DBC9B8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite ease-in-out;
    }

    .card-shadow {
      box-shadow: 0 4px 0 #E3D5C8;
    }

    .btn-tactile-shadow {
      box-shadow: 0 4px 0 #B95000;
    }

    .tab-item-active {
      background-color: #C7EFE9;
      color: #0F534C;
    }
  </style>
</head>
<body class="bg-[#FAF4EF] min-h-screen flex justify-center selection:bg-[#208479]/20 selection:text-[#0F534C]">
<!-- Mobile screen container (390px native mobile, edge-to-edge) -->
<div class="w-full max-w-[390px] min-h-screen bg-[#FAF4EF] flex flex-col justify-between relative shadow-xl overflow-x-hidden">
<!-- Interactive Top App Bar (Header stays fully interactive) -->
<header class="sticky top-0 z-40 bg-[#FAF4EF]/95 backdrop-blur border-b-2 border-[#E9DDD0] px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-2.5">
<!-- Graduation Icon Badge -->
<div class="w-11 h-11 rounded-full bg-[#136A63]/10 border-2 border-[#136A63]/25 flex items-center justify-center text-[#136A63]"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg></div>
<div>
<div class="flex items-center gap-1.5">
<h1 class="text-base font-extrabold text-[#172427] leading-none tracking-tight">IELTS Band 7.5</h1>
<span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-[#136A63]/10 text-[#136A63] border border-[#136A63]/20">Active</span>
</div>
<p class="text-[12px] font-semibold text-[#5F7174] mt-0.5">Skills Mastery Hub</p>
</div>
</div>
<!-- Live Interactive Chips -->
<div class="flex items-center gap-1.5">
<!-- Streak Chip -->
<div class="flex items-center gap-1 bg-[#FFF1E8] border-2 border-[#F9B588] px-2.5 h-11 rounded-full text-[#B95000] font-bold text-xs shadow-sm"><svg class="w-3.5 h-3.5 fill-[#E06714]" viewbox="0 0 24 24"><path d="M12 23c-4.97 0-9-3.8-9-8.5 0-3.3 1.8-6.1 4-7.5.4-.3 1-.1 1.2.3.2.4.1.9-.2 1.2-1.3 1.2-2 3-2 4.5 0 3.3 2.7 6 6 6s6-2.7 6-6c0-1.8-.7-3.7-2-5-.3-.3-.4-.8-.2-1.2.2-.4.7-.6 1.2-.3 2.5 1.5 4 4.4 4 7.7 0 4.7-4.03 8.8-9 8.8zm-1-10.5c0-.6.4-1 1-1s1 .4 1 1c0 1.7-1.3 3-3 3-.6 0-1-.4-1-1 0-1.1.9-2 2-2z"></path></svg><span>14</span></div>
<!-- XP Chip -->
<div class="flex items-center gap-1 bg-[#FFFBEA] border-2 border-[#FDE047] px-2.5 h-11 rounded-full text-[#854D0E] font-bold text-xs shadow-sm"><svg class="w-3.5 h-3.5 fill-[#EAB308]" viewbox="0 0 24 24"><path d="M13 2L3 14h7v8l10-12h-7l1-8z"></path></svg><span>820</span></div>
<!-- Notification Bell -->
<button aria-label="Notifications" class="w-11 h-11 rounded-full bg-white border border-[#E3D5C8] flex items-center justify-center text-[#5F7174] hover:text-[#172427] hover:bg-[#F6EBE2] transition-colors relative"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-[#E06714] border border-white"></span></button>
</div>
</header>
<!-- Main Content Area: Shimmer Loading Skeleton -->
<main class="flex-1 px-4 py-4 space-y-5 pb-24">

<section aria-busy="true" aria-label="Loading recommendation" class="bg-white rounded-2xl p-4 border-2 border-[#E9DDD0] card-shadow relative overflow-hidden">

<div class="flex items-center justify-between gap-2">
<div class="w-36 h-6 rounded-full skeleton-box"></div>
<div class="w-24 h-6 rounded-full skeleton-box"></div>
</div>
<!-- Content + Avatar row -->
<div class="mt-3.5 flex items-start justify-between gap-3">
<div class="flex-1 space-y-2">
<!-- Headline lines -->
<div class="w-4/5 h-6 rounded-lg skeleton-box"></div>
<div class="w-3/5 h-5 rounded-md skeleton-box"></div>
<!-- Description lines -->
<div class="pt-1.5 space-y-1.5">
<div class="w-full h-3.5 rounded skeleton-box-light"></div>
<div class="w-11/12 h-3.5 rounded skeleton-box-light"></div>
</div>
</div>
<!-- Tutor Ama Avatar Placeholder Circle with dashed outline style -->
<div class="flex flex-col items-center gap-1.5 shrink-0">
<div class="w-14 h-14 rounded-full border-2 border-dashed border-[#136A63]/30 p-1 flex items-center justify-center">
<div class="w-full h-full rounded-full skeleton-box"></div>
</div>
<div class="w-14 h-3.5 rounded-full skeleton-box-light"></div>
</div>
</div>
<!-- Quotation / Tip Box skeleton -->
<div class="mt-3.5 p-2.5 rounded-xl bg-[#F8F4EE] border border-[#E8DFD5] flex items-center gap-2">
<div class="w-4 h-4 rounded-full skeleton-box shrink-0"></div>
<div class="w-4/5 h-3 rounded skeleton-box-light"></div>
</div>
<!-- Tactile CTA Button Skeleton -->
<div class="mt-4">
<div class="w-full h-12 rounded-xl skeleton-box-darker border-b-4 border-[#C88452]"></div>
</div>
</section>
<!-- Core Exam Skills 2x2 Grid Section -->
<section aria-busy="true" aria-label="Loading core skills">
<!-- Section Header row -->
<div class="flex items-center justify-between mb-3 px-0.5">
<div class="flex items-center gap-2">
<div class="w-32 h-5 rounded-md skeleton-box"></div>
<div class="w-16 h-5 rounded-full skeleton-box-light"></div>
</div>
<div class="w-12 h-3.5 rounded skeleton-box-light"></div>
</div>
<!-- 2x2 Skills Grid (Listening, Reading, Writing, Speaking) -->
<div class="grid grid-cols-2 gap-3">
<!-- Card 1: Listening Skeleton -->
<div class="bg-white rounded-2xl p-3.5 border-2 border-[#E9DDD0] card-shadow flex flex-col justify-between">
<div>
<div class="flex items-center justify-between gap-1.5 mb-2.5">
<div class="w-8 h-8 rounded-full skeleton-box shrink-0"></div>
<div class="w-14 h-5 rounded-full skeleton-box"></div>
</div>
<div class="w-20 h-4 rounded skeleton-box mb-1.5"></div>

</div>
<div>

<div class="flex justify-between items-center mb-1">
<div class="w-10 h-2.5 rounded skeleton-box-light"></div>
<div class="w-6 h-2.5 rounded skeleton-box-light"></div>
</div>
<div class="w-full h-2 rounded-full skeleton-box-light overflow-hidden">
<div class="w-3/4 h-full skeleton-box"></div>
</div>
</div>
</div>
<!-- Card 2: Reading Skeleton -->
<div class="bg-white rounded-2xl p-3.5 border-2 border-[#E9DDD0] card-shadow flex flex-col justify-between">
<div>
<div class="flex items-center justify-between gap-1.5 mb-2.5">
<div class="w-8 h-8 rounded-full skeleton-box shrink-0"></div>
<div class="w-14 h-5 rounded-full skeleton-box"></div>
</div>
<div class="w-18 h-4 rounded skeleton-box mb-1.5"></div>
<div class="w-20 h-3 rounded skeleton-box-light mb-3"></div>
<div class="w-full h-5 rounded-md skeleton-box-light mb-3"></div>
</div>
<div>
<!-- Progress bar placeholder -->
<div class="flex justify-between items-center mb-1">
<div class="w-10 h-2.5 rounded skeleton-box-light"></div>
<div class="w-6 h-2.5 rounded skeleton-box-light"></div>
</div>
<div class="w-full h-2 rounded-full skeleton-box-light overflow-hidden">
<div class="w-3/5 h-full skeleton-box"></div>
</div>
</div>
</div>
<!-- Card 3: Writing Skeleton -->
<div class="bg-white rounded-2xl p-3.5 border-2 border-[#E9DDD0] card-shadow flex flex-col justify-between">
<div>
<div class="flex items-center justify-between gap-1.5 mb-2.5">
<div class="w-8 h-8 rounded-full skeleton-box shrink-0"></div>
<div class="w-14 h-5 rounded-full skeleton-box"></div>
</div>
<div class="w-16 h-4 rounded skeleton-box mb-1.5"></div>
<div class="w-20 h-3 rounded skeleton-box-light mb-3"></div>
<div class="w-full h-5 rounded-md skeleton-box-light mb-3"></div>
</div>
<div>
<!-- Progress bar placeholder -->
<div class="flex justify-between items-center mb-1">
<div class="w-10 h-2.5 rounded skeleton-box-light"></div>
<div class="w-6 h-2.5 rounded skeleton-box-light"></div>
</div>
<div class="w-full h-2 rounded-full skeleton-box-light overflow-hidden">
<div class="w-2/5 h-full skeleton-box"></div>
</div>
</div>
</div>
<!-- Card 4: Speaking Skeleton -->
<div class="bg-white rounded-2xl p-3.5 border-2 border-[#E9DDD0] card-shadow flex flex-col justify-between">
<div>
<div class="flex items-center justify-between gap-1.5 mb-2.5">
<div class="w-8 h-8 rounded-full skeleton-box shrink-0"></div>
<div class="w-14 h-5 rounded-full skeleton-box"></div>
</div>
<div class="w-18 h-4 rounded skeleton-box mb-1.5"></div>
<div class="w-16 h-3 rounded skeleton-box-light mb-3"></div>

<div>

</div>
<div class="w-full h-2 rounded-full skeleton-box-light overflow-hidden">
<div class="w-4/5 h-full skeleton-box"></div>
</div>
</div>
</div>
</div>
</section>
<!-- Targeted Foundations Section Skeleton -->
<section aria-busy="true" aria-label="Loading foundations" class="space-y-3">
<div class="space-y-1 px-0.5">
<div class="w-40 h-5 rounded-md skeleton-box"></div>
<div class="w-56 h-3 rounded skeleton-box-light"></div>
</div>
<!-- Foundation 1: Pronunciation Card Skeleton -->

<div class="flex items-center gap-3 flex-1">
<div class="w-11 h-11 rounded-full skeleton-box shrink-0"></div>
<div class="flex-1 space-y-1.5">
<div class="w-32 h-4 rounded skeleton-box"></div>
<div class="w-48 h-3 rounded skeleton-box-light"></div>
</div>
</div>
<!-- Practice Button Placeholder -->
<div class="w-20 h-9 rounded-xl skeleton-box shrink-0 border-b-2 border-[#D5C2B1]"></div>
</div>
<!-- Foundation 2: Grammar & Sentences Card Skeleton -->
<div class="bg-white rounded-2xl p-3.5 border-2 border-[#E9DDD0] card-shadow flex items-center justify-between gap-3">
<div class="flex items-center gap-3 flex-1">
<div class="w-11 h-11 rounded-full skeleton-box shrink-0"></div>
<div class="flex-1 space-y-1.5">
<div class="w-36 h-4 rounded skeleton-box"></div>
<div class="w-44 h-3 rounded skeleton-box-light"></div>
</div>
</div>
<!-- Practice Button Placeholder -->
<div class="w-20 h-9 rounded-xl skeleton-box shrink-0 border-b-2 border-[#D5C2B1]"></div>
</div>
</section>
</main>
<!-- Canonical 5-Tab Bottom Navigation Bar (Fully Interactive) -->
<nav aria-label="Bottom Navigation" class="fixed bottom-0 left-0 right-0 max-w-[390px] mx-auto z-50 bg-white border-t-2 border-[#E9DDD0] px-3 py-2 flex items-center justify-around shadow-[0_-4px_12px_rgba(0,0,0,0.03)]"><!-- 1. Today Tab --><a class="flex flex-col items-center justify-center h-12 px-2.5 rounded-lg text-[#5F7174] hover:text-[#136A63] transition-colors group" href="#/today"><svg class="w-5 h-5 mb-0.5 text-[#5F7174] group-hover:text-[#136A63]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg><span class="text-[11px] font-bold tracking-tight">Today</span></a><!-- 2. Vocab Tab --><a class="flex flex-col items-center justify-center h-12 px-2.5 rounded-lg text-[#5F7174] hover:text-[#136A63] transition-colors group" href="#/vocab"><svg class="w-5 h-5 mb-0.5 text-[#5F7174] group-hover:text-[#136A63]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg><span class="text-[11px] font-bold tracking-tight">Vocab</span></a><!-- 3. Skills Tab (Active destination) --><a class="flex flex-col items-center justify-center h-12 px-3.5 rounded-full tab-item-active font-extrabold shadow-sm" href="#/skills"><svg class="w-5 h-5 mb-0.5 text-[#0F534C]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" viewbox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg><span class="text-[11px] tracking-tight text-[#0F534C]">Skills</span></a><!-- 4. Tests Tab --><a class="flex flex-col items-center justify-center h-12 px-2.5 rounded-lg text-[#5F7174] hover:text-[#136A63] transition-colors group" href="#/tests"><svg class="w-5 h-5 mb-0.5 text-[#5F7174] group-hover:text-[#136A63]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" x2="8" y1="13" y2="13"></line><line x1="16" x2="8" y1="17" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg><span class="text-[11px] font-bold tracking-tight">Tests</span></a><!-- 5. Me Tab --><a class="flex flex-col items-center justify-center h-12 px-2.5 rounded-lg text-[#5F7174] hover:text-[#136A63] transition-colors group" href="#/me"><svg class="w-5 h-5 mb-0.5 text-[#5F7174] group-hover:text-[#136A63]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span class="text-[11px] font-bold tracking-tight">Me</span></a></nav>
