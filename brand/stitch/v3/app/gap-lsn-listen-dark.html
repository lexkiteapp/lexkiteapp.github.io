<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lexkite — IELTS Sound Drill (Night Mobile)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              bg: '#081518',
              card: '#162529',
              cardSelected: '#163336',
              border: '#2B424B',
              borderSelected: '#3BD4C7',
              ledge: '#0E1A1E',
              ledgeSelected: '#165B57',
              teal: '#3BD4C7',
              tealGlow: '#6BD8CE',
              tealDeep: '#EEF6F7',
              inkSecondary: '#A9BFC1',
              coral: '#F2553B',
              coralLedge: '#B53A22',
            }
          }
        }
      }
    }
  </script>
<style>
    .tactile-card {
      box-shadow: 0 4px 0 0 #0E1A1E;
    }
    .tactile-card-selected {
      box-shadow: 0 4px 0 0 #134E50;
    }
    .tactile-btn-coral {
      box-shadow: 0 5px 0 0 #B53A22;
    }
    .tactile-btn-coral:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #B53A22;
    }
    .tactile-play-btn {
      box-shadow: 0 6px 0 0 #135A55;
    }
    .tactile-play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 0 #135A55;
    }
    .tactile-pill-btn {
      box-shadow: 0 3px 0 0 #0E1A1E;
    }
    .tactile-pill-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 0 #0E1A1E;
    }
    .answer-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #0E1A1E;
    }
    .answer-card-selected:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #134E50;
    }
  </style>
</head>
<body class="bg-[#051013] text-[#EEF6F7] font-sans antialiased min-h-screen flex items-center justify-center p-0">
<!-- Mobile Device Frame (390px, edge-to-edge dark container) -->
<main class="w-full max-w-[390px] min-h-[100dvh] bg-[#081518] flex flex-col justify-between shadow-2xl relative overflow-hidden select-none border-x border-[#1E3036]">
<!-- Top Lesson Header -->
<header class="w-full pt-4 px-5 pb-2 shrink-0">
<div class="flex items-center gap-4">
<!-- Close (X) button with minimum 44x44px touch target -->
<button aria-label="Exit lesson" class="w-11 h-11 min-w-[44px] min-h-[44px] rounded-full bg-[#162529] border-2 border-[#2B424B] flex items-center justify-center text-[#EEF6F7] tactile-pill-btn transition-transform" type="button">
<span class="material-symbols-rounded text-2xl">close</span>
</button>
<!-- Progress bar tracking drill step -->
<div class="flex-1">
<div class="w-full h-3 bg-[#162529] rounded-full overflow-hidden p-0.5 border border-[#2B424B]">
<div class="h-full bg-[#3BD4C7] rounded-full w-[45%] transition-all duration-300"></div>
</div>
</div>
</div>
</header>
<!-- Scrollable Content Area -->
<div class="flex-1 px-5 pt-3 pb-6 flex flex-col justify-between overflow-y-auto">
<!-- Drill Header & Context -->
<section class="space-y-4">
<!-- Badges & Section Category -->
<div class="flex flex-wrap items-center gap-2">
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-[#102B2D] text-[#6BD8CE] border border-[#205154]">
<span class="w-2 h-2 rounded-full bg-[#3BD4C7]"></span>
            IELTS SOUND LAB • MINIMAL PAIRS
          </span>
</div>
<!-- Main Title & Subtitle -->
<div class="space-y-1">
<h1 class="text-2xl font-extrabold tracking-tight text-[#EEF6F7] leading-tight">
            Tap what you hear
          </h1>
<p class="text-sm font-semibold text-[#A9BFC1] leading-relaxed">
            Distinguish minimal vowel pairs at exam speed
          </p>
</div>
<!-- Teacher Card (Coach Ama) -->
<div class="bg-[#162529] rounded-2xl p-3.5 border-2 border-[#2B424B] tactile-card flex items-start gap-3">
<!-- Empty rounded Teacher-Slot container -->
<div aria-label="Teacher avatar placeholder" class="w-14 h-14 min-w-[56px] min-h-[56px] rounded-xl border-2 border-dashed border-[#3BD4C7] bg-[#0E1E22] flex flex-col items-center justify-center p-1 text-center shrink-0">
<span class="material-symbols-rounded text-[#3BD4C7] text-xl">school</span>
<span class="text-[9px] font-extrabold uppercase tracking-tight text-[#6BD8CE] leading-none mt-0.5">teacher-slot</span>
</div>
<!-- Coach speech bubble & tip -->
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 flex-wrap mb-1">
<span class="text-xs font-extrabold text-[#EEF6F7]">Coach Ama</span>
<span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-md bg-[#102B2D] text-[#3BD4C7] border border-[#205154]">IELTS EXAMINER</span>
</div>
<p class="text-xs font-semibold text-[#D8E5E9] leading-snug">
              “Listen for the vowel sound in the middle.”
            </p>
</div>
</div>
<!-- Audio Interactive Orb & Speed Control -->
<div class="py-2 flex flex-col items-center justify-center gap-2">
<div class="flex items-center justify-center gap-3">
<!-- Big Round Audio Play Button -->
<button aria-label="Play sound pronunciation" class="w-20 h-20 min-w-[80px] min-h-[80px] rounded-full bg-[#2BA39A] hover:bg-[#3BD4C7] text-[#003733] flex flex-col items-center justify-center tactile-play-btn border-2 border-[#54E4D8] transition-transform active:scale-95 shadow-lg shadow-[#2BA39A]/20" type="button">
<span class="material-symbols-rounded text-3xl font-bold">graphic_eq</span>
<span class="text-[10px] font-extrabold tracking-wider uppercase mt-0.5">LISTEN</span>
</button>
<!-- 0.75x Slow Replay Toggle Button -->
<button aria-label="Play at 0.75x slow speed" class="min-h-[44px] px-3.5 py-2 rounded-2xl bg-[#162529] border-2 border-[#2B424B] tactile-pill-btn flex items-center gap-1.5 text-xs font-extrabold text-[#EEF6F7] transition-transform" type="button">
<span class="material-symbols-rounded text-base text-[#3BD4C7]">slow_motion_video</span>
<span>0.75x</span>
</button>
</div>
<span class="text-[11px] font-semibold text-[#A9BFC1] tracking-tight">
            Replay available anytime • Tap word to pick
          </span>
</div>
<!-- 4 Large Answer Cards in a 2x2 Grid -->
<div class="grid grid-cols-2 gap-3 pt-1">
<!-- Option A: though -->
<button class="answer-card min-h-[72px] bg-[#162529] border-2 border-[#2B424B] rounded-2xl p-3 flex flex-col items-start justify-center tactile-card text-left transition-all" type="button">
<span class="text-base font-extrabold text-[#EEF6F7] tracking-tight">though</span>
<span class="text-xs font-semibold text-[#A9BFC1] font-mono mt-0.5">/ðəʊ/</span>
</button>
<!-- Option B: thought (Selected State) -->
<button class="answer-card-selected min-h-[72px] bg-[#122A2E] border-2 border-[#3BD4C7] rounded-2xl p-3 flex flex-col items-start justify-center tactile-card-selected text-left transition-all relative" type="button">
<div class="w-full flex items-center justify-between">
<span class="text-base font-extrabold text-[#EEF6F7] tracking-tight">thought</span>
<span class="w-5 h-5 rounded-full bg-[#3BD4C7] text-[#003733] flex items-center justify-center shrink-0">
<span class="material-symbols-rounded text-sm font-black">check</span>
</span>
</div>
<span class="text-xs font-bold text-[#6BD8CE] font-mono mt-0.5">/θɔːt/</span>
</button>
<!-- Option C: through -->
<button class="answer-card min-h-[72px] bg-[#162529] border-2 border-[#2B424B] rounded-2xl p-3 flex flex-col items-start justify-center tactile-card text-left transition-all" type="button">
<span class="text-base font-extrabold text-[#EEF6F7] tracking-tight">through</span>
<span class="text-xs font-semibold text-[#A9BFC1] font-mono mt-0.5">/θruː/</span>
</button>
<!-- Option D: tough -->
<button class="answer-card min-h-[72px] bg-[#162529] border-2 border-[#2B424B] rounded-2xl p-3 flex flex-col items-start justify-center tactile-card text-left transition-all" type="button">
<span class="text-base font-extrabold text-[#EEF6F7] tracking-tight">tough</span>
<span class="text-xs font-semibold text-[#A9BFC1] font-mono mt-0.5">/tʌf/</span>
</button>
</div>
</section>
<!-- Bottom Primary CTA Area -->
<footer class="pt-6 pb-2">
<button class="w-full min-h-[52px] py-3.5 px-6 rounded-2xl bg-gradient-to-r from-[#F2553B] to-[#FF6F43] text-white font-extrabold text-base tracking-wide flex items-center justify-center gap-2 border-2 border-[#E03A1F] tactile-btn-coral uppercase transition-all shadow-lg shadow-[#F2553B]/20" type="button">
<span>CHECK</span>
<span class="material-symbols-rounded text-xl font-bold">arrow_forward</span>
</button>
</footer>
</div>
</main>
</body></html>
