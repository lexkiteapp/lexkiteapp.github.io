<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexkite — IELTS Sound Drill (Bright Day Mobile)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              teal: '#2BA39A',
              tealDeep: '#0F3D3E',
              tealDark: '#165B57',
              cream: '#FFF7EA',
              card: '#FFFFFF',
              border: '#EADEC8',
              ledge: '#D8CFBC',
              coral: '#F2553B',
              coralLedge: '#B53A22',
              amber: '#FFB054',
              ink: '#0F3D3E',
              inkSecondary: '#3A5658',
              successTeal: '#0E7A71',
            }
          }
        }
      }
    }
  </script>
  <style>
    .tactile-card {
      box-shadow: 0 4px 0 0 #D8CFBC;
    }
    .tactile-card-selected {
      box-shadow: 0 4px 0 0 #165B57;
    }
    .tactile-btn-coral {
      box-shadow: 0 5px 0 0 #B53A22;
    }
    .tactile-btn-coral:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 #B53A22;
    }
    .tactile-play-btn {
      box-shadow: 0 6px 0 0 #12514D;
    }
    .tactile-play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 0 #12514D;
    }
    .tactile-pill-btn {
      box-shadow: 0 3px 0 0 #D8CFBC;
    }
    .tactile-pill-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 0 #D8CFBC;
    }
    .answer-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #D8CFBC;
    }
    .answer-card-selected:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 #165B57;
    }
  </style>
</head>
<body class="bg-[#F4EFE6] text-brand-ink font-sans antialiased min-h-screen flex items-center justify-center p-0 sm:p-4">

  <!-- Mobile Device Frame (Native 390px, edge-to-edge app container) -->
  <main class="w-full max-w-[390px] min-h-[100dvh] bg-brand-cream flex flex-col justify-between shadow-2xl relative overflow-hidden select-none border-x border-brand-border">

    <!-- Top Lesson Header (No tab bar, No hearts/lives counter, No gem clutter) -->
    <header class="w-full pt-4 px-5 pb-2 shrink-0">
      <div class="flex items-center gap-4">
        <!-- Close (X) button with minimum 44x44px touch target -->
        <button type="button" aria-label="Exit lesson" class="w-11 h-11 min-w-[44px] min-h-[44px] rounded-full bg-white border-2 border-brand-border flex items-center justify-center text-brand-tealDeep tactile-pill-btn transition-transform">
          <span class="material-symbols-rounded text-2xl">close</span>
        </button>

        <!-- Progress bar tracking drill step -->
        <div class="flex-1">
          <div class="w-full h-3 bg-[#E8DEC9] rounded-full overflow-hidden p-0.5 border border-brand-border">
            <div class="h-full bg-brand-teal rounded-full w-[45%] transition-all duration-300"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- Scrollable Content Area -->
    <div class="flex-1 px-5 pt-3 pb-6 flex flex-col justify-between overflow-y-auto">
      
      <!-- Drill Header & Context -->
      <section class="space-y-4">
        <!-- Badges & Section Category -->
        <div class="flex flex-wrap items-center gap-2">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-[#E6F5F3] text-brand-tealDeep border border-[#A5DDD7]">
            <span class="w-2 h-2 rounded-full bg-brand-teal"></span>
            IELTS Sound Lab • Minimal Pairs
          </span>
        </div>

        <!-- Main Title & Subtitle (designed to safely wrap without truncation) -->
        <div class="space-y-1">
          <h1 class="text-2xl font-extrabold tracking-tight text-brand-tealDeep leading-tight">
            Tap what you hear
          </h1>
          <p class="text-sm font-semibold text-brand-inkSecondary leading-relaxed">
            Distinguish minimal vowel pairs at exam speed
          </p>
        </div>

        <!-- Teacher Card (Coach Ama) with empty rounded teacher-slot placeholder -->
        <div class="bg-white rounded-2xl p-3.5 border-2 border-brand-border tactile-card flex items-start gap-3">
          <!-- Empty rounded Teacher-Slot container (2D teacher added later via code) -->
          <div class="w-14 h-14 min-w-[56px] min-h-[56px] rounded-xl border-2 border-dashed border-brand-teal bg-[#F0FAF9] flex flex-col items-center justify-center p-1 text-center shrink-0" aria-label="Teacher avatar placeholder">
            <span class="material-symbols-rounded text-brand-teal text-xl">school</span>
            <span class="text-[9px] font-extrabold uppercase tracking-tight text-brand-tealDeep leading-none mt-0.5">teacher-slot</span>
          </div>

          <!-- Coach speech bubble & tip -->
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap mb-1">
              <span class="text-xs font-extrabold text-brand-tealDeep">Coach Ama</span>
              <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-md bg-[#E6F5F3] text-brand-tealDark border border-[#BCE8E4]">IELTS Examiner</span>
            </div>
            <p class="text-xs font-semibold text-brand-tealDeep leading-snug">
              “Listen for the vowel sound in the middle.”
            </p>
          </div>
        </div>

        <!-- Audio Interactive Orb & Speed Control -->
        <div class="py-2 flex flex-col items-center justify-center gap-2">
          <div class="flex items-center justify-center gap-3">
            <!-- Big Round Audio Play Button -->
            <button type="button" aria-label="Play sound pronunciation" class="w-20 h-20 min-w-[80px] min-h-[80px] rounded-full bg-brand-teal text-white flex flex-col items-center justify-center tactile-play-btn border-2 border-brand-tealDark transition-transform active:scale-95">
              <span class="material-symbols-rounded text-3xl">graphic_eq</span>
              <span class="text-[10px] font-extrabold tracking-wider uppercase mt-0.5">Listen</span>
            </button>

            <!-- 0.75x Slow Replay Toggle Button -->
            <button type="button" aria-label="Play at 0.75x slow speed" class="min-h-[44px] px-3.5 py-2 rounded-2xl bg-white border-2 border-brand-border tactile-pill-btn flex items-center gap-1.5 text-xs font-extrabold text-brand-tealDeep transition-transform">
              <span class="material-symbols-rounded text-base text-brand-teal">slow_motion_video</span>
              <span>0.75x</span>
            </button>
          </div>
          
          <span class="text-[11px] font-semibold text-brand-inkSecondary tracking-tight">
            Replay available anytime • Tap word to pick
          </span>
        </div>

        <!-- 4 Large Answer Cards in a 2x2 Responsive Grid -->
        <div class="grid grid-cols-2 gap-3 pt-1">
          
          <!-- Option A: though -->
          <button type="button" class="answer-card min-h-[72px] bg-white border-2 border-brand-border rounded-2xl p-3 flex flex-col items-start justify-center tactile-card text-left transition-all">
            <span class="text-base font-extrabold text-brand-tealDeep tracking-tight">though</span>
            <span class="text-xs font-semibold text-brand-inkSecondary font-mono mt-0.5">/ðəʊ/</span>
          </button>

          <!-- Option B: thought (Selected State) -->
          <button type="button" class="answer-card-selected min-h-[72px] bg-[#E8FAF7] border-2 border-brand-teal rounded-2xl p-3 flex flex-col items-start justify-center tactile-card-selected text-left transition-all relative">
            <div class="w-full flex items-center justify-between">
              <span class="text-base font-extrabold text-brand-tealDeep tracking-tight">thought</span>
              <span class="w-5 h-5 rounded-full bg-brand-teal text-white flex items-center justify-center shrink-0">
                <span class="material-symbols-rounded text-sm font-bold">check</span>
              </span>
            </div>
            <span class="text-xs font-bold text-brand-successTeal font-mono mt-0.5">/θɔːt/</span>
          </button>

          <!-- Option C: through -->
          <button type="button" class="answer-card min-h-[72px] bg-white border-2 border-brand-border rounded-2xl p-3 flex flex-col items-start justify-center tactile-card text-left transition-all">
            <span class="text-base font-extrabold text-brand-tealDeep tracking-tight">through</span>
            <span class="text-xs font-semibold text-brand-inkSecondary font-mono mt-0.5">/θruː/</span>
          </button>

          <!-- Option D: tough -->
          <button type="button" class="answer-card min-h-[72px] bg-white border-2 border-brand-border rounded-2xl p-3 flex flex-col items-start justify-center tactile-card text-left transition-all">
            <span class="text-base font-extrabold text-brand-tealDeep tracking-tight">tough</span>
            <span class="text-xs font-semibold text-brand-inkSecondary font-mono mt-0.5">/tʌf/</span>
          </button>

        </div>
      </section>

      <!-- Bottom Primary CTA Area -->
      <footer class="pt-6 pb-2">
        <button type="button" class="w-full min-h-[52px] py-3.5 px-6 rounded-2xl bg-gradient-to-r from-brand-coral to-[#F77745] text-white font-extrabold text-base tracking-wide flex items-center justify-center gap-2 border-2 border-[#D63E24] tactile-btn-coral uppercase transition-all">
          <span>Check</span>
          <span class="material-symbols-rounded text-xl font-bold">arrow_forward</span>
        </button>
      </footer>

    </div>

  </main>

</body>
</html>
