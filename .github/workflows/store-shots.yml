# Ảnh Chrome Web Store chụp từ add-on thật (scripts/store-shots.mjs) – lưu vào nhánh "store-shots" để tải về store/chrome/.
name: Ảnh Chrome Web Store
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/store-shots.yml', 'scripts/store-shots.mjs']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Chụp
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.50.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-color-emoji fonts-noto-cjk fonts-noto-core >/dev/null
          bash scripts/build-extension.sh
          node scripts/store-shots.mjs /tmp/store-shots
      - name: Lưu vào nhánh store-shots
        run: |
          cd /tmp/store-shots && git init -q && git checkout -q -b store-shots
          git config user.name "lexkite-bot"; git config user.email "lexkite-bot@users.noreply.github.com"
          git add . && git commit -qm "Ảnh Chrome Web Store $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store-shots
