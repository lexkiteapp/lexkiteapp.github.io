# Kiểm kho footage trên Kho Drive HẰNG TUẦN: (1) mọi mục manifest có ≥ 2 bản sao khoẻ trên ≥ 2 Drive khác nhau, dung lượng khớp;
# (2) mẫu ngẫu nhiên: tải mọi bản sao, so sha256; (3) diễn tập khôi phục: dựng lại vài file (có mp4) từ Drive vào thư mục tạm, kiểm sha256.
# Có lỗi → workflow đỏ + cảnh báo 'footage' (op footage_alert) hiện ở Quản trị → Kho Drive (banner cảnh báo cùng chỗ với quota/mất kết nối).
# Secret: LEXKITE_DRIVE_CLI_KEY. Tài liệu: docs/VIDEO.md §Kho footage.
name: footage-verify
on:
  workflow_dispatch:
    inputs:
      sample: { description: 'Số mục lấy mẫu tải về kiểm sha256', default: '40' }
  schedule:
    - cron: '17 3 * * 1'
concurrency: { group: footage-verify, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sổ Drive + mẫu ngẫu nhiên
        run: node scripts/footage/verify.mjs --sample "${{ github.event.inputs.sample || '40' }}"
      - name: Diễn tập khôi phục (mp4 + mẫu bất kỳ)
        id: drill
        run: |
          node scripts/footage/restore.mjs --out "$RUNNER_TEMP/restore" --match '\.mp4$' --sample 2
          node scripts/footage/restore.mjs --out "$RUNNER_TEMP/restore" --sample 5
          rm -rf "$RUNNER_TEMP/restore"
      - name: Cảnh báo Quản trị nếu diễn tập khôi phục lỗi
        if: ${{ failure() && steps.drill.outcome == 'failure' }}
        run: node --input-type=module -e "import {driveApi} from './scripts/video/library.mjs'; await driveApi('footage_alert',{ok:false,n:1,msg:'diễn tập khôi phục footage lỗi (footage-verify.yml)'})"
