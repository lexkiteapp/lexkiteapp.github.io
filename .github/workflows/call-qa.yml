# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 📞 QA cuộc gọi Ama/Carlos + phát âm: e2e Chromium thật (SpeechRecognition giả + Whisper tiny.en THẬT với mẫu âm thanh espeak-ng thu sẵn),
# ảnh 1280/375 px, video màn hình, bảng trước (main) / sau (PR). Không tài khoản thật, không tốn credit. Kịch bản: scripts/test/call-e2e.mjs
name: call-qa
on:
  pull_request:
    paths: ['web/js/call.js', 'web/js/call/**', 'web/js/lesson/teacher.js', 'web/js/teacher-rig.js', 'web/js/audio.js', 'scripts/lipsync/**', 'scripts/cine/lipsync.py', 'scripts/test/lipsync.mjs', 'scripts/test/lipsync-cross.mjs', 'scripts/test/lipsync-lesson.mjs', 'web/js/pron.js', 'web/js/pron/**', 'web/js/ui.js', 'scripts/test/call-e2e.mjs', 'scripts/test/call-sheet.py', 'scripts/test/lip-shots.mjs', 'scripts/test/lip-sheet.py', '.github/workflows/call-qa.yml']
  push:
    branches: [main]
    paths: ['web/js/call.js', 'web/js/call/**', 'web/js/lesson/teacher.js', 'web/js/teacher-rig.js', 'web/js/audio.js', 'scripts/lipsync/**', 'scripts/cine/lipsync.py', 'scripts/test/lipsync.mjs', 'scripts/test/lipsync-cross.mjs', 'scripts/test/lipsync-lesson.mjs', 'web/js/pron.js', 'web/js/pron/**', 'web/js/ui.js', 'scripts/test/call-e2e.mjs', 'scripts/test/call-sheet.py', 'scripts/test/lip-shots.mjs', 'scripts/test/lip-sheet.py', '.github/workflows/call-qa.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: call-qa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    # luật 18 (CI làn nhanh, 16/11): PR chỉ chờ làn nhanh – việc nặng bỏ qua trên PR (skipped, không tốn máy), chạy SAU gộp trên push main; nhãn ready-heavy/ready = chạy nặng ngay trên PR
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-heavy') || contains(github.event.pull_request.labels.*.name, 'ready') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}', FIX: '${{ contains(github.event.pull_request.labels.*.name, ''main-red-fix'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          # máy gác 3/4 (23/11): CÙNG workflow đang ĐỎ trên main → dừng sớm (gate đỏ, 0 job nặng); main-red-retry.mjs chạy lại 1 lần khi main xanh. PR nhãn main-red-fix không bị chặn.
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}"); red=
          if [ "$go" = true ] && [ "$EV" = pull_request ] && [ "$FIX" != true ]; then
            m=$(gh api "repos/$REPO/actions/workflows/$wf/runs?branch=main&event=push&status=completed&per_page=5" --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0].conclusion' 2>/dev/null) || m=
            if [ "$m" = failure ]; then go=false; red=1; echo "::error title=main đỏ – chờ::$wf đang đỏ trên main – dừng sớm, tự chạy lại 1 lần khi main xanh"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
          [ -z "$red" ] || exit 1
  e2e:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ./.github/actions/setup-ffmpeg
      - uses: ./.github/actions/playwright-cache
        with: { browsers: '--with-deps chromium' }
      - name: Playwright + espeak-ng
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: espeak-ng }
      - name: Playwright + espeak-ng (tiếp)
        timeout-minutes: 14
        run: |
          python3 -m pip install -q pillow
      - name: Mẫu âm thanh (giọng espeak-ng, 16 kHz mono, có khoảng lặng)
        run: |
          mkdir -p fx
          espeak-ng -v en-us -s 140 -w fx/raw.wav "My name is Linh Nguyen."
          ffmpeg -y -loglevel error -f lavfi -t 0.6 -i anullsrc=r=16000:cl=mono -i fx/raw.wav -f lavfi -t 1.5 -i anullsrc=r=16000:cl=mono -filter_complex "[1:a]aresample=16000,aformat=channel_layouts=mono[v];[0:a][v][2:a]concat=n=3:v=0:a=1" -ar 16000 -ac 1 fx/name.wav
      - name: Khớp miệng – test đơn vị + chéo web↔video (1 bảng viseme, cùng chuỗi hình 24 fps; docs/LESSON-ENGINE.md §Khớp miệng)
        run: node scripts/test/lipsync.mjs && node scripts/test/lipsync-cross.mjs && node scripts/test/lipsync-lesson.mjs
      - name: E2E (bản mới) + Whisper thật
        run: node scripts/test/call-e2e.mjs --out qa/after --whisper fx/name.wav
      - name: Ảnh bản cũ (main)
        if: always()
        run: |
          git fetch -q --depth 1 origin main && git worktree add -q ../before FETCH_HEAD
          node scripts/test/call-e2e.mjs --before --root ../before/web --out qa/before || true
      - name: Ảnh khớp miệng trước/sau (Ama + Carlos)
        if: always()
        run: |
          node scripts/test/lip-shots.mjs --root web --out qa/lip-after || true
          node scripts/test/lip-shots.mjs --root ../before/web --out qa/lip-before || true
          python3 scripts/test/lip-sheet.py qa/lip-before qa/lip-after qa/lip-sheet.jpg || true
      - name: Bảng trước/sau
        if: always()
        run: |
          python3 scripts/test/call-sheet.py qa/before qa/after qa/sheet.png
          for f in qa/after/video/*.webm; do [ -f "$f" ] && ffmpeg -y -loglevel error -i "$f" -vf "scale=960:-2" -c:v libx264 -crf 30 -preset veryfast -pix_fmt yuv420p qa/call-demo.mp4 && break; done
          ls -la qa qa/after | head -40
          echo "### call-qa" >> $GITHUB_STEP_SUMMARY; cat qa/after/result.json >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: call-qa, path: qa, retention-days: 14 }
