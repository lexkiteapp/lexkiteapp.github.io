# 📞 QA cuộc gọi Ama/Carlos + phát âm: e2e Chromium thật (SpeechRecognition giả + Whisper tiny.en THẬT với mẫu âm thanh espeak-ng thu sẵn),
# ảnh 1280/375 px, video màn hình, bảng trước (main) / sau (PR). Không tài khoản thật, không tốn credit. Kịch bản: scripts/test/call-e2e.mjs
name: call-qa
on:
  pull_request:
    paths: ['web/js/call.js', 'web/js/call/**', 'web/js/lesson/teacher.js', 'web/js/audio.js', 'scripts/lipsync/**', 'scripts/cine/lipsync.py', 'scripts/test/lipsync.mjs', 'scripts/test/lipsync-cross.mjs', 'scripts/test/lipsync-lesson.mjs', 'web/js/pron.js', 'web/js/pron/**', 'web/js/ui.js', 'scripts/test/call-e2e.mjs', 'scripts/test/call-sheet.py', 'scripts/test/lip-shots.mjs', 'scripts/test/lip-sheet.py', '.github/workflows/call-qa.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: call-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ./.github/actions/setup-ffmpeg
      - name: Playwright + espeak-ng
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: espeak-ng }
      - name: Playwright + espeak-ng (tiếp)
        timeout-minutes: 14
        run: |
          python3 -m pip install -q pillow
      - name: Mẫu âm thanh (giọng espeak-ng, 16 kHz mono, có khoảng lặng)
        run: |
          mkdir -p fx
          espeak-ng -v en-us -s 140 -w fx/raw.wav "My name is Linh Nguyen."
          ffmpeg -y -loglevel error -f lavfi -t 0.6 -i anullsrc=r=16000:cl=mono -i fx/raw.wav -f lavfi -t 1.5 -i anullsrc=r=16000:cl=mono -filter_complex "[1:a]aresample=16000,aformat=channel_layouts=mono[v];[0:a][v][2:a]concat=n=3:v=0:a=1" -ar 16000 -ac 1 fx/name.wav
      - name: Khớp miệng – test đơn vị + chéo web↔video (1 bảng viseme, cùng chuỗi hình 24 fps; docs/LESSON-ENGINE.md §Khớp miệng)
        run: node scripts/test/lipsync.mjs && node scripts/test/lipsync-cross.mjs && node scripts/test/lipsync-lesson.mjs
      - name: E2E (bản mới) + Whisper thật
        run: node scripts/test/call-e2e.mjs --out qa/after --whisper fx/name.wav
      - name: Ảnh bản cũ (main)
        if: always()
        run: |
          git fetch -q --depth 1 origin main && git worktree add -q ../before FETCH_HEAD
          node scripts/test/call-e2e.mjs --before --root ../before/web --out qa/before || true
      - name: Ảnh khớp miệng trước/sau (Ama + Carlos)
        if: always()
        run: |
          node scripts/test/lip-shots.mjs --root web --out qa/lip-after || true
          node scripts/test/lip-shots.mjs --root ../before/web --out qa/lip-before || true
          python3 scripts/test/lip-sheet.py qa/lip-before qa/lip-after qa/lip-sheet.jpg || true
      - name: Bảng trước/sau
        if: always()
        run: |
          python3 scripts/test/call-sheet.py qa/before qa/after qa/sheet.png
          for f in qa/after/video/*.webm; do [ -f "$f" ] && ffmpeg -y -loglevel error -i "$f" -vf "scale=960:-2" -c:v libx264 -crf 30 -preset veryfast -pix_fmt yuv420p qa/call-demo.mp4 && break; done
          ls -la qa qa/after | head -40
          echo "### call-qa" >> $GITHUB_STEP_SUMMARY; cat qa/after/result.json >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: call-qa, path: qa, retention-days: 14 }
