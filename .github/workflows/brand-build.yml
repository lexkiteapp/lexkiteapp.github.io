# 🎨 Dựng tài sản thương hiệu từ brand/tokens.json (docs/BRAND-RULES.md) trên CI – máy cá nhân không render.
# Đẩy nhánh brand-build*: build-tokens → build-social-kit (PNG icon/logo/mạng xã hội) → build-extension → artifact bot-output-brand-build
# (2/11: không commit lại nhánh – đầu PR là commit bot thì CI treo; lấy về: bash scripts/ci/bot-output.sh brand-build, rồi tự commit);
# rồi chụp trước/sau (scripts/test/brand-shots.mjs: popup add-on, bài học, icon 48/96/512 sáng/tối). Artifact 7 ngày.
name: Brand build
on:
  push:
    branches: ['brand-build*']
permissions:
  contents: read
  pull-requests: write   # comment kết quả lên PR của nhánh
concurrency:
  group: brand-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[brand-build]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: { changed: '${{ steps.bo.outputs.changed }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dựng
        run: |
          node scripts/build-tokens.mjs
          SOCIAL_KIT_DEPS=/tmp/kitdeps node scripts/build-social-kit.mjs
          bash scripts/build-extension.sh
          node scripts/test/brand-check.mjs
      - name: Kết quả → artifact + summary + comment PR (không đẩy vào nhánh)
        id: bo
        uses: ./.github/actions/bot-output
        with: { name: brand-build, paths: brand web extension store, comment: 'true' }
  shots:
    needs: build
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Phủ bản dựng của job build
        if: needs.build.outputs.changed == '1'
        uses: actions/download-artifact@v4
        with: { name: bot-output-brand-build, path: . }
      - if: needs.build.outputs.changed == '1'
        run: if [ -f .bot-output-deleted ]; then xargs -d '\n' rm -f -- < .bot-output-deleted; rm -f .bot-output-deleted; fi
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Chụp
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: imagemagick fonts-noto-color-emoji fonts-noto-core }
      - name: Chụp (tiếp)
        run: |
          git worktree add -q /tmp/before "$(git merge-base origin/main HEAD)"
          node scripts/test/brand-shots.mjs "$PWD" /tmp/before out/brand
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: brand-shots, path: out/brand, retention-days: 7 }
