# 👩‍🏫 Kiểm hình "1 bộ nhân vật" (docs/CHARACTERS.md): chụp các màn có giáo viên trên bản build (hermetic) + lexkite.com (live), so hash mọi ảnh/clip
# nhân vật với web/teach/characters.json. Đẩy nhánh characters-shots* hoặc chạy tay. Artifact: ảnh chụp + audit.json + sheet.html.
name: Characters shots
on:
  workflow_dispatch:
    inputs:
      live: { description: 'Soát thêm bản live (URL, để trống = chỉ bản build)', required: false, default: 'https://lexkite.com' }
  push:
    branches: ['characters-shots*']
  pull_request:   # 3/11: cổng vòng nghỉ + mắt mở chạy trên PR chạm nhân vật (scripts/teach/idle.py --check)
    paths: ['web/teach/**', 'scripts/teach/**', 'web/js/characters.js', '.github/workflows/characters-shots.yml']
permissions:
  contents: read
concurrency:   # ci-policy 2/11: push/lịch trùng gộp; chạy tay (mỗi lượt khác input) không bao giờ bị huỷ
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ./.github/actions/setup-ffmpeg
      - name: Chụp + so hash
        env: { LIVE: "${{ github.event.inputs.live || 'https://lexkite.com' }}" }
        run: |
          set -o pipefail
          mkdir -p out
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
          pip install -q pillow numpy; python3 scripts/teach/edge_check.py web/teach | tee out/edge_check.txt || F=1
          python3 scripts/teach/idle.py --check web/teach | tee out/idle_check.txt || F=1   # vòng nghỉ: VP9 alpha + H.264 xếp chồng + poster, ≤ 150 KB, 1–3 s, sha; mọi ảnh tĩnh mắt mở
          node scripts/test/characters-shots.mjs web out/characters/build || F=1
          [ -z "$LIVE" ] || node scripts/test/characters-shots.mjs web out/characters/live --live "$LIVE" || echo "::warning::live còn tài sản nhân vật ngoài registry (trước khi deploy là đúng – xem audit.json)"
          [ -z "$F" ]
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: characters-shots, path: out/characters, retention-days: 7 }
