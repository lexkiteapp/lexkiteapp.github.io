# Đo tốc độ & chất lượng lexkite.com bằng Lighthouse (điện thoại, mạng 4G giả lập) – miễn phí trên máy chủ GitHub.
# Kết quả tóm tắt lưu vào reports/lighthouse.json để theo dõi theo thời gian (mục tiêu ≥ 95). Lần đo: ghi mọi mục LCP/render-blocking có thật trong báo cáo.
name: Đo tốc độ Lighthouse
on:
  schedule:
    - cron: '0 1 * * 1'   # thứ Hai hằng tuần
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/lighthouse.yml']
permissions:
  contents: write
jobs:
  lh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Chạy Lighthouse
        run: |
          mkdir -p reports
          for p in "" "vi/blog/"; do
            # đo 3 lần, lấy lần có điểm tốc độ trung vị (giảm dao động của máy chủ)
            for i in 1 2 3; do npx -y lighthouse@12.2.1 "https://lexkite.com/$p" --form-factor=mobile --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=/tmp/lh$i.json --quiet || true; done
            node -e "const fs=require('fs');const r=[1,2,3].map(i=>'/tmp/lh'+i+'.json').filter(f=>fs.existsSync(f)).map(f=>[f,require(f).categories.performance.score]).sort((a,b)=>a[1]-b[1]);if(!r.length)process.exit(1);fs.copyFileSync(r[Math.floor((r.length-1)/2)][0],'/tmp/lh.json')" || continue
            node -e "const d=require('/tmp/lh.json'),a=d.audits,c=d.categories;const o={url:d.finalDisplayedUrl,at:d.fetchTime,scores:Object.fromEntries(Object.entries(c).map(([k,v])=>[k,Math.round(v.score*100)])),metrics:Object.fromEntries(['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index'].map(k=>[k,a[k].displayValue])),fails:Object.values(a).filter(x=>x.score!==null&&x.score<0.9&&['binary','numeric','metricSavings'].includes(x.scoreDisplayMode)).map(x=>x.title+(x.displayValue?' – '+x.displayValue:'')).slice(0,25),lcp:(()=>{try{return Object.keys(a).filter(k=>/lcp|largest|render-blocking|network-dependency/i.test(k)).map(k=>k+'='+JSON.stringify((a[k].details&&(a[k].details.items||a[k].details))||a[k].displayValue||'').slice(0,700)).join(' || ')}catch(x){return 'err '+x.message}})()};const f='reports/lighthouse.json';let all={};try{all=require('./'+f)}catch(e){};all['${p:-home}']=o;require('fs').writeFileSync(f,JSON.stringify(all,null,1));console.log(JSON.stringify(o.scores))"
          done
      - name: Lưu kết quả
        run: |
          git config user.name "lexkite-bot"; git config user.email "lexkite-bot@users.noreply.github.com"
          git add reports/lighthouse.json; git diff --cached --quiet && exit 0
          git commit -qm "Báo cáo Lighthouse $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
