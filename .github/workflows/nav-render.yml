# Chuyển trang & Quay lại trên Chromium/WebKit(Safari)/Firefox – bắt lỗi vẽ lệch/chồng mảng/trắng. Chạy tay hoặc hằng ngày.
name: Kiểm chuyển trang (mọi trình duyệt)
on:
  schedule:
    - cron: '10 2 * * *'   # 09:10 giờ Việt Nam
  workflow_dispatch:
    inputs:
      base: { description: 'URL app', required: false, default: 'https://lexkite.com/app/' }
permissions:
  contents: read
jobs:
  nav:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Kiểm
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium webkit firefox
          node scripts/test/nav-render.mjs ${{ github.event.inputs.base || 'https://lexkite.com/app/' }}
