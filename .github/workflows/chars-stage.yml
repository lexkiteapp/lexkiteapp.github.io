# 🎭 Cổng chars-stage: Ama/Carlos đủ lớn, không cắt/lơ lửng, cảnh hai người đúng người nói, ở 390 px + desktop × sáng + tối (scripts/test/chars-stage-shots.mjs). Ảnh trước/sau: artifact chars-stage (sheet-390.png, sheet-desk.png), 14 ngày.
name: chars-stage
on:
  pull_request:
    paths: ['web/js/**', 'web/css/**', 'web/teach/**', 'web/app/index.html', 'web/index.html', 'scripts/test/chars-stage*', '.github/workflows/chars-stage.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: 'chars-stage-${{ github.ref }}', cancel-in-progress: true }   # ci-policy: lượt cũ cùng nhánh bị huỷ
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cài playwright
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium >/dev/null
      - name: Ảnh TRƯỚC (nhánh gốc, chỉ báo cáo)
        env: { BASE: "${{ github.event.pull_request.base.sha || 'origin/main' }}" }
        run: |
          git worktree add -q _before "$BASE"
          node scripts/test/chars-stage-shots.mjs _before/web out/chars-stage-before --report || true
          rm -f out/chars-stage-before/sheet-*.png
      - name: Cổng + ảnh SAU
        run: node scripts/test/chars-stage-shots.mjs web out/chars-stage
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: chars-stage, path: 'out/chars-stage*', retention-days: 14 }
