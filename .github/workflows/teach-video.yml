# ci-policy: heavy-gate – render video trên PR chờ npm test xanh (job `gate`, luật 11)
# teach-video: Teach2D templates (docs/VIDEO-TEACH2D.md) – ONE pilot per template, short 9:16 + lesson embed 16:9, review sheet. 0 credits.
# QC BEFORE render (script review, data facts, voice clock, layout / contrast / IPA / mouth / hook on the real timeline) and AFTER render
# (file, -16 LUFS, teacher visible, no blank frame) – a red gate stops the job. Host = TeacherRig (web/js/teacher-rig.js, rig_host.mjs: Ama/Carlos
# of web/teach/characters.json drawn frame by frame, mouth = the episode's Rhubarb visemes, gate lipsync_rig ±33 ms – docs/specs/video-production-v2.md §1).
# No GrabCast / Groq / Kling, no store, no Drive, no publish (owner approval gate).
name: teach-video
on:
  workflow_dispatch:
    inputs:
      eps: { description: 'comma list of episode ids (content/video/teach2d/eps), empty = shards / pilots', default: '' }
      shards: { description: 'render the next N gated episodes not yet in bank.json (gen.py --todo; ci-filler fills idle runners with this), 0 = pilots', default: '0' }
  pull_request:
    paths: ['scripts/video/teach2d/**', 'scripts/video/teach2d/rig_host.mjs', 'web/js/teacher-rig.js', 'web/js/call/**', 'web/js/characters.js', 'scripts/test/teach2d-rig.mjs', 'scripts/media/origin.py', 'scripts/cine/publish_meta.py', 'brand/library/sfx/**', 'scripts/video/synth.mjs', 'web/teach/characters.json', 'scripts/test/media-origin.py', 'scripts/ci/shards.mjs', 'scripts/video/remotion/src/teach/**', 'content/video/teach2d/**', '.github/workflows/teach-video.yml']
permissions: { contents: read, actions: read }   # actions: read = count busy runners (scripts/ci/shards.mjs)
concurrency: { group: 'teach-video-${{ github.ref }}-${{ github.event_name }}', cancel-in-progress: "${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}" }   # a batch on main is never cancelled by the next one (it queues); on a branch the newest sample run wins (5/11: an old run held the slot for hours)
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha → go=$go"
  preqc:   # gate 1 (seconds): generator self-checks, reviewed script == spec, motion parity
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { list: '${{ steps.m.outputs.list }}', par: '${{ steps.p.outputs.par }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/no-prod   # chặn DNS host prod (scripts/test/no-prod-hosts.mjs, #409)
      - name: Specs regenerate identically + reviewed scripts
        run: |
          python3 scripts/video/teach2d/gen.py -q
          git status --porcelain content/video/teach2d/eps | grep . && { echo "::error::eps/*.json differ from gen.py output (pilots.json + auto.json) – regenerate and review"; exit 1; }
          python3 scripts/test/teach2d-gen.py && python3 scripts/test/teach2d-autopub.py && python3 scripts/test/teach2d-store.py   # batch generator gates (data / level / hook / dup) + spelling syllables, regression cases
          python3 scripts/video/teach2d/mix.py --check   # 0-credit build bank: mix.json regenerates identically, 0 repeats in the window, diversity >= 70
          python3 scripts/test/teach2d-mix.py
          python3 scripts/video/teach2d/publish.py --check   # publish block of every episode (title / platforms) valid – docs/specs/video-production-v2.md §2
          python3 - <<'PY'
          import json, glob, sys
          R = json.load(open('content/video/teach2d/reviewed.json'))['verdicts']; bad = []
          for f in glob.glob('content/video/teach2d/eps/*.json'):
              e = json.load(open(f)); v = R.get(e['id']) or {}
              if not (v.get('hook_true') and v.get('script') == {l['id']: l['text'] for l in e['lines']}): bad.append(e['id'])
              elif v.get('machine') and not all((v.get('gates') or {}).get(g) for g in ('data', 'level', 'hook', 'dup')): bad.append(e['id'])   # machine verdict: every gate green
          print('unreviewed:', bad); sys.exit(1 if bad else 0)
          PY
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/test/motion-core.mjs
      - run: node scripts/test/teach2d-rig.mjs   # rig host plan + lipsync_rig gate on the core rig (no browser) + stress-label regression
      - run: python3 scripts/test/media-origin.py   # pictures from GitHub origins, Worker last (2/11 429)
      - id: p   # free runners, not a fixed 10/12 (owner 2/11: use idle CI for video): min(24, 40 - busy - 8), 8 kept for PR checks
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: echo "par=$(node scripts/ci/shards.mjs --left 48 --per 1 --cap 24 | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))')" >> "$GITHUB_OUTPUT"
      - id: m   # a batch takes only what the free runners finish in ~1.5 h (4 episodes per runner); ci-filler dispatches the next slice
        run: echo "list=$(python3 scripts/video/teach2d/gen.py --pick '${{ github.event.inputs.eps }}' '${{ github.event.inputs.shards }}' '${{ github.event_name }}' ${{ steps.p.outputs.par }})" >> "$GITHUB_OUTPUT"   # batch = facts re-verified live (gen.py --verify), not yet banked
  voice:
    needs: [preqc, gate]
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy: { fail-fast: false, max-parallel: '${{ fromJSON(needs.preqc.outputs.par) }}', matrix: { ep: '${{ fromJSON(needs.preqc.outputs.list) }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/no-prod   # chặn DNS host prod (scripts/test/no-prod-hosts.mjs, #409)
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/cache@v4
        with: { path: ~/.cache/pip, key: 'pip-teach2d-voice-${{ hashFiles(''scripts/cine/requirements.txt'') }}-fw1.0.3' }
      - run: timeout 480 pip install -q -r scripts/cine/requirements.txt faster-whisper==1.0.3
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with: { path: /tmp/kk/node_modules/@huggingface/transformers/.cache, key: video-models-kokoro82m-q8-cine-v1 }
      - name: kokoro-js + Rhubarb
        run: |
          bash scripts/ci/npm-retry.sh i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1 >/dev/null
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o /tmp/rh.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          mkdir -p /tmp/rh && unzip -q /tmp/rh.zip -d /tmp/rh
          R=$(find /tmp/rh -type f -name rhubarb | head -1); chmod +x "$R"; "$R" --version | grep -q 1.13
          echo "RHUBARB=$R" >> "$GITHUB_ENV"; echo "KOKORO_NODE_PATH=/tmp/kk/node_modules" >> "$GITHUB_ENV"
      - name: Voice (Kokoro teacher voice from the registry -> Rhubarb -> whisper word clock)
        run: |
          E=content/video/teach2d/eps/${{ matrix.ep }}.json
          python3 -c "import json;e=json.load(open('$E'));json.dump(dict(voices={e['teacher']:e['voice']},speed=e['speed'],lines=[dict(id=l['id'],who=e['teacher'],text=l['text']) for l in e['lines']]),open('lines.json','w'),indent=1)"
          python3 scripts/video/tpl/pilot5_voice.py lines.json vo   # lines faster than ~15 chars/s are re-synthesised slower (news_voice.py, floor 0.7)
          # learner pace (> 4.6 syllables/s) or a bad whisper clock -> voice that line again (max 2 rounds); qc.py gates the result
          for r in 1 2; do python3 scripts/video/teach2d/pace.py lines.json vo || break; NV_KEEP_SPEED=1 python3 scripts/video/tpl/pilot5_voice.py lines.json vo; done
          n=$(ls vo/vis3/*.words.json | wc -l); echo "$n lines voiced"; [ "$n" -gt 5 ] || { echo "::error::no voice"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: 'tvo-${{ matrix.ep }}-${{ github.run_id }}', path: 'vo/vis3/', retention-days: 3 }
  par:   # count free runners again before the render matrix (preqc's count is an hour old in a busy queue; 2/11 run 41380206879 was stuck at 1)
    needs: [preqc, voice, gate]
    if: ${{ (!cancelled() && needs.preqc.result == 'success') && needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs: { par: '${{ steps.p.outputs.par }}' }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts/ci\n.github/actions" }   # no-prod action (#409) lives in .github/actions
      - uses: ./.github/actions/no-prod   # chặn DNS host prod (scripts/test/no-prod-hosts.mjs, #409)
      - id: p
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: echo "par=$(node scripts/ci/shards.mjs --left $(( $(echo '${{ needs.preqc.outputs.list }}' | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))') * 2 )) --per 1 --cap 24 | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))')" >> "$GITHUB_OUTPUT"
  render:   # one red voice job no longer skips the whole batch: that episode's render fails on its missing voice artifact, the rest render
    needs: [preqc, voice, par, gate]
    if: ${{ (!cancelled() && needs.preqc.result == 'success' && needs.par.result == 'success') && needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy: { fail-fast: false, max-parallel: '${{ fromJSON(needs.par.outputs.par) }}', matrix: { ep: '${{ fromJSON(needs.preqc.outputs.list) }}', fmt: [short, wide] } }
    env: { O: 'out/${{ matrix.ep }}/${{ matrix.fmt }}', E: 'content/video/teach2d/eps/${{ matrix.ep }}.json', MEDIA_ORIGIN_ONLY: '1' }   # pictures from the GitHub origins only, never media.lexkite.com (Workers cap)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/no-prod   # chặn DNS host prod (scripts/test/no-prod-hosts.mjs, #409)
      - uses: ./.github/actions/setup-ffmpeg
      - run: pip install -q numpy==2.1.3 pillow==11.0.0 qrcode==7.4.2 pyflakes==3.2.0 && python3 -m pyflakes scripts/video/teach2d/*.py
      - uses: actions/download-artifact@v4
        with: { name: 'tvo-${{ matrix.ep }}-${{ github.run_id }}', path: vo }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: playwright-1.48.2-chromium-v1 }
      - name: Playwright Chromium (TeacherRig host)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null
          bash scripts/ci/pw-install.sh --with-deps chromium
      - name: Host layer (TeacherRig static geom -> props) + rig render (VP9 alpha, visemes of this voice)
        run: |
          mkdir -p $O; W=$(python3 -c "import json;print(json.load(open('$E'))['teacher'])")
          node scripts/video/teach2d/rig_host.mjs --geom-only $W host > $O/host.log   # pass 1: geometry for build.py (alpha union under every rig transform)
          TH=$(python3 -c "import json;print(json.load(open('$E'))['theme'])"); echo "TH=$TH" >> "$GITHUB_ENV"
          python3 scripts/video/teach2d/build.py --ep $E --vo vo --host host --format ${{ matrix.fmt }} --public $O/pub --out $O/props.json
          for A in dark dusk light; do [ $A = $TH ] && continue   # the other looks, for the owner's colour pick (stills only)
            python3 scripts/video/teach2d/build.py --ep $E --vo vo --host host --format ${{ matrix.fmt }} --theme $A --public $O/pub_$A --out $O/props_$A.json; done
          LAY=$(python3 -c "import json;print((json.load(open('content/video/teach2d/mix.json'))['mix'].get(json.load(open('$E'))['id']) or {}).get('layout','corner'))")
          if [ ${{ matrix.fmt }} = short ]; then for L in corner side bubble; do [ $L = $LAY ] && continue   # the other layouts (owner 29/10: show layout variety) – stills only
            python3 scripts/video/teach2d/build.py --ep $E --vo vo --host host --format short --layout $L --public $O/pub_lay_$L --out $O/props_lay_$L.json; done; fi
          # pass 2: the rig on this timeline (same voice clock in every look/layout) -> rig.webm + rig.frames.json, then into every pub dir
          node scripts/video/teach2d/rig_host.mjs $O/props.json.timeline.json vo host | tee -a $O/host.log
          cp host/rig.frames.json $O/; for P in $O/pub $O/pub_*; do cp host/rig.webm $P/host_rig.webm; done
      - name: QC before render (timeline gates, every look – stops here, no render minutes spent on a bad layout)
        run: |
          python3 scripts/video/teach2d/qc.py --timeline $O/props.json.timeline.json --out $O/qc_pre.json
          for A in dark dusk light; do [ $A = $TH ] || python3 scripts/video/teach2d/qc.py --timeline $O/props_$A.json.timeline.json --out $O/qc_pre_$A.json; done
          for L in corner side bubble; do [ -f $O/props_lay_$L.json ] && python3 scripts/video/teach2d/qc.py --timeline $O/props_lay_$L.json.timeline.json --out $O/qc_pre_lay_$L.json; done; true
      - uses: actions/cache@v4
        with: { path: scripts/video/remotion/node_modules, key: 'remotion-${{ hashFiles(''scripts/video/remotion/package-lock.json'') }}-v1' }
      - uses: ./.github/actions/apt
        with: { packages: libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2t64 fonts-noto-color-emoji }
      - name: Remotion (Chrome Headless Shell)
        run: |
          cd scripts/video/remotion && npm ci --no-audit --no-fund >/dev/null && npx remotion browser ensure >/dev/null && echo "Remotion OK"
      - name: Render (30 fps, CRF 17 short / CRF 26 embed) + other-theme stills
        run: |
          cd scripts/video/remotion; R=$GITHUB_WORKSPACE/$O; Q="--crf=17 --audio-bitrate=192k"; [ ${{ matrix.fmt }} = short ] || Q="--crf=26 --audio-bitrate=128k"
          npx remotion render src/index.jsx teach-short "$R/${{ matrix.ep }}-${{ matrix.fmt }}.mp4" --props="$R/props.json" --public-dir="$R/pub" --codec=h264 $Q --audio-codec=aac --concurrency=2 --log=error
          for A in dark dusk light; do [ $A = $TH ] && continue
            for t in $(python3 -c "import json;T=json.load(open('$R/props_$A.json.timeline.json'));L=list(T['lines'].values());print(' '.join(str(round((L[i]['t0']+L[i]['t1'])/2,2)) for i in (2,len(L)-3)))"); do
              npx remotion still src/index.jsx teach-short "$R/alt_${A}_$t.png" --props="$R/props_$A.json" --public-dir="$R/pub_$A" --frame=$(python3 -c "print(int($t*30))") --log=error; done; done
          if [ ${{ matrix.fmt }} = short ]; then
            TS=$(python3 -c "import json;T=json.load(open('$R/props.json.timeline.json'));L=list(T['lines'].values());print(' '.join(str(round((L[i]['t0']+L[i]['t1'])/2,2)) for i in (3,len(L)-3)))")
            LAY=$(python3 -c "import json;T=json.load(open('$R/props.json.timeline.json'));print(T.get('layout') or 'corner')")   # the mix layout of the real render (mix.py) – stills for the OTHER two
            for t in $TS; do ffmpeg -nostdin -v error -y -ss $t -i "$R/${{ matrix.ep }}-short.mp4" -frames:v 1 "$R/lay_${LAY}_$t.png"
              for L in corner side bubble; do [ $L = $LAY ] && continue; npx remotion still src/index.jsx teach-short "$R/lay_${L}_$t.png" --props="$R/props_lay_$L.json" --public-dir="$R/pub_lay_$L" --frame=$(python3 -c "print(int($t*30))") --log=error; done; done
          fi
      - name: QC after render (file, loudness, teacher visible, frames) + contact sheet
        shell: bash
        run: |
          set -o pipefail
          V=$O/${{ matrix.ep }}-${{ matrix.fmt }}.mp4
          python3 scripts/video/teach2d/qc.py --timeline $O/props.json.timeline.json --video $V --sheet $O/${{ matrix.ep }}-${{ matrix.fmt }}.sheet.jpg --out $O/qc.json | tee $O/qc.log
          ffmpeg -nostdin -v error -y -ss 3 -i $V -frames:v 1 -q:v 3 $O/${{ matrix.ep }}-${{ matrix.fmt }}.poster.jpg
          if [ ${{ matrix.fmt }} = short ]; then mkdir -p $O/phone; ffmpeg -nostdin -v error -y -i $V -c:v libx264 -preset slow -crf 20 -maxrate 6500k -bufsize 13000k -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart $O/phone/${{ matrix.ep }}.mp4; fi
          rm -rf $O/pub $O/pub_*
          { echo "### ${{ matrix.ep }} · ${{ matrix.fmt }}"; echo '```'; grep -E '^(PASS|FAIL)|score' $O/qc.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'tv-${{ matrix.ep }}-${{ matrix.fmt }}-${{ github.run_id }}'
          path: |
            ${{ env.O }}/*.mp4
            ${{ env.O }}/phone/*.mp4
            ${{ env.O }}/*.jpg
            ${{ env.O }}/*.png
            ${{ env.O }}/*.vtt
            ${{ env.O }}/qc*.json
            ${{ env.O }}/*.log
            ${{ env.O }}/props*.json*
            ${{ env.O }}/rig.frames.json
            ${{ env.O }}/rig.diag/
          retention-days: 14
  embed:   # in-app embed preview screenshots (light + dark, phone + desktop) of every 16:9 lesson video
    needs: [render, gate]
    if: ${{ !cancelled() && contains(fromJSON('["success","failure"]'), needs.render.result) && needs.gate.outputs.go == 'true' }}   # nothing rendered (preqc red -> render skipped) = nothing to screenshot; never hold a runner / the concurrency slot
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 4 screenshots per episode; a 120-episode batch takes ~25 min
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/no-prod   # chặn DNS host prod (scripts/test/no-prod-hosts.mjs, #409)
      - uses: actions/download-artifact@v4
        with: { pattern: 'tv-*-wide-${{ github.run_id }}', path: art, merge-multiple: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund playwright@1.48.2 && (google-chrome --version || bash scripts/ci/pw-install.sh --with-deps chrome)
        timeout-minutes: 12
      - name: Screenshots
        run: |
          mkdir -p shots; (python3 -m http.server 8765 >/dev/null 2>&1 &); sleep 1; cat > shot.mjs <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs'; import path from 'path';
          const b = await chromium.launch({ channel: 'chrome' }); let n = 0;   // real Chrome: H.264 (Playwright's Chromium has no proprietary codecs)
          for (const d of fs.readdirSync('art')) {
            const dir = path.resolve('art', d), mp4 = fs.readdirSync(dir).find(f => f.endsWith('-wide.mp4')); if (!mp4) continue;
            const id = mp4.replace('-wide.mp4', ''), vtt = fs.readdirSync(dir).find(f => f.endsWith('.vtt')), poster = fs.readdirSync(dir).find(f => f.endsWith('poster.jpg'));
            for (const theme of ['light', 'dark']) for (const [w, h, tag] of [[390, 844, 'phone'], [1366, 900, 'desktop']]) {
              const p = await b.newPage({ viewport: { width: w, height: h }, deviceScaleFactor: 2 });
              const U = f => `http://127.0.0.1:8765/art/${d}/${f}`;
              const q = new URLSearchParams({ v: U(mp4), poster: poster ? U(poster) : '', vtt: vtt ? U(vtt) : '', theme, title: id.split('_').slice(1, 2)[0].toUpperCase() + ' · watch & learn', chip: 'LESSON · VIDEO' });
              await p.goto('http://127.0.0.1:8765/docs/mocks/teach-video/embed.html?' + q);
              await p.waitForFunction(() => document.getElementById('v').readyState >= 1, null, { timeout: 20000 });
              await p.evaluate(() => new Promise(r => { const v = document.getElementById('v'); v.addEventListener('seeked', r, { once: true }); v.currentTime = 6; }));
              await p.waitForFunction(() => document.getElementById('v').readyState >= 3, null, { timeout: 20000 }); await p.waitForTimeout(1200);   // decoded frame, no loading spinner
              if (!(await p.evaluate(() => document.getElementById('v').videoWidth))) { console.error('video did not decode', id); process.exit(1); } await p.screenshot({ path: `shots/${id}-${theme}-${tag}.png` }); n++; await p.close();
            }
          }
          await b.close(); console.log('screenshots', n); if (!n) process.exit(1);
          JS
          node shot.mjs
      - uses: actions/upload-artifact@v4
        with: { name: 'tv-embed-shots-${{ github.run_id }}', path: shots/, retention-days: 14 }
  sheet:   # one review sheet: every episode's frames + QC score, both themes; then the bank (only QC >= 90 with every gate green)
    needs: [preqc, render, embed, gate]
    if: ${{ !cancelled() && contains(fromJSON('["success","failure"]'), needs.render.result) && needs.gate.outputs.go == 'true' }}   # no render (preqc red) -> no sheet, no runner held
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ssh-key: '${{ secrets.BOT_DEPLOY_KEY }}' }   # bank.json -> main over the deploy key (ruleset); the push step itself runs on main dispatch only
      - uses: ./.github/actions/no-prod   # chặn DNS host prod (scripts/test/no-prod-hosts.mjs, #409)
      - uses: actions/download-artifact@v4
        with: { pattern: 'tv-*-${{ github.run_id }}', path: art }
      - run: pip install -q pillow==11.0.0
      - name: Bank verdicts + score table (short AND wide QC >= 90, every gate green, no duplicate video)
        if: always()
        run: |
          python3 scripts/video/teach2d/bank.py collect art '${{ needs.preqc.outputs.list }}' ${{ github.run_id }} $RUNNER_TEMP/bank-delta.json review-bank.md bank
          mkdir -p review && cp review-bank.md review/ && cp $RUNNER_TEMP/bank-delta.json review/ && cat review-bank.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'tv-bank-${{ github.run_id }}', path: 'bank/', retention-days: 90, if-no-files-found: ignore }   # banked videos (phone 9:16, embed 16:9, poster)
      - name: Clips through autopub_gate -> lexkite-shorts (never posts; no Drive/prod call here, the daily drive-shorts + shorts-migrate move media)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env: { KEY: '${{ secrets.SHORTS_DEPLOY_KEY }}' }
        run: |
          [ -d bank ] || { echo "no banked video"; exit 0; }
          [ -n "$KEY" ] || { echo "::warning::SHORTS_DEPLOY_KEY missing - clips stay in the 90-day artifact"; exit 0; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/shorts && chmod 600 ~/.ssh/shorts
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/shorts -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --sparse git@github.com:lexkiteapp/lexkite-shorts.git /tmp/shorts
          python3 scripts/video/teach2d/store.py art bank $RUNNER_TEMP/bank-delta.json /tmp/shorts ${{ github.run_number }} ${{ github.sha }}
          bash scripts/cine/archive_new.sh /tmp/shorts
          cd /tmp/shorts; git add --sparse -A shorts .gitignore; git -c user.name="Lexkite CI" -c user.email="lexkiteapp@users.noreply.github.com" commit -qm "teach-video #${{ github.run_number }} [CF-Pages-Skip]" || exit 0
          pushed=; for k in 1 2 3 4; do git push -q origin HEAD:main && { pushed=1; break; }; git pull -q --rebase --autostash origin main; done
          rm -f ~/.ssh/shorts
          [ -n "$pushed" ] || { echo "::error::could not push lexkite-shorts after 4 tries"; exit 1; }
      - name: bank.json + BANK.md -> main (batch on main only; regenerated on the newest main – scripts/ci/commit-regen.sh)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        run: |
          bash scripts/ci/commit-regen.sh "teach-video: bank ${{ github.run_id }} [CF-Pages-Skip] [skip ci]" "python3 scripts/video/teach2d/bank.py merge $RUNNER_TEMP/bank-delta.json" content/video/teach2d/bank.json content/video/teach2d/BANK.md content/video/teach2d/PUBLISH.md
      - name: Review sheet + score table (red when any episode < 90 or a gate fails, or nothing rendered)
        if: always()
        env: { LIST: '${{ needs.preqc.outputs.list }}' }
        run: python3 scripts/video/teach2d/sheet.py art review
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'tv-review-${{ github.run_id }}', path: review/, retention-days: 14 }
