# ci-policy: no-concurrency – chỉ chạy tay/gọi lại, mỗi lượt khác input; nhóm chung sẽ HUỶ lượt đang chờ = mất việc (docs/CI-RUNNERS.md)
# Thí nghiệm giọng từ đơn (chỉ chạy tay): so cách tổng hợp Kokoro cho từ ngắn + Piper dự phòng, nghe lại bằng faster-whisper. Không đẩy gì.
name: word-audio-lab
on:
  workflow_dispatch:
    inputs:
      words: { description: 'Từ thử', default: 'away after see walk just to for the of and a be we or so do upon into there some' }
permissions: { contents: read }
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy: { fail-fast: false, matrix: { dtype: [q8, fp32] } }
    env: { KOKORO_DTYPE: '${{ matrix.dtype }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: ./.github/actions/setup-ffmpeg
      - run: bash scripts/ci/npm-retry.sh i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1
      - uses: actions/cache@v4
        with: { path: /tmp/kk/node_modules/@huggingface/transformers/.cache, key: 'kokoro-82m-v1-${{ matrix.dtype }}' }
      - env:
          LX_WORDS: ${{ github.event.inputs.words }}
        run: NODE_PATH=/tmp/kk/node_modules node scripts/word-audio/lab.mjs "$LX_WORDS"
      - run: pip install -q "faster-whisper==1.2.1" "av==18.1.0" && python3 scripts/word-audio/lab.py
