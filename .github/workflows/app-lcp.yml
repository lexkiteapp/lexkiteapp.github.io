# Đo LCP/perf màn đầu app (/app/) – Lighthouse 12 mobile, trung vị 3 lần, trên dist (localhost, không nén – cùng điều kiện docs/UX-PUBLIC.md).
# In: điểm, LCP/FCP/TBT/CLS/SI, phần tử LCP + các pha, tài nguyên chặn hiển thị, request trước LCP. Artifact = JSON Lighthouse.
name: App LCP
on:
  workflow_dispatch:
    inputs:
      only: { description: 'route-vitals: chỉ các route (welcome,today,…)', default: '' }
      trace: { description: 'route-vitals: in thác tài nguyên tới LCP (1)', default: '' }
      base: { description: 'route-vitals: gốc đo (vd preview Pages)', default: '' }
      ux1: { description: 'trước/sau: giao diện Stitch ux1 (1) hay mặc định (0)', default: '1' }
  push:
    branches: ['perf/app-lcp*']
    paths: ['web/app/index.html', 'web/css/**', 'web/js/i18n.js', 'web/js/app.js', 'web/sw.js', '.github/workflows/app-lcp.yml', 'scripts/test/app-lcp-probe.mjs', 'scripts/build-web.sh', 'scripts/app-loader.mjs', 'scripts/test/route-vitals.mjs', 'scripts/build-hash.mjs', 'web/_headers', 'web/fonts/**', 'scripts/build-fonts.mjs']
permissions:
  contents: read
concurrency:   # ci-policy 2/11: push/lịch trùng gộp; chạy tay (mỗi lượt khác input) không bao giờ bị huỷ
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build + serve dist
        run: |
          npm ci --no-audit --no-fund && bash scripts/build-web.sh >/dev/null
          (cd dist && python3 -m http.server 8080 >/dev/null 2>&1 &) ; sleep 1
      - name: LCP probe (Playwright)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2 && bash scripts/ci/pw-install.sh chromium
          node scripts/app-loader.mjs --check dist/app/index.html
          node scripts/test/app-lcp-probe.mjs http://localhost:8080
      - name: So sánh offline với main (cùng phép thử)
        if: ${{ !cancelled() }}
        run: |
          git fetch -q --depth 1 origin main && git worktree add -q ../base FETCH_HEAD && (cd ../base && npm ci --no-audit --no-fund >/dev/null && bash scripts/build-web.sh >/dev/null)
          (cd ../base/dist && python3 -m http.server 8081 >/dev/null 2>&1 &) ; sleep 1
          node scripts/test/app-lcp-probe.mjs http://localhost:8081 --func || true
      - name: Lighthouse mobile ×3
        if: ${{ !cancelled() }}
        run: |
          mkdir -p lh
          for p in "app/?hl=en" "app/?hl=vi"; do
            k=$(echo "$p" | tr -c 'a-z0-9' '_')
            for i in 1 2 3; do npx -y lighthouse@12.2.1 "http://localhost:8080/$p" --form-factor=mobile --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh/$k$i.json --quiet || true; done
            node -e "
              const fs=require('fs');const fsr=[1,2,3].map(i=>'lh/$k'+i+'.json').filter(f=>fs.existsSync(f)).map(f=>JSON.parse(fs.readFileSync(f)));
              fsr.sort((a,b)=>a.categories.performance.score-b.categories.performance.score);const d=fsr[Math.floor((fsr.length-1)/2)],a=d.audits;
              const it=k=>((a[k]&&a[k].details&&a[k].details.items)||[]);
              const el=it('largest-contentful-paint-element');
              const lcpMs=a['largest-contentful-paint'].numericValue;
              const o={url:'$p',runs:fsr.map(r=>Math.round(r.categories.performance.score*100)+'/'+r.audits['largest-contentful-paint'].displayValue),
                scores:Object.fromEntries(Object.entries(d.categories).map(([k,v])=>[k,Math.round(v.score*100)])),
                m:Object.fromEntries(['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','interactive'].map(k=>[k,a[k].displayValue])),
                kb:Math.round(a['total-byte-weight'].numericValue/1024),
                lcpEl:JSON.stringify(el).slice(0,900),
                blocking:it('render-blocking-resources').map(x=>x.url+' '+Math.round(x.wastedMs)+'ms'),
                beforeLcp:it('network-requests').filter(x=>x.networkRequestTime<lcpMs*1.0).map(x=>x.url.replace('http://localhost:8080','')+' '+Math.round((x.transferSize||0)/1024)+'KB @'+Math.round(x.networkRequestTime)).slice(0,60),
                fails:Object.values(a).filter(x=>x.score!==null&&x.score<0.9&&['binary','numeric','metricSavings'].includes(x.scoreDisplayMode)).map(x=>x.id+(x.displayValue?':'+x.displayValue:''))};
              console.log(JSON.stringify(o,null,1))"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: app-lcp, path: lh, retention-days: 5 }
  # 6 route chính trên bản thật lexkite.com (4G chậm, CPU×4): LCP/TBT/CLS/INP + byte + 10 tài nguyên nặng nhất – docs/PERF-SCROLL.md › Tải trang
  routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cài Playwright
        timeout-minutes: 14
        run: npm i --no-save --no-audit --no-fund playwright@1.48.2 && bash scripts/ci/pw-install.sh --with-deps chromium
      - name: Đo 6 route ×3
        timeout-minutes: 18
        env: { ONLY: '${{ inputs.only }}', TRACE: '${{ inputs.trace }}' }
        run: node scripts/test/route-vitals.mjs ${{ inputs.base || 'https://lexkite.com' }} out/route-vitals.json
      - name: Trước/sau trên bản dựng dist (main vs nhánh, máy chủ có nén, cùng runner)
        if: ${{ github.ref != 'refs/heads/main' && !cancelled() }}
        timeout-minutes: 40
        env: { ONLY: 'today,review,lesson', UX1: "${{ inputs.ux1 || '1' }}" }
        run: |
          mkdir -p out
          b() { (cd "$1" && npm ci --no-audit --no-fund >/dev/null && bash scripts/build-web.sh) > "$2" 2>&1 || { echo "::error::dựng $1 lỗi"; grep -v -E '│|╵|WARNING|original key' "$2" | tail -40; exit 1; }; }
          b . out/build-head.log
          git fetch -q --depth 1 origin main && git worktree add -q ../base FETCH_HEAD && b ../base out/build-base.log
          npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null  # npm ci ở trên xoá bản cài --no-save của bước trước
          (node scripts/test/serve-web.mjs ../base/dist 8081 >/dev/null 2>&1 &) ; (node scripts/test/serve-web.mjs dist 8080 >/dev/null 2>&1 &) ; sleep 2
          echo "### TRƯỚC (main) – lạnh"; node scripts/test/route-vitals.mjs http://localhost:8081 out/before.json
          echo "### SAU (nhánh) – lạnh"; node scripts/test/route-vitals.mjs http://localhost:8080 out/after.json
          echo "### TRƯỚC (main) – ấm"; WARM=1 node scripts/test/route-vitals.mjs http://localhost:8081 out/before-warm.json
          echo "### SAU (nhánh) – ấm"; WARM=1 node scripts/test/route-vitals.mjs http://localhost:8080 out/after-warm.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: route-vitals, path: out, retention-days: 14 }
