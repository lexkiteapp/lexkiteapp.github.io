# Tự build app iOS cho Simulator trên máy macOS của GitHub – miễn phí cho repo công khai, không cần ký (chưa có Apple Developer).
# Mục đích: bắt lỗi build sớm (Capacitor/SPM/Info.plist). Kết quả: lexkite-ios-sim.zip (App.app) để kéo thả vào Simulator.
# Khi có tài khoản Apple Developer: thêm bước ký (match/App Store Connect API key) + archive → TestFlight.
name: Build iOS (simulator)
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'scripts/build-mobile.sh', 'scripts/ios-widget-render.swift', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency:
  group: ios
  cancel-in-progress: true
jobs:
  sim:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web → mobile/www → cap sync
        run: |
          npm ci --prefix mobile --no-audit --no-fund
          ./scripts/build-mobile.sh
      - name: xcodebuild (iphonesimulator, không ký)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
          cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/lexkite-ios-sim.zip" App.app
      # Widget (WidgetKit) không đặt lên màn hình chính bằng lệnh được → render chính WidgetViews.swift bằng SwiftUI trên macOS
      - name: Ảnh widget màn hình chính/khóa (sáng/tối, vi + ar RTL)
        continue-on-error: true
        run: |
          mkdir -p shots
          swiftc -parse-as-library mobile/ios/App/LexkiteWidget/WidgetSnapshot.swift mobile/ios/App/LexkiteWidget/WidgetViews.swift \
            scripts/ios-widget-render.swift -o "$RUNNER_TEMP/lexrender"
          "$RUNNER_TEMP/lexrender" shots
      - name: Chụp màn hình demo trên iPhone giả lập (xem nhanh mỗi bản build)
        continue-on-error: true
        run: |
          DEV=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-9][^(]*\(([A-F0-9-]+)\)' | grep -oE '[A-F0-9-]{36}')
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          APP=mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl install "$DEV" "$APP"; mkdir -p shots
          xcrun simctl launch "$DEV" com.lexkite.app; sleep 12; xcrun simctl io "$DEV" screenshot shots/ios-1-start.png
          xcrun simctl ui "$DEV" appearance dark; sleep 3; xcrun simctl io "$DEV" screenshot shots/ios-2-dark.png
          xcrun simctl openurl "$DEV" "capacitor://localhost/#/review" || true; sleep 5; xcrun simctl io "$DEV" screenshot shots/ios-3-review.png
      - uses: actions/upload-artifact@v4
        with:
          name: lexkite-ios-sim
          path: lexkite-ios-sim.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexkite-ios-screenshots
          path: shots/
