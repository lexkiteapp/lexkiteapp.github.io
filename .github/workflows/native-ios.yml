# App iOS NATIVE (SwiftUI, native/ios) – build + test trên máy macOS của GitHub (repo công khai, miễn phí). Không build trên Mac của chủ.
# Kiểm: vector chuẩn chấm điểm/FSRS khớp web, đủ 15 ngôn ngữ, khung 5 tab, snapshot 390 pt sáng/tối × en/vi/ar/de, build app (XcodeGen, không ký).
# Spec: docs/specs/native-apps.md. Bản Capacitor đang live vẫn ở mobile/ (ios.yml, ios-testflight.yml) cho tới khi native đạt parity.
name: Native iOS (SwiftUI)
on:
  pull_request:
    paths: ['native/ios/**', 'native/shared/**', 'scripts/native/**', '.github/workflows/native-ios.yml', 'mobile/ios/App/App/GoogleService-Info.plist', 'web/js/ota-key.js']
  push:
    branches: [main]
    paths: ['native/ios/**', 'native/shared/**', 'scripts/native/**', '.github/workflows/native-ios.yml', 'mobile/ios/App/App/GoogleService-Info.plist', 'web/js/ota-key.js']
  workflow_dispatch:
    inputs:
      record: { description: 'Ghi lại ảnh snapshot chuẩn (khi đổi giao diện có chủ đích)', type: boolean, default: false }
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60   # lần resolve Firebase đầu; có cache SPM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/ios/build/SourcePackages
          key: spm-native-ios-${{ hashFiles('native/ios/project.yml', 'native/ios/LexkiteKit/Package.swift') }}
          restore-keys: spm-native-ios-
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Một nguồn – file sinh khớp nguồn web (tokens, chuỗi 15 ngôn ngữ, khung, vector chấm điểm)
        run: node scripts/native/gen.mjs --check
      - name: Test LexkiteKit (chuẩn + snapshot)
        working-directory: native/ios/LexkiteKit
        run: |
          SCHEME=$(xcodebuild -list -json | python3 -c 'import json,sys;s=json.load(sys.stdin)["workspace"]["schemes"];print(next((x for x in s if x.endswith("-Package")),s[0]))')
          echo "scheme=$SCHEME"
          # Chọn Xcode 26 + đích từ CHÍNH xcodebuild; máy chủ thiếu runtime → thử Xcode khác / tạo máy (scripts/native/ios-sim.sh)
          DEST=$(bash "$GITHUB_WORKSPACE/scripts/native/ios-sim.sh")
          test -n "$DEST" || { echo "::error::không tìm thấy iPhone giả lập hợp lệ trên mọi Xcode 26"; xcodebuild -showdestinations -scheme "$SCHEME"; exit 1; }
          xcodebuild -version
          SCHEME=$(xcodebuild -list -json | python3 -c 'import json,sys;s=json.load(sys.stdin)["workspace"]["schemes"];print(next((x for x in s if x.endswith("-Package")),s[0]))')
          echo "dest=$DEST scheme=$SCHEME"; echo "LK_DEST=$DEST" >> "$GITHUB_ENV"   # cùng máy giả lập cho snapshot chạy trong app chủ
          T=(xcodebuild test -scheme "$SCHEME" -destination "$DEST" -skipPackagePluginValidation)
          N=$(ls Tests/LKSnapshotTests/__Snapshots__/*/*.png 2>/dev/null | wc -l)
          if [ "${{ inputs.record }}" = "true" ] || [ "$N" -lt 436 ]; then   # đếm cả 8 ảnh khung 5 tab (bước "trong app chủ" ghi) cùng thư mục: thiếu bất kỳ ảnh nào → ghi ảnh thiếu (#721: so 54 bỏ sót ảnh Pace)
            # ghi lại TẤT CẢ khi bấm tay record; thiếu ảnh (test mới) → chỉ ghi ảnh còn thiếu, ảnh chuẩn đã commit vẫn được so
            MODE=$([ "${{ inputs.record }}" = "true" ] && echo 1 || echo missing)
            echo "::warning::Ảnh snapshot chuẩn $N/436 → ghi ($MODE), rồi chạy lại để kiểm ổn định; tải artifact native-ios-snapshots và commit vào Tests/LKSnapshotTests/__Snapshots__"
            # xcodebuild only forwards TEST_RUNNER_-prefixed env to the simulator test process (prefix stripped → SNAPSHOT_RECORD)
            TEST_RUNNER_SNAPSHOT_RECORD=$MODE bash "$GITHUB_WORKSPACE/scripts/native/xctest.sh" "$RUNNER_TEMP/record.log" "${T[@]}" -only-testing:LKSnapshotTests || true
          fi
          bash "$GITHUB_WORKSPACE/scripts/native/xctest.sh" "$RUNNER_TEMP/test.log" "${T[@]}"
      - name: Build app (XcodeGen → simulator, không ký)
        working-directory: native/ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild -project Lexkite.xcodeproj -scheme Lexkite -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E ': error:|error: |\*\* BUILD' "$RUNNER_TEMP/build.log" | sort -u | head -60 | sed 's/^/::error::/'; tail -15 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/build.log"   # lỗi biên dịch được in đầy đủ (trước: tail -30 che mất dòng error)
          APP=build/Build/Products/Debug-iphonesimulator/Lexkite.app
          test -d "$APP"
          # Một nguồn đã được tiêm (scheme callback Google + khoá nội dung từ web/js/ota-key.js + script migration)
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$APP/Info.plist" | grep -q googleusercontent
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :LKContentKeySPKI' "$APP/Info.plist")"
          test -f "$APP/migration-export.js"
      - name: Snapshot khung 5 tab trong app chủ (TabView iOS 26 chỉ vẽ được trong cửa sổ thật – target LexkiteSnapshots)
        working-directory: native/ios
        run: |
          T=(xcodebuild test -project Lexkite.xcodeproj -scheme Lexkite -destination "$LK_DEST" -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages CODE_SIGNING_ALLOWED=NO)
          S=LexkiteKit/Tests/LKSnapshotTests/__Snapshots__
          N=$(ls $S/AppShellSnapshotTests/testAppShell.*.png 2>/dev/null | wc -l)
          if [ "${{ inputs.record }}" = "true" ] || [ "$N" -lt 8 ]; then
            MODE=$([ "${{ inputs.record }}" = "true" ] && echo 1 || echo missing)
            echo "::warning::Ảnh khung 5 tab $N/8 → ghi ($MODE); tải artifact native-ios-snapshots và commit"
            TEST_RUNNER_SNAPSHOT_RECORD=$MODE bash "$GITHUB_WORKSPACE/scripts/native/xctest.sh" "$RUNNER_TEMP/record-app.log" "${T[@]}" || true
          fi
          bash "$GITHUB_WORKSPACE/scripts/native/xctest.sh" "$RUNNER_TEMP/test-app.log" "${T[@]}"
          ls $S/*/*.png | wc -l | xargs -I{} sh -c 'test {} -ge 436 || { echo "::error::thiếu ảnh snapshot ({})"; exit 1; }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-snapshots
          path: native/ios/LexkiteKit/Tests/LKSnapshotTests/__Snapshots__
          retention-days: 14
  # Ma trận thiết bị (spec §7): parity + bố cục trên từng cỡ màn, song song. Đích lấy từ xcodebuild (không dùng simctl – runtime cũ → exit 70).
  devices:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone SE (3rd generation)', 'iPhone 17', 'iPhone 17 Pro Max', 'iPad*']   # iPad*: tên iPad đổi theo ảnh máy chủ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: ~/Library/Caches/org.swift.swiftpm, key: 'spm-native-ios-kit-${{ hashFiles(''native/ios/LexkiteKit/Package.swift'') }}' }
      - name: LKFeaturesTests + LKSyncTests trên ${{ matrix.device }}
        working-directory: native/ios/LexkiteKit
        env: { DEVICE: '${{ matrix.device }}' }
        run: |
          SCHEME=$(xcodebuild -list -json | python3 -c 'import json,sys;s=json.load(sys.stdin)["workspace"]["schemes"];print(next((x for x in s if x.endswith("-Package")),s[0]))')
          DEST=$(bash "$GITHUB_WORKSPACE/scripts/native/ios-sim.sh" --name "$DEVICE")
          test -n "$DEST" || { echo "::error::không có $DEVICE trên mọi Xcode 26"; exit 1; }
          SCHEME=$(xcodebuild -list -json | python3 -c 'import json,sys;s=json.load(sys.stdin)["workspace"]["schemes"];print(next((x for x in s if x.endswith("-Package")),s[0]))')
          bash "$GITHUB_WORKSPACE/scripts/native/xctest.sh" "$RUNNER_TEMP/test.log" xcodebuild test -scheme "$SCHEME" -destination "$DEST" -skipPackagePluginValidation \
            -only-testing:LKFeaturesTests -only-testing:LKSyncTests
