# 👩‍🏫 Dựng bộ nhân vật DUY NHẤT (web/teach/, nguồn web/teach/characters.json) từ clip phông xanh đã tách nền PRO – 0 credit, máy cá nhân không render.
# Đẩy nhánh teach-build* (hoặc chạy tay): tải thưa đúng các clip nguồn trong characters.json từ lexkite-footage → scripts/teach/build.py
# (cùng khung mọi tư thế, cùng cỡ đầu Ama/Carlos, H.264 xếp chồng alpha + poster + avatar + sha256) → tờ soát scripts/teach/sheet.py → commit lại nhánh.
name: Teach build
on:
  workflow_dispatch:
    inputs:
      matte_run: { description: 'id lượt matte-pro có artifact matte-<clip> (clip mới chưa vào kho footage)', required: false, default: '' }
      matte_run2: { description: 'lượt matte-pro thứ 2 (tuỳ chọn)', required: false, default: '' }
  push:
    branches: ['teach-build*']
permissions:
  contents: write
  actions: read
concurrency:
  group: teach-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[teach-build]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Footage (sparse)
        env: { KEY: '${{ secrets.FOOTAGE_DEPLOY_KEY }}' }
        run: |
          [ -n "$KEY" ] || { echo "::error::missing FOOTAGE_DEPLOY_KEY"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/footage && chmod 600 ~/.ssh/footage
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/footage -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --no-checkout git@github.com:lexkiteapp/lexkite-footage.git footage
          P=$(python3 -c "import json;R=json.load(open('web/teach/characters.json'));print(' '.join(f'/anchor/green/kfull_pro/{c[\"src\"]}.mp4 /anchor/green/kmask_pro/{c[\"src\"]}.mkv' for p in R['people'].values() for c in p['clips'].values()))")
          git -C footage sparse-checkout set --no-cone $P; git -C footage checkout -q; rm -f ~/.ssh/footage; du -sh footage
      - name: Clip mới từ lượt matte-pro (chưa vào kho)
        if: inputs.matte_run != ''
        uses: actions/download-artifact@v4
        with: { run-id: '${{ inputs.matte_run }}', pattern: 'matte-*', merge-multiple: true, path: footage/anchor/green, github-token: '${{ github.token }}' }
      - if: inputs.matte_run2 != ''
        uses: actions/download-artifact@v4
        with: { run-id: '${{ inputs.matte_run2 }}', pattern: 'matte-*', merge-multiple: true, path: footage/anchor/green, github-token: '${{ github.token }}' }
      - name: Dựng
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; pip install -q pillow numpy
          python3 scripts/teach/build.py footage/anchor/green web/teach
          python3 scripts/teach/sheet.py web/teach out/teach-sheet.jpg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/teach
          git diff --cached --quiet || { git commit -q -m "teach: bộ nhân vật 2D duy nhất (characters.json) [teach-build] [CF-Pages-Skip]"; git push -q origin HEAD:${GITHUB_REF_NAME}; }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: teach, path: "web/teach\nout/teach-sheet.jpg", retention-days: 7 }
