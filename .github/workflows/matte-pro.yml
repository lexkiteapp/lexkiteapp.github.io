name: matte-pro
# PRO host matte (scripts/video/matte_pro.py): ViTMatte on a chroma trimap + ML foreground + flow-stable alpha, 0 credits, CPU.
# One job per clip; results = artifacts matte-<clip> (green/kfull_pro + kmask_pro) -> pulled locally, then scripts/footage-backup.sh.
on:
  workflow_dispatch:
    inputs:
      clips: { description: 'clip ids (comma)', default: 'ga4_talk_natural,gc4_talk_natural' }
      engine: { description: 'vitmatte | cf', default: 'vitmatte' }
      sheet: { description: 'crop sheet clip:frame list (empty = no compare job)', default: 'ga4_talk_natural:30,ga4_talk_natural:75,gc4_talk_natural:30,gc4_talk_natural:75' }
      video: { description: 'clips for the 10 s before/after mp4', default: 'ga4_talk_natural,gc4_talk_natural' }
      extra: { description: 'extra matte_pro.py args (e.g. --edge-pull 0.7)', default: '' }
      from_run: { description: 'compare only: reuse matte-* artifacts of this run id (skips matting)', default: '' }
permissions: { contents: read, actions: read }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { clips: '${{ steps.p.outputs.clips }}' }
    steps:
      - id: p
        env: { C: '${{ inputs.clips }}' }
        run: python3 -c "import json,os,re;c=[x for x in os.environ['C'].split(',') if x];assert c and all(re.fullmatch(r'[a-z0-9_]+',x) for x in c),c;open(os.environ['GITHUB_OUTPUT'],'a').write('clips='+json.dumps(c)+'\n')"
  matte:
    needs: plan
    if: inputs.from_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: { fail-fast: false, matrix: { clip: '${{ fromJSON(needs.plan.outputs.clips) }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - &footage
        name: Footage (sparse)
        env: { KEY: '${{ secrets.FOOTAGE_DEPLOY_KEY }}', CLIPS: '${{ inputs.clips }}' }
        run: |
          [ -n "$KEY" ] || { echo "::error::missing FOOTAGE_DEPLOY_KEY"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/footage && chmod 600 ~/.ssh/footage
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/footage -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --no-checkout git@github.com:lexkiteapp/lexkite-footage.git footage
          P="/anchor/bg/classroom.png"; for c in ${CLIPS//,/ }; do P="$P /anchor/tools/dl24/$c.mp4 /anchor/green/kfull/$c.mp4 /anchor/green/kmask/$c.mp4"; done
          git -C footage sparse-checkout set --no-cone $P; git -C footage checkout -q; rm -f ~/.ssh/footage; du -sh footage
      - uses: actions/cache@v4
        with: { path: ~/.cache/pip, key: matte-pip-v1 }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: 'matte-hf-v1-${{ inputs.engine }}' }
      - name: Deps (MIT / Apache-2.0 / BSD only)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -q transformers==4.46.3 pymatting==1.1.13 opencv-python-headless==4.10.0.84 numpy==2.1.3 scipy==1.14.1 pillow==11.0.0
      - name: Matte ${{ matrix.clip }}
        run: python3 scripts/video/matte_pro.py footage/anchor/tools/dl24/${{ matrix.clip }}.mp4 footage/anchor/green --id ${{ matrix.clip }} --engine ${{ inputs.engine }} $EXTRA
        env: { EXTRA: '${{ inputs.extra }}' }
      - name: Edge QA (old vs PRO; PRO must pass)
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/video/matte_qa.py layer footage/anchor/green ${{ matrix.clip }} --old | tee footage/anchor/green/kmask_pro/${{ matrix.clip }}.qa_old.json || true
          python3 scripts/video/matte_qa.py layer footage/anchor/green ${{ matrix.clip }} | tee footage/anchor/green/kmask_pro/${{ matrix.clip }}.qa.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'matte-${{ matrix.clip }}', path: 'footage/anchor/green/k*_pro/', retention-days: 14 }
  compare:
    needs: matte
    if: always() && inputs.sheet != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - *footage
      - uses: actions/download-artifact@v4
        with: { pattern: 'matte-g*', path: footage/anchor/green, merge-multiple: true, run-id: '${{ inputs.from_run || github.run_id }}', github-token: '${{ github.token }}' }
      - name: Crop sheet + before/after + metrics
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q opencv-python-headless==4.10.0.84 numpy==2.1.3 scipy==1.14.1
          python3 scripts/video/matte_compare.py footage/anchor/green footage/anchor/bg/classroom.png out --sheet '${{ inputs.sheet }}' --video '${{ inputs.video }}' --metrics '${{ inputs.clips }}'
      - uses: actions/upload-artifact@v4
        with: { name: matte-compare, path: out/, retention-days: 14 }
