# Mô phỏng chi phí D1 / Functions theo người dùng trên D1 CỤC BỘ của Miniflare (workerd) – số rows_read/rows_written thật, KHÔNG gọi production.
# Ngoại suy 10k / 100k / 1M DAU từ số đo / người (không dội tải thật). Đỏ khi: có truy vấn đường người dùng quét cả bảng, hoặc số đo = 0.
# Tài liệu: docs/CAPACITY.md · mã: scripts/capacity/{sim,meter,model}.mjs
name: capacity-sim
on:
  workflow_dispatch:
    inputs:
      users: { description: 'người mẫu / hồ sơ', required: false, default: '5' }
  push:
    branches: [main, capacity-sim, scale-v2]
    paths: ['functions/api/**', 'scripts/capacity/**', '.github/workflows/capacity-sim.yml']
  schedule:
    - cron: '40 4 * * 1'
concurrency: { group: capacity-sim, cancel-in-progress: true }
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Miniflare (D1 cục bộ)
        run: npm i --no-save --no-audit --no-fund miniflare@4.20260730.0
      - name: Mô phỏng (Miniflare)
        run: node scripts/capacity/sim.mjs --d1=miniflare --users=${{ github.event.inputs.users || '5' }} --seed=1500 --json=out/capacity/miniflare.json --md=out/capacity/miniflare.md
      - name: Mô phỏng kiến trúc cũ (--legacy, Miniflare) để so trước/sau
        run: node scripts/capacity/sim.mjs --d1=miniflare --legacy --users=${{ github.event.inputs.users || '5' }} --seed=1500 --json=out/capacity/miniflare-legacy.json --md=out/capacity/miniflare-legacy.md
      - name: Mô phỏng (ước lượng node:sqlite, đối chiếu)
        if: always()
        run: node scripts/capacity/sim.mjs --users=3 --seed=1500 --json=out/capacity/sqlite.json --md=out/capacity/sqlite.md
      - name: Kiểm số đo khác 0
        run: node -e "const r=require('./out/capacity/miniflare.json');const t=r.profiles.typical;if(!(t.reads>0&&t.writes>0&&t.requests>0)){console.error('số đo = 0',t);process.exit(1)}"
      - name: Tóm tắt
        if: always()
        run: cat out/capacity/*.md >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capacity-sim, path: out/capacity/, retention-days: 30 }
