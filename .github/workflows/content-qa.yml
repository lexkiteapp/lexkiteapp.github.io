# 🛡️ Cổng QA nội dung hằng đêm (docs/CONTENT-QA.md) – 0 token AI, chỉ đọc repo: lược đồ + kho từ · ✗/✓ · CEFR · 2 giám khảo · dịch · kiểm mẫu lô · tự ẩn.
# Cùng cổng chạy ở mỗi push (ci.yml, npm test) và trước khi job sinh nội dung commit (explain.yml). Đêm: báo cáo xu hướng (reports/content-qa.json → job summary).
# Job score (P0.7, docs/CONTENT-WORLD-PLAN.md §3.5): bảng điểm các mảng (gồm "Dễ học" P0-H → LEARN.md) `npm run content:score` ở PR/push nội dung + đêm; đỏ khi điểm < sàn
# (content/pipeline/score.budget.json), sàn bị hạ so với main, hoặc một nguồn đếm = 0. Đêm trên main: commit content/pipeline/SCORE.md nếu đổi.
# Sổ: infra/jobs.json (id content-qa). Tắt: disable workflow; cổng push vẫn chạy.
name: Content QA gate
on:
  schedule:
    - cron: '10 23 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/js/**'
      - 'web/packs/**'
      - 'content/**'
      - 'scripts/content-score.mjs'
      - 'scripts/content-qa/**'
      - 'scripts/test/content-check.mjs'
      - 'scripts/lib/content-load.mjs'
      - 'scripts/build-lexicon.mjs'
      - 'scripts/lexicon/**'
      - 'scripts/i18n-qa.mjs'
      - '.github/workflows/content-qa.yml'
  push:
    branches: [main]
    paths:
      - 'web/js/**'
      - 'web/packs/**'
      - 'content/**'
      - 'scripts/content-score.mjs'
      - 'scripts/content-qa/**'
      - 'scripts/test/content-check.mjs'
      - 'scripts/lib/content-load.mjs'
      - 'scripts/build-lexicon.mjs'
      - 'scripts/lexicon/**'
      - 'scripts/i18n-qa.mjs'
      - '.github/workflows/content-qa.yml'
permissions:
  contents: read
concurrency:
  group: content-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
jobs:
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/no-prod
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: Cổng QA nội dung
        run: node scripts/test/content-qa.mjs && node scripts/content-qa/gate.mjs --json
      - name: Tóm tắt
        if: always()
        run: |
          test -f reports/content-qa.json && node -e "const r=require('./reports/content-qa.json');const t=Object.entries(r.counts).sort((a,b)=>b[1]-a[1]).slice(0,15);console.log('## Content QA\n\nLỗi cứng: '+r.hard.length+'\n\n| nguồn/loại | số | baseline |\n|---|---|---|\n'+t.map(([k,n])=>'| '+k+' | '+n+' | '+(r.base[k]||0)+' |').join('\n')+'\n\nCách dùng từ có ghi chú: '+r.info.usage.pct+'%')" >> "$GITHUB_STEP_SUMMARY" || true
  score:
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # chỉ lịch/dispatch mới đẩy SCORE.md lên main → mã PR không cầm khoá deploy (khoá vượt ruleset)
        with: { ssh-key: "${{ github.event_name != 'pull_request' && secrets.BOT_DEPLOY_KEY || '' }}", fetch-depth: 0 }
      - uses: ./.github/actions/no-prod
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dễ học – dễ nhớ (P0-H, docs/specs/learnability.md) – test bộ chấm
        run: node scripts/test/learnability.mjs
      - name: Bảng điểm nội dung (chỉ tăng)
        run: node scripts/content-score.mjs --base origin/main
      - name: Tóm tắt
        if: always()
        run: test -f content/pipeline/SCORE.md && cat content/pipeline/SCORE.md >> "$GITHUB_STEP_SUMMARY" && sed -n '1,12p' content/pipeline/LEARN.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Đêm – commit SCORE.md nếu đổi
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          git diff --quiet -- content/pipeline/SCORE.md content/pipeline/LEARN.md && exit 0
          bash scripts/ci/push-main.sh 'content:score – cập nhật SCORE.md + LEARN.md' content/pipeline/SCORE.md content/pipeline/LEARN.md
