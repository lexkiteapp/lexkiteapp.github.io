# Kiểm thử đầu-cuối add-on thật (scripts/test/ext-e2e.mjs) – nhiều ngôn ngữ giao diện song song; báo cáo + ảnh → nhánh "ext-qa".
name: Kiểm thử add-on (E2E)
on:
  workflow_dispatch:
    inputs:
      ext_ref: { description: 'Kiểm add-on của commit cũ (ảnh "trước khi sửa"); để trống = bản hiện tại', default: '' }
      langs: { description: 'Ngôn ngữ (JSON)', default: '["vi","en","es","ja","zh","ar"]' }
  push:
    branches: [main]
    # extension/app: chỉ các file bảng tra + khung app dùng (đổi lúc nào cũng phải kiểm add-on thật); toàn bộ web sẽ tốn 6 runner mỗi lần gộp – phần còn lại do J7 (journey-e2e, PR) + ext-bundles (npm test) canh
    paths: ['extension/*.js', 'extension/*.html', 'extension/*.css', 'extension/manifest.json', 'extension/app/js/app.js', 'extension/app/js/ui.js', 'extension/app/js/dictionary.js', 'extension/app/js/core.js', 'extension/app/js/lex.js', 'scripts/build-extension.sh', 'scripts/test/ext-e2e.mjs', 'scripts/test/lib/no-prod.mjs', '.github/actions/no-prod/**', '.github/workflows/ext-e2e.yml']
concurrency: { group: "ext-e2e-${{ inputs.ext_ref || 'cur' }}", cancel-in-progress: true }
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(inputs.langs || '["vi","en","es","ja","zh","ar"]') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/no-prod
        # trang tĩnh lexkite.com live cần cho mục 6 (Pages tĩnh không tính lượt; /api do no-prod.mjs mock). media.lexkite.com KHÔNG chặn DNS:
        # ảnh minh họa do service worker CỦA ADD-ON tải (Playwright không route được SW extension) – ≈ 10 lượt/ngôn ngữ/lượt ≈ 120/ngày; hết khi media sang R2 (#406)
        with: { hosts: 'audio.lexkite.com', sw: 'off' }
      - name: Dùng add-on của commit cũ
        if: inputs.ext_ref != ''
        run: git checkout ${{ inputs.ext_ref }} -- extension web
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Kiểm thử ${{ matrix.lang }}
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.50.1
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: fonts-noto-color-emoji fonts-noto-cjk fonts-noto-core }
      - name: Kiểm thử ${{ matrix.lang }} (tiếp)
        run: |
          bash scripts/build-extension.sh
          LANG_T=${{ matrix.lang }} node scripts/test/ext-e2e.mjs /tmp/ext-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'qa-${{ matrix.lang }}', path: /tmp/ext-qa/, retention-days: 7 }
  publish:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { path: /tmp/ext-qa, pattern: 'qa-*', merge-multiple: true }
      - name: Lưu báo cáo vào nhánh ext-qa
        run: |
          cd /tmp/ext-qa && git init -q && git checkout -q -b ext-qa
          git config user.name "lexkite-bot"; git config user.email "lexkite-bot@users.noreply.github.com"
          git add . && git commit -qm "Kiểm thử add-on $(date -u +%F\ %T) [CF-Pages-Skip]"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ inputs.ext_ref != '' && 'ext-qa-before' || 'ext-qa' }}
