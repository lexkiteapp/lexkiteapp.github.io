# Lip-sync lab (docs/specs/call-lipsync.md): cắt 9 hình miệng 2D từ clip registry, giọng Kokoro + Rhubarb, đo trong Chromium (CPU 4×), dựng video ≤ 20 s. 0 credit, không chạy trên Mac.
name: lipsync-lab
on:
  workflow_dispatch:
  push:
    paths: ['scripts/lipsync/**', 'scripts/test/lipsync.mjs', 'web/js/call/lipsync.js', 'web/js/call/mouths.js', 'web/js/call/face.js', 'web/lab/lipsync.html', 'web/lab/face.html', '.github/workflows/lipsync-lab.yml']
concurrency:
  group: lipsync-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: /tmp/kk/node_modules/@huggingface/transformers/.cache
          key: video-models-kokoro82m-q8-lipsync-v1
      - name: Cài công cụ (bản chính chủ, license rõ)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m pip install -q opencv-python-headless==4.10.0.84 numpy
          npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          npm i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1 >/dev/null
          curl -fsSL -o /tmp/rh.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          mkdir -p /tmp/rh && unzip -q /tmp/rh.zip -d /tmp/rh
          R=$(find /tmp/rh -type f -name rhubarb | head -1); chmod +x "$R"; echo "RHUBARB=$R" >> "$GITHUB_ENV"; echo "KOKORO_NODE_PATH=/tmp/kk/node_modules" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-py-82m-v1
      - name: Kokoro python (Apache-2.0) – sinh tiếng + mốc âm vị cùng một lần
        run: |
          sudo apt-get install -y -qq espeak-ng >/dev/null
          python3 -m pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q kokoro==0.9.4 soundfile
          echo "KOKORO_PY=1" >> "$GITHUB_ENV"
      - name: Test đơn vị
        run: node scripts/test/lipsync.mjs
      - name: Bảng 9 miệng vẽ (Ama + Carlos) để anh duyệt
        run: |
          python3 -m pip install -q resvg-py==0.2.0 pillow
          python3 scripts/lipsync/mouth_board.py qa/lipsync/mouth-board.png
          python3 scripts/lipsync/face_board.py qa/lipsync/face-board.png
      - name: Cắt hình miệng
        run: |
          mkdir -p qa/lipsync
          for w in ama carlos; do python3 scripts/lipsync/harvest.py $w web/lab/lipsync/$w; cp web/lab/lipsync/$w/harvest.jpg qa/lipsync/harvest-$w.jpg; done
      - name: Đo + dựng video
        run: node scripts/lipsync/lab.mjs
      - name: Mặt VẼ khớp tiếng (lệch ≤ 45 ms, đúng hình ≥ 80 %, 0 nháy, chớp mắt + video ≤ 20 s)
        if: always() && hashFiles('web/lab/lipsync/lines.json') != ''
        run: |
          rc=0; node scripts/lipsync/drawn_frames.mjs > qa/lipsync/drawn.txt || rc=$?
          cat qa/lipsync/drawn.txt; (echo; cat qa/lipsync/drawn.txt) >> qa/lipsync/report.md
          python3 scripts/lipsync/drawn_video.py; exit $rc
      - name: Tóm tắt
        if: always()
        run: cat qa/lipsync/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lipsync-lab
          path: |
            qa/lipsync/report.md
            qa/lipsync/metrics.json
            qa/lipsync/lipsync.mp4
            qa/lipsync/lipsync.gif
            qa/lipsync/harvest-*.jpg
            qa/lipsync/mouth-board.png
            qa/lipsync/drawn.mp4
            qa/lipsync/drawn.gif
            qa/lipsync/face-board.png
            qa/lipsync/drawn-metrics.json
            qa/lipsync/*.ph.json
            web/lab/lipsync/
          retention-days: 14
