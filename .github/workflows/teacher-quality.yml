# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# Cổng giáo viên Ama/Carlos (chủ 05/11: lag · vệt đen · lệch miệng): Chromium + WebKit thật – không khung/viền đen, tải texture theo khung video,
# CPU 4× ≥ 50 fps, chỗ giáo viên im lặng không phát clip nhép miệng (mouth_motion.py), khớp miệng ±33 ms (lip-clock), trần dung lượng.
name: Chất lượng giáo viên
on:
  pull_request:
    paths: ['web/js/teacher-live.js', 'web/js/teacher-slot.js', 'web/js/lesson/teacher.js', 'web/js/call/**', 'web/js/characters.js', 'web/teach/**', 'scripts/teach/**', 'scripts/test/teacher-quality.mjs', 'scripts/test/lip-clock.mjs', '.github/workflows/teacher-quality.yml']
  push:
    branches: [main]
    paths: ['web/js/teacher-live.js', 'web/js/teacher-slot.js', 'web/js/lesson/teacher.js', 'web/js/call/**', 'web/js/characters.js', 'web/teach/**', 'scripts/teach/**', 'scripts/test/teacher-quality.mjs', 'scripts/test/lip-clock.mjs', '.github/workflows/teacher-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
  teacher:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: ./.github/actions/setup-ffmpeg
      - name: Miệng ngậm (clip được phát im)
        run: |
          pip install -q numpy
          python scripts/teach/mouth_motion.py --check
      - name: Khớp miệng ±33 ms
        run: node scripts/test/lip-clock.mjs
      - name: Viền đen · fps · dung lượng (Chromium + WebKit)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium webkit
          node scripts/test/teacher-quality.mjs
