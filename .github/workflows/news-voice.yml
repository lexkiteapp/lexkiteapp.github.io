name: news-voice
# Voices only (Kokoro + Rhubarb + faster-whisper, 0 credits) for news lessons -> artifact news-voice-<run>; used for local single-clip tests
# (Rhubarb's macOS x86 binary segfaults in the Mac sandbox).
on:
  workflow_dispatch:
    inputs: { lessons: { description: 'comma-separated news lesson ids', required: true } }
permissions: { contents: read }
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with: { path: /tmp/kk/node_modules/@huggingface/transformers/.cache, key: video-models-kokoro82m-q8-cine-v1 }
      - run: |
          pip install -q faster-whisper==1.0.3 numpy==2.1.3
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          npm i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1 >/dev/null
          curl -fsSL -o /tmp/rh.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip && mkdir -p /tmp/rh && unzip -q /tmp/rh.zip -d /tmp/rh
          R=$(find /tmp/rh -type f -name rhubarb | head -1); chmod +x "$R"
          mkdir -p nw/ci nw/lessons; cp content/video/cine/news/lines.json nw/ci/
          for i in ${LESSONS//,/ }; do cp "content/video/cine/news/$i.json" nw/lessons/; done
          KOKORO_NODE_PATH=/tmp/kk/node_modules RHUBARB=$R python scripts/cine/news_voice.py nw "$LESSONS"
        env: { LESSONS: '${{ github.event.inputs.lessons }}' }
      - uses: actions/upload-artifact@v4
        with: { name: 'news-voice-${{ github.run_number }}', path: nw/vis3/, retention-days: 7 }
