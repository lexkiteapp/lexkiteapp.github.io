# Sao lưu shorts ĐẠT (lexkiteapp/lexkite-shorts) lên Kho Drive riêng – scripts/video/drive-shorts.mjs.
# Idempotent (sha trong index.json + sổ drive_files), tiếp tục được (ghi index sau mỗi short), có nhịp nghỉ.
# Ghi vị trí file (item.drive.{video,cover}) ngược vào shorts/index.json của lexkite-shorts, rồi tải manifest thư viện quản trị
# (index + coverage + lịch + credit → shorts/_admin/admin-shorts.json) lên kho: /admin.html#video đọc từ đó, không cần token GitHub.
# Chạy sau mỗi cine-render (cả bản tin news) + mỗi ngày (đồng bộ coverage/lịch đăng) + luật kho shorts (scripts/video/shorts-archive.mjs, docs/VIDEO-STORAGE.md).
# Từ khi lưu theo công thức: mp4 không còn trong lexkite-shorts (cine-render tự tải lên kho) → bước tải ở đây chỉ bù khi cine-render lỗi.
# Secrets: LEXKITE_DRIVE_CLI_KEY (HMAC /api/drive), SHORTS_DEPLOY_KEY (deploy key ghi lexkite-shorts).
name: drive-shorts
on:
  workflow_dispatch:
    inputs:
      limit: { description: 'Tối đa số short mỗi lượt', default: '500' }
      dry_run: { description: 'Chỉ liệt kê, không tải', type: boolean, default: false }
  workflow_run:
    workflows: [cine-render, video-tpl1b]
    types: [completed]
  schedule:
    - cron: '23 4 * * *'
concurrency: { group: drive-shorts, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Thuê tài nguyên (điều phối việc nền, docs/JOBS.md)
        id: lease
        env: { LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}' }
        run: node scripts/jobs/lease.mjs acquire drive-shorts
      - name: Lấy lexkite-shorts
        if: ${{ steps.lease.outputs.skip != '1' }}
        env: { KEY: '${{ secrets.SHORTS_DEPLOY_KEY }}' }
        run: |
          [ -n "$KEY" ] || { echo "::error::thiếu secret SHORTS_DEPLOY_KEY"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/shorts && chmod 600 ~/.ssh/shorts
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/shorts -o IdentitiesOnly=yes" git clone -q --depth 1 git@github.com:lexkiteapp/lexkite-shorts.git /tmp/shorts
      - name: Tải shorts ĐẠT lên Kho Drive
        if: ${{ steps.lease.outputs.skip != '1' }}
        env: { LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}' }
        run: node scripts/ci/quota-skip.mjs node scripts/video/drive-shorts.mjs --repo /tmp/shorts --limit "${{ github.event.inputs.limit || '500' }}" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Luật kho shorts (2 bản cho clip đã duyệt/đăng · giữ 30 ngày · cân bằng Drive)
        if: ${{ steps.lease.outputs.skip != '1' && (!cancelled() && github.event.inputs.dry_run != 'true') }}
        env: { LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}' }
        run: node scripts/ci/quota-skip.mjs node scripts/video/shorts-archive.mjs --repo /tmp/shorts
      - name: Manifest thư viện quản trị → Kho Drive
        if: ${{ steps.lease.outputs.skip != '1' && (!cancelled() && github.event.inputs.dry_run != 'true') }}
        env: { LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}' }
        run: |
          python3 scripts/cine/shorts_index.py manifest /tmp/shorts/shorts/index.json /tmp/admin-shorts.json
          node scripts/ci/quota-skip.mjs node scripts/video/drive-shorts.mjs --manifest /tmp/admin-shorts.json
      - name: Ghi vị trí Drive vào shorts/index.json
        if: always()
        run: |
          cd /tmp/shorts; git diff --quiet shorts/index.json && { echo "index không đổi"; rm -f ~/.ssh/shorts; exit 0; }
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/shorts -o IdentitiesOnly=yes"
          cp shorts/index.json /tmp/index.new.json
          git -c user.name="Lexkite CI" -c user.email="lexkiteapp@users.noreply.github.com" commit -qam "drive-shorts #${{ github.run_number }}: vị trí Kho Drive [CF-Pages-Skip]"
          for k in 1 2 3 4; do git push -q origin HEAD:main && break
            # đua với cine-render: lấy bản mới rồi gộp trường drive theo id
            git fetch -q origin main && git reset -q --hard origin/main
            python3 -c "import json;n={e['id']:e.get('drive') for e in json.load(open('/tmp/index.new.json'))['items'] if e.get('drive')};p='shorts/index.json';d=json.load(open(p));[e.__setitem__('drive',n[e['id']]) for e in d['items'] if e['id'] in n and 'drive' not in e];json.dump(d,open(p,'w'),indent=1,ensure_ascii=False)"
            git -c user.name="Lexkite CI" -c user.email="lexkiteapp@users.noreply.github.com" commit -qam "drive-shorts #${{ github.run_number }}: vị trí Kho Drive [CF-Pages-Skip]" || break
          done
          rm -f ~/.ssh/shorts
      - name: Trả thuê
        if: ${{ always() && steps.lease.outputs.skip != '1' }}
        env: { LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}' }
        run: node scripts/jobs/lease.mjs release drive-shorts --status "${{ job.status }}"
