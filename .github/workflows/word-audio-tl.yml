# Giọng từ đơn ngôn ngữ đích (pt-BR, es-419 …) – lượt MẪU 20 từ (chạy tay hoặc gắn nhãn word-audio-<tl> vào PR). Không đẩy gì vào repo, không dựng cả bộ.
# Bảng giọng: scripts/word-audio/tl-voices.json (thêm ngôn ngữ = thêm dòng + nhãn ở đây). Spec: docs/specs/target-language.md §Giọng, docs/specs/spanish-course.md §3/§5.3.
# Dò kokoro-js có tự đọc TL không → Kokoro-82M + âm vị espeak (misaki EspeakG2P, tl_g2p.py), giọng Ama/Carlos của bảng → −16 LUFS + Whisper đa ngôn ngữ nghe lại (+ seseo cho es) (tl_gate.py).
name: word-audio-tl
run-name: "word-audio-${{ github.event.inputs.tl || (github.event.label.name == 'word-audio-es' && 'es') || 'pt' }}"
on:
  workflow_dispatch:
    inputs:
      tl: { description: 'Ngôn ngữ đích (khóa trong scripts/word-audio/tl-voices.json)', default: 'es' }
      n: { description: 'Số từ mẫu (từ content/target/<tl>/seed.json)', default: '20' }
  pull_request:
    paths: ['scripts/word-audio/tl-sample.mjs', 'scripts/word-audio/tl_g2p.py', 'scripts/word-audio/tl_piper.py', 'scripts/word-audio/tl_gate.py', 'scripts/word-audio/tl_ipa.py', 'scripts/word-audio/tl-voices.json', 'content/target/*/seed.json', '.github/workflows/word-audio-tl.yml']
    types: [labeled]
permissions: { contents: read }
concurrency: { group: 'word-audio-tl-${{ github.ref }}-${{ github.event.inputs.tl || github.event.label.name }}', cancel-in-progress: true }
jobs:
  sample:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'word-audio-pt' || github.event.label.name == 'word-audio-es' }}
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      TL: "${{ github.event.inputs.tl || (github.event.label.name == 'word-audio-es' && 'es') || 'pt' }}"
      TL_N: '${{ github.event.inputs.n || 20 }}'
      KOKORO_DTYPE: fp32
    steps:
      - uses: actions/checkout@v4
      - run: echo "OUT=out/$TL-sample" >> "$GITHUB_ENV" && echo "ASR=$(jq -r --arg t "$TL" '.[$t].asrModel' scripts/word-audio/tl-voices.json)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: ./.github/actions/setup-ffmpeg
      - run: bash scripts/ci/npm-retry.sh i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1
      - uses: actions/cache@v4
        with: { path: /tmp/kk/node_modules/@huggingface/transformers/.cache, key: 'kokoro-82m-v1-fp32' }
      - name: G2P theo bảng (misaki EspeakG2P + espeak-ng đầy đủ – kokoro-js chỉ kèm espeak tiếng Anh)
        run: pip install -q "misaki==0.9.4" "phonemizer-fork==3.3.2" "espeakng-loader==0.2.4"
      - name: IPA seed ↔ espeak-ng của bảng (spanish-course.md §5.1) – chạy tiếp để vẫn có số đo giọng, bước cuối mới đỏ
        id: ipa
        continue-on-error: true
        run: python3 scripts/word-audio/tl_ipa.py
      - name: Dò + dựng mẫu
        run: NODE_PATH=/tmp/kk/node_modules node scripts/word-audio/tl-sample.mjs
      - name: Dự phòng theo spec – Piper của bảng cùng cổng, để so sánh
        run: pip install -q "piper-tts==1.8.0" && python3 scripts/word-audio/tl_piper.py
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: 'whisper-${{ env.ASR }}-ct2' }
      - name: Cổng −16 LUFS + nghe lại (Whisper đa ngôn ngữ theo bảng) + seseo (es)
        run: pip install -q "faster-whisper==1.2.1" "av==18.1.0" && python3 scripts/word-audio/tl_gate.py
      - name: Đỏ nếu IPA lệch espeak
        if: ${{ steps.ipa.outcome != 'success' }}
        run: echo "IPA seed lệch espeak – xem tóm tắt" && exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: '${{ env.TL }}-word-sample', path: '${{ env.OUT }}', retention-days: 14 }
