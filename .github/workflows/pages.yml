# Kiểm CDN âm thanh sau mỗi lượt tạo giọng đọc. Từ 24/10/2026 mp3 KHÔNG còn trong repo chính: nằm ở kho media ngoài
# (infra/media-repos.json – lexkite-media-2, Pages của chính kho đó) và phục vụ qua audio.lexkite.com (Worker lexkite-audio dò các kho).
# Workflow này KHÔNG còn deploy GitHub Pages của repo chính: bản Pages cuối (lexkiteapp.github.io/audio/…) được giữ nguyên làm
# dự phòng 1 bản phát hành (docs/STORAGE.md §Gỡ dự phòng). Deploy lại ở đây sẽ xoá dự phòng đó → đã gỡ bước deploy.
name: Kiểm CDN âm thanh (kho media)
on:
  workflow_run:
    workflows: ['Tạo giọng đọc Kokoro', 'Giọng đọc từ vựng (Kokoro)']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mọi khóa trong chỉ mục có trong cây kho media + mẫu qua Pages kho và audio.lexkite.com
        run: |
          node scripts/audio-cdn-check.mjs --media
          node scripts/audio-cdn-check.mjs --base https://lexkiteapp.github.io/lexkite-media-2/audio/l/ --sample 300 --concurrency 12 --retries 6
          node scripts/audio-cdn-check.mjs --sample 150 --concurrency 6 --retries 4
