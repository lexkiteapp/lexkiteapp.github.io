# Soát bản LIVE lexkite.com sau mỗi lượt Pages deploy (cron 3 giờ của pages-deploy.yml) để bắt lỗi ẩn: console error, exception, request 4xx/5xx same-origin,
# ảnh vỡ, trang trống ở các tuyến chính (landing add-on, app + tab chính, từ điển, blog) × 390px/1440px; thêm tương phản (contrast.mjs, tập màn chính).
# Có lỗi → job đỏ → ci-triage mở issue ci-failure. Chạy tay: Actions → Run workflow. Không dùng API trả phí.
name: Kiểm tra sau deploy (post-deploy-check)
on:
  workflow_run:
    workflows: ['Pages deploy']
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url: { description: 'URL gốc cần soát', required: false, default: 'https://lexkite.com', type: string }
  workflow_call:   # dùng lại nguyên bộ kiểm cho site xem thử mới: uses: ./.github/workflows/post-deploy-check.yml với base_url
    inputs:
      base_url: { description: 'URL gốc cần soát', required: false, default: 'https://lexkite.com', type: string }
permissions:
  contents: read
concurrency:
  group: post-deploy-check
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      LEXKITE_CI_HEADER: ${{ secrets.LEXKITE_CI_HEADER }}
      BASE: ${{ inputs.base_url || 'https://lexkite.com' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ./.github/actions/playwright-cache
        with: { browsers: '--with-deps chromium webkit' }
      - name: Playwright
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2 axe-core@4.10.2
          bash scripts/ci/pw-install.sh --with-deps chromium webkit
      - name: Sonde skills 390
        continue-on-error: true
        timeout-minutes: 6
        run: node scripts/test/skills-probe.mjs
      - name: Soát tuyến live (console / exception / request / ảnh vỡ)
        id: routes
        timeout-minutes: 8
        env: { WAIT_SW: "${{ github.event_name == 'workflow_run' && '1' || '0' }}" }
        run: node scripts/test/post-deploy-check.mjs "$BASE" out/post-deploy
      - name: Icon rỗng (WebKit iPhone + Chromium, scripts/test/icon-blank.mjs)
        id: iconblank
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |  # v1 + v2 (ux1 bật 100 % – giao diện người dùng thật thấy) song song: giữ khung 8 phút
          node scripts/test/icon-blank.mjs "$BASE" --strict --max=25 --ui=v1 --shots=out/post-deploy/icons & p1=$!
          node scripts/test/icon-blank.mjs "$BASE" --strict --max=25 --ui=v2 --shots=out/post-deploy/icons & p2=$!
          r=0; wait $p1 || r=1; wait $p2 || r=1; exit $r
      - name: Rig giáo viên trên bản live (rig-live.mjs, Call + câu hỏi bài học, Chromium + WebKit, 390/1280, sáng/tối, fps, khớp miệng, giảm chuyển động)
        id: rig
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: node scripts/test/rig-live.mjs "$BASE" out/post-deploy
      - name: Bài học live en/fr/zh/es (live-lesson-lang.mjs – không chữ Việt ở giao diện không-vi, có "Tôi không biết", bài xếp từ đủ ô; hồi quy báo lỗi #5–#13)
        id: lessonlang
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: node scripts/test/live-lesson-lang.mjs "$BASE" out/post-deploy/lesson-lang
      - name: Cổng CSP (csp-probe.mjs --strict, tuyến chính + thư viện lười, Chromium + WebKit, có đối chứng new Function)
        id: csp
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: node scripts/test/csp-probe.mjs "$BASE" out/post-deploy/csp --strict
      - name: Tương phản màu (contrast.mjs, màn chính)
        id: contrast
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        env: { CONTRAST_ROUTES: 'home,vocab,skills,tests,me,verb/take' }
        run: |
          set +e
          node scripts/test/contrast.mjs "$BASE/app/" 2>&1 | tee out/post-deploy/contrast.txt
          rc=${PIPESTATUS[0]}
          { echo; echo '### 🎨 Tương phản'; if [ $rc -eq 0 ]; then echo '✅ đạt AA'; else echo '❌ có chỗ chưa đạt:'; echo '```'; head -c 3000 out/post-deploy/contrast.txt; echo '```'; fi; } | tee -a out/post-deploy/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: post-deploy-check, path: "out/post-deploy\ncontrast-report.json", if-no-files-found: ignore, retention-days: 7 }
