# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# ✨ QC mẫu Stitch "nâng chất lượng" (báo cáo tuần, huy hiệu, ảnh chia sẻ/OG, email): tương phản pixel 4.5/3 sáng+tối,
# bản tối không thẻ trắng, 0 lỗi JS, sáng↔tối cùng nội dung, còn ô giáo viên, không tên icon Material hiện thành chữ.
# Cùng chuẩn với stitch-refs-qc.yml (xưởng ref). Ngưỡng chỉ được nâng. Khi port vẫn qua stitch-diff/final-qc.
name: Stitch quality QC
on:
  pull_request:
    paths: ['brand/stitch/v2q/**', 'brand/stitch/v3/**', 'scripts/test/stitch-quality-qc.mjs', 'scripts/lib/pixel-contrast.mjs', '.github/workflows/stitch-quality-qc.yml']
  push:
    branches: [main, stitch-quality]   # canh cả main (trước đây 0 lượt trên main)
    paths: ['brand/stitch/v2q/**', 'brand/stitch/v3/**', 'scripts/test/stitch-quality-qc.mjs', 'scripts/lib/pixel-contrast.mjs', '.github/workflows/stitch-quality-qc.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stitch-quality-qc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
  qc:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2 pngjs@7.0.0
          bash scripts/ci/pw-install.sh --with-deps chromium
        timeout-minutes: 12
      - uses: ./.github/actions/apt
        with: { packages: imagemagick fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji }
      - name: Vẽ + chấm từng mẫu (sáng/tối)
        run: node scripts/test/stitch-quality-qc.mjs brand/stitch/v2q out/stitch-quality-qc
      # Kho v3 (scripts/stitch/batch.mjs): chấm MỌI màn (--all) + tràn ngang/chạm ≥44px (--strict-layout); chỉ màn PASS/PICK gác đỏ.
      - name: Kho Stitch v3 (tương phản · tràn · chạm 44px)
        if: always()
        run: node scripts/test/stitch-quality-qc.mjs brand/stitch/v3 out/stitch-quality-qc/v3 --all --strict-layout
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: stitch-quality-qc, path: out/stitch-quality-qc, retention-days: 14 }
