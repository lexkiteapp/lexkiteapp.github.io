# 🖼️ Ảnh trước/sau các luồng chính của app (docs/UX-BENCHMARK.md) – điện thoại/máy tính, sáng/tối, en/vi/ar. Hermetic (0 lượt chạm prod). Artifact 7 ngày.
# Chạy: tay (before = commit trước khi sửa) hoặc đẩy nhánh ux-shots* (before = main trên remote).
name: UX shots
on:
  workflow_dispatch:
    inputs:
      before: { description: 'Commit TRƯỚC (để trống = chỉ chụp bản hiện tại)', required: false, default: '' }
  push:
    branches: ['ux-shots*']
permissions:
  contents: read
  actions: write   # fast-lane: huỷ lượt nặng khi npm test cùng sha đã đỏ (docs/CI-RUNNERS.md › Máy gác)
  checks: read
concurrency:   # ci-policy 2/11: push/lịch trùng gộp; chạy tay (mỗi lượt khác input) không bao giờ bị huỷ
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  shots:
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/fast-lane   # làn nhanh: npm test đỏ → huỷ lượt nặng
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Chụp
        env: { BEFORE: "${{ github.event.inputs.before }}", EV: "${{ github.event_name }}", UX1: "${{ contains(github.ref_name, 'ux1') && '1' || '' }}" }
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: imagemagick fonts-noto-color-emoji fonts-noto-core }
      - name: Chụp (tiếp)
        env: { BEFORE: "${{ github.event.inputs.before }}", EV: "${{ github.event_name }}", UX1: "${{ contains(github.ref_name, 'ux1') && '1' || '' }}" }
        run: |
          B=""
          if [ "$EV" = push ]; then BEFORE="$(git merge-base origin/main HEAD)"; [ "$BEFORE" = "$(git rev-parse HEAD)" ] && BEFORE=""; fi
          if [ -n "$BEFORE" ]; then git worktree add -q /tmp/before "$BEFORE"; B=/tmp/before/web; fi
          node scripts/test/ux-shots.mjs web "$B" out/ux
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ux-shots, path: out/ux, retention-days: 7 }
