# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🎯 Bám mẫu Stitch: vẽ 4 màn (Học · Bài học · Phản hồi · Sẵn sàng thi) ở 390 px sáng/tối, so SSIM + nhịp hàng với brand/stitch/*.jpg,
# đỏ khi dưới ngưỡng scripts/test/stitch-diff.json (chỉ được nâng). Artifact: tờ "Stitch | app" cho chủ duyệt. Hermetic, 0 lượt chạm prod.
name: Stitch diff
on:
  pull_request:
    paths: ['web/**', '!web/**/*.md', '!web/**/*.txt', 'brand/stitch/**', 'scripts/test/stitch-diff.*', 'scripts/test/stitch-screens.mjs', 'scripts/test/final-qc.mjs', 'scripts/test/stitch-render.mjs', 'scripts/stitch-v2-convert.mjs', 'scripts/build-stitch-css.mjs', 'scripts/ci/stitch-shots.mjs', '.github/workflows/stitch-diff.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # fast-lane: huỷ lượt nặng khi npm test cùng sha đã đỏ (docs/CI-RUNNERS.md › Máy gác)
  checks: read
  pull-requests: write   # một bình luận PR (marker <!-- stitch-shots -->) chứa link ảnh QC
concurrency:
  group: stitch-diff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read, pull-requests: read }
    outputs: { go: '${{ steps.g.outputs.go == ''true'' && steps.s.outputs.ok != ''false'' && ''true'' || ''false'' }}' }   # + phạm vi PR (scripts/ci/pr-scope.mjs, cần: ui)
    steps:
      # phạm vi PR (docs/CI-RUNNERS.md › Phạm vi PR): PR chỉ đổi nội dung/chữ dịch/backend → job nặng skipped (required-gate tính đạt); lỗi API → vẫn chạy
      - id: s
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', PR: '${{ github.event.pull_request.number }}' }
        run: |
          # không checkout (job gate không chạy trình duyệt/mã PR): chỉ lấy 2 file qua API tại merge sha
          mkdir -p scripts/ci .github/workflows
          for f in scripts/ci/pr-scope.mjs .github/workflows/stitch-diff.yml; do gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$f?ref=$GITHUB_SHA" > "$f"; done
          node scripts/ci/pr-scope.mjs --repo "$REPO" --pr "$PR" --workflow .github/workflows/stitch-diff.yml --need ui --carry "${{ github.event.action }}|${{ github.event.before }}|${{ github.event.pull_request.head.sha }}|${{ contains(github.event.pull_request.labels.*.name, 'ready') }}"
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha → go=$go"
  diff:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/fast-lane   # làn nhanh: npm test đỏ → huỷ lượt nặng
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: CSS Stitch khớp mẫu (Tailwind biên dịch sẵn, ≤ 10 KB gz/nhóm)
        run: |
          npm i --no-save --no-audit --no-fund tailwindcss@3.4.17 playwright@1.48.2 pngjs@7.0.0 axe-core@4.10.2 jsdom@25.0.1
          node scripts/stitch-v2-convert.mjs --check
          node scripts/build-stitch-css.mjs --check
      - uses: ./.github/actions/playwright-cache
        with: { browsers: '--with-deps chromium' }
      - name: Vẽ HTML Stitch v2 tĩnh (tắt hoạt ảnh) → tờ duyệt tối/sáng
        if: always()
        run: |
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: imagemagick fonts-noto-core fonts-noto-color-emoji }
        if: always()
      - name: Vẽ HTML Stitch v2 tĩnh (tắt hoạt ảnh) → tờ duyệt tối/sáng (tiếp)
        if: always()
        run: |
          node scripts/test/stitch-render.mjs brand/stitch/v2 out/stitch-v2
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: stitch-v2-review, path: out/stitch-v2, retention-days: 14 }
      - name: So với mẫu Stitch
        if: always()
        run: |
          node scripts/test/stitch-diff.mjs web out/stitch-diff
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: stitch-diff, path: out/stitch-diff, retention-days: 7 }
      - name: QC cuối 1-1 (13 màn – RTL, giảm chuyển động, giáo viên không "dán đè", giọng = giáo viên, khớp miệng, âm hiệu ứng)
        if: always()
        run: node scripts/test/final-qc.mjs web out/stitch-diff out/final-qc
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: final-qc, path: out/final-qc, retention-days: 14 }
      # Ảnh QC lên R2 riêng tư (bucket report-shots, link ký 7 ngày) + MỘT bình luận PR sửa tại chỗ – giám khảo UI đọc link, khỏi tải artifact (scripts/ci/stitch-shots.mjs).
      # Chỉ PR cùng repo (fork không có secret → bước bỏ qua êm); không commit ảnh vào repo; lỗi chỉ cảnh báo, không đỏ.
      - name: Ảnh QC → R2 + bình luận PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        timeout-minutes: 8
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/ci/stitch-shots.mjs
