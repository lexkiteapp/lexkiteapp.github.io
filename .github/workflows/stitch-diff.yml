# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🎯 Bám mẫu Stitch: vẽ 4 màn (Học · Bài học · Phản hồi · Sẵn sàng thi) ở 390 px sáng/tối, so SSIM + nhịp hàng với brand/stitch/*.jpg,
# đỏ khi dưới ngưỡng scripts/test/stitch-diff.json (chỉ được nâng). Artifact: tờ "Stitch | app" cho chủ duyệt. Hermetic, 0 lượt chạm prod.
name: Stitch diff
on:
  pull_request:
    paths: ['web/**', 'brand/stitch/**', 'scripts/test/stitch-diff.*', 'scripts/test/stitch-screens.mjs', 'scripts/test/final-qc.mjs', 'scripts/test/stitch-render.mjs', 'scripts/stitch-v2-convert.mjs', 'scripts/build-stitch-css.mjs', '.github/workflows/stitch-diff.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # fast-lane: huỷ lượt nặng khi npm test cùng sha đã đỏ (docs/CI-RUNNERS.md › Máy gác)
  checks: read
concurrency:
  group: stitch-diff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha → go=$go"
  diff:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/fast-lane   # làn nhanh: npm test đỏ → huỷ lượt nặng
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: CSS Stitch khớp mẫu (Tailwind biên dịch sẵn, ≤ 10 KB gz/nhóm)
        run: |
          npm i --no-save --no-audit --no-fund tailwindcss@3.4.17 playwright@1.48.2 pngjs@7.0.0 axe-core@4.10.2 jsdom@25.0.1
          node scripts/stitch-v2-convert.mjs --check
          node scripts/build-stitch-css.mjs --check
      - name: Vẽ HTML Stitch v2 tĩnh (tắt hoạt ảnh) → tờ duyệt tối/sáng
        if: always()
        run: |
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: imagemagick fonts-noto-core fonts-noto-color-emoji }
        if: always()
      - name: Vẽ HTML Stitch v2 tĩnh (tắt hoạt ảnh) → tờ duyệt tối/sáng (tiếp)
        if: always()
        run: |
          node scripts/test/stitch-render.mjs brand/stitch/v2 out/stitch-v2
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: stitch-v2-review, path: out/stitch-v2, retention-days: 14 }
      - name: So với mẫu Stitch
        if: always()
        run: |
          node scripts/test/stitch-diff.mjs web out/stitch-diff
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: stitch-diff, path: out/stitch-diff, retention-days: 7 }
      - name: QC cuối 1-1 (13 màn – RTL, giảm chuyển động, giáo viên không "dán đè", giọng = giáo viên, khớp miệng, âm hiệu ứng)
        if: always()
        run: node scripts/test/final-qc.mjs web out/stitch-diff out/final-qc
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: final-qc, path: out/final-qc, retention-days: 14 }
