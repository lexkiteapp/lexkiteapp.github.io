# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 📐 Cổng bố cục hình đề (Writing Task 1 map/process/bar/line/pie/table, dùng cả ở #/model và phòng thi #/mock):
# Chromium thật 360 px & 1280 px × sáng/tối × font thật/dự phòng; chặn chữ đè, tràn khung, vắt mép khối, chữ < 9 px, tương phản thấp.
# Baseline 0 lỗi (scripts/test/figure-layout.mjs). Báo cáo + ảnh: artifact figure-layout-report.
name: Bố cục hình đề
on:
  pull_request:
    paths:
      - 'web/js/task1.js'
      - 'web/js/write/task1-more*.js'
      - 'web/cpack/write/task1-more.js'
      - 'web/css/style.css'
      - 'web/css/lazy-ui.css'
      - 'scripts/test/figure-layout.mjs'
      - 'scripts/test/lib/figure-layout.js'
      - 'scripts/test/fixtures/figure-layout.html'
      - '.github/workflows/figure-layout.yml'
  push:
    branches: [main]
    paths:
      - 'web/js/task1.js'
      - 'web/js/write/task1-more*.js'
      - 'web/cpack/write/task1-more.js'
      - 'web/css/style.css'
      - 'web/css/lazy-ui.css'
      - 'scripts/test/figure-layout.mjs'
      - 'scripts/test/lib/figure-layout.js'
      - 'scripts/test/fixtures/figure-layout.html'
      - '.github/workflows/figure-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
  figure-layout:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Kiểm bố cục mọi hình đề
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
          node scripts/test/figure-layout.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: figure-layout-report, path: figure-layout-report/, if-no-files-found: ignore, retention-days: 14 }
