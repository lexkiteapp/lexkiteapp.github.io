# video-tpl1b-samples: render a FEW hand-picked tpl1b lessons (owner approval samples, docs/VIDEO-TEMPLATES.md §9 "Samples").
# NO GrabCast / Groq call: hook verdicts must already be in the lesson files (hook-judge.mjs --reviewed content/video/cine/news/tpl1b/reviewed-hooks.json).
# Kokoro → Rhubarb (mandatory) → render_tpl → qc_tpl (host_scale, host_frame, lipsync_rhubarb, hook_truth …) → rubric ≥ 90. No automatic fix
# (NO_AUTOFIX: never swap host/plate or cut content to pass a gate), no store, no Drive, no lease, never publishes. Artifact only:
# 3 mp4 (>= 8 Mbps, tokens.VIDEO) + report + contact-sheet.jpg + plates-sheet.jpg (the 'vision'-checked scene plates, for the owner's no-people/no-text check).
name: video-tpl1b-samples
on:
  workflow_dispatch:
    inputs:
      ids: { description: 'lesson ids (comma, max 3) with a reviewed hook verdict', required: true }
permissions: { contents: read }
concurrency: { group: video-tpl1b-samples, cancel-in-progress: false }
env:
  TD: content/video/cine/news/tpl1b
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ND: ${{ github.workspace }}/vo
      NO_AUTOFIX: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Ids (≤ 3, every lesson has a current hook verdict – no judge call here)
        env: { IDS_IN: '${{ inputs.ids }}' }
        run: |
          case "$IDS_IN" in *[!a-z0-9_,]*|'') echo "::error::bad ids"; exit 1;; esac
          [ "$(echo "$IDS_IN" | tr ',' '\n' | grep -c .)" -le 3 ] || { echo "::error::samples = max 3 videos (approval gate)"; exit 1; }
          for i in ${IDS_IN//,/ }; do python3 -c "import json,sys;d=json.load(open('$TD/$i.json'));j=d['hook'].get('judge');sys.exit(0 if j and not d.get('reject') else 1)" || { echo "::error::$i has no hook verdict / is rejected"; exit 1; }; done
          echo "IDS=$IDS_IN" >> "$GITHUB_ENV"
      - name: Libraries + ffmpeg
        run: |
          pip install -q -r scripts/cine/requirements.txt faster-whisper==1.0.3 requests==2.32.3
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg librsvg2-bin fontconfig >/dev/null
          mkdir -p ~/.local/share/fonts && find brand -path "*src/fonts/*.ttf" -exec cp {} ~/.local/share/fonts/ \; && fc-cache -f >/dev/null   # brand SVGs (logo wordmark) rasterize with the brand font
      - name: Footage (host clips of these lessons + all checked plates, sparse)
        env: { KEY: '${{ secrets.FOOTAGE_DEPLOY_KEY }}' }
        run: |
          [ -n "$KEY" ] || { echo "::error::missing secret FOOTAGE_DEPLOY_KEY"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/footage && chmod 600 ~/.ssh/footage
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/footage -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --no-checkout git@github.com:lexkiteapp/lexkite-footage.git footage
          P=$(python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts/video/tpl'); from tokens import PLATES
          TD = os.environ['TD']; out = [f'/anchor/bg/{p}.png' for p in sorted(PLATES)]
          for i in os.environ['IDS'].split(','):
              c = json.load(open(f'{TD}/{i}.json'))['clip']
              out += [f'/anchor/green/kfull_pro/{c}.mp4', f'/anchor/green/kmask_pro/{c}.mkv', f'/anchor/tools/meta/{c}/', f'/anchor/tools/dl24/{c}.json']
          print(' '.join(sorted(set(out))))
          PY
          )
          git -C footage sparse-checkout set --no-cone $P && git -C footage checkout -q
          rm -f ~/.ssh/footage; du -sh footage
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Kokoro model cache
        uses: actions/cache@v4
        with: { path: /tmp/kk/node_modules/@huggingface/transformers/.cache, key: video-models-kokoro82m-q8-cine-v1 }
      - name: kokoro-js + Rhubarb (required – the lip-sync gate fails without it)
        run: |
          npm i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1 >/dev/null
          curl -fsSL -o /tmp/rh.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          mkdir -p /tmp/rh && unzip -q /tmp/rh.zip -d /tmp/rh
          R=$(find /tmp/rh -type f -name rhubarb | head -1); chmod +x "$R"
          "$R" --version | grep -q 1.13 || { echo "::error::Rhubarb not runnable – refusing to estimate visemes"; exit 1; }
          echo "RHUBARB=$R" >> "$GITHUB_ENV"; echo "KOKORO_NODE_PATH=/tmp/kk/node_modules" >> "$GITHUB_ENV"
      - name: Voice → render → qc_tpl → rubric (no automatic fix)
        run: mkdir -p icons && bash scripts/video/tpl/batch_chunk.sh "$IDS" out/tpl || true
      - name: Report + contact sheet + samples + plates sheet
        run: |
          python3 scripts/video/tpl/batch_report.py out/tpl samples
          cat out/tpl/report.md >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import sys; sys.path.insert(0, 'scripts/video/tpl'); from tokens import PLATES
          from PIL import Image, ImageDraw, ImageFont
          ps = [p for p, v in PLATES.items() if 'vision' in str(v.get('checked'))]; TW, TH, C = 288, 510, 4
          R = (len(ps) + C - 1) // C; sh = Image.new('RGB', (C * (TW + 8) + 8, R * (TH + 34) + 8), (238, 238, 238)); dr = ImageDraw.Draw(sh)
          ft = ImageFont.truetype('brand/social/src/fonts/BeVietnamPro-Bold.ttf', 18)
          for k, p in enumerate(ps):
              x, y = 8 + (k % C) * (TW + 8), 8 + (k // C) * (TH + 34)
              dr.text((x, y), p, fill=(20, 60, 60), font=ft); sh.paste(Image.open(f'footage/anchor/bg/{p}.png').convert('RGB').resize((TW, TH)), (x, y + 26))
          sh.save('out/tpl/plates-sheet.jpg', quality=88); print(len(ps), 'plates:', ', '.join(ps))
          PY
          ls -la out/tpl out/tpl/samples
          python3 -c "import sys;sys.exit(0 if open('out/tpl/accepted.txt').read().strip() else 1)" || echo "::warning::0 accepted samples"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tpl1b-samples-${{ github.run_number }}
          path: |
            out/tpl/*.mp4
            out/tpl/*.json
            out/tpl/*.jpg
            out/tpl/*.txt
            out/tpl/*.log
            out/tpl/report.md
            out/tpl/samples/
          retention-days: 30
