# Tạo giọng đọc Kokoro (AI giọng tự nhiên, mã nguồn mở Apache-2.0) cho câu còn thiếu – chạy trên máy chủ GitHub (miễn phí),
# không tốn máy cá nhân. Mỗi đêm 400 câu → commit vào web/audio → tự đưa lên CDN âm thanh (pages.yml). Hết việc thì tự dừng sớm.
name: Tạo giọng đọc Kokoro
on:
  schedule:
    - cron: '0 19 * * *'   # 02:00 giờ Việt Nam
  workflow_dispatch:
    inputs:
      limit: { description: 'Số câu mỗi lần', default: '1500' }
permissions:
  contents: write
concurrency:
  group: audio
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Đếm câu còn thiếu
        id: count
        run: echo "left=$(node scripts/gen-audio.mjs --limit 0 | grep -o 'cần tạo [0-9]*' | grep -o '[0-9]*')" >> "$GITHUB_OUTPUT"
      - name: Tạo âm thanh
        if: steps.count.outputs.left != '0'
        run: |
          npm i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1
          NODE_PATH=/tmp/kk/node_modules node scripts/gen-audio.mjs --limit "${{ github.event.inputs.limit || '1500' }}"
      - name: Lưu vào repo
        if: steps.count.outputs.left != '0'
        run: |
          git config user.name "lexkite-bot"; git config user.email "lexkite-bot@users.noreply.github.com"
          git add web/audio web/js/listen/audio-index.js
          git diff --cached --quiet && exit 0
          git commit -qm "Âm thanh: thêm giọng Kokoro (còn ${{ steps.count.outputs.left }} câu trước lượt này)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done; exit 1
