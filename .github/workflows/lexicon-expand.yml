# Mở rộng kho từ tới 20k (docs/LEXICON.md §Mở rộng 20k) – việc nền `lexicon-expand` (infra/jobs.json, thuê gemini).
# SOURCE-FIRST (24/10): nghĩa/def WordNet (AI chỉ viết lại gloss) · ví dụ Tatoeba + Wiktionary · dịch bảng Wiktionary theo nghĩa · CEFR-J/Octanove · AI chỉ chấm + lấp chỗ trống → 2 giám khảo khác họ + dịch ngược → cổng.
# Thông lượng (10/2026): 2.400 từ/ngày ≈ 6.700 lượt GrabCast (≤ 270/phút của ai-pool, trần AI_POOL_GC_MAX 20.000) ≈ 60 phút (concurrency 8 – 16 làm GrabCast 500).
# Đạt → content/lexicon/expand/pending (CHƯA xuất, chờ soát mẫu ≥ 5 % rồi promote.mjs); trượt → content/qa/review-queue.json. Tự đỏ khi 0 mục đạt.
name: Mở rộng kho từ (lexicon-expand)
on:
  schedule:
    # 26/10: AI qua kho CF_POOL (116 tài khoản × 10k neuron/ngày, về 0 lúc 00:00 UTC) – chung với vocab-img-scene (8 lượt/ngày 01:40, 04:40 … 22:40 UTC, vắt tới 4006)
    # → chạy NGAY sau giờ đặt lại neuron, trước khi các lượt ảnh (8 lượt/ngày 01:40…22:40 UTC) vắt kho tới 4006; trần `neurons` ≈ 50 % kho, phần còn lại cho ảnh.
    # Không lượt vét giữa ngày: ảnh đã vắt kho → lượt đó chỉ toàn 4006.
    - cron: '12 0 * * *'   # lịch theo biến repo: LX_PILOT=1 (pilot rải đều, chờ soát 50 mẫu) → 0 khi pilot đạt ≤ 1/50; LX_N số từ mới/lượt; LX_RETRY
  workflow_dispatch:
    inputs:
      n: { description: 'Số từ MỚI lượt này (+ từ làm lại ở content/lexicon/expand/retry)', default: '2400' }
      pilot: { description: 'Pilot: rải đều dải tần suất (1 = có)', default: '0' }
      calls: { description: 'Trần số lần gọi /api/lexai (Gemini kho Lexkite – 26/10 rỗng; > 0 chỉ khi kho có khóa VÀ thêm gemini vào resources ở infra/jobs.json)', default: '0' }
      batch: { description: 'Mã lô (trống = ngày)', default: '' }
      neurons: { description: 'Trần neuron kho CF_POOL lượt này (ai-pool cf2; 4006 → tài khoản kế)', default: '600000' }
      retry: { description: 'Làm lại danh sách retry trước (0 = lượt kiểm nhỏ, bỏ qua)', default: '1' }
permissions:
  contents: write
  actions: write    # tự nối lượt (workflow_dispatch) khi còn việc + còn neuron
  id-token: write   # JWT OIDC cho /api/lexai
concurrency: { group: lexicon-expand, cancel-in-progress: false }
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Thuê tài nguyên (điều phối việc nền, docs/JOBS.md)
        id: lease
        env: { LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}' }
        run: node scripts/jobs/lease.mjs acquire lexicon-expand ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Nguồn miễn phí (wordfreq CC BY-SA 4.0 · WordNet · CMUdict BSD-2 · LDNOOBW CC BY 4.0)
        if: ${{ steps.lease.outputs.skip != '1' }}
        run: |
          pip install -q wordfreq==3.1.1 nltk==3.9.1 espeakng-loader==0.2.4   # espeak-ng en-gb: IPA Anh khi Wiktionary thiếu (hiệu chuẩn espeak-calib.mjs)
          python -c "import nltk; nltk.download('wordnet', quiet=True); nltk.download('averaged_perceptron_tagger_eng', quiet=True)"
          # câu ví dụ NGƯỜI VIẾT: Tatoeba (CC BY 2.0 FR) – examples.py lọc lemma + từ loại + câu dễ (source-first 24/10)
          curl -sfL https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2 | bunzip2 > "$RUNNER_TEMP/tatoeba.tsv" || true
          # vi do AI lấp chỉ nhận phương án có trong Viet74K (duyet/vietnamese-wordlist, GPL-2.0 – CHỈ để kiểm trong CI, không phân phối)
          curl -sfL -o "$RUNNER_TEMP/viet74k.txt" https://raw.githubusercontent.com/duyet/vietnamese-wordlist/master/Viet74K.txt || true
          curl -sfL -o "$RUNNER_TEMP/cmu.dict" https://raw.githubusercontent.com/cmusphinx/cmudict/master/cmudict.dict
          curl -sfL -o "$RUNNER_TEMP/bad.txt" https://raw.githubusercontent.com/LDNOOBW/List-of-Dirty-Naughty-Obscene-and-Otherwise-Bad-Words/master/en
          # CEFR kiểu EVP: CEFR-J Wordlist 1.5 (Tono Lab TUFS, miễn phí kể cả thương mại, ghi nguồn) + Octanove C1/C2 (CC BY-SA 4.0) – openlanguageprofiles/olp-en-cefrj
          curl -sfL -o "$RUNNER_TEMP/cefrj.csv" https://raw.githubusercontent.com/openlanguageprofiles/olp-en-cefrj/master/cefrj-vocabulary-profile-1.5.csv || true
          curl -sfL -o "$RUNNER_TEMP/octanove.csv" https://raw.githubusercontent.com/openlanguageprofiles/olp-en-cefrj/master/octanove-vocabulary-profile-c1c2-1.0.csv || true
          node scripts/lexicon/expand/existing.mjs "$RUNNER_TEMP/existing.json"
          python scripts/lexicon/expand/pick_words.py --existing "$RUNNER_TEMP/existing.json" --cmu "$RUNNER_TEMP/cmu.dict" --bad "$RUNNER_TEMP/bad.txt" $(test -s "$RUNNER_TEMP/cefrj.csv" && echo --cefrj "$RUNNER_TEMP/cefrj.csv") $(test -s "$RUNNER_TEMP/octanove.csv" && echo --octanove "$RUNNER_TEMP/octanove.csv") --out "$RUNNER_TEMP/candidates.json"
      - name: Sinh + 2 giám khảo + cổng
        if: ${{ steps.lease.outputs.skip != '1' }}
        env:  # ai-pool (scripts/lib/ai-pool.mjs): Gemini kho Lexkite (nếu còn khóa) → cf2 = kho CF_POOL xoay vòng (gpt-oss-120b soạn/giám khảo A, llama-3.3-70b giám khảo B) 
          # 26/10: GrabCast hỏng (500) → bỏ GRABCAST_AI_KEY. Chủ cho dùng MỌI tài khoản kho (VIMG_POOL_SKIP 0); không bao giờ tài khoản chính (CF_ACCOUNT_1 để loại).
          CF_POOL: ${{ secrets.CF_POOL }}
          CF_ACCOUNT_1: ${{ secrets.CF_ACCOUNT_ID }}
          VIMG_POOL_SKIP: '0'
          VIMG_CF_USE_CF2: '0'   # tài khoản 2 thuộc script-bank/news-auto (workers_ai_b độc quyền) – lexicon chỉ dùng kho
        # LEASE_AI_B_NEURONS đặt NGAY trong lệnh: bước thuê ghi LEASE_AI_B_NEURONS=0 vào GITHUB_ENV (đè env của bước)
        # biến repo so TRONG bash: biểu thức GitHub coi '' == '0' (26/10) – dispatch thắng biến repo
        run: |
          N="${{ github.event.inputs.n }}"; N="${N:-${{ vars.LX_N }}}"; N="${N:-2400}"
          P="${{ github.event.inputs.pilot }}"; P="${P:-${{ vars.LX_PILOT }}}"
          RT="${{ github.event.inputs.retry }}"; RT="${RT:-${{ vars.LX_RETRY }}}"
          EXTRA=(); [ "$P" = 1 ] && EXTRA+=(--pilot); [ "$RT" = 0 ] && EXTRA+=(--no-retry)
          B="${{ github.event.inputs.batch }}"; [ -n "$B" ] && EXTRA+=(--batch "$B")
          echo "LX_RUN_N=$N" >> "$GITHUB_ENV"; echo "LX_RUN_PILOT=$P" >> "$GITHUB_ENV"
          LEASE_AI_B_NEURONS="${{ github.event.inputs.neurons || '600000' }}" node scripts/lexicon/expand/job.mjs --candidates "$RUNNER_TEMP/candidates.json" --cmu "$RUNNER_TEMP/cmu.dict" --tatoeba "$RUNNER_TEMP/tatoeba.tsv" --bad "$RUNNER_TEMP/bad.txt" --viwords "$RUNNER_TEMP/viet74k.txt" --n "$N" --calls "${{ github.event.inputs.calls || '0' }}" "${EXTRA[@]}"
      - name: Lưu kết quả (chờ soát – chưa xuất)
        if: ${{ always() && steps.lease.outputs.skip != '1' }}
        run: |
          cat reports/lexicon-expand.json 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          node scripts/ai-capacity.mjs || true   # thẻ Sức chứa AI (Quản trị › Khóa API)
          test -n "$(git status --porcelain content/lexicon/expand content/qa/review-queue.json web/data/ai-capacity.json)" || { echo 'không có thay đổi'; exit 0; }
          git config user.name "lexkite-bot"; git config user.email "lexkite-bot@users.noreply.github.com"
          git add content/lexicon/expand content/qa/review-queue.json web/data/ai-capacity.json
          git commit -qm "Mở rộng kho từ: lô chờ soát (lexicon-expand) [CF-Pages-Skip]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 7)); done; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lexicon-expand, path: reports/, retention-days: 14 }
      - name: Tự nối lượt (chạy liên tục trong ngày thay vì chờ cron – như vocab-img-scene)
        if: ${{ always() && steps.lease.outputs.skip != '1' }}
        env: { GH_TOKEN: '${{ github.token }}', CHAIN: '${{ vars.LX_CHAIN }}' }
        run: |
          [ "$CHAIN" = 0 ] && { echo "chuỗi tắt (LX_CHAIN=0)"; exit 0; }
          [ "$LX_RUN_PILOT" = 1 ] && { echo "pilot → không nối (chờ soát 50 mẫu, rồi đặt LX_PILOT=0)"; exit 0; }
          [ -s reports/lexicon-expand.json ] || { echo "không có báo cáo → dừng chuỗi"; exit 0; }
          # nối khi: lượt có mục đạt, ≤ 50 % bỏ qua hạ tầng (kho CF còn neuron), và còn đủ ứng viên (n ≥ 90 % N)
          GO=$(node -p "const r=require('./reports/lexicon-expand.json'), inf=(r.why||{}).infra||0; (r.pass>0 && inf<=r.n*0.5 && r.n>=0.9*(+process.env.LX_RUN_N||2400)) ? 1 : 0")
          [ "$GO" = 1 ] || { echo "⏹ dừng chuỗi: hết neuron kho CF (4006) / hết ứng viên / 0 mục đạt – lượt cron 00:12 UTC tiếp"; exit 0; }
          gh workflow run lexicon-expand.yml -R ${{ github.repository }} --ref main
          echo "↻ đã gọi lượt lexicon-expand kế tiếp"
      - name: Trả thuê
        if: ${{ always() && steps.lease.outputs.skip != '1' }}
        env: { LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}' }
        run: node scripts/jobs/lease.mjs release lexicon-expand --status "${{ job.status }}"
