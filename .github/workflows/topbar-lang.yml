# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🌐 Một nút đổi ngôn ngữ, thanh trên thẳng lề (docs/DESIGN-SYSTEM.md §5d). Hermetic, 0 lượt chạm prod.
# PR: đo thêm bản main làm số "trước" (không chặn); ảnh + bảng số ở artifact topbar-lang. Chặn theo bản đang xét.
name: Topbar lang guard
on:
  pull_request:
    paths: ['web/app/index.html', 'web/css/style.css', 'web/css/lazy-ui.css', 'web/css/st-*', 'web/js/st/v2/**', 'web/js/ux1*.js', 'web/js/app.js', 'web/js/lang-menu.js', 'web/js/hubs.js', 'brand/stitch/v2/bind/today*', 'scripts/build-stitch-css.mjs', 'scripts/test/topbar-lang.mjs', '.github/workflows/topbar-lang.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: topbar-lang-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
  topbar:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cài trình duyệt
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund --ignore-scripts playwright@1.50.1
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: fonts-noto-color-emoji fonts-noto-core }
      - name: Số "trước" (main, không chặn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch -q --depth=1 origin "${{ github.base_ref }}"
          mkdir -p out/base && git archive FETCH_HEAD web | tar -x -C out/base
          node scripts/test/topbar-lang.mjs out/base/web out/topbar-lang --label truoc --report-only
          cat out/topbar-lang/truoc.md >> "$GITHUB_STEP_SUMMARY"
      - name: Đo bản này
        run: |
          node scripts/test/topbar-lang.mjs web out/topbar-lang --label sau && s=0 || s=$?
          cat out/topbar-lang/sau.md >> "$GITHUB_STEP_SUMMARY"
          exit $s
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: topbar-lang, path: out/topbar-lang, retention-days: 14 }
