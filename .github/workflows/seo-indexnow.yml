# Báo IndexNow (Bing, Yandex, Naver…) các trang tĩnh Từ điển + Giao tiếp mới/đổi nội dung (docs/SEO-ARCH.md §4).
# Push main đụng nguồn (mọi nguồn nội dung trang /words/ – docs/specs/seo-words-depth.md §2) → sinh lại danh sách URL + băm (scripts/build-seo-pages.mjs → .seo-urls.txt) → so với lần trước (cache Actions, miễn phí)
# → chờ Cloudflare Pages deploy xong → scripts/indexnow.mjs (dùng chung với blog). Không cron, không tốn D1/AI.
name: SEO IndexNow
on:
  push:
    branches: [main]
    paths: ['web/js/data.js', 'web/js/lib/**', 'web/packs/**', 'web/js/notes/**', 'content/confidence/**', 'scripts/build-seo-pages.mjs', 'scripts/lib/seo-pages-i18n.mjs', 'scripts/lib/seo-words.mjs', 'web/js/usage/**', 'content/dict/wordnet.json', 'web/cpack/write/models.js', 'web/cpack/speak/samples.js', 'scripts/lib/word-depth.mjs', 'scripts/dict/build.mjs']
  workflow_dispatch:
    inputs:
      all: { description: 'Gửi lại toàn bộ URL (bỏ qua so sánh)', type: boolean, default: false }
permissions: { contents: read } # đẩy sổ lastmod bằng BOT_DEPLOY_KEY
concurrency: { group: seo-indexnow, cancel-in-progress: false }
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ssh-key: '${{ secrets.BOT_DEPLOY_KEY }}', fetch-depth: 0 } # khoá deploy (ruleset chặn GITHUB_TOKEN đẩy main); fetch-depth 0: gitDate() = ngày dự phòng cho URL chưa có trong sổ
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Danh sách URL + băm
        run: SEO_DIST="$RUNNER_TEMP/seo" LASTMOD_WRITE=1 node scripts/build-seo-pages.mjs && mv .seo-urls.txt "$RUNNER_TEMP/now.txt"
      - name: Ghi sổ lastmod (ngày sửa nội dung thật theo URL – scripts/lib/lastmod.mjs)
        run: |
          git diff --quiet -- content/seo/lastmod.json 2>/dev/null && [ -z "$(git status --porcelain content/seo)" ] && { echo "sổ lastmod không đổi"; exit 0; }
          node -e "JSON.parse(require('fs').readFileSync('content/seo/lastmod.json','utf8'))" && node scripts/test/lastmod.mjs   # commit bot phải qua test (main không đỏ)
          bash scripts/ci/push-main.sh "SEO: cập nhật sổ lastmod theo nội dung trang" content/seo/lastmod.json
      - name: Lần trước
        uses: actions/cache/restore@v4
        with: { path: prev-seo-urls.txt, key: 'seo-urls-${{ github.sha }}', restore-keys: 'seo-urls-' }
      - name: URL mới/đổi
        run: |
          touch prev-seo-urls.txt
          if [ "${{ github.event.inputs.all }}" = "true" ]; then : > prev-seo-urls.txt; fi
          grep -vxFf prev-seo-urls.txt "$RUNNER_TEMP/now.txt" | cut -d' ' -f1 | head -10000 > changed.txt || true
          echo "$(wc -l < changed.txt) URL mới/đổi"; head -5 changed.txt
      - name: Chờ deploy rồi báo IndexNow
        if: hashFiles('changed.txt') != ''
        env: { CI_HDR: '${{ secrets.LEXKITE_CI_HEADER }}' }
        run: |
          [ -s changed.txt ] || exit 0
          u=$(head -1 changed.txt); sleep 240
          for i in $(seq 1 20); do c=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Lexkite-CI: $CI_HDR" "$u" || true); [ "$c" = 200 ] && break; sleep 30; done
          echo "HTTP $c cho $u"
          node scripts/indexnow.mjs < changed.txt
      - name: Lưu danh sách cho lần sau
        if: success()
        run: cp "$RUNNER_TEMP/now.txt" prev-seo-urls.txt
      - uses: actions/cache/save@v4
        if: success()
        with: { path: prev-seo-urls.txt, key: 'seo-urls-${{ github.sha }}' }
