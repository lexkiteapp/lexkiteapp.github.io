# ci-policy: all-paths – workflow bảo trì theo nhịp (không phải check PR); job ngắn
# Máy gác 3/4 (23/11, docs/CI-RUNNERS.md › Máy gác main đỏ): chạy lại ĐÚNG 1 lần lượt nặng của PR đã dừng sớm "main đỏ – chờ" khi workflow đó trên main xanh lại. Nhịp 10 phút do bộ canh required-gate dispatch (PACED), cron là lưới.
name: main-red-retry
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/ci/main-red-retry.mjs', 'scripts/ci/main-red-age.mjs', '.github/workflows/main-red-retry.yml']
permissions: { contents: read, actions: write, issues: write }
concurrency: { group: 'main-red-retry-${{ github.ref }}', cancel-in-progress: true }
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts\n.github/workflows", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/ci/main-red-retry.mjs ${{ github.event_name == 'pull_request' && '--dry' || '' }}
        env: { GITHUB_TOKEN: '${{ github.token }}', GITHUB_REPOSITORY: '${{ github.repository }}' }
      - run: node scripts/ci/main-red-age.mjs ${{ github.event_name == 'pull_request' && '--dry' || '' }}   # health sweep: đỏ trên main > 24 giờ → issue main-red
        env: { GITHUB_TOKEN: '${{ github.token }}', GITHUB_REPOSITORY: '${{ github.repository }}' }
