# 🟩 Chuẩn bị clip phông xanh mới trên CI (thay cho chạy trên máy – chủ 28/10, máy quá tải): mỗi clip id có dl/<id>.mp4 (+ dl/<id>.720.mp4) và
# tools/prep_args/<id>.txt ("<who> <facebox> <mouth> <crop_y>") trong lexkite-footage → upscale 720p → interp24 → chroma_key → expand → bank → gesture_qc.
# Kết quả = artifact green-prep-<id> (dl24, stacked, kfull, kmask, meta, qa) – đẩy vào kho (tải về, không tính toán) rồi chạy matte-pro.yml.
name: green-prep
on:
  workflow_dispatch:
    inputs:
      ids: { description: 'clip ids (phẩy)', required: true }
permissions: { contents: read }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { ids: '${{ steps.p.outputs.ids }}' }
    steps:
      - id: p
        env: { IDS: '${{ inputs.ids }}' }
        run: python3 -c "import json,os;print('ids='+json.dumps([x.strip() for x in os.environ['IDS'].split(',') if x.strip()]))" >> "$GITHUB_OUTPUT"
  prep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy: { max-parallel: 4, fail-fast: false, matrix: { id: '${{ fromJSON(needs.plan.outputs.ids) }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Footage (sparse)
        env: { KEY: '${{ secrets.FOOTAGE_DEPLOY_KEY }}', ID: '${{ matrix.id }}' }
        run: |
          [ -n "$KEY" ] || { echo "::error::missing FOOTAGE_DEPLOY_KEY"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/footage && chmod 600 ~/.ssh/footage
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/footage -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --no-checkout git@github.com:lexkiteapp/lexkite-footage.git footage
          git -C footage sparse-checkout set --no-cone /anchor/tools/ /anchor/green/*.sh /anchor/green/*.py /anchor/green/qa/ "/anchor/tools/dl/$ID.mp4" "/anchor/tools/dl/$ID.720.mp4" '!/anchor/tools/dl/*' '!/anchor/tools/dl24/*' '!/anchor/tools/raw/*' '!/anchor/tools/meta/*'
          git -C footage checkout -q; rm -f ~/.ssh/footage; ls -la footage/anchor/tools/dl/ | head
      - name: Deps
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q opencv-python-headless==4.10.0.84 numpy==2.1.3 scipy==1.14.1 pillow==11.0.0
      - name: Prep ${{ matrix.id }}
        env: { ID: '${{ matrix.id }}', APP_REPO: '${{ github.workspace }}' }
        run: |
          cd footage/anchor/tools; mkdir -p dl24 raw meta ../green/stacked ../green/kfull ../green/kmask ../green/qa
          read WHO FB MOUTH CROPY < prep_args/$ID.txt
          if [ -s dl/$ID.720.mp4 ]; then ffmpeg -loglevel error -y -i dl/$ID.720.mp4 -vf scale=1080:1920:flags=lanczos -c:v libx264 -crf 14 -pix_fmt yuv420p -an dl/$ID.mp4; fi
          (cd ../green && REFINE=1 bash prep.sh $ID $WHO $FB $MOUTH)
          python3 gesture_qc.py $ID $CROPY | tail -1 | tee ../green/qa/$ID.gesture.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'green-prep-${{ matrix.id }}'
          retention-days: 14
          path: |
            footage/anchor/tools/dl24/${{ matrix.id }}.mp4
            footage/anchor/tools/meta/${{ matrix.id }}/
            footage/anchor/green/stacked/${{ matrix.id }}.*
            footage/anchor/green/kfull/${{ matrix.id }}.mp4
            footage/anchor/green/kmask/${{ matrix.id }}.mp4
            footage/anchor/green/qa/${{ matrix.id }}*
