name: Sinh bản dịch giao diện (i18n)
# Chạy khi danh sách ngôn ngữ trong scripts/i18n-langs.txt thay đổi (hoặc bấm tay): dịch en.js → <lang>.js, giữ nguyên {biến} & thẻ HTML,
# chỉ dịch khóa mới (bản đã hiệu đính tay được giữ). Máy chủ GitHub truy cập Google Translate ổn định, miễn phí với repo công khai.
on:
  push:
    branches: [main]
    paths: [scripts/i18n-langs.txt, web/js/i18n/en.js, scripts/i18n-fixed.json, scripts/gen-i18n.mjs, .github/workflows/i18n.yml, 'content/legal/en/**', 'content/legal/vi/**', scripts/build-legal.mjs, scripts/gen-explain.mjs, 'web/js/readtest/explain-*.js']
  schedule:
    - cron: '30 2 * * *'  # hằng đêm: dịch tiếp phần còn dở (lời giải đề thi dịch dần theo ngân sách thời gian)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: i18n, cancel-in-progress: false }  # nhóm riêng: dùng chung nhóm thì run chờ bị run khác đè (GitHub giữ 1 run chờ/nhóm)
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dịch từng ngôn ngữ
        run: |
          SECONDS=0
          for l in $(grep -v '^#' scripts/i18n-langs.txt); do node scripts/gen-i18n.mjs "$l" || echo "lỗi $l"; sleep 2; done
          node scripts/i18n-fix.mjs  # bản dịch tay cho nhãn ngắn dễ bị dịch máy sai nghĩa
          node scripts/build-legal.mjs --translate  # Chính sách & Điều khoản cho 15 ngôn ngữ (chỉ dịch dòng mới/sửa)
          node scripts/gen-hero.mjs  # khung trang chào mừng dựng sẵn trong index.html theo bản dịch mới
          for l in $(grep -v '^#' scripts/i18n-langs.txt); do EXPLAIN_MIN=$(( 50 - (SECONDS / 60) )) node scripts/gen-explain.mjs "$l" || echo "lỗi lời giải $l"; done  # lời giải đề thi (chỉ câu mới)
          node scripts/i18n-backcheck.mjs || echo 'kiểm nghĩa lỗi mạng – lần sau làm tiếp'  # dịch ngược câu mới/đổi → web/i18n/backcheck.json (tab Chất lượng)
          node scripts/i18n-qa.mjs   # báo cáo chất lượng: đủ khóa, đúng biến, không lẫn tiếng (xem docs/I18N-PIPELINE.md)
      - name: Lưu kết quả vào repo (tự lấy bản mới nhất trước khi đẩy, thử lại tối đa 5 lần)
        run: |
          git config user.name "lexkite-bot"
          git config user.email "lexkite-bot@users.noreply.github.com"
          git add web/js/i18n/*.js web/i18n/explain web/i18n/backcheck.json content/i18n-backcheck-cache.json web/index.html web/*/privacy.html web/*/terms.html web/privacy.html web/terms.html content/legal/cache
          git diff --cached --quiet && exit 0
          git commit -m "i18n: cập nhật bản dịch giao diện tự động"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i * 10)); done
          exit 1
