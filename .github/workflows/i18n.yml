name: Sinh bản dịch giao diện (i18n)
# Chạy khi danh sách ngôn ngữ trong scripts/i18n-langs.txt thay đổi (hoặc bấm tay): dịch en.js → <lang>.js, giữ nguyên {biến} & thẻ HTML,
# chỉ dịch khóa mới (bản đã hiệu đính tay được giữ). Máy chủ GitHub truy cập Google Translate ổn định, miễn phí với repo công khai.
on:
  push:
    branches: [main]
    paths: [scripts/i18n-langs.txt, web/js/i18n/en.js, scripts/i18n-fixed.json, scripts/gen-i18n.mjs, .github/workflows/i18n.yml, 'content/legal/en/**', 'content/legal/vi/**', scripts/build-legal.mjs, scripts/gen-explain.mjs, 'web/js/readtest/explain-*.js']
  schedule:
    - cron: '30 2 * * *'  # hằng đêm: dịch tiếp phần còn dở (lời giải đề thi dịch dần theo ngân sách thời gian)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: i18n, cancel-in-progress: false }  # nhóm riêng: dùng chung nhóm thì run chờ bị run khác đè (GitHub giữ 1 run chờ/nhóm)
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Dịch từng ngôn ngữ
        run: |
          SECONDS=0
          for l in $(grep -v '^#' scripts/i18n-langs.txt); do node scripts/gen-i18n.mjs "$l" || echo "lỗi $l"; sleep 2; done
          # Bản sửa dịch quản trị đã duyệt (Quản trị → Chất lượng → Áp dụng) → gộp vào i18n-fixed.json trước khi áp
          node -e "const fs=require('fs');fetch('https://lexkite.com/api/i18nfix').then(r=>r.json()).then(a=>{const p='scripts/i18n-fixed.json',d=JSON.parse(fs.readFileSync(p,'utf8'));let n=0;for(const[k,v]of Object.entries(a)){d[k]=Object.assign(d[k]||{},v);n+=Object.keys(v).length}fs.writeFileSync(p,JSON.stringify(d,null,2)+'\\n');console.log('bản sửa đã duyệt:',n)}).catch(e=>console.log('bỏ qua i18nfix',e.message))"
          node scripts/i18n-fix.mjs  # bản dịch tay cho nhãn ngắn dễ bị dịch máy sai nghĩa
          node scripts/build-legal.mjs --translate  # Chính sách & Điều khoản cho 15 ngôn ngữ (chỉ dịch dòng mới/sửa)
          node scripts/gen-hero.mjs  # khung trang chào mừng dựng sẵn trong index.html theo bản dịch mới
          for l in $(grep -v '^#' scripts/i18n-langs.txt); do EXPLAIN_MIN=$(( 50 - (SECONDS / 60) )) node scripts/gen-explain.mjs "$l" || echo "lỗi lời giải $l"; done  # lời giải đề thi (chỉ câu mới)
          node scripts/i18n-backcheck.mjs || echo 'kiểm nghĩa lỗi mạng – lần sau làm tiếp'  # dịch ngược câu mới/đổi → web/i18n/backcheck.json (tab Chất lượng)
          node scripts/i18n-qa.mjs   # báo cáo chất lượng: đủ khóa, đúng biến, không lẫn tiếng (xem docs/I18N-PIPELINE.md)
      - name: Dịch sẵn nội dung bài học (dùng thời gian còn lại – dịch dần qua nhiều đêm, chỉ câu mới)
        timeout-minutes: 25
        continue-on-error: true
        run: |
          timeout 600 node scripts/harvest-content.mjs 3000 2>/dev/null | tail -1 || echo 'thu thập quá giờ – dùng danh sách cũ'
          LANGS="en $(grep -v '^#' scripts/i18n-langs.txt)"  # en cũng cần: nội dung soạn tiếng Việt → giao diện tiếng Anh
          for l in $LANGS; do CONTENT_MIN=1 node scripts/gen-content-i18n.mjs "$l" || echo "lỗi nội dung $l"; done
      - name: Lưu kết quả vào repo (tự lấy bản mới nhất trước khi đẩy, thử lại tối đa 5 lần)
        if: always()
        run: |
          git config user.name "lexkite-bot"
          git config user.email "lexkite-bot@users.noreply.github.com"
          # 27/10: bản dịch mới ở web/js/i18n phải chép sang add-on cùng commit, nếu không ext-sync (npm test) đỏ trên main và mọi PR
          bash scripts/build-extension.sh >/dev/null
          git add extension/app content/i18n/strings.json web/i18n/content scripts/i18n-fixed.json web/js/i18n web/i18n/explain web/i18n/backcheck.json content/i18n-backcheck-cache.json web/app/index.html web/*/privacy.html web/*/terms.html web/privacy.html web/terms.html content/legal/cache
          git diff --cached --quiet && exit 0
          git commit -m "i18n: cập nhật bản dịch giao diện tự động [CF-Pages-Skip]"
          # 22–23/10: gen-i18n ghi nhóm tải lười web/js/i18n/<lang>/<nhóm>.js (trước chỉ add *.js cấp 1) → file sửa chưa add chặn "pull --rebase".
          # Phần còn sót không thuộc danh sách trên = rác của lượt chạy → cất đi để rebase luôn chạy được.
          git status --porcelain | head -20; git stash push -q --include-untracked -m i18n-leftover || true
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i * 10)); done
          exit 1
