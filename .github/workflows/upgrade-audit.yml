# Kiểm toán nâng cấp hằng tuần: làm mới khối số đo (Lighthouse) trong docs/specs/upgrade-audit.md + kiểm ≤ 1 trang, đủ 5 trục, chỉ miễn phí.
# Không triển khai gì từ danh sách (chủ duyệt). Sổ: infra/jobs.json id upgrade-audit.
name: Upgrade audit
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: upgrade-audit, cancel-in-progress: false }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, ssh-key: '${{ secrets.BOT_DEPLOY_KEY }}' }   # đẩy main qua khoá deploy (ruleset) – docs/CI-RUNNERS.md › required-gate
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/ci/upgrade-audit.mjs --measure --check
      - name: Lưu số đo
        run: |
          git config user.name "lexkite-bot"; git config user.email "lexkite-bot@users.noreply.github.com"
          git add docs/specs/upgrade-audit.md; git diff --cached --quiet && exit 0
          git commit -qm "Kiểm toán nâng cấp: cập nhật số đo Lighthouse [CF-Pages-Skip] [skip ci]"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0; sleep 5; done; echo "::error::không đẩy được lên main (BOT_DEPLOY_KEY / ruleset?)"; exit 1
