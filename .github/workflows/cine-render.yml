# Dựng video điện ảnh (cine) trên CI – Mac không render nữa (docs/VIDEO-SYSTEM-PLAN.md mục 2, docs/CINE-SCENE-STANDARD.md "Dựng trên CI").
# Footage chỉ nằm ở repo RIÊNG TƯ lexkiteapp/lexkite-footage: lấy bằng deploy key chỉ-đọc (secret FOOTAGE_DEPLOY_KEY), sparse theo cảnh.
# Builder: scripts/cine/ (lesson5 + tpl_styles + qa5 + lipsync + foley). 0 credit.
name: cine-render
on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Kho cảnh (hotel | cafe | airport | restaurant | anchor | news = bản tin, bài content/video/cine/news/*.json); nhiều cảnh phẩy ngăn (cafe,restaurant) – bài auto_<cảnh>_… tự về đúng cảnh'
        required: true
        default: hotel
      lessons:
        description: "Danh sách bài, phẩy ngăn cách ('hotel_tpl_choose,hotel_1:vi' – ':lang' ghi đè ngôn ngữ), 'all', hoặc 'auto' (bài sinh tự động content/video/cine/auto/<scene>)"
        required: true
        default: all
      lang:
        description: 'Ngôn ngữ mặc định (locale content/video/cine/locales/<bài>.<lang>.json)'
        required: false
        default: en
      viral:
        description: 'Viral bật = luật mặc định của lesson5 (tiếng Anh + bài có VIRAL_HOOK → viral; ngôn ngữ khác → bản thường); tắt = ép bản thường'
        type: boolean
        default: true
      outsuf:
        description: 'Hậu tố tên file bản viral'
        required: false
        default: '-v3'
permissions:
  contents: read
concurrency:
  group: cine-render-${{ github.event.inputs.scene }}
  cancel-in-progress: false
jobs:
  render:
    if: github.event.inputs.scene != 'news'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CINE_THREADS: '0'            # CI: dùng hết nhân
      CINE_ROOT: ${{ github.workspace }}
      CINE_OUT: ${{ github.workspace }}/out
      CINE_LIB: ${{ github.workspace }}/footage
      OUTSUF: ${{ github.event.inputs.outsuf }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/cine/requirements.txt
      - name: Cài thư viện + ffmpeg
        run: |
          pip install -q -r scripts/cine/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -hide_banner -version | head -1
      - name: Lấy footage (repo riêng tư, sparse theo cảnh)
        env:
          KEY: ${{ secrets.FOOTAGE_DEPLOY_KEY }}
          SCENE: ${{ github.event.inputs.scene }}
        run: |
          [ -n "$KEY" ] || { echo "::error::thiếu secret FOOTAGE_DEPLOY_KEY"; exit 1; }
          case "$SCENE" in *[!a-z0-9_,-]*|'') echo "::error::scene không hợp lệ"; exit 1;; esac
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/footage && chmod 600 ~/.ssh/footage
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/footage -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --no-checkout git@github.com:lexkiteapp/lexkite-footage.git footage
          EXTRA=""; case ",$SCENE," in *,anchor,*) EXTRA="cafe hotel airport restaurant";; esac   # anchor: B-roll 'bank:clip' từ 4 kho
          git -C footage sparse-checkout set ${SCENE//,/ } hotel/tools/end hotel/tools/foley $EXTRA
          git -C footage checkout -q
          rm -f ~/.ssh/footage
          du -sh footage
      # Bài sinh tự động (scripts/cine/gen_lessons.py): giọng còn thiếu -> Kokoro + Rhubarb ngay trên CI (0 credit, không làm gì trên Mac)
      - uses: actions/setup-node@v4
        if: hashFiles('content/video/cine/auto/*/lines.json') != ''   # any auto scene (scene may be a list)
        with: { node-version: 20 }
      - name: Đệm mô hình Kokoro (~90 MB)
        if: hashFiles('content/video/cine/auto/*/lines.json') != ''   # any auto scene (scene may be a list)
        uses: actions/cache@v4
        with:
          path: /tmp/kk/node_modules/@huggingface/transformers/.cache
          key: video-models-kokoro82m-q8-cine-v1
      - name: Cài kokoro-js + Rhubarb
        if: hashFiles('content/video/cine/auto/*/lines.json') != ''   # any auto scene (scene may be a list)
        run: |
          npm i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1 >/dev/null
          curl -fsSL -o /tmp/rh.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          mkdir -p /tmp/rh && unzip -q /tmp/rh.zip -d /tmp/rh
          R=$(find /tmp/rh -type f -name rhubarb | head -1); chmod +x "$R"; echo "RHUBARB=$R" >> "$GITHUB_ENV"; echo "KOKORO_NODE_PATH=/tmp/kk/node_modules" >> "$GITHUB_ENV"
      - name: Dựng + QA
        env:
          SCENE: ${{ github.event.inputs.scene }}
          LESSONS: ${{ github.event.inputs.lessons }}
          LANG_DEF: ${{ github.event.inputs.lang }}
        run: |
          set -o pipefail
          [ "${{ github.event.inputs.viral }}" = true ] || export VIRAL=0
          mkdir -p out/qa; : > out/passed.txt
          fail=0; n=0
          for SC in ${SCENE//,/ }; do
            export CINE_SCENE_DIR="$(bash scripts/cine/prep_scene.sh footage "$SC")"
            [ -f "content/video/cine/auto/$SC/lines.json" ] && python scripts/cine/auto_voice.py "$CINE_SCENE_DIR" "$SC"
            L="$LESSONS"
            if [ "$L" = auto ]; then
              L=$(cd "content/video/cine/auto/$SC" && ls *.py | grep -v '^_' | sed 's/\.py$//' | paste -sd, -)
            elif [ "$L" = all ]; then
              L=$(cd "$CINE_SCENE_DIR/lessons" && ls *.py | grep -v '^_' | sed 's/\.py$//' | paste -sd, -)
            fi
            for item in ${L//,/ }; do
              lid=${item%%:*}; lang=$LANG_DEF; [ "$item" != "$lid" ] && lang=${item#*:}
              case "$lid$lang" in *[!a-z0-9_]*) echo "::error::tên bài không hợp lệ: $item"; fail=1; continue;; esac
              case "$lid" in auto_*) own=${lid#auto_}; own=${own%%_*}; [ "$own" = "$SC" ] || continue;; *) [ "$SC" = "${SCENE%%,*}" ] || continue;; esac   # mỗi bài dựng đúng 1 lần, ở cảnh của nó
              if [ ! -f "content/video/cine/locales/$lid.$lang.json" ]; then echo "::warning::bỏ qua $lid ($lang): chưa có locale"; continue; fi
              echo "::group::$SC/$lid ($lang)"; n=$((n+1))
              if python scripts/cine/lesson5.py "$lang" "$lid" 2>&1 | tee "out/qa/build_${lid}_${lang}.log"; then
                rd=$(ls -td "$CINE_SCENE_DIR"/render5_${lid}_${lang}* | head -1); rb=$(basename "$rd")
                cp "$rd/timeline.json" "out/qa/timeline_$rb.json"
                if python scripts/cine/qa5.py "$rb" > "out/qa/qa_$rb.log" 2>&1; then echo "$SC $lid $rb" >> out/passed.txt; else fail=1; fi
                tail -1 "out/qa/qa_$rb.log"
                grep -E 'FAIL' "out/qa/qa_$rb.log" | head -20 || true
              else fail=1; fi
              echo "::endgroup::"
            done
          done
          echo "## cine-render: $SCENE" >> $GITHUB_STEP_SUMMARY
          for f in out/*.mp4; do [ -f "$f" ] && echo "- $(basename "$f"): $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f") s" >> $GITHUB_STEP_SUMMARY; done
          for f in out/qa/qa_*.log; do [ -f "$f" ] && echo "- $(basename "$f"): $(tail -1 "$f")" >> $GITHUB_STEP_SUMMARY; done
          [ $n -gt 0 ] || { echo "::error::không dựng bài nào"; exit 1; }
          exit $fail
      - name: Tờ soát nhỏ (8 khung/bài, 5 bài/tờ) cho kiểm tra nhanh
        if: always()
        run: |
          python - <<'PY'
          import cv2, glob, numpy as np, os
          vs = sorted(glob.glob('out/*.mp4')); os.makedirs('out/qa', exist_ok=True)
          for k in range(0, len(vs), 5):
              rows = []
              for v in vs[k:k + 5]:
                  cap = cv2.VideoCapture(v); n = int(cap.get(cv2.CAP_PROP_FRAME_COUNT)); fr = []
                  for i in np.linspace(2, n - 3, 8).astype(int):
                      cap.set(cv2.CAP_PROP_POS_FRAMES, int(i)); ok, f = cap.read(); fr.append(cv2.resize(f, (135, 240)) if ok else np.zeros((240, 135, 3), np.uint8))
                  rows.append(np.hstack(fr))
              cv2.imwrite(f'out/qa/sheet_{k // 5 + 1}.jpg', np.vstack(rows), [cv2.IMWRITE_JPEG_QUALITY, 70])
          PY
      - name: Lưu bền bài ĐẠT (repo riêng tư lexkiteapp/lexkite-shorts, shorts/<cảnh>/<bài>/)
        if: always()
        env:
          KEY: ${{ secrets.SHORTS_DEPLOY_KEY }}
          LEXKITE_DRIVE_CLI_KEY: ${{ secrets.LEXKITE_DRIVE_CLI_KEY }}
        run: |
          [ -s out/passed.txt ] || { echo "không có bài đạt để lưu"; exit 0; }
          [ -n "$KEY" ] || { echo "::warning::thiếu secret SHORTS_DEPLOY_KEY – chỉ còn artifact 14 ngày"; exit 0; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/shorts && chmod 600 ~/.ssh/shorts
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/shorts -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --sparse git@github.com:lexkiteapp/lexkite-shorts.git /tmp/shorts
          python scripts/cine/store_shorts.py out /tmp/shorts "${{ github.run_number }}" "${{ github.sha }}"
          bash scripts/cine/archive_new.sh /tmp/shorts
          cd /tmp/shorts; git add --sparse -A shorts recipes .gitignore; git -c user.name="Lexkite CI" -c user.email="lexkiteapp@users.noreply.github.com" commit -qm "cine-render #${{ github.run_number }} (${{ github.event.inputs.scene }})" || exit 0
          for k in 1 2 3 4; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
          rm -f ~/.ssh/shorts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cine-qa-${{ github.event.inputs.scene }}-${{ github.run_number }}
          path: |
            out/qa/
            out/voices/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cine-${{ github.event.inputs.scene }}-${{ github.run_number }}
          path: |
            out/*.mp4
            out/covers/*.jpg
            out/qa/
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------- scene=news: news-anchor shorts (scripts/cine/news.py + news_tpl.py + qa_news.py)
  news-plan:
    if: github.event.inputs.scene == 'news'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env: { LESSONS: '${{ github.event.inputs.lessons }}' }
        run: |
          python3 - <<'PY'
          import glob, json, os, re
          L = os.environ['LESSONS'].strip()
          ids = sorted(os.path.basename(f)[:-5] for f in glob.glob('content/video/cine/news/news_*.json')) if L in ('all', 'auto') else [x.split(':')[0] for x in L.split(',') if x]
          assert ids and all(re.fullmatch(r'[a-z0-9_]+', i) and os.path.exists(f'content/video/cine/news/{i}.json') for i in ids), ids
          sh = [','.join(ids[k:k + 6]) for k in range(0, len(ids), 6)]   # 6 lessons per job = 1 contact sheet per 6 lessons
          open(os.environ['GITHUB_OUTPUT'], 'a').write('shards=' + json.dumps(sh) + '\n'); print(sh)
          PY
  news-depth:
    needs: news-plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Lấy footage news (anchor/green + anchor/bg + meta, sparse)
        env: { KEY: '${{ secrets.FOOTAGE_DEPLOY_KEY }}' }
        run: |
          [ -n "$KEY" ] || { echo "::error::thiếu secret FOOTAGE_DEPLOY_KEY"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/footage && chmod 600 ~/.ssh/footage
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/footage -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --no-checkout git@github.com:lexkiteapp/lexkite-footage.git footage
          git -C footage sparse-checkout set --no-cone '/anchor/green/kfull/' '/anchor/green/kmask/' '/anchor/bg/' '/anchor/tools/meta/g*/' '/anchor/tools/dl24/g*.json' \
            '/anchor/tools/fonts/' '/anchor/tools/foley/' '/anchor/tools/amb_studio.wav' '/anchor/news/depth/'
          git -C footage checkout -q; rm -f ~/.ssh/footage; du -sh footage
      - uses: actions/cache/restore@v4
        with: { path: depth, key: 'news-depth-v1-${{ github.run_id }}', restore-keys: 'news-depth-v1-' }
      - name: Depth-Anything-V2-Small cho nền còn thiếu (CPU, 0 credit)
        run: |
          mkdir -p depth; cp -n footage/anchor/news/depth/*.png depth/ 2>/dev/null || true
          miss=$(python3 -c "import json,os;print(sum(not os.path.exists('depth/'+e['topic']+'.depth.png') for e in json.load(open('footage/anchor/bg/index.json'))['items']))")
          mz=$(python3 -c "import json,os;p=lambda t:'depth/'+t+'.zones.json';print(sum(not os.path.exists(p(e['topic'])) or json.load(open(p(e['topic']))).get('v',1)<5 for e in json.load(open('footage/anchor/bg/index.json'))['items']))")
          echo "thiếu $miss bản đồ sâu, $mz bản chú thích vùng (bg_zones)"
          if [ "$miss" != 0 ] || [ "$mz" != 0 ]; then
            pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 && pip install -q transformers==4.46.3 pillow==11.0.0 opencv-python-headless==4.10.0.84 numpy==2.1.3 scipy==1.14.1
            [ "$miss" = 0 ] || python3 scripts/cine/news_depth.py footage depth
            python3 scripts/video/bg_zones.py footage/anchor/bg depth --depth depth   # owner 22/10 §11: standable floor / forbidden objects / horizon per background
          fi
      - uses: actions/cache/save@v4
        with: { path: depth, key: 'news-depth-v1-${{ github.run_id }}' }
      - uses: actions/upload-artifact@v4
        with: { name: 'news-depth-${{ github.run_number }}', path: depth/, retention-days: 30 }
  news:
    needs: [news-plan, news-depth]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.news-plan.outputs.shards) }}
    env:
      CINE_ROOT: ${{ github.workspace }}
      CINE_OUT: ${{ github.workspace }}/out
      CINE_LIB: ${{ github.workspace }}/footage
      NEWS_DIR: ${{ github.workspace }}/newswork
      NEWS_DEPTH: ${{ github.workspace }}/depth
      NEWS_ZONES: ${{ github.workspace }}/depth
      NEWS_MATTE: ''   # 'pro' = PRO host matte (green/k*_pro, matte_qa gate) once news.py uses MR.layer_paths/finish_host (docs/VIDEO.md §6)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/cine/requirements.txt
      - name: Cài thư viện + ffmpeg
        run: |
          pip install -q -r scripts/cine/requirements.txt scipy==1.14.1 faster-whisper==1.0.3 requests==2.32.3
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Lấy footage news (anchor/green + anchor/bg + meta, sparse)
        env: { KEY: '${{ secrets.FOOTAGE_DEPLOY_KEY }}' }
        run: |
          [ -n "$KEY" ] || { echo "::error::thiếu secret FOOTAGE_DEPLOY_KEY"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/footage && chmod 600 ~/.ssh/footage
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/footage -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --no-checkout git@github.com:lexkiteapp/lexkite-footage.git footage
          git -C footage sparse-checkout set --no-cone '/anchor/green/kfull/' '/anchor/green/kmask/' '/anchor/bg/' '/anchor/tools/meta/g*/' '/anchor/tools/dl24/g*.json' \
            '/anchor/tools/fonts/' '/anchor/tools/foley/' '/anchor/tools/amb_studio.wav' '/anchor/news/depth/' \
            '/anchor/green/kfull_pro/' '/anchor/green/kmask_pro/' '/anchor/tools/dl24/ga4_talk_natural.mp4' '/anchor/tools/dl24/gc4_talk_natural.mp4' '/anchor/tools/dl24/gc4_listen.mp4'
          git -C footage checkout -q; rm -f ~/.ssh/footage; du -sh footage
          echo "FOOTAGE_SHA=$(git -C footage rev-parse HEAD)" >> "$GITHUB_ENV"   # recipe: footage bank version
      - name: Cổng tách nền PRO (matte_qa gate)
        if: env.NEWS_MATTE == 'pro'
        run: python scripts/video/matte_qa.py gate footage/anchor/green ga4_talk_natural,gc4_talk_natural,gc4_listen
      - uses: actions/cache/restore@v4
        with: { path: depth, key: 'news-depth-v1-${{ github.run_id }}', restore-keys: 'news-depth-v1-', fail-on-cache-miss: true }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Đệm mô hình Kokoro (~90 MB)
        uses: actions/cache@v4
        with:
          path: /tmp/kk/node_modules/@huggingface/transformers/.cache
          key: video-models-kokoro82m-q8-cine-v1
      - name: Cài kokoro-js + Rhubarb
        run: |
          npm i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1 >/dev/null
          curl -fsSL -o /tmp/rh.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          mkdir -p /tmp/rh && unzip -q /tmp/rh.zip -d /tmp/rh
          R=$(find /tmp/rh -type f -name rhubarb | head -1); chmod +x "$R"; echo "RHUBARB=$R" >> "$GITHUB_ENV"; echo "KOKORO_NODE_PATH=/tmp/kk/node_modules" >> "$GITHUB_ENV"
      - name: Giọng (Kokoro + Rhubarb + faster-whisper mốc từ)
        env: { SHARD: '${{ matrix.shard }}' }
        run: |
          mkdir -p "$NEWS_DIR"/ci "$NEWS_DIR"/lessons out/qa out/voices
          cp content/video/cine/news/lines.json "$NEWS_DIR/ci/lines.json"
          for i in ${SHARD//,/ }; do cp "content/video/cine/news/$i.json" "$NEWS_DIR/lessons/"; done
          python scripts/cine/news_voice.py "$NEWS_DIR" "$SHARD"
          cp "$NEWS_DIR"/vis3/* out/voices/
      - name: Dựng + qa_news
        env: { SHARD: '${{ matrix.shard }}', STUDIO_CALLBACK_SECRET: '${{ secrets.STUDIO_CALLBACK_SECRET }}' }
        run: |
          : > out/passed.txt; fail=0
          for lid in ${SHARD//,/ }; do
            echo "::group::news/$lid"; rb="render5_${lid}_en"
            # owner 22/10 §11: preflight = placement rules (bg zones) + AI vision gate on 3 composited frames; on failure retry another background (<= 2x)
            python scripts/cine/script_judge.py "content/video/cine/news/$lid.json" "$NEWS_DIR/ci/lines.json" "$NEWS_DIR/judge_$lid.json" && jrc=0 || jrc=$?
            cp "$NEWS_DIR/judge_$lid.json" out/qa/ 2>/dev/null || true
            if [ "$jrc" = 1 ]; then echo "news $lid: script fails the pedagogy rules / AI judge (not rendered)"; fail=1; echo "::endgroup::"; continue; fi
            unset NEWS_BG; tried=""; pre_ok=0
            for att in 0 1 2; do
              rm -rf "$NEWS_DIR/pre_$lid"
              if NEWS_PREFLIGHT=1 python scripts/cine/news.py "$lid" > "out/qa/pre_${lid}_$att.log" 2>&1; then
                python scripts/cine/vision_gate.py "$NEWS_DIR/pre_$lid" && rc=0 || rc=$?
                [ "$rc" = 0 ] && { pre_ok=1; break; }
                [ "$rc" = 2 ] && { pre_ok=1; echo "::warning::vision gate unavailable for $lid (qa_news will fail it)"; break; }
              else tail -3 "out/qa/pre_${lid}_$att.log"; fi
              cur="${NEWS_BG:-$(python -c "import json;print(json.load(open('content/video/cine/news/$lid.json'))['bg'])")}"; tried="$tried,$cur"
              nb=$(python scripts/cine/bg_pick.py "content/video/cine/news/$lid.json" "$tried") || nb=""
              [ -n "$nb" ] || break; export NEWS_BG="$nb"; echo "retry $lid with background $nb"
            done
            mkdir -p "out/qa/pre_$lid"; cp "$NEWS_DIR/pre_$lid"/* "out/qa/pre_$lid/" 2>/dev/null || true
            if [ "$pre_ok" != 1 ]; then echo "news $lid: no background passes placement + vision (dropped)"; fail=1; echo "::endgroup::"; continue; fi
            if { python scripts/cine/news.py "$lid" 2>&1 | tee "out/qa/build_${lid}_en.log"; } && [ -f "$NEWS_DIR/$rb/timeline.json" ]; then   # a failed build must not abort the remaining lessons
              cp "$NEWS_DIR/$rb/timeline.json" "out/qa/timeline_$rb.json"; cp "$NEWS_DIR/$rb/qc.json" "out/qa/qc_$rb.json"
              if (cd "$NEWS_DIR" && python "$CINE_ROOT/scripts/cine/qa_news.py" "$rb") > "out/qa/qa_$rb.log" 2>&1; then :; fi
              tail -1 "out/qa/qa_$rb.log"; grep FAIL "out/qa/qa_$rb.log" | head -20 || true
              tail -1 "out/qa/qa_$rb.log" | grep -q 'ALL PASS' && echo "news $lid $rb" >> out/passed.txt || fail=1
            else fail=1; fi
            [ -n "${NEWS_BG:-}" ] && echo "$lid $NEWS_BG" >> out/bg_override.txt; unset NEWS_BG
            echo "::endgroup::"
          done
          for f in out/qa/qa_*.log; do echo "- $(basename "$f"): $(tail -1 "$f")" >> $GITHUB_STEP_SUMMARY; done
          exit $fail
      - name: Tờ soát (6 bài/tờ, 1 khung/shot)
        if: always()
        env: { SHARD_IDX: '${{ strategy.job-index }}' }
        run: |
          python - <<'PY'
          import cv2, glob, numpy as np, json, os
          vs = sorted(glob.glob('out/*.mp4')); rows = []
          for v in vs:
              rb = 'render5_' + os.path.basename(v)[5:-7].replace('-', '_') + '_en'; tl = json.load(open(f'out/qa/timeline_{rb}.json')) if os.path.exists(f'out/qa/timeline_{rb}.json') else None
              ts = [s['t0'] + s['dur'] * 0.6 for s in tl['shots']][:10] if tl else list(np.linspace(0.5, 20, 8))
              cap = cv2.VideoCapture(v); fr = []
              for t in ts:
                  cap.set(cv2.CAP_PROP_POS_MSEC, t * 1000); ok, f = cap.read(); fr.append(cv2.resize(f, (180, 320)) if ok else np.zeros((320, 180, 3), np.uint8))
              while len(fr) < 10: t_ = np.full((320, 180, 3), 70, np.uint8); cv2.putText(t_, 'no shot', (40, 165), cv2.FONT_HERSHEY_SIMPLEX, 0.6, (200, 200, 200), 1); fr.append(t_)   # padding tile (lesson has < 10 shots), not a video frame
              for t_ in fr:   # platform UI safe-zone guides (top 12 %, bottom 22 %, right 14 %)
                  cv2.line(t_, (0, 38), (179, 38), (0, 0, 255), 1); cv2.line(t_, (0, 250), (179, 250), (0, 0, 255), 1); cv2.line(t_, (155, 0), (155, 319), (0, 0, 255), 1)
              zs = []   # 400 % edge crops of the hook two-shot (owner 22/10: hair / shoulder / hand edges, no halo)
              if tl:
                  h0 = tl['shots'][0]; cap.set(cv2.CAP_PROP_POS_MSEC, h0['dur'] * 500); ok, f0 = cap.read(); fb = sorted(h0.get('faceboxes', []), key=lambda b: b[0])
                  pts = ([(fb[0][0] + 10, fb[0][1] + 20), (fb[0][2] + 40, fb[0][3] + 110), (fb[0][0] - 30, 1560)] if fb and ok else [])   # hair / shoulder / hand edges of the hook single
                  for x, y in pts:
                      x, y = int(np.clip(x, 23, 1056)), int(np.clip(y, 40, 1879)); zs.append(cv2.resize(f0[y - 40:y + 40, x - 22:x + 23], (180, 320), interpolation=cv2.INTER_NEAREST))
              while len(zs) < 3: zs.append(np.zeros((320, 180, 3), np.uint8))
              rows.append(np.hstack(fr + zs))
          if rows: cv2.imwrite(f'out/qa/sheet_news_{os.environ["SHARD_IDX"]}.jpg', np.vstack(rows), [cv2.IMWRITE_JPEG_QUALITY, 72])
          PY
      - name: Lưu bền bài ĐẠT (lexkite-shorts, shorts/news/<bài>/)
        if: always()
        env: { KEY: '${{ secrets.SHORTS_DEPLOY_KEY }}', LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}' }
        run: |
          [ -s out/passed.txt ] || { echo "không có bài đạt để lưu"; exit 0; }
          [ -n "$KEY" ] || { echo "::warning::thiếu secret SHORTS_DEPLOY_KEY"; exit 0; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/shorts && chmod 600 ~/.ssh/shorts
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/shorts -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --sparse git@github.com:lexkiteapp/lexkite-shorts.git /tmp/shorts
          python scripts/cine/store_shorts.py out /tmp/shorts "${{ github.run_number }}" "${{ github.sha }}"
          bash scripts/cine/archive_new.sh /tmp/shorts
          cd /tmp/shorts; git add --sparse -A shorts recipes .gitignore; git -c user.name="Lexkite CI" -c user.email="lexkiteapp@users.noreply.github.com" commit -qm "cine-render #${{ github.run_number }} (news)" || exit 0
          for k in 1 2 3 4 5 6; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
          rm -f ~/.ssh/shorts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cine-news-${{ github.run_number }}-${{ strategy.job-index }}
          path: |
            out/*.mp4
            out/covers/*.jpg
            out/*-luma.png
            out/qa/
            out/voices/
            out/passed.txt
            out/bg_override.txt
          retention-days: 14
          if-no-files-found: warn
