# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# Social channel kit. Bộ ảnh KÊNH social tiếng Anh (avatar + bìa FB/IG/TikTok/YouTube, watermark, mẫu thumbnail) – brand/social/channel-kit/README.md
# Dựng bằng Chromium (scripts/social/build-channel-kit.mjs) + cổng QC (kích thước, vùng an toàn crop tròn/điện thoại/TV, tương phản ≥ 4.5:1,
# cỡ chữ, chữ đè giáo viên, không tiếng Việt, dung lượng, logo nguyên bản). PNG → artifact bot-output-channel-kit (không đẩy vào nhánh PR):
#   bash scripts/ci/bot-output.sh channel-kit   rồi tự commit.
name: Social channel kit
on:
  pull_request:
    paths: ['scripts/social/build-channel-kit.mjs', 'brand/social/channel-kit/**', 'web/icons/icon.svg', 'brand/lexkite-logo-dark.svg', 'brand/tokens.json', 'web/teach/ama/still-*.webp', 'web/teach/carlos/still-*.webp', 'brand/social/src/fonts/**', 'scripts/social/channel-copy.mjs', 'scripts/social/build-page-info.mjs', 'scripts/cine/fonts/NotoSansArabic.ttf', '.github/workflows/social-channel-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write   # comment kết quả QC lên PR
concurrency:
  group: social-channel-kit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cài Playwright + sharp
        timeout-minutes: 14
        run: |
          bash scripts/ci/npm-retry.sh i --no-save --no-audit --no-fund playwright@1.48.2 sharp@0.33.5
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: fonts-noto-core fonts-noto-cjk }   # Devanagari/Cyrillic đậm (hi/ru) + CJK (ja/ko/zh); Ả Rập dùng scripts/cine/fonts
      - name: Dựng + QC
        run: node scripts/social/build-channel-kit.mjs
      - name: Kiểm file vừa dựng (như npm test)
        run: node scripts/social/build-channel-kit.mjs --check
      - name: Kết quả → artifact + comment PR
        if: ${{ !cancelled() }}
        uses: ./.github/actions/bot-output
        with: { name: channel-kit, paths: brand/social/channel-kit, report: '${{ runner.temp }}/channel-kit-qc.md', comment: 'true' }
