# 🧈 Cuộn mượt: cử chỉ cuộn thật qua các màn học chính (điện thoại 390 px CPU 4× · máy tính · WebKit), tối + sáng; đo khung rớt, task dài, CLS, xê dịch – docs/PERF-SCROLL.md
# Hermetic: dist cục bộ, ?sandbox=1&demo=1, /api/* = {}, host ngoài = rỗng → 0 tài khoản thật. Đỏ khi vượt scroll-perf.budget.json (ngưỡng chỉ siết).
name: Scroll perf
on:
  pull_request:
    paths: ['web/js/**', 'web/css/**', 'web/app/**', 'scripts/test/scroll-perf.mjs', 'scripts/test/scroll-perf.budget.json', '.github/workflows/scroll-perf.yml']
  push:
    branches: ['scroll-perf-*']
    paths: ['web/js/**', 'web/css/**', 'web/app/**', 'scripts/test/scroll-perf.mjs', 'scripts/test/scroll-perf.budget.json', '.github/workflows/scroll-perf.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [phone, desktop, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dựng dist
        run: |
          npm ci --no-audit --no-fund
          bash scripts/build-web.sh >/dev/null
      - name: Cài Playwright
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.50.1
          npx playwright install --with-deps ${{ matrix.device == 'webkit' && 'webkit' || 'chromium' }} >/dev/null
      - name: Chặn lexkite.com (0 lượt chạm prod)
        run: echo "127.0.0.1 lexkite.com www.lexkite.com audio.lexkite.com media.lexkite.com" | sudo tee -a /etc/hosts >/dev/null
      - name: Đo cuộn ${{ matrix.device }}
        run: node scripts/test/scroll-perf.mjs --root dist --device ${{ matrix.device }} --out sp-out
      - name: A/B không blur (chỉ số đo, không chặn)
        if: ${{ matrix.device != 'desktop' && !cancelled() }}
        continue-on-error: true
        run: node scripts/test/scroll-perf.mjs --root dist --device ${{ matrix.device }} --themes light --only today,practice,me,stats,library,reading,review-hub --variant noblur --out sp-out
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: 'scroll-perf-${{ matrix.device }}', path: sp-out, retention-days: 14 }
