# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🧈 Cuộn mượt: cử chỉ cuộn thật qua các màn học chính (điện thoại 390 px CPU 4× · máy tính · WebKit), tối + sáng; đo khung rớt, task dài, CLS, xê dịch – docs/PERF-SCROLL.md
# ci-policy: matrix – đo FPS/jank từng máy × theme phải tách runner (chạy chung 1 máy làm số đo nhiễu); mỗi nhánh 6–10 phút đo thật, setup chỉ ~45 s
# Hermetic: dist cục bộ, ?sandbox=1&demo=1, /api/* = {}, host ngoài = rỗng → 0 tài khoản thật. Đỏ khi vượt scroll-perf.budget.json (ngưỡng chỉ siết).
name: Scroll perf
on:
  pull_request:
    paths: ['web/js/**', 'web/css/**', 'web/app/**', 'scripts/test/scroll-perf.mjs', 'scripts/test/scroll-perf.budget.json', '.github/workflows/scroll-perf.yml']
  push:
    branches: ['scroll-perf-*']
    paths: ['web/js/**', 'web/css/**', 'web/app/**', 'scripts/test/scroll-perf.mjs', 'scripts/test/scroll-perf.budget.json', '.github/workflows/scroll-perf.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # fast-lane: huỷ lượt nặng khi npm test cùng sha đã đỏ (docs/CI-RUNNERS.md › Máy gác)
  checks: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha → go=$go"
  measure:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [phone, desktop, webkit]
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/fast-lane   # làn nhanh: npm test đỏ → huỷ lượt nặng
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dựng dist
        run: |
          npm ci --no-audit --no-fund
          bash scripts/build-web.sh >/dev/null
      - name: Cài Playwright
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.50.1
          bash scripts/ci/pw-install.sh --with-deps ${{ matrix.device == 'webkit' && 'webkit' || 'chromium' }}
      - name: Chặn lexkite.com (0 lượt chạm prod)
        run: echo "127.0.0.1 lexkite.com www.lexkite.com audio.lexkite.com media.lexkite.com" | sudo tee -a /etc/hosts >/dev/null
      - name: Đo cuộn ${{ matrix.device }}
        run: node scripts/test/scroll-perf.mjs --root dist --device ${{ matrix.device }} --themes ${{ matrix.theme }} --out sp-out --check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: 'scroll-perf-${{ matrix.device }}-${{ matrix.theme }}', path: sp-out, retention-days: 14 }
