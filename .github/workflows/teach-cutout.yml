# 👩‍🏫 Tách nền giáo viên cho app (scripts/teacher/cutout.py) – BiRefNet-matting + pymatting, 0 credit, CPU. docs/TEACHER-IN-APP.md §5.5
# Ra artifact teach-cutout-<who>: loop-a.mp4 (stacked alpha) + poster.webp + ảnh đại diện 192/96 + qa + sheet → kéo về, commit. Tự đỏ khi QA mép/nền/nhấp nháy trượt.
name: Tách nền giáo viên (sprite app)
on:
  push:
    branches: ['teach-cutout*']
    paths: ['scripts/teacher/cutout.py', '.github/workflows/teach-cutout.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: [{ who: ama, pf: 0 }, { who: carlos, pf: 6 }]   # khung poster mắt mở (Carlos khung 0 đang chớp mắt)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with: { path: ~/.cache/pip, key: teach-cutout-pip-v1 }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: teach-cutout-hf-v1 }
      - name: Deps (MIT / Apache-2.0 / BSD only)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          pip install -q transformers==4.46.3 timm==1.0.11 kornia==0.7.4 einops==0.8.0 pymatting==1.1.13 numpy==2.1.3 pillow==11.0.0
      - name: Cutout ${{ matrix.who }}
        run: python3 scripts/teacher/cutout.py ${{ matrix.who }} out --poster-frame ${{ matrix.pf }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'teach-cutout-${{ matrix.who }}', path: out, retention-days: 14 }
