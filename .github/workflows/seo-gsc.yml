# 🔎 Vòng dữ liệu Google Search Console – thứ Hai 07:00 VN, TRƯỚC lượt viết blog hằng tuần (9h).
# scripts/seo/gsc.mjs kéo 28 ngày (query × page × country) của sc-domain:lexkite.com → reports/seo/gsc-<ngày>.{json,md}
# + content/blog/plan/gsc-priority.json → commit [CF-Pages-Skip] (Cloudflare không build lại) → mở/cập nhật issue nhãn seo-weekly.
# Secret: GSC_SA_JSON (khoá JSON service account, quyền Restricted trong GSC) – chỉ truyền qua env, không ghi ra đĩa.
# Thiếu secret → cảnh báo + hướng dẫn, xanh, không commit. Token lỗi / 0 dòng → đỏ. Hướng dẫn 1 lần: docs/BLOG-RUNBOOK.md.
# + scripts/seo/index-coverage.mjs: độ phủ index thật (URL Inspection ≤ 400 URL/tuần, ≤ 9 phút) + máy gác tụt (index/click/trang có hiển thị ≥ 25 %, báo cáo > 9 ngày) → đỏ.
# Hạn mức: < 10 lượt API/tuần searchAnalytics + ≤ 400 URL Inspection (trần 2.000/ngày) (trần 1.200/phút/site, 30 triệu/ngày/dự án) · ~1 phút GitHub.
name: SEO GSC weekly
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: seo-gsc
  cancel-in-progress: false
jobs:
  gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ssh-key: '${{ secrets.BOT_DEPLOY_KEY }}' }   # đẩy main qua SSH khoá deploy (ruleset) – docs/CI-RUNNERS.md › required-gate
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test (dữ liệu giả)
        run: node scripts/test/gsc.mjs && node scripts/test/index-coverage.mjs
      - name: Kéo GSC + phân tích
        id: gsc
        env: { GSC_SA_JSON: '${{ secrets.GSC_SA_JSON }}', STUDIO_CALLBACK_SECRET: '${{ secrets.STUDIO_CALLBACK_SECRET }}', LEXKITE_CI_HEADER: '${{ secrets.LEXKITE_CI_HEADER }}' }   # 2 khoá sau: số khách từ tìm kiếm (/api/seo-visits); thiếu → bỏ phần đó
        run: node scripts/seo/gsc.mjs
      - name: Độ phủ chỉ mục (URL Inspection, mẫu 400 URL, ≤ 9 phút) + máy gác tụt index/click/báo cáo cũ
        id: idx
        if: always()
        env: { GSC_SA_JSON: '${{ secrets.GSC_SA_JSON }}' }
        run: node scripts/seo/index-coverage.mjs || echo "alert=1" >> "$GITHUB_OUTPUT"
      - name: Commit báo cáo [CF-Pages-Skip]
        if: always() && (steps.gsc.outputs.report != '' || hashFiles('reports/seo/index-*.md') != '')
        run: |
          bash scripts/ci/push-main.sh "SEO: báo cáo GSC $(date -u +%F)" reports/seo content/blog/plan/gsc-priority.json
      - name: Issue seo-weekly
        if: steps.gsc.outputs.report != ''
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: node scripts/seo/gsc.mjs --issue "${{ steps.gsc.outputs.report }}"
      - name: Tóm tắt
        if: steps.gsc.outputs.report != ''
        run: cat "${{ steps.gsc.outputs.report }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Máy gác SEO đỏ → ci-triage mở issue
        if: always() && steps.idx.outputs.alert == '1'
        run: |
          echo "::error title=SEO tụt::xem reports/seo/index-*.md mục Máy gác"
          exit 1
      - name: Kiểm site thật (mẫu 3 URL/sitemap – canonical, hreflang, noindex, 404) – đỏ → ci-triage mở issue
        if: always()
        run: node scripts/seo/live-audit.mjs | tee -a "$GITHUB_STEP_SUMMARY"
