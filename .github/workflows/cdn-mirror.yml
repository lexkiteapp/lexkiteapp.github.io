# Chép kho media GitHub → R2 cho media.lexkite.com + audio.lexkite.com phục vụ TĨNH (0 lượt Workers – docs/CAPACITY.md §A4, scripts/cdn/).
# Tăng dần theo sổ _mirror/manifest.json trong bucket: lượt thường chỉ clone thưa (vài MB) + đẩy tệp mới; lượt đầu ~88k tệp / ~2,3 GB.
# Xong ghi _mirror/status.json → cổng của scripts/cdn/cutover.mjs switch. Đỏ khi: lỗi đẩy, mẫu kiểm lệch, nguồn 0 khoá.
# Secret R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY (S3 từ token có Workers R2 Storage Edit) – thiếu: lịch bỏ qua trung tính, chạy tay thì đỏ.
name: cdn-mirror
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      host: { description: 'media | audio | all', default: all }
      max: { description: 'tối đa tệp/lượt (0 = hết)', default: '0' }
concurrency: { group: cdn-mirror, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Có secret R2?
        id: gate
        env: { K: '${{ secrets.R2_ACCESS_KEY_ID }}' }
        run: |
          if [ -n "$K" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then echo "::notice::cdn-mirror: chưa có secret R2_* – bỏ qua"; echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::error::thiếu secret R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY"; exit 1
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == '1'
        with: { sparse-checkout: "scripts\ninfra", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == '1'
        with: { node-version: '24' }
      - name: Đồng bộ
        if: steps.gate.outputs.ok == '1'
        env:
          R2_ACCESS_KEY_ID: '${{ secrets.R2_ACCESS_KEY_ID }}'
          R2_SECRET_ACCESS_KEY: '${{ secrets.R2_SECRET_ACCESS_KEY }}'
          GH_TOKEN: '${{ github.token }}'
        run: node scripts/cdn/mirror.mjs --host "${{ inputs.host || 'all' }}" --max "${{ inputs.max || '0' }}"
