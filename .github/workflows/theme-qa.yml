# Nút giao diện Sáng/Tối/Tự động trên trang tĩnh ngoài app (landing, pháp lý, 404, blog, công cụ, SEO, từ điển, uy tín, video) – Chromium thật × 4 chế độ:
# đúng data-theme, không nháy sáng, tương phản AA 0 lỗi, nút vòng/lưu/44 px, không tràn @360. Ảnh 390 px ở artifact theme-shots (cho chủ duyệt).
# Kiểm tĩnh (chống nháy/luật CSS/nhãn 15 ngôn ngữ) chạy trong npm test + build-web.sh: scripts/test/theme-switch.mjs.
name: Giao diện sáng/tối trang tĩnh
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/lib/site-layout.mjs', 'scripts/build-blog.mjs', 'scripts/build-landing.mjs', 'scripts/build-legal.mjs', 'scripts/build-tools.mjs', 'scripts/build-seo-pages.mjs', 'scripts/build-authority.mjs', 'scripts/build-video-pages.mjs', 'scripts/build-samples*.mjs', 'web/*.html', 'web/*/index.html', 'web/*/privacy.html', 'web/*/terms.html', 'brand/tokens.json', 'scripts/test/theme-*.mjs', '.github/workflows/theme-qa.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Dựng dist (mọi trang tĩnh)
        run: bash scripts/build-web.sh
      - timeout-minutes: 8
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install chromium
          sudo timeout 300 apt-get -o DPkg::Lock::Timeout=120 install -y -qq fonts-noto-cjk fonts-noto-core >/dev/null || true
      - name: Kiểm sáng + tối
        run: node scripts/test/theme-static.mjs dist --shots theme-shots
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: theme-shots, path: theme-shots/, retention-days: 14, if-no-files-found: ignore }
