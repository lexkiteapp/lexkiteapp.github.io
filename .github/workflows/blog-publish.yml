# Tự đăng blog: mỗi 3 giờ (phút 7, trùng khung cron pages-deploy) kiểm bài đến giờ trong 3 giờ qua – 151 giờ đăng khác nhau/tháng 11 nếu mỗi giờ 1 build > trần 500 build → yêu cầu pages-deploy.yml (1 build cho cả khung) → báo IndexNow
# → ping WebSub cho RSS từng ngôn ngữ → ghi sổ băm nội dung (content/protection/registry.jsonl, bằng chứng tác quyền)
# → Wayback → OpenTimestamps (content/protection/ots/<hash>.ots, không chặn) + commit.
# Commit sổ có [CF-Pages-Skip] (Cloudflare không build lại). Header X-Lexkite-CI (secret LEXKITE_CI_HEADER) để qua WAF – docs/CONTENT-PROTECTION.md.
# Không có bài đến hạn → không làm gì (không tốn lượt build). Bài cùng khung giờ (--since 70) gom vào 1 deploy, gọi qua pages-deploy.yml (urgent, docs/FREE-TIER.md §7).
name: Blog publish
on:
  schedule:
    - cron: '7 */3 * * *'   # gom: ≤ 8 build blog/ngày (docs/FREE-TIER.md §7)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build lại site dù không có bài đến hạn'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write   # gọi pages-deploy.yml
concurrency:
  group: blog-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ssh-key: '${{ secrets.BOT_DEPLOY_KEY }}' }   # đẩy main qua SSH khoá deploy (ruleset) – docs/CI-RUNNERS.md › required-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bài đến hạn
        id: due
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # Cron GitHub hay bị bỏ lượt (11/2026: ~3–4/8 lượt chạy mỗi ngày) → cửa sổ cố định 190 phút làm rơi bài của lượt bị bỏ (mất IndexNow/WebSub).
          # Cửa sổ = từ lần chạy THÀNH CÔNG trước tới nay (+10 phút đệm), tối thiểu 190, tối đa 1.440 phút – liền mạch, không rơi bài.
          last=$(gh run list --workflow blog-publish.yml --status success --limit 1 --json createdAt -q '.[0].createdAt' 2>/dev/null || true)
          since=190
          if [ -n "$last" ]; then
            gap=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 60 + 10 ))
            [ "$gap" -gt "$since" ] && since=$gap
            [ "$since" -gt 1440 ] && since=1440
          fi
          echo "cửa sổ: $since phút (lần chạy xanh trước: ${last:-không rõ})"
          node scripts/blog-due.mjs --since "$since" > due.txt
          cat due.txt
          echo "count=$(grep -c '^https://' due.txt || true)" >> "$GITHUB_OUTPUT"
      - name: Yêu cầu deploy Pages (1 lần cho mọi bài trong khung giờ)
        if: steps.due.outputs.count != '0' || inputs.force
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          bash scripts/ci/gh-retry.sh gh workflow run pages-deploy.yml --ref main -f urgent=true -f quiet=0 -f force=${{ inputs.force || false }} -f reason="blog-publish ${{ steps.due.outputs.count }} bài"
          echo "✓ đã yêu cầu deploy – chờ build (~6 phút) rồi mới báo IndexNow"
          sleep 420
      - name: IndexNow
        if: steps.due.outputs.count != '0' || inputs.force
        run: node scripts/indexnow.mjs < due.txt
      - name: WebSub (PubSubHubbub) cho RSS các ngôn ngữ có bài mới
        if: steps.due.outputs.count != '0' || inputs.force
        continue-on-error: true
        run: node scripts/websub-ping.mjs < due.txt
      - name: Sổ băm nội dung (bằng chứng tác quyền)
        if: steps.due.outputs.count != '0'
        continue-on-error: true
        env:
          LEXKITE_CI_HEADER: ${{ secrets.LEXKITE_CI_HEADER }}
        run: node scripts/content-registry.mjs record --wait 600 < due.txt
      - name: Wayback Machine (bằng chứng thời gian bên thứ ba)
        if: steps.due.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/wayback-snapshot.mjs < due.txt
      - uses: actions/setup-python@v5
        if: steps.due.outputs.count != '0'
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: OpenTimestamps (dấu thời gian neo Bitcoin, miễn phí – không chặn đăng bài)
        if: steps.due.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python -m pip install --quiet --disable-pip-version-check opentimestamps-client || { echo "::warning::Không cài được opentimestamps-client – bỏ qua đóng dấu, lần sau thử lại"; exit 0; }
          node scripts/ots.mjs stamp || echo "::warning::ots stamp lỗi – lần chạy sau thử lại"
          node scripts/ots.mjs upgrade || echo "::warning::ots upgrade lỗi – lần chạy sau thử lại"
      - name: Commit sổ đăng ký
        if: steps.due.outputs.count != '0'
        run: |
          node scripts/content-registry.mjs verify
          # sổ băm nối thêm: sinh lại trên main mới nhất (record bỏ qua mục đã có) – scripts/ci/commit-regen.sh
          COMMIT_REGEN_NO_EXT=1 bash scripts/ci/commit-regen.sh "Registry: băm bài vừa đăng $(date -u +%FT%H:%MZ)" 'node scripts/content-registry.mjs record --wait 120 < due.txt || true; node scripts/ots.mjs stamp || true; node scripts/ots.mjs upgrade || true; node scripts/content-registry.mjs verify' content/protection/registry.jsonl content/protection/ots
