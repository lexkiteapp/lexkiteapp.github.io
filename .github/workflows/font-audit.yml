# Rà font chữ web/app/add-on từng phần trên Chromium thật – 2 job song song: "app" (nặng nhất, ~3 phút) và "site" (static, landing, legal, admin,
# blog, ext chạy nối tiếp trong 1 job). 05/11: trước là 7 job/commit, 6 job < 90 s = 20 % số job PR khởi động trong hàng chờ 40 runner;
# gộp giữ NGUYÊN mọi phần + --strict, phần nào đỏ thì job đỏ (chạy hết các phần rồi mới báo). Kết quả ở Summary + artifact font-<nhóm>.
# Lỗi (chữ SVG kéo méo, lọt Times, nút không kế thừa font) làm đỏ PR; cảnh báo chỉ báo cáo.
name: Font audit
on:
  workflow_dispatch:
    inputs:
      part: { description: 'Phần: all | static | landing | legal | app | admin | blog | ext', required: false, default: 'all' }
  pull_request:
    paths: ['web/css/**', 'web/js/**', 'web/**/*.html', 'extension/**/*.css', 'extension/**/*.html', 'scripts/test/font-audit.mjs', 'scripts/lib/qa-classify.mjs', 'scripts/build-blog.mjs', 'scripts/lib/site-layout.mjs', '.github/workflows/font-audit.yml']
  schedule:
    - cron: '20 2 * * 1'   # thứ Hai 09:20 giờ Việt Nam
permissions:
  contents: read
concurrency:
  group: font-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: audit (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON((github.event.inputs.part && github.event.inputs.part != 'all') && format('[{{"name":"{0}","parts":"{0}"}}]', github.event.inputs.part) || '[{"name":"site","parts":"static landing legal admin blog ext"},{"name":"app","parts":"app"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: matrix.group.parts != 'static'
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh chromium   # không --with-deps: runner đã có thư viện của Chrome; apt hay kẹt khoá do cập nhật nền
          sudo timeout 300 apt-get -o DPkg::Lock::Timeout=120 install -y -qq fonts-noto-cjk fonts-noto-core >/dev/null || true
      - if: contains(format(' {0} ', matrix.group.parts), ' blog ')
        run: node scripts/build-blog.mjs
      - name: Kiểm ${{ matrix.group.parts }}
        env: { PARTS: '${{ matrix.group.parts }}' }
        run: |
          rc=0; bad=''
          for p in $PARTS; do
            echo "::group::font-audit $p"
            node scripts/test/font-audit.mjs "$p" --strict || { rc=1; bad="$bad $p"; }
            echo "::endgroup::"
          done
          [ $rc -eq 0 ] || echo "::error::font-audit đỏ ở phần:$bad"
          exit $rc
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-${{ matrix.group.name }}
          path: font-report/
          retention-days: 14
          if-no-files-found: ignore
