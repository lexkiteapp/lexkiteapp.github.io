# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🧩 Ảnh trước/sau + cổng khung bài tập chung (Ghép cặp, Xếp câu, Chọn từ, Gõ): 390 px + máy tính, sáng + tối – scripts/test/exercise-shots.mjs.
name: Exercise shots
on:
  workflow_dispatch:
  pull_request:
    paths: ['web/js/lesson/**', 'web/cpack/st/v2/ex-*.js', 'web/cpack/lesson/ex.js', 'web/js/st/lesson.js', 'web/css/st-v2-ex-*.css', 'scripts/test/exercise-shots.mjs', '.github/workflows/exercise-shots.yml']
  push:
    branches: [main]
    paths: ['web/js/lesson/**', 'web/cpack/st/v2/ex-*.js', 'web/cpack/lesson/ex.js', 'web/js/st/lesson.js', 'web/css/st-v2-ex-*.css', 'scripts/test/exercise-shots.mjs', '.github/workflows/exercise-shots.yml']
permissions:
  contents: read
  actions: write   # fast-lane: huỷ lượt nặng khi npm test cùng sha đã đỏ
  checks: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    # luật 18 (CI làn nhanh, 16/11): PR chỉ chờ làn nhanh – việc nặng bỏ qua trên PR, chạy SAU gộp trên push main; nhãn ready-heavy/ready = chạy nặng ngay trên PR
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-heavy') || contains(github.event.pull_request.labels.*.name, 'ready') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha → go=$go"
  shots:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/fast-lane   # làn nhanh: npm test đỏ → huỷ lượt nặng
      - uses: ./.github/actions/no-prod
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ./.github/actions/playwright-cache
        with: { browsers: '--with-deps chromium' }
      - name: Chụp + chấm
        timeout-minutes: 15
        env: { BASE: "${{ github.event.pull_request.base.sha }}" }
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
          B=""
          if [ -n "$BASE" ]; then git worktree add -q /tmp/before "$(git merge-base "$BASE" HEAD)"; B=/tmp/before/web; fi
          node scripts/test/exercise-shots.mjs web "$B" out/exercise-shots
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: exercise-shots, path: out/exercise-shots, retention-days: 14 }
