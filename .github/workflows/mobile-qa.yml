# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 📱 Soát web mobile (360/390/412 px): tràn ngang, vùng chạm ≥ 44 px, safe-area, bàn phím ảo che ô nhập, CLS/INP (CPU 4×), Lighthouse mobile LCP/CLS/TBT,
# thẻ kết quả + ô Cơ hội thứ 2/Nhân đôi XP. Đo BẢN PHÁT HÀNH dựng từ web/ của chính commit (như scripts/build-web.sh: app-loader nạp JS sau lần vẽ đầu + esbuild rút gọn; không cần deploy). Ngưỡng: scripts/test/mobile-qa.budget.json (chỉ được GIẢM).
name: Mobile QA
on:
  pull_request:
    branches: [main]
    paths: ['web/app/**', 'web/js/**', 'web/css/**', 'scripts/test/mobile-qa*', 'scripts/test/mobile-nav*', 'scripts/app-loader.mjs', 'scripts/build-hash.mjs', '.github/workflows/mobile-qa.yml']
  push:
    branches: [main]
    paths: ['web/app/**', 'web/js/**', 'web/css/**', 'scripts/test/mobile-qa*', 'scripts/test/mobile-nav*', 'scripts/app-loader.mjs', 'scripts/build-hash.mjs', '.github/workflows/mobile-qa.yml']
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1'   # thứ Hai 10:40 giờ Việt Nam
permissions:
  contents: read
  actions: write   # fast-lane: huỷ lượt nặng khi npm test cùng sha đã đỏ (docs/CI-RUNNERS.md › Máy gác)
  checks: read
concurrency:
  group: mobile-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha → go=$go"
  mqa:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/fast-lane   # làn nhanh: npm test đỏ → huỷ lượt nặng
      - uses: ./.github/actions/no-prod
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright
        timeout-minutes: 12
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Soát mobile + Lighthouse
        env: { MQA_LH: '1' }
        run: |
          # Bản giống dist/ mà người dùng tải (scripts/build-web.sh): web/app/index.html giữ <script defer> cho add-on/app di động,
          # bản web nạp JS khung app SAU lần vẽ đầu (app-loader) và rút gọn JS/CSS – đo web/ thô sẽ tính cả 25 file JS vào LCP.
          rm -rf out/site && mkdir -p out && cp -R web out/site && rm -rf out/site/audio
          node scripts/app-loader.mjs out/site/app/index.html && node scripts/app-loader.mjs --check out/site/app/index.html
          node scripts/lexicon/shards.mjs --out out/site  # mảnh kho từ + data/lex-index.json như dist/ – thiếu thì #/dict chạy nhánh dev nạp ~750 KB danh sách từ → LCP chập chờn ~10 s (02/11)
          (cd web && npx -y esbuild@0.24.0 $(find js css cpack sw.js -type f \( -name '*.js' -o -name '*.css' \) | sort) --minify --charset=utf8 --log-level=warning --outdir=../out/site --outbase=. --allow-overwrite)
          node scripts/build-cpack.mjs out/site  # gói nội dung /cpack như dist/ (băm tên + sửa tham chiếu), sau minify – mqa-parity bắt thiếu
          node scripts/build-hash.mjs out/site  # JS/CSS bản /h/ theo mã băm như dist/ (sau cpack)
          (node scripts/test/serve-web.mjs out/site 8080 >/dev/null 2>&1 &) ; sleep 1
          node scripts/test/mobile-qa.mjs http://localhost:8080 out/mobile-qa
      - name: Bàn phím ảo không che ô đang nhập (visualViewport iOS/Chrome + adjustResize Android)
        if: ${{ !cancelled() }}
        run: |
          # cùng bản dựng out/site + máy chủ của bước trên; Phòng viết, tra từ (#q, #gq + gợi ý), ô điền chữ… – scripts/test/mobile-qa-keyboard.mjs
          curl -fsS -o /dev/null http://localhost:8080/app/ || { (node scripts/test/serve-web.mjs out/site 8080 >/dev/null 2>&1 &) ; sleep 1; }
          node scripts/test/mobile-qa-keyboard.mjs http://localhost:8080 out/mobile-qa
      - name: Chạm tab Tôi (Cá nhân) 375×812 sáng/tối + IndexedDB treo
        if: ${{ !cancelled() }}
        run: |
          curl -sf -o /dev/null http://localhost:8080/app/ || { (node scripts/test/serve-web.mjs out/site 8080 >/dev/null 2>&1 &) ; sleep 1; }
          bash scripts/ci/pw-install.sh --with-deps webkit
          MNAV_BROWSERS=chromium,webkit node scripts/test/mobile-nav.mjs http://localhost:8080 out/mobile-qa/nav
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: mobile-qa, path: out/mobile-qa, retention-days: 7 }
