# 📱 Soát web mobile (360/390/412 px): tràn ngang, vùng chạm ≥ 44 px, safe-area, bàn phím ảo che ô nhập, CLS/INP (CPU 4×), Lighthouse mobile LCP/CLS/TBT,
# thẻ kết quả + ô Cơ hội thứ 2/Nhân đôi XP. Phục vụ thư mục web/ của chính commit (không cần deploy). Ngưỡng: scripts/test/mobile-qa.budget.json (chỉ được GIẢM).
name: Mobile QA
on:
  pull_request:
    branches: [main]
    paths: ['web/app/**', 'web/js/**', 'web/css/**', 'scripts/test/mobile-qa*', '.github/workflows/mobile-qa.yml']
  push:
    branches: [main]
    paths: ['web/app/**', 'web/js/**', 'web/css/**', 'scripts/test/mobile-qa*', '.github/workflows/mobile-qa.yml']
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1'   # thứ Hai 10:40 giờ Việt Nam
permissions:
  contents: read
concurrency:
  group: mobile-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mqa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Soát mobile + Lighthouse
        env: { MQA_LH: '1' }
        run: |
          (cd web && python3 -m http.server 8080 >/dev/null 2>&1 &) ; sleep 1
          node scripts/test/mobile-qa.mjs http://localhost:8080 out/mobile-qa
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: mobile-qa, path: out/mobile-qa, retention-days: 7 }
  # TẠM (gỡ trước khi merge): soát ô Cơ hội thứ 2/x2 XP trên nhánh PR #130 claude/ads-pro
  adspro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          git fetch -q origin claude/ads-pro && git worktree add -q /tmp/ap FETCH_HEAD
          npm i --no-save --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium
          (cd /tmp/ap/web && python3 -m http.server 8081 >/dev/null 2>&1 &) ; sleep 1
          MQA_WEB=/tmp/ap/web MQA_REPORT_ONLY=1 node scripts/test/mobile-qa.mjs http://localhost:8081 out/adspro
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: mobile-qa-adspro, path: out/adspro, retention-days: 7 }
