# Máy gác 2/4 (23/11, docs/CI-RUNNERS.md › Máy gác main đỏ): hai PR riêng xanh, GHÉP vào main vẫn vượt ngân sách (4b25693 + 49c55e6 vượt 220 B). Trước khi required-gate cho xanh,
# workflow này GHÉP main hiện tại vào đầu PR (không commit) rồi chạy check rẻ (scripts/ci/cheap.mjs) và ghi commit status `merge-recheck` + "main@<8>".
# Do required-gate dispatch (scripts/ci/required-gate.mjs › recheck) và merge-window-pr.sh; KHÔNG chạy trên PR. Chỉ PR cùng repo. Bước chạy mã PR KHÔNG có token.
name: merge-recheck
run-name: merge-recheck ${{ inputs.sha }} ${{ inputs.main }}
on:
  workflow_dispatch:
    inputs:
      sha: { description: 'sha đầu PR (cùng repo)', required: true }
      main: { description: 'sha main để ghép', required: true }
permissions:
  contents: read
  statuses: write
concurrency:
  group: merge-recheck-${{ inputs.sha }}
  cancel-in-progress: true
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Mã đo lấy từ main (không tin mã của PR)
        run: |
          git fetch --no-tags origin main
          git show "${{ inputs.main }}:scripts/ci/cheap.mjs" > "$RUNNER_TEMP/cheap.mjs"
      - name: Ghép main vào đầu PR (không commit) rồi chạy check rẻ (không token)
        env: { MAIN: '${{ inputs.main }}' }
        run: |
          git config user.name lexkite-bot; git config user.email lexkite-bot@users.noreply.github.com
          git merge --no-commit --no-ff "$MAIN" || { echo "xung đột khi ghép main – PR phải gộp main (không đo được)"; echo '{"results":[{"id":"xung-đột-ghép","ok":false}]}' > "$RUNNER_TEMP/result.json"; exit 0; }
          npm ci --no-audit --no-fund
          node "$RUNNER_TEMP/cheap.mjs" run --out "$RUNNER_TEMP/result.json" || true
      - name: Ghi commit status merge-recheck
        if: always()
        env: { GITHUB_TOKEN: '${{ github.token }}', GITHUB_REPOSITORY: '${{ github.repository }}', SHA: '${{ inputs.sha }}', MAIN: '${{ inputs.main }}' }
        run: node "$RUNNER_TEMP/cheap.mjs" post --sha "$SHA" --main "$MAIN" --result "$RUNNER_TEMP/result.json"
