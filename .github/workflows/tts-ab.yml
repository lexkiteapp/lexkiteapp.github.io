# Phép thử A/B giọng Kokoro ↔ ElevenLabs (docs/TTS-AB.md) – chỉ chạy tay, KHÔNG đụng sản xuất (không đẩy kho media, không commit).
# Thứ tự theo docs/CREDIT-RULES.md: dryrun (0 credit) → kokoro (0 credit) → pilot (~300 ký tự) → soát → batch. Trần cứng: input max_credits
# + APPROVED_TOTAL trong scripts/tts-ab/eleven.py; 2 lỗi liên tiếp → dừng. Audio ElevenLabs gói free = phi thương mại → chỉ để nghe thử.
# Chỉ workflow_dispatch nên không cần bộ lọc paths.
name: TTS A/B (Kokoro vs ElevenLabs)
on:
  workflow_dispatch:
    inputs:
      phase: { description: 'dryrun | kokoro | pilot | batch', default: 'dryrun' }
      max_credits: { description: 'Trần credit ElevenLabs của lượt này (pilot ≤ 400, batch ≤ 7500)', default: '0' }
      el_speed: { description: 'ElevenLabs voice_settings.speed (0.7–1.2)', default: '0.9' }
      reuse_runs: { description: 'ID các lượt trước (cách nhau dấu phẩy) – gộp audio đã có, không render/tiêu lại', default: '' }
permissions: { contents: read, actions: read }
concurrency: { group: tts-ab, cancel-in-progress: false }
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { PHASE: '${{ github.event.inputs.phase }}', CAP: '${{ github.event.inputs.max_credits }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Kiểm input
        run: |
          case "$PHASE" in dryrun|kokoro|pilot|batch) ;; *) echo "phase lạ: $PHASE"; exit 1;; esac
          [[ "$CAP" =~ ^[0-9]+$ ]] || { echo "max_credits phải là số"; exit 1; }
          if [ "$PHASE" = pilot ] && [ "$CAP" -gt 400 ]; then echo "pilot: max_credits ≤ 400"; exit 1; fi
          if [ "$PHASE" = batch ] && [ "$CAP" -gt 7500 ]; then echo "batch: max_credits ≤ 7500"; exit 1; fi
      - name: Bộ câu + kế hoạch credit (dry-run, 0 credit)
        env: { ELEVENLABS_API_KEY: '${{ secrets.ELEVENLABS_API_KEY }}' }
        run: node scripts/tts-ab/texts.mjs && python3 scripts/tts-ab/eleven.py --phase dryrun
      - name: Gộp audio của các lượt trước
        if: github.event.inputs.reuse_runs != ''
        env: { GH_TOKEN: '${{ github.token }}', RUNS: '${{ github.event.inputs.reuse_runs }}' }
        run: for r in ${RUNS//,/ }; do gh run download "$r" -n tts-ab-audio-$r -D .tts-ab/audio; done; ls .tts-ab/audio
      - name: Cài ffmpeg + kokoro-js
        if: env.PHASE != 'dryrun'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          [ "$PHASE" = kokoro ] && npm i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1 >/dev/null || true
      - uses: actions/cache@v4
        if: env.PHASE == 'kokoro'
        with: { path: /tmp/kk/node_modules/@huggingface/transformers/.cache, key: kokoro-82m-v1-q8 }
      - name: Render Kokoro (0 credit, giọng + tốc độ như sản xuất)
        if: env.PHASE == 'kokoro'
        run: KOKORO_DTYPE=q8 NODE_PATH=/tmp/kk/node_modules node scripts/tts-ab/kokoro.mjs
      - name: Render ElevenLabs (trần ${{ github.event.inputs.max_credits }} credit)
        if: env.PHASE == 'pilot' || env.PHASE == 'batch'
        env: { ELEVENLABS_API_KEY: '${{ secrets.ELEVENLABS_API_KEY }}', LX_EL_SPEED: '${{ github.event.inputs.el_speed }}' }
        run: |
          [ -n "$ELEVENLABS_API_KEY" ] || { echo "Chưa có secret ELEVENLABS_API_KEY"; exit 1; }
          python3 scripts/tts-ab/eleven.py --phase "$PHASE" --cap "$CAP" --speed "$LX_EL_SPEED"
      - uses: actions/upload-artifact@v4
        if: always() && env.PHASE != 'dryrun'
        with: { name: 'tts-ab-audio-${{ github.run_id }}', path: .tts-ab/audio/, retention-days: 30, include-hidden-files: true }
      - name: Cài faster-whisper + Rhubarb (chấm)
        if: env.PHASE != 'dryrun'
        # như sentence-audio-asr.yml (PyAV < 19) và news-voice.yml (Rhubarb 1.13.0)
        run: |
          pip install -q 'faster-whisper==1.2.1' 'av==18.1.0' 'whisper-normalizer==0.1.12' 'numpy==2.1.3'
          curl -fsSL -o /tmp/rh.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip && mkdir -p /tmp/rh && unzip -q /tmp/rh.zip -d /tmp/rh
          R=$(find /tmp/rh -type f -name rhubarb | head -1); chmod +x "$R"; echo "RHUBARB=$R" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: env.PHASE != 'dryrun'
        with: { path: ~/.cache/huggingface, key: whisper-small-en-ct2 }
      - name: Chấm (WER, nhịp, độ to, clipping, khẩu hình, độ trễ)
        if: env.PHASE != 'dryrun'
        run: python3 scripts/tts-ab/score.py
      - uses: actions/upload-artifact@v4
        if: always() && env.PHASE != 'dryrun'
        with: { name: 'tts-ab-score-${{ github.run_id }}', path: '.tts-ab/*.json', retention-days: 30, include-hidden-files: true }
