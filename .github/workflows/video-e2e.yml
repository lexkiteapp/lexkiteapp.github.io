# video-e2e: end-to-end DRY RUN of the news pipeline on every PR that touches it (owner 23/10). 0 credits, ~10 min.
# One fixed script-bank item -> materialize -> voice (Kokoro + Rhubarb + whisper) -> mocked AI gates (NEWS_AI_MOCK=1) -> preflight ->
# render in sample mode (1 composited frame per shot, no x2 SR) -> qa_news + layout QA + qc_gate (reports, not gating) -> store into a scratch
# lexkite-shorts checkout (no push) -> ledger record + summary. FAILS if any step crashes or an expected artifact is missing.
name: video-e2e
on:
  pull_request:
    paths: ['scripts/cine/**', 'scripts/video/matte_refine.py', 'scripts/footage/**', '.github/workflows/cine-render.yml', '.github/workflows/news-auto.yml', '.github/workflows/video-e2e.yml', 'content/video/cine/news/**']
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: 'video-e2e-${{ github.ref }}', cancel-in-progress: true }
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SID: sb_068cf065
      CINE_ROOT: ${{ github.workspace }}
      CINE_OUT: ${{ github.workspace }}/out
      CINE_LIB: ${{ github.workspace }}/footage
      NEWS_DIR: ${{ github.workspace }}/newswork
      NEWS_MATTE: pro
      NEWS_AI_MOCK: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Secrets available?
        id: s
        env: { KEY: '${{ secrets.FOOTAGE_DEPLOY_KEY }}' }
        run: if [ -n "$KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; echo "::warning::no footage key (fork PR) - e2e skipped"; fi
      - uses: actions/setup-python@v5
        if: steps.s.outputs.ok == '1'
        with: { python-version: '3.12', cache: pip, cache-dependency-path: scripts/cine/requirements.txt }
      - uses: actions/setup-node@v4
        if: steps.s.outputs.ok == '1'
        with: { node-version: 20 }
      - uses: actions/cache@v4
        if: steps.s.outputs.ok == '1'
        with: { path: /tmp/kk/node_modules/@huggingface/transformers/.cache, key: video-models-kokoro82m-q8-cine-v1 }
      - name: Tools
        if: steps.s.outputs.ok == '1'
        run: |
          pip install -q -r scripts/cine/requirements.txt scipy==1.14.1 faster-whisper==1.0.3 requests==2.32.3
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr >/dev/null
          npm i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1 >/dev/null
          curl -fsSL -m 120 -o /tmp/rh.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip && mkdir -p /tmp/rh && unzip -q /tmp/rh.zip -d /tmp/rh
          R=$(find /tmp/rh -type f -name rhubarb | head -1); chmod +x "$R"; echo "RHUBARB=$R" >> "$GITHUB_ENV"; echo "KOKORO_NODE_PATH=/tmp/kk/node_modules" >> "$GITHUB_ENV"
      - name: 1-3 pick + materialize (bank -> lesson)
        if: steps.s.outputs.ok == '1'
        run: |
          python3 scripts/cine/news_auto.py pick --ledger /tmp/l0.json --n 2 | grep -q '^bank:' || { echo "::error::pick returned nothing"; exit 1; }
          LID=$(python3 scripts/cine/news_auto.py materialize "bank:$SID"); [ -n "$LID" ] && [ -f "content/video/cine/news/$LID.json" ] || { echo "::error::materialize failed"; exit 1; }
          [ "$(python3 scripts/cine/news_auto.py materialize "bank:$SID")" = "$LID" ] || { echo "::error::materialize is not idempotent"; exit 1; }
          echo "LID=$LID" >> "$GITHUB_ENV"
      - name: Footage (sparse, hard timeout)
        if: steps.s.outputs.ok == '1'
        env: { KEY: '${{ secrets.FOOTAGE_DEPLOY_KEY }}' }
        run: |
          BG=$(python3 -c "import json;print(json.load(open('content/video/cine/news/$LID.json'))['bg'])")
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/footage && chmod 600 ~/.ssh/footage; ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/footage -o IdentitiesOnly=yes"
          timeout 300 git clone -q --depth 1 --filter=blob:none --no-checkout git@github.com:lexkiteapp/lexkite-footage.git footage
          HP=""; for c in ga4_talk_natural gc4_talk_natural gc4_listen; do HP="$HP /anchor/green/kfull_pro/$c.* /anchor/green/kmask_pro/$c.* /anchor/green/kfull/$c.mp4 /anchor/tools/meta/$c/"; done
          git -C footage sparse-checkout set --no-cone $HP "/anchor/bg/w/${BG}_L.webp" "/anchor/bg/w/${BG}_R.webp" "/anchor/bg/w/zones/${BG}_*" '/anchor/bg/index.json' '/anchor/green/bank_gestures.json' '/anchor/tools/fonts/' '/anchor/tools/foley/' '/anchor/tools/amb_studio.wav'
          timeout 900 git -C footage checkout -q; rm -f ~/.ssh/footage; du -sh footage
      - name: 4 voice
        if: steps.s.outputs.ok == '1'
        run: |
          mkdir -p "$NEWS_DIR"/ci "$NEWS_DIR"/lessons out/qa; cp content/video/cine/news/lines.json "$NEWS_DIR/ci/"; cp "content/video/cine/news/$LID.json" "$NEWS_DIR/lessons/"
          timeout 900 python scripts/cine/news_voice.py "$NEWS_DIR" "$LID"
      - name: 5 AI gates (mocked) + preflight
        if: steps.s.outputs.ok == '1'
        run: |
          python scripts/cine/script_judge.py "content/video/cine/news/$LID.json" "$NEWS_DIR/ci/lines.json" "$NEWS_DIR/judge_$LID.json"
          NEWS_PREFLIGHT=1 timeout 900 python scripts/cine/news.py "$LID" > out/qa/pre.log 2>&1 || { tail -20 out/qa/pre.log; exit 1; }
          python scripts/cine/vision_gate.py "$NEWS_DIR/pre_$LID"
      - name: 6 render (sample mode) + seed determinism
        if: steps.s.outputs.ok == '1'
        run: |
          NEWS_SAMPLE=1 timeout 1500 python scripts/cine/news.py "$LID" | tail -5
          RB="render5_${LID}_en"; test -f "$NEWS_DIR/$RB/timeline.json"; ls out/*.mp4
          python3 -c "import json,sys;t=json.load(open('$NEWS_DIR/$RB/timeline.json'));assert t.get('seed'), 'no seed';print('seed', t['seed'])"
          cp out/*.mp4 /tmp/first.mp4; echo "RB=$RB" >> "$GITHUB_ENV"
      - name: 7 QA reports (not gating in sample mode) + qc_gate json
        if: steps.s.outputs.ok == '1'
        run: |
          (cd "$NEWS_DIR" && python "$CINE_ROOT/scripts/cine/qa_news.py" "$RB") > "out/qa/qa_$RB.log" 2>&1 || true; tail -3 "out/qa/qa_$RB.log"
          grep -q "== LAYOUT" "out/qa/qa_$RB.log" && test -f "$NEWS_DIR/$RB/layout_qa.json" && ls out/qa/layout_*.jpg
          (cd "$NEWS_DIR" && python "$CINE_ROOT/scripts/cine/qc_gate.py" "$LID") > out/qa/qcgate.log 2>&1 || true; tail -1 out/qa/qcgate.log; test -f "out/qc/$LID.json"
      - name: 8-9 store (scratch shorts checkout, no push) + ledger
        if: steps.s.outputs.ok == '1'
        run: |
          echo "news $LID $RB" > out/passed.txt; cp "$NEWS_DIR/$RB/timeline.json" "out/qa/timeline_$RB.json"
          mkdir -p /tmp/shorts && git -C /tmp/shorts init -q && python scripts/cine/store_shorts.py out /tmp/shorts 0 "${{ github.sha }}"
          test -f /tmp/shorts/shorts/index.json && grep -q "$LID" /tmp/shorts/shorts/index.json
          L=/tmp/shorts/ledger/news.json; python3 scripts/cine/news_auto.py record --ledger $L --out out --run e2e
          python3 scripts/cine/news_auto.py record --ledger $L --out out --run e2e | grep -q idempotent
          python3 scripts/cine/news_auto.py summary --ledger $L --json /tmp/summary.json; python3 -c "import json;s=json.load(open('/tmp/summary.json'));assert s['total']==1, s"
          python3 -c "import json;p='$L';d=json.load(open(p));d['items']['$SID']['status']='pending_approval';json.dump(d,open(p,'w'))"
          if python3 scripts/cine/news_auto.py pick --ledger $L --n 500 | tr ',' '\n' | grep -qx "bank:$SID"; then echo "::error::ledger re-picked an item waiting for approval"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.s.outputs.ok == '1'
        with: { name: 'video-e2e-${{ github.run_number }}', path: 'out/qa/', retention-days: 5 }
