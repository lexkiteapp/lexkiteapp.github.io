# Máy gác lịch đăng (owner 16/11: mỗi kênh đúng 1 video/ngày, không ngày nào trống): mỗi ngày 1 lượt → POST /api/social-auto op coverage (chỉ đọc D1, 0 lượt GrabCast)
# Trước đó 1 bước lấp lịch YouTube trực tiếp (op fill, clip bản ngữ đạt QC, private + publishAt). → kênh-ngày trống trong 30 ngày tới thì mở/bình luận 1 issue nhãn social-alert. Đăng ký: infra/jobs.json id "social-coverage".
name: social-coverage
on:
  workflow_dispatch:
    inputs:
      probe: { description: 'Phép thử audit YouTube (chủ OK 16/11): queue = đưa 1 clip QC-pass vào hàng tải PUBLIC · status = đọc lại privacy bằng clip bên dưới. Trống = chạy bình thường.', type: choice, options: ['', queue, status], default: '' }
      clip: { description: 'probe=status: id clip', default: '' }
  schedule:
    - cron: '41 3 * * *'
concurrency: { group: social-coverage, cancel-in-progress: false }
permissions: { contents: read, issues: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env: { LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}', GITHUB_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: 'scripts', sparse-checkout-cone-mode: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Phép thử audit YouTube
        if: ${{ inputs.probe != '' }}
        env: { PROBE: '${{ inputs.probe }}', CLIP: '${{ inputs.clip }}' }
        run: node scripts/social/yt-probe.mjs "$PROBE" ${CLIP:+"$CLIP"}
      - name: Lấp lịch YouTube trực tiếp (30 ngày × 1 video/ngày/kênh, clip bản ngữ)
        if: ${{ inputs.probe == '' }}
        run: node scripts/social/yt-fill.mjs
      - name: Kênh-ngày trống trong 30 ngày tới
        if: ${{ inputs.probe == '' }}
        run: node scripts/social/coverage.mjs
