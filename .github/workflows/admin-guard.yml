# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🛡️ Gác bố cục mọi trang quản trị (scripts/test/admin-guard.mjs): khung thật + dữ liệu mẫu, không tài khoản thật. 6 bề rộng × sáng/tối × VI/EN.
# Fail: chồng lấn, bị cắt, tràn ngang, chữ biểu đồ phóng to, cột trống cạnh thanh bên. Artifact admin-guard: sheet-*.jpg (TRƯỚC | SAU) + fail-*.jpg.
name: Admin – gác bố cục
on:
  pull_request:
    paths: ['web/admin.html', 'web/js/admin*.js', 'web/css/admin.css', 'web/css/style.css', 'web/css/lazy-ui.css', 'scripts/test/admin-guard.mjs', 'scripts/lib/layout-scan.mjs', 'scripts/lib/admin-table-scan.mjs', 'scripts/test/fixtures/admin-fx.mjs', '.github/workflows/admin-guard.yml']
  push:
    branches: [main]
    paths: ['web/admin.html', 'web/js/admin*.js', 'web/css/admin.css', 'web/css/style.css', 'web/css/lazy-ui.css', 'scripts/test/admin-guard.mjs', 'scripts/lib/layout-scan.mjs', 'scripts/lib/admin-table-scan.mjs', 'scripts/test/fixtures/admin-fx.mjs', '.github/workflows/admin-guard.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:   # ci-policy 2/11: push/lịch trùng gộp; chạy tay (mỗi lượt khác input) không bao giờ bị huỷ
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
  guard:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: fonts-noto-color-emoji fonts-noto-core }
      - name: Ảnh TRƯỚC (main, chỉ chụp)
        run: |
          B=$(git merge-base HEAD origin/main); [ "$B" = "$(git rev-parse HEAD)" ] && B=HEAD~1
          mkdir -p /tmp/before && git archive "$B" web | tar -x -C /tmp/before
          node scripts/test/admin-guard.mjs /tmp/before/web out/admin-guard before || true
      - name: Gác bố cục (SAU)
        run: node scripts/test/admin-guard.mjs web out/admin-guard after
      - name: Ghép TRƯỚC | SAU
        if: ${{ !cancelled() }}
        run: node scripts/test/admin-guard.mjs --compare out/admin-guard
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: admin-guard, path: out/admin-guard, retention-days: 14 }
