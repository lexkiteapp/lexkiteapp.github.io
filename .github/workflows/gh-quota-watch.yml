# Giám sát hạn mức GitHub API của GITHUB_TOKEN dùng chung (~1.000 lệnh/giờ/repo; 26/11: 403 "rate limit exceeded for installation"): mỗi giờ đọc /rate_limit (không tính hạn mức) + tổng lệnh gọi theo workflow
# từ dòng `gh-quota` trong log (scripts/lib/retry5xx.mjs) → bảng top tiêu thụ ở step summary; còn < 20 % → ::warning:: + issue `gh-quota` (đóng khi hồi). Lỗi giám sát không làm đỏ workflow.
name: gh-quota-watch
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
concurrency: { group: gh-quota-watch, cancel-in-progress: true }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            scripts/lib/retry5xx.mjs
            scripts/lib/is-main.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Đo hạn mức + top tiêu thụ
        timeout-minutes: 8
        env: { GITHUB_TOKEN: '${{ github.token }}', GITHUB_REPOSITORY: '${{ github.repository }}' }
        run: node scripts/ci/quota-watch.mjs
