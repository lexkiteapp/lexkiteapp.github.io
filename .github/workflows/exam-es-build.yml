# Dựng nguồn câu đề luyện định dạng theo tl (es: DELE/SIELE – docs/specs/spanish-exam-w5.md; fr: DELF/DALF – docs/specs/french-course.md W5; input tl, mặc định es): tải Tatoeba (CC BY 2.0 FR) + FrequencyWords trên runner (KHÔNG chạy trên Mac),
# chạy scripts/target/exam-es-lib.mjs cho các cấp chỉ định, sinh CREDITS + gói cpack, rồi trả kết quả qua artifact bot-output-exam-<tl>
# (lấy về: bash scripts/ci/bot-output.sh exam-<tl> <nhánh>; tự commit – không đẩy vào nhánh PR). Chạy tay: workflow_dispatch ref=<nhánh>.
name: exam-es-build
on:
  workflow_dispatch:
    inputs:
      tl: { description: 'Ngôn ngữ đích (es | fr)', default: 'es' }
      levels: { description: 'Cấp dựng lại nguồn (cách nhau dấu phẩy; cấp khác giữ nguyên)', default: 'B2,C1,C2' } # fr: A1,A2,B1,B2,C1,C2 (chưa có cấp nào)
permissions: { contents: read }
concurrency: { group: "exam-build-${{ github.event.inputs.tl || 'es' }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { NODE_OPTIONS: '--max-old-space-size=6000', TL: "${{ github.event.inputs.tl || 'es' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tải Tatoeba (es → spa, fr → fra) + FrequencyWords (chỉ làm thứ hạng)
        run: |
          case "$TL" in es) ISO=spa ;; fr) ISO=fra ;; *) echo "tl lạ: $TL"; exit 2 ;; esac
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/tat.tsv.bz2" "https://downloads.tatoeba.org/exports/per_language/$ISO/${ISO}_sentences_detailed.tsv.bz2"
          bunzip2 -f "$RUNNER_TEMP/tat.tsv.bz2"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/freq.txt" "https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/$TL/${TL}_50k.txt"
      - name: Chọn câu → nguồn, ghi công, gói cpack, add-on
        env: { LEVELS: "${{ github.event.inputs.levels || 'B2,C1,C2' }}" }
        run: |
          TATOEBA="$RUNNER_TEMP/tat.tsv" FREQ="$RUNNER_TEMP/freq.txt" node scripts/target/exam-es-lib.mjs
          node scripts/target/exam-es-check.mjs --tl "$TL" --write-credits
          node scripts/target/drill-pack.mjs --tl "$TL"
          bash scripts/build-extension.sh >/dev/null
      - id: bo
        uses: ./.github/actions/bot-output
        with: { name: 'exam-${{ env.TL }}', paths: 'content/exams/${{ env.TL }} web/cpack/${{ env.TL }} extension' }
