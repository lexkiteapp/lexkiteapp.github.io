# Bảo vệ nội dung hằng tuần (miễn phí): kiểm chuỗi băm sổ đăng ký → ghi ảnh chụp băm kho nội dung học (đề, lời giải, từ vựng)
# → kiểm WAF chống cào thật sự hoạt động → dò bản sao chép qua Brave Search (chỉ khi có secret BRAVE_SEARCH_KEY).
# Push lên main đổi add-on (extension/manifest.json – lên phiên bản) hoặc landing → chỉ ghi mốc phát hành + đóng dấu OpenTimestamps.
# OpenTimestamps (content/protection/ots/<hash>.ots): đóng dấu mục mới + upgrade bằng chứng pending; lỗi chỉ cảnh báo (continue-on-error).
# Tài liệu: docs/CONTENT-PROTECTION.md · Bộ hồ sơ DMCA: docs/legal/DMCA-KIT.md
name: Content protection
on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'extension/manifest.json'
      - 'content/landing/**'
      - 'scripts/build-landing.mjs'
      - 'scripts/lib/site-layout.mjs'
permissions:
  contents: write
  issues: write
concurrency:
  group: content-protect
  cancel-in-progress: false
jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sổ đăng ký – kiểm chuỗi băm
        run: node scripts/content-registry.mjs verify
      - name: Ảnh chụp băm kho nội dung học
        if: github.event_name != 'push'
        run: node scripts/content-registry.mjs snapshot
      - name: Mốc phát hành (add-on, landing)
        run: |
          node scripts/content-registry.mjs release addon
          node scripts/content-registry.mjs release landing
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: OpenTimestamps (đóng dấu mục mới + upgrade bằng chứng pending)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python -m pip install --quiet --disable-pip-version-check opentimestamps-client || { echo "::warning::Không cài được opentimestamps-client – bỏ qua đóng dấu, lần sau thử lại"; exit 0; }
          node scripts/ots.mjs stamp || echo "::warning::ots stamp lỗi – lần chạy sau thử lại"
          node scripts/ots.mjs upgrade || echo "::warning::ots upgrade lỗi – lần chạy sau thử lại"
          node scripts/ots.mjs status
      - name: Commit sổ đăng ký + bằng chứng OTS
        run: |
          node scripts/content-registry.mjs verify
          git add content/protection/registry.jsonl content/protection/ots 2>/dev/null || true
          git diff --cached --quiet && { echo "· sổ không đổi"; exit 0; }
          git config user.name "lexkite-bot"; git config user.email "lexkiteapp@users.noreply.github.com"
          git commit -qm "Registry: ảnh chụp băm / mốc phát hành / OpenTimestamps $(date -u +%F) [CF-Pages-Skip]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
      - name: WAF chống cào hoạt động (request thử thật)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          LEXKITE_CI_HEADER: ${{ secrets.LEXKITE_CI_HEADER }}
        run: node scripts/cf-waf.mjs live || echo "::warning::Luật WAF chưa áp/không đúng – chạy node scripts/cf-waf.mjs apply (docs/CONTENT-PROTECTION.md)"
      - name: Dò bản sao chép
        id: watch
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          BRAVE_SEARCH_KEY: ${{ secrets.BRAVE_SEARCH_KEY }}
        run: |
          set +e; node scripts/copy-watch.mjs --posts 6 | tee watch.txt; c=${PIPESTATUS[0]}
          echo "code=$c" >> "$GITHUB_OUTPUT"; [ "$c" = 3 ] && exit 0 || exit $c
      - name: Gửi kết quả dò sao chép lên Quản trị (tab Backlink, PR & Thương hiệu – không làm đỏ CI)
        if: always()
        continue-on-error: true
        env:
          STUDIO_CALLBACK_SECRET: ${{ secrets.STUDIO_CALLBACK_SECRET }}
          LEXKITE_CI_HEADER: ${{ secrets.LEXKITE_CI_HEADER }}
          BRAVE_SET: ${{ secrets.BRAVE_SEARCH_KEY != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/pr-check.mjs --push-copy reports/copy-watch.json
      - name: Báo nghi chép (issue)
        if: steps.watch.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create content-copy --color B60205 --force >/dev/null 2>&1 || true
          body=$(printf '%s\n\n%s' "Có trang ngoài chứa nguyên văn câu trong bài Lexkite. Xử lý theo docs/legal/DMCA-KIT.md." "$(cat watch.txt)")
          n=$(gh issue list --label content-copy --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "Nghi bị chép nội dung" --label content-copy --body "$body"; fi
