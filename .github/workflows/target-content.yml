# ci-policy: matrix – 5 ngôn ngữ đích (pt es fr ja ko), mỗi nhánh cài bộ kiểm riêng (espeak, kaikki, LanguageTool) và chỉ chạy khi content/target hay scripts/target đổi; gộp tuần tự sẽ vượt hạn của nhánh fr (~20 phút LanguageTool)
# Sinh bộ từ lõi ngôn ngữ đích theo lô (pt-BR ~300 · es-419 3.000 lemma A1–B2, lô 300) – chạy tay; docs/specs/target-language.md, spanish-course.md W1.
# AI qua ai-pool chung (khóa miễn phí): soạn → LanguageTool 0 lỗi (bảng có lt) → 2 giám khảo khác họ → dịch ngược → cổng validate
# → IPA espeak-ng của bảng (tl_ipa_fill.py) → Wiktionary lemma/giống/số nhiều (wikt-check.mjs) → kiểm cả bộ (build.mjs --check) → mẫu soát ≥ 5 %.
# Kết quả: tệp lô mới core-NN.json + .report.json (status pending-review) → artifact bot-output-target-<tl> (không bot commit vào nhánh PR –
# scripts/test/no-pr-branch-push.mjs); lấy về: bash scripts/ci/bot-output.sh target-<tl> <nhánh> <run-id>, tự commit rồi chạy lượt sau. Bảng riêng từng ngôn ngữ: scripts/target/tl-gen.mjs.
name: target-content
run-name: "target-content ${{ github.event.inputs.tl || 'PR' }} ${{ github.event.inputs.dry == '1' && '(khô)' || '' }}"
on:
  workflow_dispatch:
    inputs:
      tl: { description: 'Ngôn ngữ đích (khóa trong scripts/target/tl-gen.mjs)', default: 'es' }
      n: { description: 'Số mục mới (1 lô)', default: '300' }
      dry: { description: '1 = chỉ dựng danh sách ứng viên (không gọi AI)', default: '1' }
      shards: { description: 'Số job song song (1–12; mỗi shard ≤ n mục)', default: '1' }
  pull_request:
    paths: ['scripts/target/**', 'content/target/**', 'scripts/content-qa/grammar-map-check.mjs', 'scripts/ci/lt-up.sh', 'scripts/word-audio/tl-voices.json', 'scripts/word-audio/tl_kana.py', '.github/workflows/target-content.yml']
permissions: { contents: read, id-token: write }   # chỉ đọc repo (lô ra artifact); id-token: JWT OIDC cho /api/lexai
# Lượt tay nối tiếp lô trước → xếp hàng, KHÔNG huỷ lượt đang sinh (mất hạn mức ai-pool); PR thì huỷ lượt cũ.
concurrency:
  group: 'target-content-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CF_POOL_HOLD: ${{ vars.CF_POOL_HOLD }}
jobs:
  check:
    # PR: khô cho mọi tl + tự kiểm IPA espeak (seed khớp cả dấu nhấn) + Wiktionary trên seed (100 %) + chia động từ ↔ Wiktionary + kho ngữ pháp es
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # 40: nhánh fr chạy LanguageTool trên kho ngữ pháp + gói luyện + 24 cuộc gọi W4 (#1854) ≈ 20 phút → hạn 20 huỷ giữa chừng (lượt 45028205630); các nhánh khác < 2 phút
    timeout-minutes: 40
    strategy: { fail-fast: false, matrix: { tl: [pt, es, fr, ja, ko] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: node scripts/target/build.mjs ${{ matrix.tl }} --check
      - run: node scripts/target/gen.mjs --tl ${{ matrix.tl }} --n 300 --dry
      - name: IPA espeak-ng tự kiểm trên seed (es, fr)
        if: ${{ matrix.tl == 'es' || matrix.tl == 'fr' }}
        run: pip install -q "phonemizer-fork==3.3.2" "espeakng-loader==0.2.4" && TL=${{ matrix.tl }} python3 scripts/target/tl_ipa_fill.py --self
      - name: Cao độ + cách đọc seed + bài phát âm W3 ↔ OpenJTalk (ja, khớp 100 %) + gói px
        if: ${{ matrix.tl == 'ja' }}
        run: pip install -q "pyopenjtalk==0.4.1" && python3 scripts/target/tl_ja_fill.py --self && python3 scripts/target/tl_ja_fill.py --pron && node scripts/target/px-pack.mjs ja --check
      - name: Cuộc gọi AI ja – cổng chuẩn (thể lịch sự, không trộn, cấu trúc nút) + gói khớp nguồn
        if: ${{ matrix.tl == 'ja' }}
        run: node scripts/target/calls-check.mjs --tl ja && node scripts/target/calls-pack.mjs ja --check
      - name: Wiktionary trên seed (es, fr, ja)
        if: ${{ matrix.tl == 'es' || matrix.tl == 'fr' || matrix.tl == 'ja' }}
        run: node scripts/target/wikt-check.mjs --tl ${{ matrix.tl }} --self
      - name: Chia động từ ja ↔ Wiktionary (conj-ja.mjs, khớp 100 %)
        if: ${{ matrix.tl == 'ja' }}
        run: node scripts/target/conj-ja-check.mjs
      - name: Chia vị từ ↔ Wiktionary (ko, khớp 100 % – 24 dạng × vị từ bộ từ + 57 mẫu đủ 11 lớp)
        if: ${{ matrix.tl == 'ko' }}
        run: node scripts/target/conj-check.mjs --tl ko
      - name: Chia động từ ja ↔ Wiktionary (conj-ja.mjs, khớp 100 %)
        if: ${{ matrix.tl == 'ja' }}
        run: node scripts/target/conj-ja-check.mjs
      - name: Chia động từ ↔ Wiktionary (es, khớp 100 %)
        if: ${{ matrix.tl == 'es' }}
        run: node scripts/target/conj-check.mjs
      - name: LanguageTool tự chạy (es) – câu ví dụ kho ngữ pháp
        if: ${{ matrix.tl == 'es' }}
        run: bash scripts/ci/lt-up.sh es
      - name: Kho điểm ngữ pháp (es) + LanguageTool 0 lỗi
        if: ${{ matrix.tl == 'es' }}
        run: node scripts/content-qa/grammar-map-check.mjs --tl es
      - name: Gói luyện tập es (W2b) – khớp nguồn, giải thích đủ 15 ngôn ngữ, LanguageTool 0 lỗi trên câu điền từ
        if: ${{ matrix.tl == 'es' }}
        run: node scripts/target/drill-pack.mjs --check --lt
      - name: Đề luyện định dạng DELE/SIELE (W5) – nguồn Tatoeba có ghi công, spec không đoán số, LanguageTool 0 lỗi trên consigna
        if: ${{ matrix.tl == 'es' }}
        run: node scripts/target/exam-es-check.mjs --lt
      - name: Chia động từ ↔ Wiktionary (fr, khớp 100 % + trợ avoir/être)
        if: ${{ matrix.tl == 'fr' }}
        run: node scripts/target/conj-check.mjs --tl fr
      - name: LanguageTool tự chạy (fr) – câu ví dụ kho ngữ pháp + câu điền từ
        if: ${{ matrix.tl == 'fr' }}
        run: bash scripts/ci/lt-up.sh fr
      - name: Kho điểm ngữ pháp (fr) + LanguageTool 0 lỗi + một câu một xưng (tu ⟂ vous)
        if: ${{ matrix.tl == 'fr' }}
        run: node scripts/content-qa/grammar-map-check.mjs --tl fr
      - name: Gói luyện tập fr (W2) – khớp nguồn, giải thích đủ 15 ngôn ngữ, LanguageTool 0 lỗi trên câu điền từ
        if: ${{ matrix.tl == 'fr' }}
        run: node scripts/target/drill-pack.mjs --tl fr --check --lt
      - name: Đề luyện định dạng DELF/DALF (W5) – nguồn Tatoeba fr bắt buộc có (dựng bởi exam-es-build tl=fr), spec không đoán số, LanguageTool fr 0 lỗi trên consigne
        if: ${{ matrix.tl == 'fr' }}
        run: node scripts/target/exam-es-check.mjs --tl fr --lt --require-src
      - name: IPA bài phát âm fr (W3) – bảng 'ipa' của pron.json khớp espeak-ng fr-fr (lệch = đỏ, in từng mục)
        if: ${{ matrix.tl == 'fr' }}
        run: TL=fr python3 scripts/target/tl_ipa_fill.py --pron
      - name: Cuộc gọi AI fr (W4) – 24 cuộc A1–C1, một xưng hô tu|vous mỗi cuộc, LanguageTool 0 lỗi trên lời nói/câu mẫu/phản hồi
        if: ${{ matrix.tl == 'fr' }}
        run: node scripts/target/calls-check.mjs --tl fr --lt
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { ks: '${{ steps.p.outputs.ks }}' }
    steps:
      - id: p
        run: echo "ks=$(node -e "const n=Math.min(12,Math.max(1,+process.argv[1]||1));console.log(JSON.stringify([...Array(n).keys()]))" "$LX_IN1")" >> "$GITHUB_OUTPUT"
        env:
          LX_IN1: ${{ github.event.inputs.shards }}
  gen:
    # shard song song (≤ 12 runner – chừa ≥ 16 trống); mỗi shard chạy ĐỦ cổng rồi gửi tệp lô qua artifact cho job merge
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy: { fail-fast: false, matrix: { k: '${{ fromJSON(needs.plan.outputs.ks) }}' } }
    env: { TL: '${{ github.event.inputs.tl }}', SHARDS: '${{ github.event.inputs.shards }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Kiểm seed + bản sao app + các lô trước
        run: node scripts/target/build.mjs "$TL" --check
      - name: LanguageTool tự chạy (bảng có lt) – cổng §5.1
        if: ${{ github.event.inputs.dry != '1' }}
        run: |
          LT=$(node -e "import('./scripts/target/tl-gen.mjs').then(m=>console.log(m.TL_GEN[process.env.TL].lt||''))")
          bash scripts/ci/lt-up.sh "$LT"
      - name: Ứng viên (khô) hoặc sinh + LanguageTool + 2 giám khảo + dịch ngược + cổng
        env:
          LX_IN1: ${{ github.event.inputs.n || 300 }}
          LX_IN2: ${{ github.event.inputs.dry == '1' && '--dry' || '' }}
          CF_POOL: ${{ secrets.CF_POOL }}
          GEMINI_POOL: ${{ secrets.GEMINI_POOL }}
          GROQ_POOL: ${{ secrets.GROQ_POOL }}
          GRABCAST_AI_KEY: ${{ secrets.GRABCAST_AI_KEY }}   # thêm họ mô hình cho giám khảo B khi Gemini 429 (như content-factory)
          AI_POOL_GC_MAX: '100'
          AI_POOL_CF2_NEURONS: '120000'   # tuyến cf2 (Workers AI kho CF_POOL) dự phòng khi Groq/Gemini cùng 429; trần neuron/lượt, 4006 hết ngày tự nghỉ
          AI_GEM_MAX: '150'   # es: ≤ 150 lượt Gemini/lượt chạy (chỉ chấm), chừa hạn mức ngày cho fr/ja – lịch: chạy ngay sau 08:00 UTC
          CF_ACCOUNT_1: ${{ secrets.CF_ACCOUNT_ID }}
          VIMG_POOL_SKIP: '0'
        run: node scripts/target/gen.mjs --tl "$TL" --n $LX_IN1 --shard "${{ matrix.k }}/$SHARDS" $LX_IN2
      - name: IPA espeak-ng theo bảng (ghi đè IPA người soạn, lệch → qa.ipaAi)
        if: ${{ github.event.inputs.dry != '1' }}
        run: |
          [ "$(jq -r --arg t "$TL" '.[$t].espeak // ""' scripts/word-audio/tl-voices.json)" = "" ] && exit 0
          [ "$(jq -r --arg t "$TL" '.[$t].ipaCheck // ""' scripts/word-audio/tl-voices.json)" != "" ] && { echo "IPA do bảng sinh từ chữ (ipaCheck) – không ghi đè bằng espeak"; exit 0; }
          pip install -q "phonemizer-fork==3.3.2" "espeakng-loader==0.2.4" && python3 scripts/target/tl_ipa_fill.py "$(ls content/target/$TL/core-[0-9]*.json | grep -v report | tail -1)"
      - name: IPA es theo quy ước g2p (espeak còn là kiểm chéo, lệch → qa.ipaEs)
        if: ${{ github.event.inputs.dry != '1' && github.event.inputs.tl == 'es' }}
        run: node scripts/target/es-g2p.mjs --apply "$(ls content/target/es/core-[0-9]*.json | grep -v -e report -e review | tail -1)"
      - name: Cao độ + cách đọc OpenJTalk (bảng ipaCheck = reading – ja, japanese-course.md §5.2–§5.3)
        if: ${{ github.event.inputs.dry != '1' }}
        run: |
          [ "$(jq -r --arg t "$TL" '.[$t].ipaCheck // ""' scripts/word-audio/tl-voices.json)" = "reading" ] || exit 0
          pip install -q "pyopenjtalk==0.4.1" && python3 scripts/target/tl_ja_fill.py --self && python3 scripts/target/tl_ja_fill.py "$(ls content/target/$TL/core-[0-9]*.json | grep -v report | tail -1)"
      - name: Wiktionary lemma / giống / số nhiều
        if: ${{ github.event.inputs.dry != '1' }}
        run: node scripts/target/wikt-check.mjs --tl "$TL"
      - if: ${{ github.event.inputs.dry != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ github.event.inputs.tl }}-shard-${{ matrix.k }}
          path: content/target/${{ github.event.inputs.tl }}/core-*.json
          retention-days: 30
  merge:
    needs: [plan, gen]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event.inputs.dry != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { TL: '${{ github.event.inputs.tl }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'target-${{ github.event.inputs.tl }}-shard-*', path: /tmp/shards }
      - name: Gộp shard (chỉ tệp lô MỚI của từng shard) + bỏ trùng lemma giữa shard
        run: |
          before=$(ls content/target/$TL/ | wc -l)
          for d in /tmp/shards/*/; do for f in "$d"core-*.json; do [ -e "content/target/$TL/$(basename "$f")" ] || cp "$f" "content/target/$TL/"; done; done
          [ "$(ls content/target/$TL/ | wc -l)" -gt "$before" ] || { echo '✗ không shard nào ra lô mới'; exit 1; }
          node scripts/target/dedupe.mjs --tl "$TL"
      - name: Kiểm cả bộ sau lô
        if: ${{ github.event.inputs.dry != '1' }}
        run: node scripts/target/build.mjs "$TL" --check
      # Không đẩy vào nhánh PR (no-pr-branch-push: đầu PR là commit bot → required-gate treo) → artifact bot-output-target-<tl>;
      # người làm PR / vòng nạp lấy về: bash scripts/ci/bot-output.sh target-<tl> <nhánh> <run-id> rồi tự commit (lượt sau nối tiếp).
      - name: Lô mới → artifact bot-output (không commit vào nhánh)
        id: bo
        uses: ./.github/actions/bot-output
        with: { name: 'target-${{ github.event.inputs.tl }}', paths: 'content/target/${{ github.event.inputs.tl }}', retention-days: '30' }
      - if: ${{ steps.bo.outputs.changed != '1' }}
        run: echo '✗ không có lô mới' && exit 1
