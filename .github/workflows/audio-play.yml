# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🔊 Phát audio ổn định mọi máy (docs/specs/audio-quality.md việc 4): chọn giọng máy dự phòng (Node) + gói offline khớp s3.tsv
# + Playwright Chromium & WebKit (Safari): mở khóa, phát được, 404/treo → gốc CDN dự phòng → giọng máy đúng người nói, không chồng tiếng.
name: Phát audio (Chromium + WebKit)
on:
  pull_request:
    paths: ['web/js/audio*.js', 'web/js/ui.js', 'web/js/klocal*.js', 'web/js/lesson/teacher.js', 'web/js/settings.js', 'web/sw.js', 'web/audio/w/s3.tsv', 'web/data/offline-pack.json', 'scripts/audio/offline-pack.mjs', 'scripts/test/audio-*.mjs', 'scripts/test/ios-audio-e2e.mjs', 'web/js/listening.js', 'web/js/mock.js', 'web/js/toeic.js', 'web/js/lesson/ui.js', 'web/js/lesson/engine.js', '.github/workflows/audio-play.yml']
  push:
    branches: [main]
    paths: ['web/js/audio*.js', 'web/js/ui.js', 'web/js/klocal*.js', 'web/js/lesson/teacher.js', 'web/sw.js', 'scripts/test/audio-*.mjs', 'scripts/test/ios-audio-e2e.mjs', 'web/js/listening.js', 'web/js/mock.js', 'web/js/toeic.js', 'web/js/lesson/ui.js', 'web/js/lesson/engine.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-play-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
  play:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Chọn giọng máy dự phòng + gói offline
        run: node scripts/test/audio-voice.mjs && node scripts/audio/offline-pack.mjs --check
      - name: Cài Playwright
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium webkit
      - name: Phát audio – Chromium + WebKit
        run: node scripts/test/audio-play.mjs chromium,webkit
      - name: iOS mở khóa âm thanh theo phần tử – chạm thật (iPhone 13 WebKit + Pixel 7 Chromium)
        run: node scripts/test/ios-audio-e2e.mjs web webkit,chromium
