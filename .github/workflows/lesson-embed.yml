# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🎞️ Video nhúng một bước #/lesson (cờ lv_embed): e2e Chrome thật trên fixture từ artifact video-motion (PR #191) – scripts/test/lesson-embed-e2e.mjs.
# Ảnh chụp 360/390 px + 1366/1920 px ở artifact lesson-embed. Hermetic: 0 lượt chạm prod, 0 tài khoản; KHÔNG tải lên YouTube/R2.
name: Lesson embed video
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'Lượt video-motion để lấy artifact embed (trống = mới nhất)', required: false, default: '' }
  pull_request:
    paths: ['web/js/lesson-video.js', 'web/js/lesson/**', 'web/data/videos.json', 'web/js/i18n/*/lvideo.js', 'web/js/i18n/*/lesson.js', 'scripts/test/lesson-embed*', 'scripts/test/ux-guard-lib.mjs', '.github/workflows/lesson-embed.yml']
concurrency: { group: 'lesson-embed-${{ github.ref }}', cancel-in-progress: true }
permissions: { contents: read, actions: read }
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
  e2e:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cài
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chrome
      - uses: ./.github/actions/apt
        with: { packages: fonts-noto-color-emoji fonts-noto-core fonts-noto-cjk }
      - name: Fixture (artifact video-motion embed)
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', RUN_ID: '${{ inputs.run_id }}' }
        run: |
          bash scripts/test/lesson-embed-fixture.sh out/lv-fixture
          echo "### Fixture: $(cat out/lv-fixture/fixture.json)" >> "$GITHUB_STEP_SUMMARY"
      - name: E2E bước video (4:5 điện thoại · 16:9 máy tính · VTT · chương · ended → bước kế · gác bố cục)
        run: node scripts/test/lesson-embed-e2e.mjs web out/lv-fixture out/lesson-embed
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lesson-embed, path: out/lesson-embed, retention-days: 14 }
