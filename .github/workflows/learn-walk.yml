# 🚶 Luồng người mới thật (welcome → ngày 1 → ngày 2) – báo cáo đo + ảnh. Chỉ chạy tay/hằng tuần; không chặn PR.
name: Learn walk
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: learn-walk, cancel-in-progress: true }
jobs:
  walk:
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ./.github/actions/playwright-cache
        with: { browsers: '--with-deps chromium' }
      - name: Cài Playwright
        timeout-minutes: 12
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
      - run: |
          (cd web && python3 -m http.server 8080 >/dev/null 2>&1 &) ; sleep 1
          node scripts/test/learn-walk.mjs http://localhost:8080 learn-walk-out
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: learn-walk, path: learn-walk-out, retention-days: 14 }
