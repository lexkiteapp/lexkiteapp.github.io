# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🎨 Native ↔ web visual QC: ảnh snapshot iOS/Android phải đúng màu token + mốc bố cục (thanh 5 tab, nút chính); tờ so sánh với Stitch render (web) làm artifact.
name: Native visual QC
on:
  pull_request:
    paths: ['native/**/__Snapshots__/**', 'native/android/app/src/test/snapshots/**', 'native/shared/gen/**', 'brand/stitch/tokens.dtcg.json', 'brand/stitch/v2/today-*.html', 'scripts/native/visual-*', 'scripts/test/native-visual.mjs', 'scripts/test/fixtures/native-visual/**', '.github/workflows/native-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
  visual:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tự kiểm (ảnh giả)
        run: node scripts/test/native-visual.mjs --self-test
      - name: Vẽ web Stitch (Hôm nay sáng/tối, 390 px) làm cột so sánh
        continue-on-error: true     # chỉ là ảnh tham chiếu; không làm đỏ cổng
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2 pngjs@7.0.0
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: imagemagick fonts-noto-core fonts-noto-color-emoji }
      - name: Vẽ web Stitch (Hôm nay sáng/tối, 390 px) làm cột so sánh (tiếp)
        continue-on-error: true     # chỉ là ảnh tham chiếu; không làm đỏ cổng
        timeout-minutes: 14
        run: |
          mkdir -p "$RUNNER_TEMP/today" && cp brand/stitch/v2/today-light.html brand/stitch/v2/today-dark.html "$RUNNER_TEMP/today/"
          node scripts/test/stitch-render.mjs "$RUNNER_TEMP/today" out/stitch-today
      - name: Cổng màu token + mốc bố cục (chặn khi lệch)
        run: node scripts/test/native-visual.mjs --web out/stitch-today/png --out out/native-visual --langs en,vi
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: native-visual, path: out/native-visual, retention-days: 14 }
