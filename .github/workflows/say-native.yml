name: Say it like a native – meanings
# docs/SAY-NATIVE.md: 14-language meanings for the reaction cards via the AI pool (Gemini/Groq pools → CF_POOL → CF account 2, 2 judges of different families),
# then build web/data/say.json. 0 Claude tokens.
# 2/11: NEVER commits to a PR branch (bot head commit = no CI / required-gate stuck – PR #402; stray commit on rebase – PR #410).
#   branch ≠ main → meanings.json + say.json + ai-pool report = artifact bot-output-say-native + job summary + 1 sticky PR comment;
#                   the PR author runs `bash scripts/ci/bot-output.sh say-native` and commits (CI runs as for any push).
#   main (dispatch / series edit landed) → commit to main over SSH deploy key [skip ci]; the 3-hourly Pages cron picks up say.json.
#   Guard: scripts/test/no-pr-branch-push.mjs (npm test).
on:
  schedule:
    - cron: '11 13 * * *'   # 23/11: lượt bù trên main khi lượt trước gặp hết quota AI (translate chỉ làm phần còn thiếu; không còn nghĩa thiếu = gần như 0 lượt gọi)
  push:   # feature branches: a series edit re-runs only the missing meanings
    branches-ignore: [main]
    paths: ['content/say-native/series.json', 'content/say-native/slang.json', 'scripts/say-native/translate.mjs', '.github/workflows/say-native.yml']
  workflow_dispatch:
    inputs:
      langs: { description: 'comma list (empty = all 14)', default: '' }
      redo: { description: 'redo existing meanings (true/false)', default: 'false' }
      lines: { description: 'Slang Card L1: translate hook + example of the first N slang episodes (0 = off)', default: '40' }
permissions:
  contents: read
  id-token: write        # OIDC for /api/lexai
  pull-requests: write   # sticky report comment (branch runs)
concurrency:
  group: say-native-${{ github.ref }}
  cancel-in-progress: false   # a running translate keeps its AI-pool work; the newest push waits as the single pending run
jobs:
  # 23/11 (#1945/#1953 kẹt): job sinh nội dung bằng Gemini chạy trên MỌI PR vì push-paths tính cả commit gộp từ main (merge main vào nhánh = đụng content/say-native/*)
  # và required-gate tính nó → đốt quota đúng lúc kho khoá cạn. Nhánh ≠ main chỉ chạy khi chính nhánh đổi file của nó (so với merge-base với main).
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { run: '${{ steps.s.outputs.run }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: s
        env: { EV: '${{ github.event_name }}', REF: '${{ github.ref }}' }
        run: |
          run=1
          if [ "$EV" = push ] && [ "$REF" != refs/heads/main ]; then
            git fetch -q origin main
            own=$(git diff --name-only "$(git merge-base HEAD origin/main)" HEAD -- content/say-native/series.json content/say-native/slang.json scripts/say-native/translate.mjs .github/workflows/say-native.yml)
            if [ -z "$own" ]; then run=0; echo "::notice title=bỏ qua::nhánh không đổi file của say-native (chỉ gộp main) – không gọi AI"; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  meanings:
    needs: scope
    if: needs.scope.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        # only main holds the deploy key (branch code never gets the ruleset-bypass key)
        with: { ssh-key: "${{ github.ref == 'refs/heads/main' && secrets.BOT_DEPLOY_KEY || '' }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Translate + judge
        id: tr
        shell: bash
        timeout-minutes: 34   # 24/11: dưới 40 của job → vượt giờ vẫn còn thời gian cho Build/Report/artifact (run 45214781314 bị huỷ cả job, mất báo cáo)
        env:
          LX_IN1: ${{ inputs.langs && format('--langs {0}', inputs.langs) || '' }}
          LX_IN2: ${{ inputs.redo == 'true' && '--redo' || '' }}
          LX_LINES: ${{ inputs.lines || '40' }}
          LX_MAX: ${{ github.ref == 'refs/heads/main' && '30' || '15' }}   # nhánh PR: 15 phút là đủ cho phần nhánh đổi (chỉ nghĩa còn thiếu); phần còn lại do lượt bù trên main
          # 01/11: same pool order as lexicon-expand (run 41214894745 failed with only GrabCast + CF account 2): Gemini/Groq free-key pools → cf2 = CF_POOL rotation
          GEMINI_POOL: ${{ secrets.GEMINI_POOL }}
          GROQ_POOL: ${{ secrets.GROQ_POOL }}
          CF_POOL: ${{ secrets.CF_POOL }}
          CF_ACCOUNT_1: ${{ secrets.CF_ACCOUNT_ID }}   # excluded: never the main account
          VIMG_POOL_SKIP: '0'
          AI_POOL_CF2_NEURONS: '100000'   # per-run cap on the CF_POOL route (~377 meanings × gen + 2 judges is far below)
          GRABCAST_AI_KEY: ${{ secrets.GRABCAST_AI_KEY }}
          CF_AI_TOKEN_2: ${{ secrets.CF_AI_TOKEN_2 }}
          CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_2 }}
          AI_POOL_GC_MAX: '2000'
        run: |
          mkdir -p out/say-native
          node scripts/say-native/translate.mjs $LX_IN1 $LX_IN2 --lines "${LX_LINES:-40}" --max-min "$LX_MAX" 2>&1 | tee out/say-native/translate.log; rc=${PIPESTATUS[0]}
          # 23/11: kho khoá Gemini/Groq hết quota (429 hàng loạt) KHÔNG phải lỗi của PR → kết thúc trung tính, ghi chú, lượt cron 13:11 UTC trên main làm lại. Không có nghĩa nào được giữ + chỉ thấy 429 = hết quota.
          if [ "$rc" != 0 ] && grep -qE 'khoá liên tiếp 429|mọi khoá đang nghỉ' out/say-native/translate.log && ! grep -qE '^say-native translate: kept [1-9]' out/say-native/translate.log; then
            echo "::notice title=hết quota AI::say-native: kho khoá đang 429 – kết thúc trung tính, lượt bù theo lịch (13:11 UTC) làm lại"; echo "- ⏸ hết quota AI (429 hàng loạt): không đo/dịch được, KHÔNG phải lỗi của PR – lượt bù chạy theo lịch" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          exit "$rc"
      - name: Build say.json
        if: always()
        shell: bash
        run: |
          if node scripts/say-native/build.mjs 2>&1 | tee out/say-native/build.log; then echo ok > out/say-native/build.status
          else echo fail > out/say-native/build.status; echo "::warning::build gates still open (see log) – meanings kept for the next run"; fi
      - name: Report
        if: always()
        shell: bash
        run: |
          L=out/say-native/translate.log; B=out/say-native/build.log
          {
            echo "#### Say it like a native – meanings"
            echo "- translate: $(grep -E '^say-native translate:' "$L" 2>/dev/null | tail -1 || echo 'no summary line (step failed early)') – step ${{ steps.tr.outcome }}"
            echo "- build gates: $(cat out/say-native/build.status 2>/dev/null || echo 'not run')"
            echo; echo "| lang | ✓ kept | ✗ rejected |"; echo "|---|---|---|"
            awk '$2=="✓"||$2=="✗"{l[$1]=1; if($2=="✓")k[$1]++; else r[$1]++} END{for(x in l) printf "| %s | %d | %d |\n", x, k[x], r[x]}' "$L" 2>/dev/null | sort
            echo; echo "<details><summary>Full translate log</summary>"; echo; echo '```'; cat "$L" 2>/dev/null; echo '```'; echo "</details>"
            echo "<details><summary>Build log</summary>"; echo; echo '```'; cat "$B" 2>/dev/null; echo '```'; echo "</details>"
            echo "<details><summary>reports/ai-pool-say-native.json</summary>"; echo; echo '```json'; cat reports/ai-pool-say-native.json 2>/dev/null; echo '```'; echo "</details>"
          } > out/say-native/report.md
      - name: Commit to main
        if: always() && github.ref == 'refs/heads/main'   # also after a translate time-out: translate.mjs saves after every language (MAX_MIN), the kept meanings must not be lost (run 45029502257 lost 5 311 judged lines)
        shell: bash
        run: |
          cat out/say-native/report.md >> "$GITHUB_STEP_SUMMARY"
          bash scripts/ci/push-main.sh "say-native: nghĩa 14 ngôn ngữ (ai-pool, 2 giám khảo)" content/say-native/meanings.json content/say-native/slang-lines.json web/data/say.json reports/ai-pool-say-native.json
      - name: Branch – artifact + summary + PR comment (no push)
        if: always() && github.ref != 'refs/heads/main'
        uses: ./.github/actions/bot-output
        with:
          name: say-native
          paths: content/say-native/meanings.json content/say-native/slang-lines.json web/data/say.json reports/ai-pool-say-native.json
          report: out/say-native/report.md
          comment: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: say-native-meanings, path: "content/say-native/meanings.json\nout/say-native", retention-days: 7 }
