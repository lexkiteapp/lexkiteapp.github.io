# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# ci-policy: all-paths – đo kích thước repo/shell cho MỌI thay đổi (file nào cũng có thể làm phình); job ngắn, PR huỷ lượt cũ
# Cổng dung lượng repo chính (docs/STORAGE.md): cây HEAD ≤ 600 MB, mỗi commit thêm ≤ 20 MB nhị phân; trên PR chỉ tính commit RIÊNG của PR (so origin/main mới nhất) + tổng cả PR (ngoại lệ: "Size-Guard: allow" trong commit).
# Media nặng → kho ngoài (infra/media-repos.json). Clone blobless + thưa: chỉ commit + cây (+ blob nhị phân mới) → nhanh dù lịch sử ~1 GB.
name: size-guard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: 'size-guard-${{ github.ref }}', cancel-in-progress: true }
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    # luật 18 (CI làn nhanh, 16/11): PR chỉ chờ làn nhanh – việc nặng bỏ qua trên PR (skipped, không tốn máy), chạy SAU gộp trên push main; nhãn ready-heavy/ready = chạy nặng ngay trên PR
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-heavy') || contains(github.event.pull_request.labels.*.name, 'ready') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}', FIX: '${{ contains(github.event.pull_request.labels.*.name, ''main-red-fix'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          # máy gác 3/4 (23/11): CÙNG workflow đang ĐỎ trên main → dừng sớm (gate đỏ, 0 job nặng); main-red-retry.mjs chạy lại 1 lần khi main xanh. PR nhãn main-red-fix không bị chặn.
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}"); red=
          if [ "$go" = true ] && [ "$EV" = pull_request ] && [ "$FIX" != true ]; then
            m=$(gh api "repos/$REPO/actions/workflows/$wf/runs?branch=main&event=push&status=completed&per_page=5" --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0].conclusion' 2>/dev/null) || m=
            if [ "$m" = failure ]; then go=false; red=1; echo "::error title=main đỏ – chờ::$wf đang đỏ trên main – dừng sớm, tự chạy lại 1 lần khi main xanh"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha → go=$go"
          [ -z "$red" ] || exit 1
  guard:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, issues: write }   # issue cảnh báo cây ≥ 585 MB (bước cuối, chỉ push main/dispatch)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts/test/size-guard.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Đo cây + commit mới
        id: size
        env:
          EV: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # PR: chỉ commit RIÊNG của PR (origin/main MỚI NHẤT..HEAD – merge main vào PR không kéo commit nặng của main vào) + TỔNG cả PR (squash). Push main: dải before..HEAD.
          git fetch -q --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
          if [ "$EV" = pull_request ]; then node scripts/test/size-guard.mjs --base origin/main; exit $?; fi
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then R="$BEFORE..HEAD"; else R="HEAD~1..HEAD"; fi
          node scripts/test/size-guard.mjs --range "$R"
      # Cảnh báo sớm (26/11: main đỏ vì cây > 600 MB không báo trước): main ≥ 585 MB → mở/cập nhật 1 issue `tree-size`; < 585 MB → tự đóng. Trần 600 MB giữ nguyên. Lỗi bước này không làm đỏ cổng.
      - name: Issue cảnh báo cây repo
        if: ${{ always() && github.event_name != 'pull_request' && steps.size.outputs.tree_mb != '' }}
        continue-on-error: true
        timeout-minutes: 3
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', TREE: '${{ steps.size.outputs.tree_mb }}', RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' }
        run: |
          gh label create tree-size --color FBCA04 --description "cây repo chính gần trần 600 MB (size-guard)" --repo "$REPO" 2>/dev/null || true
          n=$(gh issue list --repo "$REPO" --label tree-size --state open --json number --jq '.[0].number // empty')
          if awk -v t="$TREE" 'BEGIN { exit !(t >= 585) }'; then
            body="Cây repo chính trên main: **${TREE} MB** (cảnh báo từ 585 MB, trần 600 MB – quá trần thì main ĐỎ và mọi PR bị chặn). Đẩy media nặng sang kho ngoài (infra/media-repos.json, scripts/media/push.mjs, docs/STORAGE.md) hoặc nén không mất dữ liệu (scripts/media/png-lossless.py). PR làm cây tăng > 1 MB khi cây ≥ 585 MB bị size-guard chặn. Lượt đo: $RUN_URL"
            title="Cây repo chính ${TREE} MB – gần trần 600 MB"
            if [ -n "$n" ]; then gh issue edit "$n" --repo "$REPO" --title "$title" --body "$body"; else gh issue create --repo "$REPO" --label tree-size --title "$title" --body "$body"; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --repo "$REPO" --comment "Cây ${TREE} MB < 585 MB – tự đóng."
          fi
