# ci-policy: all-paths – bộ test lõi phải chạy trên mọi PR (cổng required-gate); PR mới huỷ lượt cũ qua concurrency
# Bộ kiểm `npm test` DUY NHẤT (một định nghĩa): chạy trên MỌI pull_request vào main (cổng merge, đặt làm required check "npm test")
# và được Prod release gọi lại (workflow_call) làm cổng sau-push → PR đỏ ở đây thì main không thể đỏ vì cùng lý do.
# Không paths-filter (required check mà bị filter sẽ treo PR). Repo công khai → phút Actions miễn phí; PR không deploy Cloudflare Pages.
name: npm test
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      sha: { type: string, required: false, default: '' }
# ci-policy: matrix – 8 shard song song cân theo thời gian đo (38 phút tuần tự → ~6 phút); mỗi shard setup ~40 s (npm ci 1 s, cache), tổng runner-phút tăng ~10 %, đổi lấy vòng CI ngắn hơn 6 lần
permissions: { contents: read }
concurrency:
  group: npm-test-${{ github.event.pull_request.number || inputs.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 12/11 chia song song (trước: 1 job tuần tự 38 phút → ~6 phút): `fast` (lint/chính sách, đỏ sớm) + 8 shard cân theo thời gian đo
  # (scripts/test/suite-weights.json) chạy ĐỒNG THỜI; job `test` (tên check "npm test" – cổng luật 11/heavy/guards đọc đúng tên này) gộp kết quả.
  # fail-fast TẮT: một lượt thấy MỌI lỗi (ít vòng CI hơn). scripts/test/suite-shards.mjs canh: hợp fast+shard = đúng toàn bộ suite.txt, số shard khớp matrix.
  fast:
    name: npm test fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: làn nhanh (lint + chính sách)
        run: node scripts/test/run-suite.mjs --fast
  shard:
    name: npm test shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: nhánh gốc cho báo cáo khung app theo module (shell-size.mjs so Δ cùng bản Node)
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || true
      - name: npm test – phần ${{ matrix.shard }}/8
        run: node scripts/test/run-suite.mjs --shard=${{ matrix.shard }}/8
  test:
    name: npm test
    needs: [fast, shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gộp kết quả (đỏ nếu bất kỳ phần nào không xanh)
        env: { FAST: '${{ needs.fast.result }}', SHARD: '${{ needs.shard.result }}' }
        run: |
          echo "fast=$FAST shard=$SHARD"
          [ "$FAST" = success ] && [ "$SHARD" = success ]
  # luật 11 (làn nhanh trước làn nặng): npm test xanh → chạy lại các lượt nặng (QA bot, Journey E2E, …) mà job `gate` của chúng đã bỏ qua vì npm test chưa xong. Chỉ ĐỌC API + rerun.
  heavy:
    needs: test
    if: ${{ github.event_name == 'pull_request' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: write }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts/ci\nscripts/lib/is-main.mjs\n.github/workflows", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: chạy lại việc nặng của cùng sha
        env: { GITHUB_TOKEN: '${{ github.token }}', GITHUB_REPOSITORY: '${{ github.repository }}', LX_HEAD_SHA: '${{ github.event.pull_request.head.sha }}' }
        run: node scripts/ci/heavy-rerun.mjs --sha "$LX_HEAD_SHA"
