# Dựng 1 video cho Video Studio (Quản trị → Video Studio → "Dựng video"). functions/api/studio.js gọi workflow_dispatch với job_id
# (secret GH_DISPATCH_TOKEN ở Cloudflare Pages). Chạy trên ubuntu-latest (miễn phí, repo công khai). Luồng: docs/VIDEO-PIPELINE.md §7.
# Bí mật GitHub Actions cần: STUDIO_CALLBACK_SECRET (trùng giá trị trên Cloudflare Pages), GRABCAST_API_KEY (tải video vào kho GrabCast; thiếu → bỏ qua bước tải kho).
name: Dựng video (Video Studio)
on:
  workflow_dispatch:
    inputs:
      job_id: { description: 'Mã job video (video_jobs.id)', required: true }
permissions:
  contents: read
concurrency:
  group: video-${{ github.event.inputs.job_id }}
  cancel-in-progress: false
env:
  JOB: ${{ github.event.inputs.job_id }}
  STUDIO_API: https://lexkite.com/api/studio
  STUDIO_CALLBACK_SECRET: ${{ secrets.STUDIO_CALLBACK_SECRET }}
  VIDEO_STRICT: '1'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Kiểm mã job
        run: echo "$JOB" | grep -Eq '^[A-Za-z0-9_-]{1,40}$' || { echo "job_id không hợp lệ"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài ffmpeg (libass) + phông DejaVu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core unzip >/dev/null && ffmpeg -hide_banner -filters | grep -q ' ass '
      # Lớp motion (docs/VIDEO-PIPELINE.md §10): Remotion – React → MP4, Chrome Headless Shell chạy CPU trên ubuntu (miễn phí theo giấy phép Remotion cho công ty nhỏ)
      - name: Đệm Remotion (node_modules)
        uses: actions/cache@v4
        with:
          path: scripts/video/remotion/node_modules
          key: remotion-${{ hashFiles('scripts/video/remotion/package-lock.json') }}-v1
      - name: Cài Remotion + thư viện cho Chrome Headless Shell
        run: |
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2t64 >/dev/null
          cd scripts/video/remotion && npm ci --no-audit --no-fund >/dev/null && npx remotion browser ensure >/dev/null && echo "Remotion OK"
      # Công cụ nặng – đều miễn phí, chạy CPU: Kokoro (kokoro-js như audio.yml), faster-whisper tiny.en, Rhubarb Lip Sync (bản phát hành), numpy/pillow/scipy (cắt bóng sàn ảnh tĩnh)
      - name: Đệm mô hình (Kokoro ~90 MB, whisper tiny.en ~75 MB)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/kk/node_modules/@huggingface/transformers/.cache
            ~/.cache/huggingface
          key: video-models-kokoro82m-q8-whisper-tiny-en-v1
      - name: Cài kokoro-js + faster-whisper + Rhubarb
        run: |
          npm i --no-save --no-audit --no-fund --prefix /tmp/kk kokoro-js@1 >/dev/null
          pip install -q faster-whisper==1.1.1 av==13.1.0 requests numpy pillow scipy
          curl -fsSL -o /tmp/rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          mkdir -p /tmp/rhubarb && unzip -q /tmp/rhubarb.zip -d /tmp/rhubarb
          echo "RHUBARB=$(find /tmp/rhubarb -type f -name rhubarb | head -1)" >> "$GITHUB_ENV"

      # ---------- Dây chuyền dựng (mỗi bước đọc/ghi out/video/<job>/state.json; VIDEO_STRICT=1: thiếu công cụ → lỗi, không lặng lẽ bỏ qua) ----------
      - name: 0 · Tải kho dựng (phòng + clip stacked đã approved trên media.lexkite.com)
        env: { GITHUB_TOKEN: '${{ github.token }}' } # dự phòng tải blob git khi CDN còn bản cũ
        run: node scripts/video/library.mjs fetch-render
      # Diễn viên = ĐÚNG bộ nhân vật registry (web/teach/characters.json – 2D Ama/Carlos trang phục 1, chủ 28/10; docs/CHARACTERS.md):
      # tải thưa đúng clip phông xanh nguồn PRO từ lexkite-footage → clip stacked khung medium (scripts/video/registry_clips.py). Không có kho nhân vật khác.
      - name: 0b · Diễn viên registry (2D Ama/Carlos) – dựng clip stacked từ footage phông xanh
        env: { KEY: '${{ secrets.FOOTAGE_DEPLOY_KEY }}' }
        run: |
          [ -n "$KEY" ] || { echo "::error::missing FOOTAGE_DEPLOY_KEY"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/footage && chmod 600 ~/.ssh/footage
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export git_SSH_COMMAND="ssh -i ~/.ssh/footage -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --no-checkout git@github.com:lexkiteapp/lexkite-footage.git /tmp/footage
          P=$(python3 -c "import json;R=json.load(open('web/teach/characters.json'));print(' '.join(f'/anchor/green/kfull_pro/{c[\"src\"]}.mp4 /anchor/green/kmask_pro/{c[\"src\"]}.mkv' for p in R['people'].values() for c in p['clips'].values()))")
          git -C /tmp/footage sparse-checkout set --no-cone $P; git -C /tmp/footage checkout -q; rm -f ~/.ssh/footage; du -sh /tmp/footage
          python3 scripts/video/registry_clips.py /tmp/footage/anchor/green brand/library
          rm -rf /tmp/footage
      - name: 1 · Lấy kịch bản đã duyệt (+ dấu vân tay 30 video gần nhất)
        run: node scripts/video/render.mjs --job "$JOB" --step fetch
      - name: 2 · Biến thể có seed (khuôn × bối cảnh × dàn × góc máy × hook × chuyển cảnh × nhạc × end card, chống lặp)
        run: node scripts/video/render.mjs --job "$JOB" --step variant
      - name: 3 · Cổng nhất quán bối cảnh – nhân vật – lời thoại
        run: node scripts/video/render.mjs --job "$JOB" --step cast
      - name: 4 · Giọng đọc Kokoro (-16 LUFS)
        env:
          KOKORO_NODE_PATH: /tmp/kk/node_modules
        run: node scripts/video/render.mjs --job "$JOB" --step tts
      - name: 5 · Mốc thời gian từng từ (faster-whisper tiny.en)
        run: node scripts/video/render.mjs --job "$JOB" --step align
      - name: 6 · Khẩu hình Rhubarb
        run: node scripts/video/render.mjs --job "$JOB" --step lipsync
      - name: 7 · Phụ đề karaoke ASS + hook + CTA
        run: node scripts/video/render.mjs --job "$JOB" --step karaoke
      - name: 8 · Ghép video 1080×1920 30 fps (Remotion – motion graphics, chuyển cảnh, phụ đề động; ffmpeg – giọng + nhạc sidechain + SFX)
        id: compose
        run: node scripts/video/render.mjs --job "$JOB" --step compose
      - name: 9 · Cổng chất lượng (LUFS, khẩu hình, phụ đề, nhịp, nhất quán, chống lặp, visual hook ≥ 90, màu)
        run: node scripts/video/render.mjs --job "$JOB" --step qa
      - name: Báo cáo độ phủ tài nguyên (không chặn)
        if: always()
        continue-on-error: true
        run: node scripts/video/render.mjs --coverage | tee -a "$GITHUB_STEP_SUMMARY" >/dev/null

      # ---------- Lưu trữ & gọi lại ----------
      - name: Lưu bản xem trước (artifact 14 ngày)
        id: art
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.job_id }}
          path: |
            out/video/${{ github.event.inputs.job_id }}/video.mp4
            out/video/${{ github.event.inputs.job_id }}/subs.*
            out/video/${{ github.event.inputs.job_id }}/state.json
            out/video/${{ github.event.inputs.job_id }}/words.json
            out/video/${{ github.event.inputs.job_id }}/visemes.json
            out/video/${{ github.event.inputs.job_id }}/props.json
          retention-days: 14
      - name: Tải vào kho GrabCast (pool bulk – Studio tự tạo bài & lên lịch)
        id: store
        continue-on-error: true # kho đầy/API lỗi không làm hỏng lần dựng: video vẫn vào Studio để chấm (artifact), đăng cần tải kho lại
        env:
          GRABCAST_API_KEY: ${{ secrets.GRABCAST_API_KEY }}
        run: |
          if [ -z "$GRABCAST_API_KEY" ]; then echo "⚠️ chưa có secret GRABCAST_API_KEY – bỏ qua tải kho"; exit 0; fi
          node scripts/video/publish-grabcast.mjs --file "out/video/$JOB/video.mp4" --store-only
      - name: Báo kết quả về Studio
        if: always()
        env:
          OBJECT_ID: ${{ steps.store.outputs.object_id }}
          PREVIEW_URL: ${{ steps.store.outputs.preview_url || steps.art.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/video/render.mjs --job "$JOB" --step report --ok "${{ job.status }}"
