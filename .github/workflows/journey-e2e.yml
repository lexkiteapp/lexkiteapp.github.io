# 🧭 Hành trình người dùng đầu-cuối (Playwright) – scripts/test/journey-e2e.mjs · docs/QUALITY-SWEEP.md § journey-e2e
# 7 hành trình × vi/en/ar × máy tính/điện thoại (+ add-on), mỗi hành trình kiểm: lỗi console, lớp nổi chồng nhau, hỏi 2 lần, focus, còn sau tải lại, chạy khi mất mạng.
# Hermetic: dist cục bộ, /api/* giả lập trong tiến trình, host ngoài = rỗng, ?sandbox=1 / tài khoản giả → 0 lượt chạm prod, 0 tài khoản thật.
# Chạy: mỗi PR đụng file app · quality-sweep hằng đêm (workflow_call) · tay (native=1 → thêm hành trình 1–3 trên Android emulator + iOS Simulator).
name: Journey E2E
on:
  pull_request:
    paths: ['web/js/**', 'web/css/**', 'web/app/**', 'web/index.html', 'web/sw.js', 'web/i18n/**', 'extension/**', 'scripts/build-web.sh', 'scripts/test/journey-e2e.mjs', 'scripts/test/journey-e2e/**', 'scripts/quality/serve.mjs', '.github/workflows/journey-e2e.yml']
  push:
    branches: ['journey-e2e*']
  workflow_dispatch:
    inputs:
      native: { description: '1 = chạy thêm hành trình 1–3 trên Android emulator + iOS Simulator', required: false, default: '0' }
  workflow_call:
    inputs:
      native: { type: string, required: false, default: '0' }
permissions:
  contents: read
concurrency:
  group: journey-e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lang: [vi, en, ar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build dist + add-on
        run: |
          npm ci --no-audit --no-fund
          bash scripts/build-web.sh >/dev/null
          bash scripts/build-extension.sh >/dev/null
      - name: Cài Playwright
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.50.1
          npx playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y -qq fonts-noto-color-emoji fonts-noto-core >/dev/null
      - name: Chặn lexkite.com (0 lượt chạm prod)
        run: echo "127.0.0.1 lexkite.com www.lexkite.com audio.lexkite.com media.lexkite.com" | sudo tee -a /etc/hosts >/dev/null
      - name: Hành trình ${{ matrix.lang }} (máy tính + điện thoại + add-on)
        run: node scripts/test/journey-e2e.mjs --root dist --lang ${{ matrix.lang }} --out je-out/${{ matrix.lang }} --ext
      - if: always()
        run: cat je-out/${{ matrix.lang }}/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'journey-${{ matrix.lang }}', path: 'je-out/${{ matrix.lang }}', retention-days: 7, if-no-files-found: ignore }
