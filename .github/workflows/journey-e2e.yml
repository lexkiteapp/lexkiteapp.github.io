# ci-policy: matrix – android: mỗi nhánh một emulator độc lập (emulator chết giữa chừng khi chạy dài, 26/10 + 13/11); chỉ chạy khi native=1 (tay/quality-sweep), không trên PR
# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🧭 Hành trình người dùng đầu-cuối (Playwright) – scripts/test/journey-e2e.mjs · docs/QUALITY-SWEEP.md § journey-e2e
# 7 hành trình × vi/en/ar × máy tính/điện thoại (+ add-on), mỗi hành trình kiểm: lỗi console, lớp nổi chồng nhau, hỏi 2 lần, focus, còn sau tải lại, chạy khi mất mạng.
# Hermetic: dist cục bộ, /api/* giả lập trong tiến trình, host ngoài = rỗng, ?sandbox=1 / tài khoản giả → 0 lượt chạm prod, 0 tài khoản thật.
# Chạy: mỗi PR đụng file app · quality-sweep hằng đêm (workflow_call) · tay (native=1 → thêm hành trình 1–3 trên Android emulator + iOS Simulator).
name: Journey E2E
on:
  pull_request:
    paths: ['web/js/**', 'web/css/**', 'web/app/**', 'web/index.html', 'web/sw.js', 'web/i18n/**', 'extension/**', 'scripts/build-web.sh', 'scripts/test/journey-e2e.mjs', 'scripts/test/welcome-journey.mjs', 'scripts/test/stitch-screens.mjs', 'scripts/test/journey-e2e/**', 'scripts/quality/serve.mjs', '.github/workflows/journey-e2e.yml']
  push:
    branches: ['journey-e2e*']
  workflow_dispatch:
    inputs:
      native: { description: '1 = chạy thêm hành trình 1–3 trên Android emulator + iOS Simulator', required: false, default: '0' }
  workflow_call:
    inputs:
      native: { type: string, required: false, default: '0' }
permissions:
  contents: read
concurrency:
  # github.workflow = tên workflow GỌI khi chạy qua workflow_call (Quality sweep) → nhóm riêng, không huỷ lượt chạy tay/PR cùng ref
  group: journey-e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # lượt chạy tay native=1 dài ~30' → không để lượt dispatch/PR khác cùng ref huỷ giữa chừng (26/10: ios bị huỷ 2 lần, android bị huỷ sau 41')
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha → go=$go"
  web:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lang: [vi, en, ar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Build dist + add-on
        run: |
          npm ci --no-audit --no-fund
          bash scripts/build-web.sh >/dev/null
          bash scripts/build-extension.sh >/dev/null
      - name: Cài Playwright
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.50.1
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: fonts-noto-color-emoji fonts-noto-core }
      - name: Chặn lexkite.com (0 lượt chạm prod)
        run: echo "127.0.0.1 lexkite.com www.lexkite.com audio.lexkite.com media.lexkite.com" | sudo tee -a /etc/hosts >/dev/null
      - name: Hành trình ${{ matrix.lang }} (máy tính + điện thoại + add-on)
        run: node scripts/test/journey-e2e.mjs --root dist --lang ${{ matrix.lang }} --out je-out/${{ matrix.lang }} --ext
      - name: Hành trình 1–2 trên điện thoại 360/390 px (vi) + kiểm hình tự động
        if: always() && matrix.lang == 'vi'
        run: node scripts/test/journey-e2e.mjs --root dist --lang vi --device m360,m390 --only 1,2 --out je-out/vi-360
      - name: Welcome + thiết lập lần đầu (docs/specs/welcome.md)
        if: always() && matrix.lang == 'vi'
        run: node scripts/test/welcome-journey.mjs --root dist
      - if: always()
        run: cat je-out/${{ matrix.lang }}*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'journey-${{ matrix.lang }}', path: 'je-out/${{ matrix.lang }}*', retention-days: 7, if-no-files-found: ignore }

  android:
    if: ${{ (inputs.native == '1') && needs.gate.outputs.go == 'true' }}
    name: android (${{ matrix.lang }})
    needs: gate
    runs-on: ubuntu-24.04   # ghim: ubuntu-latest đổi sang 26.04 ngày 13/11 – nghi ngờ qemu emulator chết với image mới (leg ar); dùng chung ghim với #1249
    timeout-minutes: 40
    # mỗi ngôn ngữ một emulator mới: 26/10–27/10 emulator chết ngẫu nhiên sau ~10–14' chạy liên tục (qemu biến mất, host còn 10 GB trống) → ngắn hơn + độc lập
    strategy:
      fail-fast: false
      matrix:
        # Ả Rập (RTL) tách thành leg ngắn, mỗi leg một emulator mới: leg ar đủ 13 bước bị emulator (qemu) biến mất sau j1a (13/11, 6/6 lần). ar-kbd: chỉ đo bàn phím THẬT.
        lang: [en, vi, ar-1, ar-2, ar-kbd]
    env:
      JE_LANGS: ${{ startsWith(matrix.lang, 'ar') && 'ar' || matrix.lang }}
      JE_STEPS: ${{ matrix.lang == 'ar-1' && 'j1a,R,j1b' || matrix.lang == 'ar-2' && 'reset,R,j2s,R,j2a,R,j2b,j3a,R,j3b' || '' }}
      JE_MIN_RAN: ${{ matrix.lang == 'ar-1' && '2' || matrix.lang == 'ar-2' && '6' || '6' }}
      JE_ONLY_KBD: ${{ matrix.lang == 'ar-kbd' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/no-prod  # app trong máy ảo Android: /api + media prod → không phân giải (app chạy nhánh offline như web)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build APK debug
        run: |
          bash scripts/ci/npm-retry.sh ci --prefix mobile --no-audit --no-fund
          ./scripts/build-mobile.sh
          cd mobile/android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug | tail -5
          cp app/build/outputs/apk/debug/app-debug.apk ../../lexkite.apk
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator + hành trình Android (tối đa 28')
        id: emu1
        continue-on-error: true
        timeout-minutes: 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          heap-size: 576M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 420
          # leg ar*: emulator (swiftshader_indirect) chết lặp lại ngay khi app vẽ chữ Ả Rập (13/11, kể cả leg ar-kbd không chạy hành trình) → thử GPU phần mềm trong khách `-gpu off`
          emulator-options: ${{ startsWith(matrix.lang, 'ar') && '-no-window -gpu off -no-snapshot -noaudio -no-boot-anim' || '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim' }}
          script: |
            adb wait-for-device
            for i in 1 2 3; do adb install -r lexkite.apk && break; echo "install lần $i lỗi"; sleep 15; done
            adb shell pm list packages | grep -q com.lexkite.app
            echo 2 > android-rc; timeout 26m node scripts/test/journey-e2e/android.mjs je-android; echo $? > android-rc
      # qemu tự biến mất giữa chừng (26–27/10 và 13/11: leg ar chết ngay sau khi cài app, host còn ~11 GB) – hạ tầng, không phải kết quả của app: chạy lại ĐÚNG MỘT lần trên emulator mới.
      # Chỉ lượt "máy ảo chết" mới được chạy lại; mọi lỗi của app (bad khác) giữ nguyên đỏ.
      - name: Máy ảo chết giữa chừng? → quyết định chạy lại 1 lần
        id: emudead
        if: always()
        run: |
          lsb_release -ds; uname -r; free -m | head -2
          if [ -s je-android/results.json ] && grep -q 'emulator mất kết nối' je-android/results.json; then echo '--- dmesg (OOM/qemu bị kill?) ---'; sudo dmesg 2>&1 | grep -iE 'oom|killed process|qemu|segfault|out of memory' | tail -20; echo '--- hết dmesg ---'; fi
          if [ -s je-android/results.json ] && grep -q 'emulator mất kết nối' je-android/results.json; then echo "retry=1" >> "$GITHUB_OUTPUT"; echo "::warning::emulator chết giữa chừng – chạy lại 1 lần"; mkdir -p crash-1 && cp -r /tmp/android-runner/emu-crash-* crash-1/ 2>/dev/null || true; mv je-android je-android-lan1; else echo "retry=0" >> "$GITHUB_OUTPUT"; fi
      - name: Emulator + hành trình Android – lần 2 (chỉ khi máy ảo chết ở lần 1)
        if: steps.emudead.outputs.retry == '1'
        timeout-minutes: 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          heap-size: 576M
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 420
          # leg ar*: emulator (swiftshader_indirect) chết lặp lại ngay khi app vẽ chữ Ả Rập (13/11, kể cả leg ar-kbd không chạy hành trình) → thử GPU phần mềm trong khách `-gpu off`
          emulator-options: ${{ startsWith(matrix.lang, 'ar') && '-no-window -gpu off -no-snapshot -noaudio -no-boot-anim' || '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim' }}
          script: |
            adb wait-for-device
            for i in 1 2 3; do adb install -r lexkite.apk && break; echo "install lần $i lỗi"; sleep 15; done
            adb shell pm list packages | grep -q com.lexkite.app
            echo 2 > android-rc; timeout 26m node scripts/test/journey-e2e/android.mjs je-android; echo $? > android-rc
      - uses: actions/upload-artifact@v4
        if: always() && steps.emudead.outputs.retry == '1'
        with: { name: 'emulator-crash-lan1-${{ matrix.lang }}', path: 'crash-1/', retention-days: 7, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'journey-android-${{ matrix.lang }}', path: je-android/, retention-days: 7 }
      - name: Kết luận
        if: always()
        run: |
          rc=$(cat android-rc 2>/dev/null || echo 'chưa chạy (emulator không lên / bước bị treo)')
          echo "android rc=$rc"
          test "$rc" = 0
          test -s je-android/results.json
          node -e "const r=JSON.parse(require('fs').readFileSync('je-android/results.json'));console.log('bước đã chạy:',r.ran);process.exit((r.ran>=+(process.env.JE_MIN_RAN||6)||process.env.JE_ONLY_KBD==='1')&&!r.bad.length?0:1)"

  ios:
    if: ${{ (inputs.native == '1') && needs.gate.outputs.go == 'true' }}
    needs: gate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/no-prod  # app trong Simulator: /api + media prod → không phân giải (app chạy nhánh offline như web)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Chọn Xcode 26
        timeout-minutes: 5
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: Build web → mobile → chèn harness (E2E_MODE=journey)
        env: { E2E_MODE: journey }
        run: |
          bash scripts/ci/npm-retry.sh ci --prefix mobile --no-audit --no-fund
          ./scripts/build-mobile.sh
          bash scripts/test/ios-e2e/inject.sh
      - name: xcodebuild (iphonesimulator, không ký)
        timeout-minutes: 25
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Hành trình 1–3 trên iPhone (vi/en/ar)
        timeout-minutes: 45
        run: node scripts/test/ios-e2e/driver.mjs --app mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app --device 'iPhone 1' --tag journey --out je-ios --minutes 40 --minsteps 20
      - name: Báo cáo
        if: always()
        run: |
          node scripts/test/ios-e2e/report.mjs je-ios > /dev/null || true
          cat je-ios/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          node -e "const r=JSON.parse(require('fs').readFileSync('je-ios/journey/results.json'));const bad=r.events.filter(e=>e.type==='step'&&(e.issues||[]).some(i=>/^(journey|js|promise|stall|harness)$/.test(i.kind)));for(const b of bad)console.log('✗',b.step,b.lang,JSON.stringify(b.issues).slice(0,600));console.log(bad.length+' bước lỗi, done='+r.done);process.exit(bad.length||!r.done?1:0)"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: journey-ios, path: je-ios/, retention-days: 7 }
