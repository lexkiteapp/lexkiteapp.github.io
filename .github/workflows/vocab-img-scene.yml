# Ảnh cho MỌI nghĩa (~20k từ) + ảnh bài học giai đoạn 1 – docs/LEXICON.md § Ảnh mọi nghĩa, docs/VISUAL-LEARNING-PLAN.md.
# Vẽ: GrabCast Cloudflare FLUX (gen.mjs PROVIDERS, 429 → chờ lùi). Thẻ cảnh: ai-pool (GrabCast văn bản). Giám khảo: CỤC BỘ trên CPU (local_judge.py:
# CLIP + máy chú thích nhỏ + MiniLM + tesseract + NSFW + tâm phong cách + pHash) – 0 token, không phụ thuộc Gemini. Ô khái niệm hư từ = SVG tất định.
# Ma trận ≤ 10 việc/lượt, mỗi việc một lượt thuê RIÊNG ở điều phối (LEASE_SHARD) + trần ảnh riêng (max_gc / shards).
# Chế độ: pilot (60 trừu tượng + 20 hư từ + 74 ảnh bài học, KHÔNG đăng) · calibrate (chỉ hiệu chỉnh ngưỡng) ·
#   fill (BẬT 24/10, 4 lượt/ngày): nghĩa CẢNH chưa có ảnh → thẻ cảnh → tới `variants` biến thể/nghĩa, nhận biến thể ĐẦU qua giám khảo cảnh
#   (ngưỡng độ chính xác cao vimg-judge-scene.json: cảnh 100 % @ recall 16 %) → kho m4 (deploy key MEDIA4_DEPLOY_KEY) → img.json; trượt hết → vimg-scene-queue.json.
# Không ghi gì vào Pages, không ghi D1 (sổ ảnh = git/manifest), không đụng tệp của việc khác (vocab-img giữ img.json / vimg-cards.json).
name: Ảnh mọi nghĩa (cảnh + khái niệm)
on:
  schedule:
    - cron: '40 2,4,7,10,13,16,19,22 * * *'   # fill 8 lượt/ngày (chủ 26/10: vắt hết kho CF; lượt tự dừng khi mọi tài khoản báo 4006) – infra/jobs.json vocab-img-scene
  workflow_dispatch:
    inputs:
      mode: { description: 'pilot | calibrate | fill | rejudge (chấm lại lượt lab_run bằng giám khảo kép, xuất tờ soát)', default: 'pilot' }
      shards: { description: 'Số việc song song (1–10)', default: '1' }
      max_gc: { description: 'Trần ảnh GrabCast CẢ lượt (chia đều cho các việc; fill mặc định 6000)', default: '' }
      variants: { description: 'fill: số biến thể tối đa mỗi nghĩa (1–6), nhận biến thể đầu qua giám khảo · pilot: 1 = không vẽ lại ảnh trượt (thay input retry cũ)', default: '4' }
      recal: { description: '1 = hiệu chỉnh ngưỡng giám khảo trước khi chấm', default: '1' }
      from_run: { description: 'Chỉ chạy bước gộp/tờ ảnh trên artifact của lượt này (run id) – không vẽ lại', default: '' }
      pick: { description: 'Chọn khoá pilot n:from:fn (n nghĩa cảnh bỏ qua from nghĩa đầu, fn hư từ)', default: '60:0:20' }
      provider: { description: 'Nhà vẽ + giám khảo thị giác: cf = Workers AI THẲNG (CF_POOL → tài khoản 2, cf-direct.mjs; 26/10 GrabCast hỏng) · grabcast', default: 'cf' }
      model: { description: 'Mô hình ảnh GrabCast (A/B, docs/VOCAB-IMG-STYLE.md); rỗng = mặc định flux-1-schnell, không gửi trường model', default: '' }
      only: { description: 'pilot: CHỈ các khoá này – tệp JSON {items} (vd. content/visual/pilot-40.json) hoặc danh sách phẩy · bắt đầu bằng + = THÊM vào pilot (thay input extra cũ, vd. +equal#adj,race#n)', default: '' }
      lab_run: { description: 'Lượt cũ (run id có vimg-scene-final) → tính lại đặc trưng giám khảo cảnh cho ảnh đã gán nhãn', default: '' }
permissions:
  contents: read
  actions: read     # tải artifact gán nhãn (calibrate)
  id-token: write   # ai-pool /api/lexai (OIDC) – thẻ cảnh dùng GrabCast trước
concurrency: { group: "vocab-img-scene-${{ github.event.inputs.model || 'default' }}", cancel-in-progress: false }   # A/B: mỗi mô hình một nhóm → chạy song song
env:
  MODE: ${{ github.event.inputs.mode || (github.event_name == 'schedule' && 'fill') || 'pilot' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      per: ${{ steps.p.outputs.per }}
      skip: ${{ steps.p.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        if: github.event.inputs.mode == 'fill' || github.event_name == 'schedule'
      - id: probe
        if: github.event.inputs.mode == 'fill' || github.event_name == 'schedule'
        run: PROBE_SHARE=0.5 PROBE_QUICK=1 node scripts/lib/cf-pool-probe.mjs
        env: { CF_POOL: '${{ secrets.CF_POOL }}' }
      - id: p
        env: { PROBE_ALIVE: '${{ steps.probe.outputs.alive || 99 }}' }
        run: |
          n=${{ github.event.inputs.shards || '1' }}; [ "$n" -gt 10 ] && n=10; [ "$n" -lt 1 ] && n=1
          if [ -n "${{ github.event.inputs.from_run }}" ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo 'shards=[0]' >> $GITHUB_OUTPUT; exit 0; fi
          # 26/10: lịch fill CHỈ chạy khi chủ bật biến repo VIMG_SCHEDULE=1 (bật lại workflow để chạy thử tay không kéo theo fill 4 lượt/ngày)
          if [ "${{ github.event_name }}" = schedule ] && [ "${{ vars.VIMG_SCHEDULE }}" != 1 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo 'shards=[0]' >> $GITHUB_OUTPUT; exit 0; fi
          # 28/10: fill – dò nhanh PHẦN VẼ của kho (~60 neuron) trước khi bật 10 máy; < 10 tài khoản còn neuron → bỏ lượt (đêm 27/10: 4 lượt rỗng, mỗi lượt cài giám khảo 10 máy rồi mới thấy kho cạn)
          if [ "$MODE" = fill ] && [ "$PROBE_ALIVE" -lt 10 ]; then echo "⏹ phần vẽ của kho CF còn $PROBE_ALIVE tài khoản – bỏ lượt"; echo "skip=1" >> $GITHUB_OUTPUT; echo 'shards=[0]' >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$MODE" = fill ]; then n=${{ github.event.inputs.shards || '10' }}; [ "$n" -gt 10 ] && n=10; [ "$n" -lt 1 ] && n=1; fi
          echo "shards=$(node -e "console.log(JSON.stringify([...Array($n).keys()]))")" >> $GITHUB_OUTPUT
          G='${{ github.event.inputs.max_gc }}'; [ -z "$G" ] && { [ "$MODE" = fill ] && G=6000 || G=400; }
          echo "per=$(( G / n ))" >> $GITHUB_OUTPUT
  prep:
    needs: plan
    if: needs.plan.outputs.skip != '1' && github.event_name != 'schedule' && github.event.inputs.mode != 'fill' && github.event.inputs.mode != 'rejudge'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEXKITE_DRIVE_CLI_KEY: ${{ secrets.LEXKITE_DRIVE_CLI_KEY }}
      # 26/10: GrabCast 500 cho 700/700 ảnh → mặc định cf (Workers AI thẳng); lịch (fill) dùng vars.VIMG_PROVIDER
      GRABCAST_AI_KEY: ${{ (github.event.inputs.provider || vars.VIMG_PROVIDER || 'cf') == 'grabcast' && secrets.GRABCAST_AI_KEY || '' }}
      CF_POOL: ${{ secrets.CF_POOL }}
      VIMG_POOL_SKIP: '0'      # chủ 26/10: kho CF chỉ Lexkite dùng → dùng MỌI tài khoản,
      VIMG_CF_UNCAPPED: '1'    #   vẽ tới khi Cloudflare báo hết neuron ngày (4006) rồi chuyển tài khoản
      VIMG_CONSENSUS: '1'      # 26/10: giám khảo KÉP đối chứng cho ảnh trượt cổng mềm (local_judge.py consensus)
      VIMG_DRAW_SHARE: '0.5'   # 26/10: vẽ 60 % đầu kho; 40 % đuôi luôn còn cho giám khảo thị giác (đuôi→) + văn bản/kho từ (từ 60 %→) – lượt 26/10 vẽ cạn kho → 0 ảnh được chấm
      CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_2 }}
      CF_AI_TOKEN_2: ${{ secrets.CF_AI_TOKEN_2 }}
      VIMG_MAX_CF: ${{ (github.event.inputs.provider || vars.VIMG_PROVIDER || 'cf') == 'cf' && needs.plan.outputs.per || '0' }}
      AI_POOL_CF2_NEURONS: '150000'   # ai-pool tuyến cf2 = kho CF_POOL (thẻ cảnh văn bản) – trần mỗi việc (lease ghi LEASE_AI_B_NEURONS=0)
      LEASE_SHARD: prep
      VIMG_MAX_GC: ${{ needs.plan.outputs.per }}
      VIMG_MAX_CF2: '0'
      VIMG_MAX_MAIN: '0'   # KHÔNG BAO GIỜ Workers AI tài khoản chính
      VIMG_MODEL: ${{ github.event.inputs.model || vars.VIMG_MODEL || 'flux-2-klein-4b' }}   # A/B 26/10: klein-4b thắng (phẳng, nền kem, đúng bảng màu)
      AI_POOL_GC_MAX: '60'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OUT: out/vimg-scene
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/vocab-img-scene.yml }
      - name: Thuê (điều phối – mỗi việc ma trận một lượt thuê)
        id: lease
        run: node scripts/jobs/lease.mjs acquire vocab-img-scene --force
      - name: Bộ nhớ đệm trọng số mô hình (CLIP, SmolVLM, MiniLM, NSFW)
        if: steps.lease.outputs.skip != '1'
        uses: actions/cache@v4
        with: { path: '~/.cache/huggingface', key: vimg-judge-models-v1 }
      - name: Cài giám khảo cục bộ (CPU)
        if: steps.lease.outputs.skip != '1'
        run: |
          sudo apt-get install -y -qq tesseract-ocr librsvg2-bin >/dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.4.1 torchvision==0.19.1
          pip install -q open_clip_torch==2.26.1 transformers==4.51.3 sentence-transformers==3.4.1 num2words==0.5.14 imagehash==4.3.1 pytesseract==0.3.13 pillow-avif-plugin==1.4.6 'numpy<2'
      - name: Kho từ vựng + chọn khoá
        if: steps.lease.outputs.skip != '1'
        env: { ONLY: '${{ github.event.inputs.only }}', VIMG_MODEL: '${{ github.event.inputs.model }}' }
        run: |
          { node scripts/build-lexicon.mjs --write >/dev/null || { [ -s dist/lexicon.json ] && echo "::warning::cổng kho từ (dict-consistency) đỏ – ảnh vẫn dùng dist/lexicon.json đã ghi"; }; }
          IFS=: read -r PN PF PFN <<< "${{ github.event.inputs.pick || '60:0:20' }}"
          node scripts/vocab-img/scene.mjs --pilot --n ${PN:-60} --from ${PF:-0} --fn ${PFN:-20} > pilot.json
          EXTRA="$( [ "${ONLY#+}" != "$ONLY" ] && echo "${ONLY#+}" )" node -e "const p=require('./pilot.json'),x=(process.env.EXTRA||'').split(',').filter(Boolean),t=require('./content/lexicon/topics.json').topics,c=require('fs').readdirSync('content/confidence/units').map(f=>'conf:'+f.replace('.json',''));p.scene=[...new Set([...p.scene,...x])];require('fs').writeFileSync('keys.json',JSON.stringify({items:[...new Set([...p.items,...x])].concat(t.map(x=>'topic:'+x.id),c),scene:p.scene}))"
          if [ -n "$ONLY" ] && [ "${ONLY#+}" = "$ONLY" ]; then   # A/B mô hình: đúng danh sách (vd. pilot-40) – không bìa/bài học/hư từ
            node -e "const fs=require('fs'),o=process.env.ONLY.trim(),ks=/\.json$/.test(o)?(JSON.parse(fs.readFileSync(o,'utf8')).items||JSON.parse(fs.readFileSync(o,'utf8'))):o.split(',').map(s=>s.trim()).filter(Boolean);if(!ks.length)throw new Error('only rỗng');fs.writeFileSync('keys.json',JSON.stringify({items:ks,scene:ks}))"
          fi
          echo "khoá: $(node -p "require('./keys.json').items.length") · model: ${VIMG_MODEL:-flux-1-schnell (mặc định)}"
      - name: Thẻ cảnh (câu ví dụ → mô tả hình; GrabCast văn bản)
        if: steps.lease.outputs.skip != '1' && env.MODE == 'pilot'
        run: node scripts/vocab-img/scene.mjs --cards --keys keys.json --write
      - name: Hiệu chỉnh ngưỡng (tập gán nhãn ~180 ảnh)
        if: steps.lease.outputs.skip != '1' && (env.MODE == 'calibrate' || github.event.inputs.recal == '1')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for r in fill:40069944527 pilot2:40059373319; do n=${r%%:*}; id=${r##*:}
            gh run download $id -R ${{ github.repository }} -D lab/$n || echo "::warning::không tải được artifact $id"; done
          f=$(find lab/fill -type d -name raw | head -1); p=$(find lab/pilot2 -type d -name raw | head -1)
          cd scripts/vocab-img && python3 calibrate.py --img fill=$GITHUB_WORKSPACE/$f --img pilot2=$GITHUB_WORKSPACE/$p --write 2>&1 | tail -25 && mv calibration.json $GITHUB_WORKSPACE/
      - uses: actions/upload-artifact@v4
        if: always() && steps.lease.outputs.skip != '1'
        with: { name: vimg-scene-prep, retention-days: 14, path: "content/lexicon/vimg-scenes.json\ncontent/lexicon/vimg-judge.json\ncalibration.json\nkeys.json" }
      - name: Trả thuê
        if: always() && steps.lease.outputs.skip != '1'
        run: node scripts/jobs/lease.mjs release vocab-img-scene --status "${{ job.status }}"
  shard:
    needs: [plan, prep]
    if: needs.plan.outputs.skip != '1' && github.event.inputs.mode != 'calibrate' && github.event.inputs.mode != 'fill' && github.event_name != 'schedule' && github.event.inputs.mode != 'rejudge'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5   # 27/10 chủ: ảnh ≤ 5/20 máy GitHub; ngân sách runner nền (docs/METHODS.md §4)
      matrix: { shard: '${{ fromJSON(needs.plan.outputs.shards) }}' }
    env:
      LEXKITE_DRIVE_CLI_KEY: ${{ secrets.LEXKITE_DRIVE_CLI_KEY }}
      # 26/10: GrabCast 500 cho 700/700 ảnh → mặc định cf (Workers AI thẳng); lịch (fill) dùng vars.VIMG_PROVIDER
      GRABCAST_AI_KEY: ${{ (github.event.inputs.provider || vars.VIMG_PROVIDER || 'cf') == 'grabcast' && secrets.GRABCAST_AI_KEY || '' }}
      CF_POOL: ${{ secrets.CF_POOL }}
      VIMG_POOL_SKIP: '0'      # chủ 26/10: kho CF chỉ Lexkite dùng → dùng MỌI tài khoản,
      VIMG_CF_UNCAPPED: '1'    #   vẽ tới khi Cloudflare báo hết neuron ngày (4006) rồi chuyển tài khoản
      VIMG_CONSENSUS: '1'      # 26/10: giám khảo KÉP đối chứng cho ảnh trượt cổng mềm (local_judge.py consensus)
      VIMG_DRAW_SHARE: '0.5'   # 26/10: vẽ 60 % đầu kho; 40 % đuôi luôn còn cho giám khảo thị giác (đuôi→) + văn bản/kho từ (từ 60 %→) – lượt 26/10 vẽ cạn kho → 0 ảnh được chấm
      CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_2 }}
      CF_AI_TOKEN_2: ${{ secrets.CF_AI_TOKEN_2 }}
      VIMG_MAX_CF: ${{ (github.event.inputs.provider || vars.VIMG_PROVIDER || 'cf') == 'cf' && needs.plan.outputs.per || '0' }}
      AI_POOL_CF2_NEURONS: '150000'   # ai-pool tuyến cf2 = kho CF_POOL (thẻ cảnh văn bản) – trần mỗi việc (lease ghi LEASE_AI_B_NEURONS=0)
      LEASE_SHARD: ${{ matrix.shard }}
      VIMG_MAX_GC: ${{ needs.plan.outputs.per }}
      VIMG_MAX_CF2: '0'
      VIMG_MAX_MAIN: '0'   # KHÔNG BAO GIỜ Workers AI tài khoản chính
      VIMG_MODEL: ${{ github.event.inputs.model || vars.VIMG_MODEL || 'flux-2-klein-4b' }}   # A/B 26/10: klein-4b thắng (phẳng, nền kem, đúng bảng màu)
      AI_POOL_GC_MAX: '60'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OUT: out/vimg-scene
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/vocab-img-scene.yml }
      - name: Thuê (điều phối – mỗi việc ma trận một lượt thuê)
        id: lease
        run: node scripts/jobs/lease.mjs acquire vocab-img-scene --force
      - name: Bộ nhớ đệm trọng số mô hình (CLIP, SmolVLM, MiniLM, NSFW)
        if: steps.lease.outputs.skip != '1'
        uses: actions/cache@v4
        with: { path: '~/.cache/huggingface', key: vimg-judge-models-v1 }
      - name: Cài giám khảo cục bộ (CPU)
        if: steps.lease.outputs.skip != '1'
        run: |
          sudo apt-get install -y -qq tesseract-ocr librsvg2-bin >/dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.4.1 torchvision==0.19.1
          pip install -q open_clip_torch==2.26.1 transformers==4.51.3 sentence-transformers==3.4.1 num2words==0.5.14 imagehash==4.3.1 pytesseract==0.3.13 pillow-avif-plugin==1.4.6 'numpy<2'
      - name: Kho từ vựng + chọn khoá
        if: steps.lease.outputs.skip != '1'
        env: { ONLY: '${{ github.event.inputs.only }}', VIMG_MODEL: '${{ github.event.inputs.model }}' }
        run: |
          { node scripts/build-lexicon.mjs --write >/dev/null || { [ -s dist/lexicon.json ] && echo "::warning::cổng kho từ (dict-consistency) đỏ – ảnh vẫn dùng dist/lexicon.json đã ghi"; }; }
          IFS=: read -r PN PF PFN <<< "${{ github.event.inputs.pick || '60:0:20' }}"
          node scripts/vocab-img/scene.mjs --pilot --n ${PN:-60} --from ${PF:-0} --fn ${PFN:-20} > pilot.json
          EXTRA="$( [ "${ONLY#+}" != "$ONLY" ] && echo "${ONLY#+}" )" node -e "const p=require('./pilot.json'),x=(process.env.EXTRA||'').split(',').filter(Boolean),t=require('./content/lexicon/topics.json').topics,c=require('fs').readdirSync('content/confidence/units').map(f=>'conf:'+f.replace('.json',''));p.scene=[...new Set([...p.scene,...x])];require('fs').writeFileSync('keys.json',JSON.stringify({items:[...new Set([...p.items,...x])].concat(t.map(x=>'topic:'+x.id),c),scene:p.scene}))"
          if [ -n "$ONLY" ] && [ "${ONLY#+}" = "$ONLY" ]; then   # A/B mô hình: đúng danh sách (vd. pilot-40) – không bìa/bài học/hư từ
            node -e "const fs=require('fs'),o=process.env.ONLY.trim(),ks=/\.json$/.test(o)?(JSON.parse(fs.readFileSync(o,'utf8')).items||JSON.parse(fs.readFileSync(o,'utf8'))):o.split(',').map(s=>s.trim()).filter(Boolean);if(!ks.length)throw new Error('only rỗng');fs.writeFileSync('keys.json',JSON.stringify({items:ks,scene:ks}))"
          fi
          echo "khoá: $(node -p "require('./keys.json').items.length") · model: ${VIMG_MODEL:-flux-1-schnell (mặc định)}"
      - name: Thẻ cảnh + ngưỡng từ bước chuẩn bị (MỘT bộ cho mọi việc ma trận)
        if: steps.lease.outputs.skip != '1'
        uses: actions/download-artifact@v4
        with: { name: vimg-scene-prep, path: prep }
      - if: steps.lease.outputs.skip != '1'
        run: |
          cp prep/content/lexicon/vimg-scenes.json content/lexicon/ 2>/dev/null || true
          cp prep/content/lexicon/vimg-judge.json content/lexicon/ 2>/dev/null || true
          cp prep/keys.json keys.json 2>/dev/null || true
      - name: Vẽ lần 1
        if: steps.lease.outputs.skip != '1' && env.MODE == 'pilot'
        run: node scripts/vocab-img/scene-gen.mjs --keys keys.json --out $OUT --attempt 1 --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Giám khảo cục bộ lần 1
        if: steps.lease.outputs.skip != '1' && env.MODE == 'pilot'
        run: python3 scripts/vocab-img/local_judge.py --dir $OUT --attempt 1
      - name: Vẽ lại 1 lần (prompt tinh) + chấm lần 2
        if: steps.lease.outputs.skip != '1' && env.MODE == 'pilot' && github.event.inputs.variants != '1'
        run: |
          node scripts/vocab-img/scene-gen.mjs --keys keys.json --out $OUT --attempt 2 --shard ${{ matrix.shard }}/${{ strategy.job-total }} --only $OUT/retry.json || true
          ls $OUT/raw/*.a2.jpg >/dev/null 2>&1 && python3 scripts/vocab-img/local_judge.py --dir $OUT --attempt 2 || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.lease.outputs.skip != '1'
        with:
          name: vimg-scene-${{ matrix.shard }}
          retention-days: 14
          path: |
            out/vimg-scene/
            content/lexicon/vimg-scenes.json
            content/lexicon/vimg-judge.json
            calibration.json
            keys.json
            reports/
      - name: Trả thuê
        if: always() && steps.lease.outputs.skip != '1'
        run: node scripts/jobs/lease.mjs release vocab-img-scene --status "${{ job.status }}"
  fill:
    # lượt fill: mỗi việc ma trận thuê riêng (LEASE_SHARD), nghĩa của shard = fnv(k) % n; trần ảnh việc = per (gồm MỌI biến thể)
    needs: plan
    if: needs.plan.outputs.skip != '1' && (github.event_name == 'schedule' || github.event.inputs.mode == 'fill')
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 5   # 27/10 chủ: ảnh không giữ quá 5/20 máy GitHub – npm test/Prod release không phải xếp hàng
      matrix: { shard: '${{ fromJSON(needs.plan.outputs.shards) }}' }
    env:
      LEXKITE_DRIVE_CLI_KEY: ${{ secrets.LEXKITE_DRIVE_CLI_KEY }}
      # 26/10: GrabCast 500 cho 700/700 ảnh → mặc định cf (Workers AI thẳng); lịch (fill) dùng vars.VIMG_PROVIDER
      GRABCAST_AI_KEY: ${{ (github.event.inputs.provider || vars.VIMG_PROVIDER || 'cf') == 'grabcast' && secrets.GRABCAST_AI_KEY || '' }}
      CF_POOL: ${{ secrets.CF_POOL }}
      VIMG_POOL_SKIP: '0'      # chủ 26/10: kho CF chỉ Lexkite dùng → dùng MỌI tài khoản,
      VIMG_CF_UNCAPPED: '1'    #   vẽ tới khi Cloudflare báo hết neuron ngày (4006) rồi chuyển tài khoản
      VIMG_CONSENSUS: '1'      # 26/10: giám khảo KÉP đối chứng cho ảnh trượt cổng mềm (local_judge.py consensus)
      VIMG_DRAW_SHARE: '0.5'   # 26/10: vẽ 60 % đầu kho; 40 % đuôi luôn còn cho giám khảo thị giác (đuôi→) + văn bản/kho từ (từ 60 %→) – lượt 26/10 vẽ cạn kho → 0 ảnh được chấm
      CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_2 }}
      CF_AI_TOKEN_2: ${{ secrets.CF_AI_TOKEN_2 }}
      VIMG_MAX_CF: ${{ (github.event.inputs.provider || vars.VIMG_PROVIDER || 'cf') == 'cf' && needs.plan.outputs.per || '0' }}
      AI_POOL_CF2_NEURONS: '150000'   # ai-pool tuyến cf2 = kho CF_POOL (thẻ cảnh văn bản) – trần mỗi việc (lease ghi LEASE_AI_B_NEURONS=0)
      LEASE_SHARD: ${{ matrix.shard }}
      PER: ${{ needs.plan.outputs.per }}
      NSH: ${{ strategy.job-total }}
      V: ${{ github.event.inputs.variants || '6' }}   # 26/10: klein ~6 %/ảnh qua giám khảo nghiêm → 6 biến thể/lượt; trượt hết → hàng chờ, thử lại sau VIMG_QUEUE_RETRY_DAYS
      VIMG_MAX_CF2: '0'
      VIMG_MAX_MAIN: '0'   # KHÔNG BAO GIỜ Workers AI tài khoản chính
      VIMG_MODEL: ${{ github.event.inputs.model || vars.VIMG_MODEL || 'flux-2-klein-4b' }}   # A/B 26/10: klein-4b thắng (phẳng, nền kem, đúng bảng màu)
      # GrabCast 24/10: 115k/ngày/khoá, generate 300/phút/IP (mỗi runner 1 IP), ảnh 60/phút/IP, vision 120/phút/IP – thẻ cảnh trước đây dừng ~110/lượt vì AI_POOL_GC_MAX 60
      AI_POOL_GC_MAX: '1500'
      VIMG_CONC: '6'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OUT: out/vimg-fill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/vocab-img-scene.yml }
      - name: Thuê (điều phối – mỗi việc ma trận một lượt thuê)
        id: lease
        run: node scripts/jobs/lease.mjs acquire vocab-img-scene ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - uses: actions/cache@v4
        if: steps.lease.outputs.skip != '1'
        with: { path: '~/.cache/huggingface', key: vimg-judge-models-v1 }
      - name: Cài giám khảo cục bộ (CPU)
        if: steps.lease.outputs.skip != '1'
        run: |
          sudo apt-get install -y -qq tesseract-ocr librsvg2-bin >/dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.4.1 torchvision==0.19.1
          pip install -q open_clip_torch==2.26.1 transformers==4.51.3 sentence-transformers==3.4.1 num2words==0.5.14 imagehash==4.3.1 pytesseract==0.3.13 pillow-avif-plugin==1.4.6 'numpy<2'
      - name: Nghĩa còn thiếu ảnh (shard) + thẻ cảnh
        if: steps.lease.outputs.skip != '1'
        run: |
          { node scripts/build-lexicon.mjs --write >/dev/null || { [ -s dist/lexicon.json ] && echo "::warning::cổng kho từ (dict-consistency) đỏ – ảnh vẫn dùng dist/lexicon.json đã ghi"; }; }
          NK=$(( PER / 3 )); [ "$NK" -lt 5 ] && NK=5
          node scripts/vocab-img/scene.mjs --gaps $NK --shard ${{ matrix.shard }}/$NSH > keys.json
          echo "nghĩa: $(node -p "require('./keys.json').items.length")"
          node scripts/vocab-img/scene.mjs --cards --keys keys.json --write
          mkdir -p $OUT && cp content/lexicon/vimg-scenes.json $OUT/cards.s${{ matrix.shard }}.json
      - name: Biến thể 1..V – vẽ, chấm, nhận biến thể đầu qua giám khảo
        if: steps.lease.outputs.skip != '1'
        run: |
          T0=$(date +%s)
          for a in $(seq 1 $V); do
            node -e "const fs=require('fs'),O=process.env.OUT,ks=require('./keys.json').items,sc=require('./content/lexicon/vimg-scenes.json').items,ok=new Set();for(let a=1;a<=6;a++){const f=O+'/judge.local.a'+a+'.json';if(fs.existsSync(f))for(const[k,v]of Object.entries(JSON.parse(fs.readFileSync(f,'utf8'))))if(v.pass)ok.add(k)}fs.writeFileSync('pending.json',JSON.stringify({items:ks.filter(k=>sc[k]&&!sc[k].skip&&!ok.has(k))}))"
            P=$(node -p "require('./pending.json').items.length"); USED=$(node -e "const fs=require('fs'),O=process.env.OUT;console.log(fs.readdirSync(O).filter(f=>/^gen-stats\./.test(f)).reduce((a,f)=>{const g=JSON.parse(fs.readFileSync(O+'/'+f,'utf8'));return a+g.gc.submit+((g.cf&&g.cf.ok)||0)},0))")
            LEFT=$(( PER - ${USED:-0} )); echo "biến thể $a: còn $P nghĩa · đã gọi ${USED:-0}/$PER"
            [ "$P" -eq 0 ] && break; [ "$LEFT" -le 0 ] && { echo "⏹ hết trần ảnh việc"; break; }; [ $(( $(date +%s) - T0 )) -gt 5400 ] && { echo "⏹ hết giờ"; break; }
            VIMG_MAX_GC=$LEFT VIMG_MAX_CF=$LEFT node scripts/vocab-img/scene-gen.mjs --keys keys.json --out $OUT --attempt $a --shard ${{ matrix.shard }}/$NSH --only pending.json || true
            ls $OUT/raw/*.a$a.jpg >/dev/null 2>&1 && python3 scripts/vocab-img/local_judge.py --dir $OUT --attempt $a | tail -2 || true
            [ -f $OUT/EXHAUSTED ] && { echo "⏹ bể neuron CF cạn (ai_exhausted) – dừng sạch"; break; }
            grep -l '"vision_dead": true' $OUT/judge-api.a$a.*.json >/dev/null 2>&1 && { echo "⏹ giám khảo thị giác hết neuron – không vẽ thêm ảnh không ai chấm"; touch $OUT/EXHAUSTED; break; }
          done
          true   # vòng lặp kết thúc bằng phép kiểm false → không để bước báo lỗi giả
      - uses: actions/upload-artifact@v4
        if: always() && steps.lease.outputs.skip != '1'
        with: { name: 'vimg-fill-${{ matrix.shard }}', retention-days: 14, path: "out/vimg-fill/\nkeys.json" }
      - name: Trả thuê
        if: always() && steps.lease.outputs.skip != '1'
        run: node scripts/jobs/lease.mjs release vocab-img-scene --status "${{ job.status }}"
  rejudge:
    # 26/10: soát giám khảo KÉP đối chứng trên ảnh lượt cũ (lab_run, danh sách phẩy) – không vẽ, không đăng
    needs: plan
    if: github.event.inputs.mode == 'rejudge'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read, actions: read }
    env:
      CF_POOL: ${{ secrets.CF_POOL }}
      VIMG_POOL_SKIP: '0'
      VIMG_CONSENSUS: '1'
      VIMG_VISION: cf
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/vocab-img-scene.yml }
      - uses: actions/cache@v4
        with: { path: '~/.cache/huggingface', key: vimg-judge-models-v1 }
      - run: |
          sudo apt-get install -y -qq tesseract-ocr librsvg2-bin fonts-dejavu-core >/dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.4.1 torchvision==0.19.1
          pip install -q open_clip_torch==2.26.1 transformers==4.51.3 sentence-transformers==3.4.1 num2words==0.5.14 imagehash==4.3.1 pytesseract==0.3.13 pillow-avif-plugin==1.4.6 'numpy<2'
      - name: Chấm lại bằng giám khảo kép + tờ soát
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          { node scripts/build-lexicon.mjs --write >/dev/null || [ -s dist/lexicon.json ]; }
          mkdir -p rj
          for id in $(echo "${{ github.event.inputs.lab_run }}" | tr ',' ' '); do
            gh run download $id -R ${{ github.repository }} -n vimg-scene-final -D rj/$id || { echo "::warning::không tải được $id"; continue; }
            rm -f rj/$id/judge.local.a1.json
            python3 scripts/vocab-img/local_judge.py --dir rj/$id --attempt 1 | tail -1
            python3 scripts/vocab-img/cons_sheet.py --dir rj/$id --out rj/cons-$id.jpg
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vimg-rejudge, retention-days: 14, path: "rj/cons-*.jpg\nrj/*/judge.local.a1.json" }
  fillpub:
    needs: [plan, fill]
    if: always() && needs.plan.outputs.skip != '1' && (github.event_name == 'schedule' || github.event.inputs.mode == 'fill')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: write, actions: write }   # actions: write = tự nối lượt (workflow_dispatch)
    concurrency: { group: vocab-img-publish, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y -qq librsvg2-bin fonts-dejavu-core >/dev/null && pip install -q pillow==11.3.0 pillow-avif-plugin==1.4.6 'numpy<2'
      - uses: actions/download-artifact@v4
        with: { pattern: 'vimg-fill-[0-9]*', path: parts }
      - name: Gộp + mã hoá ≤ 6 KB + tờ ảnh 40 ảnh nhận
        run: |
          mkdir -p m/raw m/svg
          for d in parts/*/; do cp -n $d/out/vimg-fill/raw/* m/raw/ 2>/dev/null || true; cp -n $d/out/vimg-fill/svg/* m/svg/ 2>/dev/null || true; cp $d/out/vimg-fill/gen-stats.*.json $d/out/vimg-fill/speed.*.json $d/out/vimg-fill/cards.*.json $d/out/vimg-fill/judge-api.*.json m/ 2>/dev/null || true
            for f in $d/out/vimg-fill/judge.local.a*.json $d/out/vimg-fill/targets.json; do [ ! -f "$f" ] || python3 -c "import json,sys,os;o='m/'+os.path.basename(sys.argv[1]);a=json.load(open(o)) if os.path.exists(o) else {};a.update(json.load(open(sys.argv[1])));json.dump(a,open(o,'w'))" $f; done; done
          [ -f m/targets.json ] || { echo "::warning::không có việc nào chạy (thuê bị từ chối?)"; exit 0; }
          python3 scripts/vocab-img/scene_final.py --dir m --sheet m/fill-sheet.jpg --sheet-max 40 | tail -2
      - name: Đẩy ảnh lên kho media (m4, deploy key) → chỉ mục img.json
        env: { K: '${{ secrets.MEDIA4_DEPLOY_KEY }}', LEX_CDN_CHECK: '0' }
        run: |
          [ -f m/result.json ] || exit 0
          node scripts/vocab-img/scene-publish.mjs --dir m --stage .media-out
          if [ -n "$(ls .media-out/vimg 2>/dev/null)" ]; then
            [ -n "$K" ] || { echo "::error::thiếu secret MEDIA4_DEPLOY_KEY"; exit 1; }
            install -m 600 /dev/null $RUNNER_TEMP/m4key && printf '%s\n' "$K" > $RUNNER_TEMP/m4key
            MEDIA_KEY_M4=$RUNNER_TEMP/m4key node scripts/media/push.mjs --src .media-out --kind img --msg "vimg: lượt fill ${{ github.run_id }}"
            h=$(ls .media-out/vimg | head -1); for i in $(seq 1 20); do c=$(curl -s -o /dev/null -w '%{http_code}' https://media.lexkite.com/vimg/$h); [ "$c" = 200 ] && break; sleep 15; done; echo "CDN $h → $c"
          fi
          node scripts/vocab-img/scene-publish.mjs --dir m --index --variants ${{ github.event.inputs.variants || '6' }}
          { node scripts/build-lexicon.mjs --write >/dev/null || { [ -s dist/lexicon.json ] && echo "::warning::cổng kho từ (dict-consistency) đỏ – ảnh vẫn dùng dist/lexicon.json đã ghi"; }; }
          git config user.name lexkite-bot; git config user.email lexkite-bot@users.noreply.github.com
          git add content/lexicon/img.json content/lexicon/vimg-scenes.json content/lexicon/vimg-scene-queue.json web/js/lexicon-img.json extension/app/js/lexicon-img.json
          git diff --cached --quiet && exit 0
          git commit -qm "Ảnh cảnh theo nghĩa: lượt fill ${{ github.run_id }} ($(node -p "require('./m/fill-report.json').accepted") ảnh) [CF-Pages-Skip]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i * 10)); done
      - name: Kho ảnh gốc cho video (GitHub Release 'vimg-masters' – miễn phí, không vào Pages/kho media)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          [ -f m/result.json ] || exit 0
          python3 scripts/vocab-img/masters.py --dir m --out vimg-masters-${{ github.run_id }}.zip --run ${{ github.run_id }}
          gh release view vimg-masters -R ${{ github.repository }} >/dev/null 2>&1 || gh release create vimg-masters -R ${{ github.repository }} --title 'Kho ảnh gốc từ vựng (video)' --notes 'Ảnh cảnh đã qua giám khảo, ≤768 px WebP + manifest.json mỗi lượt fill. Dùng cho video giảng dạy (docs/VOCAB-IMG-STYLE.md §11).' --prerelease
          gh release upload vimg-masters vimg-masters-${{ github.run_id }}.zip -R ${{ github.repository }} --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vimg-fill-final, retention-days: 14, path: "m/result.json\nm/fill-report.json\nm/fill-sheet.jpg\nm/gen-stats.*.json\nm/judge-api.*.json\nm/speed.*.json\nm/final/" }
      - name: Tự nối lượt (vắt hết kho CF trong ngày – cron GitHub hay trễ/bỏ lượt)
        env: { GH_TOKEN: '${{ github.token }}', CHAIN: '${{ vars.VIMG_CHAIN }}' }
        run: |
          [ "$CHAIN" = 0 ] && { echo "chuỗi tắt (VIMG_CHAIN=0)"; exit 0; }
          H=$(date -u +%H); [ "$H" -lt 2 ] && { echo "00–02 UTC: nhường kho từ (lexicon-expand 00:12) – cron 02:40 nối tiếp"; exit 0; }   # so trong bash: biểu thức GitHub coi '' == '0' → bước bị bỏ (26/10)
          if ls parts/*/out/vimg-fill/EXHAUSTED >/dev/null 2>&1; then echo "⏹ kho CF hết neuron ngày – chờ cron sau 00:00 UTC"; exit 0; fi
          { node scripts/build-lexicon.mjs --write >/dev/null || { [ -s dist/lexicon.json ] && echo "::warning::cổng kho từ (dict-consistency) đỏ – ảnh vẫn dùng dist/lexicon.json đã ghi"; }; }
          G=$(node scripts/vocab-img/scene.mjs --gaps 1 --shard 0/1 | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).items.length")
          [ "$G" -gt 0 ] || { echo "✓ không còn nghĩa thiếu ảnh (trừ hàng chờ) – dừng chuỗi"; exit 0; }
          gh workflow run vocab-img-scene.yml -R ${{ github.repository }} --ref main -f mode=fill -f shards=10 -f max_gc=6000 -f variants=6 -f provider=cf
          echo "↻ đã gọi lượt fill kế tiếp"
  labfeat:
    # đặc trưng giám khảo CẢNH (CLIP↔câu, chú thích↔câu, thị giác có/không) cho ảnh của lượt cũ đã gán nhãn – đầu vào calibrate_scene.py
