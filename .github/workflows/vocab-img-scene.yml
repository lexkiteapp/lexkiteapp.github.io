          done
          cp content/lexicon/vimg-scenes.json $OUT/cards.s${{ matrix.shard }}.json   # thẻ viết lại (--refix) vào lượt đăng (cardWins)
          true   # vòng lặp kết thúc bằng phép kiểm false → không để bước báo lỗi giả
      - uses: actions/upload-artifact@v4
        if: always() && steps.lease.outputs.skip != '1'
        with: { name: 'vimg-fill-${{ matrix.shard }}', retention-days: 14, path: "out/vimg-fill/\nkeys.json" }
      - name: Trả thuê
        if: always() && steps.lease.outputs.skip != '1'
        run: node scripts/jobs/lease.mjs release vocab-img-scene --status "${{ job.status }}"
  rejudge:
    # 26/10: soát giám khảo KÉP đối chứng trên ảnh lượt cũ (lab_run, danh sách phẩy) – không vẽ, không đăng
    needs: plan
    if: github.event.inputs.mode == 'rejudge'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read, actions: read }
    env:
      CF_POOL: ${{ secrets.CF_POOL }}
      VIMG_POOL_SKIP: '0'
      VIMG_CONSENSUS: '1'
      VIMG_VISION: cf
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/vocab-img-scene.yml }
      - uses: actions/cache@v4
        with: { path: '~/.cache/huggingface', key: vimg-judge-models-v1 }
      - uses: ./.github/actions/apt
        with: { packages: tesseract-ocr librsvg2-bin fonts-dejavu-core }
      - run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.4.1 torchvision==0.19.1
          pip install -q open_clip_torch==2.26.1 transformers==4.51.3 sentence-transformers==3.4.1 num2words==0.5.14 imagehash==4.3.1 pytesseract==0.3.13 pillow-avif-plugin==1.4.6 'numpy<2'
        timeout-minutes: 12
      - name: Chấm lại bằng giám khảo kép + tờ soát
        env: { GH_TOKEN: '${{ github.token }}', LX_LAB_RUN: '${{ github.event.inputs.lab_run }}' }
        run: |
          { node scripts/build-lexicon.mjs --write >/dev/null || [ -s dist/lexicon.json ]; }
          mkdir -p rj
          for id in $(echo "$LX_LAB_RUN" | tr ',' ' '); do
            gh run download $id -R ${{ github.repository }} -n vimg-scene-final -D rj/$id || { echo "::warning::không tải được $id"; continue; }
            rm -f rj/$id/judge.local.a1.json
            python3 scripts/vocab-img/local_judge.py --dir rj/$id --attempt 1 | tail -1
            python3 scripts/vocab-img/cons_sheet.py --dir rj/$id --out rj/cons-$id.jpg
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vimg-rejudge, retention-days: 14, path: "rj/cons-*.jpg\nrj/*/judge.local.a1.json" }
  fillpub:
    needs: [plan, fill]
    if: always() && needs.plan.outputs.skip != '1' && (github.event_name == 'schedule' || github.event.inputs.mode == 'fill')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: write, actions: write }   # actions: write = tự nối lượt (workflow_dispatch)
    concurrency: { group: vocab-img-publish, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { ssh-key: '${{ secrets.BOT_DEPLOY_KEY }}' }   # đẩy main qua SSH khoá deploy (ruleset) – docs/CI-RUNNERS.md › required-gate
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: ./.github/actions/apt
        with: { packages: librsvg2-bin fonts-dejavu-core }
      - run: pip install -q pillow==11.3.0 pillow-avif-plugin==1.4.6 'numpy<2'
        timeout-minutes: 12
      - uses: actions/download-artifact@v4
        with: { pattern: 'vimg-fill-[0-9]*', path: parts }
      - name: Gộp + mã hoá ≤ 6 KB + tờ ảnh 40 ảnh nhận
        run: |
          mkdir -p m/raw m/svg
          for d in parts/*/; do cp -n $d/out/vimg-fill/raw/* m/raw/ 2>/dev/null || true; cp -n $d/out/vimg-fill/svg/* m/svg/ 2>/dev/null || true; cp $d/out/vimg-fill/gen-stats.*.json $d/out/vimg-fill/speed.*.json $d/out/vimg-fill/cards.*.json $d/out/vimg-fill/judge-api.*.json $d/out/vimg-fill/cardstats.*.json m/ 2>/dev/null || true
            for f in $d/out/vimg-fill/judge.local.a*.json $d/out/vimg-fill/targets.json; do [ ! -f "$f" ] || python3 -c "import json,sys,os;o='m/'+os.path.basename(sys.argv[1]);a=json.load(open(o)) if os.path.exists(o) else {};a.update(json.load(open(sys.argv[1])));json.dump(a,open(o,'w'))" $f; done; done
          [ -f m/targets.json ] || { echo "::warning::không có việc nào chạy (thuê bị từ chối?)"; exit 0; }
          python3 scripts/vocab-img/scene_final.py --dir m --sheet m/fill-sheet.jpg --sheet-max 40 | tail -2
      - name: Đẩy ảnh lên kho media (m4, deploy key) → chỉ mục img.json
        env: { K: '${{ secrets.MEDIA4_DEPLOY_KEY }}', LEX_CDN_CHECK: '0', LX_VARIANTS: '${{ github.event.inputs.variants || ''6'' }}' }
        run: |
          [ -f m/result.json ] || exit 0
          node scripts/vocab-img/scene-publish.mjs --dir m --stage .media-out
          if [ -n "$(ls .media-out/vimg 2>/dev/null)" ]; then
            [ -n "$K" ] || { echo "::error::thiếu secret MEDIA4_DEPLOY_KEY"; exit 1; }
            install -m 600 /dev/null $RUNNER_TEMP/m4key && printf '%s\n' "$K" > $RUNNER_TEMP/m4key
            MEDIA_KEY_M4=$RUNNER_TEMP/m4key node scripts/media/push.mjs --src .media-out --kind img --msg "vimg: lượt fill ${{ github.run_id }}"
            # chờ CDN: lỗi mạng của curl (mã 56) KHÔNG được làm đỏ cả bước dưới bash -e (09/11 run 42698529382) – chỉ là vòng thăm dò
            h=$(ls .media-out/vimg | head -1); for i in $(seq 1 20); do c=$(curl -s -o /dev/null -w '%{http_code}' https://media.lexkite.com/vimg/$h || true); [ "$c" = 200 ] && break; sleep 15; done; echo "CDN $h → $c"
          fi
          node scripts/vocab-img/scene-publish.mjs --dir m --index --variants "$LX_VARIANTS"
          { node scripts/build-lexicon.mjs --write >/dev/null || { [ -s dist/lexicon.json ] && echo "::warning::cổng kho từ (dict-consistency) đỏ – ảnh vẫn dùng dist/lexicon.json đã ghi"; }; }
          ACC=$(node -p "require('./m/fill-report.json').accepted" 2>/dev/null || echo 0)
          cp m/fill-report.json "$RUNNER_TEMP/fill-report.json" 2>/dev/null || true
          # img.json/scenes/queue là chỉ mục dùng chung → sinh lại trên main mới nhất (scene-publish --index bỏ qua ảnh đã có) – scripts/ci/commit-regen.sh
          REGEN="node scripts/vocab-img/scene-publish.mjs --dir m --index --variants $LX_VARIANTS >/dev/null && { node scripts/build-lexicon.mjs --write >/dev/null || [ -s dist/lexicon.json ]; } && { cp \"$RUNNER_TEMP/fill-report.json\" m/fill-report.json 2>/dev/null || true; }"
          bash scripts/ci/commit-regen.sh "Ảnh cảnh theo nghĩa: lượt fill ${{ github.run_id }} ($ACC ảnh)" "$REGEN" content/lexicon/img.json content/lexicon/vimg-scenes.json content/lexicon/vimg-scene-queue.json web/js/lexicon-img.json extension/app/js/lexicon-img.json web/js/vimg extension/app/js/vimg
      - name: Kho ảnh gốc cho video (GitHub Release 'vimg-masters' – miễn phí, không vào Pages/kho media)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          [ -f m/result.json ] || exit 0
          python3 scripts/vocab-img/masters.py --dir m --out vimg-masters-${{ github.run_id }}.zip --run ${{ github.run_id }}
          gh release view vimg-masters -R ${{ github.repository }} >/dev/null 2>&1 || gh release create vimg-masters -R ${{ github.repository }} --title 'Kho ảnh gốc từ vựng (video)' --notes 'Ảnh cảnh đã qua giám khảo, ≤768 px WebP + manifest.json mỗi lượt fill. Dùng cho video giảng dạy (docs/VOCAB-IMG-STYLE.md §11).' --prerelease
          gh release upload vimg-masters vimg-masters-${{ github.run_id }}.zip -R ${{ github.repository }} --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vimg-fill-final, retention-days: 14, path: "m/result.json\nm/fill-report.json\nm/fill-sheet.jpg\nm/gen-stats.*.json\nm/judge-api.*.json\nm/speed.*.json\nm/final/" }
      - name: Tự nối lượt (vắt hết kho CF trong ngày – cron GitHub hay trễ/bỏ lượt)
        env: { GH_TOKEN: '${{ github.token }}', CHAIN: '${{ vars.VIMG_CHAIN }}', LX_JUDGE_RUN: '${{ github.event.inputs.judge_run }}' }
        run: |
          [ "$CHAIN" = 0 ] && { echo "chuỗi tắt (VIMG_CHAIN=0)"; exit 0; }
          [ -n "$LX_JUDGE_RUN" ] && { echo "judge_run: không nối lượt vẽ mới"; exit 0; }
          H=$(date -u +%H); [ "$H" -lt 2 ] && { echo "00–02 UTC: nhường kho từ (lexicon-expand 00:12) – cron 02:40 nối tiếp"; exit 0; }   # so trong bash: biểu thức GitHub coi '' == '0' → bước bị bỏ (26/10)
          if ls parts/*/out/vimg-fill/EXHAUSTED >/dev/null 2>&1; then echo "⏹ kho CF hết neuron ngày – chờ cron sau 00:00 UTC"; exit 0; fi
          { node scripts/build-lexicon.mjs --write >/dev/null || { [ -s dist/lexicon.json ] && echo "::warning::cổng kho từ (dict-consistency) đỏ – ảnh vẫn dùng dist/lexicon.json đã ghi"; }; }
          G=$(node scripts/vocab-img/scene.mjs --gaps 1000000 --shard 0/1 | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).items.length")
          ACC=$(node -p "require('./m/fill-report.json').accepted" 2>/dev/null || echo 0)
          echo "chuỗi: còn $G nghĩa vẽ được (cần ≥ $VIMG_MIN_GAPS) · lượt vừa nhận $ACC ảnh (cần ≥ $VIMG_MIN_ACC)"
          [ "$G" -ge "$VIMG_MIN_GAPS" ] && [ "$ACC" -ge "$VIMG_MIN_ACC" ] || { echo "⏹ dừng chuỗi: hết việc thật (cron kế tiếp)"; exit 0; }
          bash scripts/ci/gh-retry.sh gh workflow run vocab-img-scene.yml -R ${{ github.repository }} --ref main -f mode=fill -f shards=10 -f max_gc=6000 -f variants=6 -f provider=cf
          echo "↻ đã gọi lượt fill kế tiếp"
  labfeat:
    # đặc trưng giám khảo CẢNH (CLIP↔câu, chú thích↔câu, thị giác có/không) cho ảnh của lượt cũ đã gán nhãn – đầu vào calibrate_scene.py
    needs: plan
    if: github.event.inputs.lab_run != '' && needs.plan.outputs.skip != '1' && github.event.inputs.mode != 'rejudge'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: read, actions: read, id-token: write }
    env:
      LEXKITE_DRIVE_CLI_KEY: ${{ secrets.LEXKITE_DRIVE_CLI_KEY }}
      # 26/10: GrabCast 500 cho 700/700 ảnh → mặc định cf (Workers AI thẳng); lịch (fill) dùng vars.VIMG_PROVIDER
      GRABCAST_AI_KEY: ${{ (github.event.inputs.provider || vars.VIMG_PROVIDER || 'cf') == 'grabcast' && secrets.GRABCAST_AI_KEY || '' }}
      CF_POOL: ${{ secrets.CF_POOL }}
      GROQ_POOL: ${{ secrets.GROQ_POOL }}       # 07/11: thẻ cảnh văn bản qua kho Groq/Gemini miễn phí (scene.mjs CARD_CHAIN) – neuron CF chỉ để VẼ
      GEMINI_POOL: ${{ secrets.GEMINI_POOL }}
      VIMG_POOL_SKIP: '0'      # chủ 26/10: kho CF chỉ Lexkite dùng → dùng MỌI tài khoản,
      VIMG_CF_UNCAPPED: '1'    #   vẽ tới khi Cloudflare báo hết neuron ngày (4006) rồi chuyển tài khoản
      VIMG_CONSENSUS: '1'      # 26/10: giám khảo KÉP đối chứng cho ảnh trượt cổng mềm (local_judge.py consensus)
      VIMG_DRAW_SHARE: "${{ vars.LX_PILOT == '1' && '0.7' || '0.5' }}"   # 28/10: kho từ pilot (~100k/ngày) → ảnh 70 %; hàng loạt (~600k) → 50 %. Biến chưa đặt = 0.5 (an toàn)   # 26/10: vẽ 60 % đầu kho; 40 % đuôi luôn còn cho giám khảo thị giác (đuôi→) + văn bản/kho từ (từ 60 %→) – lượt 26/10 vẽ cạn kho → 0 ảnh được chấm
      CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_2 }}
      CF_AI_TOKEN_2: ${{ secrets.CF_AI_TOKEN_2 }}
      VIMG_MAX_CF: ${{ (github.event.inputs.provider || vars.VIMG_PROVIDER || 'cf') == 'cf' && needs.plan.outputs.per || '0' }}
      VIMG_STYLE: "${{ github.event.inputs.style || 'liteplus' }}"   # 02/11 lite+ cho MỌI lượt (pilot 92 nghĩa 41396836982: lượt đầu 64,4 % vs 53,3 %, 146 vs 172,5 neuron/ảnh nhận) – input style=e4 quay về
      VIMG_CANDS: ${{ github.event.inputs.cands || '1' }}   # 01/11 hướng b: ứng viên/prompt (scene-gen.mjs → local_judge.py chọn); lịch fill = 1 tới khi pilot chứng minh
      AI_POOL_CF2_NEURONS: '150000'   # ai-pool tuyến cf2 = kho CF_POOL (thẻ cảnh văn bản) – trần mỗi việc (lease ghi LEASE_AI_B_NEURONS=0)
      LEASE_SHARD: lab
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/vocab-img-scene.yml }
      - name: Thuê (điều phối)
        id: lease
        run: node scripts/jobs/lease.mjs acquire vocab-img-scene --force
      - uses: actions/cache@v4
        if: steps.lease.outputs.skip != '1'
        with: { path: '~/.cache/huggingface', key: vimg-judge-models-v1 }
      - uses: ./.github/actions/apt
        with: { packages: tesseract-ocr librsvg2-bin }
        if: steps.lease.outputs.skip != '1'
      - run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.4.1 torchvision==0.19.1
          pip install -q open_clip_torch==2.26.1 transformers==4.51.3 sentence-transformers==3.4.1 num2words==0.5.14 imagehash==4.3.1 pytesseract==0.3.13 pillow-avif-plugin==1.4.6 'numpy<2'
          { node scripts/build-lexicon.mjs --write >/dev/null || { [ -s dist/lexicon.json ] && echo "::warning::cổng kho từ (dict-consistency) đỏ – ảnh vẫn dùng dist/lexicon.json đã ghi"; }; }
        if: steps.lease.outputs.skip != '1'
        timeout-minutes: 12
      - uses: actions/download-artifact@v4
        if: steps.lease.outputs.skip != '1'
        with: { name: vimg-scene-final, path: lab, run-id: '${{ github.event.inputs.lab_run }}', github-token: '${{ github.token }}' }
      - name: Đặc trưng (không phán quyết)
        if: steps.lease.outputs.skip != '1'
        run: |
          rm -f lab/judge.local.a*.json
          python3 scripts/vocab-img/local_judge.py --dir lab --attempt 1 --features-only | tail -3
          python3 scripts/vocab-img/local_judge.py --dir lab --attempt 2 --features-only | tail -3
      - uses: actions/upload-artifact@v4
        if: always() && steps.lease.outputs.skip != '1'
        with: { name: vimg-scene-labfeat, retention-days: 14, path: "lab/judge.local.a*.json\nlab/targets.json" }
      - name: Trả thuê
        if: always() && steps.lease.outputs.skip != '1'
        run: node scripts/jobs/lease.mjs release vocab-img-scene --status "${{ job.status }}"
  final:
    needs: [plan, shard]
    if: always() && (needs.plan.outputs.skip != '1' || github.event.inputs.from_run != '') && github.event.inputs.mode != 'calibrate' && github.event.inputs.mode != 'fill' && github.event_name != 'schedule' && github.event.inputs.mode != 'rejudge'
