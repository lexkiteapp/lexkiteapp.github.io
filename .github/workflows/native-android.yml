# ci-policy: npm-gate – job nặng trên PR chờ npm test xanh cùng sha (job `gate`, 24/11)
# App Android NATIVE (Kotlin + Jetpack Compose, native/android) – build + test trên Ubuntu (không cần máy ảo: Robolectric + Roborazzi).
# Kiểm: vector chuẩn chấm điểm/FSRS khớp web, đủ 15 ngôn ngữ, khung 5 tab, snapshot 390 dp sáng/tối × en/vi/ar/de, build APK debug.
# Spec: docs/specs/native-apps.md. Bản Capacitor đang live vẫn ở mobile/ (android.yml) cho tới khi native đạt parity.
name: Native Android (Compose)
on:
  pull_request:
    paths: ['native/android/**', 'native/shared/**', 'scripts/native/**', 'mobile/android/app/google-services.json', '.github/workflows/native-android.yml']
  push:
    branches: [main]
    paths: ['native/android/**', 'native/shared/**', 'scripts/native/**', 'mobile/android/app/google-services.json', '.github/workflows/native-android.yml']
  workflow_dispatch:
    inputs:
      record: { description: 'Ghi lại ảnh snapshot chuẩn (khi đổi giao diện có chủ đích)', type: boolean, default: false }
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  # npm-gate (24/11, điều phối): làn nhanh trước làn nặng cho app native – PR chỉ mở máy khi `npm test` cùng sha đã XANH (đỏ thì job nặng skipped, không đốt máy macOS/Android);
  # gate chờ (≤ 25 phút, 30 s/lần) vì workflow này không có heavy-rerun; push main/dispatch: go ngay. Lỗi API/hết giờ → mở cổng (không mất kiểm).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ]; then
            for i in $(seq 1 50); do
              c=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[].conclusion // "pending"] | if index("success") then "success" elif (map(select(. == "failure" or . == "cancelled" or . == "timed_out")) | length) > 0 then "red" else "pending" end' 2>/dev/null) || break
              [ "$c" = success ] && break
              [ "$c" = red ] && { go=false; break; }
              sleep 30
            done
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test cùng sha → go=$go"
  android:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Một nguồn – file sinh khớp nguồn web
        run: node scripts/native/gen.mjs --check
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # 20/11 (#1543: 14/185 test đỏ 'Failed to fetch maven artifact org.robolectric:android-all-instrumented' – lỗi tải mạng, không phải mã): Robolectric tải android-all (~100 MB) từ Maven Central MỖI lượt → cache ~/.m2/repository/org/robolectric (chỉ lưu khi job xanh); báo cáo Gradle đã nằm trong artifact native-android-snapshots (build/reports/tests).
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('native/android/**/*.gradle*', 'native/android/gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Test (chuẩn + snapshot)
        working-directory: native/android
        run: |
          N=$(ls app/src/test/snapshots/*.png 2>/dev/null | wc -l)
          if [ "$LX_IN1" = "true" ] || [ "$N" -lt 561 ]; then
            # bấm tay record → ghi lại tất cả; thiếu ảnh (test mới / ảnh đổi có chủ đích đã xoá) → chỉ thêm ảnh còn thiếu, ảnh chuẩn đã commit vẫn được so
            echo "::warning::Ảnh snapshot chuẩn $N/561 → ghi ảnh thiếu rồi kiểm lại; tải artifact native-android-snapshots và commit vào app/src/test/snapshots"
            KEEP="$RUNNER_TEMP/keep"; mkdir -p "$KEEP"
            [ "$LX_IN1" = "true" ] || cp app/src/test/snapshots/*.png "$KEEP/" 2>/dev/null || true
            gradle --no-daemon -q :app:recordRoborazziDebug
            cp "$KEEP"/*.png app/src/test/snapshots/ 2>/dev/null || true
          fi
          gradle --no-daemon :app:verifyRoborazziDebug
          test "$(ls app/src/test/snapshots/*.png | wc -l)" -ge 497 || { echo "::error::thiếu ảnh snapshot"; exit 1; }
        env:
          LX_IN1: ${{ inputs.record }}
      - name: Build APK debug + release (R8 + shrink, không ký, không tải mapping)
        working-directory: native/android
        env: { LEXKITE_CRASHLYTICS_UPLOAD: '0' }
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease && ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-snapshots
          path: |
            native/android/app/src/test/snapshots
            native/android/app/build/reports/tests
            native/android/app/build/outputs/roborazzi
          retention-days: 14
