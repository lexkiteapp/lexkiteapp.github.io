# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🎞️ Cổng chuyển động giáo viên trên WebKit (Safari) – clip WebGL chỗ giáo viên mượt + viền nét (live 3/11: tay Ama giật, viền méo trên iPhone).
# macOS vì WebKit trên Linux không giải mã H.264. PR tự chụp thêm ảnh TRƯỚC từ nhánh base (không chặn); chạy tay với before=<ref>.
name: teacher-motion
on:
  push:
    branches: [main]
    paths: ['web/js/teacher-slot.js', 'web/js/teacher-live.js', 'web/js/characters.js', 'scripts/test/teacher-motion-webkit.mjs', 'web/teach/**', 'scripts/teach/motion_smear.py', 'scripts/teach/refine_clips.py', 'scripts/test/motion-smear-selftest.py']   # clip/đo đổi thì cổng PHẢI chạy trên main (23/11: #1375 đổi clip, cổng không chạy lại, đỏ 3 ngày không ai thấy)
  schedule:
    - cron: '17 21 * * *'   # hằng ngày: clip đỏ lọt vào main bằng đường nào cũng lộ trong ≤ 24 h
  pull_request:
    paths: ['web/js/teacher-slot.js', 'web/js/teacher-live.js', 'web/js/characters.js', 'scripts/teach/motion_smear.py', 'scripts/teach/refine_clips.py', 'scripts/test/motion-smear-selftest.py', 'web/teach/**', 'scripts/test/teacher-motion-webkit.mjs', '.github/workflows/teacher-motion.yml']
  workflow_dispatch:
    inputs:
      before: { description: 'ref để chụp ảnh trước (vd. main), trống = bỏ qua', required: false, default: '' }
permissions:
  contents: read
concurrency: { group: 'teacher-motion-${{ github.ref }}', cancel-in-progress: true }   # ci-policy: lượt cũ cùng nhánh bị huỷ
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-heavy') || contains(github.event.pull_request.labels.*.name, 'ready') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}', FIX: '${{ contains(github.event.pull_request.labels.*.name, ''main-red-fix'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          # máy gác 3/4 (23/11): CÙNG workflow đang ĐỎ trên main → dừng sớm (gate đỏ, 0 job nặng); main-red-retry.mjs chạy lại 1 lần khi main xanh. PR nhãn main-red-fix không bị chặn.
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}"); red=
          if [ "$go" = true ] && [ "$EV" = pull_request ] && [ "$FIX" != true ]; then
            m=$(gh api "repos/$REPO/actions/workflows/$wf/runs?branch=main&event=push&status=completed&per_page=5" --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0].conclusion' 2>/dev/null) || m=
            if [ "$m" = failure ]; then go=false; red=1; echo "::error title=main đỏ – chờ::$wf đang đỏ trên main – dừng sớm, tự chạy lại 1 lần khi main xanh"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
          [ -z "$red" ] || exit 1
  clips:   # khung vung tay méo đo trên chính file clip (không cần trình duyệt)
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ffmpeg
      - name: Cài công cụ
        timeout-minutes: 10
        run: pip install -q numpy opencv-python-headless
      - if: github.event_name == 'pull_request'   # số đo TRƯỚC = clip ở nhánh base (không chặn)
        uses: actions/checkout@v4
        with: { ref: "${{ github.base_ref }}", path: before-src, sparse-checkout: web/teach }
      - name: Số đo trước (không chặn)
        if: github.event_name == 'pull_request'
        run: python3 scripts/teach/motion_smear.py before-src/web/teach --report
      - name: Hồi quy cổng đo (tổng hợp)
        run: python3 scripts/test/motion-smear-selftest.py
      - name: Chạy cổng
        run: python3 scripts/teach/motion_smear.py web/teach
  webkit:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ./.github/actions/playwright-cache
        with: { browsers: webkit }
      - name: Cài playwright webkit
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh webkit
      - if: inputs.before != '' || github.event_name == 'pull_request'   # PR: ảnh trước = nhánh base (workflow chỉ chạy khi file giáo viên đổi)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.before || github.base_ref }}
          path: before-src
          sparse-checkout: |
            web
            scripts/test
      - name: Ảnh trước (không chặn)
        if: inputs.before != '' || github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/test/teacher-motion-webkit.mjs before-src/web out/teacher-motion/before --report
      - name: Chạy cổng
        run: node scripts/test/teacher-motion-webkit.mjs web out/teacher-motion
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: teacher-motion, path: out/teacher-motion, retention-days: 7 }
