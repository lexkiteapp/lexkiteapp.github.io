# Meta Conversions API (docs/META-ADS.md): chép secret GitHub META_CAPI_TOKEN sang secret Cloudflare Pages (nơi Functions chạy) và/hoặc gửi 1 sự kiện THỬ
# vào Events Manager › Test events. Chạy tay; không in token. Secret Pages có hiệu lực ở lần deploy kế tiếp. Cờ ads_meta_capi vẫn TẮT (chủ/điều phối bật ở Quản trị).
name: Meta CAPI – đặt secret & sự kiện thử
on:
  workflow_dispatch:
    inputs:
      sync_secret: { description: 'Chép META_CAPI_TOKEN sang Pages', type: boolean, default: true }
      test_code: { description: 'Mã Test events (Events Manager › Test events, vd TEST12345); để trống = không gửi thử', type: string, default: '' }
concurrency: { group: meta-capi-setup, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts\nfunctions\ninfra", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Chép META_CAPI_TOKEN → Cloudflare Pages
        if: inputs.sync_secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e34e14b7ab35eaf2b3d9d84fcce011f7
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
        run: |
          [ -n "$META_CAPI_TOKEN" ] || { echo "::error::Thiếu secret GitHub META_CAPI_TOKEN"; exit 1; }
          printf '%s' "$META_CAPI_TOKEN" | npx -y wrangler@3.114.0 pages secret put META_CAPI_TOKEN --project-name lexkite > /dev/null && echo "✓ META_CAPI_TOKEN đã đặt ở Pages (hiệu lực từ lần deploy kế tiếp)"
      - name: Sự kiện thử → Test events
        if: inputs.test_code != ''
        env:
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          META_TEST_CODE: ${{ inputs.test_code }}
        run: node scripts/meta/capi-test.mjs
