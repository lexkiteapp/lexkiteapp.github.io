# Tự phân loại workflow đỏ (scripts/ci/triage.mjs) – thay thư "Run failed" từng lượt bằng: chạy lại 1 lần (lỗi tạm thời),
# hoãn tới sau 00:10 UTC (hạn mức D1), 1 issue/workflow nhãn ci-failure (lỗi thật, tự đóng khi xanh lại) + bản tin ngày (Quản trị + 1 thư).
# Không bao giờ lặp: chỉ chạy lại khi run_attempt = 1; triage tự nó luôn thoát 0.
# 2/11: QUÉT định kỳ thay cho workflow_run – trước đó mỗi lượt của ~150 workflow xong sinh 1 lượt ci-triage (~3.400 lượt/ngày, 93 % bị bỏ qua)
# và mỗi lượt đỏ giữ 1 runner ngủ 5 phút. Quét 10 phút phủ MỌI workflow (kể cả workflow mới, không cần danh sách). Test: scripts/test/ci-policy.mjs.
name: ci-triage
on:
  schedule:
    - cron: '*/10 * * * *'  # quét lượt đỏ mới (scan)
    - cron: '12 * * * *'    # mỗi giờ: thêm sweep – đóng issue khi xanh lại; lượt 00:12 UTC (sau khi hạn mức D1 đặt lại 00:00): chạy lại lượt hoãn + bản tin ngày
  workflow_dispatch:
    inputs:
      daily: { description: 'Chạy luôn phần hoãn hạn mức + bản tin ngày', type: boolean, default: false }
permissions: { contents: read, actions: write, issues: write, pull-requests: read, checks: read }   # pull-requests/checks: check đỏ chung trên PR mở (scripts/ci/pr-common-red.mjs)
concurrency: { group: ci-triage, cancel-in-progress: false }   # 1 lượt chạy + 1 chờ; lượt chờ bị thay cũng không mất gì (cửa sổ quét chồng lấn)
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts\ninfra\n.github/workflows\nweb/free-tier-state.json", sparse-checkout-cone-mode: false }  # cron-watch: đọc cron workflow + jobs.json paused + free-tier paused
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Quét lượt đỏ mới (scan)
        run: node scripts/ci/triage.mjs scan
        env: { GITHUB_TOKEN: '${{ github.token }}', TRIAGE_DELAY: '300' }
      - name: Đóng issue đã xanh + hoãn hạn mức + bản tin ngày (sweep)
        if: github.event.schedule == '12 * * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/ci/triage.mjs sweep
        env: { GITHUB_TOKEN: '${{ github.token }}', LEXKITE_DRIVE_CLI_KEY: '${{ secrets.LEXKITE_DRIVE_CLI_KEY }}', TRIAGE_FORCE_DAILY: "${{ github.event.inputs.daily == 'true' && '1' || '' }}" }
