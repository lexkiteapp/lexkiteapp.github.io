# 🎞 Ama/Carlos sinh động: ảnh + video trước/sau mọi màn có nhân vật, 390 + desktop × sáng + tối (scripts/test/chars-lively-shots.mjs). Artifact chars-lively, 14 ngày.
name: chars-lively
on:
  pull_request:
    paths: ['web/js/teacher-*.js', 'web/js/call/**', 'web/js/lesson/**', 'web/js/st/v2/today*', 'web/index.html', 'scripts/build-landing.mjs', 'scripts/test/chars-lively*', '.github/workflows/chars-lively.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: 'chars-lively-${{ github.ref }}', cancel-in-progress: true }   # ci-policy: lượt cũ cùng nhánh bị huỷ
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cài playwright
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium >/dev/null
      - name: Ảnh TRƯỚC (nhánh gốc)
        env: { BASE: "${{ github.event.pull_request.base.sha || 'origin/main' }}" }
        run: |
          git worktree add -q _before "$BASE"
          node scripts/test/chars-lively-shots.mjs _before/web out/before --report || true
      - name: Ảnh SAU
        run: node scripts/test/chars-lively-shots.mjs web out/after
      - name: Tờ trước/sau
        run: node scripts/test/chars-lively-shots.mjs --sheet out/before out/after out/sheets
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: chars-lively, path: out, retention-days: 14 }
