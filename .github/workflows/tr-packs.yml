# ci-policy: queue – chung hàng đợi google-translate với word-packs/sent-packs: huỷ giữa chừng làm lượt dịch dở, không gọi Google Translate song song
name: Kho dịch sẵn câu ví dụ + định nghĩa (14 ngôn ngữ)
# Sinh web/packs/tr/<lang>/<mảnh>.json (scripts/gen-tr-packs.mjs) – bảng bôi đen "Dịch" hiện tức thì cho câu có sẵn, không gọi mạng (web/js/tr-fast.js).
# Chạy lại = chỉ dịch câu mới/đổi. main: đẩy main sau mỗi ngôn ngữ (push-main.sh). Dispatch trên nhánh khác: commit cục bộ, KHÔNG đẩy vào nhánh (đầu PR là commit bot thì CI/required-gate treo) → artifact bot-output-tr-packs + comment PR; lấy về: bash scripts/ci/bot-output.sh tr-packs <nhánh>. Cổng chất lượng (độ phủ ≥ 97 %, chữ viết): scripts/test/tr-packs.mjs chạy trong npm test.
on:
  schedule:
    - cron: '20 22 * * *'   # 05:20 giờ VN, sau sent-packs (câu ví dụ lấy lại từ kho đó)
  workflow_dispatch:
    inputs:
      langs: { description: 'mã ngôn ngữ cách nhau dấu cách (trống = tất cả)', required: false, default: '' }
  push:
    branches: [main]
    paths: [scripts/gen-tr-packs.mjs, web/js/tr-fast.js, .github/workflows/tr-packs.yml]
permissions:
  contents: read
  pull-requests: write   # comment kết quả lên PR của nhánh (dispatch trên nhánh)
concurrency: { group: google-translate, cancel-in-progress: false }  # chung hàng đợi với word-packs/sent-packs: không gọi Google Translate song song
jobs:
  tr:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ssh-key: "${{ github.ref == 'refs/heads/main' && secrets.BOT_DEPLOY_KEY || '' }}" }   # chỉ main cầm khoá deploy (ruleset) – docs/CI-RUNNERS.md › required-gate
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dịch từng ngôn ngữ, lưu sau mỗi ngôn ngữ
        env: { LANGS_IN: '${{ github.event.inputs.langs }}' }
        run: |
          git config user.name "lexkite-bot"
          git config user.email "lexkite-bot@users.noreply.github.com"
          L="$LANGS_IN"; [ -z "$L" ] && L="vi $(grep -v '^#' scripts/i18n-langs.txt | tr '\n' ' ')"
          for l in $L; do
            node scripts/gen-tr-packs.mjs "$l" || echo "lỗi $l"
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              bash scripts/ci/push-main.sh "Kho dịch sẵn câu: $l" web/packs/tr || exit 1
            else   # nhánh khác: giữ cục bộ → artifact ở bước cuối
              git add -A web/packs/tr; git diff --cached --quiet || git commit -q -m "Kho dịch sẵn câu: $l [CF-Pages-Skip] [skip ci]"
            fi
          done
      - name: Cổng chất lượng + độ phủ
        run: node scripts/test/tr-packs.mjs
      - name: Nhánh – artifact + summary + comment PR (không đẩy vào nhánh)
        if: always() && github.ref != 'refs/heads/main'
        uses: ./.github/actions/bot-output
        with: { name: tr-packs, paths: web/packs/tr, base: '${{ github.sha }}', comment: 'true' }
