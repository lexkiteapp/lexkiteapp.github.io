name: Kho dịch sẵn câu ví dụ + định nghĩa (14 ngôn ngữ)
# Sinh web/packs/tr/<lang>/<mảnh>.json (scripts/gen-tr-packs.mjs) – bảng bôi đen "Dịch" hiện tức thì cho câu có sẵn, không gọi mạng (web/js/tr-fast.js).
# Chạy lại = chỉ dịch câu mới/đổi. Đẩy kết quả về đúng nhánh đã chạy (PR đổi bộ sinh → commit vào nhánh PR). Cổng chất lượng: scripts/test/tr-packs.mjs.
on:
  schedule:
    - cron: '20 22 * * *'   # 05:20 giờ VN, sau sent-packs (câu ví dụ lấy lại từ kho đó)
  workflow_dispatch:
    inputs:
      langs: { description: 'mã ngôn ngữ cách nhau dấu cách (trống = tất cả)', required: false, default: '' }
  push:
    branches: [main]
    paths: [scripts/gen-tr-packs.mjs, web/js/tr-fast.js, .github/workflows/tr-packs.yml]
  pull_request:
    paths: [scripts/gen-tr-packs.mjs, .github/workflows/tr-packs.yml]
permissions:
  contents: write
concurrency: { group: google-translate, cancel-in-progress: false }  # chung hàng đợi với word-packs/sent-packs: không gọi Google Translate song song
jobs:
  tr:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.head_ref || github.ref_name }}', ssh-key: '${{ secrets.BOT_DEPLOY_KEY }}' }   # đẩy main qua SSH khoá deploy (ruleset) – docs/CI-RUNNERS.md › required-gate
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dịch từng ngôn ngữ, lưu sau mỗi ngôn ngữ
        env: { LANGS_IN: '${{ github.event.inputs.langs }}', BR: '${{ github.head_ref || github.ref_name }}' }
        run: |
          git config user.name "lexkite-bot"
          git config user.email "lexkite-bot@users.noreply.github.com"
          L="$LANGS_IN"; [ -z "$L" ] && L="vi $(grep -v '^#' scripts/i18n-langs.txt | tr '\n' ' ')"
          for l in $L; do
            node scripts/gen-tr-packs.mjs "$l" || echo "lỗi $l"
            git add -A web/packs/tr
            git diff --cached --quiet && continue
            git commit -q -m "Kho dịch sẵn câu: $l [CF-Pages-Skip] [skip ci]"
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin "$BR" && git push -q origin "HEAD:$BR" && break; sleep $((i * 7)); done
          done
      - name: Cổng chất lượng + độ phủ
        run: node scripts/test/tr-packs.mjs
