# Nhập clip mới vào kho dựng video – TOÀN BỘ phần nặng trên GitHub Actions (máy anh chủ chỉ tải kết quả + upload):
#   tải clip Kling theo kế hoạch → library.mjs ingest --plan (cổng kỹ thuật + giải phẫu MediaPipe + AI thị giác nếu có khoá)
#   → library.mjs stack (phông xanh tự dùng chroma_key.py, còn lại rembg) → artifact "ingest-results":
#      content/video/library.json · brand/library/manifest.json · brand/library/clips/{src/,}<id>.mp4 · _review/*.jpg
#   Phiên chính: tải artifact, chép đè vào repo, chạy `node scripts/video/library.mjs sync` (chỉ upload) rồi commit manifest.
# plan = JSON {"date":"YYYY-MM-DD","source":"…","items":[{"id":"carlos_g_talk","url":"https://…klingai.com/…mp4","qa":92,"roles":["listener"]?,"note":"…"?}]}
name: library-ingest
on:
  workflow_dispatch:
    inputs:
      plan: { description: 'JSON kế hoạch nhập (xem đầu file)', required: true }
permissions:
  contents: read
concurrency: { group: library-ingest, cancel-in-progress: false }
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      U2NET_HOME: /home/runner/.u2net
      LEXKITE_MP_MODELS: /home/runner/.mediapipe
      LEXKITE_PY: /home/runner/venv/bin/python
      LEXKITE_REMBG_PY: /home/runner/venv/bin/python
      MPLCONFIGDIR: /tmp/mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libgles2 >/dev/null
      - name: Cache mô hình (rembg isnet-anime, MediaPipe)
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.u2net
            /home/runner/.mediapipe
          key: library-models-v1
      - name: Python (numpy, pillow, scipy, rembg, mediapipe)
        run: |
          python -m venv /home/runner/venv
          /home/runner/venv/bin/pip install -q numpy pillow scipy "rembg[cpu]" mediapipe
          mkdir -p "$LEXKITE_MP_MODELS"; cd "$LEXKITE_MP_MODELS"
          for u in pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task face_landmarker/face_landmarker/float16/latest/face_landmarker.task; do
            [ -f "$(basename $u)" ] || curl -sfLO "https://storage.googleapis.com/mediapipe-models/$u"
          done
      - name: Tải clip theo kế hoạch → kế hoạch nhập
        env: { PLAN: '${{ github.event.inputs.plan }}' }
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          P = json.loads(os.environ['PLAN']); items = P['items']
          assert 0 < len(items) <= 60, 'cần 1–60 clip'
          d = 'brand/characters/_candidates/ingest'; os.makedirs(d, exist_ok=True); out = []
          for it in items:
              assert re.fullmatch(r'[a-z0-9_]{3,40}', it['id']), it['id']
              assert re.match(r'^https://[a-z0-9.-]*(klingai\.com|kling\.ai|lexkite\.com)/', it['url']), it['id']
              subprocess.run(['curl', '-fsSL', '--retry', '3', '-o', f"{d}/{it['id']}.mp4", it['url']], check=True)
              x = {'src': f"ingest/{it['id']}.mp4", 'as': f"clips/{it['id']}.mp4", 'qa': it.get('qa')}
              for k in ('roles', 'note', 'waiver', 'trimmed'):
                  if it.get(k) is not None: x[k] = it[k]
              out.append(x)
          json.dump({'defaults': {'date': P.get('date'), 'clipSource': P.get('source', 'Kling 2.5 Turbo 1080p 5 s phông xanh')}, 'items': out}, open('ingest-plan.json', 'w'), ensure_ascii=False, indent=1)
          open(os.environ['GITHUB_ENV'], 'a').write('IDS=' + ','.join(i['id'] for i in items) + '\n')
          PY
      - name: Nhập kho (cổng kiểm)
        env: { CF_AI_TOKEN: '${{ secrets.CF_AI_TOKEN }}', CF_ACCOUNT_ID: '${{ secrets.CF_ACCOUNT_ID }}' }
        run: node scripts/video/library.mjs ingest --plan ingest-plan.json --on-fail reject | tee ingest.log
      - name: Dựng stacked (phông xanh → chroma_key)
        run: |
          for id in $(echo "$IDS" | tr ',' ' '); do node scripts/video/library.mjs stack "clips/$id.mp4" | tee -a ingest.log || true; done
      - name: Gom kết quả
        run: |
          mkdir -p res/brand/library/clips/src res/content/video res/review
          cp content/video/library.json res/content/video/; cp brand/library/manifest.json res/ 2>/dev/null || true
          for id in $(echo "$IDS" | tr ',' ' '); do
            cp "brand/library/clips/src/$id.mp4" res/brand/library/clips/src/ 2>/dev/null || true
            cp "brand/library/clips/$id.mp4" res/brand/library/clips/ 2>/dev/null || true
          done
          cp brand/library/_review/*.jpg res/review/ 2>/dev/null || true; cp ingest.log res/
      - uses: actions/upload-artifact@v4
        with: { name: ingest-results, path: res/, retention-days: 14 }
