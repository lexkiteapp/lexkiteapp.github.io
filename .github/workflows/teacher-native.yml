# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🧍 Cổng teacher-native (runtime): giáo viên trên màn thật phải đứng trên bệ Chars.slot – không vệt cắt, không đè chữ, không bị xén. Báo cáo + ảnh ở artifact 7 ngày.
name: teacher-native
on:
  pull_request:
    paths: ['web/js/**', 'web/app/index.html', 'scripts/test/teacher-native*']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: 'teacher-native-${{ github.ref }}', cancel-in-progress: true }   # ci-policy: lượt cũ cùng nhánh bị huỷ
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (hoặc PR có nhãn `ready`) – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    # lượt 1 của PR: npm test chưa thể xanh → gate bỏ qua KHÔNG tốn máy (skipped); heavy-rerun chạy lại (run_attempt ≥ 2) khi npm test xanh; nhãn ready = chạy ngay
    if: ${{ github.event_name != 'pull_request' || github.run_attempt > 1 || contains(github.event.pull_request.labels.*.name, 'ready') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read, pull-requests: read }
    outputs: { go: '${{ steps.g.outputs.go == ''true'' && steps.s.outputs.ok != ''false'' && ''true'' || ''false'' }}' }   # + phạm vi PR (scripts/ci/pr-scope.mjs, cần: ui)
    steps:
      # phạm vi PR (docs/CI-RUNNERS.md › Phạm vi PR): PR chỉ đổi nội dung/chữ dịch/backend → job nặng skipped (required-gate tính đạt); lỗi API → vẫn chạy
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/pr-scope.mjs
            .github/workflows/teacher-native.yml
          sparse-checkout-cone-mode: false
      - id: s
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', PR: '${{ github.event.pull_request.number }}' }
        run: node scripts/ci/pr-scope.mjs --repo "$REPO" --pr "$PR" --workflow .github/workflows/teacher-native.yml --need ui
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha (hoặc nhãn ready) → go=$go"
  shots:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cài playwright
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
      - name: Chạy cổng
        run: node scripts/test/teacher-native-shots.mjs web out/teacher-native
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: teacher-native, path: out/teacher-native, retention-days: 7 }
