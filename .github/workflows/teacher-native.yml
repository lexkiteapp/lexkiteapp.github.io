# 🧍 Cổng teacher-native (runtime): giáo viên trên màn thật đi qua Chars.slot và tiếp đất đúng (fade: mờ vào nền + bóng; card: sau mép thẻ đục) – không bệ lơ lửng, không vệt cắt, không đè chữ, không bị xén. Báo cáo + ảnh cận ở artifact 7 ngày.
name: teacher-native
on:
  pull_request:
    paths: ['web/js/**', 'web/app/index.html', 'scripts/test/teacher-native*']
  workflow_dispatch:   # before=<ref>: chụp thêm ảnh TRƯỚC (web/ của ref đó, cùng script mới, không chặn) để đính PR trước/sau – chỉ khi gọi tay, PR thường không tốn thêm
    inputs:
      before: { description: 'ref để chụp ảnh trước (vd. main), trống = bỏ qua', required: false, default: '' }
permissions:
  contents: read
concurrency: { group: 'teacher-native-${{ github.ref }}', cancel-in-progress: true }   # ci-policy: lượt cũ cùng nhánh bị huỷ
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cài playwright
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium >/dev/null
      - if: inputs.before != ''
        uses: actions/checkout@v4
        with: { ref: '${{ inputs.before }}', path: before-src, sparse-checkout: web }
      - name: Ảnh trước (không chặn)
        if: inputs.before != ''
        continue-on-error: true
        run: node scripts/test/teacher-native-shots.mjs before-src/web out/teacher-native/before
      - name: Chạy cổng
        run: node scripts/test/teacher-native-shots.mjs web out/teacher-native
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: teacher-native, path: out/teacher-native, retention-days: 7 }
