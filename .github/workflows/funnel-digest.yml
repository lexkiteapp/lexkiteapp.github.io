# Tóm tắt phễu tăng trưởng 1 tin/ngày (08:05 giờ VN – ngoài giờ yên lặng) → comment issue "Phễu tăng trưởng – hằng ngày" (nhãn growth-funnel). scripts/growth/funnel-digest.mjs, test: scripts/test/funnel-digest.mjs
name: Funnel digest
on:
  schedule:
    - cron: '5 1 * * *'
  workflow_dispatch:
    inputs:
      dry: { description: 'Chỉ in, không đăng', type: boolean, default: false }
permissions: { contents: read, issues: write }
concurrency: { group: funnel-digest, cancel-in-progress: false }
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: 'scripts/growth scripts/ci scripts/test' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/test/funnel-digest.mjs
      - name: Lấy số + đăng
        env:
          STUDIO_CALLBACK_SECRET: ${{ secrets.STUDIO_CALLBACK_SECRET }}
          LEXKITE_CI_HEADER: ${{ secrets.LEXKITE_CI_HEADER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/growth/funnel-digest.mjs ${{ inputs.dry && '--dry' || '' }}
