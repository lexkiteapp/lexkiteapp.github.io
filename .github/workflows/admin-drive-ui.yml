# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# Quản trị › Kho Drive › Kho video (#drive/stock): ảnh TRƯỚC/SAU trên dữ liệu MẪU (sáng/tối × 1280/390 px, kèm hộp Dọn kho), chặn lỗi JS, mạng ra ngoài, tràn ngang, đè, cắt chữ, nút < 44 px, axe.
# Ảnh: artifact admin-drive-shots (compare-*.png = TRƯỚC | SAU). docs/ASSET-LIBRARY.md §8.6.5
name: Kho Drive quản trị – giao diện
on:
  pull_request:
    paths: ['web/js/admin-drive.js', 'web/css/admin.css', 'scripts/test/admin-drive-shots.mjs', '.github/workflows/admin-drive-ui.yml']
  push:
    branches: [main]
    paths: ['web/js/admin-drive.js', 'web/css/admin.css', 'scripts/test/admin-drive-shots.mjs', '.github/workflows/admin-drive-ui.yml']
  workflow_dispatch:
    inputs:
      before: { description: 'commit/nhánh để chụp ảnh TRƯỚC (mặc định: điểm rẽ nhánh từ main, hoặc commit trước lần đẩy)', required: false, default: '' }
permissions:
  contents: read
  actions: write   # fast-lane: huỷ lượt nặng khi npm test cùng sha đã đỏ
  checks: read
concurrency:   # ci-policy 2/11: push/lịch trùng gộp; chạy tay (mỗi lượt khác input) không bao giờ bị huỷ
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # luật 11: trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha (npm-test.yml job `heavy` chạy lại ngay khi xanh); lỗi API → mở cổng
  gate:
    # luật 18 (CI làn nhanh, 16/11): PR chỉ chờ làn nhanh – việc nặng bỏ qua trên PR (skipped, không tốn máy), chạy SAU gộp trên push main; nhãn ready-heavy/ready = chạy nặng ngay trên PR
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-heavy') || contains(github.event.pull_request.labels.*.name, 'ready') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}', READY: '${{ contains(github.event.pull_request.labels.*.name, ''ready'') }}', FIX: '${{ contains(github.event.pull_request.labels.*.name, ''main-red-fix'') }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ] && [ "$READY" != true ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          # máy gác 3/4 (23/11): CÙNG workflow đang ĐỎ trên main → dừng sớm (gate đỏ, 0 job nặng); main-red-retry.mjs chạy lại 1 lần khi main xanh. PR nhãn main-red-fix không bị chặn.
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}"); red=
          if [ "$go" = true ] && [ "$EV" = pull_request ] && [ "$FIX" != true ]; then
            m=$(gh api "repos/$REPO/actions/workflows/$wf/runs?branch=main&event=push&status=completed&per_page=5" --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0].conclusion' 2>/dev/null) || m=
            if [ "$m" = failure ]; then go=false; red=1; echo "::error title=main đỏ – chờ::$wf đang đỏ trên main – dừng sớm, tự chạy lại 1 lần khi main xanh"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha → go=$go"
          [ -z "$red" ] || exit 1
  ui:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ vars.PW_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/fast-lane   # làn nhanh: npm test đỏ → huỷ lượt nặng
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: ./.github/actions/playwright-cache
        with: { browsers: '--with-deps chromium' }
      - name: Playwright
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          bash scripts/ci/pw-install.sh --with-deps chromium
      - name: Ảnh TRƯỚC
        env: { BEFORE: '${{ inputs.before }}', EV_BEFORE: '${{ github.event.before }}', BASE: '${{ github.event.pull_request.base.sha }}' }
        run: |
          B="$BEFORE"; [ -z "$B" ] && B="$BASE"; [ -z "$B" ] && B="$EV_BEFORE"; case "$B" in ''|0000000000000000000000000000000000000000) B=HEAD~1;; esac
          echo "before = $B"; mkdir -p /tmp/before && git archive "$B" web | tar -x -C /tmp/before
          node scripts/test/admin-drive-shots.mjs out/admin-drive before /tmp/before/web
      - name: Ảnh SAU (chặn lỗi)
        if: ${{ !cancelled() }}
        run: node scripts/test/admin-drive-shots.mjs out/admin-drive after web
      - name: Ghép TRƯỚC | SAU
        if: ${{ !cancelled() }}
        run: node scripts/test/admin-drive-shots.mjs --compare out/admin-drive
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: admin-drive-shots, path: out/admin-drive, retention-days: 14 }
