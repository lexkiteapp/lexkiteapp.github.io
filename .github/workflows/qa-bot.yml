# ci-policy: heavy-gate – việc nặng trên PR chờ npm test xanh (job `gate`, luật 11)
# 🤖 QA bot (scripts/test/qa-bot.mjs · docs/QA-BOT.md): hành trình học thật (sandbox) + đầu dò lỗi giao diện ẩn 390/768/1440 × sáng/tối
# + hiệu năng (FPS/INP/long task/CLS) + dung lượng sau N bài. Chỉ chạy trên CI (không bao giờ trên máy anh chủ).
# - PR đụng app/web: chạy trên dist của PR (hermetic, 0 lượt chạm prod) + trước/sau: chụp cùng trạng thái trên nhánh gốc vs PR → summary + artifact.
# - Sau mỗi Pages deploy thành công: chạy trên lexkite.com live. Sau mỗi lượt Preview site: chạy trên site preview. Tay: base_url bất kỳ.
# - Đỏ → ci-triage mở issue ci-failure như mọi workflow.
name: QA bot
on:
  pull_request:
    paths: ['web/**', 'extension/app/**', 'scripts/build-web.sh', 'scripts/test/qa-bot.mjs', 'scripts/test/exit-sweep.mjs', 'scripts/test/nav-sweep.mjs', 'scripts/test/nav-sweep.known.json', 'scripts/test/lib/learn-samples.mjs', 'scripts/test/qa-bot/**', 'scripts/test/qa-bot-diff.mjs', 'scripts/test/qa-bot-baseline.json', '.github/workflows/qa-bot.yml']
  workflow_run:
    workflows: ['Pages deploy', 'Preview site']
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url: { description: 'URL gốc cần soát (trống = build dist của nhánh)', required: false, default: '', type: string }
      only: { description: 'journeys,ui,perf,storage', required: false, default: 'journeys,ui,perf,storage', type: string }
  workflow_call:
    inputs:
      base_url: { description: 'URL gốc cần soát', required: false, default: 'https://lexkite.com', type: string }
permissions:
  contents: read
concurrency:
  group: qa-bot-${{ github.event_name }}-${{ github.event.workflow_run.name || '' }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # luật 11 (làn nhanh trước làn nặng, scripts/test/ci-policy.mjs): trên PR việc nặng chỉ chạy khi `npm test` đã XANH cùng sha – đỏ/chưa xong thì mọi job dưới là skipped
  # (không chiếm runner); npm-test.yml job `heavy` chạy lại lượt này ngay khi npm test xanh (scripts/ci/heavy-rerun.mjs). Lỗi API → mở cổng (không mất kiểm).
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'   # như job bot: workflow_run không thành công → skipped lan xuống
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, checks: read }
    outputs: { go: '${{ steps.g.outputs.go }}' }
    steps:
      - id: g
        env: { GH_TOKEN: '${{ github.token }}', EV: '${{ github.event_name }}', SHA: '${{ github.event.pull_request.head.sha }}', REPO: '${{ github.repository }}' }
        run: |
          go=true
          if [ "$EV" = pull_request ]; then
            n=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=npm%20test&per_page=20" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || n=1
            [ "${n:-1}" -ge 1 ] || go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "npm test xanh cùng sha → go=$go"
  bot:
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && needs.gate.outputs.go == 'true' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ inputs.base_url || (github.event.workflow_run.name == 'Preview site' && 'https://preview.lexkite-preview.pages.dev') || (github.event.workflow_run.name == 'Pages deploy' && 'https://lexkite.com') || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Cài + build dist (khi không có base_url)
        run: |
          npm ci --no-audit --no-fund
          if [ -z "$BASE_URL" ]; then bash scripts/build-web.sh >/dev/null; fi
      - name: Cài Playwright
        timeout-minutes: 14
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.50.1
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: fonts-noto-color-emoji fonts-noto-core }
      - name: Chặn lexkite.com khi chạy dist cục bộ (0 lượt chạm prod)
        if: env.BASE_URL == ''
        run: echo "127.0.0.1 lexkite.com www.lexkite.com audio.lexkite.com media.lexkite.com" | sudo tee -a /etc/hosts >/dev/null
      - name: Chạy bot
        env:
          ONLY: ${{ inputs.only || 'journeys,ui,perf,storage' }}
        run: |
          set +e
          if [ -n "$BASE_URL" ]; then T="--base $BASE_URL"; else T="--root dist"; fi
          node scripts/test/qa-bot.mjs $T --out out/qa-bot --only "$ONLY" --write-baseline out/qa-bot/baseline-seen.json
          echo "rc=$?" > out/qa-bot/rc
          cat out/qa-bot/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Lối thoát mọi màn học (exit-sweep – docs/specs/exit-button.md)
        run: |
          set +e
          if [ -n "$BASE_URL" ]; then T="--base $BASE_URL"; else T="--root dist"; fi
          node scripts/test/exit-sweep.mjs $T --out out/qa-bot/exit-sweep
          echo "rc=$?" > out/qa-bot/exit-sweep/rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa-bot, path: out/qa-bot, retention-days: 7, if-no-files-found: ignore }
      - name: Kết luận
        run: grep -q 'rc=0' out/qa-bot/rc && grep -q 'rc=0' out/qa-bot/exit-sweep/rc

  # 🧭 nav-sweep (docs/specs/learn-flow-nav.md): mỗi màn học đi hết tới màn kết chỉ bằng bàn phím – song song với bot, chỉ trên dist của PR/nhánh
  nav:
    if: ${{ (github.event_name != 'workflow_run') && needs.gate.outputs.go == 'true' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Cài + build dist
        run: |
          npm ci --no-audit --no-fund
          bash scripts/build-web.sh >/dev/null
          npm i --no-save --no-audit --no-fund playwright@1.50.1
          bash scripts/ci/pw-install.sh --with-deps chromium
          echo "127.0.0.1 lexkite.com www.lexkite.com audio.lexkite.com media.lexkite.com" | sudo tee -a /etc/hosts >/dev/null
      - name: nav-sweep
        run: node scripts/test/nav-sweep.mjs --root dist --out out/nav-sweep --write-known
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nav-sweep, path: out/nav-sweep, retention-days: 7, if-no-files-found: ignore }

  before-after:
    # !cancelled(): vẫn so khi bot đỏ (có artifact), KHÔNG chạy khi lượt bị huỷ (bot huỷ = không có artifact qa-bot → đỏ giả; ci-policy luật 4)
    if: ${{ (!cancelled() && github.event_name == 'pull_request' && needs.bot.result != 'skipped') && needs.gate.outputs.go == 'true' }}
    needs: [bot, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.base.sha }}", path: base }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Build dist nhánh gốc
        working-directory: base
        run: |
          npm ci --no-audit --no-fund
          bash scripts/build-web.sh >/dev/null
      - name: Cài Playwright
        timeout-minutes: 14
        run: |
          npm ci --no-audit --no-fund
          npm i --no-save --no-audit --no-fund playwright@1.50.1
          bash scripts/ci/pw-install.sh --with-deps chromium
      - uses: ./.github/actions/apt
        with: { packages: fonts-noto-color-emoji fonts-noto-core }
      - name: Cài Playwright (tiếp)
        timeout-minutes: 14
        run: |
          echo "127.0.0.1 lexkite.com www.lexkite.com audio.lexkite.com media.lexkite.com" | sudo tee -a /etc/hosts >/dev/null
      - name: Chụp + quét nhánh gốc (cùng bot, cùng đầu dò của PR)
        run: node scripts/test/qa-bot.mjs --root base/dist --out out/base --only ui || true
      - uses: actions/download-artifact@v4
        with: { name: qa-bot, path: out/head }
      - name: So trước / sau
        run: |
          node scripts/test/qa-bot-diff.mjs out/base out/head out/qa-bot-diff
          cat out/qa-bot-diff/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa-bot-diff, path: out/qa-bot-diff, retention-days: 7, if-no-files-found: ignore }
