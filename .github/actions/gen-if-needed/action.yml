name: gen-if-needed
description: Workflow serve web/ mà không `npm ci` (postinstall đã sinh lại) – nếu PR đổi NGUỒN bản sinh (i18n/ui, bộ đóng gói, với ext=true thêm web/ + extension) thì dựng lại gói dịch (+ extension/app); không thì bỏ qua. Gọi ngay sau checkout. Luật ci-policy 17.
inputs:
  ext:
    description: 'true = cũng dựng lại extension/app (workflow đọc add-on)'
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GEN_EXT: ${{ inputs.ext }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/ci/regen-generated.mjs" --needed $([ "$GEN_EXT" = true ] && echo --ext)
