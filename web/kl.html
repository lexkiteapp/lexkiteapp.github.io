<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Lexkite voice</title>
<!-- Kokoro trên máy cho add-on (docs/specs/kokoro-on-device.md): CWS cấm mã tải từ xa trong gói add-on, nên trang add-on
     nhúng khung ẩn này (?o=<origin trang mẹ>) → chạy /js/klocal-worker.js trên lexkite.com và chuyển tiếp ĐÚNG giao thức worker
     ({type:'load'|'gen'|'cancel'} ↔ {type:'loaded'|'progress'|'audio'|'err'|'fail'|'note'}) qua postMessage, chỉ với origin trong danh sách cho phép. -->
</head>
<body>
<script>
(function () {
  var OK = /^(https:\/\/((www\.)?lexkite\.com|([a-z0-9-]+\.)?lexkite\.pages\.dev)|https?:\/\/localhost(:\d+)?|chrome-extension:\/\/[a-p]{32}|moz-extension:\/\/[0-9a-f-]{36})$/;
  var o = new URLSearchParams(location.search).get('o') || '';
  if (!OK.test(o) || window.parent === window || !window.Worker) return; // không được nhúng / origin lạ → không làm gì
  var w;
  try { w = new Worker('/js/klocal-worker.js', { type: 'module' }); } catch (e) { window.parent.postMessage({ lkk: 1, type: 'fail', error: 'worker' }, o); return; }
  w.onmessage = function (e) { var d = e.data || {}; d.lkk = 1; window.parent.postMessage(d, o, d.pcm ? [d.pcm] : []); };
  w.onerror = function (e) { window.parent.postMessage({ lkk: 1, type: 'fail', error: 'crash ' + (e && e.message) }, o); };
  window.addEventListener('message', function (e) {
    var d = e.data; if (e.source !== window.parent || e.origin !== o || !d || !d.lkk) return;
    if (d.type === 'load' || d.type === 'gen' || d.type === 'cancel') { delete d.lkk; w.postMessage(d); }
  });
  window.parent.postMessage({ lkk: 1, type: 'frame' }, o);
})();
</script>
</body>
</html>
