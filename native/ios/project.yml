# XcodeGen spec for the native SwiftUI app (no hand-edited .pbxproj). CI: .github/workflows/native-ios.yml runs `xcodegen generate`.
# Bundle ID and team stay identical to the live Capacitor app (mobile/) so this build replaces it in place once at parity.
name: Lexkite
options:
  bundleIdPrefix: com.lexkite
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
packages:
  LexkiteKit: { path: LexkiteKit }
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lexkite:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: LexkiteKit
        product: LexkiteKit
    info:
      path: App/Info.plist   # generated by XcodeGen from these properties (keep edits here)
      properties:
        CFBundleDisplayName: Lexkite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes: [{ CFBundleURLName: com.lexkite.app, CFBundleURLSchemes: [lexkite] }]   # same scheme as the live app
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexkite.app
        TARGETED_DEVICE_FAMILY: "1,2"   # live app ships iPhone + iPad – no cuts
schemes:
  Lexkite:
    build: { targets: { Lexkite: all } }
