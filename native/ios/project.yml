# XcodeGen spec for the native SwiftUI app (no hand-edited .pbxproj). CI: .github/workflows/native-ios.yml runs `xcodegen generate`.
# Bundle ID and team stay identical to the live Capacitor app (mobile/) so this build replaces it in place once at parity.
# Firebase (Auth, Crashlytics, Remote Config) + GoogleSignIn are linked HERE only; LexkiteKit sees them through LKAuth / LKCrash / LKRemoteConfig.
name: Lexkite
options:
  bundleIdPrefix: com.lexkite
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
packages:
  LexkiteKit: { path: LexkiteKit }
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym   # Crashlytics needs dSYMs
targets:
  Lexkite:
    type: application
    platform: iOS
    sources:
      - App
      # SAME Firebase project/config as the live app – referenced, never copied (C01)
      - path: ../../mobile/ios/App/App/GoogleService-Info.plist
        buildPhase: resources
      # C03 export script generated from web (scripts/native/gen.mjs); bundled as a resource, run once in a hidden WKWebView
      - path: ../shared/gen/migration-export.js
        buildPhase: resources
        optional: true
    dependencies:
      - package: LexkiteKit
        product: LexkiteKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: App/Lexkite.entitlements   # generated by XcodeGen from these properties (same capabilities as the live App ID)
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.com.lexkite.app]
        com.apple.developer.associated-domains: ["applinks:lexkite.com"]   # universal links https://lexkite.com/app/#/… (C08)
    info:
      path: App/Info.plist   # generated by XcodeGen from these properties (keep edits here)
      properties:
        CFBundleDisplayName: Lexkite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # same scheme as the live app; the Google Sign-In callback scheme (REVERSED_CLIENT_ID) is appended at build time from the plist
        CFBundleURLTypes: [{ CFBundleURLName: com.lexkite.app, CFBundleURLSchemes: [lexkite] }]
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # 15 UI languages (C10) – lets iOS show the per-app language picker in Settings
        CFBundleLocalizations: [vi, en, es, pt, fr, de, id, th, zh-Hans, ja, ko, hi, ar, ru, tr]
        CFBundleAllowMixedLocalizations: true
        # privacy by default: crash reports carry no IDFA/analytics; Crashlytics only
        FirebaseAutomaticScreenReportingEnabled: false
        GOOGLE_ANALYTICS_COLLECTION_ENABLED: false
        # signed server content (§4): public key injected from web/js/ota-key.js at build time; CDN base set when the endpoint ships
        LKContentKeySPKI: ""
        LKContentBaseURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexkite.app
        TARGETED_DEVICE_FAMILY: "1,2"   # live app ships iPhone + iPad – no cuts
        OTHER_LDFLAGS: [$(inherited), -ObjC]   # Firebase static frameworks
    postBuildScripts:
      - name: "Inject Google Sign-In URL scheme + content key (one source: GoogleService-Info.plist, web/js/ota-key.js)"
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          set -e
          PL="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          GS="${SRCROOT}/../../mobile/ios/App/App/GoogleService-Info.plist"
          PB=/usr/libexec/PlistBuddy
          if [ -f "$GS" ]; then
            R=$($PB -c "Print :REVERSED_CLIENT_ID" "$GS" 2>/dev/null || true)
            if [ -n "$R" ] && ! $PB -c "Print :CFBundleURLTypes" "$PL" | grep -q "$R"; then
              N=$($PB -c "Print :CFBundleURLTypes" "$PL" | grep -c "CFBundleURLName" || true)
              $PB -c "Add :CFBundleURLTypes:$N dict" -c "Add :CFBundleURLTypes:$N:CFBundleURLName string google" \
                  -c "Add :CFBundleURLTypes:$N:CFBundleURLSchemes array" -c "Add :CFBundleURLTypes:$N:CFBundleURLSchemes:0 string $R" "$PL"
            fi
          fi
          K=$(sed -n "s/.*LK_OTA_KEY = '\([^']*\)'.*/\1/p" "${SRCROOT}/../../web/js/ota-key.js" 2>/dev/null || true)
          $PB -c "Set :LKContentKeySPKI $K" "$PL" 2>/dev/null || $PB -c "Add :LKContentKeySPKI string $K" "$PL"
      - name: "Crashlytics dSYM upload (Release only)"
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
            if [ -x "$RUN" ]; then "$RUN"; else echo "warning: Crashlytics run script not found ($RUN)"; fi
          fi
schemes:
  Lexkite:
    build: { targets: { Lexkite: all } }
